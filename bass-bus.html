<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Bass Bus - Piano Arcade</title>

  <style>
  @font-face {
    font-family: "Bravura";
    src: url("https://cdn.jsdelivr.net/gh/steinbergmedia/bravura@master/redist/woff/Bravura.woff2") format("woff2");
    font-style: normal;
    font-weight: normal;
    font-display: swap;
  }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #appFrame {
      width: 100%;
      aspect-ratio: 390 / 670;
      position: relative;
      overflow: hidden;
      background: #202020;
    }

    #appStage {
      width: 390px;
      height: 670px;
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: top left;
      transform: scale(var(--app-scale, 1));
      overflow: hidden;
      background: linear-gradient(180deg, #2f2f2f, #191919);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: auto;
      color: white;
    }

    #appStage *:not(input):not(textarea) {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    button {
      font-family: Arial, sans-serif;
      touch-action: none;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input,
    select {
      font-size: 16px;
      padding: 8px;
      border-radius: 10px;
      border: 2px solid #111;
      box-sizing: border-box;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       PLAYER MENU
       ========================= */

    #menuScreen {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #2f2f2f, #191919);
      padding: 13px 16px 14px;
      overflow: visible;
      text-align: center;
      z-index: 20;
      touch-action: pan-y;
    }

    #menuScreen h1 {
      margin: 4px 0 9px;
      font-size: 28px;
    }

    #leaderboardBox {
      margin: 0 auto 9px;
      padding: 9px;
      background: rgba(255,255,255,0.1);
      border-radius: 14px;
      max-width: 350px;
    }

    #leaderboardBox h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    #leaderboardList {
      text-align: left;
      max-width: 230px;
      margin: 0 auto;
      font-size: 15px;
    }

    #playerPickerBox {
      margin: 0 auto 9px;
      padding: 9px;
      background: rgba(255,255,255,0.08);
      border-radius: 14px;
      max-width: 350px;
    }

    #playerSearchInput {
      width: 100%;
      margin-bottom: 8px;
    }

    #playerSelect {
      width: 100%;
      height: 120px;
      background: #f8fbff;
      color: #111827;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border: 2px solid #111;
      border-radius: 10px;
      text-align: left;
    }

    .playerOption {
      padding: 10px;
      border-bottom: 1px solid rgba(17,24,39,0.12);
      font-size: 16px;
      line-height: 1.2;
      background: #f8fbff;
      color: #111827;
    }

    .playerOption:last-child {
      border-bottom: 0;
    }

    .playerOption.selected {
      background: #ffe08a;
      font-weight: bold;
    }

    .playerOption.disabled {
      color: rgba(17,24,39,0.55);
      text-align: center;
      font-style: italic;
    }

    #selectedPlayerActions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 7px;
    }

    #selectedPlayerActions button,
    #addPlayerBtn,
    #startGameBtn,
    #exitPageBtn {
      min-height: 38px;
      border-radius: 12px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
    }

    #resetSelectedPlayerBtn {
      background: #fff3bf;
    }

    #removeSelectedPlayerBtn {
      background: #ffd6d6;
    }

    #addPlayerRow {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
      margin: 0 auto 8px;
      max-width: 350px;
    }

    #newPlayerName {
      width: 100%;
    }

    #selectedPlayerText {
      margin: 7px 0;
      font-size: 15px;
      opacity: 0.9;
    }

    #startGameBtn {
      background: #dff3ff;
      min-width: 150px;
    }

    #exitPageBtn {
      min-width: 110px;
    }

    /* =========================
       GAME / EMULATOR
       ========================= */

    #gameScreen {
      position: absolute;
      inset: 0;
      display: none;
      background: linear-gradient(180deg, #2f2f2f, #191919);
      z-index: 10;
      touch-action: auto;
    }

    #screen {
      position: absolute;
      left: 0;
      top: 0;
      width: 390px;
      height: 281.667px;
      overflow: hidden;
      background: #0b1420;
      border: 1px solid #2b2b2b;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.05),
        0 1px 3px rgba(0,0,0,0.45);
    }

    #gameCanvas {
      width: 390px;
      height: 281.667px;
      display: block;
      background: #f7fbff;
      image-rendering: auto;
    }

    #gameOverBox {
      display: none;
      position: absolute;
      left: 34px;
      right: 34px;
      top: 50%;
      transform: translateY(-50%);
      padding: 18px 12px;
      background: rgba(16, 24, 39, 0.93);
      border: 3px solid white;
      border-radius: 16px;
      color: white;
      text-align: center;
      z-index: 8;
    }

    #gameOverBox h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    #gameOverScore {
      margin: 0 0 10px;
      font-size: 15px;
    }

    #gameOverBox button {
      border: 2px solid #111;
      border-radius: 12px;
      background: white;
      color: #111827;
      padding: 8px 12px;
      margin: 3px;
      font-size: 12px;
      font-weight: bold;
    }

    #lcd {
      position: absolute;
      left: 0;
      top: 281.667px;
      width: 390px;
      height: 48px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02)),
        #11283d;
      border-top: 3px solid #0c0c0c;
      border-bottom: 3px solid #0c0c0c;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.05),
        inset 0 0 14px rgba(0,0,0,0.42);
      color: #ffd45d;
      font-family: "Courier New", monospace;
      text-shadow: 0 0 7px rgba(255,212,93,0.35);
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: 1fr 1fr;
      align-items: center;
      padding: 5px 16px;
      pointer-events: none;
    }

    #lcdMessage {
      grid-column: 1 / 3;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #lcdScore {
      font-size: 12px;
    }

    #lcdBest {
      font-size: 13px;
      text-align: right;
    }

    #controls {
      position: absolute;
      left: 0;
      top: 329.667px;
      width: 390px;
      height: 340.333px;
      background: #242424;
      touch-action: auto;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    #controls *,
    #screen,
    #gameCanvas {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* D-PAD */

    #dpad {
      position: absolute;
      left: 17px;
      top: 19px;
      width: 150px;
      height: 150px;
      touch-action: manipulation;
    }

    .dpadBtn {
      position: absolute;
      width: 50px;
      height: 50px;
      border: none;
      background: #111;
      color: rgba(255,255,255,0.86);
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 22px;
      line-height: 50px;
      text-align: center;
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.08),
        0 7px 13px rgba(0,0,0,0.45);
    }

    .dpadBtn.pressed,
    .dpadBtn:active {
      filter: brightness(1.35);
      transform: scale(0.94);
    }

    #dpadUp { left: 50px; top: 0; border-radius: 10px 10px 3px 3px; }
    #dpadLeft { left: 0; top: 50px; border-radius: 10px 3px 3px 10px; }
    #dpadCenter { left: 50px; top: 50px; border-radius: 4px; pointer-events: none; }
    #dpadRight { left: 100px; top: 50px; border-radius: 3px 10px 10px 3px; }
    #dpadDown { left: 50px; top: 100px; border-radius: 3px 3px 10px 10px; }

    /* FACE BUTTONS */

    #faceButtons {
      position: absolute;
      right: 18px;
      top: 20px;
      width: 150px;
      height: 150px;
    }

    .faceBtn {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 20px;
      font-weight: bold;
      background: radial-gradient(circle at 30% 30%, #ff82ad, #9d003d);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.15),
        0 10px 18px rgba(0,0,0,0.45);
    }

    .faceBtn.pressed,
    .faceBtn:active {
      transform: scale(0.92);
      filter: brightness(1.2);
    }

    #buttonX { left: 46px; top: 0; }
    #buttonY { left: 0; top: 46px; }
    #buttonA { left: 92px; top: 46px; }
    #buttonB { left: 46px; top: 92px; }

    /* JOYSTICKS */

    .joystickPad {
      position: absolute;
      width: 112px;
      height: 112px;
      border-radius: 18px;
      background: rgba(255,255,255,0.035);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.07);
      touch-action: none;
    }

    #leftJoystickPad {
      left: 36px;
      top: 188px;
    }

    #rightJoystickPad {
      right: 37px;
      top: 188px;
    }

    .joystickBase {
      position: absolute;
      left: 11px;
      top: 11px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, #3f3f3f, #161616);
      box-shadow:
        inset 0 0 0 3px rgba(255,255,255,0.08),
        0 9px 18px rgba(0,0,0,0.45);
      pointer-events: none;
    }

    .joystickKnob {
      position: absolute;
      left: 56px;
      top: 56px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #777, #202020);
      transform: translate(-50%, -50%);
      box-shadow: 0 8px 18px rgba(0,0,0,0.55);
      pointer-events: none;
    }



    /* A-G LETTER CONTROLS — SHARED */

    #letterButtons {
      position: absolute;
      left: 22px;
      right: 22px;
      top: 40px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(2, 86px);
      gap: 16px 8px;
      align-items: stretch;
    }

    .letterBtn {
      grid-column: span 2;
      border: none;
      border-radius: 18px;
      background: linear-gradient(180deg, #f8fbff, #dce9f6);
      color: #111827;
      font-size: 31px;
      font-weight: bold;
      box-shadow:
        inset 0 0 0 3px rgba(17,24,39,0.16),
        0 8px 14px rgba(0,0,0,0.38);
    }

    #letterE { grid-column: 2 / span 2; }
    #letterF { grid-column: 4 / span 2; }
    #letterG { grid-column: 6 / span 2; }

    .letterBtn.pressed,
    .letterBtn:active {
      transform: translateY(3px) scale(0.97);
      filter: brightness(0.92);
      box-shadow:
        inset 0 0 0 3px rgba(17,24,39,0.22),
        0 3px 7px rgba(0,0,0,0.32);
    }

    #controls.letterControlMode #systemButtons {
      top: 268px;
    }

    /* START / SELECT */

    #systemButtons {
      position: absolute;
      left: 50%;
      top: 326px;
      width: 164px;
      height: 34px;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .systemBtn {
      width: 76px;
      height: 32px;
      border-radius: 999px;
      border: none;
      background: #101010;
      color: rgba(255,255,255,0.78);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.12);
    }

    .systemBtn.pressed,
    .systemBtn:active {
      transform: scale(0.96);
      filter: brightness(1.2);
    }

    #faceButtons.singleFace .faceBtn.singleAction {
      width: 76px;
      height: 76px;
      left: 37px !important;
      top: 37px !important;
      border-radius: 22px;
      padding: 0 8px;
      font-size: 14px;
      line-height: 1.05;
      white-space: normal;
    }

    #systemButtons,
    #systemButtons.singleSystem {
      width: 92px;
    }

    #systemButtons.singleSystem .systemBtn {
      width: 92px;
    }

    /* =========================
       EXPANDABLE SHELL MENU
       ========================= */

    #shellMenu {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 60;
      background: rgba(0,0,0,0.62);
      padding: 22px 14px;
      color: white;
    }

    #shellMenu.open {
      display: block;
    }

    #shellMenuPanel {
      width: 100%;
      max-height: 100%;
      overflow: hidden;
      background: #101827;
      border: 3px solid white;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.45);
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    #shellMenuHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 12px 7px;
    }

    #shellMenuHeader h2 {
      margin: 0;
      font-size: 22px;
    }

    #shellMenuCloseBtn {
      width: 40px;
      height: 36px;
      padding: 0;
      border-radius: 12px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 26px;
      font-weight: bold;
      line-height: 1;
    }

    #shellMenuTabs {
      display: flex;
      gap: 7px;
      padding: 0 12px 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .shellMenuTab {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 7px 11px;
      border-radius: 999px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
    }

    .shellMenuTab.active {
      background: #ffe08a;
    }

    #shellMenuBody {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 14px 14px;
      text-align: left;
      font-size: 15px;
      line-height: 1.38;
      touch-action: pan-y;
    }

    .pauseMenuActions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
      margin-top: 12px;
    }

    .pauseActionBtn {
      min-height: 42px;
      border-radius: 12px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
    }

    .pauseActionBtn.saveExit {
      background: #dff3ff;
    }

    .pauseActionBtn.noSaveExit {
      background: #ffd6d6;
    }

    .pauseActionBtn.resumeGame {
      background: #fff3bf;
    }

    #shellMenuBody h3 {
      margin: 4px 0 8px;
      font-size: 20px;
    }

    #shellMenuBody ul {
      margin-top: 8px;
      padding-left: 21px;
    }

    #shellMenuBody code {
      background: rgba(255,255,255,0.12);
      padding: 2px 5px;
      border-radius: 6px;
    }

  </style>
</head>

<body>
  <main id="appFrame">
    <section id="appStage">
      <div id="menuScreen">
        <h1>Bass Bus</h1>

        <div id="leaderboardBox">
          <h2>Leaderboard</h2>
          <ol id="leaderboardList"></ol>
        </div>

        <div id="playerPickerBox">
          <input id="playerSearchInput" placeholder="Search players..." autocomplete="off" />
          <div id="playerSelect" role="listbox" aria-label="Choose player"></div>

          <div id="selectedPlayerActions">
            <button id="resetSelectedPlayerBtn">Reset</button>
            <button id="removeSelectedPlayerBtn">Remove</button>
          </div>
        </div>

        <div id="addPlayerRow">
          <input id="newPlayerName" placeholder="New player name" />
          <button id="addPlayerBtn">Add Player</button>
        </div>

        <p id="selectedPlayerText">No player selected</p>
        <button id="startGameBtn">Start Game</button>
      </div>

      <div id="gameScreen">
        <div id="screen">
          <canvas id="gameCanvas" width="720" height="520"></canvas>

          <div id="gameOverBox">
            <h1>Game Over</h1>
            <p id="gameOverScore"></p>
            <button id="playAgainBtn">Play Again</button>
            <button id="backToMenuBtn">Player Menu</button>
          </div>
        </div>

        <div id="lcd">
          <div id="lcdMessage"></div>
          <div id="lcdScore">SCORE: <span id="score">0</span></div>
          <div id="lcdBest">BEST: <span id="bestScore">0</span></div>
        </div>

        <div id="controls" class="letterControlMode">


          <div id="letterButtons" aria-label="Letter controls">
            <button id="letterA" class="letterBtn" data-action="a" aria-label="A">A</button>
            <button id="letterB" class="letterBtn" data-action="b" aria-label="B">B</button>
            <button id="letterC" class="letterBtn" data-action="c" aria-label="C">C</button>
            <button id="letterD" class="letterBtn" data-action="d" aria-label="D">D</button>
            <button id="letterE" class="letterBtn" data-action="e" aria-label="E">E</button>
            <button id="letterF" class="letterBtn" data-action="f" aria-label="F">F</button>
            <button id="letterG" class="letterBtn" data-action="g" aria-label="G">G</button>
          </div>

          <div id="dpad">
            <button id="dpadUp" class="dpadBtn" data-action="up">▲</button>
            <button id="dpadLeft" class="dpadBtn" data-action="left">◄</button>
            <button id="dpadCenter" class="dpadBtn"></button>
            <button id="dpadRight" class="dpadBtn" data-action="right">►</button>
            <button id="dpadDown" class="dpadBtn" data-action="down">▼</button>
          </div>

          <div id="faceButtons">
            <button id="buttonX" class="faceBtn" data-action="x">X</button>
            <button id="buttonY" class="faceBtn" data-action="y">Y</button>
            <button id="buttonA" class="faceBtn" data-action="a">A</button>
            <button id="buttonB" class="faceBtn" data-action="b">B</button>
          </div>

          <div id="leftJoystickPad" class="joystickPad" data-stick="left">
            <div class="joystickBase"></div>
            <div id="leftJoystickKnob" class="joystickKnob"></div>
          </div>

          <div id="rightJoystickPad" class="joystickPad" data-stick="right">
            <div class="joystickBase"></div>
            <div id="rightJoystickKnob" class="joystickKnob"></div>
          </div>

          <div id="systemButtons">
            <button id="selectButton" class="systemBtn" data-action="select">SELECT</button>
            <button id="startButton" class="systemBtn" data-action="start">START</button>
          </div>
        </div>
      </div>

      <div id="shellMenu" aria-hidden="true">
        <div id="shellMenuPanel" role="dialog" aria-modal="true" aria-label="Pause panel">
          <div id="shellMenuHeader">
            <h2>Pause</h2>
            <button id="shellMenuCloseBtn" type="button" aria-label="Close panel">×</button>
          </div>
          <div id="shellMenuTabs" role="tablist" aria-label="Pause panel tabs"></div>
          <div id="shellMenuBody"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const DESIGN_WIDTH = 390;
    const DESIGN_HEIGHT = 670;
    const GAME_CANVAS_LOGICAL_WIDTH = 720;
    const GAME_CANVAS_LOGICAL_HEIGHT = 520;
    const GAME_CANVAS_DISPLAY_WIDTH = 390;
    const GAME_CANVAS_DISPLAY_HEIGHT =
      GAME_CANVAS_DISPLAY_WIDTH * GAME_CANVAS_LOGICAL_HEIGHT / GAME_CANVAS_LOGICAL_WIDTH;
    const MAX_GAME_CANVAS_PIXEL_SCALE = 4;

    /*
      Change STORAGE_KEY for each separate arcade game if you want each game
      to keep its own local player list/leaderboard.
      Example: "meloMemoPlayers_v1", "staffSurvivorPlayers_v1", etc.
    */
    const STORAGE_KEY = "bassBusPlayers_v1";
    const STORAGE_MESSAGE_SOURCE = "PianoArcadeShell";
    const WIX_STORAGE_MESSAGE_SOURCE = "PianoArcadeWixStorage";
    const SCORE_LABEL = "Score";
    const FIRST_TIME_HELP_DEFAULT_VERSION = "bassBusStep1Rules_v1";
    let firstTimeHelpVersion = FIRST_TIME_HELP_DEFAULT_VERSION;

    const appFrame = document.getElementById("appFrame");
    const appStage = document.getElementById("appStage");

    const menuScreen = document.getElementById("menuScreen");
    const gameScreen = document.getElementById("gameScreen");

    const leaderboardList = document.getElementById("leaderboardList");
    const playerSearchInput = document.getElementById("playerSearchInput");
    const playerSelect = document.getElementById("playerSelect");
    playerSelect.addEventListener("touchmove", event => event.stopPropagation(), { passive: true });
    const resetSelectedPlayerBtn = document.getElementById("resetSelectedPlayerBtn");
    const removeSelectedPlayerBtn = document.getElementById("removeSelectedPlayerBtn");
    const newPlayerName = document.getElementById("newPlayerName");
    const addPlayerBtn = document.getElementById("addPlayerBtn");
    const startGameBtn = document.getElementById("startGameBtn");
    const selectedPlayerText = document.getElementById("selectedPlayerText");

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    let gameCanvasPixelScale = 1;

    function scaleGameCanvasBackingStore() {
      canvas.style.width = GAME_CANVAS_DISPLAY_WIDTH + "px";
      canvas.style.height = GAME_CANVAS_DISPLAY_HEIGHT + "px";

      const rect = canvas.getBoundingClientRect();
      const cssWidth = Math.max(1, rect.width || GAME_CANVAS_DISPLAY_WIDTH * appScale);
      const cssHeight = Math.max(1, rect.height || GAME_CANVAS_DISPLAY_HEIGHT * appScale);
      const dpr = Math.max(1, window.devicePixelRatio || 1);

      const scaleX = (cssWidth / GAME_CANVAS_LOGICAL_WIDTH) * dpr;
      const scaleY = (cssHeight / GAME_CANVAS_LOGICAL_HEIGHT) * dpr;
      const targetScale = Math.min(
        MAX_GAME_CANVAS_PIXEL_SCALE,
        Math.max(1, scaleX, scaleY)
      );

      const targetWidth = Math.max(1, Math.round(GAME_CANVAS_LOGICAL_WIDTH * targetScale));
      const targetHeight = Math.max(1, Math.round(GAME_CANVAS_LOGICAL_HEIGHT * targetScale));

      if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
        canvas.width = targetWidth;
        canvas.height = targetHeight;
      }

      gameCanvasPixelScale = targetWidth / GAME_CANVAS_LOGICAL_WIDTH;
      ctx.setTransform(gameCanvasPixelScale, 0, 0, gameCanvasPixelScale, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.webkitImageSmoothingEnabled = true;
      ctx.mozImageSmoothingEnabled = true;
      ctx.msImageSmoothingEnabled = true;
    }

    function resetGameCanvasTransform() {
      ctx.setTransform(gameCanvasPixelScale, 0, 0, gameCanvasPixelScale, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.webkitImageSmoothingEnabled = true;
      ctx.mozImageSmoothingEnabled = true;
      ctx.msImageSmoothingEnabled = true;
    }

      };

        const cleanName = String(name || "").trim();
        if (!cleanName) return;

        const isObjectData = data && typeof data === "object" && !Array.isArray(data);
        const best = isObjectData
          ? Number(data.best || 0)
          : Number(data || 0);

        cleaned[cleanName] = {
          ...(isObjectData ? data : {}),
          best: Math.max(0, Math.floor(best || 0))

      return cleaned;

    function normalizeSavedData(savedData) {
      /*
        Supports both:
        1. New format: { v: 1, selectedPlayer: "Chris", players: { ... } }
        2. Old format: { "Chris": { best: 100, lastScore: 80 }, ... }
        Either way, this template stores only each player's best score.
      */
      if (!savedData || typeof savedData !== "object") {
        return { players: {}, selectedPlayer: null };
      }

      if (
        savedData.players &&
        typeof savedData.players === "object" &&
        !Array.isArray(savedData.players)
      ) {
        return {
          players: cleanPlayers(savedData.players),
          selectedPlayer: savedData.selectedPlayer || null
        };
      }

      return {
        players: cleanPlayers(savedData),
        selectedPlayer: null
      };
    }

    function applySavedData(savedData) {
      const normalized = normalizeSavedData(savedData);

      players = normalized.players || {};
      selectedPlayer = normalized.selectedPlayer || selectedPlayer || null;

        selectedPlayer = null;

    function sendStorageMessageToWix(type, payload = {}) {
      if (!window.parent || window.parent === window) {
        return false;
      }

      window.parent.postMessage({
        source: STORAGE_MESSAGE_SOURCE,
        type,
        storageKey: STORAGE_KEY,
        ...payload
      }, "*");

      return true;
    }

    function loadPlayers() {
      wixStorageAnswered = false;
      const askedWixParent = sendStorageMessageToWix("ARCADE_STORAGE_LOAD");

      /*
        In Wix on iPhone Safari, the parent page should answer and provide
        Wix/Velo local storage. Outside Wix, or if the Velo bridge is not added,
        this fallback keeps the old desktop/localStorage behavior working.
      */
      if (askedWixParent) {
        setTimeout(() => {
          if (!wixStorageAnswered) {
            loadPlayersFromLocalStorage();
          }
        }, 600);
      } else {
        loadPlayersFromLocalStorage();
      }

        On iPhone Safari inside Wix, this may not persist, so we also send

      */
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (err) {}

      sendStorageMessageToWix("ARCADE_STORAGE_SAVE", { payload });

    function joystickPointFromEvent(event, stick) {
      const rect = stick.pad.getBoundingClientRect();

      return {
        x: (event.clientX - rect.left) / appScale,
        y: (event.clientY - rect.top) / appScale
      };
    }

    function setJoystickFromEvent(event, stick) {
      const point = joystickPointFromEvent(event, stick);

      const centerX = stick.pad.offsetWidth / 2;
      const centerY = stick.pad.offsetHeight / 2;

      const limitedX = clamp(point.x, centerX - stick.maxDistance, centerX + stick.maxDistance);
      const limitedY = clamp(point.y, centerY - stick.maxDistance, centerY + stick.maxDistance);

      const dx = limitedX - centerX;
      const dy = limitedY - centerY;

      stick.x = dx / stick.maxDistance;
      stick.y = dy / stick.maxDistance;

      stick.knob.style.left = `${centerX + dx}px`;
      stick.knob.style.top = `${centerY + dy}px`;
    }

    function resetJoystick(stick) {
      stick.active = false;
      stick.pointerId = null;
      stick.x = 0;
      stick.y = 0;

      stick.knob.style.left = `${stick.pad.offsetWidth / 2}px`;
      stick.knob.style.top = `${stick.pad.offsetHeight / 2}px`;
    }

    function bindJoystick(stick) {
      stick.pad.addEventListener("pointerdown", event => {
        event.preventDefault();

        stick.active = true;
        stick.pointerId = event.pointerId;

        stick.pad.setPointerCapture(event.pointerId);
        setJoystickFromEvent(event, stick);
      });

      stick.pad.addEventListener("pointermove", event => {
        if (!stick.active || event.pointerId !== stick.pointerId) return;

        event.preventDefault();
        setJoystickFromEvent(event, stick);
      });

      stick.pad.addEventListener("pointerup", event => {
        if (event.pointerId !== stick.pointerId) return;

        event.preventDefault();

        if (!audioCtx) {

      function createNoiseBuffer(ac, duration, color = "white") {
        const length = Math.max(1, Math.ceil(ac.sampleRate * Math.max(0.02, duration)));
        const buffer = ac.createBuffer(1, length, ac.sampleRate);
        const data = buffer.getChannelData(0);
        let brown = 0;
        let pink0 = 0;
        let pink1 = 0;
        let pink2 = 0;

        for (let i = 0; i < length; i++) {
          const white = Math.random() * 2 - 1;
          if (color === "brown") {
            brown = (brown + 0.025 * white) / 1.025;
            data[i] = Math.max(-1, Math.min(1, brown * 3.2));
          } else if (color === "pink") {
            pink0 = 0.99765 * pink0 + white * 0.0990460;
            pink1 = 0.96300 * pink1 + white * 0.2965164;
            pink2 = 0.57000 * pink2 + white * 1.0526913;
            data[i] = Math.max(-1, Math.min(1, (pink0 + pink1 + pink2 + white * 0.1848) * 0.13));
          } else {
            data[i] = white;
          }
        }
        return buffer;
      }

      function getSfxDestination(ac) {
        if (!ac) return null;
        if (!sfxBusInput || !sfxBusLimiter || sfxBusContext !== ac) {
          sfxBusContext = ac;
          sfxBusInput = ac.createGain();
          sfxBusLimiter = ac.createDynamicsCompressor();
          const saturation = ac.createWaveShaper();
          const outputGain = ac.createGain();

          // Match Treble Trouble's maximum-limited SFX bus: heavily driven noise
          // transients, hard limiting, saturation, and a final -0.35 dBFS ceiling.
          sfxBusInput.gain.setValueAtTime(10.0, ac.currentTime);
          sfxBusLimiter.threshold.setValueAtTime(-18, ac.currentTime);
          sfxBusLimiter.knee.setValueAtTime(2, ac.currentTime);
          sfxBusLimiter.ratio.setValueAtTime(20, ac.currentTime);
          sfxBusLimiter.attack.setValueAtTime(0.001, ac.currentTime);
          sfxBusLimiter.release.setValueAtTime(0.12, ac.currentTime);

          const curveLength = 4096;
          const curve = new Float32Array(curveLength);
          for (let i = 0; i < curveLength; i++) {
            const x = (i / (curveLength - 1)) * 2 - 1;
            curve[i] = Math.tanh(x * 2.8) / Math.tanh(2.8);
          }
          saturation.curve = curve;
          saturation.oversample = "4x";
          outputGain.gain.setValueAtTime(0.96, ac.currentTime);

          sfxBusInput.connect(sfxBusLimiter);
          sfxBusLimiter.connect(saturation);
          saturation.connect(outputGain);
          outputGain.connect(ac.destination);
        }
        return sfxBusInput;
      }

      function playNoiseBurst({
        when = null,
        duration = 0.1,
        volume = 0.06,
        color = "white",
        filterType = "bandpass",
        frequencyStart = 1200,
        frequencyEnd = 300,
        q = 0.7,
        attack = 0.004
      } = {}) {
        const ac = getAudio();
        if (!ac) return;
        const startTime = Math.max(ac.currentTime, when == null ? ac.currentTime : when);
        const endTime = startTime + Math.max(0.025, duration);
        const source = ac.createBufferSource();
        const filter = ac.createBiquadFilter();
        const gain = ac.createGain();

        source.buffer = createNoiseBuffer(ac, duration + 0.04, color);
        filter.type = filterType;
        filter.Q.setValueAtTime(Math.max(0.0001, q), startTime);
        filter.frequency.setValueAtTime(Math.max(35, frequencyStart), startTime);
        filter.frequency.exponentialRampToValueAtTime(Math.max(35, frequencyEnd), endTime);

        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.linearRampToValueAtTime(Math.max(0.0001, volume), startTime + Math.min(attack, duration * 0.45));
        gain.gain.exponentialRampToValueAtTime(0.0001, endTime);

        source.connect(filter);
        filter.connect(gain);
        const destination = getSfxDestination(ac);
        if (!destination) return;
        gain.connect(destination);
        source.start(startTime);
        source.stop(endTime + 0.04);
      }

        playNoiseBurst({ when: now, duration: 0.24, volume: 0.115, color: "pink", filterType: "bandpass", frequencyStart: 2500, frequencyEnd: 180, q: 0.38, attack: 0.018 });

  function roundedRectPath(x, y, width, height, radius) {
    const r = Math.max(0, Math.min(radius, width / 2, height / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + width - r, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + r);
    ctx.lineTo(x + width, y + height - r);
    ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
    ctx.lineTo(x + r, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - clamp(t, 0, 1), 3);
  }

  function easeInOut(t) {
    const c = clamp(t, 0, 1);
    return c < 0.5 ? 4 * c * c * c : 1 - Math.pow(-2 * c + 2, 3) / 2;
  }

  function wrappedX(value, span, leftPadding = 0) {
    const normalized = ((value + leftPadding) % span + span) % span;
    return normalized - leftPadding;
  }

    const availableW = Math.max(winW, building.width - padX * 2);
    const availableH = Math.max(winH, windowAreaBottom - windowAreaTop);
    const cols = Math.max(1, Math.floor((availableW + gapX) / (winW + gapX)));
    const rows = Math.max(1, Math.floor((availableH + gapY) / (winH + gapY)));

    const gridH = rows * winH + (rows - 1) * gapY;

    const startY = windowAreaTop + (availableH - gridH) / 2;

  function drawBus(x, y, width, height, doorOpen = 0, damage = 0, motionTilt = 0) {

  function buildScenery() {

  function actorXForNoteX(noteX) {
    const startX = GAME_CANVAS_LOGICAL_WIDTH + 28;
    const endX = BUS_X - 18;
    const t = clamp((NOTE_SPAWN_X - noteX) / Math.max(1, NOTE_SPAWN_X - TARGET_BARLINE_X), 0, 1);
    return lerp(startX, endX, t);
  }

  function syncStopActorsToNotes() {
    const noteById = new Map(activeNotes.map(note => [note.id, note]));
    stopActors.forEach(actor => {
      if (actor.state !== "waiting") return;
      const note = noteById.get(actor.noteId);
      if (note) actor.x = actorXForNoteX(note.x);
    });
  }

  function getTargetStopActor(noteId) {
    return stopActors.find(actor => actor.noteId === noteId) || null;
  }

  function noteYFromStep(step) {
    const bottomLineY = STAFF_TOP + STAFF_GAP * 4;
    return bottomLineY - step * (STAFF_GAP / 2);
  }

  function geometryForPitch(pitch) {
    const y = noteYFromStep(pitch.step);
    return {
      y,
      ledgerYs: pitch.ledger ? [y] : [],
      staffCenterY: STAFF_TOP + STAFF_GAP * 2
    };
  }

  function choosePitchIndex() {
    let index = Math.floor(Math.random() * NOTE_CHOICES.length);
    if (NOTE_CHOICES.length > 1 && index === lastPitchIndex) {
      index = (index + 1 + Math.floor(Math.random() * (NOTE_CHOICES.length - 1))) % NOTE_CHOICES.length;
    }
    return index;
  }

  function spawnNoteAt(x) {
    const pitchIndex = choosePitchIndex();
    const pitch = NOTE_CHOICES[pitchIndex];
    lastPitchIndex = pitchIndex;
    const noteGeometry = geometryForPitch(pitch);
    const noteId = nextNoteId++;
    activeNotes.push({
      id: noteId,
      letter: pitch.letter,
      x,
      y: noteGeometry.y,
      ledgerYs: noteGeometry.ledgerYs,
      staffCenterY: noteGeometry.staffCenterY
    });
    stopActors.push({
      id: nextStopActorId++,
      noteId,
      x: actorXForNoteX(x),
      color: STOP_COLORS[(noteId - 1) % STOP_COLORS.length],
      hasBag: noteId % 3 === 0,
      weapon: WEAPONS[(noteId - 1) % WEAPONS.length],
      state: "waiting",
      action: null,
      addedToMob: false,
      phaseSeed: noteId * 0.7
    });
  }

  function maintainNoteStream() {
    if (activeNotes.length === 0) spawnNoteAt(NOTE_SPAWN_X);
    let rightmost = activeNotes[activeNotes.length - 1];
    while (rightmost.x <= NOTE_SPAWN_X - NOTE_SPACING_X) {
      spawnNoteAt(rightmost.x + NOTE_SPACING_X);
      rightmost = activeNotes[activeNotes.length - 1];
    }
  }

  function currentNoteSpeed() {
    const n = correctNotes;
    const baseSpeedSquared = BASE_NOTE_SPEED * BASE_NOTE_SPEED;
    return Math.sqrt(baseSpeedSquared + n * NOTE_SPEED_SQUARED_RAMP);
  }

  function worldScrollSpeed() {
    const noteTravelTime = (STAFF_RIGHT - TARGET_BARLINE_X) / Math.max(1, currentNoteSpeed());
    return (GAME_CANVAS_LOGICAL_WIDTH - BUS_X) / Math.max(0.1, noteTravelTime);
  }

  function boardingScaleOnlyIfNeeded(actorX, scrollSpeed) {
    const baseBoardingDuration = 1.02;
    const removalBoundaryX = -40;
    const safetyPadding = 0.06;
    const availableTime = (actorX - removalBoundaryX) / Math.max(1, scrollSpeed) - safetyPadding;

    // Keep the original timing until the actor would actually scroll offscreen
    // before boarding finishes. Then compress only enough to fit the remaining window.
    if (availableTime >= baseBoardingDuration) return 1;
    return clamp(availableTime / baseBoardingDuration, 0.45, 1);
  }

  function approachProgressForX(x) {
    const approachDistance = Math.max(1, NOTE_ZOOM_START_X - NOTE_LANDING_X);
    const rawProgress = Math.max(0, Math.min(1, (NOTE_ZOOM_START_X - x) / approachDistance));
    return rawProgress * rawProgress * (3 - 2 * rawProgress);
  }

  function getRenderedNotePosition(note) {
    const approach = approachProgressForX(note.x);
    return { x: note.x, y: NOTE_VANISH_Y + (note.y - NOTE_VANISH_Y) * approach };
  }
  function registerMobMember(cause) {
    mobSize = Math.min(MAX_MOB_SIZE, mobSize + 1);
    if (mobSize >= MAX_MOB_SIZE && !finalSequence.active) {
      finalSequence = { active: true, phase: "waiting", t: 0, overlayQueued: false };
      activeNotes = [];
      stopActors = stopActors.filter(actor => actor.state !== "waiting");
      lastEventMessage = "The final passenger joins the mob...";
    }
  }
  function launchStopAnimation(outcome, note) {
    const actor = getTargetStopActor(note.id);
    if (!actor) return;
    const notePos = getRenderedNotePosition(note);
    actor.state = outcome === "correct" ? "boarding" : "hit";

    const scrollSpeed = worldScrollSpeed();
    const animationScale = outcome === "correct"
      ? boardingScaleOnlyIfNeeded(actor.x, scrollSpeed)
      : 1;
    const impactTime = (outcome === "correct" ? 0.32 : 0.20) * animationScale;
    const personImpactX = actor.x - scrollSpeed * impactTime;
    const impactX = personImpactX + 5;
    const impactY = PASSENGER_GROUND_Y - 24;
    const dirX = impactX - notePos.x;
    const dirY = impactY - notePos.y;

    actor.action = {
      outcome,
      t: 0,
      animationScale,
      startNoteX: notePos.x,
      startNoteY: notePos.y,
      impactTime,
      boardingWaitEnd: 0.24 * animationScale,
      boardingRunEnd: 0.70 * animationScale,
      boardingEnd: 1.02 * animationScale,
      flightDuration: 1.25 * animationScale,
      sideLandingDuration: 0.28 * animationScale,
      getUpDuration: 0.35 * animationScale,
      impactX,
      impactY,
      personImpactX,
      signVelX: dirX / impactTime,
      signVelY: dirY / impactTime,
      mobTargetX: BUS_X - 34 - Math.min(chasers.length, MAX_MOB_SIZE - 1) * 18,
      weapon: actor.weapon,
      isFinalMiss: outcome !== "correct" && mobSize === MAX_MOB_SIZE - 1
    };

    actor.addedToMob = false;
    if (outcome === "correct") soundCorrect(impactTime);
    else soundWrongFling(impactTime, actor.action.flightDuration, outcome);
    if (outcome === "correct") {
      busDoorHold = Math.max(0.48, actor.action.boardingEnd + 0.05);
      lastEventMessage = "Passenger picked up — keep the route moving.";
    } else if (outcome === "wrong") {
      lastEventMessage = "Wrong letter — the stop sign nailed the passenger.";
    } else {
      lastEventMessage = "Missed stop — the stop sign hit the passenger.";
    }
  }
  function resolveFrontNote(outcome) {
    if (activeNotes.length === 0) return;
    const note = activeNotes.shift();
    launchStopAnimation(outcome, note);

    if (outcome === "correct") {
      addScore(1);
      correctNotes++;
    } else {
      registerMobMember(outcome);
    }

    if (running && !finalSequence.active) maintainNoteStream();
  }

  function updateBuildings(deltaSeconds, scrollSpeed) {
    const buildingSpeed = scrollSpeed * 0.42;
    let rightmost = Math.max(...sceneryBuildings.map(building => building.x + building.width));
    sceneryBuildings.forEach((building, index) => {
      building.x -= buildingSpeed * deltaSeconds;
      if (building.x + building.width < -10) {
        const width = [86, 72, 100, 90, 85, 82][index % 6];
        const height = [125, 99, 139, 113, 147, 106][index % 6];
        building.x = rightmost + 26;
        building.y = ANIMATION_AREA_BOTTOM - 28 - height;
        building.width = width;
        building.height = height;
        rightmost = building.x + width;
      }
    });
  }
  function updateStops(deltaSeconds) {
    const scrollSpeed = finalSequence.active && (finalSequence.phase === "rush" || finalSequence.phase === "destroy") ? 0 : worldScrollSpeed();
    syncStopActorsToNotes();
    stopActors = stopActors.filter(actor => {
      if (actor.state === "waiting") return true;
      actor.action.t += deltaSeconds;

      if (actor.state === "boarding") {
        actor.x -= scrollSpeed * deltaSeconds;
        return actor.x > -40;
      }

      actor.x -= scrollSpeed * deltaSeconds;
      const impactTime = actor.action.impactTime;
      const flightDuration = actor.action.flightDuration;
      const sideLandingDuration = actor.action.sideLandingDuration;
      const getUpDuration = actor.action.getUpDuration;
      const totalDuration = impactTime + flightDuration + sideLandingDuration + getUpDuration;

      if (!actor.addedToMob && actor.action.t >= totalDuration - 0.02) {
        actor.addedToMob = true;
        chasers.push({ color: actor.color, weapon: actor.action.weapon, t: 0, phaseSeed: actor.phaseSeed });
        if (chasers.length > MAX_MOB_SIZE) chasers.shift();

        if (actor.action.isFinalMiss && finalSequence.active && finalSequence.phase === "waiting") {
          startFinalRush();
        }
      }

      return actor.action.t < totalDuration;
    });
  }

  function updateChasers(deltaSeconds) {
    chasers.forEach(chaser => { chaser.t += deltaSeconds; });
  }
  function updateDoor(deltaSeconds) {
    if (busDoorHold > 0) busDoorHold = Math.max(0, busDoorHold - deltaSeconds);
    const target = busDoorHold > 0 ? 1 : 0;
    busDoorOpen += (target - busDoorOpen) * Math.min(1, deltaSeconds * 8);
  }


  function spawnPanicPassengers() {
    panicPassengers = [];
    const colors = ["#c84a44", "#3976a8", "#6f4ba3", "#2d8b64", "#c58a2b", "#b55e3c", "#4a78b7", "#8f5cc2"];
    for (let i = 0; i < 8; i++) {
      const exitLeft = i < 4;
      panicPassengers.push({
        color: colors[i % colors.length],
        hasBag: i % 3 === 0,
        t: 0,
        duration: 1.25 + (i % 3) * 0.12,
        startX: BUS_DOOR_CENTER_X - 2 + (i % 2) * 5,
        startY: BUS_Y + BUS_HEIGHT - 8,
        targetX: exitLeft ? -90 - i * 18 : GAME_CANVAS_LOGICAL_WIDTH + 70 + (i - 4) * 18,
        targetY: PASSENGER_GROUND_Y + (i % 2) * 4,
        variant: i + 20
      });
    }
  }

  function startFinalRush() {
    finalSequence.phase = "rush";
    finalSequence.t = 0;
    busDoorHold = 4.5;
    busDoorOpen = 1;
    spawnPanicPassengers();
    soundMobRush();
    lastEventMessage = "Panic! Passengers flee as the mob charges the bus!";
  }

  function updatePanicPassengers(deltaSeconds) {
    if (!panicPassengers.length) return;
    panicPassengers = panicPassengers.filter(passenger => {
      passenger.t += deltaSeconds;
      return passenger.t < passenger.duration;
    });
  }

  function drawPanicPassengers() {
    panicPassengers.forEach((passenger, index) => {
      const p = clamp(passenger.t / passenger.duration, 0, 1);
      const px = lerp(passenger.startX, passenger.targetX, p);
      const py = lerp(passenger.startY, passenger.targetY, p) - Math.sin(p * Math.PI) * (10 + (index % 3) * 4);
      drawPersonSprite(px, py, passenger.color, {
        running: true,
        runPhase: passenger.t * 24 + index,
        hasBag: passenger.hasBag,
        scale: 0.94,
        variant: passenger.variant
      });
    });
  }

  function updateFinalSequence(deltaSeconds) {
    if (!finalSequence.active || finalSequence.phase === "waiting") return;
    finalSequence.t += deltaSeconds;
    updatePanicPassengers(deltaSeconds);

    if (finalSequence.phase === "rush") {
      if (finalSequence.t >= 1.35) {
        finalSequence.phase = "destroy";
        finalSequence.t = 0;
        panicPassengers = [];
        soundBusDestruction();
        lastEventMessage = "The bus is smashed into rubble!";
      }
      return;
    }

    if (finalSequence.phase === "destroy") {
      busDamage = clamp(finalSequence.t / 2.1, 0, 1);
      const shakeStrength = Math.min(18, 4 + busDamage * 18);
      busShake = Math.sin(finalSequence.t * 55) * shakeStrength
        + Math.cos(finalSequence.t * 31) * shakeStrength * 0.34;
      if (finalSequence.t >= 3.45 && !finalSequence.overlayQueued) {
        finalSequence.overlayQueued = true;
        finalOverlayTimer = setTimeout(() => endGame("The mob destroyed the bus!"), 220);
      }
    }
  }

  function drawMovingSignLayer(actor) {
    if (!actor.action) return;
    const t = actor.action.t;
    if (actor.state === "boarding") {
      if (t < actor.action.impactTime) {
        const poleX = actor.x - 14;
        const p = easeOutCubic(t / actor.action.impactTime);
        drawFlyingSign(
          lerp(actor.action.startNoteX, poleX, p),
          lerp(actor.action.startNoteY, PASSENGER_GROUND_Y - 53, p),
          p * 7,
          8.2
        );
      } else if (t < actor.action.impactTime + 0.14) {
        drawAnswerImpactBurst(actor.x - 14, PASSENGER_GROUND_Y - 53, (t - actor.action.impactTime) / 0.14);
      }
      return;
    }

    const impactTime = actor.action.impactTime;
    if (t < impactTime) {
      const p = clamp(t / impactTime, 0, 1);
      drawFlyingSign(
        lerp(actor.action.startNoteX, actor.action.impactX, p),
        lerp(actor.action.startNoteY, actor.action.impactY, p),
        t * 25,
        8.2
      );
      return;
    }

    const afterImpactTime = t - impactTime;
    if (afterImpactTime < 0.12) {
      drawAnswerImpactBurst(actor.action.impactX, actor.action.impactY, afterImpactTime / 0.12, "255, 145, 88");
    }
    const signX = actor.action.impactX + actor.action.signVelX * afterImpactTime;
    const signY = actor.action.impactY + actor.action.signVelY * afterImpactTime;
    if (signX > -30 && signY < GAME_CANVAS_LOGICAL_HEIGHT + 40) {
      drawFlyingSign(signX, signY, t * 25, 8.2);
    }
  }

  function drawStopPoleLayer(actor) {
    const poleX = actor.x - 14;
    drawPole(poleX, PASSENGER_GROUND_Y, actor.state === "boarding" && actor.action && actor.action.t >= actor.action.impactTime);
  }

  function shouldDrawStopActorBehindPole(actor) {
    if (actor.state === "waiting" || actor.state === "boarding") return false;
    const impactTime = actor.action && actor.action.impactTime != null ? actor.action.impactTime : 0;
    const flightDuration = actor.action && actor.action.flightDuration != null ? actor.action.flightDuration : 0;
    const t = actor.action && actor.action.t != null ? actor.action.t : 0;
    if (t < impactTime) return false;
    if (flightDuration <= 0) return true;
    const afterImpact = t - impactTime;
    if (afterImpact >= flightDuration) return true;
    return afterImpact / flightDuration > 0.38;
  }

    drawBus(BUS_X + busShake, renderedBusY, BUS_WIDTH, BUS_HEIGHT, busDoorOpen, busDamage, busMotion.tilt);
    drawBusDestructionEffects();

    drawPanicPassengers();

    stopActors
      .filter(actor => shouldDrawStopActorBehindPole(actor))
      .sort((a, b) => a.x - b.x)
      .forEach(actor => drawStopActor(actor));

      .filter(actor => actor.x > -50 && actor.x < GAME_CANVAS_LOGICAL_WIDTH + 50)

      .filter(actor => actor.state !== "waiting")

      .forEach(actor => drawMovingSignLayer(actor));

  }
  function drawStopActor(actor) {
    if (actor.state === "waiting") {
      drawPersonSprite(actor.x, PASSENGER_GROUND_Y, actor.color, {
        hasBag: actor.hasBag,
        runPhase: performance.now() / 220 + actor.phaseSeed,
        variant: actor.phaseSeed
      });
      return;
    }

    const t = actor.action.t;
    if (actor.state === "boarding") {
      const waitEnd = actor.action.boardingWaitEnd;
      const runEnd = actor.action.boardingRunEnd;
      const boardingEnd = actor.action.boardingEnd;
      const animationScale = actor.action.animationScale;
      if (t < waitEnd) {
        drawPersonSprite(actor.x, PASSENGER_GROUND_Y, actor.color, { hasBag: actor.hasBag, variant: actor.phaseSeed });
      } else if (t < runEnd) {
        const p = easeInOut((t - waitEnd) / Math.max(0.001, runEnd - waitEnd));
        const approachX = BUS_DOOR_CENTER_X + 14;
        drawPersonSprite(lerp(actor.x, approachX, p), PASSENGER_GROUND_Y, actor.color, {
          running: true,
          runPhase: (t / animationScale) * 18,
          hasBag: actor.hasBag,
          variant: actor.phaseSeed
        });
      } else if (t < boardingEnd) {
        const p = easeInOut((t - runEnd) / Math.max(0.001, boardingEnd - runEnd));
        const approachX = BUS_DOOR_CENTER_X + 14;
        const insideGroundY = BUS_Y + currentBusMotion().y + 10 + (BUS_HEIGHT - 24) * 0.98;
        const px = lerp(approachX, BUS_DOOR_CENTER_X + 1, p);
        const py = lerp(PASSENGER_GROUND_Y, insideGroundY, p) - Math.sin(p * Math.PI) * 17;
        drawPersonSprite(px, py, actor.color, {
          running: true,
          runPhase: (t / animationScale) * 20,
          hasBag: actor.hasBag,
          variant: actor.phaseSeed
        });
      }
      return;
    }

    const impactTime = actor.action.impactTime;
    const flightDuration = actor.action.flightDuration;
    const sideLandingDuration = actor.action.sideLandingDuration;
    const getUpDuration = actor.action.getUpDuration;

    if (t < impactTime) {
      drawPersonSprite(actor.x, PASSENGER_GROUND_Y, actor.color, { hasBag: actor.hasBag, variant: actor.phaseSeed });
      return;
    }

    const afterImpactTime = t - impactTime;

    if (afterImpactTime < flightDuration) {
      const p = clamp(afterImpactTime / flightDuration, 0, 1);
      const px = lerp(actor.action.personImpactX, actor.action.mobTargetX, p);
      const py = lerp(PASSENGER_GROUND_Y, CHASER_GROUND_Y, p) - Math.sin(p * Math.PI) * 122;
      drawPersonSprite(px, py, actor.color, {
        tilt: -p * (Math.PI * 4 + Math.PI / 2),
        running: true,
        runPhase: (t / actor.action.animationScale) * 15,
        hasBag: actor.hasBag,
        variant: actor.phaseSeed
      });
      return;
    }

    const landingTime = afterImpactTime - flightDuration;
    if (landingTime < sideLandingDuration) {
      drawLandingDust(actor.action.mobTargetX, CHASER_GROUND_Y + 1, landingTime / sideLandingDuration);
      drawPersonSprite(actor.action.mobTargetX, CHASER_GROUND_Y, actor.color, {
        tilt: -Math.PI / 2,
        crouch: true,
        hasBag: actor.hasBag,
        variant: actor.phaseSeed
      });
      return;
    }

    const getUpProgress = clamp((landingTime - sideLandingDuration) / getUpDuration, 0, 1);
    const easedGetUp = easeOutCubic(getUpProgress);
    drawPersonSprite(actor.action.mobTargetX, CHASER_GROUND_Y, actor.color, {
      tilt: lerp(-Math.PI / 2, 0, easedGetUp),
      crouch: easedGetUp < 0.72,
      hasBag: actor.hasBag,
      tool: easedGetUp > 0.72 ? actor.action.weapon : null,
      variant: actor.phaseSeed
    });
  }
  function getFinalMobTarget(index, chaser) {
    const slots = [
      [BUS_X - 17, BUS_Y + BUS_HEIGHT + 2],
      [BUS_X + 11, BUS_Y + BUS_HEIGHT + 5],
      [BUS_X + 45, BUS_Y + BUS_HEIGHT + 1],

      [BUS_X + 118, BUS_Y + BUS_HEIGHT + 2],

      [BUS_X + 192, BUS_Y + BUS_HEIGHT + 1],
      [BUS_X + BUS_WIDTH + 15, BUS_Y + BUS_HEIGHT + 4],
      [BUS_X + 55, BUS_Y + BUS_HEIGHT - 12],
      [BUS_X + 164, BUS_Y + BUS_HEIGHT - 14]
    ];
    const [baseX, baseY] = slots[index % slots.length];
    const jitterX = Math.sin((index + 1) * 12.9898 + chaser.phaseSeed) * 8;
    const jitterY = Math.cos((index + 1) * 7.233 + chaser.phaseSeed) * 3.5;
    return {
      x: clamp(baseX + jitterX, BUS_X - 21, BUS_X + BUS_WIDTH + 20),
      y: baseY + jitterY
    };

  function drawBusDestructionEffects() {

    if (t > 0.32) {

      for (const [fx, fy, seed] of [[22,55,1],[56,20,2],[92,50,3],[128,17,4],[164,47,5],[202,22,6]]) {

        ctx.fillStyle = "rgba(220, 38, 38, 0.94)";
        ctx.beginPath();
        ctx.moveTo(fx - 11, fy + 6);
        ctx.quadraticCurveTo(fx + flicker, fy - 42 * flameStrength, fx + 11, fy + 6);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "rgba(251, 146, 60, 0.98)";
        ctx.beginPath();
        ctx.moveTo(fx - 6, fy + 5);
        ctx.quadraticCurveTo(fx + flicker * 0.5, fy - 26 * flameStrength, fx + 6, fy + 5);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "rgba(253, 224, 71, 0.96)";
        ctx.beginPath();
        ctx.moveTo(fx - 3, fy + 4);
        ctx.quadraticCurveTo(fx, fy - 13 * flameStrength, fx + 3, fy + 4);
        ctx.closePath();
        ctx.fill();
      }

      for (let smoke = 0; smoke < 9; smoke++) {
        const rise = (t * 34 + smoke * 17) % 110;
        const sx = 28 + (smoke * 29) % 190 + Math.sin(t * 4 + smoke) * 8;
        const sy = 15 - rise;
        ctx.beginPath();
        ctx.arc(sx, sy, 8 + (smoke % 3) * 4 + p * 4, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(55, 65, 81, ${0.34 + p * 0.23})`;
        ctx.fill();
      }
    }

    ctx.restore();
  }


  function drawBusRubble(progress) {
    if (progress <= 0.55) return;
    ctx.save();
    ctx.translate(BUS_X + busShake, BUS_Y);
    const rubbleY = BUS_HEIGHT - 6;
    for (const [rx, rw, rh, col] of [[22,24,9,"#d88a1b"],[48,18,8,"#f6c744"],[78,26,10,"#b99662"],[112,20,8,"#203b54"],[146,28,11,"#d88a1b"],[180,22,9,"#f6c744"]]) {
      ctx.save();
      ctx.translate(rx, rubbleY + Math.sin(rx) * 1.5);
      ctx.rotate((rx % 5 - 2) * 0.08);
      ctx.fillStyle = col;
      ctx.strokeStyle = "#4a3518";
      ctx.lineWidth = 1.6;
      ctx.fillRect(-rw / 2, -rh / 2, rw, rh);
      ctx.strokeRect(-rw / 2, -rh / 2, rw, rh);
      ctx.restore();
    }
    ctx.restore();
  }

  function drawChasers() {
    const escalation = clamp(mobSize - 6, 0, 3);
    chasers.forEach((chaser, index) => {
      const normalX = BUS_X - 34 - index * 18;
      const finalTarget = getFinalMobTarget(index, chaser);
      let x = normalX;
      let y = CHASER_GROUND_Y + Math.sin(chaser.t * 7 + chaser.phaseSeed) * 2;
      let runPhase = chaser.t * 16 + index;
      let scale = 0.96 + (index % 3) * 0.025;
      let toolAngle = 0;

      if (!finalSequence.active && escalation > 0) {
        const waveSpeed = escalation === 1 ? 2.1 : escalation === 2 ? 3.1 : 4.2;
        const wave = Math.sin(chaser.t * waveSpeed + chaser.phaseSeed + index * 0.35);
        toolAngle = escalation === 1
          ? Math.max(0, wave) * 0.12
          : wave * (0.10 + escalation * 0.035);

        if (escalation >= 2) {
          const stompSpeed = escalation === 2 ? 1.25 : 1.85;
          const stompCycle = (chaser.t * stompSpeed + index * 0.19) % 1;
          if (stompCycle < 0.18) {
            const stompProgress = stompCycle / 0.18;
            y -= Math.sin(stompProgress * Math.PI) * (escalation === 2 ? 1.5 : 2.3);
            drawLandingDust(x, CHASER_GROUND_Y + 1, stompProgress);
          }
        }
      }

      if (finalSequence.active && finalSequence.phase === "rush") {
        const p = easeInOut(clamp(finalSequence.t / 1.05, 0, 1));
        x = lerp(normalX, finalTarget.x, p);
        y = lerp(y, finalTarget.y, p) - Math.sin(p * Math.PI) * (9 + (index % 4) * 3);
        runPhase = finalSequence.t * (27 + index % 4) + index;
      } else if (finalSequence.active && finalSequence.phase === "destroy") {
        x = finalTarget.x + Math.sin(finalSequence.t * (17 + index % 5) + chaser.phaseSeed) * (3 + index % 3);
        y = finalTarget.y + Math.cos(finalSequence.t * (19 + index % 4) + index) * 2.5;
        runPhase = finalSequence.t * (25 + index % 5) + index;
      }

      drawPersonSprite(x, y, chaser.color, {
        tool: chaser.weapon,
        toolAngle,
        running: true,
        runPhase,
        scale,
        variant: chaser.phaseSeed
      });
    });
  }

  function drawAnimationDivider() {
    // Road, curb, sidewalk, and grass now provide their own visual separation.
  }

  function drawFiveLineStaff(topY, gap, leftX, rightX) {
    ctx.save();
    ctx.strokeStyle = "#172033";
    ctx.lineWidth = 2.4;
    ctx.setLineDash([]);
    ctx.beginPath();
    for (let line = 0; line < 5; line++) {
      const y = topY + line * gap;
      ctx.moveTo(leftX, y);
      ctx.lineTo(rightX, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawTargetBarline(x, topY, bottomY) {
    ctx.save();
    ctx.fillStyle = "rgba(246, 199, 68, 0.12)";
    ctx.fillRect(x - 9, topY - 13, 18, bottomY - topY + 26);
    ctx.strokeStyle = "#18324a";
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x, topY - 10);
    ctx.lineTo(x, bottomY + 14);
    ctx.stroke();
    ctx.restore();
  }

  function drawClef(type, x, topY, gap) {
    const isTreble = type === "treble";
    const fontSize = gap * 4;
    const referenceLineY = isTreble ? topY + gap * 3 : topY + gap;
    const smuflGlyph = isTreble ? SMUFL_G_CLEF : SMUFL_F_CLEF;
    const unicodeGlyph = isTreble ? UNICODE_G_CLEF : UNICODE_F_CLEF;
    ctx.save();
    ctx.fillStyle = "#111827";
    ctx.textAlign = "left";
    if (bravuraReady) {
      ctx.font = `${fontSize}px "Bravura"`;
      ctx.textBaseline = "alphabetic";
      ctx.fillText(smuflGlyph, x, referenceLineY);
    } else {
      ctx.font = `${fontSize}px "Noto Music", "Segoe UI Symbol", "Apple Symbols", serif`;
      ctx.textBaseline = "middle";
      ctx.fillText(unicodeGlyph, x, topY + gap * 2);
    }
    ctx.restore();
  }

  function drawStreamingNote(note) {
    const approach = approachProgressForX(note.x);
    const scale = NOTE_MIN_SCALE + (1 - NOTE_MIN_SCALE) * approach;
    const renderY = NOTE_VANISH_Y + (note.y - NOTE_VANISH_Y) * approach;
    const signRadius = STAFF_GAP * 0.62;
    const ledgerHalfWidth = STAFF_GAP * 1.08;

    ctx.save();
    ctx.translate(note.x, renderY);
    ctx.scale(scale, scale);
    ctx.lineCap = "round";
    ctx.strokeStyle = "#172033";
    ctx.lineWidth = 2.6;
    for (const ledgerY of note.ledgerYs) {
      const relativeLedgerY = ledgerY - note.y;
      ctx.beginPath();
      ctx.moveTo(-ledgerHalfWidth, relativeLedgerY);
      ctx.lineTo(ledgerHalfWidth, relativeLedgerY);
      ctx.stroke();
    }
    drawStopSignPath(0, 0, signRadius);
    ctx.fillStyle = "#d92f2f";
    ctx.strokeStyle = "#111827";
    ctx.lineWidth = 2.1;
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `bold ${Math.max(4.0, signRadius * 0.48)}px Arial, sans-serif`;
    ctx.fillText("STOP", 0, 0.35);
    ctx.restore();
  }
  function gameInit() {
    activeNotes = [];
    correctNotes = 0;
    mobSize = 0;
    lastEventMessage = "NEXT STOP: identify the front stop-sign note.";
    lastPitchIndex = -1;
    nextNoteId = 1;
    nextStopActorId = 1;
    lastUpdateTime = performance.now();
    busDamage = 0;
    busShake = 0;
    finalSequence = { active: false, phase: "none", t: 0, overlayQueued: false };
    panicPassengers = [];
    if (finalOverlayTimer) clearTimeout(finalOverlayTimer);
    finalOverlayTimer = null;
    buildScenery();
    panicPassengers = [];
    requestBravuraFont();
    spawnNoteAt(NOTE_SPAWN_X);
  }
  function gameUpdate() {
    const now = performance.now();
    const deltaSeconds = Math.min(0.05, Math.max(0, (now - lastUpdateTime) / 1000));
    lastUpdateTime = now;

    if (!finalSequence.active) {
      const noteDistance = currentNoteSpeed() * deltaSeconds;
      for (const note of activeNotes) note.x -= noteDistance;
      maintainNoteStream();
    }

    const sceneryFrozen = finalSequence.active && (finalSequence.phase === "rush" || finalSequence.phase === "destroy");
    const scrollSpeed = sceneryFrozen ? 0 : worldScrollSpeed();
    if (!sceneryFrozen) {
      roadStripeOffset -= scrollSpeed * deltaSeconds;
      busMotionClock += deltaSeconds;
      wheelSpin += scrollSpeed * deltaSeconds * 0.045;
      cloudOffset -= scrollSpeed * deltaSeconds * 0.035;
      updateBuildings(deltaSeconds, scrollSpeed);
    }
    updateStops(deltaSeconds);
    updateChasers(deltaSeconds);
    updateDoor(deltaSeconds);
    updateFinalSequence(deltaSeconds);

    if (!finalSequence.active) {
      while (running && activeNotes.length > 0 && activeNotes[0].x <= TARGET_BARLINE_X) {
        resolveFrontNote("missed");
      }
    }
  }

  function gameDraw() {
    ctx.clearRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);
    drawCityEnvironment();
    drawAnimationDivider();
    drawMobHud();
    drawFiveLineStaff(STAFF_TOP, STAFF_GAP, STAFF_LEFT, STAFF_RIGHT);
    drawClef(CLEF_TYPE, CLEF_X, STAFF_TOP, STAFF_GAP);
    for (let i = activeNotes.length - 1; i >= 0; i--) drawStreamingNote(activeNotes[i]);
    drawTargetBarline(TARGET_BARLINE_X, STAFF_TOP, STAFF_TOP + STAFF_GAP * 4);
  }

  function drawMobHud() {
    const boardX = 178;
    const boardY = 18;
    const boardWidth = 322;
    const boardHeight = 48;
    const radius = 11;
    const gap = 10;
    const totalWidth = MAX_MOB_SIZE * radius * 2 + (MAX_MOB_SIZE - 1) * gap;
    const startX = boardX + (boardWidth - totalWidth) / 2 + radius;
    const iconY = boardY + boardHeight / 2 + 1;

    ctx.save();
    roundedRectPath(boardX, boardY, boardWidth, boardHeight, 14);
    ctx.fillStyle = "rgba(18, 42, 65, 0.95)";
    ctx.strokeStyle = "#f6c744";
    ctx.lineWidth = 3;
    ctx.fill();
    ctx.stroke();
    for (let index = 0; index < MAX_MOB_SIZE; index++) {
      const isMissed = index < mobSize;
      const x = startX + index * (radius * 2 + gap);
      drawStopSignPath(x, iconY, radius);
      ctx.fillStyle = isMissed ? "#d92f2f" : "rgba(220, 229, 236, 0.16)";
      ctx.strokeStyle = "#1f2937";
      ctx.lineWidth = 1.8;
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
  }
  function gameInput(action) {
    if (!running || finalSequence.active || activeNotes.length === 0) return;
    const letter = String(action || "").toUpperCase();
    if (!/^[A-G]$/.test(letter)) return;
    if (letter === activeNotes[0].letter) resolveFrontNote("correct");
    else resolveFrontNote("wrong");
  }
function gamePointer() {
    /* Pointer input remains intentionally unused in Bass Bus. */
  }
  function gameStop() {
    activeNotes = [];
    sceneryBuildings = [];
    stopActors = [];
    chasers = [];
    busDoorHold = 0;
    busDoorOpen = 0;
    roadStripeOffset = 0;
    busMotionClock = 0;
    wheelSpin = 0;
    cloudOffset = 0;
    busDamage = 0;
    busShake = 0;
    finalSequence = { active: false, phase: "none", t: 0, overlayQueued: false };
    panicPassengers = [];
    if (finalOverlayTimer) clearTimeout(finalOverlayTimer);
    finalOverlayTimer = null;
    lastUpdateTime = 0;
    resetJoystick(sticks.left);
    resetJoystick(sticks.right);
  }


    const resizeObserver = new ResizeObserver(() => {
      scaleAppToFrame();
      resetJoystick(sticks.left);
      resetJoystick(sticks.right);
      if (!running) {
        resetGameCanvasTransform();
        gameDraw();
      }
    });

    resizeObserver.observe(appFrame);

    window.addEventListener("orientationchange", () => {
      setTimeout(() => {
        scaleAppToFrame();
        resetJoystick(sticks.left);
        resetJoystick(sticks.right);
        if (!running) {
        resetGameCanvasTransform();
        gameDraw();
      }
      }, 250);
    });

    window.MobileArcadeShell = {
      canvas,
      ctx,
      gameWidth: GAME_CANVAS_LOGICAL_WIDTH,
      gameHeight: GAME_CANVAS_LOGICAL_HEIGHT,
      getCanvasSize: getGameCanvasSize,
      scaleGameCanvasBackingStore,
      resetGameCanvasTransform,
      sticks,
      setScore,
      addScore,
      setMessage,
      endGame,
      soundCorrect,
      soundWin,
      soundLose,
      getAudio,
      savePlayers,
      loadPlayers,
      openMenu: openShellMenu,
      closeMenu: closeShellMenu,
      exitToPlayerMenu,
      saveCurrentScoreForSelectedPlayer,
      registerMenuTab: registerShellMenuTab,
      updateMenuTab: updateShellMenuTab,
      configureControls: configureMobileControls,
      setFirstTimeHelpVersion
    };

    scaleAppToFrame();
    loadPlayers();
    resetJoystick(sticks.left);
    resetJoystick(sticks.right);
    configureMobileControls({
      showDpad: false,
      showLeftJoystick: false,
      showRightJoystick: false,
      faceButtons: [],
      systemButtons: ["start"],
      labels: { start: "MENU" }
    });
    gameInit();
    gameDraw();
  </script>
