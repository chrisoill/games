<!-- Rhythm Snake - searchable player select version -->
<!-- Put this entire block into a Wix HTML embed. -->
<!-- Your backing track URL goes in BACKING_TRACK_URL inside the script. -->

<div id="rhythm-snake-widget">
  <div id="preview" role="button" tabindex="0" aria-label="Play Rhythm Snake">
    <svg class="cardArtwork" viewBox="0 0 540 699" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="rhythmSnakeSky" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#2d174f" />
          <stop offset="48%" stop-color="#142044" />
          <stop offset="100%" stop-color="#071321" />
        </linearGradient>

        <linearGradient id="rhythmSnakeTitle" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#efff72" />
          <stop offset="100%" stop-color="#69db55" />
        </linearGradient>

        <linearGradient id="rhythmSnakeBody" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#3aead1" />
          <stop offset="100%" stop-color="#168eae" />
        </linearGradient>

        <pattern id="rhythmSnakeGrid" width="36" height="36" patternUnits="userSpaceOnUse">
          <path d="M36 0H0V36" fill="none" stroke="#9fc6e8" stroke-opacity="0.09" stroke-width="2" />
        </pattern>

        <filter id="rhythmSnakeShadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000000" flood-opacity="0.42" />
        </filter>

        <filter id="rhythmSnakeGlow" x="-45%" y="-45%" width="190%" height="190%">
          <feGaussianBlur stdDeviation="6" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <rect width="540" height="699" fill="url(#rhythmSnakeSky)" />
      <rect width="540" height="699" fill="url(#rhythmSnakeGrid)" />

      <g opacity="0.16" stroke="#d8eeff" stroke-width="4">
        <path d="M-20 165H560" />
        <path d="M-20 183H560" />
        <path d="M-20 201H560" />
        <path d="M-20 219H560" />
        <path d="M-20 237H560" />
        <path d="M-20 532H560" />
        <path d="M-20 550H560" />
        <path d="M-20 568H560" />
        <path d="M-20 586H560" />
        <path d="M-20 604H560" />
      </g>

      <path d="M-42 520 C86 415, 173 642, 301 523 S463 367, 580 425" fill="none" stroke="#ff58a8" stroke-opacity="0.13" stroke-width="72" />

      <g class="titleArtwork" filter="url(#rhythmSnakeShadow)">
        <text x="270" y="78" text-anchor="middle" fill="#081426" stroke="#081426" stroke-width="11" paint-order="stroke" font-family="Arial Black, Impact, sans-serif" font-size="52" letter-spacing="4">RHYTHM</text>
        <text x="270" y="78" text-anchor="middle" fill="#f8d99a" font-family="Arial Black, Impact, sans-serif" font-size="52" letter-spacing="4">RHYTHM</text>
        <text x="270" y="132" text-anchor="middle" fill="#081426" stroke="#081426" stroke-width="11" paint-order="stroke" font-family="Arial Black, Impact, sans-serif" font-size="52" letter-spacing="4">SNAKE</text>
        <text x="270" y="132" text-anchor="middle" fill="url(#rhythmSnakeTitle)" stroke="#dffb66" stroke-width="2" font-family="Arial Black, Impact, sans-serif" font-size="52" letter-spacing="4">SNAKE</text>
        <path d="M132 149 C199 164, 336 164, 408 148" fill="none" stroke="#ff5da9" stroke-width="10" stroke-linecap="round" />
        <circle cx="411" cy="147" r="6" fill="#ff5da9" />
      </g>

      <g class="equationBoard" transform="translate(48 191) rotate(-1)" filter="url(#rhythmSnakeShadow)">
        <rect width="444" height="100" rx="22" fill="#fff0b5" stroke="#08172d" stroke-width="7" />
        <rect x="12" y="12" width="420" height="76" rx="14" fill="#ffd863" stroke="#e6579c" stroke-width="4" />
        <g fill="#111d36" stroke="#111d36" stroke-linecap="round">
          <ellipse cx="78" cy="62" rx="14" ry="10" transform="rotate(-18 78 62)" />
          <path d="M90 59V25" stroke-width="8" />
          <path d="M139 50H181M160 31V69" stroke-width="7" />
          <ellipse cx="230" cy="62" rx="14" ry="10" transform="rotate(-18 230 62)" />
          <path d="M242 59V23" stroke-width="8" />
          <path d="M242 25Q273 31 261 54" fill="none" stroke-width="7" />
        </g>
        <text x="313" y="70" fill="#111d36" font-family="Arial Black, sans-serif" font-size="51">= ?</text>
      </g>

      <g class="rhythmFood" filter="url(#rhythmSnakeGlow)">
        <g transform="translate(70 350) rotate(-8)">
          <rect width="80" height="80" rx="20" fill="#ff6bad" stroke="#fff1bc" stroke-width="6" />
          <ellipse cx="35" cy="53" rx="14" ry="10" fill="#101d3c" transform="rotate(-18 35 53)" />
          <path d="M47 49V17" stroke="#101d3c" stroke-width="9" stroke-linecap="round" />
        </g>

        <g transform="translate(388 440) rotate(7)" opacity="0.86">
          <rect width="72" height="72" rx="18" fill="#ffd96a" stroke="#fff1bc" stroke-width="6" />
          <ellipse cx="29" cy="49" rx="12" ry="9" fill="#101d3c" transform="rotate(-18 29 49)" />
          <path d="M40 45V15" stroke="#101d3c" stroke-width="8" stroke-linecap="round" />
          <path d="M40 16Q64 21 55 42" fill="none" stroke="#101d3c" stroke-width="7" stroke-linecap="round" />
        </g>
      </g>

      <g class="snakeArtwork" filter="url(#rhythmSnakeShadow)">
        <g class="snakeTail">
          <rect x="56" y="577" width="67" height="67" rx="19" fill="#0f7397" stroke="#082036" stroke-width="7" />
          <rect x="111" y="529" width="67" height="67" rx="19" fill="url(#rhythmSnakeBody)" stroke="#082036" stroke-width="7" />
          <rect x="166" y="481" width="67" height="67" rx="19" fill="#55d87c" stroke="#082036" stroke-width="7" />
          <rect x="221" y="433" width="67" height="67" rx="19" fill="url(#rhythmSnakeBody)" stroke="#082036" stroke-width="7" />
          <rect x="276" y="385" width="67" height="67" rx="19" fill="#55d87c" stroke="#082036" stroke-width="7" />
          <rect x="331" y="337" width="67" height="67" rx="19" fill="url(#rhythmSnakeBody)" stroke="#082036" stroke-width="7" />
        </g>

        <g class="snakeHeadWrap" transform="translate(360 300)">
          <g class="snakeHead">
            <rect width="125" height="108" rx="31" fill="#d8fa55" stroke="#082036" stroke-width="8" />
            <circle cx="84" cy="32" r="16" fill="#fff7d9" stroke="#082036" stroke-width="6" />
            <circle cx="91" cy="33" r="6" fill="#082036" />
            <path d="M83 79Q99 89 113 75" fill="none" stroke="#082036" stroke-width="7" stroke-linecap="round" />
            <path d="M118 74H146L163 64M146 74L163 84" fill="none" stroke="#ff5da9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
          </g>
        </g>
      </g>
    </svg>

    <div class="cardDescription" aria-hidden="true">
      <span>Eat the rhythm that completes the equation.</span>
    </div>
  </div>

  <div id="gameWrap">
    <div id="menuScreen">
      <h1>Choose Player</h1>

      <div id="leaderboardBox">
        <h2>Leaderboard</h2>
        <ol id="leaderboardList"></ol>
      </div>

      <div id="playerPickerBox">
        <input id="playerSearchInput" placeholder="Search players..." autocomplete="off" />

        <select id="playerSelect" size="7" aria-label="Choose player"></select>

        <div id="selectedPlayerActions">
          <button id="resetSelectedPlayerBtn">Reset Selected</button>
          <button id="removeSelectedPlayerBtn">Remove Selected</button>
        </div>
      </div>

      <div id="addPlayerRow">
        <input id="newPlayerName" placeholder="New player name" />
        <button id="addPlayerBtn">Add Player</button>
      </div>

      <p id="selectedPlayerText">No player selected</p>
      <button id="startGameBtn">Start Game</button>
      <button id="closeBtn">Exit</button>
    </div>

    <div id="gameScreen">
      <div id="topBar">
        <div>Player: <span id="playerName"></span> | Score: <span id="score">0</span> | Best: <span id="bestScore">0</span></div>
        <div class="topBarActions">
          <button id="openShellMenuBtn" type="button">How to Play</button>
          <button id="playerMenuBtn">Player Menu</button>
          <button id="exitGameBtn">Exit</button>
        </div>
      </div>

      <div id="questionBox"></div>

      <div id="canvasHolder">
        <canvas id="gameCanvas" width="600" height="600"></canvas>

        <div id="gameOverBox">
          <h1>Game Over</h1>
          <p id="gameOverScore"></p>
          <button id="playAgainBtn">Play Again</button>
          <button id="backToMenuBtn">Player Menu</button>
        </div>
      </div>
    </div>

    <div id="shellMenu" aria-hidden="true">
      <div id="shellMenuBackdrop" data-shell-menu-close></div>
      <div id="shellMenuPanel" role="dialog" aria-modal="true" aria-label="Help">
        <div id="shellMenuHeader">
          <h2>Help</h2>
          <button id="shellMenuCloseBtn" type="button" aria-label="Close help">×</button>
        </div>
        <div id="shellMenuTabs" role="tablist" aria-label="Help tabs"></div>
        <div id="shellMenuBody"></div>
      </div>
    </div>
  </div>
</div>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
  }

  #rhythm-snake-widget {
    font-family: Arial, sans-serif;
    width: 100vw;
    height: 100dvh;
    min-height: 180px;
    overflow: hidden;
    box-sizing: border-box;
    background: #ffffff;
  }

  #preview {
    width: 100%;
    height: 100%;
    min-height: 180px;
    border: 3px solid #222;
    border-radius: 20px;
    background: #101d3c;
    box-sizing: border-box;
    overflow: hidden;
    position: relative;
    clip-path: inset(0 round 17px);
    cursor: pointer;
    isolation: isolate;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform 150ms ease, box-shadow 180ms ease, border-color 180ms ease;
  }

  #preview::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    border-radius: inherit;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.20), inset 0 0 44px rgba(0,0,0,0.24);
  }

  #preview::after {
    content: "";
    position: absolute;
    z-index: 5;
    border-radius: inherit;
    top: -65%;
    left: -38%;
    width: 34%;
    height: 230%;
    pointer-events: none;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    transform: rotate(18deg) translateX(-150%);
    transition: transform 560ms ease;
  }

  #preview:focus-visible {
    outline: 5px solid #fff1a8;
    outline-offset: -8px;
    border-color: #f7ff89;
  }

  #preview:active {
    transform: scale(0.988);
  }

  .cardArtwork {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    border-radius: inherit;
    overflow: hidden;
    clip-path: inset(0 round 17px);
    transform: scale(1.002);
    transform-origin: center;
    transition: transform 420ms cubic-bezier(.2,.75,.25,1), filter 260ms ease;
  }

  .snakeArtwork,
  .rhythmFood,
  .equationBoard,
  .titleArtwork,
  .snakeHeadWrap {
    transform-box: fill-box;
    transform-origin: center;
  }

  .snakeHead {
    animation: rhythmSnakeHeadBob 2.4s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 30% 70%;
  }

  .rhythmFood {
    animation: rhythmSnakeFoodFloat 2.8s ease-in-out infinite;
  }

  .cardDescription {
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 10px;
    z-index: 7;
    pointer-events: none;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 190ms ease, transform 220ms ease;
  }

  .cardDescription span {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 8px 9px;
    border: 1.5px solid rgba(239,255,114,0.76);
    border-radius: 9px;
    background: rgba(5,14,29,0.93);
    color: #f5f9ff;
    box-shadow: 0 7px 18px rgba(0,0,0,0.32);
    font-size: clamp(10px, 5.8vw, 12px);
    font-weight: 700;
    line-height: 1.18;
    text-align: left;
  }

  @keyframes rhythmSnakeHeadBob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-7px) rotate(-1.5deg); }
  }

  @keyframes rhythmSnakeFoodFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  @media (hover: hover) and (pointer: fine) {
    #preview:hover {
      border-color: #b9ff69;
      box-shadow: 0 14px 34px rgba(8,15,35,0.20);
    }

    #preview:hover::after {
      transform: rotate(18deg) translateX(520%);
    }

    #preview:hover .cardArtwork {
      transform: scale(1.018);
      filter: saturate(1.08) brightness(1.04);
    }

    #preview:hover .cardDescription {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #preview,
    #preview::after,
    .cardArtwork,
    .cardDescription,
    .snakeHead,
    .rhythmFood {
      animation: none !important;
      transition: none !important;
    }
  }

  button {
    font-size: 18px;
    padding: 10px 18px;
    margin: 6px;
    border-radius: 12px;
    border: 2px solid #222;
    cursor: pointer;
    background: white;
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  input,
  select {
    font-size: 18px;
    padding: 10px;
    border-radius: 10px;
    border: 2px solid #222;
    box-sizing: border-box;
  }

  #gameWrap {
    display: none;
    width: 100vw;
    height: 100vh;
    background: #101827;
    color: white;
    text-align: center;
    overflow: hidden;
  }

  #menuScreen,
  #gameScreen {
    width: 100%;

  }

  #menuScreen {
    overflow-y: auto;

  #leaderboardBox {
    max-width: 420px;

    padding: 12px;

    border-radius: 14px;
  }

  #leaderboardList {
    text-align: left;
    margin: 0 auto;

  }

  #playerPickerBox {
    max-width: 560px;

    border-radius: 14px;
    box-sizing: border-box;
  }

  #playerSearchInput {
    width: 100%;

  }

  #playerSelect {

  #playerSelect option {

  #selectedPlayerActions {

  .resetBtn,

  #addPlayerRow {

  #newPlayerName {

  #gameScreen {

  #topBar {

  #topBar .topBarActions {

  #topBar button {

  #openShellMenuBtn {

  #shellMenu {

  #shellMenuBackdrop {

  #shellMenuPanel {

    max-height: min(620px, 88vh);
    overflow: hidden;
    background: #101827;
    border: 3px solid white;
    border-radius: 18px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.38);
    display: grid;
    grid-template-rows: auto auto 1fr;
  }

  #shellMenuHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px 8px;
  }

  #shellMenuHeader h2 {
    margin: 0;
    font-size: 24px;
  }

  #shellMenuCloseBtn {
    width: 42px;
    height: 38px;

  #canvasHolder {

  #gameCanvas {

<script>
(() => {
  const BACKING_TRACK_URL = "https://static.wixstatic.com/mp3/8e8c0c_8b6b8e66a3c14b0ba1882d1be7eb3375.wav";
  // Put your Wix audio file URL between the quotes above.

  const MUSIC_FONT = "bold 30px 'Arial Unicode MS', 'Noto Music', 'Segoe UI Symbol', Arial, sans-serif";

  const preview = document.getElementById("preview");
  const closeBtn = document.getElementById("closeBtn");
  const gameWrap = document.getElementById("gameWrap");
  const menuScreen = document.getElementById("menuScreen");
  const gameScreen = document.getElementById("gameScreen");

  const leaderboardList = document.getElementById("leaderboardList");

  const playerSearchInput = document.getElementById("playerSearchInput");
  const playerSelect = document.getElementById("playerSelect");
  const resetSelectedPlayerBtn = document.getElementById("resetSelectedPlayerBtn");
  const removeSelectedPlayerBtn = document.getElementById("removeSelectedPlayerBtn");

  const newPlayerName = document.getElementById("newPlayerName");
  const addPlayerBtn = document.getElementById("addPlayerBtn");
  const startGameBtn = document.getElementById("startGameBtn");
  const selectedPlayerText = document.getElementById("selectedPlayerText");
  const exitGameBtn = document.getElementById("exitGameBtn");
  const playerMenuBtn = document.getElementById("playerMenuBtn");
  const playAgainBtn = document.getElementById("playAgainBtn");
  const backToMenuBtn = document.getElementById("backToMenuBtn");
  const gameOverBox = document.getElementById("gameOverBox");
  const gameOverScore = document.getElementById("gameOverScore");

  const playerNameEl = document.getElementById("playerName");
  const scoreEl = document.getElementById("score");
  const bestScoreEl = document.getElementById("bestScore");
  const questionBox = document.getElementById("questionBox");
  const openShellMenuBtn = document.getElementById("openShellMenuBtn");
  const shellMenu = document.getElementById("shellMenu");
  const shellMenuTabsEl = document.getElementById("shellMenuTabs");
  const shellMenuBody = document.getElementById("shellMenuBody");
  const shellMenuCloseBtn = document.getElementById("shellMenuCloseBtn");

  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  const STORAGE_KEY = "rhythmSnakePlayers_v9";

  // Desktop shell rule:
  // Phones and tablets redirect before fullscreen or desktop game code can run.
  const MOBILE_GAME_URL = "https://www.oillpianouniverse.com/mobile-games/rhythm-snake";

  function isIPadOSDevice() {
    const platform = navigator.platform || "";
    const touchPoints = Number(navigator.maxTouchPoints || 0);

    // Modern iPads can identify themselves as Macintosh desktop browsers.
    return platform === "MacIntel" && touchPoints > 1;
  }

  function isPhoneOrTabletDevice() {
    const userAgent = navigator.userAgent || "";
    const touchPoints = Number(navigator.maxTouchPoints || 0);

    if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(userAgent)) {
      return true;
    }

    if (navigator.userAgentData && navigator.userAgentData.mobile === true) {
      return true;
    }

    if (isIPadOSDevice()) {
      return true;
    }

    // Defensive tablet detection for browsers using a desktop-style user agent.
    const coarsePointer = window.matchMedia?.("(pointer: coarse)").matches === true;
    const noHover = window.matchMedia?.("(hover: none)").matches === true;
    const screenWidth = Number(window.screen?.width || window.innerWidth || 0);
    const screenHeight = Number(window.screen?.height || window.innerHeight || 0);
    const shortSide = Math.min(screenWidth, screenHeight);
    const longSide = Math.max(screenWidth, screenHeight);

    return (
      touchPoints > 0 &&
      coarsePointer &&
      noHover &&
      shortSide > 0 &&
      shortSide <= 1024 &&
      longSide <= 1440
    );
  }

  function redirectToMobileGame() {
    if (!MOBILE_GAME_URL) return false;

    try {
      window.top.location.href = MOBILE_GAME_URL;
    } catch {
      window.location.href = MOBILE_GAME_URL;
    }

    return true;
  }

  let players = {};
  let selectedPlayer = null;
  let tileCount = 30;
  let snake, direction, nextDirection, foods, score, gameLoop;
  let audioCtx = null;
  let allQuestionOptions = [];

  // Backing-track audio.
  // Web Audio gives tighter, more seamless looping than normal <audio>.loop.
  // The hidden HTMLAudio fallback keeps the game from going silent if Wix/browser CORS blocks decoding.
  let backingBuffer = null;
  let backingSource = null;
  let backingGain = null;
  let backingTrackLoading = null;
  let usingFallbackBackingTrack = false;

  const fallbackBackingTrack = new Audio();
  fallbackBackingTrack.src = BACKING_TRACK_URL;

  const rhythms = [
    { symbol: "𝅘𝅥𝅮", value: 0.5, type: "note" },
    { symbol: "𝅘𝅥", value: 1, type: "note" },
    { symbol: "𝄽", value: 1, type: "quarterRest" },
    { symbol: "𝅘𝅥.", value: 1.5, type: "note" },
    { symbol: "𝅗𝅥", value: 2, type: "note" },
    { symbol: "▰", value: 2, type: "halfRest" },
    { symbol: "𝅗𝅥.", value: 3, type: "note" },
    { symbol: "𝅝", value: 4, type: "note" },
    { symbol: "▰", value: 4, type: "wholeRest" }
  ];

  // Question pieces stay simple: exactly 2 visible rhythm components.
  // Eighth notes are individual only; no grouped eighth-note symbols are included.
  const components = rhythms.filter(r => [0.5, 1, 1.5, 2].includes(r.value));

  // Answers can now include eighth notes too, so subtraction can produce 0.5-beat answers.
  const answerRhythms = rhythms.filter(r => [0.5, 1, 1.5, 2, 3, 4].includes(r.value));

  function renderRhythmHTML(r) {
    if (r.type === "halfRest") {
      return `<span style="display:inline-block;position:relative;width:32px;height:28px;vertical-align:middle;">
        <span style="position:absolute;left:3px;right:3px;top:18px;border-top:3px solid currentColor;"></span>
        <span style="position:absolute;left:9px;top:11px;width:14px;height:8px;background:currentColor;"></span>
      </span>`;
    }

    if (r.type === "wholeRest") {
      return `<span style="display:inline-block;position:relative;width:32px;height:28px;vertical-align:middle;">
        <span style="position:absolute;left:3px;right:3px;top:9px;border-top:3px solid currentColor;"></span>
        <span style="position:absolute;left:9px;top:9px;width:14px;height:8px;background:currentColor;"></span>
      </span>`;
    }

    return `<span style="font-family:'Arial Unicode MS','Noto Music','Segoe UI Symbol',Arial,sans-serif;font-weight:bold;">${r.symbol}</span>`;
  }

  function buildAllQuestionOptions() {
    const options = [];
    const operators = ["+", "−"];

    components.forEach(left => {
      components.forEach(right => {
        operators.forEach(operator => {
          const rawTotal = operator === "+"
            ? left.value + right.value
            : left.value - right.value;

          // Keep only valid positive rhythm values that can be shown as answer choices.
          // Rounding to half-beat increments avoids tiny floating-point comparison errors.
          const total = Math.round(rawTotal * 2) / 2;
          if (total <= 0 || total > 4) return;

          const answers = answerRhythms.filter(r => r.value === total);

          answers.forEach(answer => {
            options.push({ left, right, operator, answer });
          });
        });
      });
    });

    return options;
  }

  allQuestionOptions = buildAllQuestionOptions();

  const shellMenuTabs = [
    {
      id: "instructions",
      label: "How to Play",
      html: `
        <h3>How to Play</h3>

        <ul>
          <li>Look at the rhythm equation at the top of the screen.</li>
          <li>Steer the snake into the rhythm symbol that makes the equation true.</li>
          <li>A correct rhythm gives you 1 point and shows a new equation.</li>
          <li>The run ends if you eat the wrong rhythm, hit the wall, or run into your own tail.</li>

        <p><strong>Tip:</strong> Keep your eyes on the equation first, then choose the matching rhythm on the board.</p>

    },
    {

      html: `

  let activeShellMenuTab = "instructions";

  openShellMenuBtn.addEventListener("click", () => openShellMenu("instructions"));

  shellMenu.addEventListener("click", event => {

  });

  // First-time-player help rule:
  // Named players see How to Play once per version. Guest sees it every time.
  const FIRST_TIME_HELP_VERSION = "rhythmSnakeHowToPlay_v1";

  function isGuestPlayer(name = selectedPlayer) {
    return String(name || "").trim().toLowerCase() === "guest";
  }

  function ensureSelectedPlayerRecord() {
    if (!selectedPlayer) return null;
    if (!players[selectedPlayer] || typeof players[selectedPlayer] !== "object") {
      players[selectedPlayer] = { best: 0, lastScore: 0 };
    }
    return players[selectedPlayer];
  }

  function shouldShowFirstTimeHelp() {
    const playerData = ensureSelectedPlayerRecord();
    if (!playerData) return false;

  }

  function markFirstTimeHelpSeen() {

  }

  function maybeOpenFirstTimeHowToPlay() {

    markFirstTimeHelpSeen();
    openShellMenu("instructions");

  function loadPlayers() {
    try {
      players = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    } catch {
      players = {};
    }

    if (selectedPlayer && !players[selectedPlayer]) {
      selectedPlayer = null;
    }

    renderPlayers();
    renderLeaderboard();

  function savePlayers() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(players));

  function renderLeaderboard() {
    leaderboardList.innerHTML = "";

    const ranked = Object.entries(players)
      .sort((a, b) => (b[1].best || 0) - (a[1].best || 0))
      .slice(0, 5);

    if (ranked.length === 0) {
      leaderboardList.innerHTML = "<li>No scores yet</li>";
      return;
    }

    ranked.forEach(([name, data]) => {

  }

  function resetRemoveConfirmButton() {
    removeSelectedPlayerBtn.dataset.confirming = "no";
    removeSelectedPlayerBtn.textContent = "Remove Selected";
    removeSelectedPlayerBtn.style.background = "";
  }

  function updateSelectedPlayerUI() {
    const hasSelection = selectedPlayer && players[selectedPlayer];

      ? `Selected: ${selectedPlayer}`

    removeSelectedPlayerBtn.disabled = !hasSelection;

  function renderPlayers() {
    playerSelect.innerHTML = "";

    const filter = playerSearchInput.value.trim().toLowerCase();

    const names = Object.keys(players).sort((a, b) => {
      return a.localeCompare(b, undefined, { sensitivity: "base" });
    });

    const filteredNames = names.filter(name => {
      return name.toLowerCase().includes(filter);
    });

    if (filteredNames.length === 0) {
      const option = document.createElement("option");
      option.disabled = true;
      option.value = "";

      if (names.length === 0) {
        option.textContent = "No saved players yet";
      } else {
        option.textContent = "No matching players";
      }

      playerSelect.appendChild(option);
    } else {
      filteredNames.forEach(name => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = `${name} — Best: ${players[name].best || 0}`;

        if (name === selectedPlayer) {
          option.selected = true;
        }

        playerSelect.appendChild(option);
      });
    }

    updateSelectedPlayerUI();
  }

  playerSearchInput.addEventListener("input", () => {
    resetRemoveConfirmButton();
    renderPlayers();

  playerSelect.addEventListener("change", () => {

    selectedPlayer = playerSelect.value;
    resetRemoveConfirmButton();
    updateSelectedPlayerUI();

  resetSelectedPlayerBtn.onclick = () => {

    players[selectedPlayer].lastScore = 0;

    renderPlayers();
    renderLeaderboard();

    if (removeSelectedPlayerBtn.dataset.confirming !== "yes") {
      removeSelectedPlayerBtn.dataset.confirming = "yes";
      removeSelectedPlayerBtn.textContent = "Confirm Remove";
      removeSelectedPlayerBtn.style.background = "#ff9f9f";

      setTimeout(() => {
        if (
          removeSelectedPlayerBtn.dataset.confirming === "yes" &&
          selectedPlayer === nameToRemove
        ) {
          resetRemoveConfirmButton();
        }
      }, 2500);

      return;
    }

    delete players[nameToRemove];

    selectedPlayer = null;
    savePlayers();

    resetRemoveConfirmButton();
    renderPlayers();
    renderLeaderboard();
  };

    menuScreen.style.display = "block";
    gameScreen.style.display = "none";

    gameOverBox.style.display = "none";
    gameScreen.style.display = "none";
    menuScreen.style.display = "block";

    renderLeaderboard();

  addPlayerBtn.onclick = () => {
    const name = newPlayerName.value.trim();

  async function openApp() {
    // Redirect before the desktop shell, audio preload, or fullscreen request starts.
    if (isPhoneOrTabletDevice() && redirectToMobileGame()) {
      return;

    gameWrap.style.display = "block";
    menuScreen.style.display = "block";
    gameScreen.style.display = "none";

  preview.addEventListener("keydown", event => {

    gameScreen.style.display = "grid";

  function getAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    return audioCtx;
  }

  async function loadBackingTrack() {
    if (!BACKING_TRACK_URL) return null;
    if (backingBuffer) return backingBuffer;

    if (!backingTrackLoading) {
      const ac = getAudio();

      backingTrackLoading = fetch(BACKING_TRACK_URL)
        .then(response => {
          if (!response.ok) {
            throw new Error("Backing track failed to load.");
          }
          return response.arrayBuffer();
        })
        .then(arrayBuffer => ac.decodeAudioData(arrayBuffer))
        .then(decodedBuffer => {
          backingBuffer = decodedBuffer;
          return backingBuffer;
        });
    }

    return backingTrackLoading;
  }

  async function startBackingTrack() {
    if (!BACKING_TRACK_URL) return;

    const ac = getAudio();

    if (ac.state === "suspended") {
      await ac.resume().catch(() => {});
    }

    stopBackingTrack();

    try {
      const buffer = await loadBackingTrack();
      if (!buffer) return;

      usingFallbackBackingTrack = false;

      backingGain = ac.createGain();
      backingGain.gain.value = 0.35;
      backingGain.connect(ac.destination);

      backingSource = ac.createBufferSource();
      backingSource.buffer = buffer;
      backingSource.loop = true;
      backingSource.connect(backingGain);

      // Tiny delay avoids edge cases where starting immediately after a stop can click.
      backingSource.start(ac.currentTime + 0.03);
    } catch {
      // Fallback: less perfect looping, but keeps music working if Web Audio decoding is blocked.
      usingFallbackBackingTrack = true;
      fallbackBackingTrack.currentTime = 0;
      fallbackBackingTrack.play().catch(() => {});
    }
  }

  function stopBackingTrack() {
    if (backingSource) {
      try {
        backingSource.stop();
      } catch {}

      try {
        backingSource.disconnect();
      } catch {}

      backingSource = null;
    }

    if (backingGain) {
      try {
        backingGain.disconnect();
      } catch {}

      backingGain = null;
    }

    if (usingFallbackBackingTrack) {
      fallbackBackingTrack.pause();
      fallbackBackingTrack.currentTime = 0;
      usingFallbackBackingTrack = false;
    }
  }

  function makeQuestion() {
    const option = allQuestionOptions[Math.floor(Math.random() * allQuestionOptions.length)];
    const correct = option.answer;

    let wrong;
    do {
      wrong = answerRhythms[Math.floor(Math.random() * answerRhythms.length)];
    } while (wrong.value === correct.value);

    questionBox.innerHTML = `${renderRhythmHTML(option.left)} ${option.operator} ${renderRhythmHTML(option.right)} = ?`;

    foods = [
      { x: 5, y: 5, rhythm: correct, correct: true },
      { x: 24, y: 24, rhythm: wrong, correct: false }
    ];

    placeFoodsSafely();
  }

  function placeFoodsSafely() {
    const pad = 1;
    const forbiddenRows = new Set(snake.map(p => p.y));
    const forbiddenCols = new Set(snake.map(p => p.x));
    const used = new Set();

    foods.forEach(food => {
      let placed = false;
      let attempts = 0;

      while (!placed && attempts < 500) {
        attempts++;

        const x = Math.floor(Math.random() * (tileCount - pad * 2)) + pad;
        const y = Math.floor(Math.random() * (tileCount - pad * 2)) + pad;
        const key = `${x},${y}`;

        const onSnake = snake.some(part => part.x === x && part.y === y);
        const sameRowOrColAsSnake = forbiddenRows.has(y) || forbiddenCols.has(x);

        if (!onSnake && !used.has(key) && !sameRowOrColAsSnake) {
          food.x = x;
          food.y = y;
          used.add(key);
          placed = true;
        }
      }

      if (!placed) {
        while (!placed) {
          const x = Math.floor(Math.random() * (tileCount - pad * 2)) + pad;
          const y = Math.floor(Math.random() * (tileCount - pad * 2)) + pad;
          const key = `${x},${y}`;
          const onSnake = snake.some(part => part.x === x && part.y === y);

          if (!onSnake && !used.has(key)) {
            food.x = x;
            food.y = y;
            used.add(key);
            placed = true;
          }
        }
      }
    });
  }

  function startGame() {
    closeShellMenu({ resume: false });
    gameOverBox.style.display = "none";

    score = 0;

    snake = [
      { x: 15, y: 15 },
      { x: 14, y: 15 },
      { x: 13, y: 15 }
    ];

    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };

    playerNameEl.textContent = selectedPlayer;
    scoreEl.textContent = score;
    bestScoreEl.textContent = players[selectedPlayer]?.best || 0;

    makeQuestion();
    startBackingTrack();

    clearInterval(gameLoop);
    gameLoop = setInterval(updateGame, 115);

    drawGame();
    maybeOpenFirstTimeHowToPlay();
  }

  function stopGame() {
    clearInterval(gameLoop);
  }

  function updateGame() {
    direction = nextDirection;

    const head = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y
    };

    if (
      head.x < 0 || head.x >= tileCount ||
      head.y < 0 || head.y >= tileCount ||
      snake.some(part => part.x === head.x && part.y === head.y)
    ) {
      loseGame("Crash!");
      return;
    }

    snake.unshift(head);

    const eatenIndex = foods.findIndex(food => {
      return food.x === head.x && food.y === head.y;
    });

    if (eatenIndex >= 0) {
      const eaten = foods[eatenIndex];

      if (!eaten.correct) {
        loseGame("Wrong rhythm!");
        return;
      }

      score++;
      scoreEl.textContent = score;

      soundEat();

      if (score % 5 === 0) {
        soundWin();
      }

      makeQuestion();
    } else {
      snake.pop();
    }

    drawGame();
  }

  function drawGame() {
    const tileSize = canvas.width / tileCount;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#f7fbff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "#dbe7f5";
    ctx.lineWidth = 1;

    for (let i = 0; i <= tileCount; i++) {
      ctx.beginPath();
      ctx.moveTo(i * tileSize, 0);
      ctx.lineTo(i * tileSize, canvas.height);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, i * tileSize);
      ctx.lineTo(canvas.width, i * tileSize);
      ctx.stroke();
    }

    foods.forEach(food => drawRhythmSymbol(food, tileSize));

    snake.forEach((part, index) => {
      ctx.fillStyle = index === 0 ? "#111827" : "#2563eb";
      roundRect(
        part.x * tileSize + 2,
        part.y * tileSize + 2,
        tileSize - 4,
        tileSize - 4,
        6
      );
      ctx.fill();
    });
  }

  function drawRhythmSymbol(food, tileSize) {
    const cx = food.x * tileSize + tileSize / 2;
    const cy = food.y * tileSize + tileSize / 2;

    const NOTE_X_NUDGE = 0;
    const NOTE_Y_NUDGE = -7;

    ctx.fillStyle = "#111827";
    ctx.strokeStyle = "#111827";
    ctx.lineWidth = 2.4;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    if (food.rhythm.type === "halfRest") {
      ctx.beginPath();
      ctx.moveTo(cx - 9, cy + 7);
      ctx.lineTo(cx + 9, cy + 7);
      ctx.stroke();

      ctx.fillRect(cx - 7, cy, 14, 7);
      return;
    }

    if (food.rhythm.type === "wholeRest") {
      ctx.beginPath();
      ctx.moveTo(cx - 9, cy - 7);
      ctx.lineTo(cx + 9, cy - 7);
      ctx.stroke();

      ctx.fillRect(cx - 7, cy - 7, 14, 7);
      return;
    }

    ctx.font = MUSIC_FONT;
    ctx.fillText(
      food.rhythm.symbol,
      cx + NOTE_X_NUDGE,
      cy + NOTE_Y_NUDGE
    );
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function loseGame(reason) {
    stopGame();
    soundLose();

    players[selectedPlayer].lastScore = score;

    if (score > (players[selectedPlayer].best || 0)) {
      players[selectedPlayer].best = score;
    }

    savePlayers();
    renderLeaderboard();

    gameOverScore.textContent = `${reason} Score: ${score}. Best: ${players[selectedPlayer].best}`;
    gameOverBox.style.display = "block";
  }

  function setDirection(dir) {
    if (dir === "up" && direction.y !== 1) {
      nextDirection = { x: 0, y: -1 };
    }

    if (dir === "down" && direction.y !== -1) {
      nextDirection = { x: 0, y: 1 };
    }

    if (dir === "left" && direction.x !== 1) {
      nextDirection = { x: -1, y: 0 };
    }

    if (dir === "right" && direction.x !== -1) {
      nextDirection = { x: 1, y: 0 };
    }
  }

  document.addEventListener("keydown", e => {
    if (shellMenu && shellMenu.classList.contains("is-open")) {
      if (e.key === "Escape") {
        e.preventDefault();
        closeShellMenu();
      }
      return;
    }

    if (gameScreen.style.display !== "grid") return;

    if (e.key.toLowerCase() === "m") {
      e.preventDefault();
      openShellMenu("instructions");
      return;
    }

    if (e.key === "ArrowUp" || e.key.toLowerCase() === "w") {
      e.preventDefault();
      setDirection("up");
    }

    if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") {
      e.preventDefault();
      setDirection("down");
    }

    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
      e.preventDefault();
      setDirection("left");
    }

    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
      e.preventDefault();
      setDirection("right");
    }
  });

  function beep(freq, duration, type = "sine", volume = 0.08) {
    const ac = getAudio();
    const osc = ac.createOscillator();
    const gain = ac.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(volume, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);

    osc.connect(gain);
    gain.connect(ac.destination);

    osc.start();
    osc.stop(ac.currentTime + duration);
  }

  function soundEat() {
    beep(660, 0.08, "square", 0.06);
    setTimeout(() => beep(880, 0.08, "square", 0.05), 70);
  }

  function soundWin() {
    [523, 659, 784, 1046].forEach((n, i) => {
      setTimeout(() => beep(n, 0.12, "triangle", 0.06), i * 90);
    });
  }

  function soundLose() {
    [300, 220, 160, 100].forEach((n, i) => {
      setTimeout(() => beep(n, 0.16, "sawtooth", 0.05), i * 120);
    });
  }
})();
</script>
