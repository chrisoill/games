      ctx.lineWidth = 5 + pulse * 4;
      ctx.shadowColor = "rgba(56,189,248,0.9)";
      ctx.shadowBlur = 12 + pulse * 12;
      ctx.beginPath();
      ctx.moveTo(CB_FIELD_LEFT, CB_DANGER_Y);
      ctx.quadraticCurveTo(CB_FIELD_CENTER, CB_DANGER_Y - 8 - pulse * 8, CB_FIELD_RIGHT, CB_DANGER_Y);
      ctx.stroke();
      ctx.restore();
    }
  }
  function cbDrawFeedbackHud() {
    cbScorePopups.forEach(item => {
      const alpha = Math.max(0, Math.min(1, item.remaining / Math.max(0.001, item.duration)));
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#f8fafc";
      ctx.font = `bold ${item.size}px Arial, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(item.text, item.x, item.y);
      ctx.restore();
    });

    if (cbCeilingDropFlash > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, cbCeilingDropFlash * 2);
      ctx.fillStyle = "#b91c1c";
      ctx.font = "bold 15px Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.fillText("DROP", CB_TIMER_X, CB_DANGER_Y + 27);
      ctx.restore();
    }

    ctx.save();
    ctx.fillStyle = "#f8fafc";
    ctx.textAlign = "left";
    ctx.textBaseline = "bottom";
    ctx.font = "bold 18px Arial, sans-serif";
    ctx.fillText(cbLastChordText || "", CB_LAUNCHER_X + 54, 492);
    ctx.font = "bold 14px Arial, sans-serif";
    ctx.fillText(`BURST ${cbBubblesBurstCount}`, CB_LAUNCHER_X + 54, 516);

    const counterX = CB_FIELD_RIGHT - 42;
    const fireY = 454;
    const waterY = 482;
    if (cbPendingFireStacks > 0 || cbWaterBarrierCharges > 0) {
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.font = "bold 16px Arial, sans-serif";
    }
    if (cbPendingFireStacks > 0) {
      cbDrawFlameGlyph(counterX, fireY, 22, "#fb923c");
      ctx.fillStyle = "#fed7aa";
      ctx.fillText(String(cbPendingFireStacks), counterX + 18, fireY + 1);
    }
    if (cbWaterBarrierCharges > 0) {
      cbDrawDropGlyph(counterX, waterY, 22, "#38bdf8");
      ctx.fillStyle = "#bae6fd";
      ctx.fillText(String(cbWaterBarrierCharges), counterX + 18, waterY + 1);
    }
    ctx.restore();
  }

  function cbCellCenter(row, col) {
    const columns = cbColumnsForRow(row);
    const span = (columns - 1) * CB_X_SPACING;
    const firstX = CB_FIELD_CENTER - span / 2;
    return {
      x: firstX + col * CB_X_SPACING,
      y: CB_BOARD_TOP + (row - cbTopRow) * CB_ROW_SPACING
    };
  }

  function cbVisualCellCenter(row, col) {
    const center = cbCellCenter(row, col);
    return { x: center.x, y: center.y + cbBoardVisualOffsetY };
  }

  function cbNeighbors(row, col) {
    const result = [];
    const diagonalCols = cbRowParity(row) === 0 ? [col - 1, col] : [col, col + 1];
    const possible = [
      [row, col - 1],
      [row, col + 1],
      [row - 1, diagonalCols[0]],
      [row - 1, diagonalCols[1]],
      [row + 1, diagonalCols[0]],
      [row + 1, diagonalCols[1]]
    ];

    possible.forEach(([nextRow, nextCol]) => {
      if (cbCellIsValid(nextRow, nextCol)) result.push({ row: nextRow, col: nextCol });
    });

    return result;
  }

  function cbRoundedRectPath(x, y, width, height, radius) {
    const r = Math.max(0, Math.min(radius, width / 2, height / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + width - r, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + r);
    ctx.lineTo(x + width, y + height - r);
    ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
    ctx.lineTo(x + r, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }


  function cbBubbleStyle(pc) {
    return CB_NOTE_STYLES[cbBubblePc(pc)];
  }

  function cbSpecialVisual(power) {
    return CB_SPECIAL_VISUALS[power] || null;
  }

  function cbDrawNoteBadge(x, y, radius, label, ringColor) {
    const width = Math.max(26, radius * 1.30);
    const height = Math.max(14, radius * 0.60);
    ctx.save();
    ctx.fillStyle = "rgba(15,23,42,0.82)";
    ctx.strokeStyle = ringColor || "rgba(255,255,255,0.35)";
    ctx.lineWidth = 1.2;
    cbRoundedRectPath(x - width / 2, y - height / 2, width, height, height / 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#f8fafc";
    ctx.font = `bold ${Math.max(12, Math.round(radius * 0.46))}px Arial, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(label, x, y + 0.5);
    ctx.restore();
  }

  function cbDrawTextGlyph(text, x, y, size, color) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.font = `bold ${Math.round(size)}px Arial, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  function cbDrawGhostGlyph(x, y, size, color) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x - size * 0.42, y + size * 0.22);
    ctx.lineTo(x - size * 0.42, y - size * 0.05);
    ctx.quadraticCurveTo(x - size * 0.38, y - size * 0.45, x, y - size * 0.45);
    ctx.quadraticCurveTo(x + size * 0.38, y - size * 0.45, x + size * 0.42, y - size * 0.05);
    ctx.lineTo(x + size * 0.42, y + size * 0.22);
    ctx.lineTo(x + size * 0.24, y + size * 0.08);
    ctx.lineTo(x + size * 0.08, y + size * 0.22);
    ctx.lineTo(x - size * 0.08, y + size * 0.08);
    ctx.lineTo(x - size * 0.24, y + size * 0.22);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#0f172a";
    ctx.beginPath();
    ctx.arc(x - size * 0.12, y - size * 0.08, size * 0.05, 0, Math.PI * 2);
    ctx.arc(x + size * 0.12, y - size * 0.08, size * 0.05, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function cbDrawRocketGlyph(x, y, size, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, -size * 0.42);
    ctx.lineTo(size * 0.18, -size * 0.1);
    ctx.lineTo(size * 0.18, size * 0.25);
    ctx.lineTo(0, size * 0.38);
    ctx.lineTo(-size * 0.18, size * 0.25);
    ctx.lineTo(-size * 0.18, -size * 0.1);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#0f172a";
    ctx.beginPath();
    ctx.arc(0, -size * 0.02, size * 0.08, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fb7185";
    ctx.beginPath();
    ctx.moveTo(-size * 0.18, size * 0.1);
    ctx.lineTo(-size * 0.34, size * 0.18);
    ctx.lineTo(-size * 0.18, size * 0.28);
    ctx.moveTo(size * 0.18, size * 0.1);
    ctx.lineTo(size * 0.34, size * 0.18);
    ctx.lineTo(size * 0.18, size * 0.28);
    ctx.fill();
    ctx.fillStyle = "#f59e0b";
    ctx.beginPath();
    ctx.moveTo(0, size * 0.38);
    ctx.lineTo(size * 0.1, size * 0.6);
    ctx.lineTo(-size * 0.1, size * 0.6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function cbDrawFlameGlyph(x, y, size, color) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y - size * 0.42);
    ctx.bezierCurveTo(x + size * 0.26, y - size * 0.18, x + size * 0.24, y + size * 0.18, x, y + size * 0.4);
    ctx.bezierCurveTo(x - size * 0.28, y + size * 0.16, x - size * 0.24, y - size * 0.12, x, y - size * 0.42);
    ctx.fill();
    ctx.fillStyle = "#fef3c7";
    ctx.beginPath();
    ctx.moveTo(x, y - size * 0.18);
    ctx.bezierCurveTo(x + size * 0.14, y, x + size * 0.12, y + size * 0.15, x, y + size * 0.28);
    ctx.bezierCurveTo(x - size * 0.14, y + size * 0.12, x - size * 0.12, y - size * 0.02, x, y - size * 0.18);
    ctx.fill();
    ctx.restore();
  }

  function cbDrawDropGlyph(x, y, size, color) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y - size * 0.42);
    ctx.bezierCurveTo(x + size * 0.24, y - size * 0.12, x + size * 0.26, y + size * 0.18, x, y + size * 0.42);
    ctx.bezierCurveTo(x - size * 0.26, y + size * 0.18, x - size * 0.24, y - size * 0.12, x, y - size * 0.42);
    ctx.fill();
    ctx.restore();
  }

  function cbDrawEyeGlyph(x, y, size, color) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1.4, size * 0.08);
    ctx.beginPath();
    ctx.moveTo(x - size * 0.42, y);
    ctx.quadraticCurveTo(x, y - size * 0.28, x + size * 0.42, y);
    ctx.quadraticCurveTo(x, y + size * 0.28, x - size * 0.42, y);
    ctx.closePath();
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x, y, size * 0.1, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - size * 0.34, y + size * 0.24);
    ctx.lineTo(x + size * 0.34, y - size * 0.24);
    ctx.moveTo(x - size * 0.34, y - size * 0.24);
    ctx.lineTo(x + size * 0.34, y + size * 0.24);
    ctx.stroke();
    ctx.restore();
  }

  function cbDrawChomperGlyph(x, y, size, color) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, size * 0.38, Math.PI * 0.2, Math.PI * 1.8);
    ctx.lineTo(x, y);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#0f172a";
    ctx.lineWidth = 1.3;
    for (let i = -1; i <= 1; i += 1) {
      ctx.beginPath();
      ctx.moveTo(x + size * 0.08, y + i * size * 0.12);
      ctx.lineTo(x + size * 0.28, y + i * size * 0.18);
      ctx.stroke();
    }
    ctx.restore();
  }

  function cbDrawBombGlyph(x, y, size, color) {
    ctx.save();
    ctx.fillStyle = "#1f2937";
    ctx.beginPath();
    ctx.arc(x, y + size * 0.03, size * 0.26, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = color;
    ctx.fillRect(x - size * 0.06, y - size * 0.3, size * 0.12, size * 0.08);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y - size * 0.26);
    ctx.quadraticCurveTo(x + size * 0.22, y - size * 0.46, x + size * 0.34, y - size * 0.26);
    ctx.stroke();
    ctx.beginPath();
    for (let i = 0; i < 4; i += 1) {
      const a = (Math.PI * 2 * i) / 4;
      ctx.moveTo(x + size * 0.34, y - size * 0.26);
      ctx.lineTo(x + size * 0.34 + Math.cos(a) * size * 0.12, y - size * 0.26 + Math.sin(a) * size * 0.12);
    }
    ctx.stroke();
    ctx.restore();
  }

  function cbDrawClockGlyph(x, y, size, color) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1.4, size * 0.08);
    ctx.beginPath();
    ctx.arc(x, y, size * 0.28, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y - size * 0.16);
    ctx.moveTo(x, y);
    ctx.lineTo(x + size * 0.12, y + size * 0.06);
    ctx.stroke();
    ctx.restore();
  }

  function cbDrawSpecialGlyph(power, x, y, size, color) {
    switch (power) {
      case "wildcard":
        cbDrawTextGlyph("?", x, y, size * 1.1, color);
        break;
      case "bomb":
        cbDrawBombGlyph(x, y, size, color);
        break;
      case "time":
        cbDrawClockGlyph(x, y, size, color);
        break;
      case "lightning":
        cbDrawTextGlyph("⚡", x, y, size * 0.98, color);
        break;
      case "rocket":
        cbDrawRocketGlyph(x, y, size, color);
        break;
      case "ghost":
        cbDrawGhostGlyph(x, y, size, color);
        break;
      case "chomper":
        cbDrawChomperGlyph(x, y, size, color);
        break;
      case "xray":
        cbDrawEyeGlyph(x, y, size, color);
        break;
      case "fire":
        cbDrawFlameGlyph(x, y, size, color);
        break;
      case "water":
        cbDrawDropGlyph(x, y, size, color);
        break;
    }
  }

  function cbDrawBubble(x, y, bubbleValue, radius = CB_BUBBLE_RADIUS, options = {}) {
    const settled = options.settled !== false;
    const alpha = Number.isFinite(options.alpha) ? options.alpha : 1;
    const pc = cbBubblePc(bubbleValue);
    const power = cbBubblePower(bubbleValue);
    const style = cbBubbleStyle(pc);
    const special = power ? cbSpecialVisual(power) : null;

    ctx.save();
    ctx.globalAlpha = alpha;

    ctx.beginPath();
    ctx.arc(x, y + radius * 0.14, radius * 0.92, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(15,23,42,0.10)";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x, y, radius + 2, 0, Math.PI * 2);
    const wildcardGlowStyle = power === "wildcard" ? CB_NOTE_STYLES[Math.floor(cbRunSeconds * 9) % CB_NOTE_STYLES.length] : null;
    ctx.fillStyle = wildcardGlowStyle ? wildcardGlowStyle.glow : (special ? special.glow : style.glow);
    ctx.fill();

    const ring = ctx.createRadialGradient(x - radius * 0.28, y - radius * 0.34, radius * 0.18, x, y, radius * 1.02);
    ring.addColorStop(0, style.fillA);
    ring.addColorStop(0.58, style.fillB);
    ring.addColorStop(1, style.ring);

    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fillStyle = ring;
    ctx.fill();
    const wildcardCycleStyle = power === "wildcard" ? CB_NOTE_STYLES[Math.floor(cbRunSeconds * 9) % CB_NOTE_STYLES.length] : null;
    ctx.strokeStyle = wildcardCycleStyle ? wildcardCycleStyle.ring : (special ? special.ring : style.ring);
    ctx.lineWidth = special ? 4.2 : 2.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(x, y, radius * (special ? 0.78 : 0.72), 0, Math.PI * 2);
    ctx.fillStyle = special ? special.core : (settled ? "rgba(255,255,255,0.95)" : "rgba(248,250,252,0.94)");
    ctx.fill();
    if (!special) {
      ctx.strokeStyle = "rgba(255,255,255,0.28)";
      ctx.lineWidth = 1.25;
      ctx.stroke();
    }

    ctx.save();
    ctx.globalAlpha = 0.72;
    ctx.beginPath();
    ctx.ellipse(x - radius * 0.26, y - radius * 0.34, radius * 0.32, radius * 0.18, -0.42, 0, Math.PI * 2);
    ctx.fillStyle = style.accent;
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.40)";
    ctx.lineWidth = Math.max(1.6, radius * 0.08);
    ctx.beginPath();
    ctx.arc(x, y, radius * 0.84, Math.PI * 1.06, Math.PI * 1.54);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    const lowerShade = ctx.createRadialGradient(x, y + radius * 0.55, radius * 0.1, x, y + radius * 0.42, radius * 0.92);
    lowerShade.addColorStop(0, "rgba(15,23,42,0.18)");
    lowerShade.addColorStop(0.62, "rgba(15,23,42,0.055)");
    lowerShade.addColorStop(1, "rgba(15,23,42,0)");
    ctx.fillStyle = lowerShade;
    ctx.beginPath();
    ctx.arc(x, y, radius * 0.92, 0, Math.PI * 2);
    ctx.fill();

    const glintAngle = cbRunSeconds * 0.42 + pc * 0.81;
    const glintX = x + Math.cos(glintAngle) * radius * 0.23;
    const glintY = y - radius * 0.28 + Math.sin(glintAngle * 0.7) * radius * 0.08;
    ctx.fillStyle = "rgba(255,255,255,0.42)";
    ctx.beginPath();
    ctx.ellipse(glintX, glintY, radius * 0.09, radius * 0.04, -0.45, 0, Math.PI * 2);
    ctx.fill();

    for (let speck = 0; speck < 3; speck += 1) {
      const angle = pc * 1.31 + speck * 2.17;
      ctx.fillStyle = `rgba(255,255,255,${0.055 + speck * 0.018})`;
      ctx.beginPath();
      ctx.arc(x + Math.cos(angle) * radius * 0.48, y + Math.sin(angle) * radius * 0.43, Math.max(0.8, radius * 0.035), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    if (power === "wildcard") {
      const cycleIndex = Math.floor(cbRunSeconds * 9) % CB_NOTE_STYLES.length;
      const cycleStyle = CB_NOTE_STYLES[cycleIndex];
      ctx.save();
      ctx.shadowColor = cycleStyle.fillB;
      ctx.shadowBlur = Math.max(6, radius * 0.34);
      ctx.fillStyle = cycleStyle.ring;
      ctx.font = `bold ${Math.max(18, Math.round(radius * 1.02))}px Arial, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("?", x, y + 1);
      ctx.restore();
    } else if (special) {
      cbDrawSpecialGlyph(power, x, y - radius * 0.26, radius * 0.78, special.ring);
      cbDrawNoteBadge(x, y + radius * 0.38, radius, cbPitchName(pc), special.ring);
    } else {
      ctx.fillStyle = "#0f172a";
      ctx.font = `bold ${Math.max(14, Math.round(radius * 0.76))}px Arial, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(cbPitchName(pc), x, y + 1);
    }
    ctx.restore();
  }

function cbDrawBackground() {
    const ambient = 0.5 + 0.5 * Math.sin(cbRunSeconds * 0.32);
    const driftX = Math.sin(cbRunSeconds * 0.11) * 48;
    const driftY = Math.cos(cbRunSeconds * 0.09) * 22;

    const bg = ctx.createLinearGradient(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);
    bg.addColorStop(0, `rgb(${6 + Math.round(ambient * 3)},${15 + Math.round(ambient * 5)},31)`);
    bg.addColorStop(0.48, `rgb(15,${31 + Math.round(ambient * 7)},55)`);
    bg.addColorStop(1, `rgb(25,${43 + Math.round(ambient * 7)},70)`);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);

    // Slow moving atmospheric pools keep the chamber alive without distracting from play.
    ctx.save();
    ctx.globalCompositeOperation = "screen";
    const glowA = ctx.createRadialGradient(160 + driftX, 118 + driftY, 12, 160 + driftX, 118 + driftY, 245);
    glowA.addColorStop(0, "rgba(14,165,233,0.13)");
    glowA.addColorStop(0.55, "rgba(59,130,246,0.055)");
    glowA.addColorStop(1, "rgba(59,130,246,0)");
    ctx.fillStyle = glowA;
    ctx.fillRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);

    const glowB = ctx.createRadialGradient(570 - driftX * 0.65, 360 - driftY, 20, 570 - driftX * 0.65, 360 - driftY, 270);
    glowB.addColorStop(0, "rgba(129,140,248,0.10)");
    glowB.addColorStop(0.58, "rgba(99,102,241,0.04)");
    glowB.addColorStop(1, "rgba(99,102,241,0)");
    ctx.fillStyle = glowB;
    ctx.fillRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);
    ctx.restore();

    const chamberX = CB_FIELD_LEFT - 14;
    const chamberY = CB_BOARD_TOP - 10;
    const chamberW = CB_FIELD_RIGHT - CB_FIELD_LEFT + 28;
    const chamberH = CB_DANGER_Y - CB_BOARD_TOP + 120;

    ctx.save();
    ctx.shadowColor = "rgba(2,6,23,0.75)";
    ctx.shadowBlur = 24;
    ctx.shadowOffsetY = 9;
    const chamber = ctx.createLinearGradient(chamberX, chamberY, chamberX + chamberW, chamberY + chamberH);
    chamber.addColorStop(0, "rgba(255,255,255,0.115)");
    chamber.addColorStop(0.42, "rgba(148,163,184,0.045)");
    chamber.addColorStop(1, "rgba(2,6,23,0.25)");
    ctx.fillStyle = chamber;
    cbRoundedRectPath(chamberX, chamberY, chamberW, chamberH, 28);
    ctx.fill();
    ctx.restore();

    // Fine panel texture and faint third-chain geometry.
    ctx.save();
    cbRoundedRectPath(chamberX, chamberY, chamberW, chamberH, 28);
    ctx.clip();
    ctx.lineWidth = 1;
    for (let i = -8; i < 30; i += 1) {
      const x = chamberX + i * 24 + (cbRunSeconds * 3.2) % 24;
      ctx.strokeStyle = i % 2 === 0 ? "rgba(148,163,184,0.025)" : "rgba(56,189,248,0.018)";
      ctx.beginPath();
      ctx.moveTo(x, chamberY);
      ctx.lineTo(x - 150, chamberY + chamberH);
      ctx.stroke();
    }
    for (let row = 0; row < 5; row += 1) {
      const y = chamberY + 64 + row * 76 + Math.sin(cbRunSeconds * 0.28 + row) * 4;
      const startX = chamberX + 54 + (row % 2) * 38;
      ctx.strokeStyle = "rgba(125,211,252,0.035)";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (let node = 0; node < 6; node += 1) {
        const x = startX + node * 72;
        const ny = y + (node % 2 === 0 ? -8 : 8);
        if (node === 0) ctx.moveTo(x, ny);
        else ctx.lineTo(x, ny);
      }
      ctx.stroke();
      for (let node = 0; node < 6; node += 1) {
        const x = startX + node * 72;
        const ny = y + (node % 2 === 0 ? -8 : 8);
        ctx.fillStyle = "rgba(191,219,254,0.045)";
        ctx.beginPath();
        ctx.arc(x, ny, 3.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();

    // Deterministic drifting dust: no frame-to-frame flicker.
    ctx.save();
    for (let i = 0; i < 26; i += 1) {
      const lane = (i * 83) % 601;
      const speed = 4.5 + (i % 5) * 1.35;
      const x = CB_FIELD_LEFT + ((lane + cbRunSeconds * speed) % Math.max(1, CB_FIELD_RIGHT - CB_FIELD_LEFT));
      const y = CB_BOARD_TOP + 14 + ((i * 47 + cbRunSeconds * (2 + (i % 4))) % Math.max(1, CB_DANGER_Y - CB_BOARD_TOP - 18));
      const pulse = 0.5 + 0.5 * Math.sin(cbRunSeconds * (0.8 + (i % 3) * 0.23) + i * 1.7);
      ctx.fillStyle = `rgba(226,232,240,${0.025 + pulse * 0.045})`;
      ctx.beginPath();
      ctx.arc(x, y, 0.8 + (i % 3) * 0.45, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // Moving top illumination and row-drop response.
    ctx.save();
    const sweepX = CB_FIELD_LEFT - 90 + ((cbRunSeconds * 28) % (CB_FIELD_RIGHT - CB_FIELD_LEFT + 180));
    const beam = ctx.createLinearGradient(sweepX - 70, 0, sweepX + 70, 0);
    beam.addColorStop(0, "rgba(56,189,248,0)");
    beam.addColorStop(0.5, "rgba(224,242,254,0.15)");
    beam.addColorStop(1, "rgba(56,189,248,0)");
    ctx.fillStyle = beam;
    ctx.fillRect(CB_FIELD_LEFT, CB_BOARD_TOP - 3, CB_FIELD_RIGHT - CB_FIELD_LEFT, 11);

    const rowPulse = cbClamp01(cbCeilingDropFlash / 0.7);
    if (rowPulse > 0) {
      ctx.strokeStyle = `rgba(125,211,252,${0.18 + rowPulse * 0.58})`;
      ctx.lineWidth = 2 + rowPulse * 5;
      ctx.shadowColor = "rgba(56,189,248,0.75)";
      ctx.shadowBlur = 8 + rowPulse * 20;
      cbRoundedRectPath(chamberX, chamberY, chamberW, chamberH, 28);
      ctx.stroke();
      const scanY = cbLerp(CB_BOARD_TOP, CB_DANGER_Y, 1 - rowPulse);
      ctx.strokeStyle = `rgba(186,230,253,${rowPulse * 0.42})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(CB_FIELD_LEFT, scanY);
      ctx.lineTo(CB_FIELD_RIGHT, scanY);
      ctx.stroke();
    }
    ctx.restore();

    // Soft vignette keeps attention in the playfield.
    const vignette = ctx.createRadialGradient(CB_FIELD_CENTER, 265, 170, CB_FIELD_CENTER, 265, 470);
    vignette.addColorStop(0, "rgba(2,6,23,0)");
    vignette.addColorStop(0.72, "rgba(2,6,23,0.05)");
    vignette.addColorStop(1, "rgba(2,6,23,0.42)");
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);
  }
  function cbWeightedChoice(weights) {
    const total = weights.reduce((sum, value) => sum + Math.max(0, value), 0);
    if (total <= 0) return Math.floor(Math.random() * weights.length);

    let pick = Math.random() * total;
    for (let i = 0; i < weights.length; i += 1) {
      pick -= Math.max(0, weights[i]);
      if (pick <= 0) return i;
    }
    return weights.length - 1;
  }

  function cbFrontierCells() {
    const cells = new Map();

    if (cbBoard.size === 0) {
      for (let col = 0; col < cbColumnsForRow(cbTopRow); col += 1) {
        cells.set(cbKey(cbTopRow, col), { row: cbTopRow, col });
      }
      return Array.from(cells.values());
    }

    cbBoard.forEach((bubble, key) => {
      const { row, col } = cbParseKey(key);
      cbNeighbors(row, col).forEach(cell => {
        const nextKey = cbKey(cell.row, cell.col);
        if (!cbBoard.has(nextKey)) cells.set(nextKey, cell);
      });
    });

    for (let col = 0; col < cbColumnsForRow(cbTopRow); col += 1) {
      const topKey = cbKey(cbTopRow, col);
      if (!cbBoard.has(topKey)) cells.set(topKey, { row: cbTopRow, col });
    }

    return Array.from(cells.values());
  }

  function cbThirdSteps(pc) {
    return [cbMod7(pc + 2), cbMod7(pc - 2)];
  }

  function cbGeneratePitch() {
    const weights = Array(7).fill(0.5);

    cbFrontierCells().forEach(cell => {
      const adjacentPcs = [];
      cbNeighbors(cell.row, cell.col).forEach(neighbor => {
        const bubble = cbBoard.get(cbKey(neighbor.row, neighbor.col));
        if (bubble) adjacentPcs.push(bubble.pc);
      });
      if (adjacentPcs.length === 0) return;

      adjacentPcs.forEach(pc => {
        cbThirdSteps(pc).forEach(nextPc => {
          if (nextPc !== pc) weights[nextPc] += 0.9;
        });
      });

      if (adjacentPcs.length >= 2) {
        for (let i = 0; i < adjacentPcs.length; i += 1) {
          for (let j = i + 1; j < adjacentPcs.length; j += 1) {
            const a = adjacentPcs[i];
            const b = adjacentPcs[j];
            if (cbMod7(a + 2) === b) weights[cbMod7(b + 2)] += 1.2;
            if (cbMod7(a - 2) === b) weights[cbMod7(b - 2)] += 1.2;
            if (cbMod7(b + 2) === a) weights[cbMod7(a + 2)] += 1.2;
            if (cbMod7(b - 2) === a) weights[cbMod7(a - 2)] += 1.2;
          }
        }
      }
    });

    cbRecentPitches.slice(-3).forEach((pc, index) => {
      weights[pc] *= 0.45 + index * 0.12;
    });

    const selected = cbWeightedChoice(weights);
    cbRecentPitches.push(selected);
    if (cbRecentPitches.length > 10) cbRecentPitches.shift();
    return selected;
  }

  function cbFillQueue() {
    cbQueue = [];
    for (let i = 0; i < CB_QUEUE_LENGTH; i += 1) cbQueue.push(cbCreateBubble(cbGeneratePitch(), cbMaybePreviewPower("queue")));
  }

  function cbBeginFeedAnimation() {
    if (cbFeedAnimation || cbQueue.length === 0 || !running) return;
    const fromQueue = [...cbQueue];
    const nextPitch = fromQueue[fromQueue.length - 1];
    const generatedPitch = cbCreateBubble(cbGeneratePitch(), cbMaybePreviewPower("queue"));
    cbQueue = [generatedPitch, ...fromQueue.slice(0, -1)];
    cbCurrentPitch = nextPitch;
    cbFeedAnimation = {
      bubble: nextPitch,
      generatedPitch,
      fromQueue,
      elapsed: 0,
      exitPulse: false
    };
    cbSoundTubeTravel();
    if (cbMode === "idle") cbMode = "feeding";
  }

  function cbAdvanceQueue() {
    cbBeginFeedAnimation();
  }

  function cbAddOpeningRows(animate = false) {
    cbBoard.clear();
    cbTopRow = 0;
    const row = 0;
    const columns = cbColumnsForRow(row);
    for (let col = 0; col < columns; col += 1) {
      cbBoard.set(cbKey(row, col), cbCreateBubble(cbGeneratePitch(), cbMaybePreviewPower("board")));
    }
    cbRemoveUnsupported(false);
    if (animate) {
      cbBoardVisualOffsetY = -CB_ROW_SPACING;
      cbCeilingAnimation = { elapsed: 0, duration: CB_CEILING_ANIMATION_SECONDS, locksInput: false };
    }
  }

  function cbAddCeilingRow() {
    cbCeilingDropFlash = 0.7;
    cbSoundCeilingDrop();
    cbPendingCeilingDrop = false;
    cbTopRow -= 1;
    const columns = cbColumnsForRow(cbTopRow);
    const blockedCols = new Set();
    const fireHoleCount = Math.min(columns - 1, cbPendingFireStacks * CB_POWER_FIRE_HOLES);
    while (blockedCols.size < fireHoleCount) blockedCols.add(Math.floor(Math.random() * columns));
    const burnKeys = [];
    for (let col = 0; col < columns; col += 1) {
      if (Math.random() < 0.84) {
        const key = cbKey(cbTopRow, col);
        cbBoard.set(key, cbCreateBubble(cbGeneratePitch(), cbMaybePreviewPower("board")));
        if (blockedCols.has(col)) burnKeys.push(key);
      }
    }
    if (![...cbBoard.keys()].some(key => cbParseKey(key).row === cbTopRow)) {
      const safeCol = Math.floor(columns / 2);
      const key = cbKey(cbTopRow, safeCol);
      cbBoard.set(key, cbCreateBubble(cbGeneratePitch(), cbMaybePreviewPower("board")));
    }
    cbPendingFireStacks = 0;
    if (burnKeys.length > 0) {
      cbAddPowerAnimation({
        type: "fire-row",
        burnKeys: cbSnapshotKeys(new Set(burnKeys)),
        duration: 1.15,
        burnAt: 0.78,
        processed: false
      });
    }
    cbBoardVisualOffsetY = -CB_ROW_SPACING;
    cbCeilingAnimation = { elapsed: 0, duration: CB_CEILING_ANIMATION_SECONDS, locksInput: false };
  }

  function cbSetAim(point) {
    let dx = point.x - CB_LAUNCHER_X;
    let dy = point.y - CB_SHOT_START_Y;

    if (dy > -12) dy = -12;
    const maxHorizontal = -dy * 4.35;
    dx = Math.max(-maxHorizontal, Math.min(maxHorizontal, dx));

    cbAimX = CB_LAUNCHER_X + dx;
    cbAimY = CB_SHOT_START_Y + dy;
  }

  function cbAimVector() {
    const dx = cbAimX - CB_LAUNCHER_X;
    const dy = cbAimY - CB_SHOT_START_Y;
    const length = Math.max(1, Math.hypot(dx, dy));
    return { x: dx / length, y: dy / length };
  }

  function cbFire() {
    if (cbMode !== "idle" || cbProjectile) return;

    const direction = cbAimVector();
    cbProjectile = {
      x: CB_LAUNCHER_X,
      y: CB_SHOT_START_Y,
      vx: direction.x * CB_SHOT_SPEED,
      vy: direction.y * CB_SHOT_SPEED,
      pc: cbCurrentPitch.pc,
      power: cbCurrentPitch.power || null,
      ghostActive: cbCurrentPitch.power === "ghost",
      ghostInsideCluster: false,
      ghostEffectShown: false,
      age: 0
    };
    cbLauncherKick = 1;
    cbMuzzlePulse = 1;
    cbMode = "firing";
    cbSoundFire();
    cbAdvanceQueue();
  }

  function cbClosestBoardCollision(x, y, ignoredKey = null) {
    let best = null;
    let bestDistance = Infinity;

    cbBoard.forEach((bubble, key) => {
      if (key === ignoredKey) return;
      const { row, col } = cbParseKey(key);
      const center = cbVisualCellCenter(row, col);
      const distance = Math.hypot(center.x - x, center.y - y);
      if (distance < CB_BUBBLE_RADIUS * 2 - 2 && distance < bestDistance) {
        best = { key, row, col, distance };
        bestDistance = distance;
      }
    });

    return best;
  }

  function cbLocalTopLandingCollision(x) {
    const row = cbTopRow;
    const columns = cbColumnsForRow(row);
    const span = (columns - 1) * CB_X_SPACING;
    const firstX = CB_FIELD_CENTER - span / 2;
    const col = Math.max(0, Math.min(columns - 1, Math.round((x - firstX) / CB_X_SPACING)));
    const key = cbKey(row, col);
    if (!cbBoard.has(key)) return null;

    const center = cbVisualCellCenter(row, col);
    return {
      key,
      row,
      col,
      distance: Math.hypot(center.x - x, center.y - (CB_BOARD_TOP + cbBoardVisualOffsetY + CB_BUBBLE_RADIUS))
    };
  }

  function cbFindSnapCell(x, y, collision) {
    const candidates = new Map();

    function addCandidate(row, col) {
      if (!cbCellIsValid(row, col)) return;
      const key = cbKey(row, col);
      if (!cbBoard.has(key)) candidates.set(key, { row, col });
    }

    if (collision) {
      cbNeighbors(collision.row, collision.col).forEach(cell => addCandidate(cell.row, cell.col));
    }

    const animatedTopY = CB_BOARD_TOP + cbBoardVisualOffsetY;
    if (y <= animatedTopY + CB_BUBBLE_RADIUS * 1.4) {
      for (let col = 0; col < cbColumnsForRow(cbTopRow); col += 1) addCandidate(cbTopRow, col);
    }

    if (candidates.size === 0) {
      cbFrontierCells().forEach(cell => addCandidate(cell.row, cell.col));
    }

    let best = null;
    let bestDistance = Infinity;

    candidates.forEach(cell => {
      const center = cbVisualCellCenter(cell.row, cell.col);
      const distance = Math.hypot(center.x - x, center.y - y);
      if (distance < bestDistance) {
        best = cell;
        bestDistance = distance;
      }
    });

    return best;
  }

  function cbPathSignature(pathKeys) {
    return [...pathKeys].sort().join(';');
  }

  function cbFindThirdChainCandidates(startKey) {
    const startBubble = cbBoard.get(startKey);
    if (!startBubble) return [];

    const candidates = new Map();
    const startOptions = cbBubblePower(startBubble) === "wildcard" ? [0, 1, 2, 3, 4, 5, 6] : [startBubble.pc];

    function search(direction, startPc) {
      function expand(pathKeys, pathPcs) {
        if (pathKeys.length >= 3) {
          const signature = cbPathSignature(pathKeys);
          if (!candidates.has(signature)) {
            candidates.set(signature, {
              keys: new Set(pathKeys),
              sequencePcs: [...pathPcs],
              sequenceNames: pathPcs.map(pc => cbPitchName(pc)),
              impact: pathKeys.length,
              signature
            });
          }
        }

        const firstKey = pathKeys[0];
        const lastKey = pathKeys[pathKeys.length - 1];
        const firstPc = pathPcs[0];
        const lastPc = pathPcs[pathPcs.length - 1];
        const usedLetters = new Set(pathPcs);

        const prevExpected = cbMod7(firstPc - direction);
        if (!usedLetters.has(prevExpected)) {
          const { row, col } = cbParseKey(firstKey);
          cbNeighbors(row, col).forEach(cell => {
            const nextKey = cbKey(cell.row, cell.col);
            const bubble = cbBoard.get(nextKey);
            if (!bubble || pathKeys.includes(nextKey)) return;
            if (bubble.pc !== prevExpected && cbBubblePower(bubble) !== "wildcard") return;
            expand([nextKey, ...pathKeys], [prevExpected, ...pathPcs]);
          });
        }

        const nextExpected = cbMod7(lastPc + direction);
        if (!usedLetters.has(nextExpected)) {
          const { row, col } = cbParseKey(lastKey);
          cbNeighbors(row, col).forEach(cell => {
            const nextKey = cbKey(cell.row, cell.col);
            const bubble = cbBoard.get(nextKey);
            if (!bubble || pathKeys.includes(nextKey)) return;
            if (bubble.pc !== nextExpected && cbBubblePower(bubble) !== "wildcard") return;
            expand([...pathKeys, nextKey], [...pathPcs, nextExpected]);
          });
        }
      }

      expand([startKey], [startPc]);
    }

    startOptions.forEach(startPc => {
      search(2, startPc);
      search(-2, startPc);
    });

    return Array.from(candidates.values()).sort((a, b) => {
      if (b.keys.size !== a.keys.size) return b.keys.size - a.keys.size;
      return a.signature.localeCompare(b.signature);
    });
  }

  function cbCandidatesFromKey(startKey) {
    return cbFindThirdChainCandidates(startKey);
  }

  function cbBuildMergedThreadPcs(chains) {
    const adjacency = new Map();
    const firstSeen = [];

    function ensureNode(pc) {
      if (!adjacency.has(pc)) adjacency.set(pc, new Set());
      if (!firstSeen.includes(pc)) firstSeen.push(pc);
    }

    chains.forEach(chain => {
      chain.sequencePcs.forEach(pc => ensureNode(pc));
      for (let i = 0; i < chain.sequencePcs.length - 1; i += 1) {
        const a = chain.sequencePcs[i];
        const b = chain.sequencePcs[i + 1];
        ensureNode(a);
        ensureNode(b);
        adjacency.get(a).add(b);
        adjacency.get(b).add(a);
      }
    });

    if (firstSeen.length === 0) return [];

    const degreeOne = firstSeen.filter(pc => (adjacency.get(pc)?.size || 0) <= 1);
    const ordered = [];
    const visited = new Set();

    function walkFrom(start) {
      let current = start;
      let previous = null;
      while (current !== null && !visited.has(current)) {
        ordered.push(current);
        visited.add(current);
        const neighbors = [...(adjacency.get(current) || [])].filter(pc => pc !== previous && !visited.has(pc));
        if (neighbors.length === 0) break;
        neighbors.sort((a, b) => firstSeen.indexOf(a) - firstSeen.indexOf(b));
        previous = current;
        current = neighbors[0];
      }
    }

    if (degreeOne.length > 0) {
      degreeOne.sort((a, b) => firstSeen.indexOf(a) - firstSeen.indexOf(b));
      walkFrom(degreeOne[0]);
    } else {
      walkFrom(firstSeen[0]);
    }

    firstSeen.forEach(pc => {
      if (!visited.has(pc)) walkFrom(pc);
    });

    return ordered;
  }

  function cbMergeChainCandidates(candidates) {
    const maximal = candidates.filter((candidate, index) => {
      return !candidates.some((other, otherIndex) => {
        if (index === otherIndex || other.keys.size <= candidate.keys.size) return false;
        for (const key of candidate.keys) {
          if (!other.keys.has(key)) return false;
        }
        return true;
      });
    });

    const mergedKeys = new Set();
    maximal.forEach(candidate => candidate.keys.forEach(key => mergedKeys.add(key)));

    const threadPcs = cbBuildMergedThreadPcs(maximal);

    return {
      keys: mergedKeys,
      chains: maximal,
      sequencePcs: threadPcs,
      sequenceNames: threadPcs.map(pc => cbPitchName(pc)),
      impact: mergedKeys.size,
      signature: maximal.map(candidate => candidate.signature).sort().join('||')
    };
  }

  function cbFindAllChordCandidates() {
    const candidates = new Map();
    cbBoard.forEach((bubble, key) => {
      cbCandidatesFromKey(key).forEach(candidate => {
        if (!candidates.has(candidate.signature)) candidates.set(candidate.signature, candidate);
      });
    });
    return Array.from(candidates.values());
  }

  function cbCollectChordSignatures() {
    return new Set(cbFindAllChordCandidates().map(candidate => candidate.signature));
  }

  function cbUnsupportedKeys() {
    if (cbBoard.size === 0) return new Set();

    const connected = new Set();
    const queue = [];

    cbBoard.forEach((bubble, key) => {
      if (cbParseKey(key).row === cbTopRow) {
        connected.add(key);
        queue.push(key);
      }
    });

    while (queue.length > 0) {
      const key = queue.shift();
      const { row, col } = cbParseKey(key);
      cbNeighbors(row, col).forEach(cell => {
        const nextKey = cbKey(cell.row, cell.col);
        if (cbBoard.has(nextKey) && !connected.has(nextKey)) {
          connected.add(nextKey);
          queue.push(nextKey);
        }
      });
    }

    const unsupported = new Set();
    cbBoard.forEach((bubble, key) => {
      if (!connected.has(key)) unsupported.add(key);
    });
    return unsupported;
  }

  function cbRemoveUnsupported(scoreDrops = true) {
    const unsupported = cbUnsupportedKeys();
    const snapshots = cbSnapshotKeys(unsupported);
    unsupported.forEach(key => cbBoard.delete(key));

    if (scoreDrops && unsupported.size > 0) {
      cbRecordBurst(unsupported.size);
      cbAddFeedbackMarks("drop", snapshots, 0.82);
    }

    return unsupported.size;
  }

  function cbChordDisplayName(candidate) {
    return candidate.sequenceNames.join('-');
  }

  function cbNeighborKeys(key) {
    const { row, col } = cbParseKey(key);
    return cbNeighbors(row, col).map(cell => cbKey(cell.row, cell.col)).filter(nextKey => cbBoard.has(nextKey));
  }

  function cbSnapshotFromBoardKey(key) {
    const bubble = cbBoard.get(key);
    if (!bubble) return null;
    const { row, col } = cbParseKey(key);
    const center = cbCellCenter(row, col);
    return { key, x: center.x, y: center.y, pc: bubble.pc, power: bubble.power || null, bubble };
  }

  function cbKeysNearPoint(x, y, radius) {
    const matches = [];
    cbBoard.forEach((bubble, key) => {
      const { row, col } = cbParseKey(key);
      const center = cbCellCenter(row, col);
      if (Math.hypot(center.x - x, center.y - y) <= radius) matches.push(key);
    });
    return matches;
  }

  function cbChooseLightningTargets(pc, sourceKey) {
    const options = [];
    cbBoard.forEach((bubble, key) => {
      if (key === sourceKey) return;
      if (bubble.pc !== pc) return;
      const { row, col } = cbParseKey(key);
      const center = cbCellCenter(row, col);
      options.push({ key, center });
    });
    options.sort((a, b) => a.center.y - b.center.y || Math.abs(a.center.x - CB_FIELD_CENTER) - Math.abs(b.center.x - CB_FIELD_CENTER));
    return options.slice(0, CB_POWER_LIGHTNING_TARGETS).map(item => item.key);
  }

  function cbChooseRocketTargets(source) {
    const matches = [];
    cbBoard.forEach((bubble, key) => {
      const { row, col } = cbParseKey(key);
      const center = cbCellCenter(row, col);
      if (center.y <= source.y + 4 && Math.abs(center.x - source.x) <= CB_BUBBLE_RADIUS * 0.9) matches.push({ key, center });
    });
    matches.sort((a, b) => b.center.y - a.center.y);
    return matches.map(item => item.key);
  }

  function cbChooseChomperTargets(source) {
    const options = [];
    cbBoard.forEach((bubble, key) => {
      const degree = cbNeighborKeys(key).length;
      if (degree > 3) return;
      const { row, col } = cbParseKey(key);
      const center = cbCellCenter(row, col);
      const verticalPenalty = center.y < source.y - 10 ? 80 : 0;
      options.push({ key, score: Math.hypot(center.x - source.x, center.y - source.y) + verticalPenalty + degree * 10 });
    });
    options.sort((a, b) => a.score - b.score);
    return options.slice(0, CB_POWER_CHOMPER_TARGETS).map(item => item.key);
  }

  function cbApplySpecialEffect(effect) {
    const result = { removeKeys: new Set(), note: "" };
    const power = effect.power;
    const source = effect.source;
    if (!power || !source) return result;
    switch (power) {
      case "bomb": {
        result.removeKeys.add(source.key);
        const targets = cbNeighborKeys(source.key);
        targets.forEach(key => result.removeKeys.add(key));
        cbAddPowerAnimation({
          type: "bomb",
          x: source.x,
          y: source.y,
          targets: targets.map(key => cbSnapshotFromBoardKey(key)).filter(Boolean),
          duration: 1.08
        });
        result.note = "BOMB";
        break;
      }
      case "time":
        cbDropRemaining += CB_POWER_TIME_BONUS;
        result.removeKeys.add(source.key);
        cbAddPowerAnimation({ type: "time", x: source.x, y: source.y, toX: CB_TIMER_X, toY: CB_BOARD_TOP + 26, duration: 1.05 });
        result.note = `+${CB_POWER_TIME_BONUS} TIME`;
        break;
      case "lightning": {
        result.removeKeys.add(source.key);
        const targets = cbChooseLightningTargets(source.pc, source.key);
        targets.forEach(key => result.removeKeys.add(key));
        cbAddPowerAnimation({ type: "lightning", x: source.x, y: source.y, targets: targets.map(key => cbSnapshotFromBoardKey(key)).filter(Boolean), duration: 0.95 });
        result.note = "LIGHTNING";
        break;
      }
      case "rocket": {
        result.removeKeys.add(source.key);
        const targets = cbChooseRocketTargets(source);
        targets.forEach(key => result.removeKeys.add(key));
        cbAddPowerAnimation({
          type: "rocket",
          x: source.x,
          y: source.y,
          source,
          targets: targets.map(key => cbSnapshotFromBoardKey(key)).filter(Boolean),
          topY: CB_BOARD_TOP - 4,
          duration: Math.max(0.9, targets.length * 0.34)
        });
        result.note = "ROCKET";
        break;
      }
      case "chomper": {
        result.removeKeys.add(source.key);
        const targets = cbChooseChomperTargets(source);
        targets.forEach(key => result.removeKeys.add(key));
        cbAddPowerAnimation({ type: "chomper", source, targets: targets.map(key => cbSnapshotFromBoardKey(key)).filter(Boolean), duration: 1.35 });
        result.note = "CHOMPER";
        break;
      }
      case "fire":
        cbPendingFireStacks += 1;
        result.removeKeys.add(source.key);
        cbAddPowerAnimation({ type: "fire", x: source.x, y: source.y, duration: 1.0 });
        result.note = `FIRE x${cbPendingFireStacks}`;
        break;
      case "water":
        cbWaterBarrierCharges += 1;
        result.removeKeys.add(source.key);
        cbAddPowerAnimation({ type: "water", x: source.x, y: source.y, duration: 1.0 });
        result.note = `WATER x${cbWaterBarrierCharges}`;
        break;
      case "ghost":
        cbAssignPowerToNextDispenserBall("ghost");
        cbAddPowerAnimation({ type: "transfer", x: source.x, y: source.y, toX: CB_LAUNCHER_X, toY: CB_SHOT_START_Y, color: "rgba(196,181,253,0.95)", duration: 1.0 });
        result.note = "GHOST+";
        break;
      case "xray":
        cbAssignPowerToNextDispenserBall("xray");
        cbAddPowerAnimation({ type: "transfer", x: source.x, y: source.y, toX: CB_LAUNCHER_X, toY: CB_SHOT_START_Y, color: "rgba(103,232,249,0.95)", duration: 1.0 });
        result.note = "X-RAY+";
        break;
    }
    return result;
  }

  function cbApplyRemovalCascade(initialKeys, opts = {}) {
    const pendingRemovals = [];
    const pendingEffects = [];
    const removedDirect = [];
    const removedDrops = [];
    const alreadyQueued = new Set();
    const consumedKeys = new Set();
    let noteText = opts.noteText || "";
    let safety = 0;

    const queueRemovalSet = setLike => {
      const actual = new Set();
      setLike.forEach(key => {
        if (cbBoard.has(key) && !consumedKeys.has(key)) actual.add(key);
      });
      if (actual.size > 0) pendingRemovals.push(actual);
    };

    queueRemovalSet(initialKeys instanceof Set ? initialKeys : new Set(initialKeys));

    while ((pendingRemovals.length > 0 || pendingEffects.length > 0) && safety < CB_POWER_CHAIN_REACTION_LIMIT) {
      safety += 1;
      if (pendingRemovals.length > 0) {
        const removeSet = pendingRemovals.shift();
        const directSnapshots = cbSnapshotKeys(removeSet);
        directSnapshots.forEach(snapshot => {
          removedDirect.push(snapshot);
          consumedKeys.add(snapshot.key);
          cbBoard.delete(snapshot.key);
          if (snapshot.power) {
            const id = `${snapshot.key}:${snapshot.power}`;
            if (!alreadyQueued.has(id) && snapshot.power !== "wildcard") {
              alreadyQueued.add(id);
              pendingEffects.push({ power: snapshot.power, source: snapshot, cause: "removed" });
            }
          }
        });

        const unsupported = cbUnsupportedKeys();
        if (unsupported.size > 0) {
          const droppedSnapshots = cbSnapshotKeys(unsupported);
          droppedSnapshots.forEach(snapshot => {
            removedDrops.push(snapshot);
            consumedKeys.add(snapshot.key);
            cbBoard.delete(snapshot.key);
            if (snapshot.power) {
              const id = `${snapshot.key}:${snapshot.power}`;
              if (snapshot.power === "wildcard") {
                cbAddPowerAnimation({ type: "wildcard", x: snapshot.x, y: snapshot.y, duration: 0.8 });
              } else if (!alreadyQueued.has(id)) {
                alreadyQueued.add(id);
                pendingEffects.push({ power: snapshot.power, source: snapshot, cause: "dropped" });
              }
            }
          });
        }
      } else if (pendingEffects.length > 0) {
        const effect = pendingEffects.shift();
        const applied = cbApplySpecialEffect(effect);
        if (applied.note) noteText = applied.note;
        queueRemovalSet(applied.removeKeys);
      }
    }

    removedDirect.forEach((item, index) => {
      cbBurstAnimations.push({ ...item, index, elapsed: 0, duration: 0.34 });
    });

    const newFallingItems = [];
    removedDrops.forEach((item, index) => {
      const direction = ((Math.round(item.x) + index) % 2 === 0) ? -1 : 1;
      const fallingItem = {
        ...item,
        elapsed: 0,
        vx: direction * (22 + (index % 3) * 8),
        vy: -58 - (index % 4) * 12
      };
      cbFallingBubbles.push(fallingItem);
      newFallingItems.push(fallingItem);
    });

    if (removedDirect.length > 0) cbSoundBurst(removedDirect.length);
    if (newFallingItems.length > 0) cbSoundDrop(newFallingItems);

    if (removedDirect.length > 0 || removedDrops.length > 0) {
      cbRecordBurst(removedDirect.length + removedDrops.length);
      const directCenter = cbAverageSnapshots(removedDirect);
      if (noteText) cbAddScorePopup(noteText, directCenter.x, directCenter.y - 14, 0.92, 13);
    }

    if (cbBoard.size === 0) {
      cbAddScorePopup("BOARD CLEAR", CB_FIELD_CENTER, 250, 1.1, 16);
      cbSoundBoardClear();
      cbBoardClearDelay = 0.42;
    }

    cbStableChordSignatures = cbCollectChordSignatures();
    cbRoundAdvancePending = false;
    if (opts.deferDangerCheck) {
      cbMode = "resolving";
      return;
    }
    if (!cbCheckDanger()) {
      if (cbBoardClearDelay > 0) cbMode = "resolving";
      else cbMode = cbFeedAnimation ? "feeding" : "idle";
    }
  }

  function cbEvaluateXrayOptions() {
    if (!cbCurrentPitch || cbCurrentPitch.power !== "xray") return { links: [], cells: [] };
    const links = [];
    const seen = new Set();
    cbBoard.forEach((bubble, key) => {
      const { row, col } = cbParseKey(key);
      const centerA = cbVisualCellCenter(row, col);
      cbNeighbors(row, col).forEach(cell => {
        const nextKey = cbKey(cell.row, cell.col);
        const other = cbBoard.get(nextKey);
        if (!other) return;
        const a = bubble.pc;
        const b = other.pc;
        if (a === b) return;
        if (cbMod7(a + 2) !== b && cbMod7(a - 2) !== b) return;
        const signature = [key, nextKey].sort().join("|");
        if (seen.has(signature)) return;
        seen.add(signature);
        const centerB = cbVisualCellCenter(cell.row, cell.col);
        links.push({ a: centerA, b: centerB });
      });
    });

    const cells = [];
    cbFrontierCells().forEach(cell => {
      const tempKey = cbKey(cell.row, cell.col);
      cbBoard.set(tempKey, cbCreateBubble(cbCurrentPitch.pc));
      const candidates = cbCandidatesFromKey(tempKey);
      cbBoard.delete(tempKey);
      if (candidates.length > 0) cells.push({ ...cbVisualCellCenter(cell.row, cell.col), size: candidates[0].keys.size });
    });
    return { links, cells };
  }

  function cbDrawXrayHints() {
    const data = cbEvaluateXrayOptions();
    if (data.links.length === 0 && data.cells.length === 0) return;
    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    data.links.forEach(item => {
      ctx.strokeStyle = "rgba(103,232,249,0.28)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(item.a.x, item.a.y);
      ctx.lineTo(item.b.x, item.b.y);
      ctx.stroke();
    });
    data.cells.forEach(item => {
      ctx.strokeStyle = "rgba(34,211,238,0.9)";
      ctx.lineWidth = 2.5;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.arc(item.x, item.y, CB_BUBBLE_RADIUS + 6 + Math.min(6, item.size), 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    });
    ctx.restore();
  }

  function cbStartChainResolution(candidate) {
    const snapshotByKey = new Map();
    candidate.keys.forEach(key => {
      const { row, col } = cbParseKey(key);
      const center = cbCellCenter(row, col);
      const bubble = cbBoard.get(key);
      snapshotByKey.set(key, { key, x: center.x, y: center.y, pc: bubble ? bubble.pc : 0 });
    });

    const chainList = Array.isArray(candidate.chains) && candidate.chains.length > 0 ? candidate.chains : [candidate];
    const paths = chainList.map(chain => Array.from(chain.keys).map(key => snapshotByKey.get(key)).filter(Boolean));
    const snapshots = Array.from(snapshotByKey.values());

    cbResolutionAnimation = {
      candidate,
      snapshots,
      paths,
      elapsed: 0,
      duration: CB_CHAIN_LINK_SECONDS + Math.min(0.18, Math.max(0, paths.length - 1) * 0.05)
    };
    cbSoundChainLink(candidate.keys.size);
    cbMode = "resolving";
  }

  function cbFinishChainResolution(candidate) {
    const directKeys = new Set(candidate.keys);
    cbLastChordRoot = null;
    cbLastChordTypeId = "chain";
    cbLastChordTonePcs = [...candidate.sequencePcs];
    cbLastChordToneNames = [...candidate.sequenceNames];
    cbLastChordText = cbChordDisplayName(candidate);
    cbRoundChordCount += 1;
    cbApplyRemovalCascade(directKeys, { noteText: `CHAIN ×${directKeys.size}` });
  }

  function cbApplyChord(candidate) {
    cbStartChainResolution(candidate);
    return { direct: candidate.keys.size, dropped: 0, roundComplete: false };
  }

  function cbResolvePlacedBubble(placedKey) {
    const primaryCandidates = cbCandidatesFromKey(placedKey);
    if (primaryCandidates.length > 0) {
      cbStartChainResolution(cbMergeChainCandidates(primaryCandidates));
      return;
    }

    cbShotStreak = 0;
    cbStableChordSignatures = cbCollectChordSignatures();
    if (!cbCheckDanger()) cbMode = cbFeedAnimation ? "feeding" : "idle";
  }

  function cbSettleProjectile(collision = null) {
    if (!cbProjectile) return;

    const cell = cbFindSnapCell(cbProjectile.x, cbProjectile.y, collision);
    const firedPitch = cbProjectile.pc;
    const firedPower = (cbProjectile.power === "ghost" || cbProjectile.power === "xray") ? null : (cbProjectile.power || null);
    cbProjectile = null;

    if (!cell) {
      endGame("No open space.");
      return;
    }

    const placedKey = cbKey(cell.row, cell.col);
    cbBoard.set(placedKey, cbCreateBubble(firedPitch, firedPower));
    const impactCenter = cbVisualCellCenter(cell.row, cell.col);
    cbAddPowerAnimation({
      type: "settle-impact",
      x: impactCenter.x,
      y: impactCenter.y,
      color: cbBubbleStyle(firedPitch).fillA,
      seed: firedPitch * 0.73 + cell.col * 0.19,
      duration: 0.28
    });
    cbSoundImpact();
    cbResolvePlacedBubble(placedKey);
  }

  function cbUpdateProjectile(dt) {
    if (!cbProjectile) return;

    cbProjectile.age += dt;
    cbProjectile.x += cbProjectile.vx * dt;
    cbProjectile.y += cbProjectile.vy * dt;

    const leftBound = CB_FIELD_LEFT + CB_BUBBLE_RADIUS;
    const rightBound = CB_FIELD_RIGHT - CB_BUBBLE_RADIUS;

    if (cbProjectile.x <= leftBound) {
      cbProjectile.x = leftBound;
      cbProjectile.vx = Math.abs(cbProjectile.vx);
      cbSoundWallBounce();
    } else if (cbProjectile.x >= rightBound) {
      cbProjectile.x = rightBound;
      cbProjectile.vx = -Math.abs(cbProjectile.vx);
      cbSoundWallBounce();
    }

    const collision = cbClosestBoardCollision(cbProjectile.x, cbProjectile.y);
    const animatedTopContactY = CB_BOARD_TOP + cbBoardVisualOffsetY + CB_BUBBLE_RADIUS;

    if (cbProjectile.ghostActive) {
      if (collision) {
        cbProjectile.ghostInsideCluster = true;
        if (!cbProjectile.ghostEffectShown) {
          const speed = Math.max(1, Math.hypot(cbProjectile.vx, cbProjectile.vy));
          const ux = cbProjectile.vx / speed;
          const uy = cbProjectile.vy / speed;
          const center = cbVisualCellCenter(collision.row, collision.col);
          cbAddPowerAnimation({
            type: "ghost-pass",
            x: center.x,
            y: center.y,
            toX: center.x + ux * 96,
            toY: center.y + uy * 96,
            angle: Math.atan2(uy, ux),
            duration: 1.152
          });
          cbProjectile.ghostEffectShown = true;
        }
        return;
      }

      if (cbProjectile.ghostInsideCluster) {
        cbSettleProjectile(null);
        return;
      }
    } else if (collision) {
      cbSettleProjectile(collision);
      return;
    }

    if (cbProjectile && cbProjectile.y <= animatedTopContactY) {
      const localTopCollision = cbLocalTopLandingCollision(cbProjectile.x);
      cbSettleProjectile(localTopCollision);
    }
  }

  function cbCheckDanger() {
    if (!running) return false;
    if (cbWaterHitActive) return false;

    const crossedKeys = [];
    cbBoard.forEach((bubble, key) => {
      const cell = cbParseKey(key);
      const center = cbVisualCellCenter(cell.row, cell.col);
      if (center.y + CB_BUBBLE_RADIUS >= CB_DANGER_Y) crossedKeys.push(key);
    });

    if (crossedKeys.length > 0) {
      if (cbWaterBarrierCharges > 0) {
        const waterTargets = cbSnapshotKeys(new Set(crossedKeys));
        cbWaterBarrierCharges -= 1;
        cbWaterHitActive = true;
        cbMode = "resolving";
        cbAddPowerAnimation({
          type: "water-hit",
          targets: waterTargets,
          duration: 1.0,
          onComplete: () => {
            cbWaterHitActive = false;
            if (!running) return;
            if (!cbCheckDanger()) {
              if (cbBoardClearDelay > 0) cbMode = "resolving";
              else cbMode = cbFeedAnimation ? "feeding" : "idle";
            }
          }
        });
        cbApplyRemovalCascade(new Set(crossedKeys), {
          noteText: `WATER x${cbWaterBarrierCharges}`,
          deferDangerCheck: true
        });
        return false;
      }
      endGame("The bubbles reached the line.");
      return true;
    }
    return false;
  }

  function cbCurrentDropInterval() {
    const completedSteps = Math.floor(cbRunSeconds / CB_DROP_STEP_EVERY_SECONDS);
    return Math.max(CB_MIN_DROP_SECONDS, cbRoundStartSeconds - completedSteps * CB_DROP_STEP_SECONDS);
  }


  function cbDrawTubeAndTimer() {
    const geometry = cbTubeGeometry();
    const dispenserX = CB_QUEUE_X - 24;
    const dispenserY = CB_BOARD_TOP;
    const dispenserW = 48;
    const dispenserH = CB_DANGER_Y - CB_BOARD_TOP;

    // Back of the dispenser.
    ctx.save();
    const dispenserBack = ctx.createLinearGradient(dispenserX, dispenserY, dispenserX + dispenserW, dispenserY + dispenserH);
    dispenserBack.addColorStop(0, "rgba(30,41,59,0.34)");
    dispenserBack.addColorStop(0.45, "rgba(51,65,85,0.24)");
    dispenserBack.addColorStop(1, "rgba(15,23,42,0.34)");
    ctx.fillStyle = dispenserBack;
    cbRoundedRectPath(dispenserX, dispenserY, dispenserW, dispenserH, 24);
    ctx.fill();
    ctx.restore();

    // Intake opening sits underneath the queue balls.
    ctx.save();
    ctx.fillStyle = "rgba(100,116,139,1)";
    ctx.beginPath();
    ctx.ellipse(geometry.intake.x, geometry.intake.y, 14, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(15,23,42,0.92)";
    ctx.beginPath();
    ctx.ellipse(geometry.intake.x, geometry.intake.y - 1.5, 9, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Queue balls, visually inside the dispenser.
    if (cbFeedAnimation) {
      const shift = cbEaseInOutCubic(cbFeedAnimation.elapsed / CB_FEED_SUCTION_SECONDS);
      const oldQueue = cbFeedAnimation.fromQueue;
      for (let index = 0; index < oldQueue.length - 1; index += 1) {
        const y = cbLerp(cbQueueBubbleY(index), cbQueueBubbleY(index + 1), shift);
        cbDrawBubble(CB_QUEUE_X, y, oldQueue[index], CB_QUEUE_RADIUS);
      }
      const newY = cbLerp(CB_BOARD_TOP - CB_QUEUE_RADIUS, cbQueueBubbleY(0), shift);
      cbDrawBubble(CB_QUEUE_X, newY, cbFeedAnimation.generatedPitch, CB_QUEUE_RADIUS, { alpha: shift });
    } else {
      cbQueue.forEach((pc, index) => {
        cbDrawBubble(CB_QUEUE_X, cbQueueBubbleY(index), pc, CB_QUEUE_RADIUS);
      });
    }

    // Front glass / border of the dispenser overlays the balls.
    ctx.save();
    const leftGlass = ctx.createLinearGradient(dispenserX, dispenserY, dispenserX + dispenserW, dispenserY + dispenserH);
    leftGlass.addColorStop(0, "rgba(255,255,255,0.18)");
    leftGlass.addColorStop(0.45, "rgba(191,219,254,0.10)");
    leftGlass.addColorStop(1, "rgba(15,23,42,0.18)");
    ctx.fillStyle = leftGlass;
    ctx.strokeStyle = "rgba(148,163,184,0.78)";
    ctx.lineWidth = 3;
    cbRoundedRectPath(dispenserX, dispenserY, dispenserW, dispenserH, 24);
    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle = "rgba(255,255,255,0.22)";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(CB_QUEUE_X - 12, CB_BOARD_TOP + 10);
    ctx.lineTo(CB_QUEUE_X - 12, CB_DANGER_Y - 10);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    const lampPulse = 0.5 + 0.5 * Math.sin(cbRunSeconds * 3.2);
    for (let lamp = 0; lamp < 3; lamp += 1) {
      const ly = CB_BOARD_TOP + 18 + lamp * 17;
      const active = lamp === 0 || (lamp === 1 && cbFeedAnimation) || (lamp === 2 && cbPendingCeilingDrop);
      ctx.fillStyle = active
        ? (lamp === 2 ? `rgba(251,146,60,${0.55 + lampPulse * 0.4})` : `rgba(56,189,248,${0.52 + lampPulse * 0.38})`)
        : "rgba(71,85,105,0.55)";
      if (active) {
        ctx.shadowColor = lamp === 2 ? "rgba(249,115,22,0.9)" : "rgba(56,189,248,0.9)";
        ctx.shadowBlur = 7 + lampPulse * 6;
      } else {
        ctx.shadowBlur = 0;
      }
      ctx.beginPath();
      ctx.arc(dispenserX + dispenserW - 8, ly, 3.2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    const timerWarning = cbDropRemaining <= 5;
    const timerUrgent = cbDropRemaining <= 2.5;
    ctx.save();
    const rightGlass = ctx.createLinearGradient(CB_TIMER_X - 24, CB_BOARD_TOP, CB_TIMER_X + 24, CB_DANGER_Y);
    rightGlass.addColorStop(0, "rgba(255,255,255,0.24)");
    rightGlass.addColorStop(0.45, "rgba(224,231,255,0.18)");
    rightGlass.addColorStop(1, "rgba(15,23,42,0.24)");
    ctx.fillStyle = rightGlass;
    ctx.strokeStyle = timerWarning ? "rgba(248,113,113,0.95)" : "rgba(148,163,184,0.75)";
    ctx.lineWidth = 3;
    if (timerWarning) {
      const timerPulse = 0.5 + 0.5 * Math.sin(cbRunSeconds * (timerUrgent ? 12 : 7));
      ctx.shadowColor = timerUrgent ? "rgba(239,68,68,0.95)" : "rgba(251,146,60,0.8)";
      ctx.shadowBlur = 8 + timerPulse * 10;
    }
    cbRoundedRectPath(CB_TIMER_X - 24, CB_BOARD_TOP, 48, CB_DANGER_Y - CB_BOARD_TOP, 24);
    ctx.fill();
    ctx.stroke();

    const trackTop = CB_BOARD_TOP + 18;
    const trackBottom = CB_DANGER_Y - 18;
    const trackHeight = trackBottom - trackTop;
    ctx.fillStyle = "rgba(15,23,42,0.26)";
    cbRoundedRectPath(CB_TIMER_X - 10, trackTop, 20, trackHeight, 10);
    ctx.fill();

    const ratio = Math.max(0, Math.min(1, cbDropRemaining / Math.max(0.001, cbDropSeconds)));
    const fillHeight = trackHeight * ratio;
    const fillGradient = ctx.createLinearGradient(0, trackBottom - fillHeight, 0, trackBottom);
    fillGradient.addColorStop(0, timerUrgent ? "#fca5a5" : timerWarning ? "#fdba74" : "#93c5fd");
    fillGradient.addColorStop(1, timerUrgent ? "#dc2626" : timerWarning ? "#d97706" : "#2563eb");
    ctx.fillStyle = fillGradient;
    cbRoundedRectPath(CB_TIMER_X - 10, trackBottom - fillHeight, 20, fillHeight, 10);
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.28)";
    ctx.beginPath();
    ctx.moveTo(CB_TIMER_X - 4, trackTop + 8);
    ctx.lineTo(CB_TIMER_X - 4, trackBottom - 8);
    ctx.stroke();

    ctx.strokeStyle = "rgba(226,232,240,0.22)";
    ctx.lineWidth = 1;
    for (let tick = 1; tick < 8; tick += 1) {
      const ty = cbLerp(trackTop + 5, trackBottom - 5, tick / 8);
      ctx.beginPath();
      ctx.moveTo(CB_TIMER_X + 13, ty);
      ctx.lineTo(CB_TIMER_X + 18, ty);
      ctx.stroke();
    }

    if (fillHeight > 5) {
      const shimmerY = trackBottom - fillHeight + ((cbRunSeconds * 38) % Math.max(5, fillHeight));
      const shimmer = ctx.createLinearGradient(CB_TIMER_X - 10, 0, CB_TIMER_X + 10, 0);
      shimmer.addColorStop(0, "rgba(255,255,255,0)");
      shimmer.addColorStop(0.5, "rgba(255,255,255,0.64)");
      shimmer.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = shimmer;
      cbRoundedRectPath(CB_TIMER_X - 9, shimmerY - 1.5, 18, 3, 1.5);
      ctx.fill();
    }

    ctx.fillStyle = timerWarning ? "#fee2e2" : "#e2e8f0";
    ctx.font = timerWarning ? "bold 18px Arial, sans-serif" : "bold 15px Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(String(Math.max(0, Math.ceil(cbDropRemaining))), CB_TIMER_X, CB_DANGER_Y + 15);

    ctx.restore();
  }

  function cbDrawTrajectory() {
    if (cbMode !== "idle") return;

    const direction = cbAimVector();
    let x = CB_LAUNCHER_X;
    let y = CB_SHOT_START_Y;
    let vx = direction.x;
    const vy = direction.y;
    const points = [{ x, y }];
    let bounceCount = 0;
    let distanceAfterFirstBounce = 0;
    let previousX = x;
    let previousY = y;

    // A longer simulation is needed for shallow angles, where the first wall
    // bounce happens late and the old fixed preview ended almost immediately after it.
    for (let step = 0; step < 360; step += 1) {
      x += vx * 5;
      y += vy * 5;

      const leftBound = CB_FIELD_LEFT + CB_BUBBLE_RADIUS;
      const rightBound = CB_FIELD_RIGHT - CB_BUBBLE_RADIUS;
      let bouncedThisStep = false;

      if (x <= leftBound) {
        x = leftBound;
        vx = Math.abs(vx);
        bounceCount += 1;
        bouncedThisStep = true;
        points.push({ x, y });
      } else if (x >= rightBound) {
        x = rightBound;
        vx = -Math.abs(vx);
        bounceCount += 1;
        bouncedThisStep = true;
        points.push({ x, y });
      }

      if (bounceCount >= 1 && !bouncedThisStep) {
        distanceAfterFirstBounce += Math.hypot(x - previousX, y - previousY);
      }
      previousX = x;
      previousY = y;

      const reachedTop = y <= CB_BOARD_TOP + cbBoardVisualOffsetY + CB_BUBBLE_RADIUS;
      const hitBubble = cbClosestBoardCollision(x, y);
      if (reachedTop || hitBubble) {
        points.push({ x, y });
        break;
      }

      // Once one rebound is visible, keep enough of its outgoing segment to
      // clearly communicate the post-bounce path, even at very shallow aims.
      if (bounceCount >= 1 && distanceAfterFirstBounce >= 150 && y > CB_DANGER_Y + 40) {
        points.push({ x, y });
        break;
      }
    }

    if (points.length === 1 || points[points.length - 1].x !== x || points[points.length - 1].y !== y) {
      points.push({ x, y });
    }

    ctx.save();
    ctx.setLineDash([8, 8]);
    ctx.strokeStyle = "rgba(191,219,254,0.9)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i += 1) ctx.lineTo(points[i].x, points[i].y);
    ctx.stroke();
    ctx.restore();
  }


  function cbDrawFeedAnimation() {
    if (!cbFeedAnimation) return;
    const geometry = cbTubeGeometry();
    const elapsed = cbFeedAnimation.elapsed;
    let x = geometry.intake.x;
    let y = geometry.intake.y;
    let radius = 6;

    if (elapsed < CB_FEED_SUCTION_SECONDS) {
      const t = cbEaseInOutCubic(elapsed / CB_FEED_SUCTION_SECONDS);
      x = geometry.intake.x;
      y = cbLerp(cbQueueBubbleY(CB_QUEUE_LENGTH - 1), geometry.intake.y, t);
      radius = cbLerp(CB_QUEUE_RADIUS, 6, t);
    } else if (elapsed < CB_FEED_SUCTION_SECONDS + CB_FEED_TUBE_SECONDS) {
      const t = cbEaseInOutCubic((elapsed - CB_FEED_SUCTION_SECONDS) / CB_FEED_TUBE_SECONDS);
      const point = cbCubicPoint(geometry.intake, geometry.c1, geometry.c2, geometry.exit, t);
      x = point.x;
      y = point.y;
      radius = 6 + Math.sin(t * Math.PI) * 1.5;
    } else {
      const t = cbEaseOutCubic((elapsed - CB_FEED_SUCTION_SECONDS - CB_FEED_TUBE_SECONDS) / CB_FEED_LAUNCH_SECONDS);
      x = cbLerp(geometry.exit.x, CB_LAUNCHER_X, t);
      y = cbLerp(geometry.exit.y, CB_SHOT_START_Y, t) - Math.sin(t * Math.PI) * 15;
      radius = cbLerp(6, 24, t) * (1 + Math.sin(t * Math.PI) * 0.08);

      ctx.save();
      ctx.globalAlpha = 1 - t;
      ctx.strokeStyle = cbBubbleStyle(cbFeedAnimation.bubble).fillA;
      ctx.lineWidth = 3;
      for (let ray = 0; ray < 6; ray += 1) {
        const angle = (Math.PI * 2 * ray) / 6;
        ctx.beginPath();
        ctx.moveTo(geometry.exit.x + Math.cos(angle) * 10, geometry.exit.y + Math.sin(angle) * 10);
        ctx.lineTo(geometry.exit.x + Math.cos(angle) * (17 + t * 10), geometry.exit.y + Math.sin(angle) * (17 + t * 10));
        ctx.stroke();
      }
      ctx.restore();
    }

    cbDrawBubble(x, y, cbFeedAnimation.bubble, radius, { settled: false });
  }

  function cbDrawLauncher() {
    cbDrawTrajectory();

    const geometry = cbTubeGeometry();
    const tangentX = geometry.exit.x - geometry.c2.x;
    const tangentY = geometry.exit.y - geometry.c2.y;
    const exitAngle = Math.atan2(tangentY, tangentX);

    // During suction/tube travel, draw the traveling ball before the tube so it appears inside it.
    if (cbFeedAnimation && cbFeedAnimation.elapsed < CB_FEED_SUCTION_SECONDS + CB_FEED_TUBE_SECONDS) {
      cbDrawFeedAnimation();
    }

    ctx.save();
    ctx.strokeStyle = "rgba(100,116,139,0.76)";
    ctx.lineWidth = 26;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(geometry.intake.x, geometry.intake.y);
    ctx.bezierCurveTo(geometry.c1.x, geometry.c1.y, geometry.c2.x, geometry.c2.y, geometry.exit.x, geometry.exit.y);
    ctx.stroke();

    ctx.strokeStyle = "rgba(226,232,240,0.40)";
    ctx.lineWidth = 16;
    ctx.beginPath();
    ctx.moveTo(geometry.intake.x, geometry.intake.y);
    ctx.bezierCurveTo(geometry.c1.x, geometry.c1.y, geometry.c2.x, geometry.c2.y, geometry.exit.x, geometry.exit.y);
    ctx.stroke();

    ctx.strokeStyle = "rgba(255,255,255,0.22)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(geometry.intake.x - 2, geometry.intake.y + 1);
    ctx.bezierCurveTo(geometry.c1.x - 6, geometry.c1.y - 1, geometry.c2.x - 3, geometry.c2.y - 6, geometry.exit.x - 5, geometry.exit.y - 2);
    ctx.stroke();

    ctx.save();
    ctx.globalCompositeOperation = "screen";
    for (let bead = 0; bead < 4; bead += 1) {
      const t = (cbRunSeconds * 0.19 + bead / 4) % 1;
      const p = cbCubicPoint(geometry.intake, geometry.c1, geometry.c2, geometry.exit, t);
      const pulse = 0.5 + 0.5 * Math.sin(cbRunSeconds * 6 + bead);
      ctx.shadowColor = "rgba(125,211,252,0.95)";
      ctx.shadowBlur = 10 + pulse * 8;
      ctx.fillStyle = `rgba(186,230,253,${0.38 + pulse * 0.42})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.5 + pulse * 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // Exit opening remains above the tube.
    ctx.fillStyle = "rgba(100,116,139,0.88)";
    ctx.beginPath();
    ctx.ellipse(geometry.exit.x, geometry.exit.y, 8, 15, exitAngle, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(15,23,42,0.92)";
    ctx.beginPath();
    ctx.ellipse(geometry.exit.x, geometry.exit.y, 5, 10.5, exitAngle, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    const launcherIdle = Math.sin(cbRunSeconds * 2.15) * 0.7;
    const launcherOffsetY = cbLauncherKick * 5 + launcherIdle;
    ctx.save();
    const launcherBase = ctx.createLinearGradient(CB_LAUNCHER_X - 34, 468 + launcherOffsetY, CB_LAUNCHER_X + 34, 520 + launcherOffsetY);
    launcherBase.addColorStop(0, "#dbe4f0");
    launcherBase.addColorStop(0.5, "#f8fafc");
    launcherBase.addColorStop(1, "#94a3b8");
    ctx.fillStyle = launcherBase;
    ctx.strokeStyle = "#1e293b";
    ctx.lineWidth = 3;
    if (cbMuzzlePulse > 0) {
      ctx.shadowColor = "rgba(191,219,254,0.95)";
      ctx.shadowBlur = 10 + cbMuzzlePulse * 16;
    }
    cbRoundedRectPath(CB_LAUNCHER_X - 34, 468 + launcherOffsetY, 68, 52, 14);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "rgba(255,255,255,0.5)";
    cbRoundedRectPath(CB_LAUNCHER_X - 24, 474 + launcherOffsetY, 48, 12, 6);
    ctx.fill();

    ctx.strokeStyle = "rgba(51,65,85,0.58)";
    ctx.lineWidth = 1.5;
    for (let vent = -1; vent <= 1; vent += 1) {
      ctx.beginPath();
      ctx.moveTo(CB_LAUNCHER_X - 15, 500 + launcherOffsetY + vent * 5);
      ctx.lineTo(CB_LAUNCHER_X + 15, 500 + launcherOffsetY + vent * 5);
      ctx.stroke();
    }
    const corePulse = 0.5 + 0.5 * Math.sin(cbRunSeconds * 3.8);
    ctx.fillStyle = `rgba(56,189,248,${0.42 + corePulse * 0.38})`;
    ctx.shadowColor = "rgba(56,189,248,0.9)";
    ctx.shadowBlur = 6 + corePulse * 8;
    ctx.beginPath();
    ctx.arc(CB_LAUNCHER_X, 512 + launcherOffsetY, 3.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // When the ball bursts out of the tube and lands in the shooter, draw it above the tube.
    if (cbFeedAnimation && cbFeedAnimation.elapsed >= CB_FEED_SUCTION_SECONDS + CB_FEED_TUBE_SECONDS) {
      cbDrawFeedAnimation();
    }

    if (!cbProjectile && !cbFeedAnimation) {
      const chargePulse = 0.5 + 0.5 * Math.sin(cbRunSeconds * 4.4);
      ctx.save();
      ctx.strokeStyle = `rgba(191,219,254,${0.18 + chargePulse * 0.25})`;
      ctx.lineWidth = 2 + chargePulse * 1.5;
      ctx.shadowColor = "rgba(125,211,252,0.75)";
      ctx.shadowBlur = 7 + chargePulse * 9;
      ctx.beginPath();
      ctx.arc(CB_LAUNCHER_X, CB_SHOT_START_Y, 29 + chargePulse * 3, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      cbDrawBubble(CB_LAUNCHER_X, CB_SHOT_START_Y, cbCurrentPitch, 24, { settled: false });
    }
  }

function gameInit() {
    cbRoundNumber = 1;
    cbBeginRound();
  }

  function cbUpdateMobileAimFromJoystick() {
    const leftStick = window.MobileArcadeShell?.sticks?.left;
    if (!leftStick || !leftStick.active) return;

    // The mobile control is a horizontal spring slider:
    // center = straight up, left/right = progressively wider firing angles.
    // Releasing the slider recenters the hardware but intentionally leaves the
    // chosen aim in place so the player can release it before tapping FIRE.
    const sliderX = clamp(leftStick.x || 0, -1, 1);
    let dx = sliderX * 4.35;
    let dy = -1;

    const length = Math.max(0.0001, Math.hypot(dx, dy));
    dx /= length;
    dy /= length;

    const aimDistance = 220;
    cbSetAim({
      x: CB_LAUNCHER_X + dx * aimDistance,
      y: CB_SHOT_START_Y + dy * aimDistance
    });
  }

  function gameUpdate() {
    const dt = 1 / 60;
    cbUpdateMobileAimFromJoystick();
    cbUpdateFeedback(dt);
    cbUpdateResolutionAnimation(dt);
    cbUpdateFeedAnimation(dt);
    cbUpdateCeilingAnimation(dt);
    cbUpdateBoardClear(dt);

    cbRunSeconds += dt;
    cbDropSeconds = cbCurrentDropInterval();
    cbDropRemaining -= dt;

    if (cbDropRemaining <= 5 && cbDropRemaining > 0) {
      const warningSecond = Math.ceil(cbDropRemaining);
      if (warningSecond !== cbLastTimerWarningSecond) {
        cbLastTimerWarningSecond = warningSecond;
        cbSoundTimerTick(warningSecond <= 2);
      }
    } else if (cbDropRemaining > 5) {
      cbLastTimerWarningSecond = -1;
    }

    if (cbDropRemaining <= 0) {
      cbDropSeconds = cbCurrentDropInterval();
      cbDropRemaining = cbDropSeconds;
      cbLastTimerWarningSecond = -1;
      cbPendingCeilingDrop = true;
    }

    if (
      cbPendingCeilingDrop &&
      !cbResolutionAnimation &&
      !cbCeilingAnimation &&
      !cbWaterHitActive &&
      cbBoardClearDelay <= 0
    ) {
      cbAddCeilingRow();
    }

    if (cbProjectile) cbUpdateProjectile(dt);
  }

  function gameDraw() {
    ctx.clearRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);
    cbDrawBackground();

    cbDrawTubeAndTimer();

    cbBoard.forEach((bubble, key) => {
      const cell = cbParseKey(key);
      const center = cbVisualCellCenter(cell.row, cell.col);
      cbDrawBubble(center.x, center.y, bubble);
    });

    cbDrawXrayHints();
    cbDrawResolutionAnimation();
    cbDrawFeedbackMarks();
    cbDrawBurstAnimations();
    cbDrawFallingBubbles();
    cbDrawPowerAnimations();

    let closestToDanger = 0;
    cbBoard.forEach((bubble, key) => {
      const cell = cbParseKey(key);
      const center = cbVisualCellCenter(cell.row, cell.col);
      closestToDanger = Math.max(closestToDanger, cbClamp01((center.y - (CB_DANGER_Y - 190)) / 190));
    });
    const dangerPulse = 0.5 + 0.5 * Math.sin(cbRunSeconds * (5 + closestToDanger * 5));
    ctx.save();
    ctx.strokeStyle = `rgba(248,113,113,${0.72 + closestToDanger * 0.2})`;
    ctx.lineWidth = 3 + closestToDanger * dangerPulse * 2;
    ctx.shadowColor = "rgba(239,68,68,0.9)";
    ctx.shadowBlur = closestToDanger * (5 + dangerPulse * 10);
    ctx.beginPath();
    ctx.moveTo(CB_FIELD_LEFT, CB_DANGER_Y);
    ctx.lineTo(CB_FIELD_RIGHT, CB_DANGER_Y);
    ctx.stroke();
    ctx.globalAlpha = 0.32 + closestToDanger * dangerPulse * 0.24;
    ctx.fillStyle = "rgba(239,68,68,0.25)";
    ctx.fillRect(CB_FIELD_LEFT, CB_DANGER_Y - 2, CB_FIELD_RIGHT - CB_FIELD_LEFT, 5);
    ctx.restore();

    if (cbProjectile) {
      const launchT = cbEaseOutCubic(cbProjectile.age / 0.09);
      const radius = cbLerp(24, CB_BUBBLE_RADIUS, launchT);
      const speed = Math.max(1, Math.hypot(cbProjectile.vx, cbProjectile.vy));
      const ux = cbProjectile.vx / speed;
      const uy = cbProjectile.vy / speed;
      const trailStyle = cbBubbleStyle(cbProjectile.pc);
      ctx.save();
      for (let trail = 5; trail >= 1; trail -= 1) {
        const distance = trail * 7;
        ctx.globalAlpha = (6 - trail) * 0.035;
        ctx.fillStyle = trailStyle.fillA;
        ctx.beginPath();
        ctx.arc(cbProjectile.x - ux * distance, cbProjectile.y - uy * distance, Math.max(2, radius * (0.18 + (6 - trail) * 0.035)), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
      cbDrawBubble(cbProjectile.x, cbProjectile.y, cbProjectile, radius, { settled: false });
    }
    cbDrawLauncher();
    cbDrawFeedbackHud();
  }

  function gameInput(action) {
    if (action === "left") {
      cbSetAim({ x: cbAimX - 28, y: cbAimY });
    } else if (action === "right") {
      cbSetAim({ x: cbAimX + 28, y: cbAimY });
    } else if (action === "up") {
      cbSetAim({ x: cbAimX, y: cbAimY - 28 });
    } else if (action === "down") {
      cbSetAim({ x: cbAimX, y: cbAimY + 28 });
    } else if (action === "a") {
      cbFire();
    }
  }

  function gamePointer(point) {
    if (cbMode !== "idle") return;
    cbPointerAiming = true;
    cbSetAim(point);
  }

  function gamePointerMove(point) {
    if (!cbPointerAiming || cbMode !== "idle") return;
    cbSetAim(point);
  }

  function gamePointerUp(point) {
    if (!cbPointerAiming || cbMode !== "idle") return;
    cbSetAim(point);
    cbPointerAiming = false;
    cbFire();
  }

  function gameStop() {
    cbPointerAiming = false;
  }


  let resizeObserver = null;

    if ("ResizeObserver" in window) {
      resizeObserver = new ResizeObserver(() => {
        scaleAppToFrame();
        if (!sticks.left.active) resetJoystick(sticks.left);
        if (!sticks.right.active) resetJoystick(sticks.right);

        if (!running) {
          resetGameCanvasTransform();
          gameDraw();
        }
      });

      resizeObserver.observe(appFrame);
    }

    window.addEventListener("orientationchange", () => {
      setTimeout(() => {
        scaleAppToFrame();
        if (!sticks.left.active) resetJoystick(sticks.left);
        if (!sticks.right.active) resetJoystick(sticks.right);

        if (!running) {
          resetGameCanvasTransform();
          gameDraw();
        }
      }, 250);
    });

    function shutDownMobileArcade() {
      try {
        stopGame();
      } catch (err) {}

      if (audioCtx && audioCtx.state !== "closed") {
        audioCtx.close().catch(() => {});
      }

      audioCtx = null;
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        resetJoystick(sticks.left);
        resetJoystick(sticks.right);
      }
    });

    window.addEventListener("pagehide", shutDownMobileArcade);


    scaleAppToFrame();
    loadPlayers();
    resetJoystick(sticks.left);
    resetJoystick(sticks.right);
    configureMobileControls({
      showDpad: false,
      showLeftJoystick: true,
      showRightJoystick: false,
      faceButtons: ["a"],
      systemButtons: ["start"],
      labels: {
        a: "FIRE",
        start: "MENU"
      }
    });
    gameInit();
    resetGameCanvasTransform();
    gameDraw();
  </script>
</body>
