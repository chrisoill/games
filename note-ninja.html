  function attackCurrentHandOrigin(sequence, useBothHands = false, now = performance.now()) {
    const fallback = sequence?.fallbackOrigin || [WORLD_NINJA_X + 14, WORLD_GROUND_Y - 20];
    const front = Array.isArray(currentNinjaFrontHand) ? currentNinjaFrontHand : fallback;
    const simultaneousMove = simultaneousMovementEvent(sequence?.event);
    if (!useBothHands && isRapidLeftEvent(simultaneousMove)) {
      const back = Array.isArray(currentNinjaBackHand) ? currentNinjaBackHand : front;
      return [back[0], back[1]];
    }
    if (!useBothHands) return [front[0], front[1]];
    const back = Array.isArray(currentNinjaBackHand) ? currentNinjaBackHand : front;
    return [(front[0] + back[0]) * 0.5, (front[1] + back[1]) * 0.5];
  }


  function drawProjectileTrail(x, y, angle, kind, alpha = 1) {
    const colors = {
      kunai: '#b9c8d0', shuriken: '#b9c8d0', senbon: '#d7e1e6',
      paperBomb: '#d4b26d', fireBlast: '#f0a043', airBlade: '#c9eff3'
    };
    const length = kind === 'senbon' ? 16 : kind === 'fireBlast' ? 28 : 22;
    const dx = Math.cos(angle) * length;
    const dy = Math.sin(angle) * length;
    ctx.save();
    ctx.globalAlpha = 0.18 * alpha;
    ctx.strokeStyle = colors[kind] || '#d4dde2';
    ctx.lineCap = 'round';
    ctx.lineWidth = kind === 'fireBlast' ? 5 : 2.4;
    ctx.beginPath();
    ctx.moveTo(x - dx * 0.18, y - dy * 0.18);
    ctx.lineTo(x - dx, y - dy);
    ctx.stroke();
    ctx.globalAlpha = 0.34 * alpha;
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(x - dx * 0.08, y - dy * 0.08);
    ctx.lineTo(x - dx * 0.72, y - dy * 0.72);
    ctx.stroke();
    if (kind === 'fireBlast') {
      ctx.fillStyle = '#ffd36f';
      for (let i = 0; i < 3; i += 1) {
        ctx.globalAlpha = 0.28 * alpha;
        ctx.beginPath();
        ctx.arc(x - dx * (0.45 + i * 0.16), y - dy * (0.45 + i * 0.16) + (i - 1) * 3, 1.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawProjectileForWeapon(sequence, index, now) {
    if (sequence.hardCanceledAt && now >= sequence.hardCanceledAt) return;
    const launchAt = attackLaunchTime(sequence, index);
    const impactAt = attackArrivalTime(sequence, index);
    if (now < launchAt || now > impactAt) return;
    if (!attackSequenceAllowsTarget(sequence, index)) return;

    if (!Array.isArray(sequence.launchOrigins)) sequence.launchOrigins = [];
    if (!sequence.launchOrigins[index]) {
      sequence.launchOrigins[index] = attackCurrentHandOrigin(sequence, false, now);
    }
    const origin = sequence.launchOrigins[index];
    const travel = Math.max(1, impactAt - launchAt);
    const t = Math.max(0, Math.min(1, (now - launchAt) / travel));
    const targetY = attackTargetCenterY(sequence.event, index, 0);
    const arc = (sequence.weapon.arc || 0) * Math.sin(Math.PI * t);
    const x = mixNumber(origin[0], ATTACK_TARGET_BREAK_X, t);
    const y = mixNumber(origin[1], targetY, t) - arc;
    const angle = Math.atan2(targetY - origin[1], ATTACK_TARGET_BREAK_X - origin[0]);
    drawProjectileTrail(x, y, angle, sequence.weapon.kind, 1);

    if (sequence.weapon.kind === 'kunai') drawKunai(x, y, angle, 1);
    else if (sequence.weapon.kind === 'shuriken') drawShuriken(x, y, 8, now * 0.032);
    else if (sequence.weapon.kind === 'senbon') drawSenbon(x, y, angle);
    else if (sequence.weapon.kind === 'paperBomb') drawPaperBomb(x, y, angle + Math.sin(t * Math.PI) * 0.18);
    else if (sequence.weapon.kind === 'fireBlast') drawFireBlast(x, y, angle, 1);
    else if (sequence.weapon.kind === 'airBlade') drawAirBlade(x, y, angle);
  }

  function drawContinuousStream(sequence, now) {
    if (sequence.hardCanceledAt && now >= sequence.hardCanceledAt) return;
    const visibleEnd = Math.min(sequence.lastBreakAt, sequence.canceledAt || Infinity);
    if (now < sequence.pressTime || now > visibleEnd) return;

    const origin = attackCurrentHandOrigin(sequence, true, now);
    const firstImpactAt = sequence.firstImpactAt || sequence.firstBreakAt;
    const extensionDuration = Math.max(1, firstImpactAt - sequence.pressTime);
    const extension = smoothStep01(Math.max(0, Math.min(1, (now - sequence.pressTime) / extensionDuration)));
    const primaryTargetY = superPrimaryTargetY(sequence, now);
    const endX = mixNumber(origin[0], ATTACK_TARGET_BREAK_X, extension);
    const endY = mixNumber(origin[1], primaryTargetY, extension);
    const pulse = 0.5 + 0.5 * Math.sin(now * 0.025);
    const kind = sequence.weapon.kind;

    ctx.save();
    ctx.lineCap = 'round';

    if (kind === 'waterStream') {
      ctx.strokeStyle = '#4da4de';
      ctx.lineWidth = 8 + pulse * 2;
      ctx.beginPath();
      ctx.moveTo(origin[0], origin[1]);
      ctx.quadraticCurveTo(
        mixNumber(origin[0], endX, 0.52),
        mixNumber(origin[1], endY, 0.52) - 7 - pulse * 3,
        endX,
        endY
      );
      ctx.stroke();
      ctx.strokeStyle = '#c9eeff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(origin[0], origin[1]);
      ctx.quadraticCurveTo(
        mixNumber(origin[0], endX, 0.52),
        mixNumber(origin[1], endY, 0.52) - 7 - pulse * 3,
        endX,
        endY
      );
      ctx.stroke();
    } else {
      ctx.strokeStyle = '#7953bd';
      ctx.lineWidth = 13 + pulse * 4;
      ctx.beginPath();
      ctx.moveTo(origin[0], origin[1]);
      ctx.lineTo(endX, endY);
      ctx.stroke();
      ctx.strokeStyle = '#ddccff';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(origin[0], origin[1]);
      ctx.lineTo(endX, endY);
      ctx.stroke();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(origin[0], origin[1]);
      ctx.lineTo(endX, endY);
      ctx.stroke();

      if (sequence.event?.duration >= PHRASE_BEATS) {
        for (let ring = 0; ring < 3; ring += 1) {
          ctx.strokeStyle = ring === 0 ? 'rgba(255,242,194,0.72)' : ring === 1 ? 'rgba(171,132,255,0.56)' : 'rgba(255,255,255,0.46)';
          ctx.lineWidth = 2.5 - ring * 0.5;
          ctx.beginPath();
          ctx.arc(origin[0], origin[1], 11 + ring * 9 + pulse * (4 + ring), 0, Math.PI * 2);
          ctx.stroke();
        }
      }
    }

    ctx.restore();

    if (extension < 0.999) return;

    if (sequence.event?.duration >= PHRASE_BEATS) {
      const superKinds = ['shuriken', 'kunai', 'senbon', 'paperBomb', 'airBlade', 'fireBlast'];
      for (let index = 0; index < sequence.count; index += 1) {
        if (!attackSequenceAllowsTarget(sequence, index)) continue;
        const launchAt = attackLaunchTime(sequence, index);
        const impactAt = attackArrivalTime(sequence, index);
        const t = (now - launchAt) / Math.max(1, impactAt - launchAt);
        if (t < 0 || t > 1) continue;
        const baseArc = 8 + (index % 5) * 3;
        superKinds.forEach((kind, kindIndex) => {
          const targetY = attackTargetCenterY(sequence.event, index, kindIndex + 1);
          const sideOffset = Math.sin(kindIndex * 1.2 + index * 0.16) * 8;
          const px = mixNumber(origin[0], ATTACK_TARGET_BREAK_X, t) + sideOffset * (1 - t);
          const py = mixNumber(origin[1], targetY, t) - Math.sin(Math.PI * t) * (baseArc + kindIndex * 2);
          const angle = Math.atan2(targetY - origin[1], ATTACK_TARGET_BREAK_X - origin[0]);
          drawProjectileTrail(px, py, angle, kind, 0.82);
          if (kind === 'kunai') drawKunai(px, py, angle, 0.92);
          else if (kind === 'shuriken') drawShuriken(px, py, 8, now * 0.032 + kindIndex);
          else if (kind === 'senbon') drawSenbon(px, py, angle);
          else if (kind === 'paperBomb') drawPaperBomb(px, py, angle + Math.sin(t * Math.PI) * 0.18);
          else if (kind === 'fireBlast') drawFireBlast(px, py, angle, 0.92);
          else if (kind === 'airBlade') drawAirBlade(px, py, angle);
        });
      }
    }

    for (let index = 0; index < sequence.count; index += 1) {
      if (!attackSequenceAllowsTarget(sequence, index)) continue;
      const contactAt = attackArrivalTime(sequence, index);
      const local = Math.abs(now - contactAt);
      if (local > 105) continue;
      const radius = 5 + (1 - local / 105) * 9;
      const targetY = attackTargetCenterY(sequence.event, index, 0);
      ctx.save();
      ctx.strokeStyle = kind === 'waterStream' ? '#d9f7ff' : '#fff7d0';
      ctx.lineWidth = sequence.event?.duration >= PHRASE_BEATS ? 2.6 : 2;
      ctx.beginPath();
      ctx.arc(ATTACK_TARGET_BREAK_X, targetY, radius, 0, Math.PI * 2);
      ctx.stroke();
      if (sequence.event?.duration >= PHRASE_BEATS) {
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(ATTACK_TARGET_BREAK_X, targetY, radius + 6, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawAllAttackEffects(now) {
    pruneAttackSequences(now);
    activeAttackSequences.forEach(sequence => {
      updateAttackSequenceSound(sequence, now, false);
      if (sequence.weapon.continuous) {
        drawContinuousStream(sequence, now);
        return;
      }
      for (let index = 0; index < sequence.count; index += 1) {
        drawProjectileForWeapon(sequence, index, now);
      }
    });
  }

  function drawIncorrectProjectile(sequence, index, now) {
    if (sequence.hardCanceledAt && now >= sequence.hardCanceledAt) return;
    const launchAt = sequence.pressTime + index * sequence.intervalMs;
    const endAt = launchAt + sequence.travelMs;
    if (now < launchAt || now > endAt) return;
    const t = Math.max(0, Math.min(1, (now - launchAt) / Math.max(1, sequence.travelMs)));
    const origin = sequence.origin;
    const x = mixNumber(origin[0], sequence.endX, t);
    const y = mixNumber(origin[1], sequence.endY, t) - Math.sin(Math.PI * t) * (sequence.weapon.arc || 8);
    const angle = Math.atan2(sequence.endY - origin[1], sequence.endX - origin[0]);
    const kind = sequence.weapon.kind;
    drawProjectileTrail(x, y, angle, kind, 0.9);
    if (kind === 'kunai') drawKunai(x, y, angle, 1);
    else if (kind === 'shuriken') drawShuriken(x, y, 8, now * 0.032);
    else if (kind === 'senbon') drawSenbon(x, y, angle);
    else if (kind === 'paperBomb') drawPaperBomb(x, y, angle + Math.sin(t * Math.PI) * 0.18);
    else if (kind === 'fireBlast') drawFireBlast(x, y, angle, 1);
    else if (kind === 'airBlade') drawAirBlade(x, y, angle);
    else drawKunai(x, y, angle, 1);
  }

  function drawIncorrectContinuousAttack(sequence, now) {
    if (sequence.hardCanceledAt && now >= sequence.hardCanceledAt) return;
    const visibleEnd = Math.min(sequence.endAt, sequence.canceledAt || Infinity);
    if (now < sequence.pressTime || now > visibleEnd) return;
    const extension = smoothStep01(Math.max(0, Math.min(1, (now - sequence.pressTime) / Math.max(1, sequence.travelMs * 0.72))));
    const endX = mixNumber(sequence.origin[0], sequence.endX, extension);
    const endY = mixNumber(sequence.origin[1], sequence.endY, extension);
    const pulse = 0.5 + 0.5 * Math.sin(now * 0.025);
    ctx.save();
    ctx.lineCap = 'round';
    if (sequence.weapon.kind === 'waterStream') {
      ctx.strokeStyle = '#4da4de';
      ctx.lineWidth = 8 + pulse * 2;
      ctx.beginPath();
      ctx.moveTo(sequence.origin[0], sequence.origin[1]);

    const obstacleLeft = leftCollisionObstacleX(collision, now);
    const safeBodyX = obstacleLeft - collision.contactClearancePx;
    const knockedBackX = Math.min(WORLD_NINJA_X - 56, safeBodyX - 4);
    const backPose = {
      head: [3, -33, 4.6], neck: [1, -28], hip: [-4, -15],

      const desiredX = mixNumber(WORLD_NINJA_X, WORLD_NINJA_X - 56, t);
      // Hard clamp behind the obstacle's leading edge. This is what prevents
      // even the rotating knockback pose from ever appearing on top of it.
      const x = Math.min(desiredX, safeBodyX);
      const y = WORLD_GROUND_Y - Math.sin(Math.PI * t) * 11;
      drawMovementStickPose(x, y, backPose, -Math.PI * 0.58 * t, phase, true);

        ctx.scale(1 - t * 0.25, 1 - t * 0.25);

          const px = Math.cos(angle) * radius;

    const appearEnd = collision.reappearAt + Math.min(130, 0.15 * beatDurationMs);

  function buildFourFourBeamGroups(track) {
    const groups = [];
    for (let measure = 0; measure < PHRASE_MEASURES; measure += 1) {
      for (let beat = 0; beat < BEATS_PER_MEASURE; beat += 1) {
        const beatStart = measure * BEATS_PER_MEASURE + beat;
        const beatEnd = beatStart + 1;
        const notes = track
          .filter(item => item.kind === "note" && item.duration < 1 && item.start >= beatStart - 0.0001 && item.start + item.duration <= beatEnd + 0.0001)
          .sort((a, b) => a.start - b.start);
        let run = [];
        notes.forEach(item => {
          if (!run.length) {
            run = [item];
            return;
          }
          const previous = run[run.length - 1];
          const previousEnd = previous.start + previous.duration;
          if (Math.abs(item.start - previousEnd) < 0.0001) {
            run.push(item);
          } else {
            if (run.length >= 2) groups.push(run);
            run = [item];
          }
        });
        if (run.length >= 2) groups.push(run);
      }

    return groups;

  function notationBeatValue(value) {
    return Math.round(value * 4) / 4;
  }

  function notationBeatEquals(a, b) {
    return Math.abs(a - b) < 0.0001;
  }

  function spellFourFourRestSpan(localStart, duration) {
    const start = notationBeatValue(localStart);
    const end = notationBeatValue(localStart + duration);
    if (notationBeatEquals(start, 0) && notationBeatEquals(end, BEATS_PER_MEASURE)) {
      return [{ start: 0, duration: 4 }];
    }

    const segments = [];
    let cursor = start;
    while (cursor < end - 0.0001) {
      const remaining = notationBeatValue(end - cursor);
      let segmentDuration = 0.25;

      // Half rests are reserved for the two natural halves of 4/4.
      if ((notationBeatEquals(cursor, 0) || notationBeatEquals(cursor, 2)) && remaining >= 2 - 0.0001) {
        segmentDuration = 2;
      // Quarter rests begin on numbered beats and never obscure a subdivision.
      } else if (notationBeatEquals(cursor, Math.round(cursor)) && remaining >= 1 - 0.0001) {
        segmentDuration = 1;
      } else if (notationBeatEquals(cursor * 2, Math.round(cursor * 2)) && remaining >= 0.5 - 0.0001) {
        segmentDuration = 0.5;
      }

      segmentDuration = Math.min(segmentDuration, remaining);
      segments.push({ start: cursor, duration: segmentDuration });
      cursor = notationBeatValue(cursor + segmentDuration);
    }
    return segments;
  }

  function notationNoteForDisplay(item) {
    const localStart = notationBeatValue(item.start - item.measure * BEATS_PER_MEASURE);
    const displayItem = {
      ...item,
      sourceItem: item,
      tieSegments: undefined
    };

    // Current generated note values are already conventional in 4/4. In
    // particular, a two-beat note remains a half note even when it begins on
    // beat 2; internal quarter-to-quarter spellings are therefore removed.
    // Barline continuations remain separate notes joined by tieToNext.
    if (item.duration === 2 && localStart >= 0 && localStart <= 2 + 0.0001) {
      displayItem.tieSegments = undefined;
    } else if (Array.isArray(item.tieSegments) && item.tieSegments.length > 1) {
      displayItem.tieSegments = [...item.tieSegments];
    }
    return displayItem;
  }

  function notationTrackForDisplay(track) {
    const displayTrack = [];

    for (let measure = 0; measure < PHRASE_MEASURES; measure += 1) {
      const measureStart = measure * BEATS_PER_MEASURE;
      const measureEnd = measureStart + BEATS_PER_MEASURE;
      const measureItems = track
        .filter(item => item.start >= measureStart - 0.0001 && item.start < measureEnd - 0.0001)
        .sort((a, b) => a.start - b.start);

      for (let index = 0; index < measureItems.length;) {
        const item = measureItems[index];
        if (item.kind === "note") {
          displayTrack.push(notationNoteForDisplay(item));
          index += 1;
          continue;
        }

        const sourceItems = [item];
        const restStart = item.start;
        let restEnd = item.start + item.duration;
        let nextIndex = index + 1;
        while (nextIndex < measureItems.length) {
          const next = measureItems[nextIndex];
          if (next.kind !== "rest" || Math.abs(next.start - restEnd) > 0.0001) break;
          sourceItems.push(next);
          restEnd = next.start + next.duration;
          nextIndex += 1;
        }

        const localStart = restStart - measureStart;
        spellFourFourRestSpan(localStart, restEnd - restStart).forEach(segment => {
          displayTrack.push({
            kind: "rest",
            duration: segment.duration,
            start: measureStart + segment.start,
            measure,
            sourceItems,
            attackMatched: false,
            completed: false,
            missed: false
          });
        });
        index = nextIndex;
      }
    }

    return displayTrack.sort((a, b) => a.start - b.start || (a.kind === "note" ? -1 : 1));
  }

  function drawTrack(track, lineY, startX, measureWidth, phrase, hand) {
    const notationTrack = notationTrackForDisplay(track);
    ctx.strokeStyle = "#111827";
    ctx.lineWidth = 1.25;
    ctx.beginPath();
    ctx.moveTo(startX, lineY);
    ctx.lineTo(startX + measureWidth * PHRASE_MEASURES, lineY);
    ctx.stroke();

    const xForBeat = (measure, beatInMeasure) => {
      const measureX = startX + measure * measureWidth;
      const usableWidth = measureWidth - 24;
      return measureX + 13 + (beatInMeasure / BEATS_PER_MEASURE) * usableWidth;
    };

    const beamGroups = buildFourFourBeamGroups(notationTrack);
    const beamedItems = new Set(beamGroups.flat());

    function drawCrossMeasureTie(fromItem, toItem, color) {
      const fromX = xForBeat(fromItem.measure, fromItem.start - fromItem.measure * BEATS_PER_MEASURE);
      const toX = xForBeat(toItem.measure, toItem.start - toItem.measure * BEATS_PER_MEASURE);
      // A tie that crosses a visible barline is one continuous forward arc.
      // Splitting it at the barline created a tiny backward curl beside the
      // second super-move note.
      drawTieArc(fromX, toX, lineY, color);
    }

    notationTrack.forEach((item, itemIndex) => {
      const beatInMeasure = item.start - item.measure * BEATS_PER_MEASURE;
      const resultColor = notationResultColor(phrase, hand, item);
      const x = xForBeat(item.measure, beatInMeasure);

      if (item.kind === "rest") {
        const restX = item.duration >= BEATS_PER_MEASURE - 0.0001
          ? startX + item.measure * measureWidth + measureWidth / 2
          : x;
        drawRest(restX, lineY, item.duration, resultColor);
        return;
      }

      if (Array.isArray(item.tieSegments) && item.tieSegments.length > 1) {
        let segmentBeat = beatInMeasure;
        const segmentPositions = [];

        item.tieSegments.forEach(segmentDuration => {
          const segmentX = xForBeat(item.measure, segmentBeat);
          segmentPositions.push(segmentX);
          drawNote(segmentX, lineY, segmentDuration, resultColor);
          segmentBeat += segmentDuration;
        });

        for (let index = 0; index < segmentPositions.length - 1; index += 1) {
          drawTieArc(segmentPositions[index], segmentPositions[index + 1], lineY, resultColor);
        }
        return;
      }

      if (item.duration < 1) {
        drawShortNote(x, lineY, item.duration, resultColor, beamedItems.has(item));
      } else {
        drawNote(x, lineY, item.duration, resultColor);
      }

      if (item.tieToNext && notationTrack[itemIndex + 1] && notationTrack[itemIndex + 1].kind === "note") {
        drawCrossMeasureTie(item, notationTrack[itemIndex + 1], resultColor);
      }
    });

    beamGroups.forEach(group => drawBeamGroup(group, lineY, xForBeat, phrase, hand));
  }

  function drawSystem(phrase, y, height, options = {}) {
    const preview = options.preview === true;
    const activeMeasure = Number.isInteger(options.activeMeasure) ? options.activeMeasure : -1;
    const fill = phrase.isSuperMove ? "#fff0c7" : (preview ? "#eef1f3" : "#ffffff");

    ctx.save();
    ctx.globalAlpha = preview ? 0.76 : 1;
    const panelGradient = ctx.createLinearGradient(0, y, 0, y + height);
    panelGradient.addColorStop(0, phrase.isSuperMove ? '#fff2cf' : (preview ? '#f1f3f2' : '#fffdf7'));
    panelGradient.addColorStop(1, phrase.isSuperMove ? '#f5d68f' : (preview ? '#e1e6e6' : '#eee8da'));
    ctx.shadowColor = preview ? 'rgba(0,0,0,0.08)' : 'rgba(27,39,45,0.20)';
    ctx.shadowBlur = preview ? 4 : 8;
    ctx.shadowOffsetY = preview ? 1 : 3;
    ctx.lineWidth = preview ? 1.5 : 2;
    drawRoundedRect(20, y, 680, height, 10, panelGradient, '#30383d');
    ctx.shadowColor = 'transparent';

    const notationStartX = 112;
    const notationWidth = 568;
    const measureWidth = notationWidth / PHRASE_MEASURES;
    const rightLineY = y + 28;
    const leftLineY = y + 65;

    drawRoundedRect(notationStartX + 3, rightLineY - 13, notationWidth - 6, 25, 7, 'rgba(80,111,125,0.055)', null);
    drawRoundedRect(notationStartX + 3, leftLineY - 13, notationWidth - 6, 25, 7, 'rgba(132,86,69,0.045)', null);

    if (!preview && activeMeasure >= 0) {
      const activeFill = phrase.isSuperMove ? 'rgba(255,211,104,0.34)' : 'rgba(191,209,168,0.30)';
      drawRoundedRect(notationStartX + activeMeasure * measureWidth + 2, y + 4, measureWidth - 4, height - 8, 7, activeFill, null);
    }

    ctx.fillStyle = "#151719";
    // Center the stacked 4/4 vertically between the two rhythm staves.
    drawSmuflSymbol(SMUFL.timeSig4, 58, y + 39, 25, "#151719");
    drawSmuflSymbol(SMUFL.timeSig4, 58, y + 66, 25, "#151719");
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "bold 13px Arial, sans-serif";
    ctx.fillText("R", 91, rightLineY);
    ctx.fillText("L", 91, leftLineY);

    ctx.textAlign = "left";
    ctx.font = "bold 9px Arial, sans-serif";
    const levelLabel = phrase.isSuperMove
      ? `LEVEL ${phrase.level} • SUPER`
      : `LEVEL ${phrase.level}`;
    ctx.fillText(preview ? `NEXT ${levelLabel}` : levelLabel, 27, y + 10);

    for (let measure = 0; measure <= PHRASE_MEASURES; measure += 1) {
      const lineX = notationStartX + measure * measureWidth;
      ctx.strokeStyle = "#303438";
      ctx.lineWidth = measure === 0 || measure === PHRASE_MEASURES ? 2 : 1;
      ctx.beginPath();
      ctx.moveTo(lineX, y + 6);
      ctx.lineTo(lineX, y + height - 6);
      ctx.stroke();
    }

    drawTrack(phrase.tracks.right, rightLineY, notationStartX, measureWidth, phrase, "right");
    drawTrack(phrase.tracks.left, leftLineY, notationStartX, measureWidth, phrase, "left");
    ctx.restore();
  }

    function gameDraw() {
      const now = performance.now();

      if (!running && frozenEndFrameCanvas) {
        ctx.clearRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);
        ctx.drawImage(frozenEndFrameCanvas, 0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);
        return;
      }

      ctx.clearRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);
    
      drawMinimalWorld(now);
    
      if (defeatCinematic) {
        drawDefeatCinematicLowerCurtain(now);
        return;
      }
    
      drawHeartRecoveryEffect(now);
    
      let activeMeasure = -1;
      if (!countIn && now >= phraseStartTime) {
        activeMeasure = Math.min(
          PHRASE_MEASURES - 1,
          Math.max(0, Math.floor(currentBeatPosition(now) / BEATS_PER_MEASURE))
        );
      }
    
      const pulseY = 314;
    const pulseStartX = 298;
    const pulseGap = 42;
    let pulseBeat = -1;

    if (countIn) {
      const countInStart = phraseStartTime - COUNT_IN_BEATS * beatDurationMs;
      pulseBeat = Math.min(3, Math.max(0, Math.floor((now - countInStart) / beatDurationMs)));
    } else if (now >= phraseStartTime) {
      pulseBeat = Math.floor(currentBeatPosition(now)) % BEATS_PER_MEASURE;
    }

    const hudGradient = ctx.createLinearGradient(0, 298, 0, 332);
    hudGradient.addColorStop(0, 'rgba(255,253,246,0.97)');
    hudGradient.addColorStop(1, 'rgba(222,229,228,0.97)');
    ctx.shadowColor = 'rgba(16,27,34,0.24)';
    ctx.shadowBlur = 7;
    ctx.shadowOffsetY = 2;
    drawRoundedRect(14, 298, 692, 34, 12, hudGradient, '#35434b');
    ctx.shadowColor = 'transparent';

    for (let beat = 0; beat < 4; beat += 1) {
      const x = pulseStartX + beat * pulseGap;
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, pulseY, 9, 0, Math.PI * 2);
      ctx.fillStyle = beat === pulseBeat ? '#1f2937' : '#ffffff';
      ctx.fill();
      ctx.strokeStyle = '#1f2937';
      ctx.lineWidth = 1.8;
      ctx.stroke();
      if (beat === pulseBeat) {
        ctx.fillStyle = '#f4d36b';
        ctx.beginPath();
        ctx.arc(x, pulseY, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawHudHeart(cx, cy, filled, index) {
      const isFreshlyLost = index === damagedHeartIndex && now < damageFlashUntil;
      const isFreshlyHealed = index === healedHeartIndex && now < healFlashUntil;
      const damageProgress = isFreshlyLost
        ? Math.max(0, Math.min(1, (now - damageFlashStart) / Math.max(1, damageFlashUntil - damageFlashStart)))
        : 1;
      const healProgress = isFreshlyHealed
        ? Math.max(0, Math.min(1, (now - healFlashStart) / Math.max(1, healFlashUntil - healFlashStart)))
        : 1;
      const pulse = isFreshlyLost
        ? 1 + Math.sin(damageProgress * Math.PI) * 0.28
        : isFreshlyHealed
          ? 1 + Math.sin(Math.min(1, healProgress * 1.35) * Math.PI) * 0.52
          : 1;
      const shake = isFreshlyLost ? Math.sin(now * 0.12) * (1 - damageProgress) * 2.5 : 0;

      ctx.save();
      ctx.translate(cx + shake, cy);
      if (isFreshlyHealed) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - healProgress) * 0.9;
        ctx.strokeStyle = '#e0ad31';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(0, 0, 12 + healProgress * 12, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      ctx.scale(pulse * 0.72, pulse * 0.72);
      ctx.beginPath();
      ctx.moveTo(0, 9);
      ctx.bezierCurveTo(-2, 7, -9, 2, -9, -4);
      ctx.bezierCurveTo(-9, -9, -3, -11, 0, -6);
      ctx.bezierCurveTo(3, -11, 9, -9, 9, -4);
      ctx.bezierCurveTo(9, 2, 2, 7, 0, 9);
      ctx.closePath();
      ctx.fillStyle = isFreshlyHealed ? '#d95858' : (filled ? '#b74444' : (isFreshlyLost ? '#f0b1b1' : '#ffffff'));
      ctx.fill();
      ctx.strokeStyle = isFreshlyHealed ? '#e0ad31' : (isFreshlyLost ? '#b42323' : '#1f2937');
      ctx.lineWidth = isFreshlyHealed ? 2.8 : (isFreshlyLost ? 2.5 : 1.6);
      ctx.stroke();
      ctx.restore();
    }

    for (let hp = 0; hp < RHYTHM_NINJA_MAX_HEALTH; hp += 1) {
      drawHudHeart(25 + hp * 14.5, pulseY - 1, hp < health, hp);
    }

    const multiplier = streakMultiplierFor(streak);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 11px Arial, sans-serif';
    ctx.fillStyle = multiplier > 1 ? '#8b5a13' : '#475569';
    ctx.fillText(streak > 0 ? `STREAK ${streak}  ×${multiplier}` : 'STREAK 0  ×1', 174, pulseY);

    const toneColors = {
      perfect: '#8b5a13',
      good: '#176b45',
      error: '#a52f2f',
      info: '#334155',
      neutral: '#334155'
    };
    ctx.fillStyle = now < feedbackUntil ? (toneColors[feedbackTone] || toneColors.neutral) : '#334155';
    ctx.textAlign = 'right';
    ctx.font = 'bold 12px Arial, sans-serif';
    const displayFeedback = now < feedbackUntil ? feedbackText : `${bpm} BPM`;
    ctx.fillText(displayFeedback, 695, pulseY);

    if (scorePopup && now < scorePopup.until) {
      const progress = Math.max(0, Math.min(1, (now - scorePopup.start) / Math.max(1, scorePopup.until - scorePopup.start)));
      ctx.save();
      ctx.globalAlpha = 1 - Math.max(0, (progress - 0.62) / 0.38);
      ctx.fillStyle = '#176b45';
      ctx.textAlign = 'right';
      ctx.font = 'bold 15px Arial, sans-serif';
      ctx.fillText(scorePopup.text, 694, 289 - progress * 12);
      ctx.restore();
    }

    drawSystem(currentPhrase, 330, 84, { activeMeasure });
    drawSystem(nextPhrase, 425, 84, { preview: true });

    if (now < damageFlashUntil) {
      const progress = Math.max(0, Math.min(1, (now - damageFlashStart) / Math.max(1, damageFlashUntil - damageFlashStart)));
      ctx.save();
      ctx.globalAlpha = (1 - progress) * 0.72;
      ctx.strokeStyle = '#b42323';
      ctx.lineWidth = 7;
      ctx.strokeRect(3.5, 3.5, GAME_CANVAS_LOGICAL_WIDTH - 7, GAME_CANVAS_LOGICAL_HEIGHT - 7);
      ctx.restore();
    }
    }
    function gameInput(action, phase = "down") {
      const hand = action === "leftHand" || action === "y"
        ? "left"
        : action === "rightHand" || action === "a"
          ? "right"
          : null;

      if (!hand) return;

      if (!running || pausedForMenu || defeatCinematic) {
        handState[hand].down = false;
        handState[hand].activeHold = null;
        handState[hand].blockedUntilRelease = false;
        return;
      }

      const now = performance.now();
      if (phase === "down") pressHand(hand, now);
      else releaseHand(hand, now);
    }

    function gamePointer() {}
    function gamePointerMove() {}
    function gamePointerUp() {}

    function gamePause() {
      pausedForMenu = true;
      resetHandStates();
    }

    function gameResume() {
      pausedForMenu = false;
      resetHandStates();
      beginPhraseWithCountIn("GET READY");
    }

    function gameStop() {
      pausedForMenu = false;
      defeatCinematic = null;
      heartRecoveryEffect = null;
      healedHeartIndex = -1;
      resetHandStates();
      updateShellStatus();
    }

let resizeObserver = null;

    if ("ResizeObserver" in window) {
      resizeObserver = new ResizeObserver(() => {
        scaleAppToFrame();
        if (!sticks.left.active) resetJoystick(sticks.left);
        if (!sticks.right.active) resetJoystick(sticks.right);

        if (!running) {
          resetGameCanvasTransform();
          gameDraw();
        }
      });

      resizeObserver.observe(appFrame);
    }

    window.addEventListener("orientationchange", () => {
      setTimeout(() => {
        scaleAppToFrame();
        if (!sticks.left.active) resetJoystick(sticks.left);
        if (!sticks.right.active) resetJoystick(sticks.right);

        if (!running) {
          resetGameCanvasTransform();
          gameDraw();
        }
      }, 250);
    });

    function shutDownMobileArcade() {
      try {
        stopGame();
      } catch (err) {}

      if (audioCtx && audioCtx.state !== "closed") {
        audioCtx.close().catch(() => {});
      }

      audioCtx = null;
      audioMasterInput = null;
      audioLimiter = null;
      audioSafetyCeiling = null;
      audioNoiseBuffer = null;
    }

    function hardResetArcadeTouchControls() {
      document.querySelectorAll("button[data-action]").forEach(button => {
        const action = button.dataset.action;
        if (button.dataset.inputSource && action) {
          releaseArcadeActionButton(button, action);
        } else {
          button.dataset.pointerId = "";
          button.dataset.touchId = "";
          button.dataset.inputSource = "";
          button.classList.remove("pressed");
        }
      });

      resetJoystick(sticks.left);
      resetJoystick(sticks.right);
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) hardResetArcadeTouchControls();
    });

    window.addEventListener("pagehide", shutDownMobileArcade);


    scaleAppToFrame();
    loadPlayers();
    resetJoystick(sticks.left);
    resetJoystick(sticks.right);
    configureRhythmNinjaControls();
    gameInit();
    resetGameCanvasTransform();
    gameDraw();
  </script>
</body>
</html>
