  function quarterPatternFromBeats(beats) {
    return [...new Set(beats)].sort((a, b) => a - b).map(beat => noteAt(beat, 1));
  }

  function randomQuarterPattern(rng, difficulty = 1, options = {}) {
    const forceRest = options.forceRest === true;
    const sparse = options.sparse === true;
    const noConsecutiveRests = options.noConsecutiveRests === true;
    if (noConsecutiveRests) {
      const patterns = difficulty === 0
        ? [[0, 2], [1, 3], [0, 1, 3], [0, 2, 3]]
        : [[0, 2], [1, 3], [0, 1, 3], [0, 2, 3], [0, 1, 2], [1, 2, 3]];
      return quarterPatternFromBeats(randomChoice(rng, patterns));
    }

    let minimum = sparse ? 1 : (difficulty === 0 ? 2 : 2);
    let maximum = sparse ? 2 : (difficulty === 2 ? 4 : 3);
    if (!forceRest && difficulty === 2 && rng() < 0.32) maximum = 4;
    if (forceRest) maximum = Math.min(3, maximum);
    const count = minimum + randomInt(rng, Math.max(1, maximum - minimum + 1));
    return quarterPatternFromBeats(shuffledCopy([0, 1, 2, 3], rng).slice(0, count));
  }

  function randomSimplePattern(rng, difficulty = 1, options = {}) {
    const forceWhole = options.forceWhole === true;
    const forceTie = options.forceTie === true;
    const forceRest = options.forceRest === true;
    if (forceWhole) return [noteAt(0, 4)];
    if (forceTie) {
      const start = randomChoice(rng, [0, 1, 2]);
      const result = [noteAt(start, 2, { tieSegments: [1, 1] })];
      if (!forceRest) {
        [0, 1, 2, 3].forEach(beat => {
          if (beat < start || beat >= start + 2) {
            if (rng() < 0.58 + difficulty * 0.10) result.push(noteAt(beat, 1));
          }
        });
      }
      return result.sort((a, b) => a.start - b.start);
    }

    const fullTemplates = [
      [noteAt(0, 2), noteAt(2, 2)],
      [noteAt(0, 2), noteAt(2, 1), noteAt(3, 1)],
      [noteAt(0, 1), noteAt(1, 2), noteAt(3, 1)],
      [noteAt(0, 1), noteAt(1, 1), noteAt(2, 2)],
      [noteAt(0, 1), noteAt(1, 1), noteAt(2, 1), noteAt(3, 1)]
    ];
    const restTemplates = [
      [noteAt(0, 2), noteAt(3, 1)],
      [noteAt(1, 2), noteAt(3, 1)],
      [noteAt(0, 1), noteAt(2, 2)],
      [noteAt(0, 1), noteAt(1, 2)],
      [noteAt(0, 2)],
      [noteAt(2, 2)]
    ];
    const pool = forceRest || difficulty === 0
      ? restTemplates
      : [...fullTemplates, ...restTemplates];
    return chooseNotes(pool, randomInt(rng, 100000));
  }

  function randomPairPattern(rng, difficulty = 1, options = {}) {
    const pairCount = options.multi === true ? (difficulty === 0 ? 1 : 2) : 1;
    const selectedBeats = shuffledCopy([0, 1, 2, 3], rng).slice(0, pairCount);
    const selected = new Set(selectedBeats);
    const notes = [];
    for (let beat = 0; beat < 4; beat += 1) {
      if (selected.has(beat)) {
        notes.push(noteAt(beat, 0.5), noteAt(beat + 0.5, 0.5));
      } else {
        const probability = options.forceRest ? 0.38 : (difficulty === 0 ? 0.44 : difficulty === 1 ? 0.65 : 0.82);
        if (rng() < probability) notes.push(noteAt(beat, 1));
      }
    }
    return notes.sort((a, b) => a.start - b.start);
  }

  function randomOffbeatPattern(rng, difficulty = 1, options = {}) {
    const startBeat = randomChoice(rng, [0, 1, 2]);
    const notes = [noteAt(startBeat + 0.5, 0.5)];
    if (rng() < 0.58 + difficulty * 0.12 && startBeat + 1 < 4) notes.push(noteAt(startBeat + 1, 1));
    for (let beat = 0; beat < 4; beat += 1) {
      if (beat === startBeat || beat === startBeat + 1) continue;
      const probability = options.forceRest ? 0.35 : (difficulty === 0 ? 0.45 : 0.68);
      if (rng() < probability) notes.push(noteAt(beat, 1));
    }
    return notes.sort((a, b) => a.start - b.start);
  }

  function randomFigurePattern(rng, difficulty = 1, options = {}) {
    const startBeat = randomChoice(rng, [0, 2]);
    const modes = options.forceTie
      ? ["tie"]
      : ["dottedFirst", "eighthFirst", "tie"];
    const mode = randomChoice(rng, modes);
    let notes;
    if (mode === "dottedFirst") {
      notes = [noteAt(startBeat, 1.5), noteAt(startBeat + 1.5, 0.5)];
    } else if (mode === "eighthFirst") {
      notes = [noteAt(startBeat, 0.5), noteAt(startBeat + 0.5, 1.5)];
    } else {
      notes = [noteAt(startBeat, 2, { tieSegments: [1, 1] })];
    }
    const otherStart = startBeat === 0 ? 2 : 0;
    const probability = options.forceRest ? 0.28 : (difficulty === 0 ? 0.42 : 0.72);
    [otherStart, otherStart + 1].forEach(beat => {
      if (rng() < probability) notes.push(noteAt(beat, 1));
    });
    return notes.sort((a, b) => a.start - b.start);
  }

  function randomSixteenthPattern(rng, difficulty = 1, options = {}) {
    const figureBeat = randomInt(rng, 4);
    const kinds = options.forceFour ? ["four16"] : ["four16", "eighthTwo16", "two16Eighth"];
    const notes = figurePattern(figureBeat, randomChoice(rng, kinds), false);
    for (let beat = 0; beat < 4; beat += 1) {
      if (beat === figureBeat) continue;
      const probability = options.forceRest ? 0.30 : (difficulty === 0 ? 0.40 : difficulty === 1 ? 0.58 : 0.72);
      if (rng() < probability) notes.push(noteAt(beat, 1));
    }
    return notes.sort((a, b) => a.start - b.start);
  }

  function randomAdvancedEighthPattern(rng, difficulty = 1, options = {}) {
    const mode = randomInt(rng, 3);
    if (mode === 0) return randomPairPattern(rng, Math.max(1, difficulty), { multi: true, forceRest: options.forceRest });
    if (mode === 1) return randomOffbeatPattern(rng, difficulty, { forceRest: options.forceRest });
    return randomFigurePattern(rng, difficulty, { forceRest: options.forceRest });
  }

  function randomFullPattern(rng, difficulty = 1, options = {}) {
    const modes = options.rapid
      ? ["sixteenth", "pair", "sixteenth", "advanced"]
      : ["simple", "pair", "advanced", "figure", "sixteenth", "hold"];
    const mode = randomChoice(rng, modes);
    if (mode === "simple") return randomSimplePattern(rng, difficulty, { forceRest: options.forceRest });
    if (mode === "pair") return randomPairPattern(rng, difficulty, { multi: difficulty > 0, forceRest: options.forceRest });
    if (mode === "advanced") return randomAdvancedEighthPattern(rng, difficulty, { forceRest: options.forceRest });
    if (mode === "figure") return randomFigurePattern(rng, difficulty, { forceRest: options.forceRest });
    if (mode === "hold") return randomSimplePattern(rng, difficulty, { forceRest: options.forceRest });
    return randomSixteenthPattern(rng, difficulty, { forceRest: options.forceRest });
  }

  function primaryPatternForFocus(levelNumber, focus, rng, difficulty, options = {}) {
    if (["quarter", "quarterRest", "quarterSparse"].includes(focus)) {
      return randomQuarterPattern(rng, difficulty, {
        forceRest: focus !== "quarter" || options.forceRest,
        sparse: focus === "quarterSparse" || options.sparse,
        noConsecutiveRests: levelNumber === 1
      });
    }
    if (["long", "holdVsRest", "holdVsPulse", "longRest"].includes(focus)) {
      return randomSimplePattern(rng, difficulty, { forceRest: focus === "longRest" || options.forceRest });
    }
    if (["tiedHalf", "tiedFigure"].includes(focus)) {
      return focus === "tiedHalf"
        ? randomSimplePattern(rng, difficulty, { forceTie: true, forceRest: options.forceRest })
        : randomFigurePattern(rng, difficulty, { forceTie: true, forceRest: options.forceRest });
    }
    if (focus === "whole") return randomSimplePattern(rng, difficulty, { forceWhole: true });
    if (focus === "wholeVsSlow") return randomSimplePattern(rng, difficulty, { forceWhole: true });
    if (focus === "simple") return randomSimplePattern(rng, difficulty, { forceRest: options.forceRest });
    if (["pair", "pairVsRest", "pairVsPulse"].includes(focus)) return randomPairPattern(rng, difficulty, { forceRest: focus === "pairVsRest" || options.forceRest });
    if (["multiPair", "multiPairVsPulse", "multiPairRest"].includes(focus)) return randomPairPattern(rng, difficulty, { multi: true, forceRest: focus === "multiPairRest" || options.forceRest });
    if (["offbeat", "offbeatVsPulse", "offbeatVsRest"].includes(focus)) return randomOffbeatPattern(rng, difficulty, { forceRest: focus === "offbeatVsRest" || options.forceRest });
    if (["figure", "figureVsPulse", "figureVsRest"].includes(focus)) return randomFigurePattern(rng, difficulty, { forceRest: focus === "figureVsRest" || options.forceRest });
    if (["independence", "independenceRest", "holdVsMove"].includes(focus)) return randomAdvancedEighthPattern(rng, difficulty, { forceRest: focus === "independenceRest" || options.forceRest });
    if (["advancedEighth", "advancedEighthRest", "offbeatVsPair"].includes(focus)) return randomAdvancedEighthPattern(rng, Math.max(1, difficulty), { forceRest: focus === "advancedEighthRest" || options.forceRest });
    if (["four16", "sixteenth", "sixteenthVsPulse", "sixteenthVsRest"].includes(focus)) return randomSixteenthPattern(rng, difficulty, { forceFour: focus === "four16", forceRest: focus === "sixteenthVsRest" || options.forceRest });
    if (["full", "rapidFull", "holdVsRapid", "fullRest"].includes(focus)) return randomFullPattern(rng, difficulty, { rapid: focus === "rapidFull" || focus === "holdVsRapid", forceRest: focus === "fullRest" || options.forceRest });
    return randomQuarterPattern(rng, difficulty, { forceRest: options.forceRest });
  }

  function simplePartnerPattern(levelNumber, rng, difficulty, focus = "quarter") {
    if (focus.includes("VsPulse")) {
      return randomQuarterPattern(rng, Math.max(1, difficulty), { forceRest: difficulty === 0 });
    }
    if (focus === "wholeVsSlow") {
      return randomSimplePattern(rng, Math.min(1, difficulty), { forceRest: true });
    }
    if (levelNumber <= 2) return randomQuarterPattern(rng, Math.min(1, difficulty), { forceRest: true });
    if (levelNumber <= 4) return randomSimplePattern(rng, Math.min(1, difficulty), { forceRest: rng() < 0.35 });
    if (levelNumber <= 8) {
      return rng() < 0.55
        ? randomQuarterPattern(rng, 1, { forceRest: rng() < 0.45 })
        : randomSimplePattern(rng, 1, { forceRest: rng() < 0.45 });
    }
    if (focus.includes("sixteenth") || focus === "full" || focus === "rapidFull") {
      return rng() < 0.58
        ? randomQuarterPattern(rng, 1, { forceRest: rng() < 0.35 })
        : randomSimplePattern(rng, 1, { forceRest: rng() < 0.35 });
    }
    return rng() < 0.5
      ? randomPairPattern(rng, 1, { forceRest: true })
      : randomSimplePattern(rng, 1, { forceRest: true });
  }

  function cloneMeasureResult(result) {
    return { left: copyNotes(result.left || []), right: copyNotes(result.right || []) };
  }



  // A crossing overlap is the difficult dovetail relationship where one hand's
  // note begins first, the other hand enters before it releases, and that later
  // note continues beyond the first note's ending:
  //        A.start < B.start < A.end < B.end
  // Matching starts, matching endings, notes contained inside a longer hold,
  // and attacks that begin exactly when another note releases are not crossings.
  // The rhythm/relation option pool is left intact; generation simply rerolls a
  // phrase when its completed two-hand spans exceed the level's crossing policy.
  function crossingOverlapPolicyForSystem(levelNumber, systemNumber) {
    if (levelNumber <= 8) {
      return { systemChance: 0, allowsCrossing: false, maximumChains: 0, maximumLinks: 0 };
    }

    let systemChance = 0.08;
    if (levelNumber === 10) systemChance = 0.12;
    else if (levelNumber === 11) systemChance = 0.16;
    else if (levelNumber >= 12) systemChance = 0.22;

    // This roll is stable for the system and independent of generation attempts,
    // so "onward" remains a continuing low frequency rather than a global count.
    const rng = seededRng(mixedSeed(runSeed, levelNumber, systemNumber, 0x43524f53));
    const allowsCrossing = rng() < systemChance;
    let maximumLinks = 1;
    if (allowsCrossing && levelNumber === 11 && rng() < 0.15) maximumLinks = 2;
    if (allowsCrossing && levelNumber >= 12 && rng() < 0.20) maximumLinks = 2;

    return {
      systemChance,
      allowsCrossing,
      maximumChains: allowsCrossing ? 1 : 0,
      maximumLinks: allowsCrossing ? maximumLinks : 0
    };
  }

  function logicalHandEvents(measures, hand) {
    const epsilon = 0.0001;
    const events = [];
    measures.forEach((measure, measureIndex) => {
      const notes = [...(measure[hand] || [])]
        .map((note, noteIndex) => ({ note, noteIndex }))
        .sort((a, b) => a.note.start - b.note.start || b.note.duration - a.note.duration);

      notes.forEach(({ note, noteIndex }) => {
        const start = measureIndex * 4 + note.start;
        const end = start + note.duration;
        const previous = events[events.length - 1];
        const previousRef = previous?.refs[previous.refs.length - 1];
        const joinsPreviousTie = Boolean(
          note.tieFromPrev &&
          previous &&
          previousRef?.note?.tieToNext &&
          Math.abs(previous.end - start) <= epsilon
        );

        if (joinsPreviousTie) {
          previous.end = end;
          previous.refs.push({ measureIndex, noteIndex, note });
          previous.tieToNext = Boolean(note.tieToNext);
          return;
        }

        events.push({
          id: `${hand}:${events.length}`,
          hand,
          start,
          end,
          refs: [{ measureIndex, noteIndex, note }],
          tieToNext: Boolean(note.tieToNext)
        });
      });
    });
    return events;
  }

  function crossingOverlapStats(measures) {
    const epsilon = 0.0001;
    const events = [
      ...logicalHandEvents(measures, "left"),
      ...logicalHandEvents(measures, "right")
    ];
    const left = events.filter(event => event.hand === "left");
    const right = events.filter(event => event.hand === "right");
    const edges = [];

    const addCrossing = (first, second) => {
      if (
        first.start < second.start - epsilon &&
        second.start < first.end - epsilon &&
        first.end < second.end - epsilon
      ) {
        edges.push({ from: first.id, to: second.id, first, second });
      }
    };

    left.forEach(leftEvent => {
      right.forEach(rightEvent => {
        addCrossing(leftEvent, rightEvent);
        addCrossing(rightEvent, leftEvent);
      });
    });

    if (edges.length === 0) {
      return { edgeCount: 0, chainCount: 0, maximumLinks: 0, edges: [] };
    }

    const directed = new Map();
    const undirected = new Map();
    const nodes = new Set();
    const connect = (map, from, to) => {
      if (!map.has(from)) map.set(from, []);
      map.get(from).push(to);
    };

    edges.forEach(edge => {
      nodes.add(edge.from);
      nodes.add(edge.to);
      connect(directed, edge.from, edge.to);
      connect(undirected, edge.from, edge.to);
      connect(undirected, edge.to, edge.from);
    });

    let chainCount = 0;
    const visited = new Set();
    nodes.forEach(node => {
      if (visited.has(node)) return;
      chainCount += 1;
      const stack = [node];
      visited.add(node);
      while (stack.length) {
        const current = stack.pop();
        (undirected.get(current) || []).forEach(next => {
          if (visited.has(next)) return;
          visited.add(next);
          stack.push(next);
        });
      }
    });

    const memo = new Map();
    const longestFrom = node => {
      if (memo.has(node)) return memo.get(node);
      const nextNodes = directed.get(node) || [];
      const length = nextNodes.length === 0
        ? 0
        : Math.max(...nextNodes.map(next => 1 + longestFrom(next)));
      memo.set(node, length);
      return length;
    };
    const maximumLinks = Math.max(...[...nodes].map(longestFrom));

    return { edgeCount: edges.length, chainCount, maximumLinks, edges };
  }

  function crossingOverlapOutputValidForSystem(measures, levelNumber, systemNumber) {
    const policy = crossingOverlapPolicyForSystem(levelNumber, systemNumber);
    const stats = crossingOverlapStats(measures);
    if (!policy.allowsCrossing) return stats.edgeCount === 0;
    return (
      stats.chainCount <= policy.maximumChains &&
      stats.maximumLinks <= policy.maximumLinks
    );
  }

  function alternatingMeasureForFocus(focus, rng, measure) {
    const startHand = ((measure + randomInt(rng, 2)) % 2 === 0) ? "left" : "right";
    if (["pair", "multiPair", "advancedEighth", "offbeat"].includes(focus)) {
      return alternatingBeatHandsWithFigure(startHand, randomInt(rng, 4), "pair");
    }
    if (["sixteenth", "four16", "full", "rapidFull"].includes(focus)) {
      const kinds = ["four16", "eighthTwo16", "two16Eighth"];
      return alternatingBeatHandsWithFigure(startHand, randomInt(rng, 4), randomChoice(rng, kinds));
    }
    return alternatingQuarterHands(startHand);
  }

  function generateMeasureForChallenge(levelNumber, challenge, measure, difficulty, rng, systemSeed) {
    let relation = challenge.relation;
    if (relation === "wildSingle") relation = randomChoice(rng, ["singleLeft", "singleRight", "barSwitch", "singleEcho"]);
    if (relation === "wildBoth") {
      let allowed;
      if (levelNumber <= 4) {
        allowed = ["barSwitch", "alternate", "sharedAnchor", "matching", "rolesSwitch", "contrast"];
      } else if (levelNumber === 5) {
        // One hand may use paired eighths at a time in the introduction level.
        allowed = ["barSwitch", "alternate", "sharedAnchor", "rolesSwitch", "independentLeft", "independentRight"];
      } else if (levelNumber === 11) {
        // Sixteenth-note introduction never places dense cells in both hands.
        allowed = ["barSwitch", "alternate", "sharedAnchor", "rolesSwitch", "independentLeft", "independentRight"];
      } else {
        allowed = ["barSwitch", "alternate", "sharedAnchor", "matching", "rolesSwitch", "contrast", "independentLeft", "independentRight"];
      }
      relation = randomChoice(rng, allowed);
    }

    if (relation === "alternate") return alternatingMeasureForFocus(challenge.focus, rng, measure);
    if (relation === "sharedAnchor") {
      return anchoredAlternatingQuarterHands(randomChoice(rng, ["left", "right"]), randomInt(rng, 4));
    }
    if (relation === "sharedLong") {
      const duration = levelNumber <= 3 ? 2 : randomChoice(rng, [2, 2, 4]);
      return assignBothSame([noteAt(0, duration)]);
    }

    let primary = primaryPatternForFocus(levelNumber, challenge.focus, rng, difficulty);
    let secondary = simplePartnerPattern(levelNumber, rng, difficulty, challenge.focus);

    if (challenge.focus === "holdVsMove") {
      primary = randomAdvancedEighthPattern(rng, Math.max(1, difficulty), { forceRest: false });
      secondary = randomSimplePattern(rng, difficulty, { forceRest: false });
    } else if (challenge.focus === "holdVsRapid") {
      primary = randomFullPattern(rng, Math.max(1, difficulty), { rapid: true });
      secondary = randomSimplePattern(rng, difficulty, { forceRest: false });
    } else if (challenge.focus === "offbeatVsPair") {
      primary = randomOffbeatPattern(rng, Math.max(1, difficulty));
      secondary = randomPairPattern(rng, Math.max(1, difficulty), { multi: true });
    } else if (challenge.relation === "contrast" && ["advancedEighth", "rapidFull", "full"].includes(challenge.focus)) {
      secondary = primaryPatternForFocus(levelNumber, challenge.focus, rng, Math.max(1, difficulty), { forceRest: rng() < 0.35 });
    }
    const firstHand = (mixedSeed(systemSeed, 0x48414e44) & 1) === 0 ? "left" : "right";
    const opposite = firstHand === "left" ? "right" : "left";

    if (relation === "singleLeft") return assignOneHand("left", primary);
    if (relation === "singleRight") return assignOneHand("right", primary);
    if (relation === "barSwitch") return assignOneHand(measure === 0 ? firstHand : opposite, primary);
    if (relation === "singleEcho") {
      const hand = measure === 0 ? firstHand : opposite;
      return assignOneHand(hand, measure === 0 ? primary : primaryPatternForFocus(levelNumber, challenge.focus, rng, difficulty));
    }
    if (relation === "matching") return assignBothSame(primary);
    if (relation === "independentLeft") return { left: primary, right: challenge.focus.includes("Rest") || challenge.focus.includes("VsRest") ? [] : secondary };
    if (relation === "independentRight") return { left: challenge.focus.includes("Rest") || challenge.focus.includes("VsRest") ? [] : secondary, right: primary };
    if (relation === "rolesSwitch") {
      const primaryHand = measure === 0 ? firstHand : opposite;
      return primaryHand === "left"
        ? { left: primary, right: secondary }
        : { left: secondary, right: primary };
    }
    if (relation === "densityContrast") {
      const dense = measure === 1;
      const activeHand = measure === 0 ? firstHand : opposite;
      const pattern = primaryPatternForFocus(levelNumber, challenge.focus, rng, dense ? 2 : 0, { forceRest: !dense });
      return assignOneHand(activeHand, pattern);
    }
    if (relation === "controlledBoth16") {
      const leftBeat = randomChoice(rng, [0, 1]);
      const rightBeat = randomChoice(rng, [2, 3]);
      const kinds = ["four16", "eighthTwo16", "two16Eighth"];
      const left = figurePattern(leftBeat, randomChoice(rng, kinds), false);
      const right = figurePattern(rightBeat, randomChoice(rng, kinds), false);
      if (measure === 1 && rng() < 0.55) {
        left.push(noteAt(3, 1));
        right.push(noteAt(0, 1));
      }
      return { left: left.sort((a, b) => a.start - b.start), right: right.sort((a, b) => a.start - b.start) };
    }
    if (relation === "contrast") {
      return firstHand === "left"
        ? { left: primary, right: secondary }
        : { left: secondary, right: primary };
    }
    return firstHand === "left"
      ? { left: primary, right: secondary }
      : { left: secondary, right: primary };
  }

  function crossBarTieMeasures(rng, difficulty) {
    const tiedHand = randomChoice(rng, ["left", "right"]);
    const otherHand = tiedHand === "left" ? "right" : "left";
    const measures = [
      { left: [], right: [] },
      { left: [], right: [] }
    ];
    measures[0][tiedHand] = [
      ...randomQuarterPattern(rng, difficulty, { forceRest: true }).filter(item => item.start < 3),
      noteAt(3, 1, { tieToNext: true })
    ].sort((a, b) => a.start - b.start);
    measures[1][tiedHand] = [
      noteAt(0, 1, { tieFromPrev: true }),
      ...randomQuarterPattern(rng, difficulty, { forceRest: true }).filter(item => item.start >= 2)
    ].sort((a, b) => a.start - b.start);
    measures[0][otherHand] = randomSimplePattern(rng, 0, { forceRest: true });
    measures[1][otherHand] = randomSimplePattern(rng, 0, { forceRest: true });
    return measures;
  }

  function measureSignature(measure) {
    const handSignature = hand => (measure[hand] || []).map(item => (
      `${item.start}:${item.duration}:${item.tieSegments?.join("+") || ""}:${item.tieToNext ? "T" : ""}:${item.tieFromPrev ? "F" : ""}`
    )).join(",");
    return `${handSignature("left")}|${handSignature("right")}`;
  }

  function generatePedagogyMeasures(levelNumber, levelSlot, challenge, systemNumber, attempt = 0) {
    const difficulty = difficultyForLevelSlot(levelSlot);
    const systemSeed = mixedSeed(runSeed, levelNumber, levelSlot, systemNumber, attempt, 0x5259484d);
    const rng = seededRng(systemSeed);
    if (challenge.relation === "crossBarTie") {
      return crossBarTieMeasures(rng, difficulty);
    }

    let measures = [
      generateMeasureForChallenge(levelNumber, challenge, 0, difficulty, rng, systemSeed),
      generateMeasureForChallenge(levelNumber, challenge, 1, difficulty, rng, systemSeed)
    ];

    // Exact measure repetition is allowed only when matching itself is the lesson.
    if (challenge.relation !== "matching" && measureSignature(measures[0]) === measureSignature(measures[1])) {
      const retryRng = seededRng(mixedSeed(systemSeed, 0x52455452));
      measures[1] = generateMeasureForChallenge(levelNumber, challenge, 1, difficulty, retryRng, systemSeed + 1);
    }

    // Crossing-overlap difficulty is enforced by deterministic rerolling after
    // generation, so no rhythm cell or hand-relation option is removed or edited.
    return measures;
  }

  function noteEventsFromTracks(tracks) {
    const events = [];
    ["left", "right"].forEach(hand => {
      const notes = tracks[hand].filter(item => item.kind === "note").sort((a, b) => a.start - b.start);
      for (let index = 0; index < notes.length; index += 1) {
        const item = notes[index];
        const next = notes[index + 1];
        if (
          item.tieToNext && next?.tieFromPrev &&
          Math.abs(item.start + item.duration - next.start) < 0.0001
        ) {
          events.push({
            ...item,
            duration: item.duration + next.duration,
            tieSegments: [item.duration, next.duration],
            hand
          });
          index += 1;
        } else {
          events.push({ ...item, hand });
        }
      }
    });
    return events.sort((a, b) => a.start - b.start || a.hand.localeCompare(b.hand));
  }

  const pedagogyBlueprintCache = new Map();
  const pedagogyPhraseSignatures = new Set();
  let pedagogyCacheSeed = null;

  function resetPedagogyRunCache() {
    pedagogyBlueprintCache.clear();
    pedagogyPhraseSignatures.clear();
    pedagogyCacheSeed = runSeed >>> 0;
  }

  function pedagogySystemSignature(measures) {
    return measures.map(measureSignature).join("||");
  }

  function ensurePedagogyBlueprintsThrough(systemNumber) {
    if (pedagogyCacheSeed !== (runSeed >>> 0)) resetPedagogyRunCache();
    for (let candidateSystem = 1; candidateSystem <= systemNumber; candidateSystem += 1) {
      if (isSuperMoveSystem(candidateSystem) || pedagogyBlueprintCache.has(candidateSystem)) continue;
      const levelNumber = levelForSystem(candidateSystem);
      const levelSlot = levelSlotForSystem(candidateSystem);
      const challenge = levelChallengeOrder(levelNumber)[levelSlot - 1];
      let measures = null;
      let signature = "";
      for (let attempt = 0; attempt < 192; attempt += 1) {
        const generated = generatePedagogyMeasures(levelNumber, levelSlot, challenge, candidateSystem, attempt);
        if (!crossingOverlapOutputValidForSystem(generated, levelNumber, candidateSystem)) continue;
        const generatedSignature = pedagogySystemSignature(generated);
        if (!pedagogyPhraseSignatures.has(generatedSignature)) {
          measures = generated;
          signature = generatedSignature;
          break;
        }
      }
      if (!measures) {
        throw new Error(`Unable to generate a unique rhythm for system ${candidateSystem}.`);
      }
      pedagogyPhraseSignatures.add(signature);
      pedagogyBlueprintCache.set(candidateSystem, {
        levelNumber,
        levelSlot,
        challenge,
        measures: measures.map(cloneMeasureResult)
      });
    }
  }

  function pedagogyBlueprintForSystem(systemNumber) {
    ensurePedagogyBlueprintsThrough(systemNumber);
    const blueprint = pedagogyBlueprintCache.get(systemNumber);
    if (!blueprint) throw new Error(`Missing pedagogy blueprint for system ${systemNumber}.`);
    return {
      ...blueprint,
      measures: blueprint.measures.map(cloneMeasureResult)
    };
  }

  function buildPedagogyPhrase(systemNumber) {
    const blueprint = pedagogyBlueprintForSystem(systemNumber);
    const { levelNumber, levelSlot, challenge, measures } = blueprint;
    const profile = pedagogyProfileForLevel(levelNumber);
    const tracks = { left: [], right: [] };

    measures.forEach((generated, measure) => {
      addMeasure(tracks.left, measure, timeline(generated.left));
      addMeasure(tracks.right, measure, timeline(generated.right));
    });

    const noteEvents = noteEventsFromTracks(tracks);
    const phraseSeed = mixedSeed(runSeed, systemNumber, levelNumber, levelSlot);
    const phrase = {
      systemNumber,
      level: levelNumber,
      levelSystem: levelSlot,
      runSeed,
      runCode: (runSeed >>> 0).toString(16).toUpperCase().padStart(8, "0").slice(-4),
      seed: phraseSeed,
      challengeId: challenge.id,
      challengeLabel: challenge.label,
      stage: {
        step: levelNumber,
        start: levelSlot,
        end: levelSlot,
        title: profile.title,
        rule: challenge.label
      },
      isSuperMove: false,
      tracks,
      noteEvents,
      stats: { expected: noteEvents.length, correct: 0, errors: 0 }
    };
    return annotatePhraseWorldMeta(phrase);
  }



  function buildPhrase(serial) {
    const systemNumber = serial + 1;
    if (isSuperMoveSystem(systemNumber)) return buildSuperMovePhrase(systemNumber);
    return buildPedagogyPhrase(systemNumber);
  }


  function beginPhraseWithCountIn(message = "GET READY") {
    currentPhrase = buildPhrase(completedSystems);
    nextPhrase = buildPhrase(completedSystems + 1);
    bpm = bpmForSystem(currentPhrase.systemNumber);
    beatDurationMs = 60000 / bpm;
    countIn = true;
    phraseStartTime = performance.now() + COUNT_IN_BEATS * beatDurationMs;
    lastBeatClickToken = null;
    setFeedback(message, COUNT_IN_BEATS * beatDurationMs, "info");
  }

  function resetHandStates() {
    Object.values(handState).forEach(state => {
      state.down = false;
      state.activeHold = null;
      state.blockedUntilRelease = false;
      state.restBoundaryExemptUntil = 0;
    });
  }

  function setFeedback(message, durationMs = 700, tone = "neutral") {
    feedbackText = message;
    feedbackUntil = performance.now() + durationMs;
    feedbackTone = tone;
  }

  function streakMultiplierFor(value = streak) {
    if (value >= 32) return 4;
    if (value >= 16) return 3;
    if (value >= 8) return 2;
    return 1;
  }

  function timingLabelForDifference(differenceBeats, perfectWindow = 0.075) {
    if (Math.abs(differenceBeats) <= perfectWindow) return "PERFECT";
    return differenceBeats < 0 ? "EARLY" : "LATE";
  }

  function timingTone(label) {
    return label === "PERFECT" ? "perfect" : "good";
  }

  function showScorePopup(points, multiplier, now = performance.now()) {
    scorePopup = {
      text: multiplier > 1 ? `+${points}  ×${multiplier}` : `+${points}`,
      start: now,
      until: now + 720
    };
  }

  function processHeartRecoveryMilestones(previousScore, newScore, now = performance.now()) {
    let recoveredHearts = 0;
    while (nextHeartRecoveryScore <= newScore) {
      const milestone = nextHeartRecoveryScore;
      nextHeartRecoveryScore += HEART_RECOVERY_POINTS;
      if (milestone <= previousScore || health <= 0 || health >= RHYTHM_NINJA_MAX_HEALTH || defeatCinematic) {
        continue;
      }

      health = Math.min(RHYTHM_NINJA_MAX_HEALTH, health + 1);
      recoveredHearts += 1;
      healedHeartIndex = health - 1;
      healFlashStart = now;
      healFlashUntil = now + HEART_RECOVERY_EFFECT_MS;
      heartRecoveryEffect = {
        start: now,
        until: now + HEART_RECOVERY_EFFECT_MS,
        milestone,
        heartIndex: healedHeartIndex
      };
      soundHeartRecovery();
      setFeedback(`${milestone} POINTS • +1 HEART`, 1250, "good");
      updateShellStatus(now);
    }
    return recoveredHearts;
  }

  function notationRestAtBeat(phrase, hand, localBeat) {
    const track = phrase?.tracks?.[hand];
    if (!Array.isArray(track)) return null;
    return track.find(item => (
      item.kind === "rest" &&
      localBeat >= item.start - 0.0001 &&
      localBeat < item.start + item.duration - 0.0001
    )) || null;
  }

  function markRestMissedAtAbsoluteBeat(hand, absoluteBeat) {
    let phrase = currentPhrase;
    let localBeat = absoluteBeat;
    if (absoluteBeat >= PHRASE_BEATS) {
      phrase = nextPhrase;
      localBeat = absoluteBeat - PHRASE_BEATS;
    }
    const rest = notationRestAtBeat(phrase, hand, localBeat);
    if (!rest) return false;
    rest.missed = true;
    rest.completed = false;
    return true;
  }

  function markRestRangeMissed(phrase, startBeat, endBeat) {
    if (!phrase?.tracks) return;
    ["left", "right"].forEach(hand => {
      const track = phrase.tracks[hand];
      if (!Array.isArray(track)) return;
      track.forEach(item => {
        if (item.kind !== "rest") return;
        const itemEnd = item.start + item.duration;
        const overlaps = item.start < endBeat - 0.0001 && itemEnd > startBeat + 0.0001;
        if (!overlaps) return;
        item.missed = true;
        item.completed = false;
      });
    });
  }

  function processNotationRestResults(now = performance.now()) {
    if (countIn) return;
    const absoluteBeat = currentBeatPosition(now);
    const processPhrase = (phrase, baseBeat) => {
      if (!phrase?.tracks) return;
      ["left", "right"].forEach(hand => {
        const track = phrase.tracks[hand];
        if (!Array.isArray(track)) return;
        track.forEach(item => {
          if (item.kind !== "rest" || item.missed || item.completed) return;
          if (absoluteBeat >= baseBeat + item.start + item.duration - 0.0001) {
            item.completed = true;
          }
        });
      });
    };
    processPhrase(currentPhrase, 0);
    processPhrase(nextPhrase, PHRASE_BEATS);
  }

  function notationNoteEvent(phrase, hand, item) {
    if (!phrase || !Array.isArray(phrase.noteEvents)) return null;
    const sourceItem = item?.sourceItem || item;
    const exact = phrase.noteEvents.find(event => (
      event.hand === hand &&
      Math.abs(event.start - sourceItem.start) < 0.0001 &&
      Math.abs(event.duration - sourceItem.duration) < 0.0001
    ));
    if (exact) return exact;

    // The two displayed whole notes in a super move are one eight-beat event.
    return phrase.noteEvents.find(event => (
      event.hand === hand &&
      sourceItem.start >= event.start - 0.0001 &&
      sourceItem.start + sourceItem.duration <= event.start + event.duration + 0.0001
    )) || null;
  }

  function notationResultColor(phrase, hand, item) {
    if (item.kind === "rest") {
      const sourceItems = Array.isArray(item.sourceItems) && item.sourceItems.length
        ? item.sourceItems
        : [item.sourceItem || item];
      if (sourceItems.some(source => source.missed)) return "#c43d3d";
      if (sourceItems.every(source => source.completed)) return "#238553";
      return "#5b6470";
    }
    const event = notationNoteEvent(phrase, hand, item);
    if (event?.missed) return "#c43d3d";
    if (event?.completed) return "#238553";
    return "#111827";
  }

  function currentBeatPosition(now = performance.now()) {
    return (now - phraseStartTime) / beatDurationMs;
  }

  function updateShellStatus(now = performance.now()) {
    if (typeof setMessage !== "function") return;

    let beatLabel = "COUNT IN";
    if (!countIn) {
      const beat = Math.floor(Math.max(0, currentBeatPosition(now))) % BEATS_PER_MEASURE + 1;
      beatLabel = `BEAT ${beat}`;
    }

    setMessage(`HP ${health}/${RHYTHM_NINJA_MAX_HEALTH} • ${beatLabel} • ${bpm} BPM`);
  }

  function failInput(message, phrase = currentPhrase, options = {}) {
    if (!running || health <= 0) return;

    const now = performance.now();
    const damageProtected = now < damageCooldownUntil;

    if (!damageProtected) {
      health -= 1;
      damageCooldownUntil = now + DAMAGE_COOLDOWN_BEATS * beatDurationMs;
      damagedHeartIndex = health;
      damageFlashStart = now;
      damageFlashUntil = now + 470;
      soundDamage();
    } else {
      soundProtected();
    }

    const errorHand = options.errorData?.hand || null;
    if (errorHand === 'left') {
      cancelRepeatedAndContinuousAttacks(now);
    }
    if (!options.rest && options.errorType === 'leftCollision' && options.errorData?.event) {
      triggerLeftCollision(options.errorData.event, now);
    }

    streak = 0;
    if (phrase?.stats) phrase.stats.errors += 1;
    setFeedback(
      damageProtected ? `${message} • HEART PROTECTED` : `${message} • −1 HEART`,
      damageProtected ? 780 : 950,
      "error"
    );

    if (!damageProtected && health <= 0) {
      beginDefeatCinematic("Out of health.");
    }
  }

  function completeEvent(event, message, bonus = 0, tone = "good", playCompletionSound = true) {
    if (event.completed || event.missed) return;
    event.completed = true;
    if (event.phrase?.stats) event.phrase.stats.correct += 1;
    streak += 1;
    const multiplier = streakMultiplierFor(streak);
    const points = multiplier;
    const recoveredHearts = addScore(points);
    showScorePopup(points, multiplier);
    if (playCompletionSound) soundCorrect();
    if (recoveredHearts > 0 && heartRecoveryEffect) {
      setFeedback(`${heartRecoveryEffect.milestone} POINTS • +1 HEART`, 1250, "good");
    } else {
      setFeedback(`${message} • +${points}`, 620, tone);
    }
  }

  function findPressCandidate(hand, beatPosition) {
    const candidates = [];

    currentPhrase.noteEvents.forEach(event => {
      if (
        event.hand === hand &&
        !event.attackMatched &&
        !event.missed &&
        Math.abs(beatPosition - event.start) <= ATTACK_WINDOW_BEATS
      ) {
        candidates.push({ event, targetBeat: event.start });
      }
    });

    nextPhrase.noteEvents.forEach(event => {
      const targetBeat = PHRASE_BEATS + event.start;
      if (
        event.hand === hand &&
        !event.attackMatched &&
        !event.missed &&
        Math.abs(beatPosition - targetBeat) <= ATTACK_WINDOW_BEATS
      ) {
        candidates.push({ event, targetBeat });
      }
    });

    return candidates
      .sort((a, b) => Math.abs(beatPosition - a.targetBeat) - Math.abs(beatPosition - b.targetBeat))[0] || null;
  }

  function findWrittenEventNear(hand, beatPosition) {
    const candidates = [];
    const collect = (phrase, baseBeat) => {
      if (!phrase || !Array.isArray(phrase.noteEvents)) return;
      phrase.noteEvents.forEach(event => {
        if (event.hand !== hand || event.missed) return;
        const targetBeat = baseBeat + event.start;
        if (Math.abs(beatPosition - targetBeat) <= ATTACK_WINDOW_BEATS) {
          candidates.push({ event, targetBeat });
        }
      });
    };
    collect(currentPhrase, 0);
    collect(nextPhrase, PHRASE_BEATS);
    return candidates
      .sort((a, b) => Math.abs(beatPosition - a.targetBeat) - Math.abs(beatPosition - b.targetBeat))[0] || null;
  }

  function pressHand(hand, now) {
    const state = handState[hand];
    if (state.down) return;
    state.down = true;

    if (state.blockedUntilRelease) return;

    const beatPosition = currentBeatPosition(now);
    if (beatPosition < -ATTACK_WINDOW_BEATS) {
      setFeedback("WAIT FOR THE COUNT-IN", 650, "error");
      return;
    }

    const candidate = findPressCandidate(hand, beatPosition);
    const substitution = substitutionContextAtAbsoluteBeat(beatPosition);

    // The note timing window and the rest window overlap at both edges. A real
    // note candidate must win there, or a correctly early attack after a rest
    // is falsely scored as a rest mistake. Presses in the interior of a rest,
    // where no note candidate exists, are handled as missed rests below.
    if (candidate) {
      const { event, targetBeat } = candidate;

      if (substitution) {
        const restEndTime = phraseStartTime + substitution.absoluteEnd * beatDurationMs;
        const targetsRestExit = targetBeat >= substitution.absoluteEnd - ATTACK_WINDOW_BEATS - 0.0001;
        state.restBoundaryExemptUntil = targetsRestExit
          ? restEndTime + 45
          : now + REST_RELEASE_GRACE_MS;
      }

      event.attackMatched = true;
      registerWorldPress(hand, event, now, targetBeat);
      const signedAttackDifference = beatPosition - targetBeat;
      const attackTiming = timingLabelForDifference(signedAttackDifference, 0.075);
      const perfectBonus = attackTiming === "PERFECT" ? 2 : 0;

      if (event.duration >= HOLD_THRESHOLD_BEATS) {
        const releaseAllowance = releaseAllowanceForDuration(event.duration);
        state.activeHold = {
          event,
          targetEndTime: phraseStartTime + (targetBeat + event.duration) * beatDurationMs,
          holdBeatDurationMs: beatDurationMs,
          earlyReleaseAllowance: releaseAllowance.early,
          lateReleaseAllowance: releaseAllowance.late,
          perfectBonus,
          attackTiming
        };
        setFeedback(`${hand.toUpperCase()} ${attackTiming} • HOLD`, 520, timingTone(attackTiming));
      } else {
        completeEvent(
          event,
          `${hand.toUpperCase()} ${attackTiming}`,
          perfectBonus,
          timingTone(attackTiming)
        );
      }
      return;
    }

    if (substitution) {
      if (hand === 'left') cancelRepeatedAndContinuousAttacks(now);
      markSubstitutionMiss(substitution, now, beatPosition, {
        message: "REST MISSED",
        applyPenalty: true
      });
      return;
    }

    markRestMissedAtAbsoluteBeat(hand, beatPosition);
    if (hand === 'right') {
      const source = findWrittenEventNear('left', beatPosition);
      createIncorrectAttackSequence(source?.event || null, now);
    }
    failInput(`${hand.toUpperCase()} EXTRA`, currentPhrase, {
      errorData: { hand }
    });
  }

  function releaseHand(hand, now) {
    const state = handState[hand];
    state.down = false;
    state.restBoundaryExemptUntil = 0;

    if (state.blockedUntilRelease) {
      state.blockedUntilRelease = false;
      return;
    }

    const activeHold = state.activeHold;
    if (!activeHold) return;

    state.activeHold = null;
    const differenceBeats = (now - activeHold.targetEndTime) / activeHold.holdBeatDurationMs;

    if (
      differenceBeats >= -activeHold.earlyReleaseAllowance &&
      differenceBeats <= activeHold.lateReleaseAllowance
    ) {
      const releaseTiming = timingLabelForDifference(differenceBeats, 0.15);
      const releaseBonus = releaseTiming === "PERFECT" ? 2 : 0;
      const combinedPerfect = activeHold.attackTiming === "PERFECT" && releaseTiming === "PERFECT";
      completeEvent(
        activeHold.event,
        `${hand.toUpperCase()} ${releaseTiming} RELEASE`,
        activeHold.perfectBonus + releaseBonus,
        combinedPerfect ? "perfect" : "good",
        false
      );
    } else if (differenceBeats < 0) {
      activeHold.event.completed = true;
      if (hand === 'right') cancelAttackSequenceForEvent(activeHold.event, now);
      failInput(`${hand.toUpperCase()} RELEASED EARLY`, activeHold.event.phrase, {
        errorType: null,
        errorData: { hand, event: activeHold.event }
      });
    } else {
      activeHold.event.completed = true;
      const releaseBeat = currentBeatPosition(now);
      markRestMissedAtAbsoluteBeat(hand, releaseBeat);
      const substitution = substitutionContextAtAbsoluteBeat(releaseBeat);
      if (substitution) {
        markSubstitutionMiss(substitution, now, currentBeatPosition(now), {
          message: "REST MISSED",
          applyPenalty: false,
          penaltyAlreadyApplied: true
        });
      }
      failInput(`${hand.toUpperCase()} HELD TOO LONG`, activeHold.event.phrase, {
        errorType: null,
        errorData: { hand, event: activeHold.event }
      });
    }
  }

  function processMissedAttacks(now) {
    const beatPosition = currentBeatPosition(now);

    currentPhrase.noteEvents.forEach(event => {
      if (event.attackMatched || event.missed || event.completed) return;
      if (beatPosition <= event.start + ATTACK_WINDOW_BEATS) return;

      event.missed = true;
      failInput(`${event.hand.toUpperCase()} MISSED`, currentPhrase, {
        errorType: event.hand === 'left' && !isRapidLeftEvent(event) ? 'leftCollision' : null,
        errorData: { hand: event.hand, event }
      });
    });
  }

  function processOverheldNotes(now) {
    Object.entries(handState).forEach(([hand, state]) => {
      if (!state.activeHold || !state.down) return;
      if (now <= state.activeHold.targetEndTime + state.activeHold.lateReleaseAllowance * state.activeHold.holdBeatDurationMs) return;

      const phrase = state.activeHold.event.phrase;
      const overholdBeat = currentBeatPosition(now);
      markRestMissedAtAbsoluteBeat(hand, overholdBeat);
      const substitution = substitutionContextAtAbsoluteBeat(overholdBeat);
      if (substitution) {
        markSubstitutionMiss(substitution, now, currentBeatPosition(now), {
          message: "REST MISSED",
          applyPenalty: false,
          penaltyAlreadyApplied: true
        });
      }

      const failedEvent = state.activeHold.event;
      failedEvent.completed = true;
      state.activeHold = null;
      state.blockedUntilRelease = true;
      failInput(`${hand.toUpperCase()} HELD TOO LONG`, phrase, {
        errorType: null,
        errorData: { hand, event: failedEvent }
      });
    });
  }

  function finishPhrase(phrase) {
    phrase.noteEvents.forEach(event => {
      if (event.completed || event.missed) return;

      const isStillHeld = Object.values(handState).some(
        state => state.activeHold?.event === event
      );
      if (isStillHeld) return;

      event.missed = true;
      failInput(`${event.hand.toUpperCase()} MISSED`, phrase, {
        errorType: event.hand === 'left' ? 'leftCollision' : null,
        errorData: { hand: event.hand, event }
      });
    });
  }

  function retimeActivePreviewHold() {
    Object.values(handState).forEach(state => {
      if (!state.activeHold || state.activeHold.event.phrase !== currentPhrase) return;
      state.activeHold.targetEndTime = phraseStartTime +
        (state.activeHold.event.start + state.activeHold.event.duration) * beatDurationMs;
      state.activeHold.holdBeatDurationMs = beatDurationMs;
    });
  }

  function advancePhrase(now) {
    const oldPhraseDurationMs = PHRASE_BEATS * beatDurationMs;
    if (now < phraseStartTime + oldPhraseDurationMs) return;

    finishPhrase(currentPhrase);
    if (!running) return;

    phraseStartTime += oldPhraseDurationMs;
    completedSystems += 1;
    previousPhrase = currentPhrase;
    currentPhrase = nextPhrase;
    bpm = bpmForSystem(currentPhrase.systemNumber);
    beatDurationMs = 60000 / bpm;
    nextPhrase = buildPhrase(completedSystems + 1);
    retimeActivePreviewHold();
  }


  const DEFEAT_CINEMATIC_MS = 3200;

  function beginDefeatCinematic(reason = "Out of health.") {
    if (!running || defeatCinematic) return;
    const now = performance.now();
    resetHandStates();
    activeAttackSequences.length = 0;
    incorrectAttackSequences.length = 0;
    leftCollisionState = null;
    defeatCinematic = {
      start: now,
      reason,
      rushOnePlayed: false,
      rushTwoPlayed: false,
      rushThreePlayed: false,
      teleportPlayed: false
    };
    setFeedback("OVERWHELMED!", DEFEAT_CINEMATIC_MS, "error");
    if (typeof setMessage === "function") setMessage("ESCAPE!");
    soundCollision();
    soundDefeatIntro();
  }

  function updateDefeatCinematic(now = performance.now()) {
    if (!defeatCinematic) return;
    const elapsed = now - defeatCinematic.start;

    // The ninja anticipates the oncoming flood and is completely gone before
    // any enemies or weapons enter the scene.
    if (!defeatCinematic.teleportPlayed && elapsed >= 110) {
      defeatCinematic.teleportPlayed = true;
      soundTeleport();
    }
    if (!defeatCinematic.rushOnePlayed && elapsed >= 780) {
      defeatCinematic.rushOnePlayed = true;
      soundFightCloud();
      soundWeapon({ kind: "shuriken" }, 1, true);
      soundDefeatWave(1);
    }
    if (!defeatCinematic.rushTwoPlayed && elapsed >= 1280) {
      defeatCinematic.rushTwoPlayed = true;
      soundWeapon({ kind: "kunai" }, 1, true);
      soundWeapon({ kind: "senbon" }, 0.5, true);
      soundDefeatWave(2);
    }
    if (!defeatCinematic.rushThreePlayed && elapsed >= 1810) {
      defeatCinematic.rushThreePlayed = true;
      soundFightCloud();
      soundWeapon({ kind: "fireBlast" }, 2, true);
      soundDefeatWave(3);
    }

    if (elapsed >= DEFEAT_CINEMATIC_MS) {
      const reason = defeatCinematic.reason;
      defeatCinematic = null;
      endGame(reason);
    }
  }

  function drawDefeatWeapon(kind, x, y, angle, now, alpha = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    drawProjectileTrail(x, y, angle, kind, alpha);
    if (kind === "kunai") drawKunai(x, y, angle, 1);
    else if (kind === "shuriken") drawShuriken(x, y, 8, now * 0.038);
    else if (kind === "senbon") drawSenbon(x, y, angle);
    else if (kind === "paperBomb") drawPaperBomb(x, y, angle);
    else if (kind === "fireBlast") drawFireBlast(x, y, angle, 1);
    else if (kind === "airBlade") drawAirBlade(x, y, angle);
    ctx.restore();
  }

  function drawDefeatCinematic(now = performance.now()) {
    if (!defeatCinematic) return;
    const elapsed = now - defeatCinematic.start;
    const progress = Math.max(0, Math.min(1, elapsed / DEFEAT_CINEMATIC_MS));
    const phase = now * 0.012;
    const teleportStart = 70;
    const teleportEnd = 610;
    const waveStart = 720;
    const waveElapsed = elapsed - waveStart;

    const bracePose = {
      head: [3, -33, 4.6], neck: [1, -28], hip: [-4, -15],
      backArm: [[0, -24], [-8, -20], [-14, -15]],
      frontArm: [[2, -24], [11, -21], [18, -16]],
      backLeg: [[-4, -15], [-11, -8], [-15, 0]],
      frontLeg: [[-3, -15], [8, -8], [13, 0]],
      shadowWidth: 12
    };

    if (elapsed < teleportStart) {
      const warningShake = Math.sin(now * 0.11) * 1.2;
      drawMovementStickPose(WORLD_NINJA_X + warningShake, WORLD_GROUND_Y, bracePose, -0.05, phase, true);
    } else if (elapsed < teleportEnd) {
      const t = smoothStep01((elapsed - teleportStart) / Math.max(1, teleportEnd - teleportStart));
      const escapeX = mixNumber(WORLD_NINJA_X, -48, t);
      if (t < 0.18) {
        drawMovementStickPose(escapeX, WORLD_GROUND_Y, bracePose, -0.10 - t * 0.55, phase, true);
      }
      drawSolidTeleportPuff(escapeX, WORLD_GROUND_Y - 14, 0.70 + Math.sin(Math.PI * t) * 0.48);
      for (let puff = 0; puff < 5; puff += 1) {
        const trailT = Math.max(0, t - puff * 0.085);
        if (trailT <= 0) continue;
        const trailX = mixNumber(WORLD_NINJA_X, -35, trailT);
        ctx.save();
        ctx.globalAlpha = Math.max(0, 0.54 - puff * 0.085) * (1 - t * 0.48);
        drawSolidTeleportPuff(trailX + puff * 15, WORLD_GROUND_Y - 14, 0.46 - puff * 0.042);
        ctx.restore();
      }
    } else if (elapsed < waveStart) {
      const linger = 1 - (elapsed - teleportEnd) / Math.max(1, waveStart - teleportEnd);
      ctx.save();
      ctx.globalAlpha = Math.max(0, linger) * 0.38;
      drawSolidTeleportPuff(-18, WORLD_GROUND_Y - 14, 0.38 + linger * 0.12);
      ctx.restore();
    }

    if (waveElapsed >= 0) {
      ctx.save();
      const streakAlpha = Math.min(0.36, waveElapsed / 620 * 0.36) * (1 - Math.max(0, progress - 0.90) / 0.10);
      ctx.globalAlpha = Math.max(0, streakAlpha);
      ctx.strokeStyle = "#f5e6bd";
      ctx.lineWidth = 2;
      for (let index = 0; index < 20; index += 1) {
        const y = 30 + ((index * 47) % 216);
        const offset = (waveElapsed * (0.58 + (index % 4) * 0.09) + index * 83) % 820;
        const x = GAME_CANVAS_LOGICAL_WIDTH - offset;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + 45 + (index % 3) * 18, y);
        ctx.stroke();
      }
      ctx.restore();

      for (let index = 0; index < 30; index += 1) {
        const rank = Math.floor(index / 10);
        const slot = index % 10;
        const delay = 35 + slot * 52 + rank * 135;
        const travelMs = 1250 + rank * 105 + (slot % 3) * 65;
        const local = (waveElapsed - delay) / travelMs;
        if (local < 0 || local > 1.20) continue;
        const eased = local < 1 ? smoothStep01(local) : 1 + (local - 1) * 0.95;
        const x = GAME_CANVAS_LOGICAL_WIDTH + 60 + slot * 22 - eased * (GAME_CANVAS_LOGICAL_WIDTH + 320);
        const scale = 0.70 + rank * 0.10 + (slot % 2) * 0.035;
        drawRunningEnemy(x, WORLD_GROUND_Y + rank * 2, phase * 1.42 + index * 1.17, scale);
      }

      const weaponKinds = ["shuriken", "kunai", "senbon", "paperBomb", "airBlade", "fireBlast"];
      for (let index = 0; index < 48; index += 1) {
        const delay = 25 + (index % 16) * 40 + Math.floor(index / 16) * 155;
        const travelMs = 900 + (index % 5) * 78;
        const local = (waveElapsed - delay) / travelMs;
        if (local < 0 || local > 1.14) continue;
        const x = GAME_CANVAS_LOGICAL_WIDTH + 90 - local * (GAME_CANVAS_LOGICAL_WIDTH + 315);
        const baseY = 42 + ((index * 41) % 188);
        const y = baseY + Math.sin(local * Math.PI * 2 + index) * (5 + index % 4);
        const angle = Math.PI + Math.sin(index * 2.1) * 0.09;
        const fade = local > 1 ? Math.max(0, 1 - (local - 1) / 0.14) : 1;
        drawDefeatWeapon(weaponKinds[index % weaponKinds.length], x, y, angle, now, fade);
      }
    }

    if (progress > 0.86) {
      ctx.save();
      ctx.globalAlpha = smoothStep01((progress - 0.86) / 0.14) * 0.72;
      ctx.fillStyle = "#101316";
      ctx.fillRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, WORLD_VIEW_HEIGHT);
      ctx.restore();
    }
  }

  function drawDefeatCinematicLowerCurtain(now = performance.now()) {
    if (!defeatCinematic) return;
    const elapsed = now - defeatCinematic.start;
    const progress = Math.max(0, Math.min(1, elapsed / DEFEAT_CINEMATIC_MS));
    const waveElapsed = Math.max(0, elapsed - 720);
    const gradient = ctx.createLinearGradient(0, WORLD_VIEW_HEIGHT, 0, GAME_CANVAS_LOGICAL_HEIGHT);
    gradient.addColorStop(0, "#273238");
    gradient.addColorStop(1, "#101316");
    ctx.fillStyle = gradient;
    ctx.fillRect(0, WORLD_VIEW_HEIGHT, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT - WORLD_VIEW_HEIGHT);

    ctx.save();
    ctx.globalAlpha = Math.min(0.55, waveElapsed / 800 * 0.55);
    ctx.strokeStyle = "#d6c49a";
    ctx.lineWidth = 2;
    for (let index = 0; index < 9; index += 1) {
      const y = WORLD_VIEW_HEIGHT + 18 + index * 24;

      ctx.lineTo(GAME_CANVAS_LOGICAL_WIDTH - drift + 90, y);

      ctx.globalAlpha = smoothStep01((progress - 0.84) / 0.16) * 0.78;

  function drawHeartRecoveryEffect(now = performance.now()) {
    if (!heartRecoveryEffect || now >= heartRecoveryEffect.until) return;
    const progress = Math.max(0, Math.min(1, (now - heartRecoveryEffect.start) / HEART_RECOVERY_EFFECT_MS));
    const appear = smoothStep01(Math.min(1, progress / 0.18));
    const fade = 1 - smoothStep01(Math.max(0, (progress - 0.72) / 0.28));
    const pulse = 1 + Math.sin(progress * Math.PI * 5) * 0.055 * (1 - progress);
    const x = GAME_CANVAS_LOGICAL_WIDTH / 2;
    const y = 136 - progress * 12;

    ctx.save();
    ctx.globalAlpha = appear * fade * 0.46;
    ctx.strokeStyle = "#d8a62b";
    ctx.lineWidth = 8;
    ctx.strokeRect(5, 5, GAME_CANVAS_LOGICAL_WIDTH - 10, GAME_CANVAS_LOGICAL_HEIGHT - 10);
    ctx.restore();

    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = appear * fade;
    ctx.strokeStyle = "#f2cf64";
    ctx.lineWidth = 2.4;
    for (let ray = 0; ray < 12; ray += 1) {
      const angle = (Math.PI * 2 * ray) / 12 + progress * 0.45;
      const inner = 32 + Math.sin(progress * Math.PI) * 8;
      const outer = 50 + Math.sin(progress * Math.PI) * 14;
      ctx.beginPath();
      ctx.moveTo(Math.cos(angle) * inner, Math.sin(angle) * inner);
      ctx.lineTo(Math.cos(angle) * outer, Math.sin(angle) * outer);
      ctx.stroke();
    }

    ctx.scale(2.45 * appear * pulse, 2.45 * appear * pulse);
    ctx.shadowColor = "rgba(242,207,100,0.85)";
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(0, 9);
    ctx.bezierCurveTo(-2, 7, -9, 2, -9, -4);
    ctx.bezierCurveTo(-9, -9, -3, -11, 0, -6);
    ctx.bezierCurveTo(3, -11, 9, -9, 9, -4);
    ctx.bezierCurveTo(9, 2, 2, 7, 0, 9);
    ctx.closePath();
    ctx.fillStyle = "#cf4d52";
    ctx.fill();
    ctx.strokeStyle = "#fff0b2";
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = appear * fade;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#fff5cf";
    ctx.strokeStyle = "#4a3310";
    ctx.lineWidth = 4;
    ctx.font = "bold 22px Arial, sans-serif";

    ctx.fillStyle = "#f2cf64";
    ctx.fillText(`${heartRecoveryEffect.milestone} POINTS`, x, y + 70);

  function createAttackSequence(event, now, targetBeat) {
    const count = attackTargetCount(event);
    const intervalBeats = attackIntervalBeats(event);
    const intervalMs = intervalBeats * beatDurationMs;
    const firstImpactAt = phraseStartTime + targetBeat * beatDurationMs + ATTACK_PROJECTILE_FLIGHT_MS;
    const weapon = event.attackWeapon || attackWeaponForEvent(event);
    const lastImpactAt = firstImpactAt + Math.max(0, count - 1) * intervalMs;
    const sequence = {
      event,
      weapon,
      count,
      targetBeat,
      beatDurationMs,
      intervalBeats,
      intervalMs,
      spacingPx: intervalBeats * WORLD_PIXELS_PER_BEAT,
      pressTime: now,
      firstImpactAt,
      firstBreakAt: firstImpactAt,
      lastImpactAt,
      lastBreakAt: weapon.continuous
        ? lastImpactAt + Math.max(ATTACK_TARGET_BREAK_MS, intervalMs || ATTACK_TARGET_BREAK_MS)
        : lastImpactAt,
      lastLaunchAt: now + Math.max(0, count - 1) * intervalMs,
      fallbackOrigin: [WORLD_NINJA_X + 14, attackNinjaCenterY(event) - 7],
      launchOrigins: [],

  function createIncorrectAttackSequence(sourceEvent, now = performance.now()) {

    const weapon = attackWeaponForEvent(event);
    const count = attackTargetCount(event);
    const intervalBeats = attackIntervalBeats(event);
    const intervalMs = intervalBeats * beatDurationMs;
    const travelMs = Math.max(560, Math.min(820, beatDurationMs * 0.86));
    const sequence = {

  function cancelRepeatedAndContinuousAttacks(now = performance.now()) {
    const shouldStop = sequence => Boolean(sequence && (sequence.weapon?.continuous || sequence.count > 1));
    activeAttackSequences.forEach(sequence => {
      if (!shouldStop(sequence)) return;
      sequence.canceledAt = sequence.canceledAt == null ? now : Math.min(sequence.canceledAt, now);
      sequence.hardCanceledAt = now;
    });
    incorrectAttackSequences.forEach(sequence => {
      if (!shouldStop(sequence)) return;
      sequence.canceledAt = sequence.canceledAt == null ? now : Math.min(sequence.canceledAt, now);
      sequence.hardCanceledAt = now;

  function pruneAttackSequences(now = performance.now()) {

  function registerWorldPress(hand, event, now, targetBeat) {

      const sequence = createAttackSequence(event, now, targetBeat);

      ? rapidLeftContactLeadBeats(event)
      : WORLD_ACTION_LEAD_BEATS;
    const contactAt = Math.max(
      now + (rapidLeft ? 18 : 45),
      phraseStartTime + (targetBeat + contactLeadBeats) * beatDurationMs

    const afterContact = Math.min(0.44, Math.max(0.16, visualMovementBeats * 0.18));
    let until;

      until = phraseStartTime + (targetBeat + duration) * beatDurationMs - 2;

        now + visualMovementBeats * beatDurationMs,

      if (nextBeat != null) {

    const progressUntil = until;

    if (!isSuperMovement && !rapidLeft && exitExtensionMs > 0) {
      let extendedUntil = until + exitExtensionMs;
      const nextBeat = nextHandActionBeat(hand, targetBeat);
      if (nextBeat != null) {
        const nextStartMs = phraseStartTime + nextBeat * beatDurationMs;
        extendedUntil = Math.min(extendedUntil, nextStartMs - 34);
      }
      until = Math.max(until, extendedUntil);
    }

    soundMovement(event);
    if (isSuperMovement) soundSuperWarp();
    const rapidLabel = rapidLeft ? 'DEFLECT' : event.worldLabel;
    const deflectProfile = rapidLeft ? rapidDeflectProfile(event) : null;
    worldActionMemory.left = {
      kind: rapidLeft ? 'deflect' : event.worldKind,
      label: rapidLabel,
      start: now,
      contactAt,
      until: rapidLeft ? Math.max(contactAt + 54, until) : Math.max(now + 120, until),
      progressUntil,
      runPhase: now * 0.012,
      deflectProfile,
      event
    };

    const simultaneous = worldActionMemory.right.until >= now - 130;
    worldActionMemory.banner = {
      text: simultaneous
        ? `${rapidLabel} + ${worldActionMemory.right.label || "ATTACK"}`
        : rapidLabel,
      until: now + Math.max(430, beatDurationMs * 0.75)
    };
  }

  function substitutionWindowAtBeat(phrase, beat) {
    if (!phrase || !Array.isArray(phrase.substitutionWindows)) return null;
    return phrase.substitutionWindows.find(window => (
      beat >= window.start - 0.0001 && beat < window.start + window.duration - 0.0001
    )) || null;
  }

  function substitutionContextAtAbsoluteBeat(beatPosition) {
    const currentWindow = substitutionWindowAtBeat(currentPhrase, beatPosition);
    if (currentWindow) {
      return {
        phrase: currentPhrase,
        window: currentWindow,
        absoluteStart: currentWindow.start,
        absoluteEnd: currentWindow.start + currentWindow.duration
      };
    }

    const nextLocalBeat = beatPosition - PHRASE_BEATS;
    const nextWindow = substitutionWindowAtBeat(nextPhrase, nextLocalBeat);
    if (nextWindow) {
      return {
        phrase: nextPhrase,
        window: nextWindow,
        absoluteStart: PHRASE_BEATS + nextWindow.start,
        absoluteEnd: PHRASE_BEATS + nextWindow.start + nextWindow.duration
      };
    }

    return null;
  }

  function activeSubstitutionContext(now = performance.now()) {
    if (countIn) return null;
    return substitutionContextAtAbsoluteBeat(currentBeatPosition(now));
  }

  function markSubstitutionMiss(context, now, beatPosition, options = {}) {
    if (!context?.window) return false;

    const window = context.window;
    const message = options.message || "REST MISSED";
    const wasAlreadyMissed = window.missed === true;

    window.missed = true;
    markRestRangeMissed(context.phrase, window.start, window.start + window.duration);
    leftCollisionState = null;
    if (!wasAlreadyMissed) soundFightCloud();
    window.missedAt = window.missedAt || now;
    window.missedBeat = window.missedBeat ?? beatPosition;

    if (options.penaltyAlreadyApplied) {
      // A related note error already removed health. Mark the penalty as
      // accounted for so the rest animation changes without double-charging.
      window.penaltyApplied = true;
      if (!wasAlreadyMissed) setFeedback(message, 850, "error");
      return true;
    }

    if (options.applyPenalty !== false && !window.penaltyApplied) {
      window.penaltyApplied = true;
      failInput(message, context.phrase, { rest: true });
    } else if (!wasAlreadyMissed) {
      setFeedback(message, 850, "error");
    }

    return true;
  }

  function processActiveSubstitutionRest(now) {
    if (countIn) return;

    const context = activeSubstitutionContext(now);
    if (!context || context.window.missed) return;
    if (!context.window.audioStarted) {
      context.window.audioStarted = true;
      soundSubstitution();
    }

    const restStartTime = phraseStartTime + context.absoluteStart * beatDurationMs;
    if (now <= restStartTime + REST_RELEASE_GRACE_MS) return;

    for (const [hand, state] of Object.entries(handState)) {
      if (!state.down) continue;
      if (now <= (state.restBoundaryExemptUntil || 0)) continue;

      // A sustained note may legally release slightly after its written end.
      // Do not call that a rest mistake while its own late-release allowance
      // remains open. If it is held past that allowance, processOverheldNotes
      // marks this same rest missed and applies only the note penalty.
      if (state.activeHold) {
        const latestLegalRelease = state.activeHold.targetEndTime
          + state.activeHold.lateReleaseAllowance * state.activeHold.holdBeatDurationMs;
        if (now <= latestLegalRelease) continue;
      }

      if (hand === 'left') cancelRepeatedAndContinuousAttacks(now);
      markSubstitutionMiss(context, now, currentBeatPosition(now), {
        message: "REST MISSED",
        applyPenalty: true
      });

    }

    const candidates = [];
    const collect = (phrase, baseBeat) => {
      if (!phrase || !Array.isArray(phrase.noteEvents)) return;
      phrase.noteEvents.forEach(event => {
        if (event.hand !== hand) return;
        const absolute = baseBeat + event.start;
        if (absolute > afterBeat + 0.0001) candidates.push(absolute);
      });
    };
    collect(currentPhrase, 0);
    collect(nextPhrase, PHRASE_BEATS);
    return candidates.length ? Math.min(...candidates) : null;
  }

  function triggerLeftCollision(event, now = performance.now()) {
    if (!event || countIn) return;

    const metrics = groundObstacleMetrics(event);
    // Contact occurs when the obstacle's leading edge exactly reaches the
    // knockback pose's forward hand/body edge. The base position remains behind
    // that edge, so the ninja touches the obstacle without ever overlapping it.
    const contactClearancePx = 18;
    const reappearClearancePx = 20;
    const impactBeat = baseBeat + event.start + WORLD_ACTION_LEAD_BEATS
      - contactClearancePx / WORLD_PIXELS_PER_BEAT;

      + (metrics.width + contactClearancePx + reappearClearancePx) / WORLD_PIXELS_PER_BEAT;

      baseBeat,
      metrics,
      contactClearancePx,
      reappearClearancePx,
      start: now,
      impactAt,
      knockEnd: Math.max(impactAt + 40, knockEnd),
      vanishAt: Math.max(impactAt + 80, vanishAt),
      passAt,
      reappearAt: passAt + 20,

      const postSpan = Math.max(1, action.until - action.contactAt);

      // approved starting motion is mathematically unchanged.
      const blendProgress = progress < 0.5 ? progress : extendedProgress;

        kind: action.kind,
        event: action.event,

        post,
        progress,
        blendProgress,
