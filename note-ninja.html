    let expectedStart = 1;
    STAGE_SCHEDULE.forEach((stage, index) => {
      if (stage.step !== index + 1) {
        throw new Error(`Progression step ${index + 1} is missing or out of order.`);
      }
      if (stage.start !== expectedStart || stage.end < stage.start) {
        throw new Error(`Progression step ${stage.step} has a gap, overlap, or invalid range.`);
      }
      expectedStart = stage.end + 1;
    });

    if (expectedStart - 1 !== FINAL_CURRICULUM_STEP) {
      throw new Error(`Progression must end at Step ${FINAL_CURRICULUM_STEP}.`);
    }
  }

  validateStageSchedule();

  let health = RHYTHM_NINJA_MAX_HEALTH;
  let damageCooldownUntil = 0;
  let bpm = START_BPM;
  let beatDurationMs = 60000 / bpm;
  // One completed system always means one completed two-measure chunk.
  let completedSystems = 0;
  let previousPhrase = null;
  let currentPhrase = null;
  let nextPhrase = null;
  let phraseStartTime = 0;
  let countIn = true;
  let feedbackText = "";
  let feedbackUntil = 0;
  let feedbackTone = "neutral";
  let streak = 0;
  let scorePopup = null;
  let nextHeartRecoveryScore = HEART_RECOVERY_POINTS;
  let heartRecoveryEffect = null;
  let healFlashStart = 0;
  let healFlashUntil = 0;
  let healedHeartIndex = -1;
  let damageFlashStart = 0;
  let damageFlashUntil = 0;
  let damagedHeartIndex = -1;
  let pausedForMenu = false;
  let runSeed = 1;
  let defeatCinematic = null;
  let frozenEndFrameCanvas = null;

  const handState = {
    left: { down: false, activeHold: null, blockedUntilRelease: false, restBoundaryExemptUntil: 0 },
    right: { down: false, activeHold: null, blockedUntilRelease: false, restBoundaryExemptUntil: 0 }
  };

  setFirstTimeHelpVersion("rhythmNinjaHelp_v14_heartRecoveryEscapeFirst");

  function copyNotes(notes) {
    return notes.map(item => ({
      ...item,
      tieSegments: Array.isArray(item.tieSegments) ? [...item.tieSegments] : undefined
    }));
  }

  function seededIndex(seed, length) {
    if (length <= 1) return 0;
    let value = Math.imul((seed | 0) + 1, 0x45d9f3b);
    value ^= value >>> 16;
    value = Math.imul(value, 0x45d9f3b);
    value ^= value >>> 16;
    return Math.abs(value) % length;
  }

  function chooseNotes(patterns, seed) {
    return copyNotes(patterns[seededIndex(seed, patterns.length)]);
  }

  function splitRestDuration(duration) {
    const parts = [];
    let remaining = Math.round(duration * 4) / 4;
    [4, 2, 1, 0.5, 0.25].forEach(value => {
      while (remaining >= value - 0.0001) {
        parts.push(R(value));
        remaining = Math.round((remaining - value) * 4) / 4;
      }
    });
    return parts;
  }

  function timeline(notes) {
    const sorted = copyNotes(notes).sort((a, b) => a.start - b.start);
    const sequence = [];
    let cursor = 0;

    sorted.forEach(item => {
      if (item.start < cursor - 0.0001) {
        throw new Error("A generated hand pattern contains overlapping notes.");
      }
      if (item.start > cursor + 0.0001) {
        sequence.push(...splitRestDuration(item.start - cursor));
      }
      sequence.push(N(item.duration, {
        tieSegments: Array.isArray(item.tieSegments) ? [...item.tieSegments] : undefined,
        tieToNext: item.tieToNext === true,
        tieFromPrev: item.tieFromPrev === true
      }));
      cursor = item.start + item.duration;
    });

    if (cursor < BEATS_PER_MEASURE - 0.0001) {
      sequence.push(...splitRestDuration(BEATS_PER_MEASURE - cursor));
    }

    const total = sequence.reduce((sum, item) => sum + item.duration, 0);
    if (Math.abs(total - BEATS_PER_MEASURE) > 0.0001) {
      throw new Error(`Generated measure totals ${total} beats instead of ${BEATS_PER_MEASURE}.`);
    }

    return sequence;
  }

  const EMPTY_NOTES = [];
  const QUARTERS = [noteAt(0, 1), noteAt(1, 1), noteAt(2, 1), noteAt(3, 1)];
  const HALF_AND_QUARTER_PATTERNS = [
    [noteAt(0, 2), noteAt(2, 1), noteAt(3, 1)],
    [noteAt(0, 1), noteAt(1, 2), noteAt(3, 1)],
    [noteAt(0, 1), noteAt(1, 1), noteAt(2, 2)]
  ];
  const SIMPLE_DURATION_PATTERNS = [
    [noteAt(0, 4)],
    [noteAt(0, 2), noteAt(2, 2)],
    ...HALF_AND_QUARTER_PATTERNS,
    QUARTERS
  ];

  function quarterRestPattern(restBeat) {
    return QUARTERS.filter(item => item.start !== restBeat);
  }

  function quarterHalfRestPattern(seed) {
    const patterns = [
      [noteAt(0, 2), noteAt(3, 1)],
      [noteAt(1, 2), noteAt(3, 1)],
      [noteAt(0, 1), noteAt(2, 2)],
      [noteAt(0, 1), noteAt(1, 2)]
    ];
    return chooseNotes(patterns, seed);
  }

  function pairPattern(pairBeat, pairCount = 1) {
    const pairBeats = new Set([pairBeat]);
    if (pairCount > 1) pairBeats.add((pairBeat + 2) % 4);
    const notes = [];
    for (let beat = 0; beat < 4; beat += 1) {
      if (pairBeats.has(beat)) {
        notes.push(noteAt(beat, 0.5), noteAt(beat + 0.5, 0.5));
      } else {
        notes.push(noteAt(beat, 1));
      }
    }
    return notes;
  }

  function offbeatPattern(afterBeat) {
    const notes = [];
    for (let beat = 0; beat < 4; beat += 1) {
      if (beat === afterBeat) notes.push(noteAt(beat + 0.5, 0.5));
      else notes.push(noteAt(beat, 1));
    }
    return notes;
  }

  function tiedPattern(startBeat) {
    const notes = [];
    for (let beat = 0; beat < 4;) {
      if (beat === startBeat) {
        notes.push(noteAt(beat, 2, { tieSegments: [1, 1] }));
        beat += 2;
      } else {
        notes.push(noteAt(beat, 1));
        beat += 1;
      }
    }
    return notes;
  }

  function dottedQuarterEighthPattern(startBeat) {
    const notes = [];
    for (let beat = 0; beat < 4;) {
      if (beat === startBeat) {
        notes.push(noteAt(beat, 1.5), noteAt(beat + 1.5, 0.5));
        beat += 2;
      } else {
        notes.push(noteAt(beat, 1));
        beat += 1;
      }
    }
    return notes;
  }

  function eighthDottedQuarterPattern(startBeat) {
    const notes = [];
    for (let beat = 0; beat < 4;) {
      if (beat === startBeat) {
        notes.push(noteAt(beat, 0.5), noteAt(beat + 0.5, 1.5));
        beat += 2;
      } else {
        notes.push(noteAt(beat, 1));
        beat += 1;
      }
    }
    return notes;
  }

  function figurePattern(beat, kind, includeOtherQuarters = true) {
    const notes = includeOtherQuarters
      ? QUARTERS.filter(item => item.start !== beat)
      : [];

    if (kind === "four16") {
      notes.push(
        noteAt(beat, 0.25),
        noteAt(beat + 0.25, 0.25),
        noteAt(beat + 0.5, 0.25),
        noteAt(beat + 0.75, 0.25)
      );
    } else if (kind === "eighthTwo16") {
      notes.push(
        noteAt(beat, 0.5),
        noteAt(beat + 0.5, 0.25),
        noteAt(beat + 0.75, 0.25)
      );
    } else {
      notes.push(
        noteAt(beat, 0.25),
        noteAt(beat + 0.25, 0.25),
        noteAt(beat + 0.5, 0.5)
      );
    }

    return notes.sort((a, b) => a.start - b.start);
  }

  function simpleSyncPattern(seed, fixedStart = null) {
    const mode = seededIndex(seed, 4);
    const startBeat = fixedStart === null ? (seededIndex(seed + 11, 2) * 2) : fixedStart;
    if (mode === 0) return offbeatPattern(startBeat);
    if (mode === 1) return dottedQuarterEighthPattern(startBeat);
    if (mode === 2) return eighthDottedQuarterPattern(startBeat);
    return tiedPattern(Math.min(2, startBeat));
  }

  function activeHandForMeasure(systemNumber, measure, offset = 0) {
    return ((systemNumber + measure + offset) % 2 === 0) ? "right" : "left";
  }

  function assignOneHand(hand, notes) {
    return hand === "right"
      ? { left: EMPTY_NOTES, right: notes }
      : { left: notes, right: EMPTY_NOTES };
  }

  function assignBothSame(notes) {
    return { left: copyNotes(notes), right: copyNotes(notes) };
  }

  function alternatingQuarterHands(startHand = "right") {
    const right = [];
    const left = [];
    for (let beat = 0; beat < 4; beat += 1) {
      const hand = (beat % 2 === 0) ? startHand : (startHand === "right" ? "left" : "right");
      (hand === "right" ? right : left).push(noteAt(beat, 1));
    }
    return { left, right };
  }

  function anchoredAlternatingQuarterHands(startHand = "right", anchorBeat = 0) {
    const right = [];
    const left = [];
    for (let beat = 0; beat < 4; beat += 1) {
      if (beat === anchorBeat) {
        right.push(noteAt(beat, 1));
        left.push(noteAt(beat, 1));
        continue;
      }
      const hand = (beat % 2 === 0)
        ? startHand
        : (startHand === "right" ? "left" : "right");
      (hand === "right" ? right : left).push(noteAt(beat, 1));
    }
    return { left, right };
  }

  function alternatingBeatHandsWithFigure(startHand, figureBeat, figureKind = "pair") {
    const right = [];
    const left = [];
    for (let beat = 0; beat < 4; beat += 1) {
      const hand = (beat % 2 === 0) ? startHand : (startHand === "right" ? "left" : "right");
      const target = hand === "right" ? right : left;
      if (beat === figureBeat) {
        const figure = figureKind === "pair"
          ? [noteAt(beat, 0.5), noteAt(beat + 0.5, 0.5)]
          : figurePattern(beat, figureKind, false);
        target.push(...figure);
      } else {
        target.push(noteAt(beat, 1));
      }
    }
    return { left, right };
  }

  function curriculumStepForSystem(systemNumber) {
    const insertedSuperMoves = Math.floor(Math.max(0, systemNumber) / SUPER_MOVE_INTERVAL);
    return Math.max(1, systemNumber - insertedSuperMoves);
  }

  function stageForSystem(systemNumber) {
    const curriculumStep = curriculumStepForSystem(systemNumber);
    return STAGE_SCHEDULE.find(stage => curriculumStep >= stage.start && curriculumStep <= stage.end)
      || STAGE_SCHEDULE[STAGE_SCHEDULE.length - 1];
  }


  function bpmForSystem(systemNumber) {
    const levelNumber = levelForSystem(systemNumber);
    if (levelNumber <= PEDAGOGY_LEVEL_COUNT) return START_BPM;
    return Math.min(
      MAX_BPM,
      START_BPM + (levelNumber - PEDAGOGY_LEVEL_COUNT) * POST_PEDAGOGY_BPM_PER_LEVEL
    );
  }


  function isSuperMoveSystem(systemNumber) {
    return systemNumber > 0 && systemNumber % SUPER_MOVE_INTERVAL === 0;
  }

  function trackItem(kind, start, duration, measure, options = {}) {
    return {
      kind,
      duration,
      start,
      measure,
      tieSegments: Array.isArray(options.tieSegments) ? [...options.tieSegments] : undefined,
      tieToNext: options.tieToNext === true,
      tieFromPrev: options.tieFromPrev === true,
      attackMatched: false,
      completed: false,
      missed: false
    };
  }

  function noteCoversBeat(track, beat) {
    return track.some(item => (
      item.kind === "note" && beat >= item.start - 0.0001 && beat < item.start + item.duration - 0.0001
    ));
  }

  function computeSubstitutionWindows(phrase) {
    const boundaries = new Set([0, PHRASE_BEATS]);
    [phrase.tracks.left, phrase.tracks.right].forEach(track => {
      track.forEach(item => {
        boundaries.add(item.start);
        boundaries.add(item.start + item.duration);
      });
    });

    const sorted = Array.from(boundaries).sort((a, b) => a - b);
    const silentSpans = [];

    for (let index = 0; index < sorted.length - 1; index += 1) {
      const start = sorted[index];
      const end = sorted[index + 1];
      const sampleBeat = (start + end) / 2;
      const bothSilent = (
        !noteCoversBeat(phrase.tracks.left, sampleBeat) &&
        !noteCoversBeat(phrase.tracks.right, sampleBeat)
      );
      if (!bothSilent) continue;

      const previous = silentSpans[silentSpans.length - 1];
      if (previous && Math.abs(previous.end - start) < 0.0001) {
        previous.end = end;
      } else {
        silentSpans.push({ start, end });
      }
    }

    return silentSpans
      .filter(span => span.end - span.start >= SUBSTITUTION_MIN_SILENT_BEATS - 0.0001)
      .map(span => ({
        start: span.start,
        duration: span.end - span.start,
        missed: false,
        missedAt: null,
        missedBeat: null,
        penaltyApplied: false
      }));
  }

  function movementKindForEvent(event) {
    if (event.duration >= PHRASE_BEATS) return "super";
    return MOVEMENT_ACTIONS[seededIndex(event.phrase.systemNumber * 29 + Math.round(event.start * 8), MOVEMENT_ACTIONS.length)];
  }

  function attackKindForEvent(event) {
    const weapon = attackMatrixEntry(event);
    return weapon.kind;
  }

  function annotatePhraseWorldMeta(phrase) {
    const leftEvents = phrase.noteEvents.filter(event => event.hand === "left");
    const familyRng = seededRng(mixedSeed(phrase.seed || runSeed, phrase.systemNumber, 0x4f425354));
    const familyBag = shuffledCopy(['ground', 'lowAir', 'highAir'], familyRng);
    let leftEventIndex = 0;

    phrase.noteEvents.forEach(event => {
      event.phrase = phrase;
      event.rhythmKey = event.rhythmKey || rhythmKeyForEvent(event);
      if (event.hand === "left") {
        event.moveFamily = event.moveFamily || familyBag[leftEventIndex % familyBag.length];
        leftEventIndex += 1;
        event.worldKind = movementBaseKindForFamily(event.moveFamily);
        event.worldLabel = movementLabelForEvent(event, event.moveFamily);
      }
    });

    phrase.noteEvents.forEach(event => {
      if (event.hand !== 'right') return;
      event.attackMode = 'ranged';
      event.attackFamily = 'ranged';
      event.attackWeapon = attackWeaponForEvent(event);
      event.worldKind = event.attackWeapon.kind;
      event.attackVariant = 0;
      event.worldLabel = event.attackWeapon.label;
      event.worldAttackSequence = null;
    });

    phrase.substitutionWindows = computeSubstitutionWindows(phrase);
    return phrase;
  }


  function buildSuperMovePhrase(systemNumber) {
    const levelNumber = levelForSystem(systemNumber);
    const profile = pedagogyProfileForLevel(levelNumber);
    const stage = {
      step: levelNumber,
      start: SUPER_MOVE_INTERVAL,
      end: SUPER_MOVE_INTERVAL,
      title: profile.title,
      rule: "Super move: hold both hands through the full two-measure phrase."
    };
    const tracks = {
      left: [
        trackItem("note", 0, 4, 0, { tieToNext: true }),
        trackItem("note", 4, 4, 1, { tieFromPrev: true })
      ],
      right: [
        trackItem("note", 0, 4, 0, { tieToNext: true }),
        trackItem("note", 4, 4, 1, { tieFromPrev: true })
      ]
    };
    const noteEvents = [
      { ...trackItem("note", 0, 8, 0), hand: "left" },
      { ...trackItem("note", 0, 8, 0), hand: "right" }
    ];
    const phrase = {
      systemNumber,
      level: levelNumber,
      levelSystem: SUPER_MOVE_INTERVAL,
      runSeed,
      runCode: (runSeed >>> 0).toString(16).toUpperCase().padStart(8, "0").slice(-4),
      seed: mixedSeed(runSeed, systemNumber, levelNumber, 0x53555052),
      challengeId: `L${levelNumber}_SUPER`,
      challengeLabel: "SUPER MOVE",
      stage,
      isSuperMove: true,
      tracks,
      noteEvents,
      stats: {
        expected: noteEvents.length,
        correct: 0,
        errors: 0
      }
    };
    return annotatePhraseWorldMeta(phrase);
  }


  function generateConsolidationMeasure(systemNumber, measure, seed) {
    const mode = seededIndex(seed, 4);
    if (mode === 0) {
      const steadyHand = activeHandForMeasure(systemNumber, measure);
      const holdHand = steadyHand === "right" ? "left" : "right";
      const result = { left: [], right: [] };
      result[steadyHand] = [noteAt(0, 1), noteAt(1, 1), noteAt(2, 1), noteAt(3, 1)];
      result[holdHand] = [noteAt(0, 2), noteAt(2, 2)];
      return result;
    }
    if (mode === 1) return alternatingQuarterHands(measure % 2 === 0 ? "right" : "left");
    if (mode === 2) {
      const syncHand = activeHandForMeasure(systemNumber, measure, 1);
      const simpleHand = syncHand === "right" ? "left" : "right";
      const result = { left: [], right: [] };
      result[syncHand] = simpleSyncPattern(seed, 0);
      result[simpleHand] = [noteAt(0, 2), noteAt(2, 2)];
      return result;
    }
    return {
      right: [noteAt(0, 1), noteAt(2, 0.5), noteAt(2.5, 0.5)],
      left: [noteAt(1, 1), noteAt(3, 1)]
    };
  }

  function generateMeasureForStep(step, systemNumber, measure) {
    const seed = systemNumber * 97 + measure * 31 + step * 13;
    const evenMeasure = measure % 2 === 0;
    const measureHand = evenMeasure ? "left" : "right";

    switch (step) {
      case 1:
        return assignOneHand("left", QUARTERS);
      case 2:
        return assignOneHand("right", QUARTERS);
      case 3:
        return assignOneHand(measureHand, QUARTERS);
      case 4:
        return alternatingQuarterHands(evenMeasure ? "left" : "right");
      case 5:
        return assignBothSame(QUARTERS);
      case 6:
        return assignOneHand("left", chooseNotes(HALF_AND_QUARTER_PATTERNS, seed));
      case 7:
        return assignOneHand("right", chooseNotes(HALF_AND_QUARTER_PATTERNS, seed));
      case 8:
        return assignOneHand(measureHand, chooseNotes(SIMPLE_DURATION_PATTERNS, seed));
      case 9:
        return anchoredAlternatingQuarterHands(
          evenMeasure ? "left" : "right",
          evenMeasure ? 0 : 2
        );
      case 10:
        return assignBothSame(chooseNotes(SIMPLE_DURATION_PATTERNS, seed));
      case 11:
        return assignOneHand("left", quarterRestPattern(seededIndex(seed, 4)));
      case 12:
        return assignOneHand("right", quarterRestPattern(seededIndex(seed, 4)));
      case 13:
        return assignOneHand(measureHand, quarterHalfRestPattern(seed));
      case 14: {
        const restBeat = seededIndex(seed, 4);
        const right = [];
        const left = [];
        const startHand = evenMeasure ? "left" : "right";
        for (let beat = 0; beat < 4; beat += 1) {
          if (beat === restBeat) continue;
          const hand = beat % 2 === 0
            ? startHand
            : (startHand === "left" ? "right" : "left");
          (hand === "left" ? left : right).push(noteAt(beat, 1));
        }
        return { left, right };
      }
      case 15:
        return assignBothSame(quarterHalfRestPattern(seed));
      case 16:
        return assignOneHand("left", pairPattern(seededIndex(seed, 2) * 2, 1));
      case 17:
        return assignOneHand("right", pairPattern(seededIndex(seed, 2) * 2, 1));
      case 18:
        return assignOneHand(measureHand, pairPattern(seededIndex(seed, 4), 1));
      case 19:
        return alternatingBeatHandsWithFigure(
          evenMeasure ? "left" : "right",
          seededIndex(seed, 4),
          "pair"
        );
      case 20:
        return assignBothSame(pairPattern(seededIndex(seed, 4), 1));
      case 21:
        return assignOneHand("left", pairPattern(seededIndex(seed, 4), evenMeasure ? 1 : 2));
      case 22:
        return assignOneHand("right", pairPattern(seededIndex(seed, 4), evenMeasure ? 1 : 2));
      case 23:
        return assignOneHand(measureHand, pairPattern(seededIndex(seed, 4), evenMeasure ? 1 : 2));
      case 24:
        return alternatingBeatHandsWithFigure(
          evenMeasure ? "left" : "right",
          seededIndex(seed, 4),
          "pair"
        );
      case 25:
        return assignBothSame(pairPattern(seededIndex(seed, 4), evenMeasure ? 1 : 2));
      case 26:
        return assignOneHand("left", simpleSyncPattern(seed));
      case 27:
        return assignOneHand("right", simpleSyncPattern(seed));
      case 28:
        return assignOneHand(measureHand, simpleSyncPattern(seed));
      case 29: {
        const syncHand = measureHand;
        const otherHand = syncHand === "left" ? "right" : "left";
        const result = { left: [], right: [] };
        result[syncHand] = seededIndex(seed, 2) === 0
          ? dottedQuarterEighthPattern(0).filter(item => item.start < 2)
          : eighthDottedQuarterPattern(0).filter(item => item.start < 2);
        result[otherHand] = [noteAt(2, 1), noteAt(3, 1)];
        return result;
      }
      case 30:
        return assignBothSame(simpleSyncPattern(seed));
      case 31: {
        return {
          left: copyNotes(QUARTERS),
          right: evenMeasure ? [noteAt(0, 4)] : [noteAt(0, 2), noteAt(2, 2)]
        };
      }
      case 32: {
        return {
          left: evenMeasure ? [noteAt(0, 4)] : [noteAt(0, 2), noteAt(2, 2)],
          right: copyNotes(QUARTERS)
        };
      }
      case 33: {
        const steadyHand = measureHand;
        const holdHand = steadyHand === "left" ? "right" : "left";
        const result = { left: [], right: [] };
        result[steadyHand] = copyNotes(QUARTERS);
        result[holdHand] = seededIndex(seed, 2) === 0
          ? [noteAt(0, 4)]
          : [noteAt(0, 2), noteAt(2, 2)];
        return result;
      }
      case 34:
        return alternatingQuarterHands(evenMeasure ? "left" : "right");
      case 35: {
        const anchorBeat = evenMeasure ? 0 : 3;
        const right = [noteAt(anchorBeat, 1)];
        const left = [noteAt(anchorBeat, 1)];
        for (let beat = 0; beat < 4; beat += 1) {
          if (beat === anchorBeat) continue;
          ((beat + measure) % 2 === 0 ? left : right).push(noteAt(beat, 1));
        }
        return { left, right };
      }
      case 36: {
        return {
          left: simpleSyncPattern(seed),
          right: chooseNotes([
            [noteAt(0, 2), noteAt(2, 2)],
            [noteAt(0, 1), noteAt(1, 1), noteAt(2, 1), noteAt(3, 1)]
          ], seed + 1)
        };
      }
      case 37: {
        return {
          left: chooseNotes([
            [noteAt(0, 2), noteAt(2, 2)],
            [noteAt(0, 1), noteAt(1, 1), noteAt(2, 1), noteAt(3, 1)]
          ], seed + 1),
          right: simpleSyncPattern(seed)
        };
      }
      case 38: {
        const syncHand = measureHand;
        const simpleHand = syncHand === "left" ? "right" : "left";
        const result = { left: [], right: [] };
        result[syncHand] = simpleSyncPattern(seed);
        result[simpleHand] = chooseNotes([
          [noteAt(0, 2), noteAt(2, 2)],
          [noteAt(0, 1), noteAt(1, 1), noteAt(2, 1), noteAt(3, 1)]
        ], seed + 2);
        return result;
      }
      case 39:
        return evenMeasure
          ? {
              left: [noteAt(0, 1), noteAt(2, 0.5), noteAt(2.5, 0.5)],
              right: [noteAt(1, 0.5), noteAt(1.5, 0.5), noteAt(3, 1)]
            }
          : {
              left: [noteAt(1, 1), noteAt(3, 0.5), noteAt(3.5, 0.5)],
              right: [noteAt(0, 0.5), noteAt(0.5, 0.5), noteAt(2, 1)]
            };
      case 40:
        return generateConsolidationMeasure(systemNumber, measure, seed);
      case 41:
        return assignOneHand("left", figurePattern(seededIndex(seed, 2) * 2, "four16", true));
      case 42:
        return assignOneHand("right", figurePattern(seededIndex(seed, 2) * 2, "four16", true));
      case 43:
        return assignOneHand(measureHand, figurePattern(seededIndex(seed, 4), "four16", true));
      case 44:
        return alternatingBeatHandsWithFigure(
          evenMeasure ? "left" : "right",
          seededIndex(seed, 4),
          "four16"
        );
      case 45:
        return assignBothSame(figurePattern(seededIndex(seed, 4), "four16", true));
      case 46: {
        const kinds = ["four16", "eighthTwo16", "two16Eighth"];
        return assignOneHand("left", figurePattern(
          seededIndex(seed + 1, 4),
          kinds[seededIndex(seed, kinds.length)],
          true
        ));
      }
      case 47: {
        const kinds = ["four16", "eighthTwo16", "two16Eighth"];
        return assignOneHand("right", figurePattern(
          seededIndex(seed + 1, 4),
          kinds[seededIndex(seed, kinds.length)],
          true
        ));
      }
      case 48: {
        const kinds = ["four16", "eighthTwo16", "two16Eighth"];
        return assignOneHand(measureHand, figurePattern(
          seededIndex(seed + 1, 4),
          kinds[seededIndex(seed, kinds.length)],
          true
        ));
      }
      case 49: {
        const complexHand = measureHand;
        const simpleHand = complexHand === "left" ? "right" : "left";
        const kinds = ["four16", "eighthTwo16", "two16Eighth"];
        const complexBeat = seededIndex(seed + 1, 2) * 2;
        const otherBeat = complexBeat === 0 ? 2 : 0;
        const result = { left: [], right: [] };
        result[complexHand] = figurePattern(
          complexBeat,
          kinds[seededIndex(seed + 2, kinds.length)],
          false
        );
        result[simpleHand] = [noteAt(complexBeat, 1), noteAt(otherBeat, 2)]
          .sort((a, b) => a.start - b.start);
        return result;
      }
      case 50: {
        const stageOffset = Math.max(0, systemNumber - FINAL_SCHEDULED_SYSTEM);
        if (stageOffset > 0 && stageOffset % 4 === 3) {
          return generateConsolidationMeasure(systemNumber, measure, seed);
        }

        const complexHand = measureHand;
        const secondaryHand = complexHand === "left" ? "right" : "left";
        const result = { left: [], right: [] };
        const primaryBeat = seededIndex(seed, 2) * 2;
        const secondaryBeat = primaryBeat === 0 ? 2 : 0;
        const primaryKinds = ["four16", "eighthTwo16", "two16Eighth"];
        result[complexHand] = figurePattern(
          primaryBeat,
          primaryKinds[seededIndex(seed + 1, primaryKinds.length)],
          false
        );
        const secondaryModes = [
          dottedQuarterEighthPattern(secondaryBeat)
            .filter(item => item.start >= secondaryBeat && item.start < secondaryBeat + 2),
          eighthDottedQuarterPattern(secondaryBeat)
            .filter(item => item.start >= secondaryBeat && item.start < secondaryBeat + 2),
          [noteAt(secondaryBeat + 0.5, 0.5)],
          [noteAt(secondaryBeat, 2, { tieSegments: [1, 1] })]
        ];
        result[secondaryHand] = chooseNotes(secondaryModes, seed + 2);
        return result;
      }
      default:
        throw new Error(`Unsupported Rhythm Ninja progression step: ${step}`);
    }
  }

  function addMeasure(track, measureIndex, sequence) {
    const total = sequence.reduce((sum, item) => sum + item.duration, 0);
    if (Math.abs(total - BEATS_PER_MEASURE) > 0.0001) {
      throw new Error(`Step generator produced a ${total}-beat measure.`);
    }

    let offset = 0;
    sequence.forEach(item => {
      track.push({
        kind: item.kind,
        duration: item.duration,
        tieSegments: Array.isArray(item.tieSegments) ? [...item.tieSegments] : undefined,
        tieToNext: item.tieToNext === true,
        tieFromPrev: item.tieFromPrev === true,
        start: measureIndex * BEATS_PER_MEASURE + offset,
        measure: measureIndex,
        attackMatched: false,
        completed: false,
        missed: false
      });
      offset += item.duration;
    });
  }


  function pairedEighthPattern() {
    return [0,0.5,1,1.5,2,2.5,3,3.5].map(start => noteAt(start, 0.5));

  function straightSixteenthPattern() {
    return Array.from({ length: 16 }, (_, index) => noteAt(index * 0.25, 0.25));

  function alternatingRapidPattern(firstIsEighth = true) {
    const notes = [];
    for (let beat = 0; beat < 4; beat += 1) {
      const useEighths = (beat % 2 === 0) === firstIsEighth;
      if (useEighths) {
        notes.push(noteAt(beat, 0.5), noteAt(beat + 0.5, 0.5));
      } else {
        notes.push(
          noteAt(beat, 0.25), noteAt(beat + 0.25, 0.25),
          noteAt(beat + 0.5, 0.25), noteAt(beat + 0.75, 0.25)
        );
      }
    }
    return notes;
  }

  function eighthThenSixteenthsPattern() {
    const notes = [];
    for (let beat = 0; beat < 4; beat += 1) {
      notes.push(noteAt(beat, 0.5), noteAt(beat + 0.5, 0.25), noteAt(beat + 0.75, 0.25));
    }
    return notes;
  }

  function sixteenthsThenEighthPattern() {
    const notes = [];
    for (let beat = 0; beat < 4; beat += 1) {
      notes.push(noteAt(beat, 0.25), noteAt(beat + 0.25, 0.25), noteAt(beat + 0.5, 0.5));
    }
    return notes;

  function freshRunSeed() {
    try {
      if (window.crypto?.getRandomValues) {
        const values = new Uint32Array(1);
        window.crypto.getRandomValues(values);
        return values[0] || 1;
      }
    } catch (err) {}
    return ((Date.now() ^ Math.floor(performance.now() * 1000)) >>> 0) || 1;
  }

  function mixedSeed(...values) {
    let hash = 0x811c9dc5;
    values.forEach(value => {
      let integer = Number.isFinite(value) ? (value >>> 0) : 0;
      hash ^= integer;
      hash = Math.imul(hash, 0x01000193);
      hash ^= hash >>> 13;
    });
    return hash >>> 0;
  }

  function seededRng(seed) {
    let state = seed >>> 0;
    return () => {
      state = (state + 0x6d2b79f5) >>> 0;
      let value = state;
      value = Math.imul(value ^ (value >>> 15), value | 1);
      value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
      return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
    };
  }

  function randomInt(rng, length) {
    if (length <= 1) return 0;
    return Math.floor(rng() * length) % length;
  }

  function randomChoice(rng, values) {
    return values[randomInt(rng, values.length)];
  }

  function shuffledCopy(values, rng) {
    const copy = [...values];
    for (let index = copy.length - 1; index > 0; index -= 1) {
      const swapIndex = randomInt(rng, index + 1);
      [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
    }
    return copy;
  }

  function relationFamily(relation) {
    if (["singleLeft", "singleRight", "singleEcho", "wildSingle", "barSwitch"].includes(relation)) return "single";
    if (["matching", "sharedAnchor", "sharedLong"].includes(relation)) return "together";
    if (["alternate", "rolesSwitch", "densityContrast"].includes(relation)) return "trade";
    return "independent";
  }

  function levelChallengeOrder(levelNumber) {
    const profile = PEDAGOGY_LEVELS[Math.min(PEDAGOGY_LEVEL_COUNT, levelNumber) - 1];
    const rng = seededRng(mixedSeed(runSeed, levelNumber, 0x4c45564c));
    const order = shuffledCopy(profile.challenges, rng);

    // Prevent three consecutive systems from using the same broad hand relationship.
    for (let index = 2; index < order.length; index += 1) {
      const family = relationFamily(order[index].relation);
      if (family !== relationFamily(order[index - 1].relation) || family !== relationFamily(order[index - 2].relation)) continue;
      const swapIndex = order.findIndex((candidate, candidateIndex) => (
        candidateIndex > index && relationFamily(candidate.relation) !== family
      ));
      if (swapIndex > index) [order[index], order[swapIndex]] = [order[swapIndex], order[index]];
    }
    return order;
  }

    return Math.floor((Math.max(1, systemNumber) - 1) / SYSTEMS_PER_LEVEL) + 1;
