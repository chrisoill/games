    ctx.globalAlpha = 0.16;
    ctx.fillStyle = '#ffffff';
    for (let x = -120 + drift; x < GAME_CANVAS_LOGICAL_WIDTH + 160; x += 180) {
      ctx.beginPath();
      ctx.ellipse(x, 218, 108, 18, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawWorldVignette() {
    ctx.save();
    const vignette = ctx.createRadialGradient(
      GAME_CANVAS_LOGICAL_WIDTH * 0.5,
      WORLD_VIEW_HEIGHT * 0.42,
      90,
      GAME_CANVAS_LOGICAL_WIDTH * 0.5,
      WORLD_VIEW_HEIGHT * 0.42,
      430
    );
    vignette.addColorStop(0, 'rgba(10,20,28,0)');
    vignette.addColorStop(1, 'rgba(10,20,28,0.16)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, WORLD_VIEW_HEIGHT);
    ctx.restore();
  }

  function drawMountainLayer(offset, baseY, height, width, fill) {
    ctx.save();
    const start = -width - (offset % width);
    for (let x = start; x < GAME_CANVAS_LOGICAL_WIDTH + width; x += width) {
      ctx.beginPath();
      ctx.moveTo(x, baseY);
      ctx.lineTo(x + width * 0.16, baseY - height * 0.30);
      ctx.lineTo(x + width * 0.34, baseY - height * 0.78);
      ctx.lineTo(x + width * 0.47, baseY - height);
      ctx.lineTo(x + width * 0.64, baseY - height * 0.58);
      ctx.lineTo(x + width * 0.82, baseY - height * 0.22);
      ctx.lineTo(x + width, baseY);
      ctx.closePath();
      const mountain = ctx.createLinearGradient(0, baseY - height, 0, baseY);
      mountain.addColorStop(0, fill);
      mountain.addColorStop(1, shadeColor(fill, -10));
      ctx.fillStyle = mountain;
      ctx.fill();

      ctx.globalAlpha = 0.16;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(x + width * 0.38, baseY - height * 0.70);
      ctx.lineTo(x + width * 0.47, baseY - height);
      ctx.lineTo(x + width * 0.56, baseY - height * 0.71);
      ctx.lineTo(x + width * 0.50, baseY - height * 0.58);
      ctx.lineTo(x + width * 0.44, baseY - height * 0.63);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function shadeColor(hex, percent) {
    const clean = hex.replace('#', '');
    const num = parseInt(clean, 16);
    const amt = Math.round(2.55 * percent);
    const r = Math.max(0, Math.min(255, (num >> 16) + amt));
    const g = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
    const b = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
    return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
  }

  function drawCloudCluster(x, y, scale = 1, alpha = 0.8) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#ffffff';
    [[0,0,20],[18,-8,17],[36,0,22],[56,-4,16],[22,10,16]].forEach(([dx,dy,r]) => {
      ctx.beginPath();
      ctx.arc(x + dx * scale, y + dy * scale, r * scale, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  function drawPagoda(x, baseY, scale = 1, alpha = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, baseY);
    ctx.fillStyle = '#314558';
    ctx.strokeStyle = '#233240';
    ctx.lineWidth = 2;

    const levels = [
      { w: 94, h: 12, bodyW: 58, bodyH: 28, roofY: -18 },
      { w: 74, h: 10, bodyW: 42, bodyH: 24, roofY: -50 },
      { w: 54, h: 8, bodyW: 28, bodyH: 20, roofY: -78 }
    ];

    levels.forEach((lvl, i) => {
      const roofBase = lvl.roofY * scale;
      ctx.beginPath();
      ctx.moveTo(-lvl.w * 0.55 * scale, roofBase);
      ctx.quadraticCurveTo(0, roofBase - lvl.h * 0.9 * scale, lvl.w * 0.55 * scale, roofBase);
      ctx.lineTo(lvl.w * 0.45 * scale, roofBase + lvl.h * scale);
      ctx.lineTo(-lvl.w * 0.45 * scale, roofBase + lvl.h * scale);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillRect(-lvl.bodyW * 0.5 * scale, (roofBase + lvl.h * scale), lvl.bodyW * scale, lvl.bodyH * scale);
    });

    ctx.fillRect(-5 * scale, -84 * scale, 10 * scale, 70 * scale);
    ctx.fillStyle = '#c8aa63';
    ctx.beginPath();
    ctx.arc(0, -92 * scale, 7 * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawBambooCluster(x, baseY, alpha = 0.75) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ['#4f7960', '#5f886e', '#375443'].forEach((color, index) => {
      const stemX = x + index * 11;
      const height = 56 + index * 8;
      ctx.fillStyle = color;
      ctx.fillRect(stemX, baseY - height, 5, height);
      ctx.strokeStyle = '#88a38f';
      ctx.lineWidth = 1;
      for (let y = baseY - height + 8; y < baseY - 8; y += 12) {
        ctx.beginPath();
        ctx.moveTo(stemX, y);
        ctx.lineTo(stemX + 5, y);
        ctx.stroke();
      }
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(stemX + 3, baseY - height + 14);
      ctx.lineTo(stemX - 10, baseY - height + 2);
      ctx.moveTo(stemX + 3, baseY - height + 26);
      ctx.lineTo(stemX + 15, baseY - height + 14);
      ctx.stroke();
    });
    ctx.restore();
  }

  function drawTempleLayer(offset) {
    ctx.save();
    const spacing = 248;
    const start = -spacing - (offset % spacing);
    for (let x = start; x < GAME_CANVAS_LOGICAL_WIDTH + spacing; x += spacing) {
      drawPagoda(x + 112, 223, 0.92, 0.72);
      drawBambooCluster(x + 26, 238, 0.48);
      drawBambooCluster(x + 182, 238, 0.38);
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#c98e58';
      ctx.fillRect(x + 90, 145, 3, 28);
      ctx.fillRect(x + 132, 152, 3, 24);
      ctx.fillStyle = '#f6d39d';
      ctx.beginPath();
      ctx.arc(x + 91.5, 177, 6, 0, Math.PI * 2);
      ctx.arc(x + 133.5, 177, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function drawGround(scrollBeat) {
    const groundGradient = ctx.createLinearGradient(0, WORLD_GROUND_Y, 0, WORLD_VIEW_HEIGHT);
    groundGradient.addColorStop(0, '#3a4247');
    groundGradient.addColorStop(0.18, '#2b3034');
    groundGradient.addColorStop(1, '#171a1d');
    ctx.fillStyle = groundGradient;
    ctx.fillRect(0, WORLD_GROUND_Y, GAME_CANVAS_LOGICAL_WIDTH, WORLD_VIEW_HEIGHT - WORLD_GROUND_Y);

    ctx.fillStyle = '#0d1012';
    ctx.fillRect(0, WORLD_GROUND_Y, GAME_CANVAS_LOGICAL_WIDTH, 4);
    ctx.fillStyle = 'rgba(206,180,121,0.34)';
    ctx.fillRect(0, WORLD_GROUND_Y + 4, GAME_CANVAS_LOGICAL_WIDTH, 2);

    const slabWidth = 92;
    const offset = (scrollBeat * WORLD_PIXELS_PER_BEAT) % slabWidth;
    ctx.strokeStyle = 'rgba(115,126,132,0.42)';
    ctx.lineWidth = 1;
    for (let x = -slabWidth - offset; x < GAME_CANVAS_LOGICAL_WIDTH + slabWidth; x += slabWidth) {
      ctx.beginPath();
      ctx.moveTo(x, WORLD_GROUND_Y + 5);
      ctx.lineTo(x + 18, WORLD_VIEW_HEIGHT);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(10,12,14,0.34)';
      ctx.beginPath();
      ctx.moveTo(x + 22, WORLD_GROUND_Y + 15);
      ctx.lineTo(x + 54, WORLD_GROUND_Y + 12);
      ctx.lineTo(x + 67, WORLD_GROUND_Y + 19);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(115,126,132,0.42)';
    }

    ctx.strokeStyle = 'rgba(96,106,111,0.34)';
    for (let row = 1; row <= 2; row += 1) {
      const y = WORLD_GROUND_Y + row * 18;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(GAME_CANVAS_LOGICAL_WIDTH, y);
      ctx.stroke();
    }

    const grassOffset = (scrollBeat * WORLD_PIXELS_PER_BEAT * 0.72) % 124;
    ctx.strokeStyle = '#53614a';
    ctx.lineWidth = 1.5;
    for (let x = -124 - grassOffset; x < GAME_CANVAS_LOGICAL_WIDTH + 124; x += 124) {
      ctx.beginPath();
      ctx.moveTo(x + 18, WORLD_GROUND_Y + 1);
      ctx.lineTo(x + 14, WORLD_GROUND_Y - 7);
      ctx.moveTo(x + 18, WORLD_GROUND_Y + 1);
      ctx.lineTo(x + 22, WORLD_GROUND_Y - 6);
      ctx.stroke();
    }
  }

  function groupedObstacleEvents(phrase) {
    const groups = new Map();
    phrase.noteEvents.forEach(event => {
      const key = event.start.toFixed(3);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(event);
    });
    return Array.from(groups.values()).sort((a, b) => a[0].start - b[0].start);
  }

  function drawMovementLabel(x, y, textLabel, alpha, accent = '#243645') {
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = 'rgba(17,24,39,0.18)';
    drawRoundedRect(x - 35, y - 11, 70, 20, 8, 'rgba(17,24,39,0.18)', null);
    const grad = ctx.createLinearGradient(x - 30, y, x + 30, y);
    grad.addColorStop(0, '#fbf8ef');
    grad.addColorStop(1, '#ffffff');
    drawRoundedRect(x - 32, y - 14, 64, 20, 8, grad, accent);
    ctx.fillStyle = accent;
    ctx.font = 'bold 9px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(textLabel, x, y - 4);
    ctx.restore();
  }

  function eventVariantIndex(event, count) {
    const system = event?.phrase?.systemNumber || 1;
    const base = system * 97 + Math.round((event?.start || 0) * 16) + (event?.hand === 'right' ? 41 : 17);
    return seededIndex(base, count);
  }

  function pickEventValue(event, values) {
    return values[eventVariantIndex(event, values.length)];
  }

  function movementPlacement(event) {
    if (event?.moveFamily) return event.moveFamily;
    const kind = event?.worldKind || 'jump';
    if (kind === 'slide') return 'lowAir';
    if (kind === 'flip' || kind === 'glide') return 'highAir';
    return 'ground';
  }

  function rhythmLengthClass(event) {
    const duration = event?.duration || 1;
    if (duration <= 0.5) return 'short';
    if (duration <= 1.5) return 'medium';
    return 'long';
  }

  function effectiveObstacleHoldBeats(event) {
    const duration = event?.duration || 1;
    if (duration <= 0.25) return 0.08;
    if (duration <= 0.5) return 0.10;
    if (duration <= 0.75) return 0.14;
    if (duration <= 1) return 0.18;
    if (duration <= 1.5) return 0.92;
    if (duration <= 2) return 1.10;
    if (duration <= 3) return 2.00;
    if (duration <= 4) return 3.00;
    return Math.max(0.18, duration - 1.0);
  }

  function obstacleLengthPixels(event, extra = 0) {
    return Math.max(58, Math.round(effectiveObstacleHoldBeats(event) * WORLD_PIXELS_PER_BEAT * 0.92 + extra));
  }

  function obstacleClusterCount(event) {
    const d = event?.duration || 1;
    if (d >= 3.5) return 5;
    if (d >= 2) return 4;
    if (d >= 1) return 3;
    if (d >= 0.5) return 2;
    return 1;
  }

  function drawGroundSpikeStrip(x, width, baseY = WORLD_GROUND_Y) {
    ctx.save();
    ctx.fillStyle = '#303336';
    ctx.strokeStyle = '#111315';
    ctx.lineWidth = 2;
    const spikes = Math.max(3, Math.floor(width / 14));
    const spikeW = width / spikes;
    for (let i = 0; i < spikes; i += 1) {
      const sx = x + i * spikeW;
      ctx.beginPath();
      ctx.moveTo(sx, baseY);
      ctx.lineTo(sx + spikeW * 0.5, baseY - 10);
      ctx.lineTo(sx + spikeW, baseY);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
  }


  function drawObstacleSurfaceDetails(x, m, event) {
    const style = m.style || '';
    const wood = ['post', 'doublePost', 'crate', 'stepped', 'platform', 'twinPlatform', 'runway'].includes(style);
    ctx.save();
    ctx.globalAlpha = 0.9;

    ctx.strokeStyle = wood ? 'rgba(232,190,126,0.42)' : 'rgba(196,211,218,0.30)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x + 3, m.y + 3);
    ctx.lineTo(x + Math.max(4, m.width - 3), m.y + 3);
    ctx.stroke();

    ctx.fillStyle = wood ? '#c89a5d' : '#8b99a0';
    const rivetY = m.y + Math.min(11, Math.max(6, m.height * 0.24));
    [x + 8, x + m.width - 8].forEach(rx => {
      ctx.beginPath();
      ctx.arc(rx, rivetY, 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = wood ? '#6c4b2d' : '#47545a';
      ctx.beginPath();
      ctx.arc(rx + 0.4, rivetY + 0.4, 0.7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = wood ? '#c89a5d' : '#8b99a0';
    });

    if (wood) {
      ctx.strokeStyle = 'rgba(64,42,27,0.42)';
      ctx.lineWidth = 1.1;
      const grainCount = Math.max(2, Math.min(7, Math.floor(m.width / 58)));
      for (let i = 0; i < grainCount; i += 1) {
        const gy = m.y + 10 + (i * 13) % Math.max(14, m.height - 8);
        const gx = x + 12 + (i * 43) % Math.max(20, m.width - 28);
        ctx.beginPath();
        ctx.moveTo(gx - 7, gy);
        ctx.quadraticCurveTo(gx, gy - 3, gx + 9, gy);
        ctx.stroke();
      }
    } else {
      ctx.strokeStyle = 'rgba(20,28,32,0.30)';
      ctx.lineWidth = 1.15;
      const crackX = x + m.width * 0.68;
      const crackY = m.y + Math.min(m.height - 8, 15);
      ctx.beginPath();
      ctx.moveTo(crackX, crackY);
      ctx.lineTo(crackX - 5, crackY + 6);
      ctx.lineTo(crackX + 2, crackY + 11);
      ctx.lineTo(crackX - 3, crackY + 17);
      ctx.stroke();
    }

    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.fillRect(x + 2, m.y + Math.max(4, m.height - 5), Math.max(0, m.width - 4), 3);
    ctx.restore();
  }

  function groundObstacleMetrics(event) {
    const placement = movementPlacement(event);
    const obstacle = obstacleMatrixEntry(event, placement);
    const width = releaseAlignedObstacleWidth(event, obstacle.width);
    const height = obstacle.height;

    if (placement === 'ground') {
      return {
        width,
        height,
        y: WORLD_GROUND_Y - height,
        placement,
        style: obstacle.style,
        spikes: false
      };
    }

    const bottomClearance = obstacle.bottomClearance;
    const y = WORLD_GROUND_Y - bottomClearance - height;
    return {
      width,
      height,
      y,
      placement,
      style: obstacle.style,
      spikes: obstacle.spikes === true,
      bottomClearance,
      clearance: WORLD_GROUND_Y - y
    };
  }

  function drawObstaclePlacard() {}

  function drawGroundObstacle(x, event) {
    const m = groundObstacleMetrics(event);
    const width = m.width;
    const woodenStyle = ['post', 'doublePost', 'crate', 'stepped', 'platform', 'twinPlatform', 'runway'].includes(m.style);
    const fill = woodenStyle ? '#594739' : '#414b51';
    const edge = woodenStyle ? '#241a14' : '#111315';

    ctx.save();
    ctx.fillStyle = fill;
    ctx.strokeStyle = edge;
    ctx.lineWidth = 3;

    const drawSeams = (startX, y, totalWidth, totalHeight, count) => {
      ctx.save();
      ctx.strokeStyle = '#676d73';
      ctx.lineWidth = 2;
      for (let index = 1; index < count; index += 1) {
        const seamX = startX + totalWidth * index / count;
        ctx.beginPath();
        ctx.moveTo(seamX, y + 3);
        ctx.lineTo(seamX, y + totalHeight - 3);
        ctx.stroke();
      }
      ctx.restore();
    };

    if (m.placement === 'ground') {
      if (m.style === 'post') {
        ctx.fillRect(x, m.y, width, m.height);
        ctx.strokeRect(x, m.y, width, m.height);
      } else if (m.style === 'doublePost') {
        const gap = 8;
        const pieceWidth = (width - gap) / 2;
        ctx.fillRect(x, m.y + 6, pieceWidth, m.height - 6);
        ctx.fillRect(x + pieceWidth + gap, m.y, pieceWidth, m.height);
        ctx.strokeRect(x, m.y + 6, pieceWidth, m.height - 6);
        ctx.strokeRect(x + pieceWidth + gap, m.y, pieceWidth, m.height);
      } else if (m.style === 'crate') {
        ctx.fillRect(x, m.y, width, m.height);
        ctx.strokeRect(x, m.y, width, m.height);
        ctx.strokeStyle = '#676d73';
        ctx.beginPath();
        ctx.moveTo(x + 8, m.y + 7);
        ctx.lineTo(x + width - 8, WORLD_GROUND_Y - 7);
        ctx.moveTo(x + width - 8, m.y + 7);
        ctx.lineTo(x + 8, WORLD_GROUND_Y - 7);
        ctx.stroke();
      } else if (m.style === 'stepped') {
        const stepWidth = width / 3;
        [0.72, 1, 0.82].forEach((ratio, index) => {
          const h = m.height * ratio;
          const px = x + index * stepWidth;
          ctx.fillRect(px, WORLD_GROUND_Y - h, stepWidth, h);
          ctx.strokeRect(px, WORLD_GROUND_Y - h, stepWidth, h);
        });
      } else {
        ctx.fillRect(x, m.y, width, m.height);
        ctx.strokeRect(x, m.y, width, m.height);
        const seamCount = m.style === 'runway' || m.style === 'fortress' ? 10
          : m.style === 'twinPlatform' ? 4 : 6;
        drawSeams(x, m.y, width, m.height, seamCount);
        ctx.fillStyle = '#61686f';
        ctx.fillRect(x, m.y, width, 7);
        if (m.style === 'twinPlatform') {
          ctx.fillStyle = '#2e3236';
          ctx.fillRect(x + width / 2 - 5, m.y, 10, m.height);
        }
        if (m.style === 'fortress') {
          ctx.fillStyle = '#34383d';
          for (let bx = x + 22; bx < x + width - 12; bx += 54) {
            ctx.fillRect(bx, m.y - 9, 24, 9);
          }
        }
      }
      drawObstacleSurfaceDetails(x, m, event);
      drawObstacleSurfaceDetails(x, m, event);
      ctx.restore();
      return;
    }

    if (m.placement === 'lowAir') {
      ctx.fillRect(x, m.y, width, m.height);
      ctx.strokeRect(x, m.y, width, m.height);
      const seamCount = m.style === 'thinBeam' ? 1
        : m.style === 'doubleBeam' ? 2
          : m.style === 'bar' ? 3
            : m.style === 'segmentedBeam' ? 5
              : m.style === 'crawlTunnel' ? 6
                : m.style === 'tiedTunnel' ? 7
                  : 12;
      drawSeams(x, m.y, width, m.height, seamCount);
      ctx.fillRect(x, m.y, 10, 24);
      ctx.fillRect(x + width - 10, m.y, 10, 24);
      ctx.strokeRect(x, m.y, 10, 24);
      ctx.strokeRect(x + width - 10, m.y, 10, 24);
      if (m.style === 'tiedTunnel') {
        ctx.fillStyle = '#2e3236';
        ctx.fillRect(x + width / 2 - 4, m.y, 8, m.height + 10);
      }
      if (m.style === 'reinforcedTunnel') {
        ctx.fillStyle = '#626971';
        ctx.fillRect(x, m.y + m.height - 5, width, 5);
      }
      ctx.restore();
      return;
    }

    if (m.spikes) drawGroundSpikeStrip(x, width);
    ctx.fillRect(x, m.y, width, m.height);
    ctx.strokeRect(x, m.y, width, m.height);
    const seamCount = m.style === 'smallLedge' ? 1
      : m.style === 'doubleLedge' ? 2
        : m.style === 'anchorLedge' ? 3
          : m.style === 'swingBridge' ? 5
            : m.style === 'undersideTrack' ? 6
              : m.style === 'tiedTrack' ? 7
                : 12;
    drawSeams(x, m.y, width, m.height, seamCount);
    ctx.fillStyle = '#61686f';
    ctx.fillRect(x, m.y, width, 5);

    if (m.style === 'anchorLedge' || m.style === 'swingBridge') {
      const anchorX = x + Math.min(width * 0.42, 62);
      ctx.strokeStyle = '#111315';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(anchorX, m.y + m.height + 5, 5, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (m.style === 'undersideTrack' || m.style === 'tiedTrack' || m.style === 'ceilingRunway' || m.style === 'ceilingFortress') {
      ctx.fillStyle = '#262a2e';
      ctx.fillRect(x + 5, m.y + m.height - 4, width - 10, 4);
    }
    if (m.style === 'tiedTrack') {
      ctx.fillStyle = '#2e3236';
      ctx.fillRect(x + width / 2 - 4, m.y, 8, m.height + 8);
    }
    drawObstacleSurfaceDetails(x, m, event);
    ctx.restore();
  }

  function attackTargetMetrics(event) {
    const layout = attackTargetLayout(event);
    return {
      width: layout.totalWidth,
      height: ATTACK_TARGET_SIZE,
      y: ATTACK_TARGET_LANE_Y - ATTACK_TARGET_SIZE / 2,
      style: 'standardRangedTarget',
      family: 'ranged',
      mode: 'ranged',
      segmentCount: layout.count
    };
  }

  function drawTargetBase(x, width) {
    ctx.fillStyle = "#38454c";
    ctx.fillRect(x + 8, WORLD_GROUND_Y - 8, width - 16, 8);
    ctx.strokeStyle = "#17242c";
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 8, WORLD_GROUND_Y - 8, width - 16, 8);
  }

  

  function drawEnemyStickFigure(x, groundY, scale = 1, boss = false) {
    ctx.save();
    ctx.translate(x, groundY);
    ctx.scale(scale, scale);
    ctx.strokeStyle = boss ? "#7b141b" : "#151515";
    ctx.fillStyle = boss ? "#7b141b" : "#151515";
    ctx.lineWidth = boss ? 4.2 : 3.5;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.arc(0, -52, boss ? 8 : 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, -44);
    ctx.lineTo(0, -23);
    ctx.moveTo(0, -38);
    ctx.lineTo(-13, -29);
    ctx.moveTo(0, -38);
    ctx.lineTo(13, -29);
    ctx.moveTo(0, -23);
    ctx.lineTo(-11, -2);
    ctx.moveTo(0, -23);
    ctx.lineTo(11, -2);
    ctx.stroke();
    if (boss) {
      ctx.strokeStyle = "#151515";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-7, -53);
      ctx.lineTo(7, -53);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawStandardAttackTarget(x, y, contacted = false, contactPulse = 0) {
    const radius = ATTACK_TARGET_SIZE / 2;
    ctx.save();

    if (contacted) {
      const glow = ctx.createRadialGradient(x, y, radius * 0.35, x, y, radius + 13 + contactPulse * 5);
      glow.addColorStop(0, `rgba(255,245,188,${0.56 + contactPulse * 0.18})`);
      glow.addColorStop(1, 'rgba(255,221,116,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(x, y, radius + 14 + contactPulse * 4, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = '#273139';
    ctx.beginPath();
    ctx.arc(x, y, radius + 3, 0, Math.PI * 2);
    ctx.fill();

    const face = ctx.createRadialGradient(x - 4, y - 5, 2, x, y, radius);
    face.addColorStop(0, '#f2d28c');
    face.addColorStop(0.58, '#c9934c');
    face.addColorStop(1, '#8a552d');
    ctx.fillStyle = face;
    ctx.strokeStyle = '#14191d';
    ctx.lineWidth = 2.3;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle = contacted ? '#fff2a8' : '#7e2f32';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(x, y, radius * 0.60, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x, y, radius * 0.23, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = contacted ? '#fff8cf' : 'rgba(81,40,34,0.72)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(x - radius * 0.72, y);
    ctx.lineTo(x + radius * 0.72, y);
    ctx.moveTo(x, y - radius * 0.72);
    ctx.lineTo(x, y + radius * 0.72);
    ctx.stroke();

    ctx.fillStyle = '#b93d35';
    ctx.beginPath();
    ctx.moveTo(x - 7, y + radius + 1);
    ctx.lineTo(x - 1, y + radius + 12);
    ctx.lineTo(x + 2, y + radius + 2);
    ctx.closePath();
    ctx.fill();

    if (contacted) {
      const crack = 1 + contactPulse * 1.5;
      ctx.strokeStyle = '#44211d';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(x - 2, y - 9);
      ctx.lineTo(x + 3 * crack, y - 4);
      ctx.lineTo(x - 1, y + 2);
      ctx.lineTo(x + 5 * crack, y + 9);
      ctx.moveTo(x - 6, y - 1);
      ctx.lineTo(x - 1, y + 2);
      ctx.lineTo(x - 6 * crack, y + 8);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawAttackTargetBreak(x, y, progress) {
    const pieces = [
      [-0.36, -0.24, -22, -19, -0.9],
      [ 0.34, -0.20,  24, -16,  0.9],
      [-0.28,  0.28, -18,  17, -0.6],
      [ 0.26,  0.30,  18,  20,  0.6],
      [ 0.04, -0.08,   3, -27,  1.2]
    ];
    pieces.forEach(([ox, oy, vx, vy, spin], index) => {
      const px = x + ox * ATTACK_TARGET_SIZE + vx * progress;
      const py = y + oy * ATTACK_TARGET_SIZE + vy * progress + 22 * progress * progress;
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(spin * progress * Math.PI);
      ctx.fillStyle = index === 4 ? '#7e2f32' : '#c9934c';
      ctx.strokeStyle = '#17191c';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(-5, -4);
      ctx.lineTo(5, -3);
      ctx.lineTo(4, 5);
      ctx.lineTo(-4, 4);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    });

    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - progress);
    ctx.strokeStyle = '#ffe8a2';
    ctx.lineWidth = 2;
    for (let i = 0; i < 7; i += 1) {
      const angle = i * Math.PI * 2 / 7 + 0.25;
      const inner = 8 + progress * 6;
      const outer = 18 + progress * 25;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(angle) * inner, y + Math.sin(angle) * inner);
      ctx.lineTo(x + Math.cos(angle) * outer, y + Math.sin(angle) * outer);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(226,215,185,0.42)';
    for (let i = 0; i < 4; i += 1) {
      ctx.beginPath();
      ctx.arc(x - 7 + i * 5, y + 8 + progress * 18, 3 + i * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawHangingObstacle(x, event) {
    drawAttackTargetLineForEvent(event, performance.now());
  }

  function drawAttackTargetLineForEvent(event, now) {
    if (!event) return;
    const timing = attackTimingForEvent(event);
    const sequence = event.worldAttackSequence || null;
    const speedPxPerMs = WORLD_PIXELS_PER_BEAT / Math.max(1, timing.beatDurationMs || beatDurationMs);

    for (let index = 0; index < timing.count; index += 1) {
      const arrivalAt = attackArrivalTime(timing, index);
      const breakAt = attackBreakTime(timing, index);
      const canBreak = Boolean(sequence && attackSequenceAllowsTarget(sequence, index));
      const continuousHold = Boolean(sequence?.weapon?.continuous && canBreak && now >= arrivalAt && now < breakAt);

      if (canBreak && now >= breakAt) {
        const local = (now - breakAt) / ATTACK_TARGET_BREAK_MS;
        if (local >= 0 && local < 1) {
          drawAttackTargetBreak(ATTACK_TARGET_BREAK_X, attackTargetCenterY(event, index, 0), local);
        }
        continue;
      }

      const centerX = continuousHold
        ? ATTACK_TARGET_BREAK_X
        : ATTACK_TARGET_BREAK_X + (arrivalAt - now) * speedPxPerMs;

      if (centerX < -ATTACK_TARGET_SIZE || centerX > GAME_CANVAS_LOGICAL_WIDTH + ATTACK_TARGET_SIZE) continue;

      const centerY = attackTargetCenterY(event, index, 0);
      if (event?.duration >= PHRASE_BEATS) {
        if (continuousHold) {
          const holdPulse = 0.5 + 0.5 * Math.sin(now * 0.045 + index * 0.8);
          drawStandardAttackTarget(centerX, centerY, true, holdPulse);
        } else {
          drawStandardAttackTarget(centerX, centerY, false, 0);
        }
      } else if (continuousHold) {
        const holdPulse = 0.5 + 0.5 * Math.sin(now * 0.045 + index * 0.8);
        drawStandardAttackTarget(
          centerX,
          ATTACK_TARGET_LANE_Y,
          true,
          holdPulse
        );
      } else {
        drawStandardAttackTarget(centerX, ATTACK_TARGET_LANE_Y, false, 0);
      }
    }
  }

  function drawAllAttackTargets(now) {
    const phrases = [previousPhrase, currentPhrase, nextPhrase].filter(Boolean);
    phrases.forEach(phrase => {
      phrase.noteEvents
        .filter(event => event.hand === 'right')
        .forEach(event => drawAttackTargetLineForEvent(event, now));
    });
  }

  function substitutionEnemyCount(window) {
    return Math.max(1, Math.round(window.duration));
  }

  function drawRunningEnemy(x, groundY, phase, scale = 0.86) {
    const stride = Math.sin(phase);
    const armSwing = Math.sin(phase + Math.PI);
    ctx.save();
    ctx.translate(x, groundY);
    ctx.scale(scale, scale);
    ctx.strokeStyle = "#151515";
    ctx.fillStyle = "#151515";
    ctx.lineWidth = 3.5;
    ctx.lineCap = "round";

    ctx.beginPath();
    ctx.arc(0, -51, 7, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(0, -43);
    ctx.lineTo(-1, -23);
    ctx.moveTo(-1, -37);
    ctx.lineTo(-12 - armSwing * 6, -27 + armSwing * 2);
    ctx.moveTo(-1, -36);
    ctx.lineTo(12 + armSwing * 6, -28 - armSwing * 2);
    ctx.moveTo(-1, -23);
    ctx.lineTo(-12 - stride * 8, -5);
    ctx.moveTo(-1, -23);
    ctx.lineTo(12 + stride * 8, -5);
    ctx.stroke();

    ctx.strokeStyle = "#9b1f2d";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-7, -50);
    ctx.lineTo(7, -50);
    ctx.stroke();
    ctx.restore();
  }

  function drawSubstitutionLog(now, progress) {
    const x = WORLD_NINJA_X;
    const y = WORLD_GROUND_Y;
    const bob = Math.sin(now * 0.012) * 1.5;
    ctx.save();
    ctx.translate(x, y + bob);
    ctx.rotate(-0.08);

    ctx.fillStyle = "#8b5a32";
    ctx.strokeStyle = "#3f2817";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(-13, -51, 26, 51, 8);
    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle = "#56341e";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-8, -35);
    ctx.lineTo(7, -31);
    ctx.moveTo(-7, -20);
    ctx.lineTo(8, -17);
    ctx.stroke();

    const leafWobble = Math.sin(now * 0.018) * 0.16;
    ctx.save();
    ctx.translate(2, -56);
    ctx.rotate(-0.38 + leafWobble);
    ctx.fillStyle = "#4f8b3a";
    ctx.strokeStyle = "#244b1f";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 12, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-8, 0);
    ctx.lineTo(8, 0);
    ctx.stroke();
    ctx.restore();
    ctx.restore();

    if (progress < 0.22) {
      const puff = Math.max(0, Math.min(1, progress / 0.22));
      const radius = 10 + puff * 15;
      ctx.save();
      ctx.fillStyle = "#eef2f3";
      ctx.strokeStyle = "#9da6aa";
      ctx.lineWidth = 2;
      const clouds = [
        [-22, -28, 0.85], [-8, -42, 1.0], [10, -38, 0.9], [23, -24, 0.76], [0, -20, 1.12]
      ];
      clouds.forEach(([ox, oy, size]) => {
        ctx.beginPath();
        ctx.arc(x + ox, y + oy, radius * size, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      });
      ctx.restore();
    }
  }


  function drawFightCloud(now, progress, duration) {
    const x = WORLD_NINJA_X + Math.sin(now * 0.045) * 3;
    const y = WORLD_GROUND_Y - 31 + Math.cos(now * 0.052) * 2;
    const churn = now * 0.021;
    const cloudRadius = 18 + Math.min(8, duration * 2);

    ctx.save();
    ctx.fillStyle = "#f1f3f4";
    ctx.strokeStyle = "#555b60";
    ctx.lineWidth = 3;
    const blobs = [
      [-29, 2, 0.9], [-18, -18, 1.0], [1, -24, 1.12], [22, -17, 0.94],
      [31, 3, 0.82], [18, 19, 1.0], [-4, 23, 1.1], [-25, 17, 0.86], [2, 1, 1.2]
    ];
    blobs.forEach(([ox, oy, size], index) => {
      const wobbleX = Math.sin(churn * 2.2 + index) * 2;
      const wobbleY = Math.cos(churn * 1.8 + index * 0.7) * 2;
      ctx.beginPath();
      ctx.arc(x + ox + wobbleX, y + oy + wobbleY, cloudRadius * size, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    });

    ctx.strokeStyle = "#151515";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    const kick = Math.sin(churn * 5.2);
    const punch = Math.cos(churn * 4.6);
    ctx.beginPath();
    ctx.moveTo(x - 21, y + 8);
    ctx.lineTo(x - 45, y + 19 + kick * 8);
    ctx.moveTo(x + 18, y - 5);
    ctx.lineTo(x + 44, y - 14 + punch * 8);
    ctx.moveTo(x - 7, y + 18);
    ctx.lineTo(x - 18, y + 48 - kick * 5);
    ctx.moveTo(x + 11, y + 17);
    ctx.lineTo(x + 29, y + 46 + punch * 5);
    ctx.stroke();

    ctx.strokeStyle = "#d8dde1";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x + 22, y + 1);
    ctx.lineTo(x + 52, y - 28 + Math.sin(churn * 4) * 5);
    ctx.stroke();

    const starPulse = 0.75 + 0.25 * Math.sin(churn * 6.4);
    ctx.translate(x - 31, y - 30);
    ctx.scale(starPulse, starPulse);
    ctx.fillStyle = "#f0c74d";
    ctx.strokeStyle = "#6f5a18";
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 10; i += 1) {
      const angle = -Math.PI / 2 + i * Math.PI / 5;
      const radius = i % 2 === 0 ? 13 : 5;
      const px = Math.cos(angle) * radius;
      const py = Math.sin(angle) * radius;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawSubstitutionThreat(window, absoluteStart, beatPosition, now) {
    const elapsed = beatPosition - absoluteStart;
    const active = elapsed >= 0 && elapsed < window.duration;
    const enemyCount = substitutionEnemyCount(window);

    if (!(active && window.missed)) {
      for (let index = 0; index < enemyCount; index += 1) {
        const passBeat = absoluteStart + ((index + 0.5) / enemyCount) * window.duration;
        const enemyX = WORLD_NINJA_X + (passBeat - beatPosition) * WORLD_PIXELS_PER_BEAT;
        if (enemyX < -60 || enemyX > GAME_CANVAS_LOGICAL_WIDTH + 60) continue;
        drawRunningEnemy(enemyX, WORLD_GROUND_Y, now * 0.018 + index * 1.7, 0.84 + (index % 2) * 0.05);
      }
    }

    if (!active) return;
    const progress = Math.max(0, Math.min(1, elapsed / Math.max(0.001, window.duration)));
    if (window.missed) drawFightCloud(now, progress, window.duration);
    else drawSubstitutionLog(now, progress);
  }


  function drawIncomingLeftProjectile(event, absoluteStart, beatPosition, now) {
    const lead = rapidLeftContactLeadBeats(event);
    const contactBeat = absoluteStart + lead;
    const afterContact = beatPosition - contactBeat;
    const contactX = WORLD_NINJA_X + 18;
    const baseY = RAPID_LEFT_PROJECTILE_Y + (event.duration <= 0.2501 ? -2 : 1);
    const profile = rapidDeflectProfile(event);
    let x = contactX + (contactBeat - beatPosition) * WORLD_PIXELS_PER_BEAT;
    let y = baseY;
    let rotation = Math.PI;

    if (event.completed && afterContact >= 0) {
      const t = Math.max(0, Math.min(1.18, afterContact / Math.max(0.001, profile.flightBeats)));
      const curveT = Math.min(1, t);
      const oneMinus = 1 - curveT;
      const controlX = contactX + profile.distance;
      const controlY = baseY - profile.lift;
      const endX = contactX + profile.distance * 0.34;
      const endY = WORLD_VIEW_HEIGHT + 72;
      x = oneMinus * oneMinus * contactX + 2 * oneMinus * curveT * controlX + curveT * curveT * endX;
      y = oneMinus * oneMinus * baseY + 2 * oneMinus * curveT * controlY + curveT * curveT * endY;
      rotation = Math.PI + profile.spin * curveT * Math.PI;
    }

    if (event.missed && afterContact >= 0 && afterContact < 0.12) {
      const pulse = 1 - afterContact / 0.12;
      ctx.save();
      ctx.strokeStyle = '#d54b3f';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(contactX - 2, baseY, 7 + pulse * 9, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    if (x < -80 || x > GAME_CANVAS_LOGICAL_WIDTH + 130 || y < -90 || y > WORLD_VIEW_HEIGHT + 90) return;

    drawProjectileTrail(x, y, rotation, event.duration <= 0.2501 ? 'kunai' : 'shuriken', event.completed ? 1 : 0.52);

    if (event.duration <= 0.2501) {
      drawKunai(x, y, rotation, 0.92);
      return;
    }

    drawShuriken(x, y, 10, rotation - now * 0.012);
    if (!(event.completed && afterContact >= 0)) {
      ctx.save();
      ctx.strokeStyle = 'rgba(40,52,60,0.34)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + 12, y + 2);
      ctx.lineTo(x + 30, y + 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawCourseObstacleGroup(events, x, beatPosition, absoluteStart, now) {
    const leftEvent = events.find(event => event.hand === "left") || null;
    if (!leftEvent) return;
    if (isRapidLeftEvent(leftEvent)) {
      drawIncomingLeftProjectile(leftEvent, absoluteStart, beatPosition, now);
      return;
    }
    // The super move has no course obstacle; the floating ninja and attack
    // effects already provide the transition and focal action.
    if (leftEvent.duration < PHRASE_BEATS) drawGroundObstacle(x, leftEvent);
  }

  function worldFeatureX(baseBeat, featureStartBeat, beatPosition) {
    return WORLD_NINJA_X + (
      baseBeat + featureStartBeat - beatPosition + WORLD_ACTION_LEAD_BEATS
    ) * WORLD_PIXELS_PER_BEAT;
  }

  function buildWorldFeaturesForPhrase(phrase, baseBeat, beatPosition) {
    const features = [];

    groupedObstacleEvents(phrase).forEach(events => {
      const leftEvent = events.find(event => event.hand === "left") || null;
      if (!leftEvent) return;
      const startBeat = leftEvent.start;
      const absoluteStart = baseBeat + startBeat;
      const rapidLeft = isRapidLeftEvent(leftEvent);
      const width = rapidLeft ? 86 : Math.max(64, groundObstacleMetrics(leftEvent).width);
      const x = rapidLeft
        ? WORLD_NINJA_X + 18 + (absoluteStart + rapidLeftContactLeadBeats(leftEvent) - beatPosition) * WORLD_PIXELS_PER_BEAT
        : worldFeatureX(baseBeat, startBeat, beatPosition);
      features.push({ type: "events", events, x, width, absoluteStart, sortBeat: absoluteStart });
    });

    if (Array.isArray(phrase.substitutionWindows)) {
      phrase.substitutionWindows.forEach(window => {
        const absoluteStart = baseBeat + window.start;
        const width = Math.max(220, window.duration * WORLD_PIXELS_PER_BEAT + 220);
        const x = WORLD_NINJA_X + (absoluteStart - beatPosition) * WORLD_PIXELS_PER_BEAT - 110;
        features.push({
          type: "substitution",
          window,
          absoluteStart,
          x,
          width,
          sortBeat: absoluteStart
        });
      });
    }

    return features;
  }

  function drawVisibleWorldFeatures(beatPosition, now = performance.now()) {
    const features = [
      ...(previousPhrase ? buildWorldFeaturesForPhrase(previousPhrase, -PHRASE_BEATS, beatPosition) : []),
      ...buildWorldFeaturesForPhrase(currentPhrase, 0, beatPosition),
      ...buildWorldFeaturesForPhrase(nextPhrase, PHRASE_BEATS, beatPosition)
    ].filter(feature => feature.x + feature.width >= -40 && feature.x <= GAME_CANVAS_LOGICAL_WIDTH + 40)
      .sort((a, b) => a.x - b.x || a.sortBeat - b.sortBeat);

    features.forEach(feature => {
      if (feature.type === "events") drawCourseObstacleGroup(feature.events, feature.x, beatPosition, feature.absoluteStart, now);
      else drawSubstitutionThreat(feature.window, feature.absoluteStart, beatPosition, now);
    });
  }

  function drawLimbSegment(x1, y1, x2, y2, width, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function runLegPoints(phase, side) {
    const stride = Math.sin(phase);
    const rise = Math.max(0, Math.cos(phase));
    const hipX = side * 1.2;
    const hipY = 0;
    const kneeX = hipX + stride * 7.6;
    const kneeY = 9 + Math.max(0, -Math.cos(phase)) * 2.3;
    const trail = 3.9 + rise * 2.0;
    let footX = kneeX - trail;
    let footY = kneeY + 12 - rise * 6.3;

    const upperX = kneeX - hipX;
    const upperY = kneeY - hipY;
    const lowerX = footX - kneeX;
    const lowerY = footY - kneeY;
    const bendCross = upperX * lowerY - upperY * lowerX;

    // Preserve the original bend until the two segments become perfectly
    // aligned. At that point, stop the lower leg instead of letting it cross
    // through and reverse the apparent knee direction.
    if (bendCross < 0) {
      const upperLength = Math.max(0.001, Math.hypot(upperX, upperY));
      const lowerLength = Math.max(0.001, Math.hypot(lowerX, lowerY));
      footX = kneeX + (upperX / upperLength) * lowerLength;
      footY = kneeY + (upperY / upperLength) * lowerLength;
    }

    return { hipX, hipY, kneeX, kneeY, footX, footY };
  }

  function runArmPoints(phase, side) {
    const swing = Math.sin(phase);
    const shoulderX = side * 1.2;
    const shoulderY = 0;
    const elbowX = shoulderX + swing * 4.5 + side * 1.5;
    const elbowY = 5.5;
    const handX = shoulderX + swing * 8.5;
    const handY = 13.5 + Math.max(0, -swing) * 1.5;
    return { shoulderX, shoulderY, elbowX, elbowY, handX, handY };
  }

  function drawSolidTeleportPuff(x, y, scale = 1) {
    ctx.save();
    ctx.fillStyle = '#f7f7f4';
    ctx.strokeStyle = '#111315';
    ctx.lineWidth = 2;
    const circles = [
      [-10, -2, 7], [-2, -8, 9], [8, -5, 7], [12, 3, 6], [1, 4, 10], [-9, 5, 6]
    ];
    circles.forEach(([dx, dy, radius]) => {
      ctx.beginPath();
      ctx.arc(x + dx * scale, y + dy * scale, radius * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    });
    ctx.restore();
  }

  function drawMovementStickPose(baseX, baseY, pose, rotation = 0, bandanaPhase = 0, shadow = true) {
    const handCos = Math.cos(rotation);
    const handSin = Math.sin(rotation);
    if (pose?.frontArm?.[2]) {
      const point = pose.frontArm[2];
      currentNinjaFrontHand = [
        baseX + point[0] * handCos - point[1] * handSin,
        baseY + point[0] * handSin + point[1] * handCos
      ];
    }
    if (pose?.backArm?.[2]) {
      const point = pose.backArm[2];
      currentNinjaBackHand = [
        baseX + point[0] * handCos - point[1] * handSin,
        baseY + point[0] * handSin + point[1] * handCos
      ];
    }

    if (shadow) {
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.16)';
      ctx.beginPath();
      ctx.ellipse(baseX - 2, WORLD_GROUND_Y + 2, pose.shadowWidth || 10, 3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    ctx.save();
    ctx.translate(baseX, baseY);
    ctx.rotate(rotation);
    ctx.strokeStyle = '#050505';
    ctx.fillStyle = '#050505';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const backArm = pose.backArm;
    const frontArm = pose.frontArm;
    const backLeg = pose.backLeg;
    const frontLeg = pose.frontLeg;

    if (backArm) {
      drawLimbSegment(backArm[0][0], backArm[0][1], backArm[1][0], backArm[1][1], 2.4, '#050505');
      drawLimbSegment(backArm[1][0], backArm[1][1], backArm[2][0], backArm[2][1], 2.1, '#050505');
    }

    ctx.lineWidth = 3.1;
    ctx.beginPath();
    ctx.moveTo(pose.neck[0], pose.neck[1]);
    ctx.lineTo(pose.hip[0], pose.hip[1]);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(pose.head[0], pose.head[1], pose.head[2] || 4.6, 0, Math.PI * 2);
    ctx.fill();

    if (backLeg) {
      drawLimbSegment(backLeg[0][0], backLeg[0][1], backLeg[1][0], backLeg[1][1], 2.7, '#050505');
      drawLimbSegment(backLeg[1][0], backLeg[1][1], backLeg[2][0], backLeg[2][1], 2.3, '#050505');
    }
    if (frontLeg) {
      drawLimbSegment(frontLeg[0][0], frontLeg[0][1], frontLeg[1][0], frontLeg[1][1], 2.9, '#050505');
      drawLimbSegment(frontLeg[1][0], frontLeg[1][1], frontLeg[2][0], frontLeg[2][1], 2.5, '#050505');
    }
    if (frontArm) {
      drawLimbSegment(frontArm[0][0], frontArm[0][1], frontArm[1][0], frontArm[1][1], 2.5, '#050505');
      drawLimbSegment(frontArm[1][0], frontArm[1][1], frontArm[2][0], frontArm[2][1], 2.2, '#050505');
    }

    // Subtle armor/sash and eye details keep the silhouette readable without
    // changing any pose geometry used by the animation system.
    ctx.strokeStyle = '#34434d';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(pose.hip[0] - 4, pose.hip[1] - 1);
    ctx.lineTo(pose.hip[0] + 5, pose.hip[1] - 2);
    ctx.stroke();
    ctx.strokeStyle = '#d7e4e7';
    ctx.lineWidth = 1.15;
    ctx.beginPath();
    ctx.moveTo(pose.head[0] + 1, pose.head[1] - 1.5);
    ctx.lineTo(pose.head[0] + 4.2, pose.head[1] - 1.5);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(96,116,126,0.62)';
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(pose.neck[0] + 1.2, pose.neck[1] + 2);
    ctx.lineTo(pose.hip[0] + 1.8, pose.hip[1] - 2);
    ctx.stroke();

    ctx.strokeStyle = '#c51f2b';
    ctx.lineWidth = 2.8;
    const headX = pose.head[0];
    const headY = pose.head[1];
    ctx.beginPath();
    ctx.moveTo(headX - 3, headY - 1);
    ctx.lineTo(headX + 5, headY - 1);
    ctx.stroke();
    const swing = Math.sin(bandanaPhase) * 2.2;
    ctx.beginPath();
    ctx.moveTo(headX - 3.5, headY - 0.5);
    ctx.lineTo(headX - 10, headY + 2 + swing * 0.3);
    ctx.lineTo(headX - 16, headY + 1 + swing * 0.15);
    ctx.moveTo(headX - 4, headY + 1.5);
    ctx.lineTo(headX - 10, headY + 6 + swing * 0.4);
    ctx.lineTo(headX - 15, headY + 6 + swing * 0.18);
    ctx.stroke();

    ctx.restore();
  }

  function runPoseFromPhase(phase) {
    const bob = Math.abs(Math.sin(phase * 2)) * 0.55;
    const legFront = runLegPoints(phase, 1);
    const legBack = runLegPoints(phase + Math.PI, -1);
    const armFront = runArmPoints(phase + Math.PI, 1);
    const armBack = runArmPoints(phase, -1);

    return {
      head: [3, -33 - bob, 4.6],
      neck: [1, -28 - bob],
      hip: [-4, -15 - bob],
      backArm: [
        [armBack.shoulderX, -23 - bob + armBack.shoulderY],
        [armBack.elbowX, -23 - bob + armBack.elbowY],
        [armBack.handX, -23 - bob + armBack.handY]
      ],
      frontArm: [
        [1 + armFront.shoulderX, -24 - bob + armFront.shoulderY],
        [1 + armFront.elbowX, -24 - bob + armFront.elbowY],
        [1 + armFront.handX, -24 - bob + armFront.handY]
      ],
      backLeg: [
        [-4 + legBack.hipX, -15 - bob + legBack.hipY],
        [-4 + legBack.kneeX, -15 - bob + legBack.kneeY],
        [-4 + legBack.footX, -15 - bob + legBack.footY]
      ],
      frontLeg: [
        [-4 + legFront.hipX, -15 - bob + legFront.hipY],
        [-4 + legFront.kneeX, -15 - bob + legFront.kneeY],
        [-4 + legFront.footX, -15 - bob + legFront.footY]
      ],
      shadowWidth: 10
    };
  }

  function smoothStep01(value) {
    const t = Math.max(0, Math.min(1, value));
    return t * t * (3 - 2 * t);
  }

  function mixNumber(a, b, t) {
    return a + (b - a) * t;
  }

  function mixPoint(a, b, t) {
    const length = Math.max(a?.length || 0, b?.length || 0);
    const out = [];
    for (let index = 0; index < length; index += 1) {
      out.push(mixNumber(a?.[index] ?? 0, b?.[index] ?? 0, t));
    }
    return out;
  }

  function mixLimb(a, b, t) {
    return [0, 1, 2].map(index => mixPoint(a?.[index] || [0, 0], b?.[index] || [0, 0], t));
  }

  function mixPose(a, b, t) {
    return {
      head: mixPoint(a.head, b.head, t),
      neck: mixPoint(a.neck, b.neck, t),
      hip: mixPoint(a.hip, b.hip, t),
      backArm: mixLimb(a.backArm, b.backArm, t),
      frontArm: mixLimb(a.frontArm, b.frontArm, t),
      backLeg: mixLimb(a.backLeg, b.backLeg, t),
      frontLeg: mixLimb(a.frontLeg, b.frontLeg, t),
      shadowWidth: mixNumber(a.shadowWidth || 10, b.shadowWidth || 10, t)
    };
  }

  function actionBlendWeight(progress) {
    const edge = 0.14;
    if (progress < edge) return smoothStep01(progress / edge);
    if (progress > 1 - edge) return smoothStep01((1 - progress) / edge);
    return 1;
  }

  function resolveContinuousPose(action, progress, targetX, targetY, targetPose, targetRotation = 0) {
    const startPhase = action.runPhase || action.start * 0.012;
    const endPhase = startPhase + Math.max(0, action.until - action.start) * 0.012;
    const runPose = progress < 0.5 ? runPoseFromPhase(startPhase) : runPoseFromPhase(endPhase);
    const weight = actionBlendWeight(action.blendProgress ?? progress);
    // During the exit blend, use the nearest equivalent angle to zero.
    // This prevents a nearly completed 360-degree roll/flip from briefly
    // spinning backward through a full turn as the run-pose blend reaches zero.
    let blendedRotation = targetRotation * weight;
    if (progress > 0.5 && weight < 0.999) {
      const nearestRotation = Math.atan2(Math.sin(targetRotation), Math.cos(targetRotation));
      blendedRotation = nearestRotation * weight;
    }

    return {
      pose: mixPose(runPose, targetPose, weight),
      x: mixNumber(WORLD_NINJA_X, targetX, weight),
      y: mixNumber(WORLD_GROUND_Y, targetY, weight),
      rotation: blendedRotation,
      weight
    };
  }

  function transformedPosePoint(resolved, point) {
    const cos = Math.cos(resolved.rotation);
    const sin = Math.sin(resolved.rotation);
    return [
      resolved.x + point[0] * cos - point[1] * sin,
      resolved.y + point[0] * sin + point[1] * cos
    ];
  }

  function drawResolvedContinuousPose(resolved, phase, shadow = true) {
    drawMovementStickPose(resolved.x, resolved.y, resolved.pose, resolved.rotation, phase, shadow);
  }

  function movementHeightFor(action) {
    const metrics = action.event ? groundObstacleMetrics(action.event) : { height: 60, y: WORLD_GROUND_Y - 80, placement: 'ground', width: 90 };
    const lengthClass = rhythmLengthClass(action.event || { duration: 1 });
    if (metrics.placement === 'ground') return Math.min(190, metrics.height + (lengthClass === 'long' ? 46 : lengthClass === 'medium' ? 34 : 24));
    if (metrics.placement === 'highAir') return Math.min(180, (metrics.clearance || (WORLD_GROUND_Y - metrics.y)) + 22);
    return Math.min(110, 42 + Math.max(0, (action.event?.duration || 1) - 0.5) * 20);
  }

  function movementArc(action) {
    const rise = Math.sin(action.pre * Math.PI * 0.5);
    const fall = Math.cos(action.post * Math.PI * 0.5);
    return action.beforeContact ? rise : Math.max(0, fall);
  }

  function movementVariant(action, count) {
    return eventVariantIndex(action?.event, count);
  }

  function actionObstacleX(action, now) {
    const event = action?.event;
    if (!event) return WORLD_NINJA_X;
    let baseBeat = 0;
    if (event.phrase === nextPhrase) baseBeat = PHRASE_BEATS;
    else if (event.phrase === previousPhrase) baseBeat = -PHRASE_BEATS;
    return worldFeatureX(baseBeat, event.start, currentBeatPosition(now));
  }

  function clampNumber(value, minimum, maximum) {
    if (minimum > maximum) return (minimum + maximum) / 2;
    return Math.max(minimum, Math.min(maximum, value));
  }

  function superFloatYAt(now) {
    return WORLD_GROUND_Y - 72 + Math.sin(now * 0.0045) * 5;
  }

  function superFloatHandOriginAt(now) {
    // The two super-pose hands meet at nearly the same point in front of the
    // upper torso. Use that exact midpoint for the beam origin.
    return [WORLD_NINJA_X + 20.5, superFloatYAt(now) - 24];
  }

  function drawSuperFloatNinja(now, action) {
    const phase = now * 0.012;
    const pulse = 0.5 + 0.5 * Math.sin(now * 0.009);
    const steadyFloatY = superFloatYAt(now);
    const progress = Math.max(0, Math.min(1, action?.progress || 0));
    const enterBlend = smoothStep01(Math.min(1, progress / 0.13));
    const exitBlend = smoothStep01(Math.min(1, (1 - progress) / 0.13));
    const floatBlend = Math.min(enterBlend, exitBlend);
    const floatY = mixNumber(WORLD_GROUND_Y, steadyFloatY, floatBlend);
    const centerX = WORLD_NINJA_X + 1;
    const centerY = floatY - 18;

    ctx.save();
    ctx.globalAlpha = 0.10 + floatBlend * 0.06;
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.ellipse(WORLD_NINJA_X - 2, WORLD_GROUND_Y + 2, 19 + pulse * 2 - floatBlend * 5, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.34 + floatBlend * 0.66;
    ctx.strokeStyle = '#e0ad25';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.ellipse(centerX, centerY, 30 + pulse * 4, 49 + pulse * 6, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = '#ffe27a';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(centerX, centerY, 23 + pulse * 3, 41 + pulse * 5, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = '#d89218';
    ctx.lineWidth = 3;
    for (let index = 0; index < 10; index += 1) {
      const angle = -Math.PI / 2 + index * Math.PI * 2 / 10;
      const innerX = centerX + Math.cos(angle) * (31 + pulse * 4);
      const innerY = centerY + Math.sin(angle) * (50 + pulse * 6);
      const outerX = centerX + Math.cos(angle) * (38 + pulse * 7 + (index % 2) * 5);
      const outerY = centerY + Math.sin(angle) * (60 + pulse * 8 + (index % 2) * 5);
      ctx.beginPath();
      ctx.moveTo(innerX, innerY);
      ctx.lineTo(outerX, outerY);
      ctx.stroke();
    }
    ctx.restore();

    const superPose = {
      head: [4, -34, 4.8], neck: [1, -28], hip: [-3, -14],
      backArm: [[0, -24], [9, -29], [20, -24]],
      frontArm: [[2, -24], [12, -28], [21, -24]],
      backLeg: [[-3, -14], [-9, -7], [-13, 1]],
      frontLeg: [[-2, -14], [7, -7], [11, 1]],
      shadowWidth: 0
    };
    ctx.save();
    ctx.globalAlpha = 0.34 + floatBlend * 0.66;
    drawMovementStickPose(WORLD_NINJA_X, floatY, superPose, 0, phase, false);
    ctx.restore();
  }

  function drawMovementNinja(now, action) {
    if ((action?.event?.duration || 0) >= PHRASE_BEATS) {
      drawSuperFloatNinja(now, action);
      return;
    }

    if (isRapidLeftEvent(action?.event)) {
      const rapidPhase = now * 0.012;
      const rapidProgress = Math.max(0, Math.min(1, action.progress || 0));
      const profile = action.deflectProfile || rapidDeflectProfile(action.event);
      const motion = Math.sin(Math.PI * rapidProgress);
      const easedMotion = smoothStep01(Math.max(0, motion));
      const basePose = runPoseFromPhase(action.runPhase);
      let targetPose;
      let rotation = 0;
      let impactPoint = null;

      if (profile.style === 0) {
        // Swat: a compact forearm strike across the projectile line.
        targetPose = {
          head: [4, -32, 4.6], neck: [1, -27], hip: [-4, -14],
          backArm: [[0, -23], [-8, -20], [-14, -15]],
          frontArm: [[2, -23], [13, -27], [24, -31]],
          backLeg: [[-4, -14], [-10, -7], [-14, 0]],
          frontLeg: [[-3, -14], [7, -7], [11, 0]],
          shadowWidth: 10
        };
        rotation = -0.06 * easedMotion;
      } else {
        // Kick: one fast rising side kick while the upper body counterbalances.
        targetPose = {
          head: [3, -32, 4.6], neck: [0, -27], hip: [-4, -14],
          backArm: [[0, -23], [-10, -25], [-17, -22]],
          frontArm: [[2, -23], [10, -19], [17, -14]],
          backLeg: [[-4, -14], [-11, -7], [-15, 0]],
          frontLeg: [[-3, -14], [10, -20], [24, -28]],
          shadowWidth: 10
        };
        rotation = -0.09 * easedMotion;
      }

      const pose = mixPose(basePose, targetPose, easedMotion);
      drawMovementStickPose(WORLD_NINJA_X, WORLD_GROUND_Y, pose, rotation, rapidPhase, true);

      if (Math.abs(now - action.contactAt) < Math.max(30, beatDurationMs * 0.045)) {
        if (profile.style === 1) {
          const foot = pose.frontLeg[2];
          const cos = Math.cos(rotation);
          const sin = Math.sin(rotation);
          impactPoint = [
            WORLD_NINJA_X + foot[0] * cos - foot[1] * sin,
            WORLD_GROUND_Y + foot[0] * sin + foot[1] * cos
          ];
        } else {
          impactPoint = currentNinjaFrontHand;
        }
        ctx.save();
        ctx.strokeStyle = '#f4d267';
        ctx.lineWidth = 2.5;
        for (let index = 0; index < 5; index += 1) {
          const angle = index * Math.PI * 2 / 5 - 0.45;
          ctx.beginPath();
          ctx.moveTo(impactPoint[0] + Math.cos(angle) * 4, impactPoint[1] + Math.sin(angle) * 4);
          ctx.lineTo(impactPoint[0] + Math.cos(angle) * 13, impactPoint[1] + Math.sin(angle) * 13);
          ctx.stroke();
        }
        ctx.restore();
      }
      return;
    }

    const x = WORLD_NINJA_X;
    const groundY = WORLD_GROUND_Y;
    const phase = now * 0.012;
    const metrics = action.event ? groundObstacleMetrics(action.event) : { y: groundY - 60, height: 60, width: 90, placement: 'ground' };
    const family = metrics.placement;
    const variant = movementVariantForEvent(action.event, family);
    const p = Math.max(0, Math.min(1, action.progress || 0));
    const obstacleLeft = actionObstacleX(action, now);
    const obstacleRight = obstacleLeft + metrics.width;
    const obstacleTop = metrics.y;
    const obstacleBottom = metrics.y + metrics.height;

    // Entry timing remains exactly as before. This value is used only by the
    // final descent / hop / drop once the obstacle's trailing edge approaches.
    const exitStartRight = x + 52;
    const exitEndRight = x - MOVEMENT_EXIT_CLEARANCE_PX;
    const edgeExitProgress = Math.max(0, Math.min(1,
      (exitStartRight - obstacleRight) / Math.max(1, exitStartRight - exitEndRight)
    ));

    const flipPose = {
      head: [5, -28, 4.6], neck: [2, -23], hip: [-4, -12],
      backArm: [[1, -20], [-6, -16], [-10, -10]],
      frontArm: [[3, -20], [11, -16], [16, -10]],
      backLeg: [[-4, -12], [-10, -6], [-14, 0]],
      frontLeg: [[-3, -12], [6, -6], [10, 0]],
      shadowWidth: 8
    };
    const platformHopPose = {
      head: [4, -31, 4.6], neck: [1, -26], hip: [-3, -13],
      backArm: [[0, -22], [-8, -18], [-13, -13]],
      frontArm: [[2, -22], [10, -18], [16, -13]],
      backLeg: [[-3, -13], [-10, -9], [-13, -3]],
      frontLeg: [[-2, -13], [8, -10], [13, -4]],
      shadowWidth: 8
    };
    const lowRollPose = {
      head: [8, -10, 4.5], neck: [4, -9], hip: [-4, -6],
      backArm: [[3, -8], [-4, -12], [-1, -18]],
      frontArm: [[4, -8], [11, -5], [14, 1]],
      backLeg: [[-4, -6], [-12, -4], [-18, -2]],
      frontLeg: [[-3, -6], [6, -2], [9, 5]],
      shadowWidth: 16
    };
    const slidePose = {
      head: [15, -11, 4.5], neck: [10, -10], hip: [-4, -7],
      backArm: [[9, -9], [18, -7], [25, -5]],
      frontArm: [[10, -9], [20, -10], [27, -9]],
      backLeg: [[-4, -7], [-15, -5], [-25, -2]],
      frontLeg: [[-3, -7], [5, -4], [15, -2]],
      shadowWidth: 18
    };
    const crawlPose = {
      head: [7, -13, 3.8], neck: [3, -12], hip: [-5, -8],
      backArm: [[2, -10], [-4, -8], [-9, -5]],
      frontArm: [[4, -10], [10, -7], [16, -5]],
      backLeg: [[-5, -8], [-11, -5], [-16, -3]],
      frontLeg: [[-4, -8], [2, -5], [8, -3]],
      shadowWidth: 16
    };
    const hangingPose = {
      head: [8, -20, 4.6], neck: [4, -18], hip: [-4, -13],
      backArm: [[3, -17], [-2, -13], [-7, -8]],
      frontArm: [[5, -17], [11, -13], [16, -8]],
      backLeg: [[-4, -13], [-11, -7], [-16, -1]],
      frontLeg: [[-3, -13], [7, -8], [12, -4]],
      shadowWidth: 0
    };
    const invertedPose = {
      head: [4, -31, 4.6], neck: [1, -26], hip: [-3, -13],
      backArm: [[0, -22], [-7, -18], [-11, -12]],
      frontArm: [[2, -22], [9, -18], [13, -12]],
      backLeg: [[-3, -13], [2, -7], [-1, -1]],
      frontLeg: [[-2, -13], [8, -8], [5, -1]],
      shadowWidth: 0
    };

    if (family === 'ground') {
      if (variant === 0) {
        const rhythmKey = action.event?.rhythmKey || rhythmKeyForEvent(action.event);
        const extraLift = rhythmKey === 'quarter' ? 6 : 0;
        const height = Math.min(148, Math.max(58, metrics.height + 34 + extraLift));
        const jumpP = p <= 0.5
          ? p
          : 0.5 + edgeExitProgress * 0.5;
        const targetX = x + Math.sin(Math.PI * jumpP) * 18;
        const targetY = groundY - Math.sin(Math.PI * jumpP) * height;
        const returnBlend = smoothStep01((edgeExitProgress - 0.66) / 0.34);
        const exitPose = mixPose(flipPose, runPoseFromPhase(phase), returnBlend);
        const resolved = resolveContinuousPose(action, p, targetX, targetY, exitPose, jumpP * Math.PI * 2);
        drawResolvedContinuousPose(resolved, phase, true);
        return;
      }

      if (variant === 1) {
        if (p < 0.32) {
          const t = p / 0.32;
          const crouchPose = mixPose(runPoseFromPhase(action.runPhase), {
            head: [5, -25, 4.6], neck: [2, -20], hip: [-3, -10],
            backArm: [[1, -18], [-7, -13], [-12, -7]],
            frontArm: [[3, -18], [10, -13], [14, -7]],
            backLeg: [[-3, -10], [-10, -4], [-15, 0]],
            frontLeg: [[-2, -10], [6, -4], [10, 0]],
            shadowWidth: 10
          }, smoothStep01(t));
          const resolved = resolveContinuousPose(action, p, x, groundY, crouchPose, 0);
          drawResolvedContinuousPose(resolved, phase, true);
          if (t > 0.62) drawSolidTeleportPuff(x - 1, groundY - 14, 0.72);
          return;
        }
        if (p < 0.56) {
          drawSolidTeleportPuff(x - 1, groundY - 14, 0.82);
          return;
        }
        if (edgeExitProgress <= 0) {
          drawSolidTeleportPuff(x - 1, groundY - 14, 0.82);
          return;
        }
        const t = smoothStep01(edgeExitProgress);
        const targetX = x + 24 * (1 - t);
        const resolved = resolveContinuousPose(action, p, targetX, groundY, runPoseFromPhase(phase), 0);
        if (t < 0.28) drawSolidTeleportPuff(x + 23, groundY - 14, 0.74);
        drawResolvedContinuousPose(resolved, phase, true);
        return;
      }

      if (action.beforeContact) {
        const t = smoothStep01(action.pre);
        const targetY = mixNumber(groundY, obstacleTop, t);
        const topEntryPose = runPoseFromPhase(action.runPhase);
        const entryPose = mixPose(flipPose, topEntryPose, t);
        const resolved = resolveContinuousPose(action, p, x + 8 * t, targetY, entryPose, -0.04 * (1 - t));
        drawResolvedContinuousPose(resolved, phase, true);
        return;
      }
      if (edgeExitProgress <= 0) {
        const topRunPhase = action.runPhase + Math.max(0, p) * 14;
        const topPose = runPoseFromPhase(topRunPhase);
        const resolved = resolveContinuousPose(action, p, x + 8, obstacleTop, topPose, 0);
        drawResolvedContinuousPose(resolved, phase, false);
        return;
      }
      const t = smoothStep01(edgeExitProgress);
      // One continuous hop arc: starts on the platform at x + 8, bows
      // forward far enough to clear its trailing corner, and returns smoothly
      // to the normal running x at landing. No separate run-back phase.
      const hopLift = Math.sin(Math.PI * t) * 24;
      const hopForward = Math.sin(Math.PI * t) * 22;
      const targetY = mixNumber(obstacleTop, groundY, t) - hopLift;
      const targetX = x + 8 * (1 - t) + hopForward;
      const landingBlend = smoothStep01((t - 0.55) / 0.45);
      const exitPose = mixPose(platformHopPose, runPoseFromPhase(phase), landingBlend);
      const resolved = resolveContinuousPose(
        action,
        p,
        targetX,
        targetY,
        exitPose,
        0.07 * Math.sin(Math.PI * t) * (1 - landingBlend)
      );
      drawResolvedContinuousPose(resolved, phase, true);
      return;
    }

    if (family === 'lowAir') {
      const localTravel = Math.sin(Math.PI * p) * 8;
      const exitBlend = smoothStep01(edgeExitProgress);
      const liveRunPose = runPoseFromPhase(phase);
      if (variant === 0) {
        const rollPose = mixPose(lowRollPose, liveRunPose, exitBlend);
        const rollRotation = mixNumber(p * Math.PI * 2, Math.PI * 2, exitBlend);
        const resolved = resolveContinuousPose(
          action,
          p,
          x + localTravel * (1 - exitBlend),
          mixNumber(groundY - 1, groundY, exitBlend),
          rollPose,
          rollRotation
        );
        drawResolvedContinuousPose(resolved, phase, true);
        return;
      }
      if (variant === 1) {
        const exitPose = mixPose(slidePose, liveRunPose, exitBlend);
        const resolved = resolveContinuousPose(
          action,
          p,
          x + localTravel * (1 - exitBlend),
          mixNumber(groundY - 2, groundY, exitBlend),
          exitPose,
          -0.03 * (1 - exitBlend)
        );
        drawResolvedContinuousPose(resolved, phase, true);
        return;
      }
      const crawlCycle = Math.sin(p * Math.PI * 8);
      const animatedCrawl = {
        ...crawlPose,
        backArm: [[2, -10], [-4 - crawlCycle * 2, -8], [-9 - crawlCycle * 3, -5]],
        frontArm: [[4, -10], [10 + crawlCycle * 2, -7], [16 + crawlCycle * 3, -5]],
        backLeg: [[-5, -8], [-11 + crawlCycle * 2, -5], [-16 + crawlCycle * 3, -3]],
        frontLeg: [[-4, -8], [2 - crawlCycle * 2, -5], [8 - crawlCycle * 3, -3]]
      };
      const exitPose = mixPose(animatedCrawl, liveRunPose, exitBlend);
      const resolved = resolveContinuousPose(
        action,
        p,
        x + localTravel * 0.65 * (1 - exitBlend),
        groundY,
        exitPose,
        0
      );
      drawResolvedContinuousPose(resolved, phase, true);
      return;
    }

    if (variant === 0) {
      const anchorX = obstacleLeft + Math.min(metrics.width * 0.42, 62);
      const anchorY = obstacleBottom + 5;
      const entryEnd = 0.18;
      const swingEnd = 0.80;
      let targetX;
      let targetY;
      let rotation;
      let ropeActive = false;

      if (p < entryEnd) {
        const t = smoothStep01(p / entryEnd);
        const startAngle = -0.78;
        const radius = 52;
        const swingX = anchorX + Math.sin(startAngle) * radius;
        const swingY = anchorY + Math.cos(startAngle) * radius + 16;
        targetX = mixNumber(x, swingX, t);
        targetY = mixNumber(groundY, swingY, t);
        rotation = mixNumber(0, -0.24, t);
        ropeActive = t > 0.18;
      } else if (edgeExitProgress <= 0) {
        const t = Math.max(0, Math.min(1, (p - entryEnd) / (swingEnd - entryEnd)));
        const angle = mixNumber(-0.78, 0.78, smoothStep01(t));
        const radius = 52;
        targetX = anchorX + Math.sin(angle) * radius;
        targetY = anchorY + Math.cos(angle) * radius + 16;
        rotation = -angle * 0.30;
        ropeActive = true;
      } else {
        const t = smoothStep01(edgeExitProgress);
        const endAngle = 0.78;
        const radius = 52;
        const swingX = anchorX + Math.sin(endAngle) * radius;
        const swingY = anchorY + Math.cos(endAngle) * radius + 16;
        targetX = mixNumber(swingX, x + 18, t);
        targetY = mixNumber(swingY, groundY, t);
        rotation = mixNumber(-endAngle * 0.30, 0, t);
        ropeActive = t < 0.72;
      }

      const swingExitBlend = edgeExitProgress > 0 ? smoothStep01(edgeExitProgress) : 0;
      const swingPose = mixPose(hangingPose, runPoseFromPhase(phase), swingExitBlend);
      if (edgeExitProgress > 0) {
        targetX = mixNumber(targetX, x, swingExitBlend);
        rotation *= (1 - swingExitBlend);
      }
      const resolved = resolveContinuousPose(action, p, targetX, targetY, swingPose, rotation);
      if (ropeActive && resolved.weight > 0.05) {
        const hand = transformedPosePoint(resolved, resolved.pose.frontArm[2]);
        ctx.save();
        ctx.strokeStyle = '#2c3136';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(anchorX, anchorY);
        ctx.lineTo(hand[0], hand[1]);
        ctx.stroke();
        ctx.restore();
      }
      drawResolvedContinuousPose(resolved, phase, false);
      return;
    }

    if (variant === 1) {
      const entryEnd = 0.20;
      const runEnd = 0.80;
      const contactY = obstacleBottom - 1;
      const platformX = clampNumber(x, obstacleLeft + 14, obstacleRight - 14);
      if (p < entryEnd) {
        const t = smoothStep01(p / entryEnd);
        const targetX = mixNumber(x, platformX, t);
        const targetY = mixNumber(groundY, contactY, t);
        const resolved = resolveContinuousPose(action, p, targetX, targetY, invertedPose, Math.PI * t);
        drawResolvedContinuousPose(resolved, phase, false);
        return;
      }
      if (edgeExitProgress <= 0) {
        const t = Math.max(0, Math.min(1, (p - entryEnd) / (runEnd - entryEnd)));
        const undersidePose = runPoseFromPhase(action.runPhase + t * 16);
        undersidePose.backLeg[2][1] = -1;
        undersidePose.frontLeg[2][1] = -1;
        undersidePose.shadowWidth = 0;
        const targetX = clampNumber(x, obstacleLeft + 14, obstacleRight - 14);
        const resolved = resolveContinuousPose(action, p, targetX, contactY, undersidePose, Math.PI);
        drawResolvedContinuousPose(resolved, phase, false);
        return;
      }
      const t = smoothStep01(edgeExitProgress);
      const startX = clampNumber(x, obstacleLeft + 14, obstacleRight - 14);
      const targetX = mixNumber(startX, x, t);
      const targetY = mixNumber(contactY, groundY, t);
      const exitPose = mixPose(invertedPose, runPoseFromPhase(phase), t);
      const resolved = resolveContinuousPose(action, p, targetX, targetY, exitPose, Math.PI * (1 - t));
      drawResolvedContinuousPose(resolved, phase, true);
      return;
    }

    const latchEnd = 0.46;
    const contactY = obstacleBottom - 1;
    const contactX = clampNumber(x + 10, obstacleLeft + 14, obstacleRight - 14);
    if (p < latchEnd) {
      const t = smoothStep01(p / latchEnd);
      const targetX = mixNumber(x, contactX, t);
      const targetY = mixNumber(groundY, contactY, t);
      const resolved = resolveContinuousPose(action, p, targetX, targetY, invertedPose, Math.PI * t);
      drawResolvedContinuousPose(resolved, phase, false);
      return;
    }
    if (edgeExitProgress <= 0) {
      const resolved = resolveContinuousPose(action, p, contactX, contactY, invertedPose, Math.PI);
      drawResolvedContinuousPose(resolved, phase, false);
      return;
    }
    const t = smoothStep01(edgeExitProgress);
    const targetX = mixNumber(contactX, x, t);
    const targetY = mixNumber(contactY, groundY, t);
    const exitPose = mixPose(invertedPose, runPoseFromPhase(phase), t);
    const resolved = resolveContinuousPose(action, p, targetX, targetY, exitPose, Math.PI * (1 - t));
    drawResolvedContinuousPose(resolved, phase, true);
  }

  function drawShuriken(x, y, radius, rotation) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);
    ctx.fillStyle = '#20252a';
    ctx.strokeStyle = '#050505';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < 8; i += 1) {
      const angle = i * Math.PI / 4;
      const r = i % 2 === 0 ? radius : radius * 0.34;
      const px = Math.cos(angle) * r;
      const py = Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawKunai(x, y, rotation, scale = 1) {

    ctx.translate(x, y);
    ctx.rotate(rotation);
    ctx.scale(scale, scale);

    ctx.strokeStyle = '#050505';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(12, 0);
    ctx.lineTo(-3, -5);
    ctx.lineTo(-7, 0);
    ctx.lineTo(-3, 5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

  function drawChakraOrb(x, y, radius = 8) {
