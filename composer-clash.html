<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Composer Clash Mobile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #appFrame {
      width: 100%;
      aspect-ratio: 390 / 670;
      position: relative;
      overflow: hidden;
      background: #202020;
    }

    #appStage {
      width: 390px;
      height: 670px;
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: top left;
      transform: scale(var(--app-scale, 1));
      overflow: hidden;
      background: linear-gradient(180deg, #2f2f2f, #191919);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: auto;
      color: white;
    }

    #appStage *:not(input):not(textarea) {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    button {
      font-family: Arial, sans-serif;
      touch-action: none;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input,
    select {
      font-size: 16px;
      padding: 8px;
      border-radius: 10px;
      border: 2px solid #111;
      box-sizing: border-box;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       PLAYER MENU
       ========================= */

    #menuScreen {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #2f2f2f, #191919);
      padding: 13px 16px 14px;
      overflow: visible;
      text-align: center;
      z-index: 20;
      touch-action: pan-y;
    }

    #menuScreen h1 {
      margin: 4px 0 9px;
      font-size: 28px;
    }

    #leaderboardBox {
      margin: 0 auto 9px;
      padding: 9px;
      background: rgba(255,255,255,0.1);
      border-radius: 14px;
      max-width: 350px;
    }

    #leaderboardBox h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    #leaderboardList {
      text-align: left;
      max-width: 230px;
      margin: 0 auto;
      font-size: 15px;
    }

    #playerPickerBox {
      margin: 0 auto 9px;
      padding: 9px;
      background: rgba(255,255,255,0.08);
      border-radius: 14px;
      max-width: 350px;
    }

    #playerSearchInput {
      width: 100%;
      margin-bottom: 8px;
    }

    #playerSelect {
      width: 100%;
      height: 120px;
      background: #f8fbff;
      color: #111827;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border: 2px solid #111;
      border-radius: 10px;
      text-align: left;
    }

    .playerOption {
      padding: 10px;
      border-bottom: 1px solid rgba(17,24,39,0.12);
      font-size: 16px;
      line-height: 1.2;
      background: #f8fbff;
      color: #111827;
    }

    .playerOption:last-child {
      border-bottom: 0;
    }

    .playerOption.selected {
      background: #ffe08a;
      font-weight: bold;
    }

    .playerOption.disabled {
      color: rgba(17,24,39,0.55);
      text-align: center;
      font-style: italic;
    }

    #selectedPlayerActions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 7px;
    }

    #selectedPlayerActions button,
    #addPlayerBtn,
    #startGameBtn,
    #exitPageBtn {
      min-height: 38px;
      border-radius: 12px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
    }

    #resetSelectedPlayerBtn {
      background: #fff3bf;
    }

    #removeSelectedPlayerBtn {
      background: #ffd6d6;
    }

    #addPlayerRow {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
      margin: 0 auto 8px;
      max-width: 350px;
    }

    #newPlayerName {
      width: 100%;
    }

    #selectedPlayerText {
      margin: 7px 0;
      font-size: 15px;
      opacity: 0.9;
    }

    #startGameBtn {
      background: #dff3ff;
      min-width: 150px;
    }

    #exitPageBtn {
      min-width: 110px;
    }

    /* =========================
       GAME / EMULATOR
       ========================= */

    #gameScreen {
      position: absolute;
      inset: 0;
      display: none;
      background: linear-gradient(180deg, #2f2f2f, #191919);
      z-index: 10;
      touch-action: auto;
    }

    #screen {
      position: absolute;
      left: 0;
      top: 0;
      width: 390px;
      height: 219px;
      overflow: hidden;
      background: #0b1420;
      border: 1px solid #2b2b2b;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.05),
        0 1px 3px rgba(0,0,0,0.45);
    }

    #gameCanvas {
      width: 390px;
      height: 219px;
      display: block;
      background: #f7fbff;
      image-rendering: auto;
    }

    #gameOverBox {
      display: none;
      position: absolute;
      left: 24px;
      right: 24px;
      top: 10px;
      max-height: 198px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 10px 8px;
      background: rgba(16, 24, 39, 0.94);
      border: 3px solid white;
      border-radius: 16px;
      color: white;
      text-align: center;
      z-index: 8;
    }

    #gameOverBox h1 {
      margin: 0 0 5px;
      font-size: 22px;
      line-height: 1;
    }

    #gameOverScore {
      margin: 0 0 10px;
      font-size: 15px;
    }

    #gameOverScore {
      line-height: 1.22;
      margin: 0 0 6px;
      font-size: 12px;
    }

    .scoreBreakdown {
      display: inline-block;
      text-align: left;
      margin-top: 4px;
      padding: 5px 7px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      font-size: 11px;
      line-height: 1.2;
    }

    #gameOverBox button {
      border: 2px solid #111;
      border-radius: 12px;
      background: white;
      color: #111827;
      padding: 6px 9px;
      margin: 2px;
      font-size: 11px;
      font-weight: bold;
    }

    #lcd {
      position: absolute;
      left: 0;
      top: 219px;
      width: 390px;
      height: 48px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02)),
        #17251c;
      border-top: 3px solid #0c0c0c;
      border-bottom: 3px solid #0c0c0c;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.04),
        inset 0 0 14px rgba(0,0,0,0.35);
      color: #b7ff9e;
      font-family: "Courier New", monospace;
      text-shadow: 0 0 7px rgba(183,255,158,0.35);
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: 1fr 1fr;
      align-items: center;
      padding: 5px 16px;
      pointer-events: none;
    }

    #lcdMessage {
      grid-column: 1 / 3;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #lcdScore {
      font-size: 12px;
    }

    #lcdBest {
      font-size: 13px;
      text-align: right;
    }

    #controls {
      position: absolute;
      left: 0;
      top: 267px;
      width: 390px;
      height: 400px;
      background: linear-gradient(180deg, #303030, #181818);
      touch-action: auto;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    #controls *,
    #screen,
    #gameCanvas {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* D-PAD */

    #dpad {
      position: absolute;
      left: 17px;
      top: 19px;
      width: 150px;
      height: 150px;
      touch-action: manipulation;
    }

    .dpadBtn {
      position: absolute;
      width: 50px;
      height: 50px;
      border: none;
      background: #111;
      color: rgba(255,255,255,0.86);
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 22px;
      line-height: 50px;
      text-align: center;
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.08),
        0 7px 13px rgba(0,0,0,0.45);
    }

    .dpadBtn.pressed,
    .dpadBtn:active {
      filter: brightness(1.35);
      transform: scale(0.94);
    }

    #dpadUp { left: 50px; top: 0; border-radius: 10px 10px 3px 3px; }
    #dpadLeft { left: 0; top: 50px; border-radius: 10px 3px 3px 10px; }
    #dpadCenter { left: 50px; top: 50px; border-radius: 4px; pointer-events: none; }
    #dpadRight { left: 100px; top: 50px; border-radius: 3px 10px 10px 3px; }
    #dpadDown { left: 50px; top: 100px; border-radius: 3px 3px 10px 10px; }

    /* FACE BUTTONS */

    #faceButtons {
      position: absolute;
      right: 18px;
      top: 20px;
      width: 150px;
      height: 150px;
    }

    .faceBtn {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 20px;
      font-weight: bold;
      background: radial-gradient(circle at 30% 30%, #ff82ad, #9d003d);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.15),
        0 10px 18px rgba(0,0,0,0.45);
    }

    .faceBtn.pressed,
    .faceBtn:active {
      transform: scale(0.92);
      filter: brightness(1.2);
    }

    #buttonX { left: 46px; top: 0; }
    #buttonY { left: 0; top: 46px; }
    #buttonA { left: 92px; top: 46px; }
    #buttonB { left: 46px; top: 92px; }

    /* Composer Clash mobile layout: one joystick plus the main battle buttons. */
    #buttonY {
      display: none;
    }

    #buttonA,
    #buttonB,
    #buttonX {
      font-size: 12px;
      letter-spacing: 0;
    }

    /* JOYSTICKS */

    .joystickPad {
      position: absolute;
      width: 112px;
      height: 112px;
      border-radius: 18px;
      background: rgba(255,255,255,0.035);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.07);
      touch-action: none;
    }

    #leftJoystickPad {
      left: 36px;
      top: 188px;
    }

    #rightJoystickPad {
      right: 37px;
      top: 188px;
      display: none;
    }

    .joystickBase {
      position: absolute;
      left: 11px;
      top: 11px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, #3f3f3f, #161616);
      box-shadow:
        inset 0 0 0 3px rgba(255,255,255,0.08),
        0 9px 18px rgba(0,0,0,0.45);
      pointer-events: none;
    }

    .joystickKnob {
      position: absolute;
      left: 56px;
      top: 56px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #777, #202020);
      transform: translate(-50%, -50%);
      box-shadow: 0 8px 18px rgba(0,0,0,0.55);
      pointer-events: none;
    }

    /* START / SELECT */

    #systemButtons {
      position: absolute;
      left: 50%;
      top: 326px;
      width: 164px;
      height: 34px;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .systemBtn {
      width: 76px;
      height: 32px;
      border-radius: 999px;
      border: none;
      background: #101010;
      color: rgba(255,255,255,0.78);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.12);
    }

    .systemBtn.pressed,
    .systemBtn:active {
      transform: scale(0.96);
      filter: brightness(1.2);
    }

    /* =========================
       EXPANDABLE SHELL MENU
       ========================= */

    #shellMenu {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 60;
      background: rgba(0,0,0,0.62);
      padding: 22px 14px;
      color: white;
    }

    #shellMenu.open {
      display: block;
    }

    #shellMenuPanel {
      width: 100%;
      max-height: 100%;
      overflow: hidden;
      background: #101827;
      border: 3px solid white;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.45);
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    #shellMenuHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 12px 7px;
    }

    #shellMenuHeader h2 {
      margin: 0;
      font-size: 22px;
    }

    #shellMenuCloseBtn {
      width: 40px;
      height: 36px;
      padding: 0;
      border-radius: 12px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 26px;
      font-weight: bold;
      line-height: 1;
    }

    #shellMenuTabs {
      display: flex;
      gap: 7px;
      padding: 0 12px 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .shellMenuTab {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 7px 11px;
      border-radius: 999px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
    }

    .shellMenuTab.active {
      background: #ffe08a;
    }

    #shellMenuBody {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 14px 14px;
      text-align: left;
      font-size: 15px;
      line-height: 1.38;
      touch-action: pan-y;
    }

    #shellMenuBody h3 {
      margin: 4px 0 8px;
      font-size: 20px;
    }

    #shellMenuBody ul {
      margin-top: 8px;
      padding-left: 21px;
    }

    #shellMenuBody code {
      background: rgba(255,255,255,0.12);
      padding: 2px 5px;
      border-radius: 6px;
    }

    .shellActionBtn {
      width: 100%;
      min-height: 39px;
      margin: 6px 0;
      border-radius: 12px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 15px;
      font-weight: bold;
    }

  

    #cardDetailBox {
      display: none;
      position: absolute;
      left: 18px;
      right: 18px;
      top: 13px;
      z-index: 9;
      background: rgba(248,251,255,0.98);
      color: #111827;
      border: 3px solid #ffe08a;
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.48);
      padding: 12px;
      text-align: left;
    }

    #cardDetailBox.open {
      display: block;
    }

    #cardDetailTitle {
      margin: 0 0 4px;
      font-size: 18px;
      line-height: 1.08;
    }

    #cardDetailMeta {
      margin: 0 0 6px;
      color: #475569;
      font-weight: bold;
      font-size: 12px;
      line-height: 1.2;
    }

    #cardDetailRules {
      margin: 0 0 9px;
      color: #111827;
      font-size: 12px;
      line-height: 1.28;
    }

    #cardDetailActions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    #cardDetailActions button {
      min-height: 31px;
      border-radius: 10px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 13px;
      font-weight: bold;
      padding: 5px 8px;
    }

    #cardDetailPlayBtn {
      background: #dff3ff !important;
    }


    #difficultyRow {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 7px;
      align-items: center;
      margin: 0 auto 8px;
      max-width: 350px;
      color: #f8fbff;
      font-size: 14px;
      font-weight: bold;
    }

    #difficultySelect { width: 100%; }

    #cardDetailBox {
      top: 8px;
      left: 48px;
      right: 48px;
      min-height: 198px;
      background:
        radial-gradient(circle at 50% 16%, rgba(255,224,138,0.24), transparent 35%),
        linear-gradient(180deg, #fffaf0, #f8fbff);
      border: 4px solid #111827;
      outline: 2px solid #ffe08a;
      box-shadow: 0 9px 0 rgba(0,0,0,0.34), 0 14px 32px rgba(0,0,0,0.50);
      text-align: center;
    }

    #cardDetailTitle {
      min-height: 37px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 7px;
      background: #101827;
      color: #f8fbff;
      border: 2px solid #ffe08a;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      font-size: 15px;
    }

    #cardDetailMeta {
      display: inline-block;
      margin: 7px auto;
      padding: 3px 7px;
      background: #ffe08a;
      color: #111827;
      border: 2px solid #111827;
      border-radius: 999px;
      font-size: 10px;
    }

    #cardDetailRules {
      min-height: 67px;
      padding: 7px;
      background: rgba(16,24,39,0.07);
      border: 2px dashed #334155;
      border-radius: 10px;
      font-size: 11px;
    }



    /* Composer Clash v2 card-detail skin: retro collectible-card layout */
    #cardDetailBox {
      top: 7px;
      left: 53px;
      right: 53px;
      min-height: 204px;
      padding: 8px;
      background:
        linear-gradient(45deg, rgba(0,0,0,0.04) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.04) 75%),
        linear-gradient(45deg, rgba(0,0,0,0.04) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.04) 75%),
        #ead38c;
      background-position: 0 0, 3px 3px, 0 0;
      background-size: 6px 6px, 6px 6px, auto;
      border: 4px solid #111827;
      outline: 2px solid #facc15;
      border-radius: 3px;
      box-shadow: 5px 5px 0 rgba(0,0,0,0.82), 0 12px 26px rgba(0,0,0,0.52);
      color: #111827;
      font-family: "Courier New", monospace;
      image-rendering: pixelated;
      text-align: center;
    }

    #cardDetailTitle {
      min-height: 30px;
      margin: 0 0 5px;
      padding: 4px 5px;
      background: #111827;
      color: #f8fafc;
      border: 2px solid #f8fafc;
      border-radius: 0;
      font-family: "Courier New", monospace;
      font-size: 12px;
      line-height: 1.05;
      text-transform: uppercase;
      letter-spacing: 0;
      box-shadow: 2px 2px 0 #000;
    }

    #cardDetailMeta {
      display: block;
      margin: 0 0 5px;
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 0;
      color: #111827;
      font-family: "Courier New", monospace;
      font-size: 9px;
      font-weight: bold;
      line-height: 1.1;
    }

    #cardDetailMeta::before {
      content: "";
      display: block;
      height: 63px;
      margin: 0 0 4px;
      background:
        linear-gradient(90deg, rgba(17,24,39,0.22) 1px, transparent 1px),
        linear-gradient(0deg, rgba(17,24,39,0.18) 1px, transparent 1px),
        radial-gradient(circle at 34% 38%, #facc15 0 7px, transparent 8px),
        linear-gradient(135deg, #dbeafe, #fff7ed 54%, #dbeafe);
      background-size: 8px 8px, 8px 8px, auto, auto;
      border: 3px solid #111827;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.55), 2px 2px 0 #000;
    }

    #cardDetailBox[data-card-type="energy"] #cardDetailMeta::before {
      background:
        linear-gradient(90deg, rgba(17,24,39,0.22) 1px, transparent 1px),
        linear-gradient(0deg, rgba(17,24,39,0.18) 1px, transparent 1px),
        radial-gradient(circle at 50% 45%, #22d3ee 0 9px, transparent 10px),
        linear-gradient(135deg, #cffafe, #f0f9ff 56%, #67e8f9);
      background-size: 8px 8px, 8px 8px, auto, auto;
    }

    #cardDetailBox[data-card-type="item"] #cardDetailMeta::before {
      background:
        linear-gradient(90deg, rgba(17,24,39,0.22) 1px, transparent 1px),
        linear-gradient(0deg, rgba(17,24,39,0.18) 1px, transparent 1px),
        radial-gradient(circle at 50% 42%, #f97316 0 8px, transparent 9px),
        linear-gradient(135deg, #fef3c7, #fff7ed 52%, #fed7aa);
      background-size: 8px 8px, 8px 8px, auto, auto;
    }

    #cardDetailRules {
      min-height: 44px;
      margin: 0 0 6px;
      padding: 5px;
      background: #f8fafc;
      color: #111827;
      border: 2px solid #111827;
      border-radius: 0;
      box-shadow: 2px 2px 0 #000;
      font-family: "Courier New", monospace;
      font-size: 9px;
      line-height: 1.16;
    }

    #cardDetailActions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    #cardDetailActions button {
      min-height: 27px;
      border-radius: 0;
      border: 2px solid #111827;
      box-shadow: 2px 2px 0 #000;
      font-family: "Courier New", monospace;
      font-size: 10px;
      font-weight: bold;
    }

  

    /* v3: fit the overlay inside the emulator screen and highlight overlay buttons */
    #cardDetailBox {
      top: 4px;
      left: 58px;
      right: 58px;
      height: 207px;
      min-height: 0;
      max-height: 207px;
      padding: 6px;
      border-width: 3px;
      outline-width: 2px;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.82), 0 10px 20px rgba(0,0,0,0.48);
      overflow: hidden;

<body>
  <main id="appFrame">
    <section id="appStage">
      <div id="menuScreen">
        <h1>Choose Player</h1>

        <div id="leaderboardBox">
          <h2>Leaderboard</h2>

        <div id="playerPickerBox">
          <input id="playerSearchInput" placeholder="Search players..." autocomplete="off" />
          <div id="playerSelect" role="listbox" aria-label="Choose player"></div>

          <div id="selectedPlayerActions">

            <button id="removeSelectedPlayerBtn">Remove</button>

        </div>

        <div id="addPlayerRow">
          <input id="newPlayerName" placeholder="New player name" />

        <p id="selectedPlayerText">No player selected</p>
        <button id="startGameBtn">Start Game</button>
      </div>

      <div id="gameScreen">
        <div id="screen">
          <canvas id="gameCanvas" width="390" height="219"></canvas>

          <div id="gameOverBox">
            <h1 id="gameOverTitle">Defeat!</h1>
            <p id="gameOverScore"></p>
            <button id="playAgainBtn">Play Again</button>

            <h2 id="cardDetailTitle"></h2>
            <p id="cardDetailMeta"></p>
            <p id="cardDetailRules"></p>
            <div id="cardDetailActions">
              <button id="cardDetailPlayBtn" type="button">Play</button>
              <button id="cardDetailCloseBtn" type="button">Close</button>
            </div>
          </div>

        </div>

        <div id="lcd">
          <div id="lcdMessage">READY</div>
          <div id="lcdScore">STREAK: <span id="score">0</span></div>
          <div id="lcdBest">BEST STREAK: <span id="bestScore">0</span></div>
        </div>

        <div id="controls">
          <div id="dpad">
            <button id="dpadUp" class="dpadBtn" data-action="up">▲</button>
            <button id="dpadLeft" class="dpadBtn" data-action="left">◄</button>
            <button id="dpadCenter" class="dpadBtn"></button>
            <button id="dpadRight" class="dpadBtn" data-action="right">►</button>
            <button id="dpadDown" class="dpadBtn" data-action="down">▼</button>
          </div>

          <div id="faceButtons">
            <button id="buttonX" class="faceBtn" data-action="x">X</button>
            <button id="buttonY" class="faceBtn" data-action="y">Y</button>
            <button id="buttonA" class="faceBtn" data-action="a">A</button>
            <button id="buttonB" class="faceBtn" data-action="b">B</button>
          </div>

          <div id="leftJoystickPad" class="joystickPad" data-stick="left">
            <div class="joystickBase"></div>

          <div id="rightJoystickPad" class="joystickPad" data-stick="right">
            <div class="joystickBase"></div>
            <div id="rightJoystickKnob" class="joystickKnob"></div>
          </div>

          <div id="systemButtons">
            <button id="selectButton" class="systemBtn" data-action="select">SELECT</button>
            <button id="startButton" class="systemBtn" data-action="start">START</button>
          </div>
        </div>
      </div>

      <div id="shellMenu" aria-hidden="true">
        <div id="shellMenuPanel" role="dialog" aria-modal="true" aria-label="Pause panel">
          <div id="shellMenuHeader">
            <h2>Pause</h2>
            <button id="shellMenuCloseBtn" type="button" aria-label="Close panel">×</button>
          </div>
          <div id="shellMenuTabs" role="tablist" aria-label="Pause panel tabs"></div>
          <div id="shellMenuBody"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const DESIGN_WIDTH = 390;
    const DESIGN_HEIGHT = 670;
    const STORAGE_KEY = "composerClashMobilePlayers_v1";
    const FIRST_TIME_HELP_VERSION = "composerClashHowToPlay_v1";
    const SCORE_LABEL = "Streak";

    // Wix mobile storage bridge.
    // The Wix page code listens for messages from PianoArcadeShell
    // and replies as PianoArcadeWixStorage.
    const MESSAGE_FROM_GAME = "PianoArcadeShell";
    const MESSAGE_FROM_WIX = "PianoArcadeWixStorage";

    const appFrame = document.getElementById("appFrame");
    const appStage = document.getElementById("appStage");

    const menuScreen = document.getElementById("menuScreen");
    const gameScreen = document.getElementById("gameScreen");

    const leaderboardList = document.getElementById("leaderboardList");
    const playerSearchInput = document.getElementById("playerSearchInput");
    const playerSelect = document.getElementById("playerSelect");
    playerSelect.addEventListener("touchmove", event => event.stopPropagation(), { passive: true });
    const resetSelectedPlayerBtn = document.getElementById("resetSelectedPlayerBtn");
    const removeSelectedPlayerBtn = document.getElementById("removeSelectedPlayerBtn");
    const newPlayerName = document.getElementById("newPlayerName");
    const addPlayerBtn = document.getElementById("addPlayerBtn");
    const startGameBtn = document.getElementById("startGameBtn");
    const selectedPlayerText = document.getElementById("selectedPlayerText");
    const difficultySelect = document.getElementById("difficultySelect");

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const lcdMessage = document.getElementById("lcdMessage");
    const scoreEl = document.getElementById("score");
    const bestScoreEl = document.getElementById("bestScore");

    const gameOverBox = document.getElementById("gameOverBox");
    const gameOverTitle = document.getElementById("gameOverTitle");
    const gameOverScore = document.getElementById("gameOverScore");
    const cardDetailBox = document.getElementById("cardDetailBox");
    const cardDetailTitle = document.getElementById("cardDetailTitle");
    const cardDetailMeta = document.getElementById("cardDetailMeta");
    const cardDetailRules = document.getElementById("cardDetailRules");
    const cardDetailPlayBtn = document.getElementById("cardDetailPlayBtn");
    const cardDetailCloseBtn = document.getElementById("cardDetailCloseBtn");
    const playAgainBtn = document.getElementById("playAgainBtn");
    const backToMenuBtn = document.getElementById("backToMenuBtn");

    const leftJoystickPad = document.getElementById("leftJoystickPad");
    const rightJoystickPad = document.getElementById("rightJoystickPad");
    const leftJoystickKnob = document.getElementById("leftJoystickKnob");
    const rightJoystickKnob = document.getElementById("rightJoystickKnob");

    const shellMenu = document.getElementById("shellMenu");
    const shellMenuTabsEl = document.getElementById("shellMenuTabs");
    const shellMenuBody = document.getElementById("shellMenuBody");
    const shellMenuCloseBtn = document.getElementById("shellMenuCloseBtn");

    const buttonA = document.getElementById("buttonA");
    const buttonB = document.getElementById("buttonB");
    const buttonX = document.getElementById("buttonX");
    const selectButton = document.getElementById("selectButton");
    const startButton = document.getElementById("startButton");

    if (buttonA) buttonA.textContent = "PLAY";
    if (buttonB) buttonB.textContent = "BACK";
    if (buttonX) buttonX.textContent = "ZONE";
    if (selectButton) selectButton.textContent = "CARD";
    if (startButton) startButton.textContent = "MENU";

    let appScale = 1;
    let players = {};
    let selectedPlayer = null;
    let score = 0;
    let running = false;
    let loopId = null;
    let audioCtx = null;
    let shellMenuWasRunning = false;

    const sticks = {
      left: {
        active: false,
        pointerId: null,
        x: 0,
        y: 0,
        maxDistance: 34,
        pad: leftJoystickPad,
        knob: leftJoystickKnob
      },
      right: {
        active: false,
        pointerId: null,
        x: 0,
        y: 0,
        maxDistance: 34,
        pad: rightJoystickPad,
        knob: rightJoystickKnob
      }
    };


    /*
      EXPANDABLE SHELL MENU
      Add game-specific tabs with:
      MobileArcadeShell.registerMenuTab("map", "Map", "<h3>Map</h3><p>Map content...</p>");
      Update default tabs with:
      MobileArcadeShell.updateMenuTab("instructions", "<h3>How to Play</h3><p>New instructions...</p>");
    */
    const shellMenuTabs = [
      {
        id: "controls",
        label: "Controls",
        html: `
          <h3>Controls</h3>
          <ul>
            <li><strong>D-pad / left joystick:</strong> Move the highlight.</li>
            <li><strong>PLAY:</strong> Choose the highlighted card or button.</li>
            <li><strong>BACK:</strong> Close, cancel, or end your turn.</li>
            <li><strong>ZONE:</strong> Jump to another group of choices.</li>
            <li><strong>CARD:</strong> Read the highlighted card.</li>
            <li><strong>MENU:</strong> Open help and exit options.</li>
          </ul>
        `
      },
      {
        id: "instructions",
        label: "How to Play",
        html: `
          <h3>How to Play</h3>
          <p>Pick a composer, play cards, and try to reduce the opposing composer to 0 HP.</p>
          <p>Play Staff cards to build energy, Piece cards to attack, and Item cards for special effects.</p>
        `
      },
      {
        id: "quit",
        label: "Quit",
        html: `
          <h3>Pause</h3>
          <p>Leave the current battle or go back to the player menu.</p>
          <button class="shellActionBtn" type="button" data-shell-action="characters">Choose Composer</button>
          <button class="shellActionBtn" type="button" data-shell-action="players">Player Menu</button>
        `
      }
    ];

    let activeShellMenuTab = "controls";

    function preventBrowserHoldGesture(event) {
      const tagName = event.target?.tagName;
      if (tagName === "INPUT" || tagName === "TEXTAREA") return;
      event.preventDefault();
    }

    appStage.addEventListener("contextmenu", preventBrowserHoldGesture);
    appStage.addEventListener("selectstart", preventBrowserHoldGesture);
    appStage.addEventListener("dragstart", preventBrowserHoldGesture);

    function renderShellMenuTabs(activeId = activeShellMenuTab) {
      const fallbackTab = shellMenuTabs[0]?.id || "";
      activeShellMenuTab = shellMenuTabs.some(tab => tab.id === activeId) ? activeId : fallbackTab;

      shellMenuTabsEl.innerHTML = "";
      shellMenuBody.innerHTML = "";

      shellMenuTabs.forEach(tab => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "shellMenuTab" + (tab.id === activeShellMenuTab ? " active" : "");
        btn.textContent = tab.label;
        btn.setAttribute("role", "tab");
        btn.setAttribute("aria-selected", tab.id === activeShellMenuTab ? "true" : "false");
        btn.addEventListener("click", () => renderShellMenuTabs(tab.id));
        shellMenuTabsEl.appendChild(btn);
      });

      const activeTab = shellMenuTabs.find(tab => tab.id === activeShellMenuTab);
      if (activeTab) shellMenuBody.innerHTML = activeTab.html;
    }

    function registerShellMenuTab(id, label, htmlContent) {
      const tabId = String(id || "").trim();
      if (!tabId) return;

      const existing = shellMenuTabs.find(tab => tab.id === tabId);
      const tabData = {
        id: tabId,
        label: String(label || tabId),
        html: String(htmlContent || "")
      };

      if (existing) {
        existing.label = tabData.label;
        existing.html = tabData.html;
      } else {
        shellMenuTabs.push(tabData);
      }

      renderShellMenuTabs(activeShellMenuTab);
    }

    function updateShellMenuTab(id, htmlContent) {
      const existing = shellMenuTabs.find(tab => tab.id === id);
      if (!existing) return;
      existing.html = String(htmlContent || "");
      renderShellMenuTabs(activeShellMenuTab);
    }

    function openShellMenu(tabId = "controls") {
      shellMenuWasRunning = running;

      if (running) {
        running = false;
        if (loopId) {
          cancelAnimationFrame(loopId);
          loopId = null;
        }
      }

      renderShellMenuTabs(tabId);
      shellMenu.classList.add("open");
      shellMenu.setAttribute("aria-hidden", "false");
    }

    function closeShellMenu(options = {}) {
      const shouldResume = options.resume !== false;
      shellMenu.classList.remove("open");
      shellMenu.setAttribute("aria-hidden", "true");

      if (
        shouldResume &&
        shellMenuWasRunning &&
        gameScreen.style.display === "block" &&
        gameOverBox.style.display !== "block"
      ) {
        running = true;
        loop();
      }

      shellMenuWasRunning = false;
    }

    shellMenuCloseBtn.addEventListener("click", () => closeShellMenu());

    shellMenu.addEventListener("click", event => {
      if (event.target === shellMenu) closeShellMenu();
    });

    shellMenuBody.addEventListener("click", event => {
      const actionButton = event.target.closest("[data-shell-action]");
      if (!actionButton) return;
      const action = actionButton.dataset.shellAction;
      if (action === "characters") returnToCharacterSelect();
      if (action === "players") returnToPlayerMenu();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && shellMenu.classList.contains("open")) {
        event.preventDefault();
        closeShellMenu();
      }
    });

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function scaleAppToFrame() {
      const frameWidth = appFrame.clientWidth;
      appScale = frameWidth / DESIGN_WIDTH;
      document.documentElement.style.setProperty("--app-scale", appScale);
    }

    function setMessage(text) {
      lcdMessage.textContent = text;
    }

  function setScore(newScore) {
    score = Math.max(0, Math.floor(newScore));
    updateStreakDisplays();
  }

    function addScore(amount) {
      setScore(score + amount);
    }

    function applyLoadedPlayers(loadedPlayers) {
      players = loadedPlayers && typeof loadedPlayers === "object" ? loadedPlayers : {};

      if (selectedPlayer && !players[selectedPlayer]) {
        selectedPlayer = null;
      }

      renderPlayers();
      renderLeaderboard();
      updateStreakDisplays();
    }

    function readLocalPlayersFallback() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch (err) {
        return {};
      }
    }

    function requestPlayersFromWixStorage() {
      try {
        window.parent.postMessage({
          source: MESSAGE_FROM_GAME,
          type: "ARCADE_STORAGE_LOAD",
          storageKey: STORAGE_KEY
        }, "*");
      } catch (err) {}
    }

    function savePlayersToWixStorage() {
      try {
        window.parent.postMessage({
          source: MESSAGE_FROM_GAME,
          type: "ARCADE_STORAGE_SAVE",
          storageKey: STORAGE_KEY,
          payload: players
        }, "*");
      } catch (err) {}
    }

    window.addEventListener("message", event => {
      const data = event.data;

      if (!data || typeof data !== "object") {
        return;
      }

      if (data.source !== MESSAGE_FROM_WIX) {
        return;
      }

      if (String(data.storageKey || "") !== STORAGE_KEY) {
        return;
      }

      if (data.type === "ARCADE_STORAGE_DATA") {
        applyLoadedPlayers(data.payload || {});
      }
    });

    function loadPlayers() {
      // Immediate fallback for desktop preview/testing.
      applyLoadedPlayers(readLocalPlayersFallback());

      // Real mobile Wix storage load.
      requestPlayersFromWixStorage();
    }

    function savePlayers() {
      // Local fallback for desktop preview/testing.
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(players));
      } catch (err) {}

      // Real mobile Wix storage save.
      savePlayersToWixStorage();
    }

  function winText(count) {
    const wins = Math.max(0, Number(count || 0));
    return `${wins} win${wins === 1 ? "" : "s"} in a row`;
  }

  function normalizePlayerRecord(data = {}) {
    data.currentStreak = Math.max(0, Number(data.currentStreak || data.winStreak || 0));
    data.bestStreak = Math.max(data.currentStreak, Number(data.bestStreak || data.bestWinStreak || 0));
    data.lastEndedStreak = Math.max(0, Number(data.lastEndedStreak || 0));
    return data;
  }

  function getPlayerRecord(name = selectedPlayer) {
    if (!name) return normalizePlayerRecord({});
    players[name] = normalizePlayerRecord(players[name] || {});
    return players[name];
  }

  function isGuestPlayerName(name) {
    return String(name || "").trim().toLowerCase() === "guest";
  }

  function shouldShowFirstTimeHelp() {
    if (!selectedPlayer || isGuestPlayerName(selectedPlayer)) return true;
    const data = getPlayerRecord(selectedPlayer);
    return data.helpSeenVersion !== FIRST_TIME_HELP_VERSION;
  }

  function markFirstTimeHelpSeen() {
    if (!selectedPlayer || isGuestPlayerName(selectedPlayer)) return;
    const data = getPlayerRecord(selectedPlayer);
    data.helpSeenVersion = FIRST_TIME_HELP_VERSION;
    savePlayers();
  }

  function maybeOpenFirstTimeHelp() {
    if (!shouldShowFirstTimeHelp()) return;
    markFirstTimeHelpSeen();
    openShellMenu("instructions");
  }

  function updateStreakDisplays() {
    const data = getPlayerRecord(selectedPlayer);
    scoreEl.textContent = data.currentStreak || 0;
    bestScoreEl.textContent = data.bestStreak || 0;
  }

  function renderLeaderboard() {
    leaderboardList.innerHTML = "";
    Object.keys(players).forEach(name => normalizePlayerRecord(players[name]));
    const ranked = Object.entries(players)
      .sort((a, b) => (b[1].currentStreak || 0) - (a[1].currentStreak || 0) || (b[1].bestStreak || 0) - (a[1].bestStreak || 0))
      .slice(0, 5);

    if (ranked.length === 0) {
      leaderboardList.innerHTML = "<li>No streaks yet</li>";
      return;
    }

    ranked.forEach(([name, data]) => {
      const li = document.createElement("li");
      li.textContent = `${name}: ${winText(data.currentStreak || 0)}`;
      leaderboardList.appendChild(li);
    });
  }

    function resetRemoveConfirmButton() {
      removeSelectedPlayerBtn.dataset.confirming = "no";
      removeSelectedPlayerBtn.textContent = "Remove";
      removeSelectedPlayerBtn.style.background = "";
    }

    function updateSelectedPlayerUI() {
      const hasSelection = selectedPlayer && players[selectedPlayer];

      selectedPlayerText.textContent = hasSelection
        ? `Selected: ${selectedPlayer}`
        : "No player selected";

      resetSelectedPlayerBtn.disabled = !hasSelection;
      removeSelectedPlayerBtn.disabled = !hasSelection;
    }

    function renderPlayers() {
      playerSelect.innerHTML = "";

      const filter = playerSearchInput.value.trim().toLowerCase();

      const names = Object.keys(players).sort((a, b) => {
        return a.localeCompare(b, undefined, { sensitivity: "base" });
      });

      const filteredNames = names.filter(name => name.toLowerCase().includes(filter));

      if (filteredNames.length === 0) {
        const emptyRow = document.createElement("div");
        emptyRow.className = "playerOption disabled";
        emptyRow.textContent = names.length === 0 ? "No saved players yet" : "No matching players";
        playerSelect.appendChild(emptyRow);
      } else {
        filteredNames.forEach(name => {
          const row = document.createElement("div");
          row.className = "playerOption" + (name === selectedPlayer ? " selected" : "");
          row.dataset.playerName = name;
          row.setAttribute("role", "option");
          row.setAttribute("aria-selected", name === selectedPlayer ? "true" : "false");
          row.textContent = `${name} — ${winText(getPlayerRecord(name).currentStreak || 0)}`;

          row.addEventListener("click", () => {
            selectedPlayer = name;
            resetRemoveConfirmButton();
            renderPlayers();
          });

          row.addEventListener("touchend", event => {
            event.preventDefault();
            selectedPlayer = name;
            resetRemoveConfirmButton();
            renderPlayers();
          }, { passive: false });

          playerSelect.appendChild(row);
        });
      }

      updateSelectedPlayerUI();
    }

    playerSearchInput.addEventListener("input", () => {
      resetRemoveConfirmButton();
      renderPlayers();
    });

    // Player rows are handled directly inside renderPlayers().

    resetSelectedPlayerBtn.onclick = () => {
      if (!selectedPlayer || !players[selectedPlayer]) return;

      players[selectedPlayer].best = 0;
      players[selectedPlayer].lastScore = 0;
      players[selectedPlayer].currentStreak = 0;
      players[selectedPlayer].bestStreak = 0;
      players[selectedPlayer].lastEndedStreak = 0;

      savePlayers();
      resetRemoveConfirmButton();
      renderPlayers();
      renderLeaderboard();
    };

    removeSelectedPlayerBtn.onclick = () => {
      if (!selectedPlayer || !players[selectedPlayer]) return;

      const nameToRemove = selectedPlayer;

      if (removeSelectedPlayerBtn.dataset.confirming !== "yes") {
        removeSelectedPlayerBtn.dataset.confirming = "yes";
        removeSelectedPlayerBtn.textContent = "Confirm";
        removeSelectedPlayerBtn.style.background = "#ff9f9f";

        setTimeout(() => {
          if (
            removeSelectedPlayerBtn.dataset.confirming === "yes" &&
            selectedPlayer === nameToRemove
          ) {
            resetRemoveConfirmButton();
          }
        }, 2500);

        return;
      }

      delete players[nameToRemove];
      selectedPlayer = null;

      savePlayers();
      resetRemoveConfirmButton();
      renderPlayers();
      renderLeaderboard();
    };

    addPlayerBtn.onclick = () => {
      const name = newPlayerName.value.trim();
      if (!name) return;

      if (!players[name]) {
        players[name] = { best: 0, lastScore: 0, currentStreak: 0, bestStreak: 0, lastEndedStreak: 0 };
        savePlayers();
      }

      selectedPlayer = name;
      newPlayerName.value = "";
      playerSearchInput.value = "";

      resetRemoveConfirmButton();
      renderPlayers();
      renderLeaderboard();
      soundWin();
    };

    newPlayerName.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        addPlayerBtn.click();
      }
    });

    function ensurePlayablePlayer() {

    function joystickPointFromEvent(event, stick) {
      const rect = stick.pad.getBoundingClientRect();

      return {
        x: (event.clientX - rect.left) / appScale,
        y: (event.clientY - rect.top) / appScale
      };
    }

    function setJoystickFromEvent(event, stick) {
      const point = joystickPointFromEvent(event, stick);

      const centerX = stick.pad.offsetWidth / 2;
      const centerY = stick.pad.offsetHeight / 2;

      const limitedX = clamp(point.x, centerX - stick.maxDistance, centerX + stick.maxDistance);
      const limitedY = clamp(point.y, centerY - stick.maxDistance, centerY + stick.maxDistance);

      const dx = limitedX - centerX;
      const dy = limitedY - centerY;

      stick.x = dx / stick.maxDistance;
      stick.y = dy / stick.maxDistance;

      stick.knob.style.left = `${centerX + dx}px`;
      stick.knob.style.top = `${centerY + dy}px`;
    }

    function resetJoystick(stick) {
      stick.active = false;
      stick.pointerId = null;
      stick.x = 0;
      stick.y = 0;

      stick.knob.style.left = `${stick.pad.offsetWidth / 2}px`;
      stick.knob.style.top = `${stick.pad.offsetHeight / 2}px`;
    }

    function bindJoystick(stick) {
      stick.pad.addEventListener("pointerdown", event => {
        event.preventDefault();

        stick.active = true;
        stick.pointerId = event.pointerId;

        stick.pad.setPointerCapture(event.pointerId);
        setJoystickFromEvent(event, stick);
        if (stick === sticks.left) maybeSendLeftJoystickInput(stick, true);
      });

      stick.pad.addEventListener("pointermove", event => {
        if (!stick.active || event.pointerId !== stick.pointerId) return;

        event.preventDefault();
        setJoystickFromEvent(event, stick);
        if (stick === sticks.left) maybeSendLeftJoystickInput(stick);
      });

      stick.pad.addEventListener("pointerup", event => {
        if (event.pointerId !== stick.pointerId) return;

        event.preventDefault();

        if (stick.pad.hasPointerCapture(event.pointerId)) {
          stick.pad.releasePointerCapture(event.pointerId);
        }

        resetJoystick(stick);
      });

      stick.pad.addEventListener("pointercancel", () => resetJoystick(stick));
    }

    bindJoystick(sticks.left);
    bindJoystick(sticks.right);

    function pressButton(button) {

    function bindButton(button) {

    canvas.addEventListener("pointerdown", event => {
      if (!running || shellMenu.classList.contains("open")) return;
      event.preventDefault();
      const rect = canvas.getBoundingClientRect();
      gamePointer({
        x: (event.clientX - rect.left) * (canvas.width / rect.width),
        y: (event.clientY - rect.top) * (canvas.height / rect.height),
        originalEvent: event
      });
    });

    let leftStickLastInput = 0;
    let leftStickLastDirection = "";
    function joystickDirection(stick) {
      const ax = Math.abs(stick.x);
      const ay = Math.abs(stick.y);
      if (Math.max(ax, ay) < 0.48) return "";
      return ax > ay ? (stick.x < 0 ? "left" : "right") : (stick.y < 0 ? "up" : "down");
    }

    function maybeSendLeftJoystickInput(stick, force = false) {
      const direction = joystickDirection(stick);
      if (!direction) {
        leftStickLastDirection = "";
        return;
      }
      const now = performance.now();
      if (force || direction !== leftStickLastDirection || now - leftStickLastInput > 220) {
        leftStickLastDirection = direction;
        leftStickLastInput = now;
        handleInput(direction);
      }
    }

  function endGame(reason = "Defeat!") {
    if (!running) return;
    stopGame();
    const won = /victory|win/i.test(reason);
    if (won) soundWin(); else soundLose();

    const data = getPlayerRecord(selectedPlayer);
    data.lastScore = score;
    data.lastBattleWon = won;
    if (won) {
      data.currentStreak = Math.max(0, Number(data.currentStreak || 0)) + 1;
      data.bestStreak = Math.max(Number(data.bestStreak || 0), data.currentStreak);
    } else {
      data.lastEndedStreak = Math.max(0, Number(data.currentStreak || 0));
      data.currentStreak = 0;
    }
    data.best = data.bestStreak;

    savePlayers();
    renderPlayers();
    renderLeaderboard();
    updateStreakDisplays();
    if (gameOverTitle) gameOverTitle.textContent = won ? "Victory!" : "Defeat!";
    gameOverScore.innerHTML = finalScoreHtml(reason);
    gameOverBox.style.display = "block";
  }

    function handleInput(action) {
      if (action === "start") {
        openShellMenu("quit");
        return;
      }

      if (shellMenu.classList.contains("open")) return;
      if (!running) return;

      gameInput(action);
    }

    function getAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        audioCtx = new AudioContextClass();
      }

      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }

      return audioCtx;
    }

    function beep(freq, duration, type = "sine", volume = 0.08) {
      const ac = getAudio();
      if (!ac) return;

      const osc = ac.createOscillator();
      const gain = ac.createGain();

      osc.type = type;
      osc.frequency.value = freq;

      gain.gain.setValueAtTime(volume, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);

      osc.connect(gain);
      gain.connect(ac.destination);

      osc.start();
      osc.stop(ac.currentTime + duration);
    }

    function soundCorrect() {
      beep(660, 0.08, "square", 0.06);
      setTimeout(() => beep(880, 0.08, "square", 0.05), 70);
    }

    function soundWin() {
      [523, 659, 784, 1046].forEach((n, i) => {
        setTimeout(() => beep(n, 0.12, "triangle", 0.06), i * 90);
      });
    }

    function soundLose() {
      [300, 220, 160, 100].forEach((n, i) => {
        setTimeout(() => beep(n, 0.16, "sawtooth", 0.05), i * 120);
      });
    }

    if (name.includes("mozart")) return { ...base, hair: "#f4efe4", coat: "#b91c1c", accent: "#f7d58d", wig: true, bow: true };

    if (name.includes("schubert")) return { ...base, hair: "#5b3b2f", coat: "#6b4f3a", glasses: true };
    if (name.includes("chopin")) return { ...base, hair: "#3f2c24", coat: "#14532d" };
    if (name.includes("robert schumann")) return { ...base, hair: "#4a3427", coat: "#365314", longHair: true };
    if (name.includes("clara schumann")) return { ...base, hair: "#2f241d", coat: "#7f1d1d", longHair: true, dress: true };
    if (name.includes("liszt")) return { ...base, hair: "#332722", coat: "#111827", longHair: true };
    if (name.includes("brahms")) return { ...base, hair: "#d6d0c7", coat: "#374151", beard: true };
    if (name.includes("debussy")) return { ...base, hair: "#544139", coat: "#1d4ed8", beard: true };
    if (name.includes("ravel")) return { ...base, hair: "#2f2723", coat: "#0f766e", mustache: true };
    if (name.includes("joplin")) return { ...base, skin: "#6b3f2c", hair: "#141414", coat: "#7c2d12", mustache: true };
    if (name.includes("florence price")) return { ...base, skin: "#7a4a33", hair: "#1f1b1b", coat: "#6d28d9", longHair: true, dress: true };
    if (name.includes("amy beach")) return { ...base, hair: "#6b3f2f", coat: "#1d4ed8", longHair: true, dress: true };

  function drawComposerFigure(composer, side) {
    const spec = composerFigureSpec(composer);
    const anchor = composerAnchor(side);
    const dir = side === "player" ? 1 : -1;
    const scale = IS_MOBILE_CANVAS ? 1 : 1.75;
    const px = value => Math.round(value * scale);
    const x = anchor.x;
    const y = anchor.y;

    ctx.save();
    ctx.imageSmoothingEnabled = false;

    ctx.fillStyle = "rgba(0,0,0,0.28)";
    ctx.fillRect(x - px(18), y + px(2), px(38), px(7));

    drawPixelPanel(x - px(10), y - px(56), px(20), px(18), spec.skin, "#111827", 2);

    ctx.fillStyle = spec.hair;
    if (spec.wig) {
      ctx.fillRect(x - px(13), y - px(58), px(26), px(8));
      ctx.fillRect(x - px(15), y - px(52), px(5), px(12));
      ctx.fillRect(x + px(10), y - px(52), px(5), px(12));
    } else {
      ctx.fillRect(x - px(12), y - px(60), px(24), px(10));
      if (spec.longHair) {
        ctx.fillRect(x - px(14), y - px(50), px(6), px(18));
        ctx.fillRect(x + px(8), y - px(50), px(6), px(18));
      }
    }
    if (spec.mustache) ctx.fillRect(x - px(5), y - px(44), px(10), px(2));
    if (spec.beard) ctx.fillRect(x - px(8), y - px(40), px(16), px(8));
    if (spec.glasses) {
      ctx.fillRect(x - px(8), y - px(48), px(6), px(3));
      ctx.fillRect(x + px(2), y - px(48), px(6), px(3));
    }

    drawPixelPanel(x - px(14), y - px(30), px(28), px(spec.dress ? 30 : 24), spec.coat, "#111827", 2);
    ctx.fillStyle = spec.accent;
    ctx.fillRect(x - px(2), y - px(28), px(4), px(20));
    if (spec.bow) ctx.fillRect(x - px(6), y - px(28), px(12), px(3));

    ctx.fillStyle = spec.skin;
    ctx.fillRect(x - px(18), y - px(26), px(4), px(16));
    ctx.fillRect(x + px(14), y - px(26), px(4), px(16));
    ctx.fillRect(x - px(9), y - px(6), px(4), px(10));
    ctx.fillRect(x + px(5), y - px(6), px(4), px(10));

    const handX = x + dir * px(18);
    const handY = y - px(18);
    ctx.strokeStyle = "#f8fafc";
    ctx.lineWidth = IS_MOBILE_CANVAS ? 2 : 4;
    ctx.beginPath();
    ctx.moveTo(handX, handY);
    ctx.lineTo(handX + dir * px(18), handY - px(8));
    ctx.stroke();
    ctx.fillStyle = spec.accent;
    ctx.fillRect(handX + dir * px(18) - px(2), handY - px(10), px(4), px(4));

  function drawStageBackdrop() {
    const w = canvas.width;
    const h = canvas.height;

    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, "#101827");
    sky.addColorStop(0.55, "#172554");
    sky.addColorStop(1, "#0f172a");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, h);

    ctx.save();
    ctx.globalAlpha = 0.20;
    ctx.fillStyle = "#f8fafc";
    const beamW = IS_MOBILE_CANVAS ? 72 : 140;
    for (let i = 0; i < 4; i++) {
      const x = (w / 4) * i + (IS_MOBILE_CANVAS ? 12 : 34);
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x + beamW, h);
      ctx.lineTo(x - beamW * 0.25, h);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    const floorY = IS_MOBILE_CANVAS ? 129 : 340;
    ctx.fillStyle = "rgba(15, 23, 42, 0.84)";
    ctx.fillRect(0, floorY, w, h - floorY);

    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.strokeStyle = "#e2e8f0";
    ctx.lineWidth = 1;
    const step = IS_MOBILE_CANVAS ? 26 : 42;
    for (let x = -w; x < w * 2; x += step) {
      ctx.beginPath();
      ctx.moveTo(x, floorY);
      ctx.lineTo(x + w * 0.18, h);
      ctx.stroke();
    }
    for (let y = floorY + step; y < h; y += step) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawBattleEffects() {
    if (!visualEffects.length) return;
    const now = performance.now();
    visualEffects = visualEffects.filter(effect => now - effect.start < effect.duration);

    visualEffects.forEach(effect => {
      const t = clampValue((now - effect.start) / effect.duration, 0, 1);
      const alpha = Math.max(0, 1 - t);
      const from = composerAnchor(effect.side);
      const to = composerAnchor(effect.side === "player" ? "cpu" : "player");

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.textAlign = "center";

      if (effect.kind === "attack") {
        for (let i = 0; i < 6; i++) {
          const tt = clampValue(t * 1.25 - i * 0.08, 0, 1);
          const sx = from.x + (to.x - from.x) * tt;
          const sy = (from.y - (IS_MOBILE_CANVAS ? 32 : 74)) + (to.y - from.y) * tt + Math.sin(tt * Math.PI * 2 + i) * (IS_MOBILE_CANVAS ? 7 : 12);
          ctx.fillStyle = "#fff7d6";
          ctx.font = IS_MOBILE_CANVAS ? "bold 15px Arial, sans-serif" : "bold 28px Arial, sans-serif";
          ctx.fillText(effect.label || "♪", sx, sy);
        }
        ctx.fillStyle = "#fee2e2";
        ctx.font = IS_MOBILE_CANVAS ? "bold 15px Arial, sans-serif" : "bold 28px Arial, sans-serif";
        ctx.fillText(`-${effect.amount}`, to.x, to.y - (IS_MOBILE_CANVAS ? 54 : 104) - t * (IS_MOBILE_CANVAS ? 8 : 18));
      } else if (effect.kind === "boost") {
        for (let i = 0; i < 4; i++) {
          const ang = t * Math.PI * 2 + i * (Math.PI / 2);
          const radius = (IS_MOBILE_CANVAS ? 12 : 24) + t * (IS_MOBILE_CANVAS ? 5 : 10);
          const sx = from.x + Math.cos(ang) * radius;
          const sy = from.y - (IS_MOBILE_CANVAS ? 38 : 72) + Math.sin(ang) * radius;
          ctx.fillStyle = "#dbeafe";
          ctx.font = IS_MOBILE_CANVAS ? "bold 12px Arial, sans-serif" : "bold 22px Arial, sans-serif";
          ctx.fillText("♫", sx, sy);
        }
      } else if (effect.kind === "shield") {
        ctx.strokeStyle = "#93c5fd";
        ctx.lineWidth = IS_MOBILE_CANVAS ? 2 : 4;
        for (let ring = 0; ring < 2; ring++) {
          ctx.beginPath();
          ctx.arc(from.x, from.y - (IS_MOBILE_CANVAS ? 34 : 72), (IS_MOBILE_CANVAS ? 14 : 28) + ring * (IS_MOBILE_CANVAS ? 7 : 12) + t * (IS_MOBILE_CANVAS ? 3 : 6), 0, Math.PI * 2);
          ctx.stroke();
        }
      } else if (effect.kind === "heal") {
        ctx.fillStyle = "#bbf7d0";
        for (let i = 0; i < 5; i++) {
          const sx = from.x + Math.cos(i * 1.3 + t * 4) * (IS_MOBILE_CANVAS ? 18 : 30);
          const sy = from.y - (IS_MOBILE_CANVAS ? 34 : 70) + Math.sin(i * 1.4 + t * 4) * (IS_MOBILE_CANVAS ? 10 : 18);
          ctx.fillRect(sx - 2, sy - 6, 4, 12);
          ctx.fillRect(sx - 6, sy - 2, 12, 4);
        }
      } else if (effect.kind === "draw" || effect.kind === "energy") {
        ctx.strokeStyle = effect.kind === "energy" ? "#67e8f9" : "#fef3c7";
        ctx.lineWidth = IS_MOBILE_CANVAS ? 2 : 3;
        ctx.beginPath();
        ctx.arc(from.x, from.y - (IS_MOBILE_CANVAS ? 34 : 70), (IS_MOBILE_CANVAS ? 16 : 28) + t * (IS_MOBILE_CANVAS ? 10 : 16), 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();
    });
  }

  function drawBattleStatusBadges(side, leftX, topY) {
    const labels = [];
    if (side.nextAttackBonus > 0) labels.push(`NEXT +${side.nextAttackBonus}`);

      ctx.fillStyle = "#111827";
      ctx.textAlign = "center";
      ctx.font = cardFont(IS_MOBILE_CANVAS ? 6.2 : 10, "bold");
      ctx.fillText(label, x + w / 2, y + h / 2 + (IS_MOBILE_CANVAS ? 2 : 4));
    });
  }

function drawComposerGrid() {
      lastHitboxes = [];
      ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = composer.color;

        ctx.fillStyle = "#111827";

        ctx.fillStyle = "#475569";

        ctx.fillText(composer.style, IS_MOBILE_CANVAS ? x + 22 : x + cardW / 2, IS_MOBILE_CANVAS ? y + 25 : y + 68);

        lastHitboxes.push({ type: "composer", index: i, x, y, w: cardW, h: cardH });
      });
    // Composer cards now speak for themselves; no extra instruction/details line at the bottom.
    }

    function drawHealthBar(x, y, w, h, hp, label, color) {
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w * clampValue(hp / STARTING_HP, 0, 1), h);
      ctx.strokeStyle = "#f8fbff";
      ctx.lineWidth = 1;
      ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = "#f8fbff";
      ctx.textAlign = "left";
      ctx.font = IS_MOBILE_CANVAS ? "bold 9px Arial, sans-serif" : "bold 15px Arial, sans-serif";
      ctx.fillText(`${label} HP ${Math.max(0, hp)}`, x, y - (IS_MOBILE_CANVAS ? 3 : 6));
    }  
function cardFont(size, weight = "bold") {
    return `${weight} ${Math.max(5, size).toFixed(1)}px "Courier New", monospace`;
  }

  function fitCardText(text, maxWidth, startSize, minSize = 5, weight = "bold") {
    const value = String(text || "").toUpperCase();
    let size = startSize;
    while (size > minSize) {
      ctx.font = cardFont(size, weight);
      if (ctx.measureText(value).width <= maxWidth) break;
      size -= 0.5;
    }
    ctx.font = cardFont(size, weight);
    return value;
  }

  function drawPixelPanel(x, y, w, h, fill, stroke = "#111827", lineWidth = 2) {
    ctx.fillStyle = fill;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
    if (stroke) {
      ctx.strokeStyle = stroke;
      ctx.lineWidth = lineWidth;
      ctx.strokeRect(Math.round(x) + 0.5, Math.round(y) + 0.5, Math.round(w) - 1, Math.round(h) - 1);
    }
  }

  function cardTypePalette(card, owner = "player") {
    if (!card) return { bg: "#f8fafc", light: "#ffffff", mid: "#cbd5e1", dark: "#111827", shadow: "#64748b" };
    if (card.type === "energy") {
      return { bg: "#c8f7c5", light: "#ecffea", mid: "#7bd878", dark: "#1f6f3a", shadow: "#4ca35b" };
    }
    if (card.type === "item") {
      return { bg: "#c7ddff", light: "#edf5ff", mid: "#80aef2", dark: "#1e3f75", shadow: "#5f87c9" };
    }
    return { bg: "#ffc9c9", light: "#fff1f1", mid: "#f28b8b", dark: "#7f1d1d", shadow: "#c76565" };
  }

  function cardInfoText(card) {
    if (!card) return lastLog || "";
    if (card.type === "energy") return "+1 STAFF FOR FUTURE TURNS";
    if (card.type === "item") return (card.text || "ITEM EFFECT").toUpperCase();
    return `ATK ${card.atk} • DIRECT ATTACK`;
  }

function cardCostLabel(card) {
    if (!card) return "";
    if (card.type === "energy") return "+1";
    if (typeof card.cost === "number") return String(card.cost);
    return "";
  }

  function wrapCardTitleLines(text, maxWidth, maxLines = 3, truncate = false) {
    const words = String(text || "").toUpperCase().split(/\s+/).filter(Boolean);
    const lines = [];
    let current = "";

    words.forEach(word => {
      const test = current ? `${current} ${word}` : word;
      if (!current || ctx.measureText(test).width <= maxWidth) {
        current = test;
      } else {
        lines.push(current);
        current = word;
      }
    });

    if (current) lines.push(current);
    if (!lines.length) lines.push("");

    let output = lines;
    if (truncate && output.length > maxLines) {
      output = output.slice(0, maxLines);
      output[output.length - 1] = `${output[output.length - 1]}…`;
    }

    if (truncate) {
      output = output.map((line, i) => {
        let value = line;
        const needsEllipsis = i === output.length - 1 && (lines.length > maxLines || ctx.measureText(value).width > maxWidth);
        const suffix = needsEllipsis && !value.endsWith("…") ? "…" : "";
        if (suffix) value += suffix;
        while (value.length > 1 && ctx.measureText(value).width > maxWidth) {
          value = value.replace(/…$/, "").slice(0, -1) + "…";
        }
        return value;
      });
    }

    return output;
  }

  function fitWrappedCardTitle(text, maxWidth, maxLines, startSize, minSize) {
    const value = String(text || "").toUpperCase();
    for (let size = startSize; size >= minSize; size -= 0.5) {
      ctx.font = cardFont(size, "bold");
      const lines = wrapCardTitleLines(value, maxWidth, maxLines, false);
      const fits = lines.length <= maxLines && lines.every(line => ctx.measureText(line).width <= maxWidth);
      if (fits) return { size, lines };
    }

    ctx.font = cardFont(minSize, "bold");
    return { size: minSize, lines: wrapCardTitleLines(value, maxWidth, maxLines, true) };
  }

  function drawCardFace(card, x, y, w, h, selected = false, owner = "player") {
    const palette = cardTypePalette(card, owner);
    const tiny = w < 34 || h < 42;
    const snapX = Math.round(x);
    const snapY = Math.round(y);
    const snapW = Math.round(w);
    const snapH = Math.round(h);
    const outer = selected ? "#ffe08a" : "#111827";
    const scale = clampValue(Math.min(w / (IS_MOBILE_CANVAS ? 56 : 88), h / (IS_MOBILE_CANVAS ? 58 : 108)), 0.52, 1.22);
    const pad = Math.max(3, Math.round((IS_MOBILE_CANVAS ? 4 : 5) * scale));

    ctx.save();
    ctx.imageSmoothingEnabled = false;

    if (selected) {
      ctx.save();
      ctx.globalAlpha = 0.46 + Math.sin(cursorPulse * 2) * 0.10;
      ctx.fillStyle = "#ffe08a";
      ctx.fillRect(snapX - 5, snapY - 5, snapW + 10, snapH + 10);
      ctx.restore();
    }

    ctx.fillStyle = "rgba(0,0,0,0.42)";
    ctx.fillRect(snapX + 3, snapY + 3, snapW, snapH);
    drawPixelPanel(snapX, snapY, snapW, snapH, palette.bg, outer, selected ? 4 : 3);

    if (snapW > 30 && snapH > 42) {
      ctx.save();
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = palette.light;
      ctx.fillRect(snapX + pad, snapY + pad, Math.max(1, snapW - pad * 2), Math.max(1, Math.round(4 * scale)));
      ctx.restore();
    }

    const cost = cardCostLabel(card);
    let mobileTitleTopReserve = 0;
    if (cost && snapW > 27 && snapH > 35) {
      const badge = clampValue(Math.round((IS_MOBILE_CANVAS ? 18 : 20) * scale), IS_MOBILE_CANVAS ? 15 : 14, IS_MOBILE_CANVAS ? 23 : 24);
      const bx = snapX + snapW - badge - Math.max(2, pad - 1);
      const by = snapY + Math.max(2, pad - 1);
      drawPixelPanel(bx, by, badge, badge, "#fff7d6", "#111827", 2);
      ctx.fillStyle = "#111827";
      ctx.textAlign = "center";
      ctx.font = cardFont(IS_MOBILE_CANVAS ? badge * 0.62 : badge * 0.54, "bold");
      ctx.fillText(cost, bx + badge / 2, by + badge * (IS_MOBILE_CANVAS ? 0.72 : 0.70));
      if (IS_MOBILE_CANVAS) mobileTitleTopReserve = Math.min(snapH - 18, (by + badge - snapY) + 3);
    }

    const mobileAvoidCost = IS_MOBILE_CANVAS && cost && snapW <= 86 && snapH <= 72;
    const titleMaxW = Math.max(12, snapW - pad * (mobileAvoidCost ? 2.2 : 3.2));
    let titleMaxLines = tiny ? 2 : (snapH > 92 ? 4 : 3);
    const startSize = (IS_MOBILE_CANVAS ? 12.6 : 19.4) * scale;
    const minSize = tiny ? 5.8 : (IS_MOBILE_CANVAS ? 7.0 : 10.4);
    if (mobileAvoidCost) {
      const availableH = Math.max(10, snapH - mobileTitleTopReserve - Math.max(3, pad));
      titleMaxLines = clampValue(Math.floor(availableH / Math.max(5, startSize * 0.98)), 1, titleMaxLines);
    }
    const fitted = fitWrappedCardTitle(card?.name || "", titleMaxW, titleMaxLines, startSize, minSize);
    ctx.font = cardFont(fitted.size, "bold");
    ctx.textAlign = "center";
    ctx.fillStyle = "#111827";
    const lineH = fitted.size * 1.04;
    const blockH = fitted.lines.length * lineH;
    const titleTop = mobileAvoidCost ? snapY + mobileTitleTopReserve : snapY;
    const titleBottom = snapY + snapH - Math.max(3, pad);
    const availableTitleH = Math.max(8, titleBottom - titleTop);
    let textY = mobileAvoidCost
      ? titleTop + Math.max(0, (availableTitleH - blockH) / 2) + fitted.size * 0.82
      : snapY + snapH / 2 - blockH / 2 + fitted.size * 0.82;
    fitted.lines.forEach(line => {
      ctx.fillText(line, snapX + snapW / 2, textY);
      textY += lineH;
    });

    if (card?.ready && card.type === "piece" && snapW > 32 && snapH > 38) {
      const dot = Math.max(6, Math.round(8 * scale));
      drawPixelPanel(snapX + snapW - pad - dot, snapY + snapH - pad - dot, dot, dot, "#22c55e", "#111827", 1);
    }

    ctx.restore();
  }

  function cardWindowStart(items, selected, visible) {
    if (items.length <= visible) return 0;
    return clampValue(selected - Math.floor(visible / 2), 0, items.length - visible);
  }

function hitMatchesSelection(hit) {

  function moveSelectionByDirection(direction) {
    const hits = selectableHitboxes();
    if (!hits.length) return false;

    let current = hits.find(hitMatchesSelection);
    if (!current) {
      selectHitbox(hits[0]);
      return true;
    }

    const cx = current.x + current.w / 2;
    const cy = current.y + current.h / 2;
    const vector = {
      left: [-1, 0],
      right: [1, 0],
      up: [0, -1],
      down: [0, 1]
    }[direction];
    if (!vector) return false;

    let best = null;
    let bestScore = Infinity;

    hits.forEach(hit => {
      if (hit === current) return;
      const hx = hit.x + hit.w / 2;
      const hy = hit.y + hit.h / 2;
      const dx = hx - cx;
      const dy = hy - cy;
      const forward = dx * vector[0] + dy * vector[1];
      if (forward <= 4) return;
      const perpendicular = Math.abs(vector[0] ? dy : dx);
      const distance = Math.hypot(dx, dy);
      const score = forward + perpendicular * 1.35 + distance * 0.05;
      if (score < bestScore) {
        bestScore = score;
        best = hit;
      }
    });

    if (best) return selectHitbox(best);
    return false;
  }

function playCardFor(side, foe, handIndex, isCpu = false) {
    const card = side.hand[handIndex];
    if (!card) return false;

    if (card.type === "energy") {
      if (side.energyPlayed) {
        if (!isCpu) setStatus("A Staff card has already been played this turn.");
        return false;
      }
      side.hand.splice(handIndex, 1);
      side.maxEnergy += 1;
      side.energy = Math.min(side.maxEnergy, side.energy + 1);
      side.energyPlayed = true;
      side.discard.push(card);
      queueBattleEffect("energy", isCpu ? "cpu" : "player", "Staff", 0);
      if (!isCpu) {
        state.cardsPlayed += 1;
        state.energyPlayedCount += 1;
        addScore(10);
        scoreFactor("Staff card played", 10);
        setStatus(`Staves increased to ${side.energy}/${side.maxEnergy}.`);
      }
      return true;
    }

    if (card.cost > side.energy) {
      if (!isCpu) setStatus("Not enough staves.");
      return false;
    }

    if (card.type === "piece") {
      side.energy -= card.cost;
      side.hand.splice(handIndex, 1);

      const bonus = side.nextAttackBonus || 0;
      const rawDamage = Math.max(0, card.atk + bonus);
      const blocked = Math.min(rawDamage, foe.shield || 0);
      const dealt = Math.max(0, rawDamage - blocked);

      side.nextAttackBonus = 0;
      foe.shield = 0;
      foe.hp -= dealt;
      side.discard.push(card);

      queueBattleEffect("attack", isCpu ? "cpu" : "player", card.symbol || "♪", dealt);

      if (!isCpu) {
        state.cardsPlayed += 1;
        state.damageDealt += dealt;
        addScore(20 + dealt * 10);
        scoreFactor("Attack card played", 20);
        if (dealt > 0) scoreFactor("Damage dealt", dealt * 10);
        setStatus(blocked > 0 ? `${card.name}: ${dealt} damage (${blocked} blocked).` : `${card.name}: ${dealt} damage.`);
      }

      checkGameOver();
      return true;
    }

    if (card.type === "item") {
      side.energy -= card.cost;
      side.hand.splice(handIndex, 1);
      applyItem(side, foe, card, isCpu);
      side.discard.push(card);
      if (!isCpu) {
        state.cardsPlayed += 1;
        addScore(20);
        scoreFactor("Item card played", 20);
      }
      return true;
    }

    return false;
  }

  function applyItem(side, foe, card, isCpu = false) {
    let message = `${card.name} resolved.`;

    if (card.effect === "heal") {
      side.hp = Math.min(STARTING_HP, side.hp + (card.amount || 2));
      message = `${card.name}: HP restored.`;

      enforceHandLimitAfterDraw(side, isCpu);
    }

    if (card.effect === "nextAttack") {
      side.nextAttackBonus += card.amount || 1;
      message = `${card.name}: next attack +${card.amount || 1}.`;
      queueBattleEffect("boost", isCpu ? "cpu" : "player", `+${card.amount || 1}`, card.amount || 1);
    }

    if (card.effect === "shield") {

    if (!isCpu && forcedDiscardCount <= 0) setStatus(message);
    checkGameOver();
  }

  function difficultySetting() {
    return DIFFICULTY_SETTINGS[state?.difficulty || getSelectedDifficultyKey()] || DIFFICULTY_SETTINGS.normal;
  }

  function playableCpuCardScore(card, index) {
    const cpu = state.cpu;
    const player = state.player;
    if (!card) return -9999;

    if (card.type === "energy") {
      if (cpu.energyPlayed) return -9999;
      const canSpendCurrentEnergy = cpu.hand.some(other => {
        if (other === card || other.type === "energy") return false;
        return other.cost <= cpu.energy;
      });
      return canSpendCurrentEnergy ? 150 : 210;
    }

    if (card.cost > cpu.energy) return -9999;

    if (card.type === "piece") {
      const predicted = Math.max(0, card.atk + (cpu.nextAttackBonus || 0) - (player.shield || 0));
      let score = 55 + predicted * 16 - card.cost * 3;
      if (predicted >= player.hp) score += 300;
      if (cpu.nextAttackBonus > 0) score += cpu.nextAttackBonus * 12;
      return score;
    }

    if (card.type === "item") {
      let score = 0;

      if (card.effect === "heal") {
        const missing = STARTING_HP - cpu.hp;
        if (missing <= 1) return -9999;
        score = 18 + Math.min(missing, card.amount || 2) * 18;
        if (cpu.hp <= 12) score += 55;
      }

      if (card.effect === "draw") {
        score = cpu.hand.length <= 3 ? 72 : 28;
        score += (card.amount || 1) * 12;
      }

      if (card.effect === "nextAttack") {
        const hasPiece = cpu.hand.some(other => other.type === "piece" && other.cost <= cpu.energy);
        score = (hasPiece ? 62 : 34) + (card.amount || 1) * 16;
      }

      if (card.effect === "shield") {
        score = 16 + (card.amount || 1) * 14;
        if (cpu.hp <= 12) score += 40;
      }

      return score - card.cost * 4;
    }

    return -9999;
  }

  function chooseCpuCard() {
    const cpu = state.cpu;
    const playable = [];
    let bestIndex = -1;
    let bestScore = -9999;

    cpu.hand.forEach((card, i) => {
      const score = playableCpuCardScore(card, i);
      if (score > -9999) playable.push({ index: i, score });
      if (score > bestScore) {
        bestScore = score;
        bestIndex = i;
      }
    });

    const difficulty = difficultySetting();
    if (playable.length && Math.random() < difficulty.randomPlayChance) {
      return playable[Math.floor(Math.random() * playable.length)].index;
    }

    return bestScore > -9999 ? bestIndex : -1;
  }

  function chooseCpuStuckDiscardIndex() {
    const cpu = state?.cpu;
    if (!cpu || cpu.hand.length < HAND_SIZE) return -1;

    let bestIndex = -1;
    let bestScore = -9999;

    cpu.hand.forEach((card, i) => {
      if (!card) return;
      if (playableCpuCardScore(card, i) > -9999) return;

      let score = 0;
      if (card.type === "energy") {
        score = cpu.energyPlayed ? 20 : -9999;
      } else if (typeof card.cost === "number" && card.cost > cpu.energy) {
        score = 40 + card.cost * 8;
      } else if (card.type === "item" && card.effect === "heal" && cpu.hp >= STARTING_HP - 1) {
        score = 36 + (card.cost || 0);
      } else if (card.type === "item") {
        score = 26 + (card.cost || 0);
      }

      if (score > bestScore) {
        bestScore = score;
        bestIndex = i;
      }
    });

    return bestScore > -9999 ? bestIndex : -1;
  }

  function cpuTurn() {
    if (!running || !state || state.battleOver) return;

    cpu.energyPlayed = false;

      const index = chooseCpuCard();
      if (index < 0) {

        if (discardIndex >= 0) {

          discardCardFromHand(cpu, discardIndex, true);
          setStatus(`${composerFirstName("cpu")} discards ${shortText(discarded?.name || "a card", 18)}.`);

      if (checkGameOver()) return;
      setTimeout(runPlays, Math.round(430 * ANIMATION_SLOWDOWN * CPU_ACTION_DELAY_MULTIPLIER));

function calculateFinalScore(won) {
    const rows = scoreFactorRows();
    let trackedBattlePoints = rows.reduce((sum, row) => sum + row.points, 0);
    if (trackedBattlePoints !== score) {
      rows.unshift({ label: "Other battle points", points: score - trackedBattlePoints });
      trackedBattlePoints = score;
    }

    let bonusTotal = 0;

    if (won) {
      rows.push({ label: "Victory bonus", points: 1000 });
      bonusTotal += 1000;

      const hpBonus = Math.max(0, state.player.hp) * 10;
      rows.push({ label: "HP bonus", points: hpBonus });
      bonusTotal += hpBonus;

      const speedBonus = Math.max(0, 16 - state.playerTurns) * 25;
      rows.push({ label: "Speed bonus", points: speedBonus });
      bonusTotal += speedBonus;
    }

    finalScoreDetails = {
      won,
      rows,
      turns: state.playerTurns,
      piecesDefeated: state.defeatedPieces,
      cardsPlayed: state.cardsPlayed,
      damageDealt: state.damageDealt
    };

    return bonusTotal;
  }

function playerAction() {
    if (!state || state.turn !== "player" || state.battleOver) return;

    if (selectedZone === "hand") {

    if (selectedZone === "action") {
      if (selectedIndex === 0) {

        selectedZone = state.player.hand.length ? "hand" : "action";
