function gameInput(action) {
    if (isCardDetailOpen()) {
      if (action === "left" || action === "right" || action === "up" || action === "down") moveCardDetailButton(action);
      if (action === "a") activateSelectedCardDetailButton();
      if (action === "b" || action === "select") closeCardDetail();
      return;
    }

    if (phaseScreen === "composerSelect") {
      if (action === "left" || action === "right" || action === "up" || action === "down") {
        if (!moveSelectionByDirection(action)) {
          if (action === "left") moveComposer(-1, 0);
          if (action === "right") moveComposer(1, 0);
          if (action === "up") moveComposer(0, -1);
          if (action === "down") moveComposer(0, 1);
        }
      }
      if (action === "a") startBattle();
      if (action === "select") setStatus(`${selectedComposerCard.name}: ${selectedComposerCard.style}`);
      return;
    }

    if (!state || state.turn !== "player") return;

    if (action === "left" || action === "right" || action === "up" || action === "down") {
      moveSelectionByDirection(action);
    }

    if (action === "a") {
      if (selectedZone === "hand" || selectedZone === "board" || selectedZone === "cpuBoard") openSelectedDetail();
      else playerAction();
    }

    if (action === "b") {
      if (attackTargetIndex !== null) {
        attackTargetIndex = null;
        selectedZone = "board";
        setStatus("Attack canceled.");
      } else if (forcedDiscardCount > 0) {
        setStatus(`Discard ${forcedDiscardCount} card${forcedDiscardCount === 1 ? "" : "s"} first.`);
      } else if (discardMode) {
        discardMode = false;
        selectedZone = state.player.hand.length ? "hand" : "action";
        selectedIndex = 0;
        normalizeSelection();
        setStatus("Done discarding. Keep playing.");
      } else {
        endPlayerTurn();
      }
    }

    if (action === "x" || action === "y") cycleZone(1);
    if (action === "select") openSelectedDetail();
  }

  function gamePointer(point) {
    if (!running) return;

    for (const hit of lastHitboxes) {
      if (point.x < hit.x || point.x > hit.x + hit.w || point.y < hit.y || point.y > hit.y + hit.h) continue;

      if (phaseScreen === "composerSelect" && hit.type === "composer") {
        composerIndex = hit.index;
        selectedComposerCard = COMPOSERS[composerIndex];
        startBattle();
        return;
      }

      if (phaseScreen === "battle" && state) {
        if (state.turn === "player") {
          if (hit.type === "cpuBoard") {
            selectedZone = "cpuBoard";
            selectedIndex = hit.index;
            openCardDetail("cpuBoard", hit.index);
            return;
          }

          if (hit.type === "hand") {
            selectedZone = "hand";
            selectedIndex = hit.index;
            openCardDetail("hand", hit.index);
            return;
          }
          if (hit.type === "board") {
            selectedZone = "board";
            selectedIndex = hit.index;
            openCardDetail("board", hit.index);
            return;
          }
          if (hit.type === "discardTurn") {
            selectedZone = "action";
            selectedIndex = hit.index || 0;
            discardMode = true;
            selectedZone = state.player.hand.length ? "hand" : "action";
            selectedIndex = 0;
            setStatus("Discard any cards you wish, then choose Done.");
            return;
          }
          if (hit.type === "endTurn") {
            selectedZone = "action";
            selectedIndex = hit.index || 0;
            if (discardMode) {
              discardMode = false;
              selectedZone = state.player.hand.length ? "hand" : "action";
              selectedIndex = 0;
              normalizeSelection();
              setStatus("Done discarding. Keep playing.");
            } else {
              endPlayerTurn();
            }
            return;
          }
        } else if (hit.type === "cpuBoard") {
          openCardDetail("cpuBoard", hit.index);
          return;
        }
      }
    }
  }

  function gameStop() {
      if (typeof sticks !== "undefined") {
        resetJoystick(sticks.left);
        resetJoystick(sticks.right);
      }
    }

    const resizeObserver = new ResizeObserver(() => {
      scaleAppToFrame();
      resetJoystick(sticks.left);
      resetJoystick(sticks.right);
      if (!running) gameDraw();
    });

    resizeObserver.observe(appFrame);

    window.addEventListener("orientationchange", () => {
      setTimeout(() => {
        scaleAppToFrame();
        resetJoystick(sticks.left);
        resetJoystick(sticks.right);
        if (!running) gameDraw();
      }, 250);
    });



  function cloneComposerForExport(composer) {
    return {
      name: composer.name,
      style: composer.style,
      color: composer.color,
      focus: composer.focus,
      pieces: (composer.pieces || []).slice(),
      items: (composer.items || []).map(item => ({ ...item }))
    };
  }

  function validateComposerConfig(config) {
    const errors = [];
    const candidate = config || {};

    if (!candidate.name || !String(candidate.name).trim()) errors.push("Composer needs a name.");
    if (!candidate.style || !String(candidate.style).trim()) errors.push("Composer needs a short style label.");
    if (!candidate.color || !/^#[0-9a-f]{6}$/i.test(String(candidate.color))) errors.push("Composer color should be a hex color like #2563eb.");
    if (!candidate.focus || !String(candidate.focus).trim()) errors.push("Composer needs a focus keyword.");
    if (!Array.isArray(candidate.pieces) || candidate.pieces.length < PIECE_COSTS.length) errors.push(`Composer needs at least ${PIECE_COSTS.length} piece names.`);
    if (!Array.isArray(candidate.items) || candidate.items.length < 6) errors.push("Composer needs at least 6 item cards.");

    (candidate.items || []).forEach((item, index) => {
      if (!item.name) errors.push(`Item ${index + 1} needs a name.`);
      if (typeof item.cost !== "number") errors.push(`Item ${index + 1} needs a numeric cost.`);
      if (!item.effect) errors.push(`Item ${index + 1} needs an effect.`);
      if (!item.text) errors.push(`Item ${index + 1} needs player-facing text.`);
    });

    return { ok: errors.length === 0, errors };
  }

  function normalizeComposerConfig(config) {
    return {
      name: String(config.name).trim(),
      style: String(config.style).trim(),
      color: String(config.color).trim(),
      focus: String(config.focus).trim(),
      pieces: config.pieces.map(piece => String(piece).trim()).filter(Boolean),
      items: config.items.map(item => ({ ...item }))
    };
  }

  function addComposerConfig(config) {
    const validation = validateComposerConfig(config);
    if (!validation.ok) throw new Error(validation.errors.join(" "));

    const normalized = normalizeComposerConfig(config);
    const existingIndex = COMPOSERS.findIndex(composer => composer.name.toLowerCase() === normalized.name.toLowerCase());
    if (existingIndex >= 0) COMPOSERS[existingIndex] = normalized;
    else COMPOSERS.push(normalized);

    return cloneComposerForExport(normalized);
  }

  function deckShapeForComposer(name) {
    const composer = COMPOSERS.find(item => item.name.toLowerCase() === String(name || "").toLowerCase());
    if (!composer) return null;
    return {
      composer: composer.name,
      energyCards: ENERGY_CARDS,
      pieceCards: PIECE_COSTS.length,
      itemCards: (composer.items || []).length,
      maxBoard: "Unlimited",
      startingHp: STARTING_HP
    };
  }

  const composerClashExpansionApi = {
    getComposers: () => COMPOSERS.map(cloneComposerForExport),
    getComposerNames: () => COMPOSERS.map(composer => composer.name),
    validateComposer: validateComposerConfig,
    addComposer: addComposerConfig,
    getDeckShape: deckShapeForComposer
  };

  window.ComposerClashExpansion = composerClashExpansionApi;

    window.MobileArcadeShell = {
      canvas,
      ctx,
      sticks,
      setScore,
      addScore,
      setMessage,
      endGame,
      soundCorrect,
      soundWin,
      soundLose,
      getAudio,
      openMenu: openShellMenu,
      closeMenu: closeShellMenu,
      registerMenuTab: registerShellMenuTab,
      updateMenuTab: updateShellMenuTab
    };

    scaleAppToFrame();
    loadPlayers();
    resetJoystick(sticks.left);
    resetJoystick(sticks.right);
    gameInit();
    gameDraw();
  </script>
</body>
</html>
