<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Treble Trouble - Piano Arcade</title>

  <style>
  @font-face {
    font-family: "Bravura";
    src: url("https://cdn.jsdelivr.net/gh/steinbergmedia/bravura@master/redist/woff/Bravura.woff2") format("woff2");
    font-style: normal;
    font-weight: normal;
    font-display: swap;
  }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      font-family: Arial, sans-serif;
      touch-action: pan-y;
      overscroll-behavior-y: auto;
    }

    #appFrame {
      width: 100%;
      aspect-ratio: 390 / 670;
      position: relative;
      overflow: hidden;
      background: #202020;
    }

    #appStage {
      width: 390px;
      height: 670px;
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: top left;
      transform: scale(var(--app-scale, 1));
      overflow: hidden;
      background: linear-gradient(180deg, #2f2f2f, #191919);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: pan-y;
      overscroll-behavior-y: auto;
      color: white;
    }

    #appStage *:not(input):not(textarea) {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    button {
      font-family: Arial, sans-serif;
      touch-action: none;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #appFrame,
    #menuScreen,
    #screen,
    #controls {
      touch-action: pan-y;
      overscroll-behavior-y: auto;
    }

    button,
    .joystickPad {
      touch-action: none;
    }

    input,
    select {
      font-size: 16px;
      padding: 8px;
      border-radius: 10px;
      border: 2px solid #111;
      box-sizing: border-box;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       PLAYER MENU
       ========================= */

    #menuScreen {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #2f2f2f, #191919);
      padding: 13px 16px 14px;
      overflow: visible;
      text-align: center;
      z-index: 20;
      touch-action: pan-y;
    }

    #menuScreen h1 {
      margin: 4px 0 9px;
      font-size: 28px;
    }

    #leaderboardBox {
      margin: 0 auto 9px;
      padding: 9px;
      background: rgba(255,255,255,0.1);
      border-radius: 14px;
      max-width: 350px;
    }

    #leaderboardBox h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    #leaderboardList {
      text-align: left;
      max-width: 230px;
      margin: 0 auto;
      font-size: 15px;
    }

    #playerPickerBox {
      margin: 0 auto 9px;
      padding: 9px;
      background: rgba(255,255,255,0.08);
      border-radius: 14px;
      max-width: 350px;
    }

    #playerSearchInput {
      width: 100%;
      margin-bottom: 8px;
    }

    #playerSelect {
      width: 100%;
      height: 120px;
      background: #f8fbff;
      color: #111827;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border: 2px solid #111;
      border-radius: 10px;
      text-align: left;
    }

    .playerOption {
      padding: 10px;
      border-bottom: 1px solid rgba(17,24,39,0.12);
      font-size: 16px;
      line-height: 1.2;
      background: #f8fbff;
      color: #111827;
    }

    .playerOption:last-child {
      border-bottom: 0;
    }

    .playerOption.selected {
      background: #ffe08a;
      font-weight: bold;
    }

    .playerOption.disabled {
      color: rgba(17,24,39,0.55);
      text-align: center;
      font-style: italic;
    }

    #selectedPlayerActions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 7px;
    }

    #selectedPlayerActions button,
    #addPlayerBtn,
    #startGameBtn,
    #exitPageBtn {
      min-height: 38px;
      border-radius: 12px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
    }

    #resetSelectedPlayerBtn {
      background: #fff3bf;
    }

    #removeSelectedPlayerBtn {
      background: #ffd6d6;
    }

    #addPlayerRow {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
      margin: 0 auto 8px;
      max-width: 350px;
    }

    #newPlayerName {
      width: 100%;
    }

    #selectedPlayerText {
      margin: 7px 0;
      font-size: 15px;
      opacity: 0.9;
    }

    #startGameBtn {
      background: #dff3ff;
      min-width: 150px;
    }

    #exitPageBtn {
      min-width: 110px;
    }

    /* =========================
       GAME / EMULATOR
       ========================= */

    #gameScreen {
      position: absolute;
      inset: 0;
      display: none;
      background: linear-gradient(180deg, #2f2f2f, #191919);
      z-index: 10;
      touch-action: pan-y;
      overscroll-behavior-y: auto;
    }

    #screen {
      position: absolute;
      left: 0;
      top: 0;
      width: 390px;
      height: 281.667px;
      overflow: hidden;
      background: #0b1420;
      border: 1px solid #2b2b2b;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.05),
        0 1px 3px rgba(0,0,0,0.45);
    }

    #gameCanvas {
      width: 390px;
      height: 281.667px;
      display: block;
      touch-action: pan-y;
      overscroll-behavior-y: auto;
      background: #f7fbff;
      image-rendering: auto;
    }

    #gameOverBox {
      display: none;
      position: absolute;
      left: 34px;
      right: 34px;
      top: 50%;
      transform: translateY(-50%);
      padding: 18px 12px;
      background: rgba(16, 24, 39, 0.93);
      border: 3px solid white;
      border-radius: 16px;
      color: white;
      text-align: center;
      z-index: 8;
    }

    #gameOverBox h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    #gameOverScore {
      margin: 0 0 10px;
      font-size: 15px;
    }

    #gameOverBox button {
      border: 2px solid #111;
      border-radius: 12px;
      background: white;
      color: #111827;
      padding: 8px 12px;
      margin: 3px;
      font-size: 12px;
      font-weight: bold;
    }

    #lcd {
      position: absolute;
      left: 0;
      top: 281.667px;
      width: 390px;
      height: 48px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02)),
        #17251c;
      border-top: 3px solid #0c0c0c;
      border-bottom: 3px solid #0c0c0c;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.04),
        inset 0 0 14px rgba(0,0,0,0.35);
      color: #b7ff9e;
      font-family: "Courier New", monospace;
      text-shadow: 0 0 7px rgba(183,255,158,0.35);
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: 1fr 1fr;
      align-items: center;
      padding: 5px 16px;
      pointer-events: none;
    }

    #lcdMessage {
      grid-column: 1 / 3;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #lcdScore {
      font-size: 12px;
    }

    #lcdBest {
      font-size: 13px;
      text-align: right;
    }

    #controls {
      position: absolute;
      left: 0;
      top: 329.667px;
      width: 390px;
      height: 340.333px;
      background: #242424;
      touch-action: pan-y;
      overscroll-behavior-y: auto;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    #controls *,
    #screen,
    #gameCanvas {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* D-PAD */

    #dpad {
      position: absolute;
      left: 17px;
      top: 19px;
      width: 150px;
      height: 150px;
      touch-action: manipulation;
    }

    .dpadBtn {
      position: absolute;
      width: 50px;
      height: 50px;
      border: none;
      background: #111;
      color: rgba(255,255,255,0.86);
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 22px;
      line-height: 50px;
      text-align: center;
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.08),
        0 7px 13px rgba(0,0,0,0.45);
    }

    .dpadBtn.pressed,
    .dpadBtn:active {
      filter: brightness(1.35);
      transform: scale(0.94);
    }

    #dpadUp { left: 50px; top: 0; border-radius: 10px 10px 3px 3px; }
    #dpadLeft { left: 0; top: 50px; border-radius: 10px 3px 3px 10px; }
    #dpadCenter { left: 50px; top: 50px; border-radius: 4px; pointer-events: none; }
    #dpadRight { left: 100px; top: 50px; border-radius: 3px 10px 10px 3px; }
    #dpadDown { left: 50px; top: 100px; border-radius: 3px 3px 10px 10px; }

    /* FACE BUTTONS */

    #faceButtons {
      position: absolute;
      right: 18px;
      top: 20px;
      width: 150px;
      height: 150px;
    }

    .faceBtn {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 20px;
      font-weight: bold;
      background: radial-gradient(circle at 30% 30%, #ff82ad, #9d003d);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.15),
        0 10px 18px rgba(0,0,0,0.45);
    }

    .faceBtn.pressed,
    .faceBtn:active {
      transform: scale(0.92);
      filter: brightness(1.2);
    }

    #buttonX { left: 46px; top: 0; }
    #buttonY { left: 0; top: 46px; }
    #buttonA { left: 92px; top: 46px; }
    #buttonB { left: 46px; top: 92px; }

    /* JOYSTICKS */

    .joystickPad {
      position: absolute;
      width: 112px;
      height: 112px;
      border-radius: 18px;
      background: rgba(255,255,255,0.035);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.07);
      touch-action: none;
    }

    #leftJoystickPad {
      left: 36px;
      top: 188px;
    }

    #rightJoystickPad {
      right: 37px;
      top: 188px;
    }

    .joystickBase {
      position: absolute;
      left: 11px;
      top: 11px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, #3f3f3f, #161616);
      box-shadow:
        inset 0 0 0 3px rgba(255,255,255,0.08),
        0 9px 18px rgba(0,0,0,0.45);
      pointer-events: none;
    }

    .joystickKnob {
      position: absolute;
      left: 56px;
      top: 56px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #777, #202020);
      transform: translate(-50%, -50%);
      box-shadow: 0 8px 18px rgba(0,0,0,0.55);
      pointer-events: none;
    }



    /* A-G LETTER CONTROLS — SHARED */

    #letterButtons {
      position: absolute;
      left: 22px;
      right: 22px;
      top: 40px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(2, 86px);
      gap: 16px 8px;
      align-items: stretch;
    }

    .letterBtn {
      grid-column: span 2;
      border: none;
      border-radius: 18px;
      background: linear-gradient(180deg, #f8fbff, #dce9f6);
      color: #111827;
      font-size: 31px;
      font-weight: bold;
      box-shadow:
        inset 0 0 0 3px rgba(17,24,39,0.16),
        0 8px 14px rgba(0,0,0,0.38);
    }

    #letterE { grid-column: 2 / span 2; }
    #letterF { grid-column: 4 / span 2; }
    #letterG { grid-column: 6 / span 2; }

    .letterBtn.pressed,
    .letterBtn:active {
      transform: translateY(3px) scale(0.97);
      filter: brightness(0.92);
      box-shadow:
        inset 0 0 0 3px rgba(17,24,39,0.22),
        0 3px 7px rgba(0,0,0,0.32);
    }

    #controls.letterControlMode #systemButtons {
      top: 268px;
    }

    /* START / SELECT */

    #systemButtons {
      position: absolute;
      left: 50%;
      top: 326px;
      width: 164px;
      height: 34px;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .systemBtn {
      width: 76px;
      height: 32px;
      border-radius: 999px;
      border: none;
      background: #101010;
      color: rgba(255,255,255,0.78);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.12);
    }

    .systemBtn.pressed,
    .systemBtn:active {
      transform: scale(0.96);
      filter: brightness(1.2);
    }

    #faceButtons.singleFace .faceBtn.singleAction {
      width: 76px;
      height: 76px;
      left: 37px !important;
      top: 37px !important;
      border-radius: 22px;
      padding: 0 8px;
      font-size: 14px;
      line-height: 1.05;
      white-space: normal;
    }

    #systemButtons,
    #systemButtons.singleSystem {
      width: 92px;
    }

    #systemButtons.singleSystem .systemBtn {
      width: 92px;
    }

    /* =========================
       EXPANDABLE SHELL MENU
       ========================= */

    #shellMenu {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 60;
      background: rgba(0,0,0,0.62);
      padding: 22px 14px;
      color: white;
    }

    #shellMenu.open {
      display: block;
    }

    #shellMenuPanel {
      width: 100%;
      max-height: 100%;
      overflow: hidden;
      background: #101827;
      border: 3px solid white;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.45);
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    #shellMenuHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 12px 7px;
    }

    #shellMenuHeader h2 {
      margin: 0;
      font-size: 22px;
    }

    #shellMenuCloseBtn {
      width: 40px;
      height: 36px;
      padding: 0;
      border-radius: 12px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 26px;
      font-weight: bold;
      line-height: 1;
    }

    #shellMenuTabs {
      display: flex;
      gap: 7px;
      padding: 0 12px 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .shellMenuTab {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 7px 11px;
      border-radius: 999px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
    }

    .shellMenuTab.active {
      background: #ffe08a;
    }

    #shellMenuBody {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 14px 14px;
      text-align: left;
      font-size: 15px;
      line-height: 1.38;
      touch-action: pan-y;
    }

    .pauseMenuActions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
      margin-top: 12px;
    }

    .pauseActionBtn {
      min-height: 42px;
      border-radius: 12px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
    }

    .pauseActionBtn.saveExit {
      background: #dff3ff;
    }

    .pauseActionBtn.noSaveExit {
      background: #ffd6d6;
    }

    .pauseActionBtn.resumeGame {
      background: #fff3bf;
    }

    #shellMenuBody h3 {
      margin: 4px 0 8px;
      font-size: 20px;
    }

    #shellMenuBody ul {
      margin-top: 8px;
      padding-left: 21px;
    }

    #shellMenuBody code {
      background: rgba(255,255,255,0.12);
      padding: 2px 5px;
      border-radius: 6px;
    }

  
    #gameCanvas { background: #171225; }
    #gameOverBox {
      background: rgba(35, 23, 48, 0.96);
      border-color: #e5c4f3;
      box-shadow: 0 10px 30px rgba(0,0,0,0.48), inset 0 0 24px rgba(169,132,189,0.13);
    }
    #gameOverBox h1 { color: #ffd477; text-shadow: 0 0 10px rgba(255,92,125,0.32); }
</style>
</head>

<body>
  <main id="appFrame">
    <section id="appStage">
      <div id="menuScreen">
        <h1>Treble Trouble</h1>

        <div id="leaderboardBox">
          <h2>Leaderboard</h2>
          <ol id="leaderboardList"></ol>
        </div>

        <div id="playerPickerBox">
          <input id="playerSearchInput" placeholder="Search players..." autocomplete="off" />
          <div id="playerSelect" role="listbox" aria-label="Choose player"></div>

          <div id="selectedPlayerActions">
            <button id="resetSelectedPlayerBtn">Reset</button>
            <button id="removeSelectedPlayerBtn">Remove</button>
          </div>
        </div>

        <div id="addPlayerRow">
          <input id="newPlayerName" placeholder="New player name" />
          <button id="addPlayerBtn">Add Player</button>
        </div>

        <p id="selectedPlayerText">No player selected</p>
        <button id="startGameBtn">Start Game</button>
      </div>

      <div id="gameScreen">
        <div id="screen">
          <canvas id="gameCanvas" width="720" height="520"></canvas>

          <div id="gameOverBox">
            <h1>Game Over</h1>
            <p id="gameOverScore"></p>
            <button id="playAgainBtn">Play Again</button>
            <button id="backToMenuBtn">Player Menu</button>
          </div>
        </div>

        <div id="lcd">
          <div id="lcdMessage"></div>
          <div id="lcdScore">SCORE: <span id="score">0</span></div>
          <div id="lcdBest">BEST: <span id="bestScore">0</span></div>
        </div>

        <div id="controls" class="letterControlMode">


          <div id="letterButtons" aria-label="Letter controls">
            <button id="letterA" class="letterBtn" data-action="a" aria-label="A">A</button>
            <button id="letterB" class="letterBtn" data-action="b" aria-label="B">B</button>
            <button id="letterC" class="letterBtn" data-action="c" aria-label="C">C</button>
            <button id="letterD" class="letterBtn" data-action="d" aria-label="D">D</button>
            <button id="letterE" class="letterBtn" data-action="e" aria-label="E">E</button>
            <button id="letterF" class="letterBtn" data-action="f" aria-label="F">F</button>
            <button id="letterG" class="letterBtn" data-action="g" aria-label="G">G</button>
          </div>

          <div id="dpad">
            <button id="dpadUp" class="dpadBtn" data-action="up">▲</button>
            <button id="dpadLeft" class="dpadBtn" data-action="left">◄</button>
            <button id="dpadCenter" class="dpadBtn"></button>
            <button id="dpadRight" class="dpadBtn" data-action="right">►</button>
            <button id="dpadDown" class="dpadBtn" data-action="down">▼</button>
          </div>

          <div id="faceButtons">
            <button id="buttonX" class="faceBtn" data-action="x">X</button>
            <button id="buttonY" class="faceBtn" data-action="y">Y</button>
            <button id="buttonA" class="faceBtn" data-action="a">A</button>
            <button id="buttonB" class="faceBtn" data-action="b">B</button>
          </div>

          <div id="leftJoystickPad" class="joystickPad" data-stick="left">
            <div class="joystickBase"></div>
            <div id="leftJoystickKnob" class="joystickKnob"></div>
          </div>

          <div id="rightJoystickPad" class="joystickPad" data-stick="right">
            <div class="joystickBase"></div>
            <div id="rightJoystickKnob" class="joystickKnob"></div>
          </div>

          <div id="systemButtons">
            <button id="startButton" class="systemBtn" data-action="start">MENU</button>
          </div>
        </div>
      </div>

      <div id="shellMenu" aria-hidden="true">
        <div id="shellMenuPanel" role="dialog" aria-modal="true" aria-label="Pause panel">
          <div id="shellMenuHeader">
            <h2>Pause</h2>
            <button id="shellMenuCloseBtn" type="button" aria-label="Close panel">×</button>
          </div>
          <div id="shellMenuTabs" role="tablist" aria-label="Pause panel tabs"></div>
          <div id="shellMenuBody"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const DESIGN_WIDTH = 390;
    const DESIGN_HEIGHT = 670;
    const GAME_CANVAS_LOGICAL_WIDTH = 720;
    const GAME_CANVAS_LOGICAL_HEIGHT = 520;
    const GAME_CANVAS_DISPLAY_WIDTH = 390;
    const GAME_CANVAS_DISPLAY_HEIGHT =
      GAME_CANVAS_DISPLAY_WIDTH * GAME_CANVAS_LOGICAL_HEIGHT / GAME_CANVAS_LOGICAL_WIDTH;
    const MAX_GAME_CANVAS_PIXEL_SCALE = 4;

    /*
      Change STORAGE_KEY for each separate arcade game if you want each game
      to keep its own local player list/leaderboard.
      Example: "meloMemoPlayers_v1", "staffSurvivorPlayers_v1", etc.
    */
    const STORAGE_KEY = "trebleTroublePlayers_v1";
    const STORAGE_MESSAGE_SOURCE = "PianoArcadeShell";
    const WIX_STORAGE_MESSAGE_SOURCE = "PianoArcadeWixStorage";
    const SCORE_LABEL = "Score";
    const FIRST_TIME_HELP_DEFAULT_VERSION = "trebleTroubleRules_v1";
    let firstTimeHelpVersion = "trebleTroubleRules_v2";

    const appFrame = document.getElementById("appFrame");
    const appStage = document.getElementById("appStage");

    const menuScreen = document.getElementById("menuScreen");
    const gameScreen = document.getElementById("gameScreen");

    const leaderboardList = document.getElementById("leaderboardList");

    function scaleGameCanvasBackingStore() {
      canvas.style.width = GAME_CANVAS_DISPLAY_WIDTH + "px";
      canvas.style.height = GAME_CANVAS_DISPLAY_HEIGHT + "px";

      const rect = canvas.getBoundingClientRect();
      const cssWidth = Math.max(1, rect.width || GAME_CANVAS_DISPLAY_WIDTH * appScale);
      const cssHeight = Math.max(1, rect.height || GAME_CANVAS_DISPLAY_HEIGHT * appScale);
      const dpr = Math.max(1, window.devicePixelRatio || 1);

      const scaleX = (cssWidth / GAME_CANVAS_LOGICAL_WIDTH) * dpr;
      const scaleY = (cssHeight / GAME_CANVAS_LOGICAL_HEIGHT) * dpr;
      const targetScale = Math.min(
        MAX_GAME_CANVAS_PIXEL_SCALE,
        Math.max(1, scaleX, scaleY)
      );

      const targetWidth = Math.max(1, Math.round(GAME_CANVAS_LOGICAL_WIDTH * targetScale));
      const targetHeight = Math.max(1, Math.round(GAME_CANVAS_LOGICAL_HEIGHT * targetScale));

      if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
        canvas.width = targetWidth;
        canvas.height = targetHeight;
      }

      gameCanvasPixelScale = targetWidth / GAME_CANVAS_LOGICAL_WIDTH;
      ctx.setTransform(gameCanvasPixelScale, 0, 0, gameCanvasPixelScale, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.webkitImageSmoothingEnabled = true;
      ctx.mozImageSmoothingEnabled = true;
      ctx.msImageSmoothingEnabled = true;
    }

    function resetGameCanvasTransform() {
      ctx.setTransform(gameCanvasPixelScale, 0, 0, gameCanvasPixelScale, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.webkitImageSmoothingEnabled = true;
      ctx.mozImageSmoothingEnabled = true;
      ctx.msImageSmoothingEnabled = true;
    }

    function getGameCanvasSize() {
      return {
        width: GAME_CANVAS_LOGICAL_WIDTH,
        height: GAME_CANVAS_LOGICAL_HEIGHT,
        pixelScale: gameCanvasPixelScale
      };
    }

    function renderShellMenuTabs(activeId = activeShellMenuTab) {
      const fallbackTab = shellMenuTabs[0]?.id || "";
      activeShellMenuTab = shellMenuTabs.some(tab => tab.id === activeId) ? activeId : fallbackTab;

      shellMenuTabsEl.innerHTML = "";
      shellMenuBody.innerHTML = "";

        btn.className = "shellMenuTab" + (tab.id === activeShellMenuTab ? " active" : "");
        btn.textContent = tab.label;
        btn.setAttribute("role", "tab");
        btn.setAttribute("aria-selected", tab.id === activeShellMenuTab ? "true" : "false");
        btn.addEventListener("click", () => renderShellMenuTabs(tab.id));
        shellMenuTabsEl.appendChild(btn);

      const activeTab = shellMenuTabs.find(tab => tab.id === activeShellMenuTab);
      if (activeTab) shellMenuBody.innerHTML = activeTab.html;

    function registerShellMenuTab(id, label, htmlContent) {
      const tabId = String(id || "").trim();
      if (!tabId) return;

      const existing = shellMenuTabs.find(tab => tab.id === tabId);
      const tabData = {
        id: tabId,
        label: String(label || tabId),
        html: String(htmlContent || "")
      };

      if (existing) {
        existing.label = tabData.label;
        existing.html = tabData.html;
      } else {
        shellMenuTabs.push(tabData);
      }

      renderShellMenuTabs(activeShellMenuTab);
    }

    function updateShellMenuTab(id, htmlContent) {
      const existing = shellMenuTabs.find(tab => tab.id === id);
      if (!existing) return;
      existing.html = String(htmlContent || "");

      const shouldResume = options.resume !== false;

        shellMenuWasRunning &&

      if (!players[selectedPlayer] || typeof players[selectedPlayer] !== "object") {
        players[selectedPlayer] = { best: 0 };

      if (!Number.isFinite(Number(players[selectedPlayer].best))) {
        players[selectedPlayer].best = 0;
      }

      return players[selectedPlayer];

      // Guest is a shared/new-visitor account, so it should open How to Play every time.
      if (isGuestPlayerName()) return true;

      const playerData = ensureSelectedPlayerRecord();
      if (!playerData) return false;
      return playerData.helpSeenVersion !== firstTimeHelpVersion;
    }

    function markFirstTimeHelpSeen() {
      // Do not mark Guest as done. The next Guest player should still see How to Play.
      if (isGuestPlayerName()) return;

      const playerData = ensureSelectedPlayerRecord();
      if (!playerData) return;
      playerData.helpSeenVersion = firstTimeHelpVersion;

      Keep the template's full controller visible by default. Some games may only

      Example future game-specific override:
      MobileArcadeShell.configureControls({
        showDpad: false,

    const defaultMobileControlConfig = {

    function setVisible(element, visible) {

      element.classList.toggle("hidden", !visible);

    function configureMobileControls(options = {}) {
      const config = {
        ...defaultMobileControlConfig,
        ...options,
        labels: {

          ...(options.labels || {})

      };

      const visibleFaceButtons = new Set((config.faceButtons || []).map(action => String(action).toLowerCase()));
      const visibleSystemButtons = new Set((config.systemButtons || []).map(action => String(action).toLowerCase()));

      setVisible(dpad, config.showDpad !== false);
      setVisible(leftJoystickPad, config.showLeftJoystick !== false);

      Object.entries(faceButtonMap).forEach(([action, button]) => {

        setVisible(button, isVisible);
        button.textContent = config.labels[action] || action.toUpperCase();
        button.classList.toggle("singleAction", isVisible && visibleFaceButtons.size === 1);
      });

      if (faceButtons) {
        setVisible(faceButtons, visibleFaceButtons.size > 0);

    function cleanPlayers(rawPlayers) {
      const cleaned = {};

      Object.entries(rawPlayers || {}).forEach(([name, data]) => {
        const cleanName = String(name || "").trim();
        if (!cleanName) return;

        const isObjectData = data && typeof data === "object" && !Array.isArray(data);
        const best = isObjectData
          ? Number(data.best || 0)
          : Number(data || 0);

        cleaned[cleanName] = {
          ...(isObjectData ? data : {}),
          best: Math.max(0, Math.floor(best || 0))
        };
      });

      return cleaned;
    }

    function normalizeSavedData(savedData) {
      /*
        Supports both:
        1. New format: { v: 1, selectedPlayer: "Chris", players: { ... } }
        2. Old format: { "Chris": { best: 100, lastScore: 80 }, ... }
        Either way, this template stores only each player's best score.
      */
      if (!savedData || typeof savedData !== "object") {
        return { players: {}, selectedPlayer: null };
      }

      if (
        savedData.players &&
        typeof savedData.players === "object" &&
        !Array.isArray(savedData.players)
      ) {
        return {
          players: cleanPlayers(savedData.players),
          selectedPlayer: savedData.selectedPlayer || null
        };
      }

      return {
        players: cleanPlayers(savedData),
        selectedPlayer: null
      };
    }

    function applySavedData(savedData) {
      const normalized = normalizeSavedData(savedData);

      players = normalized.players || {};
      selectedPlayer = normalized.selectedPlayer || selectedPlayer || null;

      if (selectedPlayer && !players[selectedPlayer]) {
        selectedPlayer = null;
      }

      renderPlayers();
      renderLeaderboard();
    }

    function loadPlayersFromLocalStorage() {
      try {
        const savedText = localStorage.getItem(STORAGE_KEY);
        const savedData = savedText ? JSON.parse(savedText) : {};
        applySavedData(savedData);
      } catch (err) {
        players = {};
        selectedPlayer = null;
        renderPlayers();
        renderLeaderboard();
      }
    }

    function sendStorageMessageToWix(type, payload = {}) {
      if (!window.parent || window.parent === window) {
        return false;
      }

      window.parent.postMessage({
        source: STORAGE_MESSAGE_SOURCE,
        type,
        storageKey: STORAGE_KEY,
        ...payload
      }, "*");

      return true;
    }

    function loadPlayers() {
      wixStorageAnswered = false;
      const askedWixParent = sendStorageMessageToWix("ARCADE_STORAGE_LOAD");

      /*
        In Wix on iPhone Safari, the parent page should answer and provide
        Wix/Velo local storage. Outside Wix, or if the Velo bridge is not added,
        this fallback keeps the old desktop/localStorage behavior working.
      */
      if (askedWixParent) {
        setTimeout(() => {
          if (!wixStorageAnswered) {
            loadPlayersFromLocalStorage();
          }
        }, 600);
      } else {
        loadPlayersFromLocalStorage();
      }
    }

    function savePlayers() {
      const payload = getSavePayload();

      /*
        Keep the original browser localStorage path for desktop/non-Wix tests.
        On iPhone Safari inside Wix, this may not persist, so we also send
        the same payload to the Wix parent page.
      */
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (err) {}

      sendStorageMessageToWix("ARCADE_STORAGE_SAVE", { payload });
    }

    window.addEventListener("message", event => {
      const data = event.data;

      if (!data || typeof data !== "object") return;
      if (data.source !== WIX_STORAGE_MESSAGE_SOURCE) return;
      if (data.storageKey !== STORAGE_KEY) return;

      if (data.type === "ARCADE_STORAGE_DATA") {
        wixStorageAnswered = true;
        applySavedData(data.payload || {});
      }

    function renderPlayers() {
      playerSelect.innerHTML = "";

      const filter = playerSearchInput.value.trim().toLowerCase();

      const names = Object.keys(players).sort((a, b) => {
        return a.localeCompare(b, undefined, { sensitivity: "base" });
      });

      const filteredNames = names.filter(name => name.toLowerCase().includes(filter));

      if (filteredNames.length === 0) {
        const emptyRow = document.createElement("div");
        emptyRow.className = "playerOption disabled";
        emptyRow.textContent = names.length === 0 ? "No saved players yet" : "No matching players";
        playerSelect.appendChild(emptyRow);
      } else {
        filteredNames.forEach(name => {
          const row = document.createElement("div");
          row.className = "playerOption" + (name === selectedPlayer ? " selected" : "");
          row.dataset.playerName = name;
          row.setAttribute("role", "option");
          row.setAttribute("aria-selected", name === selectedPlayer ? "true" : "false");
          row.textContent = `${name} — Best: ${players[name].best || 0}`;

          row.addEventListener("click", () => {
            selectedPlayer = name;
            resetRemoveConfirmButton();
            savePlayers();
            renderPlayers();
          });

          row.addEventListener("touchend", event => {
            event.preventDefault();
            selectedPlayer = name;
            resetRemoveConfirmButton();
            savePlayers();
            renderPlayers();
          }, { passive: false });

          playerSelect.appendChild(row);
        });

    function joystickPointFromEvent(event, stick) {
      const rect = stick.pad.getBoundingClientRect();

      return {
        x: (event.clientX - rect.left) / appScale,
        y: (event.clientY - rect.top) / appScale
      };
    }

    function setJoystickFromEvent(event, stick) {
      const point = joystickPointFromEvent(event, stick);

      const centerX = stick.pad.offsetWidth / 2;
      const centerY = stick.pad.offsetHeight / 2;

      const limitedX = clamp(point.x, centerX - stick.maxDistance, centerX + stick.maxDistance);
      const limitedY = clamp(point.y, centerY - stick.maxDistance, centerY + stick.maxDistance);

      const dx = limitedX - centerX;
      const dy = limitedY - centerY;

      stick.x = dx / stick.maxDistance;
      stick.y = dy / stick.maxDistance;

      stick.knob.style.left = `${centerX + dx}px`;
      stick.knob.style.top = `${centerY + dy}px`;
    }

    function resetJoystick(stick) {
      stick.active = false;
      stick.pointerId = null;
      stick.x = 0;
      stick.y = 0;

      stick.knob.style.left = `${stick.pad.offsetWidth / 2}px`;
      stick.knob.style.top = `${stick.pad.offsetHeight / 2}px`;
    }

    function bindJoystick(stick) {
      stick.pad.addEventListener("pointerdown", event => {
        event.preventDefault();

        stick.active = true;
        stick.pointerId = event.pointerId;

        stick.pad.setPointerCapture(event.pointerId);
        setJoystickFromEvent(event, stick);
      });

      stick.pad.addEventListener("pointermove", event => {
        if (!stick.active || event.pointerId !== stick.pointerId) return;

        event.preventDefault();
        setJoystickFromEvent(event, stick);
      });

      stick.pad.addEventListener("pointerup", event => {
        if (event.pointerId !== stick.pointerId) return;

        event.preventDefault();

        if (stick.pad.hasPointerCapture(event.pointerId)) {
          stick.pad.releasePointerCapture(event.pointerId);
        }

        resetJoystick(stick);
      });

      stick.pad.addEventListener("pointercancel", () => resetJoystick(stick));
    }

    bindJoystick(sticks.left);
    bindJoystick(sticks.right);

    function pressButton(button) {
      button.classList.add("pressed");
      setTimeout(() => button.classList.remove("pressed"), 120);

    function bindButton(button) {

      button.addEventListener("contextmenu", event => event.preventDefault());

      running = false;

    function loop() {
      const effectsStillRunning =
        gameOverAnimTime >= 0 &&
        (!gameOverOverlayShown || burstPieces.length > 0 || floodSpiders.length > 0);

      if (!running && !effectsStillRunning) {
        loopId = null;

      }

      scaleGameCanvasBackingStore();
      resetGameCanvasTransform();

      const now = performance.now();
      const deltaSeconds = Math.min(0.05, Math.max(0, (now - (lastUpdateTime || now)) / 1000));
      lastUpdateTime = now;

      if (running) gameUpdate(deltaSeconds);
      else updateVisualEffects(deltaSeconds);
      gameDraw();

    function getAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;

    function createNoiseBuffer(ac, duration, color = "white") {
    const length = Math.max(1, Math.ceil(ac.sampleRate * Math.max(0.02, duration)));
    const buffer = ac.createBuffer(1, length, ac.sampleRate);
    const data = buffer.getChannelData(0);
    let brown = 0;
    let pink0 = 0;
    let pink1 = 0;
    let pink2 = 0;

    for (let i = 0; i < length; i++) {
      const white = Math.random() * 2 - 1;
      if (color === "brown") {
        brown = (brown + 0.025 * white) / 1.025;
        data[i] = Math.max(-1, Math.min(1, brown * 3.2));
      } else if (color === "pink") {
        pink0 = 0.99765 * pink0 + white * 0.0990460;
        pink1 = 0.96300 * pink1 + white * 0.2965164;
        pink2 = 0.57000 * pink2 + white * 1.0526913;
        data[i] = Math.max(-1, Math.min(1, (pink0 + pink1 + pink2 + white * 0.1848) * 0.13));
      } else {
        data[i] = white;
      }
    }
    return buffer;
  }

  function getSfxDestination(ac) {
    if (!ac) return null;
    if (!sfxBusInput || !sfxBusLimiter || sfxBusContext !== ac) {
      sfxBusContext = ac;
      sfxBusInput = ac.createGain();
      sfxBusLimiter = ac.createDynamicsCompressor();
      const saturation = ac.createWaveShaper();
      const outputGain = ac.createGain();

      // Push the combined effects mix hard into a limiter/saturator so even short
      // noise effects remain audible beside a mastered soundtrack. The final gain
      // stays below unity, keeping the browser output under full digital scale.
      sfxBusInput.gain.setValueAtTime(10.0, ac.currentTime);
      sfxBusLimiter.threshold.setValueAtTime(-18, ac.currentTime);
      sfxBusLimiter.knee.setValueAtTime(2, ac.currentTime);
      sfxBusLimiter.ratio.setValueAtTime(20, ac.currentTime);
      sfxBusLimiter.attack.setValueAtTime(0.001, ac.currentTime);
      sfxBusLimiter.release.setValueAtTime(0.12, ac.currentTime);

      const curveLength = 4096;
      const curve = new Float32Array(curveLength);
      for (let i = 0; i < curveLength; i++) {
        const x = (i / (curveLength - 1)) * 2 - 1;
        curve[i] = Math.tanh(x * 2.8) / Math.tanh(2.8);
      }
      saturation.curve = curve;
      saturation.oversample = "4x";
      outputGain.gain.setValueAtTime(0.96, ac.currentTime);

      sfxBusInput.connect(sfxBusLimiter);
      sfxBusLimiter.connect(saturation);
      saturation.connect(outputGain);
      outputGain.connect(ac.destination);
    }
    return sfxBusInput;
  }

  function playExplosionNoiseBurst(options = {}) {
    playNoiseBurst({ ...options, route: "sfx" });

  function playNoiseBurst({
    when = null,
    duration = 0.1,
    volume = 0.06,
    color = "white",
    filterType = "bandpass",
    frequencyStart = 1200,
    frequencyEnd = 300,
    q = 0.7,
    attack = 0.004,
    route = "sfx"
  } = {}) {
    const ac = getAudio();
    if (!ac) return;
    const startTime = Math.max(ac.currentTime, when == null ? ac.currentTime : when);
    const endTime = startTime + Math.max(0.025, duration);
    const source = ac.createBufferSource();
    const filter = ac.createBiquadFilter();
    const gain = ac.createGain();

    source.buffer = createNoiseBuffer(ac, duration + 0.04, color);
    filter.type = filterType;
    filter.Q.setValueAtTime(Math.max(0.0001, q), startTime);
    filter.frequency.setValueAtTime(Math.max(35, frequencyStart), startTime);
    filter.frequency.exponentialRampToValueAtTime(Math.max(35, frequencyEnd), endTime);

    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.linearRampToValueAtTime(Math.max(0.0001, volume), startTime + Math.min(attack, duration * 0.45));
    gain.gain.exponentialRampToValueAtTime(0.0001, endTime);

    source.connect(filter);
    filter.connect(gain);
    const destination = getSfxDestination(ac);
    if (!destination) return;
    gain.connect(destination);
    source.start(startTime);
    source.stop(endTime + 0.04);
  }

  

  function playSquishPitchSlide({
    when = null,
    duration = 0.333,
    squareVolume = 0.070,
    sawVolume = 0.014,
    frequencyStart = 110,
    frequencyEnd = 196
  } = {}) {
    const ac = getAudio();
    if (!ac) return;
    const startTime = Math.max(ac.currentTime, when == null ? ac.currentTime : when);
    const endTime = startTime + Math.max(0.08, duration);
    const output = getSfxDestination(ac);
    if (!output) return;

    const filter = ac.createBiquadFilter();
    const square = ac.createOscillator();
    const squareGain = ac.createGain();
    const saw = ac.createOscillator();
    const sawGain = ac.createGain();

    filter.type = "lowpass";
    filter.frequency.setValueAtTime(950, startTime);
    filter.frequency.exponentialRampToValueAtTime(1450, endTime);
    filter.Q.setValueAtTime(0.55, startTime);

    square.type = "square";
    square.frequency.setValueAtTime(frequencyStart, startTime);
    square.frequency.exponentialRampToValueAtTime(frequencyEnd, endTime);

    saw.type = "sawtooth";
    saw.frequency.setValueAtTime(frequencyStart * 1.006, startTime);
    saw.frequency.exponentialRampToValueAtTime(frequencyEnd * 1.006, endTime);

    squareGain.gain.setValueAtTime(0.0001, startTime);
    squareGain.gain.linearRampToValueAtTime(squareVolume, startTime + 0.018);
    squareGain.gain.setValueAtTime(squareVolume, endTime - 0.055);
    squareGain.gain.exponentialRampToValueAtTime(0.0001, endTime);

    sawGain.gain.setValueAtTime(0.0001, startTime);
    sawGain.gain.linearRampToValueAtTime(sawVolume, startTime + 0.024);
    sawGain.gain.setValueAtTime(sawVolume, endTime - 0.050);
    sawGain.gain.exponentialRampToValueAtTime(0.0001, endTime);

    square.connect(squareGain);
    saw.connect(sawGain);
    squareGain.connect(filter);
    sawGain.connect(filter);
    filter.connect(output);

    square.start(startTime);
    saw.start(startTime);
    square.stop(endTime + 0.02);
    saw.stop(endTime + 0.02);
  }

  function soundSpiderScurry(duration = 0.65, kind = "wrong") {
    const ac = getAudio();
    if (!ac) return;
    const now = ac.currentTime;
    const steps = kind === "missed" ? 9 : 8;
    const spacing = Math.max(0.038, duration / (steps + 1));

    if (kind === "missed") {
      playNoiseBurst({
        when: now,
        duration: 0.060,
        volume: 0.072,
        color: "white",
        filterType: "highpass",
        frequencyStart: 4200,

    for (let i = 0; i < steps; i++) {
      const alternate = i % 2;
      playNoiseBurst({
        when: now + i * spacing,
        duration: 0.034 + (i % 3) * 0.006,
        volume: 0.042 + (i % 2) * 0.008,

  function roundedRectPath(x, y, width, height, radius) {
    const r = Math.max(0, Math.min(radius, width / 2, height / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + width - r, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + r);
    ctx.lineTo(x + width, y + height - r);
    ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
    ctx.lineTo(x + r, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawCobwebCorner(x, y, radius, flipX = 1, flipY = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(flipX, flipY);
    ctx.strokeStyle = "rgba(226, 211, 240, 0.28)";
    ctx.lineWidth = GAME_CANVAS_LOGICAL_WIDTH < 500 ? 0.8 : 1.5;
    ctx.lineCap = "round";

    for (const angle of [0, Math.PI / 6, Math.PI / 3, Math.PI / 2]) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
      ctx.stroke();
    }

    for (const scale of [0.34, 0.64, 0.94]) {
      ctx.beginPath();
      const arcRadius = radius * scale;
      ctx.arc(0, 0, arcRadius, 0, Math.PI / 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function smoothStep01(value) {
    const clamped = Math.max(0, Math.min(1, value));
    return clamped * clamped * (3 - 2 * clamped);

  function drawSoftCloud(x, y, scale, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = "#cfc5dc";
    const lobes = [
      [-24, 2, 25, 8],
      [-8, -3, 22, 10],
      [10, 0, 28, 9],
      [28, 3, 20, 7]
    ];
    for (const [lx, ly, rx, ry] of lobes) {
      ctx.beginPath();
      ctx.ellipse(lx, ly, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawBatSilhouette(x, y, size, flapPhase, alpha) {

    ctx.save();

    ctx.globalAlpha *= alpha;
    ctx.fillStyle = "#100b16";
    ctx.beginPath();
    ctx.moveTo(0, 1);
    ctx.quadraticCurveTo(-size * 0.42, -size * flap, -size, -size * 0.18);
    ctx.quadraticCurveTo(-size * 0.68, size * 0.08, -size * 0.30, size * 0.28);
    ctx.quadraticCurveTo(-size * 0.14, size * 0.12, 0, size * 0.20);
    ctx.quadraticCurveTo(size * 0.14, size * 0.12, size * 0.30, size * 0.28);
    ctx.quadraticCurveTo(size * 0.68, size * 0.08, size, -size * 0.18);
    ctx.quadraticCurveTo(size * 0.42, -size * flap, 0, 1);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawSkyVisitors(compact) {
    const visitors = compact
      ? [{ offset: 3.5, y: 39, size: 4.2, duration: 2.2 }]
      : [
          { offset: 2.5, y: 64, size: 8.2, duration: 2.8 },
          { offset: 10.8, y: 108, size: 5.8, duration: 2.4 }
        ];

    for (const visitor of visitors) {
      const cycleLength = compact ? 15 : 17;
      const cycle = (effectClock + visitor.offset) % cycleLength;
      const start = compact ? 7.3 : 8.1;
      const local = (cycle - start) / visitor.duration;
      if (local < 0 || local > 1) continue;
      const eased = smoothStep01(local);
      const x = GAME_CANVAS_LOGICAL_WIDTH + visitor.size * 2 - eased * (GAME_CANVAS_LOGICAL_WIDTH + visitor.size * 4);
      const y = visitor.y + Math.sin(local * Math.PI * 2.2) * visitor.size * 0.65;
      const edgeFade = Math.min(1, local * 5, (1 - local) * 5);
      drawBatSilhouette(x, y, visitor.size, effectClock * 12 + visitor.offset, edgeFade * 0.82);
    }
  }

  function drawYardFog(compact) {
    const count = compact ? 3 : 5;
    const baseY = compact ? 120 : 145;
    const travel = GAME_CANVAS_LOGICAL_WIDTH + (compact ? 150 : 300);
    ctx.save();
    ctx.fillStyle = "#d8cde3";
    for (let i = 0; i < count; i++) {
      const speed = compact ? 3.2 + i * 0.35 : 5.0 + i * 0.55;
      const x = ((i * travel / count + effectClock * speed) % travel) - (compact ? 75 : 150);
      const y = baseY + i * (compact ? 20 : 18) + Math.sin(effectClock * 0.45 + i * 1.7) * (compact ? 2 : 4);
      const alpha = (compact ? 0.025 : 0.035) + (Math.sin(effectClock * 0.32 + i) + 1) * 0.008;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.ellipse(x, y, compact ? 72 : 145, compact ? 8 : 15, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawGroundLife(compact, dividerY) {
    const bladeCount = compact ? 18 : 34;
    ctx.save();
    ctx.strokeStyle = "rgba(96, 77, 112, 0.72)";
    ctx.lineWidth = compact ? 0.8 : 1.4;
    ctx.lineCap = "round";
    for (let i = 0; i < bladeCount; i++) {
      const x = (i + 0.35) * GAME_CANVAS_LOGICAL_WIDTH / bladeCount;
      const height = (compact ? 4 : 8) + ((i * 7) % (compact ? 5 : 9));
      const sway = Math.sin(effectClock * 1.15 + i * 0.83) * (compact ? 1.2 : 2.4);
      const rootY = dividerY + (compact ? 6 : 12) + Math.sin(i * 1.4) * (compact ? 1 : 2);
      ctx.beginPath();
      ctx.moveTo(x, rootY);
      ctx.quadraticCurveTo(x + sway * 0.35, rootY - height * 0.55, x + sway, rootY - height);
      ctx.stroke();
    }

    const eyeCycle = (effectClock + 2.6) % 12;
    if (eyeCycle > 6.4 && eyeCycle < 9.3) {
      const local = (eyeCycle - 6.4) / 2.9;
      const alpha = Math.sin(local * Math.PI) * 0.72;
      const eyeX = compact ? 46 : 288;
      const eyeY = dividerY + (compact ? 6 : 12);
      const gap = compact ? 3.5 : 7;
      const r = compact ? 0.9 : 1.8;
      ctx.fillStyle = `rgba(247, 201, 111, ${alpha})`;
      ctx.beginPath();
      ctx.ellipse(eyeX - gap / 2, eyeY, r, r * 0.65, 0, 0, Math.PI * 2);
      ctx.ellipse(eyeX + gap / 2, eyeY, r, r * 0.65, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

    drawLivingSky(compact);

    const moonX = compact ? 31 : 82;

    const moonGlow = ctx.createRadialGradient(moonX, moonY, moonR * 0.2, moonX, moonY, moonR * 1.65);

    moonGlow.addColorStop(0.55, "rgba(255, 226, 168, 0.17)");
    moonGlow.addColorStop(1, "rgba(255, 226, 168, 0)");
    ctx.fillStyle = moonGlow;
    ctx.beginPath();

    ctx.fillStyle = "rgba(161, 133, 151, 0.20)";
    for (const crater of compact

    }

    ctx.fillStyle = "rgba(239, 226, 255, 0.75)";
    const stars = compact
      ? [[70, 18, 1.2], [286, 15, 1], [222, 33, 0.8]]

    for (const [x, y, r] of stars) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);

    }

    drawSkyVisitors(compact);
    drawYardFog(compact);

    const laneX = compact ? 7 : 22;

    roundedRectPath(laneX, laneTop, laneWidth, laneHeight, compact ? 12 : 28);
    ctx.fillStyle = laneGradient;
    ctx.fill();
    ctx.strokeStyle = "rgba(190, 166, 207, 0.58)";
    ctx.lineWidth = compact ? 1 : 2;
    ctx.stroke();

    ctx.fillStyle = "rgba(255,255,255,0.22)";
    const fogY = laneTop + laneHeight * 0.56;
    for (let i = 0; i < (compact ? 4 : 6); i++) {
      const w = compact ? 88 : 165;
      const h = compact ? 11 : 20;
      const x = laneX - w * 0.18 + i * (laneWidth / (compact ? 3.4 : 5.2));
      ctx.beginPath();
      ctx.ellipse(x, fogY + (i % 2 ? h * 0.75 : 0), w, h, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    drawCobwebCorner(GAME_CANVAS_LOGICAL_WIDTH - (compact ? 4 : 12), compact ? 5 : 14, compact ? 32 : 72, -1, 1);

  function drawChimneySmoke(centerX, roofTop, width, height, load, compact) {
    const chimneyX = centerX + width * 0.275;
    const chimneyTop = roofTop + height * 0.145;
    const count = compact ? 4 : 6;
    for (let i = 0; i < count; i++) {
      const age = (effectClock * (0.16 + load * 0.06) + i / count) % 1;
      const turbulence = Math.sin(effectClock * (0.7 + load * 1.4) + i * 1.9) * (compact ? 3 : 7) * (0.45 + load);
      const x = chimneyX + turbulence + Math.sin(age * Math.PI * 2 + i) * (compact ? 2 : 4);
      const y = chimneyTop - age * (compact ? 34 : 76);
      const radius = (compact ? 3.2 : 6.5) * (0.7 + age * 1.15);
      const alpha = (1 - age) * (0.10 + load * 0.055);
      ctx.save();
      ctx.globalAlpha *= alpha;
      ctx.fillStyle = load > 0.65 ? "#b69aaa" : "#c9bfd3";
      ctx.beginPath();
      ctx.ellipse(x, y, radius * 1.25, radius, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawNoteSpiderGlyph(x, y, scale = 1, rotation = 0, alpha = 1, showEyes = true, motionPhase = 0, alert = 0) {
    const compact = GAME_CANVAS_LOGICAL_WIDTH < 500;
    const bodyRadiusX = STAFF_GAP * 0.70;
    const bodyRadiusY = STAFF_GAP * 0.48;
    const headRadius = STAFF_GAP * 0.24;
    const legReach = STAFF_GAP * 0.72;
    const twitchAmount = (compact ? 0.55 : 0.85) + alert * (compact ? 0.35 : 0.65);

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);
    ctx.scale(scale, scale);
    ctx.globalAlpha *= alpha;
    ctx.strokeStyle = "#17101f";
    ctx.fillStyle = "#17101f";
    ctx.lineWidth = compact ? 1.65 : 2.45;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    const legAnchors = [-0.78, 0, 0.78];
    for (const verticalSide of [-1, 1]) {
      for (let legIndex = 0; legIndex < legAnchors.length; legIndex++) {
        const anchor = legAnchors[legIndex];
        const twitch = Math.sin(motionPhase + legIndex * 1.8 + verticalSide * 0.7) * twitchAmount;
        const startX = anchor * bodyRadiusX * 0.52;
        const startY = verticalSide * bodyRadiusY * 0.38;
        const bendX = anchor * bodyRadiusX * 0.86 + twitch * 0.25;
        const bendY = verticalSide * (bodyRadiusY + legReach * 0.34) + twitch;
        const endX = anchor * bodyRadiusX * 1.10 + (anchor === 0 ? 0 : Math.sign(anchor) * bodyRadiusX * 0.24) + twitch * 0.42;
        const endY = verticalSide * (bodyRadiusY + legReach) + twitch * 0.55;
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(bendX, bendY, endX, endY);
        ctx.stroke();
      }
    }

    ctx.save();
    ctx.rotate(-0.20);
    ctx.beginPath();
    ctx.ellipse(bodyRadiusX * 0.08, 0, bodyRadiusX, bodyRadiusY, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-bodyRadiusX * 0.72, 0, headRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (showEyes && scale > 0.70) {
      const blinkWave = Math.sin(motionPhase * 0.34 + 1.8);
      const blinkScale = blinkWave > 0.965 ? 0.18 : 1;
      ctx.fillStyle = "#f6e8ff";
      const eyeX = -bodyRadiusX * 0.78;
      const eyeGap = compact ? 1.3 : 2.1;
      const eyeR = compact ? 0.75 : 1.2;
      ctx.beginPath();
      ctx.ellipse(eyeX, -eyeGap, eyeR, eyeR * blinkScale, 0, 0, Math.PI * 2);
      ctx.ellipse(eyeX, eyeGap, eyeR, eyeR * blinkScale, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(bendX, bendY, endX, endY);

  function spawnSquishEffect(note) {
    const effectX = Math.max(TARGET_BARLINE_X + STAFF_GAP, Math.min(Number(note?.x) || NOTE_LANDING_X, NOTE_LANDING_X));
    const effectY = Number.isFinite(Number(note?.y)) ? Number(note.y) : STAFF_TOP + STAFF_GAP * 2;
    const compact = GAME_CANVAS_LOGICAL_WIDTH < 500;
    const bodyRadiusX = STAFF_GAP * 0.70;
    const poseAngle = (Math.random() * 40 - 20) * Math.PI / 180;

    const legCount = 6;
    const twitchIndex = Math.floor(Math.random() * legCount);
    const legs = [];
    for (let i = 0; i < legCount; i++) {
      const sectorAngle = (-Math.PI) + (Math.PI * 2 * (i + 0.5)) / legCount;
      const angle = sectorAngle + (Math.random() - 0.5) * 0.95;
      const radius = STAFF_GAP * (0.42 + Math.random() * 0.72);
      legs.push({
        x: Math.cos(angle) * radius,
        y: Math.sin(angle) * radius * 0.86,
        rot: angle + (Math.random() - 0.5) * 1.15,
        len: STAFF_GAP * (0.22 + Math.random() * 0.16),
        twitch: i === twitchIndex
      });
    }

    const droplets = [];
    const dropletCount = compact ? 6 : 9;
    for (let i = 0; i < dropletCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = bodyRadiusX * (0.55 + Math.random() * 0.95);
      droplets.push({
        x: Math.cos(angle) * radius + (Math.random() - 0.5) * STAFF_GAP * 0.14,
        y: Math.sin(angle) * radius * 0.68 + STAFF_GAP * (0.05 + Math.random() * 0.16),
        r: STAFF_GAP * (0.05 + Math.random() * 0.055)
      });
    }

    squishEffects.push({ x: effectX, y: effectY, age: 0, duration: 0.90, legs, droplets, poseAngle });
  }
