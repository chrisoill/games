    const floodCount = compact ? 56 : 96;
    for (let i = 0; i < floodCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = compact ? (62 + Math.random() * 92) : (105 + Math.random() * 155);
      floodSpiders.push({
        x: originX + (Math.random() - 0.5) * (compact ? 15 : 28),
        y: originY + (Math.random() - 0.5) * (compact ? 12 : 22),
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - (compact ? 10 : 18),
        size: compact ? (3.2 + Math.random() * 2.6) : (5.2 + Math.random() * 4.0),
        age: 0,
        duration: 1.45 + Math.random() * 0.75,
        spin: (Math.random() - 0.5) * 1.3
      });
    }

    const fillCount = compact ? 40 : 72;
    screenFillSpiders = [];
    for (let i = 0; i < fillCount; i++) {
      screenFillSpiders.push({
        x: Math.random() * GAME_CANVAS_LOGICAL_WIDTH,
        y: Math.random() * GAME_CANVAS_LOGICAL_HEIGHT,
        size: compact ? (6 + Math.random() * 9) : (10 + Math.random() * 16),
        appear: 0.34 + Math.random() * 0.48,
        rotation: (Math.random() - 0.5) * 0.9,
        alpha: 0.68 + Math.random() * 0.27
      });
    }
  }

  function updateVisualEffects(deltaSeconds) {
    effectClock += deltaSeconds;
    uiEntranceTime = Math.min(1, uiEntranceTime + deltaSeconds);
    healthPulseTimer = Math.max(0, healthPulseTimer - deltaSeconds);
    houseHitFlash = Math.max(0, houseHitFlash - deltaSeconds * 3.2);
    houseShake = Math.max(0, houseShake - deltaSeconds * 4.0);
    thresholdFlash = Math.max(0, thresholdFlash - deltaSeconds * 5.4);
    difficultyPulse = Math.max(0, difficultyPulse - deltaSeconds * 2.4);
    doorOpenTimer = Math.max(0, doorOpenTimer - deltaSeconds);
    correctFlashTimer = Math.max(0, correctFlashTimer - deltaSeconds);

    squishEffects = squishEffects.filter(effect => ((effect.age += deltaSeconds) < effect.duration));
    scorePops = scorePops.filter(effect => ((effect.age += deltaSeconds) < effect.duration));

    const nextScurry = [];
    for (const effect of scurrySpiders) {
      effect.age += deltaSeconds;
      if (!effect.doorTriggered && effect.age >= effect.duration * 0.55) {
        doorOpenTimer = Math.max(doorOpenTimer, 0.68);
        effect.doorTriggered = true;
        soundDoorCycle();
      }
      if (!effect.entryTriggered && effect.age >= effect.duration * 0.88) {
        effect.entryTriggered = true;
        soundSpiderEnter(effect.targetLoad);
        soundHouseStrain(effect.targetLoad);
        spawnHouseDust(effect.targetLoad / MAX_HOUSE_SPIDERS);
      }
      if (effect.age < effect.duration) nextScurry.push(effect);
    }
    scurrySpiders = nextScurry;

    burstPieces = burstPieces.filter(piece => {
      piece.age += deltaSeconds;
      piece.x += piece.vx * deltaSeconds;
      piece.y += piece.vy * deltaSeconds;
      piece.vy += (GAME_CANVAS_LOGICAL_WIDTH < 500 ? 135 : 205) * deltaSeconds;
      piece.rot += piece.vr * deltaSeconds;
      return piece.age < piece.duration;
    });

    floodSpiders = floodSpiders.filter(spider => {
      spider.age += deltaSeconds;
      spider.x += spider.vx * deltaSeconds;
      spider.y += spider.vy * deltaSeconds;
      spider.vy += (GAME_CANVAS_LOGICAL_WIDTH < 500 ? 64 : 94) * deltaSeconds;
      return spider.age < spider.duration;
    });


    houseDustPuffs = houseDustPuffs.filter(puff => {
      puff.age += deltaSeconds;
      puff.x += puff.vx * deltaSeconds;
      puff.y += puff.vy * deltaSeconds;
      puff.vx *= Math.pow(0.90, deltaSeconds * 60);
      return puff.age < puff.duration;
    });

    explosionDust = explosionDust.filter(puff => {
      puff.age += deltaSeconds;
      puff.x += puff.vx * deltaSeconds;
      puff.y += puff.vy * deltaSeconds;
      puff.vx *= Math.pow(0.965, deltaSeconds * 60);
      puff.vy *= Math.pow(0.97, deltaSeconds * 60);
      return puff.age < puff.duration;
    });

    if (
      lossSequenceActive &&
      scurrySpiders.length === 0 &&
      doorOpenTimer <= 0
    ) {
      lossSequenceActive = false;
      endGame(pendingLossReason);
      return;
    }

    if (gameOverAnimTime >= 0) {
      gameOverAnimTime += deltaSeconds;
      if (gameOverAnimTime >= 1.22 && !gameOverOverlayShown) {
        gameOverBox.style.display = "block";
        gameOverOverlayShown = true;
      }
    }
  }

  function drawSquishEffect(effect) {
    const compact = GAME_CANVAS_LOGICAL_WIDTH < 500;
    const t = effect.age / effect.duration;
    const fadeStart = 0.68;
    const alpha = t < fadeStart ? 1 : Math.max(0, 1 - (t - fadeStart) / (1 - fadeStart));
    const squash = Math.min(1, t / 0.16);

    const bodyRadiusX = STAFF_GAP * 0.70;
    const normalBodyRadiusY = STAFF_GAP * 0.48;
    const squashedBodyRadiusY = normalBodyRadiusY * (2 / 3);
    const bodyRadiusY = normalBodyRadiusY + (squashedBodyRadiusY - normalBodyRadiusY) * squash;
    const headRadius = STAFF_GAP * 0.24;
    const bodyCenterX = bodyRadiusX * 0.08;
    const headCenterX = -bodyRadiusX * 0.72;
    const eyeBulge = 1 + Math.min(1, t / 0.12) * 0.45;
    const tongueExtend = Math.min(1, t / 0.18);
    const poseAngle = Number.isFinite(effect.poseAngle) ? effect.poseAngle : 0;

    ctx.save();
    ctx.translate(effect.x, effect.y);
    ctx.globalAlpha = alpha;

    // Under-splat base.
    ctx.fillStyle = "rgba(76, 150, 34, 0.92)";
    ctx.beginPath();
    ctx.ellipse(bodyCenterX, STAFF_GAP * 0.15, bodyRadiusX * 1.00, STAFF_GAP * 0.16, -0.18, 0, Math.PI * 2);
    ctx.fill();

    // Detached legs with wider random spread.
    ctx.strokeStyle = "#17101f";
    ctx.lineWidth = compact ? 1.65 : 2.45;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    for (const leg of effect.legs || []) {
      const twitchRot = leg.twitch ? Math.sin(effect.age * 42) * 0.34 * Math.max(0, 1 - t * 0.65) : 0;
      ctx.save();
      ctx.translate(leg.x, leg.y);
      ctx.rotate(leg.rot + twitchRot);
      ctx.beginPath();
      ctx.moveTo(-leg.len * 0.18, leg.len * 0.02);
      ctx.quadraticCurveTo(leg.len * 0.18, -leg.len * 0.18, leg.len * 0.56, leg.len * 0.04);
      ctx.quadraticCurveTo(leg.len * 0.82, leg.len * 0.18, leg.len, -leg.len * 0.04);
      ctx.stroke();
      ctx.restore();
    }

    // Randomized fallen pose, still facing left.
    ctx.save();
    ctx.rotate(poseAngle);
    ctx.fillStyle = "#17101f";
    ctx.beginPath();
    ctx.ellipse(bodyCenterX, 0, bodyRadiusX, bodyRadiusY, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(headCenterX, 0, headRadius, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#eef0f2";
    const eyeBaseX = headCenterX - headRadius * 0.18;
    const eyeGap = compact ? STAFF_GAP * 0.095 : STAFF_GAP * 0.12;
    const eyeRX = STAFF_GAP * 0.105 * eyeBulge;
    const eyeRY = STAFF_GAP * 0.085 * eyeBulge;
    ctx.beginPath();
    ctx.ellipse(eyeBaseX, -eyeGap, eyeRX, eyeRY, 0, 0, Math.PI * 2);
    ctx.ellipse(eyeBaseX, eyeGap, eyeRX, eyeRY, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#17101f";
    ctx.beginPath();
    ctx.arc(eyeBaseX + STAFF_GAP * 0.01, -eyeGap, STAFF_GAP * 0.028, 0, Math.PI * 2);
    ctx.arc(eyeBaseX + STAFF_GAP * 0.01, eyeGap, STAFF_GAP * 0.028, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#d06b9f";
    const mouthX = headCenterX - headRadius * 0.88;
    ctx.beginPath();
    ctx.moveTo(mouthX, STAFF_GAP * 0.035);
    ctx.quadraticCurveTo(mouthX - STAFF_GAP * 0.12, STAFF_GAP * 0.08, mouthX - STAFF_GAP * (0.12 + 0.12 * tongueExtend), STAFF_GAP * (0.16 + 0.07 * tongueExtend));
    ctx.quadraticCurveTo(mouthX - STAFF_GAP * 0.02, STAFF_GAP * 0.13, mouthX + STAFF_GAP * 0.03, STAFF_GAP * 0.055);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Visible darker splatter on top and around the spider.
    ctx.fillStyle = "rgba(88, 168, 40, 0.96)";
    for (const drop of effect.droplets || []) {
      ctx.beginPath();
      ctx.arc(drop.x, drop.y, drop.r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawScurrySpider(effect) {
    const compact = GAME_CANVAS_LOGICAL_WIDTH < 500;
    const t = Math.min(1, effect.age / effect.duration);
    const baseX = effect.startX + (effect.endX - effect.startX) * t;
    const baseY = effect.startY + (effect.endY - effect.startY) * t;
    const dx = effect.endX - effect.startX;
    const dy = effect.endY - effect.startY;
    const dist = Math.hypot(dx, dy) || 1;
    const ux = dx / dist;
    const uy = dy / dist;
    const nx = -dy / dist;
    const ny = dx / dist;
    const zig = Math.sin(t * Math.PI * 9 + effect.wobble) * (compact ? 4.8 : 8.2) * (1 - t * 0.28);
    const x = baseX + nx * zig;
    const y = baseY + ny * zig;
    const rot = Math.sin(t * Math.PI * 11 + effect.wobble) * 0.30;
    const shrinkT = smoothStep01(t);
    const glyphScale = 1 + (0.62 - 1) * shrinkT;

    ctx.save();
    ctx.fillStyle = "#cabbd2";
    for (let i = 0; i < (compact ? 2 : 3); i++) {
      const trail = (i + 1) * (compact ? 6 : 11);
      const puffPhase = (t * 9 + i * 0.36) % 1;
      ctx.globalAlpha = (1 - puffPhase) * (compact ? 0.10 : 0.13);
      ctx.beginPath();
      ctx.arc(x - ux * trail - nx * zig * 0.22, y - uy * trail - ny * zig * 0.22, (compact ? 1.4 : 2.6) + puffPhase * (compact ? 1.8 : 3.4), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    drawNoteSpiderGlyph(x, y, glyphScale, rot, 0.98, true, effect.wobble + effect.age * 24, 0.18);
  }

  function drawBurstPiece(piece) {
    const alpha = Math.max(0, 1 - piece.age / piece.duration);
    const fills = ["#49314a", "#2b1b34", "#3a2945"];
    ctx.save();
    ctx.translate(piece.x, piece.y);
    ctx.rotate(piece.rot);
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = "#120b14";
    ctx.lineWidth = GAME_CANVAS_LOGICAL_WIDTH < 500 ? 0.8 : 1.2;

    if (piece.kind === "window") {
      ctx.fillStyle = "rgba(247, 201, 111, 0.80)";
      ctx.beginPath();
      ctx.moveTo(-piece.size * 0.45, -piece.size * 0.32);
      ctx.lineTo(piece.size * 0.52, -piece.size * 0.12);
      ctx.lineTo(-piece.size * 0.08, piece.size * 0.50);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else if (piece.kind === "door") {
      ctx.fillStyle = "#18101f";
      ctx.fillRect(-piece.size * 0.28, -piece.size * 0.62, piece.size * 0.56, piece.size * 1.24);
      ctx.strokeRect(-piece.size * 0.28, -piece.size * 0.62, piece.size * 0.56, piece.size * 1.24);
      ctx.fillStyle = "#f5c86f";
      ctx.beginPath();
      ctx.arc(piece.size * 0.12, 0, Math.max(0.8, piece.size * 0.06), 0, Math.PI * 2);
      ctx.fill();
    } else if (piece.kind === "splinter") {
      ctx.fillStyle = "#5a3d4f";
      ctx.fillRect(-piece.size * 0.10, -piece.size * 0.74, piece.size * 0.20, piece.size * 1.48);
      ctx.strokeRect(-piece.size * 0.10, -piece.size * 0.74, piece.size * 0.20, piece.size * 1.48);
    } else if (piece.kind === "shingle") {
      ctx.fillStyle = "#24182d";
      ctx.beginPath();
      ctx.moveTo(-piece.size * 0.62, -piece.size * 0.22);
      ctx.lineTo(piece.size * 0.56, -piece.size * 0.30);
      ctx.lineTo(piece.size * 0.42, piece.size * 0.34);
      ctx.lineTo(-piece.size * 0.50, piece.size * 0.27);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else if (piece.kind === "roof") {
      ctx.fillStyle = "#24182d";
      ctx.beginPath();
      ctx.moveTo(0, -piece.size * 0.66);
      ctx.lineTo(piece.size * 0.68, piece.size * 0.46);
      ctx.lineTo(-piece.size * 0.62, piece.size * 0.34);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else {
      ctx.fillStyle = fills[piece.tone % fills.length];
      ctx.beginPath();
      ctx.moveTo(-piece.size * 0.58, -piece.size * 0.24);
      ctx.lineTo(piece.size * 0.48, -piece.size * 0.38);
      ctx.lineTo(piece.size * 0.24, piece.size * 0.48);
      ctx.lineTo(-piece.size * 0.42, piece.size * 0.31);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawFloodSpider(spider) {
    const t = spider.age / spider.duration;
    const size = spider.size * (1 + t * 3.4);
    const alpha = Math.max(0, 1 - t * 0.9);
    drawEffectSpider(spider.x, spider.y, size, spider.spin * spider.age * 8, alpha);
  }

  function drawActiveEffects() {
    for (const effect of scurrySpiders) drawScurrySpider(effect);
    for (const effect of squishEffects) drawSquishEffect(effect);
    for (const puff of houseDustPuffs) drawHouseDustPuff(puff);
    for (const puff of explosionDust) drawExplosionDustPuff(puff);
    for (const piece of burstPieces) drawBurstPiece(piece);
    for (const spider of floodSpiders) drawFloodSpider(spider);

    if (correctFlashTimer > 0 && Number.isFinite(correctFlashX) && Number.isFinite(correctFlashY)) {
      const compact = GAME_CANVAS_LOGICAL_WIDTH < 500;
      const t = 1 - correctFlashTimer / 0.55;
      const unit = STAFF_GAP * (compact ? 0.24 : 0.30);
      const y = correctFlashY - t * STAFF_GAP * 0.65;
      ctx.save();
      ctx.globalAlpha = Math.max(0, correctFlashTimer / 0.55);
      ctx.strokeStyle = "#7b3fc6";
      ctx.lineWidth = compact ? 1.8 : 3;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(correctFlashX - unit * 2.0, y);
      ctx.lineTo(correctFlashX - unit * 0.4, y);
      ctx.moveTo(correctFlashX - unit * 1.2, y - unit * 0.8);
      ctx.lineTo(correctFlashX - unit * 1.2, y + unit * 0.8);
      ctx.moveTo(correctFlashX + unit * 0.45, y - unit * 0.65);
      ctx.lineTo(correctFlashX + unit * 1.0, y - unit * 1.0);
      ctx.lineTo(correctFlashX + unit * 1.0, y + unit * 1.0);
      ctx.moveTo(correctFlashX + unit * 0.4, y + unit * 1.0);
      ctx.lineTo(correctFlashX + unit * 1.65, y + unit * 1.0);
      ctx.stroke();
      ctx.restore();
    }

    if (gameOverAnimTime >= 0) {
      const coverTime = Math.max(0, gameOverAnimTime - 0.28);
      for (const spider of screenFillSpiders) {
        const local = Math.min(1, Math.max(0, (coverTime - spider.appear) / 0.32));
        if (local <= 0) continue;
        drawEffectSpider(spider.x, spider.y, spider.size * (0.75 + local * 2.05), spider.rotation, local * spider.alpha);
      }
    }
  }

  function drawFailureHud() {
    const compact = GAME_CANVAS_LOGICAL_WIDTH < 500;
    const x = compact ? 74 : 174;
    const y = compact ? 7 : 28;
    const width = compact ? 176 : 286;
    const height = compact ? 74 : 118;
    const corner = compact ? 11 : 18;

    const hudEnter = smoothStep01(Math.min(1, uiEntranceTime / 0.45));

    ctx.save();
    ctx.globalAlpha *= hudEnter;
    ctx.translate(0, (1 - hudEnter) * (compact ? -5 : -10));
    ctx.shadowColor = "rgba(0,0,0,0.42)";
    ctx.shadowBlur = compact ? 4 : 10;
    ctx.shadowOffsetY = compact ? 2 : 5;
    ctx.fillStyle = houseHitFlash > 0
      ? `rgba(${Math.round(38 + houseHitFlash * 48)}, ${Math.round(25 + houseHitFlash * 12)}, ${Math.round(50 + houseHitFlash * 18)}, 0.95)`
      : "rgba(38, 25, 50, 0.95)";
    ctx.strokeStyle = "#a984bd";
    ctx.lineWidth = compact ? 1.5 : 3;
    roundedRectPath(x, y, width, height, corner);
    ctx.fill();
    ctx.stroke();
    ctx.shadowColor = "transparent";

    const cols = 5;
    const rows = 2;
    const innerPadX = compact ? 12 : 9;
    const innerPadY = compact ? 14 : 9;
    const usableWidth = width - innerPadX * 2;
    const usableHeight = height - innerPadY * 2;
    const cellW = usableWidth / cols;
    const cellH = usableHeight / rows;
    const spiderSize = compact ? 5.4 : 10.4;

    for (let i = 0; i < MAX_HOUSE_SPIDERS; i++) {
      const row = Math.floor(i / cols);
      const col = i % cols;
      const cx = x + innerPadX + cellW * (col + 0.5);
      const cy = y + innerPadY + cellH * (row + 0.5);
      const pulse = i === healthPulseIndex && healthPulseTimer > 0
        ? 1 + Math.sin((1 - healthPulseTimer / 0.38) * Math.PI) * 0.22
        : 1;
      drawTinySpider(cx, cy, spiderSize * pulse, i < houseSpiders);
    }
    ctx.restore();
  }

  function drawHouseScene() {
    const compact = GAME_CANVAS_LOGICAL_WIDTH < 500;
    const load = Math.max(0, Math.min(1, houseSpiders / MAX_HOUSE_SPIDERS));
    const burstProgress = gameOverAnimTime >= 0 ? Math.min(1, gameOverAnimTime / 0.34) : 0;
    const centerXBase = compact ? 340 : 555;
    const tremorStage = gameOverAnimTime < 0 && houseSpiders >= 7 && houseSpiders <= 9
      ? houseSpiders - 6
      : 0;
    const tremorActive = tremorStage > 0;
    const impactShakeScale = tremorActive ? 0.08 : 1;
    const shakeStrength = houseShake * impactShakeScale + burstProgress * 1.15;
    const shakeX = shakeStrength > 0 ? Math.sin(effectClock * 46) * shakeStrength * (compact ? 2.2 : 4.2) : 0;
    const idleSettleX = gameOverAnimTime < 0 && houseShake < 0.05 && !tremorActive ? Math.sin(effectClock * 0.72) * (compact ? 0.22 : 0.48) : 0;
    const idleSettleY = gameOverAnimTime < 0 && houseShake < 0.05 && !tremorActive ? Math.cos(effectClock * 0.61) * (compact ? 0.16 : 0.34) : 0;
    const centerX = centerXBase + shakeX + idleSettleX;
    const baseY = ANIMATION_AREA_BOTTOM - (compact ? 4 : 10) + idleSettleY;
    const baseWidth = compact ? 62 : 154;
    const baseHeight = compact ? 67 : 145;
    const bulgeStep = Math.min(9, houseSpiders);
    const bulgeProgress = bulgeStep / 9;
    const width = baseWidth * (1 + bulgeProgress * 0.025);
    const height = baseHeight * (1 + bulgeProgress * 0.025);
    const left = centerX - width / 2;
    const right = centerX + width / 2;
    const bodyTop = baseY - height * 0.58;
    const roofTop = baseY - height - burstProgress * (compact ? 10 : 24);
    const sideBulge = width * Math.min(0.22, bulgeStep * 0.024);
    const topBulge = width * Math.min(0.11, bulgeStep * 0.012);

    // Repeating center-outward tremors at spider counts 7-9.
    // 7: isolated tremor with long rests. 8: frequent bursts. 9: continuous instability.
    let outwardTremor = 0;
    if (tremorActive) {
      const amplitude = compact
        ? [0, 2.0, 3.5, 5.2][tremorStage]
        : [0, 4.8, 8.2, 12.5][tremorStage];

      if (tremorStage === 1) {
        const period = 3.8;
        const activeDuration = 0.46;
        const localTime = effectClock % period;
        if (localTime < activeDuration) {
          const envelope = Math.sin((localTime / activeDuration) * Math.PI);
          const vibration = 0.40 + 0.60 * Math.abs(Math.sin(localTime * Math.PI * 2 * 10.5));
          outwardTremor = amplitude * envelope * vibration;
        }
      } else if (tremorStage === 2) {
        const period = 1.45;
        const activeDuration = 0.72;
        const localTime = effectClock % period;
        if (localTime < activeDuration) {
          const envelope = Math.sin((localTime / activeDuration) * Math.PI);
          const vibration = 0.34 + 0.66 * Math.abs(Math.sin(localTime * Math.PI * 2 * 13.0));
          outwardTremor = amplitude * envelope * vibration;
        }
      } else {
        const fastVibration = Math.abs(Math.sin(effectClock * Math.PI * 2 * 15.5));
        const unevenPulse = 0.78 + 0.22 * Math.abs(Math.sin(effectClock * Math.PI * 2 * 4.3 + 0.8));
        outwardTremor = amplitude * (0.26 + 0.74 * fastVibration) * unevenPulse;
      }
    }

    const houseAlpha = gameOverAnimTime >= 0 ? Math.max(0, 1 - burstProgress * 1.45) : 1;

    ctx.save();

    if (burstProgress > 0) {
      const flash = ctx.createRadialGradient(centerX, bodyTop + height * 0.42, 0, centerX, bodyTop + height * 0.42, width * 1.45);
      flash.addColorStop(0, `rgba(255, 235, 182, ${0.74 * (1 - burstProgress * 0.38)})`);
      flash.addColorStop(0.38, `rgba(255, 172, 199, ${0.30 * (1 - burstProgress * 0.55)})`);
      flash.addColorStop(1, "rgba(255,172,199,0)");
      ctx.fillStyle = flash;
      ctx.beginPath();
      ctx.arc(centerX, bodyTop + height * 0.42, width * 1.45, 0, Math.PI * 2);
      ctx.fill();
    }

    if (houseAlpha <= 0.01) {
      ctx.restore();
      return;
    }

    if (gameOverAnimTime < 0) drawChimneySmoke(centerX, roofTop, width, height, load, compact);

    ctx.globalAlpha = houseAlpha;
    ctx.shadowColor = "rgba(0,0,0,0.58)";
    ctx.shadowBlur = compact ? 5 : 14;
    ctx.shadowOffsetY = compact ? 3 : 8;

    ctx.fillStyle = "#0f0b16";
    ctx.beginPath();
    ctx.ellipse(centerX, baseY + (compact ? 2 : 6), width * 0.68, compact ? 6 : 13, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = houseHitFlash > 0 ? "#4c3250" : "#3a2945";
    ctx.strokeStyle = "#120e18";
    ctx.lineWidth = compact ? 1.6 : 3.5;
    ctx.beginPath();
    ctx.moveTo(left, bodyTop);
    ctx.bezierCurveTo(
      left - sideBulge * 0.16 - outwardTremor * 0.28,
      bodyTop + height * 0.10,
      left - sideBulge - outwardTremor,
      bodyTop + height * 0.35,
      left,
      baseY
    );
    ctx.lineTo(right, baseY);
    ctx.bezierCurveTo(
      right + sideBulge + outwardTremor,
      bodyTop + height * 0.35,
      right + sideBulge * 0.16 + outwardTremor * 0.28,
      bodyTop + height * 0.10,
      right,
      bodyTop
    );
    ctx.quadraticCurveTo(centerX, bodyTop - topBulge - outwardTremor * 0.16, left, bodyTop);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#24182d";
    ctx.beginPath();
    ctx.moveTo(left - width * 0.11 - outwardTremor * 1.05 - burstProgress * (compact ? 6 : 14), bodyTop + height * 0.03);
    ctx.lineTo(centerX - width * 0.05, roofTop - outwardTremor * 0.10);
    ctx.lineTo(right + width * 0.12 + outwardTremor * 1.05 + burstProgress * (compact ? 6 : 14), bodyTop + height * 0.07);
    ctx.lineTo(right - width * 0.04 + outwardTremor * 0.32, bodyTop + height * 0.14);
    ctx.lineTo(centerX - width * 0.05, roofTop + height * 0.12);
    ctx.lineTo(left + width * 0.05 - outwardTremor * 0.32, bodyTop + height * 0.15);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#2b1b34";
    ctx.beginPath();
    ctx.moveTo(centerX + width * 0.20 + burstProgress * (compact ? 4 : 10), roofTop + height * 0.20);
    ctx.lineTo(centerX + width * 0.31 + burstProgress * (compact ? 4 : 10), roofTop + height * 0.17);
    ctx.lineTo(centerX + width * 0.34 + burstProgress * (compact ? 4 : 10), roofTop + height * 0.39);
    ctx.lineTo(centerX + width * 0.22 + burstProgress * (compact ? 4 : 10), roofTop + height * 0.42);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    const windowW = compact ? 10 : 24;
    const windowH = compact ? 11 : 27;
    const windowY = bodyTop + height * 0.20;
    const windowXs = [centerX - width * 0.23 - outwardTremor * 0.48, centerX + width * 0.23 + outwardTremor * 0.48];
    const baseWindowColor = load > 0.55 ? [255, 138, 160] : [247, 201, 111];
    for (let wi = 0; wi < windowXs.length; wi++) {
      const wx = windowXs[wi];
      const flickerNoise = Math.sin(effectClock * (1.4 + load * 4.2) + wi * 2.1) * 0.5 + 0.5;
      const flicker = houseHitFlash > 0 ? 1 : 0.76 + flickerNoise * (0.08 + load * 0.17);
      ctx.save();
      ctx.globalAlpha *= flicker;
      ctx.fillStyle = houseHitFlash > 0
        ? "#ffd17b"
        : `rgb(${baseWindowColor[0]}, ${baseWindowColor[1]}, ${baseWindowColor[2]})`;
      roundedRectPath(wx - windowW / 2, windowY, windowW, windowH, compact ? 2 : 4);
      ctx.fill();

      const shadowCycle = (effectClock + wi * 4.3) % (compact ? 13 : 10.5);
      if (shadowCycle > 5.6 && shadowCycle < 7.5 && load > 0.12) {
        const shadowT = (shadowCycle - 5.6) / 1.9;
        ctx.save();
        roundedRectPath(wx - windowW / 2, windowY, windowW, windowH, compact ? 2 : 4);
        ctx.clip();
        ctx.globalAlpha *= Math.sin(shadowT * Math.PI) * (0.28 + load * 0.22);
        ctx.fillStyle = "#1a1020";
        ctx.beginPath();
        ctx.ellipse(wx - windowW * 0.8 + shadowT * windowW * 1.6, windowY + windowH * 0.55, windowW * 0.34, windowH * 0.60, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.strokeStyle = "#17101e";
      ctx.lineWidth = compact ? 1 : 2;
      roundedRectPath(wx - windowW / 2, windowY, windowW, windowH, compact ? 2 : 4);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(wx, windowY);
      ctx.lineTo(wx, windowY + windowH);
      ctx.moveTo(wx - windowW / 2, windowY + windowH / 2);
      ctx.lineTo(wx + windowW / 2, windowY + windowH / 2);
      ctx.stroke();
      ctx.restore();
    }

    if (load >= 0.45) {
      const eyeBlink = Math.max(0, Math.sin(effectClock * (1.1 + load * 1.8)));
      const eyeAlpha = Math.pow(eyeBlink, 4) * (0.18 + load * 0.45);
      const atticY = roofTop + height * 0.31;
      ctx.fillStyle = `rgba(247, 201, 111, ${eyeAlpha})`;
      ctx.beginPath();
      ctx.ellipse(centerX - (compact ? 2.2 : 4.5), atticY, compact ? 0.8 : 1.6, compact ? 0.5 : 1.0, 0, 0, Math.PI * 2);
      ctx.ellipse(centerX + (compact ? 2.2 : 4.5), atticY, compact ? 0.8 : 1.6, compact ? 0.5 : 1.0, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    if (load >= 0.68) {
      const crawl = Math.sin(effectClock * 4.2) * (compact ? 1.1 : 2.0);
      ctx.strokeStyle = "rgba(18, 11, 22, 0.82)";
      ctx.lineWidth = compact ? 0.8 : 1.5;
      ctx.lineCap = "round";
      for (const side of [-1, 1]) {
        const wx = centerX + side * width * 0.23;
        const edgeX = wx + side * windowW * 0.48;
        for (let i = 0; i < 3; i++) {
          const yy = windowY + windowH * (0.25 + i * 0.24);
          ctx.beginPath();
          ctx.moveTo(edgeX, yy);
          ctx.quadraticCurveTo(edgeX + side * (compact ? 3 : 6), yy + crawl, edgeX + side * (compact ? 5 : 10), yy + (i - 1) * (compact ? 2 : 4));
          ctx.stroke();
        }
      }
    }

    const doorW = compact ? 14 : 34;
    const doorH = compact ? 24 : 56;
    const doorLeft = centerX - doorW / 2;
    const doorRight = centerX + doorW / 2;
    const doorTop = baseY - doorH;
    const doorBottom = baseY;
    let openAmt = 0;

    if (gameOverAnimTime >= 0) {
      openAmt = 0;
    } else if (doorOpenTimer > 0) {
      const cycleDuration = 0.68;
      const elapsed = cycleDuration - doorOpenTimer;
      let raw = 0;
      if (elapsed < 0.20) {
        raw = Math.max(0, elapsed / 0.20);
      } else if (elapsed < 0.42) {
        raw = 1;
      } else {
        raw = Math.max(0, Math.min(1, (cycleDuration - elapsed) / 0.26));
      }
      openAmt = raw * raw * (3 - 2 * raw);
    }

    ctx.fillStyle = "#0d0810";
    roundedRectPath(doorLeft, doorTop, doorW, doorH, compact ? 4 : 8);
    ctx.fill();

    if (openAmt > 0.01) {
      const rightInset = doorW * 0.72 * openAmt;
      const rightEdgeX = doorRight - rightInset;
      const rightVerticalExpand = doorH * 0.028 * openAmt;
      const panelWidth = Math.max(doorW * 0.18, rightEdgeX - doorLeft);
      ctx.fillStyle = "#18101f";
      ctx.strokeStyle = "#0e0910";
      ctx.lineWidth = compact ? 1 : 2;
      ctx.beginPath();
      ctx.moveTo(doorLeft, doorTop + doorH * 0.018 * openAmt);
      ctx.lineTo(rightEdgeX, doorTop - rightVerticalExpand);
      ctx.lineTo(rightEdgeX, doorBottom + rightVerticalExpand);
      ctx.lineTo(doorLeft, doorBottom - doorH * 0.018 * openAmt);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#f5c86f";
      ctx.beginPath();
      ctx.arc(
        doorLeft + panelWidth * 0.76,
        doorTop + doorH * 0.52,
        compact ? 1.2 : 2.6,
        0,
        Math.PI * 2
      );
      ctx.fill();
    } else {
      ctx.fillStyle = "#18101f";
      roundedRectPath(doorLeft, doorTop, doorW, doorH, compact ? 4 : 8);
      ctx.fill();
      ctx.fillStyle = "#f5c86f";
      ctx.beginPath();
      ctx.arc(centerX + doorW * 0.25, baseY - doorH * 0.48, compact ? 1.2 : 2.6, 0, Math.PI * 2);
      ctx.fill();
    }

    const cracks = [];
    if (houseSpiders >= 2) cracks.push([[centerX - width * 0.24, bodyTop + height * 0.24],[centerX - width * 0.18, bodyTop + height * 0.32],[centerX - width * 0.22, bodyTop + height * 0.42],[centerX - width * 0.14, bodyTop + height * 0.52]]);
    if (houseSpiders >= 4) cracks.push([[centerX + width * 0.08, bodyTop + height * 0.18],[centerX + width * 0.16, bodyTop + height * 0.28],[centerX + width * 0.10, bodyTop + height * 0.40],[centerX + width * 0.21, bodyTop + height * 0.50]]);
    if (houseSpiders >= 6) cracks.push([[centerX - width * 0.06, roofTop + height * 0.18],[centerX + width * 0.00, roofTop + height * 0.28],[centerX - width * 0.08, roofTop + height * 0.38]]);
    if (houseSpiders >= 8) cracks.push([[centerX + width * 0.24, bodyTop + height * 0.26],[centerX + width * 0.18, bodyTop + height * 0.35],[centerX + width * 0.27, bodyTop + height * 0.44],[centerX + width * 0.20, bodyTop + height * 0.56]]);
    if (cracks.length) {
      const crackGrowth = 1 + Math.max(0, houseSpiders - 2) * 0.055;
      const crackWidth = compact
        ? 0.95 + houseSpiders * 0.055
        : 1.85 + houseSpiders * 0.13;
      ctx.strokeStyle = "rgba(10, 6, 13, 0.97)";
      ctx.lineWidth = crackWidth;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      for (let crackIndex = 0; crackIndex < cracks.length; crackIndex++) {
        const crack = cracks[crackIndex];
        const anchorX = crack[0][0];
        const anchorY = crack[0][1];
        const points = crack.map((point, pointIndex) => {
          let px = anchorX + (point[0] - anchorX) * crackGrowth;
          let py = anchorY + (point[1] - anchorY) * crackGrowth;
          const dxFromCenter = px - centerX;
          const direction = dxFromCenter === 0
            ? (pointIndex % 2 === 0 ? -1 : 1)
            : Math.sign(dxFromCenter);
          const edgeFactor = 0.22 + 0.78 * Math.min(1, Math.abs(dxFromCenter) / (width * 0.50));
          px += direction * outwardTremor * edgeFactor * 0.76;
          if (outwardTremor > 0) {
            const vibrationRate = tremorStage === 3 ? 72 : tremorStage === 2 ? 58 : 46;
            py += Math.sin(effectClock * vibrationRate + crackIndex * 1.9 + pointIndex * 1.35)
              * outwardTremor * (compact ? 0.055 : 0.075);
          }
          return [px, py];
        });

        ctx.beginPath();
        ctx.moveTo(points[0][0], points[0][1]);
        for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
        ctx.stroke();

        // Small branches become more pronounced as the house fills.
        if (houseSpiders >= 6 && points.length >= 3) {
          const branchScale = compact ? 2.4 : 5.2;
          const branchStrength = (houseSpiders - 5) / 5;
          const branchPoint = points[Math.min(2, points.length - 1)];
          const branchDirection = branchPoint[0] < centerX ? -1 : 1;
          ctx.beginPath();
          ctx.moveTo(branchPoint[0], branchPoint[1]);
          ctx.lineTo(
            branchPoint[0] + branchDirection * branchScale * (0.65 + branchStrength),
            branchPoint[1] - branchScale * (0.35 + branchStrength * 0.35)
          );
          ctx.stroke();
        }
      }
    }

    ctx.restore();
  }

  function drawTargetBarline(x, topY, bottomY) {
    const compact = GAME_CANVAS_LOGICAL_WIDTH < 500;

    ctx.save();
    ctx.shadowColor = `rgba(217, 75, 120, ${0.35 + thresholdFlash * 0.35})`;
    ctx.shadowBlur = compact ? 7 + thresholdFlash * 6 : 14 + thresholdFlash * 10;
    ctx.strokeStyle = "#b1446a";
    ctx.lineWidth = compact ? 2.8 : 4.8;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x, topY - (compact ? 4 : 8));
    ctx.lineTo(x, bottomY + (compact ? 4 : 8));
    ctx.stroke();
    ctx.restore();
  }

  function drawFiveLineStaff(topY, gap, leftX, rightX) {
    ctx.save();
    ctx.strokeStyle = "#211a2c";
    ctx.lineWidth = GAME_CANVAS_LOGICAL_WIDTH < 500 ? 1.65 : 2.45;
    ctx.setLineDash([]);
    ctx.beginPath();
    for (let line = 0; line < 5; line++) {
      const y = topY + line * gap;
      ctx.moveTo(leftX, y);
      ctx.lineTo(rightX, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  

  

  function drawClef(type, x, topY, gap) {
    const isTreble = type === "treble";
    const fontSize = gap * 4;
    const referenceLineY = isTreble ? topY + gap * 3 : topY + gap;
    const smuflGlyph = isTreble ? SMUFL_G_CLEF : SMUFL_F_CLEF;
    const unicodeGlyph = isTreble ? UNICODE_G_CLEF : UNICODE_F_CLEF;
    ctx.save();
    ctx.fillStyle = "#211a2c";
    ctx.textAlign = "left";

    if (bravuraReady) {
      ctx.font = `${fontSize}px "Bravura"`;
      ctx.textBaseline = "alphabetic";
      ctx.fillText(smuflGlyph, x, referenceLineY);
    } else {
      ctx.font = `${fontSize}px "Noto Music", "Segoe UI Symbol", "Apple Symbols", serif`;
      ctx.textBaseline = "middle";
      ctx.fillText(unicodeGlyph, x, topY + gap * 2);
    }

    ctx.restore();
  }

  function noteYFromStep(step) {
    const bottomLineY = STAFF_TOP + STAFF_GAP * 4;
    return bottomLineY - step * (STAFF_GAP / 2);
  }

  function geometryForPitch(pitch) {
    const y = noteYFromStep(pitch.step);
    return {
      y,
      ledgerYs: pitch.ledger ? [y] : [],
      staffCenterY: STAFF_TOP + STAFF_GAP * 2
    };
  }

  function choosePitchIndex() {
    let index = Math.floor(Math.random() * NOTE_CHOICES.length);
    if (NOTE_CHOICES.length > 1 && index === lastPitchIndex) {
      index = (index + 1 + Math.floor(Math.random() * (NOTE_CHOICES.length - 1))) % NOTE_CHOICES.length;
    }
    return index;
  }

  function spawnNoteAt(x) {
    const pitchIndex = choosePitchIndex();
    const pitch = NOTE_CHOICES[pitchIndex];
    lastPitchIndex = pitchIndex;
    const noteGeometry = geometryForPitch(pitch);
    activeNotes.push({
      id: nextNoteId++,
      letter: pitch.letter,
      x,
      y: noteGeometry.y,
      ledgerYs: noteGeometry.ledgerYs,
      staffCenterY: noteGeometry.staffCenterY
    });
  }

  function maintainNoteStream() {
    if (activeNotes.length === 0) spawnNoteAt(NOTE_SPAWN_X);
    let rightmost = activeNotes[activeNotes.length - 1];
    while (rightmost.x <= NOTE_SPAWN_X - NOTE_SPACING_X) {
      spawnNoteAt(rightmost.x + NOTE_SPACING_X);
      rightmost = activeNotes[activeNotes.length - 1];
    }
  }

  function currentNoteSpeed() {
    const n = correctNotes;
    const baseSpeedSquared = BASE_NOTE_SPEED * BASE_NOTE_SPEED;
    // Correct answers arrive faster as the stream speeds up. Growing speed by sqrt(n)
    // offsets that feedback, so difficulty rises approximately linearly over play time.
    return Math.sqrt(baseSpeedSquared + n * NOTE_SPEED_SQUARED_RAMP);
  }

  function addSpiderToHouse() {
    houseSpiders = Math.min(MAX_HOUSE_SPIDERS, houseSpiders + 1);
    healthPulseIndex = houseSpiders - 1;
    healthPulseTimer = 0.38;
    return houseSpiders >= MAX_HOUSE_SPIDERS;
  }

  function resolveFrontNote(result) {
    if (activeNotes.length === 0 || lossSequenceActive) return;
    const frontNote = activeNotes[0];
    activeNotes.shift();

    if (result === "correct") {
      soundCorrect();
      spawnSquishEffect(frontNote);
      correctFlashX = Math.max(TARGET_BARLINE_X + STAFF_GAP * 3.0, Math.min(Number(frontNote?.x) || NOTE_LANDING_X, NOTE_LANDING_X - STAFF_GAP * 3.2));
      correctFlashY = (Number.isFinite(Number(frontNote?.y)) ? Number(frontNote.y) : STAFF_TOP + STAFF_GAP * 2) - STAFF_GAP * 1.55;
      correctFlashTimer = 0.55;
      addScore(1);
      correctNotes++;
      maintainNoteStream();
      return;
    }

    spawnScurrySpider(frontNote, result);
    const finalSpider = addSpiderToHouse();
    if (finalSpider) {
      lossSequenceActive = true;
      pendingLossReason = "The house is overrun!";
      activeNotes = [];
      return;
    }

    maintainNoteStream();
  }

  function approachProgressForX(x) {
    const approachDistance = Math.max(1, NOTE_ZOOM_START_X - NOTE_LANDING_X);
    const rawProgress = Math.max(0, Math.min(1, (NOTE_ZOOM_START_X - x) / approachDistance));
    return rawProgress * rawProgress * (3 - 2 * rawProgress);
  }

  function drawStreamingNote(note) {
    const compact = GAME_CANVAS_LOGICAL_WIDTH < 500;
    const approach = approachProgressForX(note.x);
    const scale = NOTE_MIN_SCALE + (1 - NOTE_MIN_SCALE) * approach;
    const renderY = NOTE_VANISH_Y + (note.y - NOTE_VANISH_Y) * approach;
    const ledgerHalfWidth = STAFF_GAP * 1.16;
    const isFront = activeNotes[0] === note;
    const urgencyRange = STAFF_GAP * 5.2;
    const urgency = isFront
      ? Math.max(0, Math.min(1, (TARGET_BARLINE_X + urgencyRange - note.x) / urgencyRange))
      : 0;
    const alertRotation = urgency * Math.sin(effectClock * 18 + note.id) * 0.035;
    const alertScale = 1 + urgency * (0.018 + Math.sin(effectClock * 12 + note.id) * 0.008);

    ctx.save();
    ctx.translate(note.x, renderY);
    ctx.scale(scale, scale);
    ctx.strokeStyle = "#17101f";
    ctx.lineWidth = compact ? 1.65 : 2.45;
    ctx.lineCap = "round";
    for (const ledgerY of note.ledgerYs) {
      const relativeLedgerY = ledgerY - note.y;
      ctx.beginPath();
      ctx.moveTo(-ledgerHalfWidth, relativeLedgerY);
      ctx.lineTo(ledgerHalfWidth, relativeLedgerY);
      ctx.stroke();
    }
    ctx.restore();

    drawNoteSpiderGlyph(
      note.x,
      renderY,
      scale * alertScale,
      alertRotation,
      1,
      true,
      effectClock * (4.2 + urgency * 3.8) + note.id * 1.73,
      urgency
    );
  }

  function gameInit() {
    activeNotes = [];
    correctNotes = 0;
    houseSpiders = 0;
    lastPitchIndex = -1;
    nextNoteId = 1;
    lastUpdateTime = performance.now();
    lossSequenceActive = false;
    pendingLossReason = "The house is overrun!";
    resetVisualEffects();
    requestBravuraFont();
    spawnNoteAt(NOTE_SPAWN_X);
  }

  function gameUpdate(deltaSeconds) {
    if (lossSequenceActive) {
      updateVisualEffects(deltaSeconds);
      return;
    }

    const distance = currentNoteSpeed() * deltaSeconds;
    for (const note of activeNotes) note.x -= distance;
    maintainNoteStream();

    while (running && !lossSequenceActive && activeNotes.length > 0 && activeNotes[0].x <= TARGET_BARLINE_X) {
      resolveFrontNote("missed");
    }

    updateVisualEffects(deltaSeconds);
  }

  function gameDraw() {
    ctx.clearRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);
    drawBackgroundScene();
    drawAnimationDivider();
    drawHouseScene();
    drawFailureHud();
    drawFiveLineStaff(STAFF_TOP, STAFF_GAP, STAFF_LEFT, STAFF_RIGHT);
    drawClef(CLEF_TYPE, CLEF_X, STAFF_TOP, STAFF_GAP);
    for (let i = activeNotes.length - 1; i >= 0; i--) drawStreamingNote(activeNotes[i]);
    drawTargetBarline(TARGET_BARLINE_X, STAFF_TOP, STAFF_TOP + STAFF_GAP * 4);
    drawActiveEffects();
  }

  function gameInput(action) {
    if (!running || lossSequenceActive || activeNotes.length === 0) return;
    const letter = String(action || "").toUpperCase();
    if (!/^[A-G]$/.test(letter)) return;
    if (letter === activeNotes[0].letter) {
      resolveFrontNote("correct");
    } else {
      resolveFrontNote("wrong");
    }
  }

  function gamePointer() {
    /* Pointer input remains intentionally unused in this staff-reading game. */
  }

  function gameStop() {
    activeNotes = [];
    lastUpdateTime = 0;
    lossSequenceActive = false;
    pendingLossReason = "The house is overrun!";
    resetVisualEffects();
  }


    const resizeObserver = new ResizeObserver(() => {
      scaleAppToFrame();
      resetJoystick(sticks.left);
      resetJoystick(sticks.right);
      if (!running) {
        resetGameCanvasTransform();
        gameDraw();
      }
    });

    resizeObserver.observe(appFrame);

    window.addEventListener("orientationchange", () => {
      setTimeout(() => {
        scaleAppToFrame();
        resetJoystick(sticks.left);
        resetJoystick(sticks.right);
        if (!running) {
          resetGameCanvasTransform();
          gameDraw();
        }
      }, 250);
    });

    window.MobileArcadeShell = {
      canvas,
      ctx,
      gameWidth: GAME_CANVAS_LOGICAL_WIDTH,
      gameHeight: GAME_CANVAS_LOGICAL_HEIGHT,
      getCanvasSize: getGameCanvasSize,
      scaleGameCanvasBackingStore,
      resetGameCanvasTransform,
      sticks,
      setScore,
      addScore,
      setMessage,
      endGame,
      soundCorrect,
      soundWin,
      soundLose,
      getAudio,
      savePlayers,
      loadPlayers,
      openMenu: openShellMenu,
      closeMenu: closeShellMenu,
      exitToPlayerMenu,
      saveCurrentScoreForSelectedPlayer,
      registerMenuTab: registerShellMenuTab,
      updateMenuTab: updateShellMenuTab,
      configureControls: configureMobileControls,
      setFirstTimeHelpVersion
    };

    scaleAppToFrame();
    loadPlayers();
    resetJoystick(sticks.left);
    resetJoystick(sticks.right);
    configureMobileControls({
      showDpad: false,
      showLeftJoystick: false,
      showRightJoystick: false,
      faceButtons: [],
      systemButtons: ["start"],
      labels: { start: "MENU" }
    });
    gameInit();
    gameDraw();
  </script>
</body>
