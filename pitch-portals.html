<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pitch Portals Mobile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #appFrame {
      width: 100%;
      aspect-ratio: 390 / 670;
      position: relative;
      overflow: hidden;
      background: #202020;
    }

    #appStage {
      width: 390px;
      height: 670px;
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: top left;
      transform: scale(var(--app-scale, 1));
      overflow: hidden;
      background: linear-gradient(180deg, #2f2f2f, #191919);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: auto;
      color: white;
    }

    #appStage *:not(input):not(textarea) {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    button {
      font-family: Arial, sans-serif;
      touch-action: none;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input,
    select {
      font-size: 16px;
      padding: 8px;
      border-radius: 10px;
      border: 2px solid #111;
      box-sizing: border-box;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       PLAYER MENU
       ========================= */

    #menuScreen {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #2f2f2f, #191919);
      padding: 13px 16px 14px;
      overflow: visible;
      text-align: center;
      z-index: 20;
      touch-action: pan-y;
    }

    #menuScreen h1 {
      margin: 4px 0 9px;
      font-size: 28px;
    }

    #leaderboardBox {
      margin: 0 auto 9px;
      padding: 9px;
      background: rgba(255,255,255,0.1);
      border-radius: 14px;
      max-width: 350px;
    }

    #leaderboardBox h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    #leaderboardList {
      text-align: left;
      max-width: 230px;
      margin: 0 auto;
      font-size: 15px;
    }

    #playerPickerBox {
      margin: 0 auto 9px;
      padding: 9px;
      background: rgba(255,255,255,0.08);
      border-radius: 14px;
      max-width: 350px;
    }

    #playerSearchInput {
      width: 100%;
      margin-bottom: 8px;
    }

    #playerSelect {
      width: 100%;
      height: 120px;
      background: #f8fbff;
      color: #111827;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border: 2px solid #111;
      border-radius: 10px;
      text-align: left;
    }

    .playerOption {
      padding: 10px;
      border-bottom: 1px solid rgba(17,24,39,0.12);
      font-size: 16px;
      line-height: 1.2;
      background: #f8fbff;
      color: #111827;
    }

    .playerOption:last-child {
      border-bottom: 0;
    }

    .playerOption.selected {
      background: #ffe08a;
      font-weight: bold;
    }

    .playerOption.disabled {
      color: rgba(17,24,39,0.55);
      text-align: center;
      font-style: italic;
    }

    #selectedPlayerActions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 7px;
    }

    #selectedPlayerActions button,
    #addPlayerBtn,
    #startGameBtn,
    #exitPageBtn {
      min-height: 38px;
      border-radius: 12px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
    }

    #resetSelectedPlayerBtn {
      background: #fff3bf;
    }

    #removeSelectedPlayerBtn {
      background: #ffd6d6;
    }

    #addPlayerRow {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
      margin: 0 auto 8px;
      max-width: 350px;
    }

    #newPlayerName {
      width: 100%;
    }

    #selectedPlayerText {
      margin: 7px 0;
      font-size: 15px;
      opacity: 0.9;
    }

    #startGameBtn {
      background: #dff3ff;
      min-width: 150px;
    }

    #exitPageBtn {
      min-width: 110px;
    }

    /* =========================
       GAME / EMULATOR
       ========================= */

    #gameScreen {
      position: absolute;
      inset: 0;
      display: none;
      background: linear-gradient(180deg, #2f2f2f, #191919);
      z-index: 10;
      touch-action: auto;
    }

    #screen {
      position: absolute;
      left: 0;
      top: 0;
      width: 390px;
      height: 219px;
      overflow: hidden;
      background: #0b1420;
      border: 1px solid #2b2b2b;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.05),
        0 1px 3px rgba(0,0,0,0.45);
    }

    #gameCanvas {
      width: 390px;
      height: 219px;
      display: block;
      background: #f7fbff;
      image-rendering: pixelated;
    }

    #gameOverBox {
      display: none;
      position: absolute;
      left: 34px;
      right: 34px;
      top: 35px;
      padding: 18px 12px;
      background: rgba(16, 24, 39, 0.93);
      border: 3px solid white;
      border-radius: 16px;
      color: white;
      text-align: center;
      z-index: 8;
    }

    #gameOverBox h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    #gameOverScore {
      margin: 0 0 10px;
      font-size: 15px;
    }

    #gameOverBox button {
      border: 2px solid #111;
      border-radius: 12px;
      background: white;
      color: #111827;
      padding: 8px 12px;
      margin: 3px;
      font-size: 12px;
      font-weight: bold;
    }

    #lcd {
      position: absolute;
      left: 0;
      top: 219px;
      width: 390px;
      height: 48px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02)),
        #17251c;
      border-top: 3px solid #0c0c0c;
      border-bottom: 3px solid #0c0c0c;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.04),
        inset 0 0 14px rgba(0,0,0,0.35);
      color: #b7ff9e;
      font-family: "Courier New", monospace;
      text-shadow: 0 0 7px rgba(183,255,158,0.35);
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: 1fr 1fr;
      align-items: center;
      padding: 5px 16px;
      pointer-events: none;
    }

    #lcdMessage {
      grid-column: 1 / 3;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #lcdScore {
      font-size: 12px;
    }

    #lcdBest {
      font-size: 13px;
      text-align: right;
    }

    #controls {
      position: absolute;
      left: 0;
      top: 267px;
      width: 390px;
      height: 400px;
      background: linear-gradient(180deg, #303030, #181818);
      touch-action: auto;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    #controls *,
    #screen,
    #gameCanvas {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* D-PAD */

    #dpad {
      position: absolute;
      left: 17px;
      top: 19px;
      width: 150px;
      height: 150px;
      touch-action: manipulation;
    }

    .dpadBtn {
      position: absolute;
      width: 50px;
      height: 50px;
      border: none;
      background: #111;
      color: rgba(255,255,255,0.86);
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 22px;
      line-height: 50px;
      text-align: center;
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.08),
        0 7px 13px rgba(0,0,0,0.45);
    }

    .dpadBtn.pressed,
    .dpadBtn:active {
      filter: brightness(1.35);
      transform: scale(0.94);
    }

    #dpadUp { left: 50px; top: 0; border-radius: 10px 10px 3px 3px; }
    #dpadLeft { left: 0; top: 50px; border-radius: 10px 3px 3px 10px; }
    #dpadCenter { left: 50px; top: 50px; border-radius: 4px; pointer-events: none; }
    #dpadRight { left: 100px; top: 50px; border-radius: 3px 10px 10px 3px; }
    #dpadDown { left: 50px; top: 100px; border-radius: 3px 3px 10px 10px; }

    /* FACE BUTTONS */

    #faceButtons {
      position: absolute;
      right: 18px;
      top: 20px;
      width: 150px;
      height: 150px;
    }

    .faceBtn {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 20px;
      font-weight: bold;
      background: radial-gradient(circle at 30% 30%, #ff82ad, #9d003d);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.15),
        0 10px 18px rgba(0,0,0,0.45);
    }

    .faceBtn.pressed,
    .faceBtn:active {
      transform: scale(0.92);
      filter: brightness(1.2);
    }

    #buttonX { left: 46px; top: 0; }
    #buttonY { left: 0; top: 46px; }
    #buttonA { left: 92px; top: 46px; }
    #buttonB { left: 46px; top: 92px; }

    /* JOYSTICKS */

    .joystickPad {
      position: absolute;
      width: 112px;
      height: 112px;
      border-radius: 18px;
      background: rgba(255,255,255,0.035);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.07);
      touch-action: none;
    }

    #leftJoystickPad {
      left: 36px;
      top: 188px;
    }

    #rightJoystickPad {
      right: 37px;
      top: 188px;
    }

    .joystickBase {
      position: absolute;
      left: 11px;
      top: 11px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, #3f3f3f, #161616);
      box-shadow:
        inset 0 0 0 3px rgba(255,255,255,0.08),
        0 9px 18px rgba(0,0,0,0.45);
      pointer-events: none;
    }

    .joystickKnob {
      position: absolute;
      left: 56px;
      top: 56px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #777, #202020);
      transform: translate(-50%, -50%);
      box-shadow: 0 8px 18px rgba(0,0,0,0.55);
      pointer-events: none;
    }

    /* START / SELECT */

    #systemButtons {
      position: absolute;
      left: 50%;
      top: 326px;
      width: 164px;
      height: 34px;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .systemBtn {
      width: 76px;
      height: 32px;
      border-radius: 999px;
      border: none;
      background: #101010;
      color: rgba(255,255,255,0.78);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.12);
    }

    .systemBtn.pressed,
    .systemBtn:active {
      transform: scale(0.96);
      filter: brightness(1.2);
    }

    /* =========================
       EXPANDABLE SHELL MENU
       ========================= */

    #shellMenu {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 60;
      background: rgba(0,0,0,0.62);
      padding: 22px 14px;
      color: white;
    }

    #shellMenu.open {
      display: block;
    }

    #shellMenuPanel {
      width: 100%;
      max-height: 100%;
      overflow: hidden;
      background: #101827;
      border: 3px solid white;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.45);
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    #shellMenuHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 12px 7px;
    }

    #shellMenuHeader h2 {
      margin: 0;
      font-size: 22px;
    }

    #shellMenuCloseBtn {
      width: 40px;
      height: 36px;
      padding: 0;
      border-radius: 12px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 26px;
      font-weight: bold;
      line-height: 1;
    }

    #shellMenuTabs {
      display: flex;
      gap: 7px;
      padding: 0 12px 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .shellMenuTab {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 7px 11px;
      border-radius: 999px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
    }

    .shellMenuTab.active {
      background: #ffe08a;
    }

    #shellMenuBody {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 14px 14px;
      text-align: left;
      font-size: 15px;
      line-height: 1.38;
      touch-action: pan-y;
    }

    .pauseMenuActions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
      margin-top: 12px;
    }

    .pauseActionBtn {
      min-height: 42px;
      border-radius: 12px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
    }

    .pauseActionBtn.saveExit {
      background: #dff3ff;
    }

    .pauseActionBtn.noSaveExit {
      background: #ffd6d6;
    }

    .pauseActionBtn.resumeGame {
      background: #fff3bf;
    }

    #shellMenuBody h3 {
      margin: 4px 0 8px;
      font-size: 20px;
    }

    #shellMenuBody ul {
      margin-top: 8px;
      padding-left: 21px;
    }

    #shellMenuBody code {
      background: rgba(255,255,255,0.12);
      padding: 2px 5px;
      border-radius: 6px;
    }


    /* Pitch Portals uses lane movement plus a replay button. Keep the full
       emulator in the template, but show only the useful controls here. */
    #dpad {
      left: 34px;
      top: 26px;
      width: 126px;
      height: 136px;
    }

    #dpadUp,
    #dpadDown {
      left: 36px;
      width: 64px;
      height: 54px;
      line-height: 54px;
      font-size: 13px;
      border-radius: 12px;
    }

    #dpadUp { top: 0; }
    #dpadDown { top: 78px; }

    #dpadLeft,
    #dpadRight,
    #dpadCenter,
    #buttonX,
    #buttonY,
    #buttonB,
    #rightJoystickPad,
    #selectButton {
      display: none !important;
    }

    #faceButtons {
      right: 18px;
      top: 45px;
      width: 150px;
      height: 94px;
    }

    #buttonA {
      left: 24px;
      top: 18px;
      width: 102px;
      height: 56px;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    #systemButtons {
      top: 326px;
      width: 92px;
    }

    #startButton {
      width: 88px;
      font-size: 11px;
    }


    #gameCanvas {
      background: #0b1420;
      touch-action: none;
    }
  </style>
</head>

<body>
  <main id="appFrame">
    <section id="appStage">
      <div id="menuScreen">
        <h1>Choose Player</h1>

        <div id="leaderboardBox">
          <h2>Leaderboard</h2>
          <ol id="leaderboardList"></ol>
        </div>

        <div id="playerPickerBox">
          <input id="playerSearchInput" placeholder="Search players..." autocomplete="off" />
          <div id="playerSelect" role="listbox" aria-label="Choose player"></div>

          <div id="selectedPlayerActions">
            <button id="resetSelectedPlayerBtn">Reset</button>
            <button id="removeSelectedPlayerBtn">Remove</button>
          </div>
        </div>

        <div id="addPlayerRow">
          <input id="newPlayerName" placeholder="New player name" />
          <button id="addPlayerBtn">Add Player</button>
        </div>

        <p id="selectedPlayerText">No player selected</p>
        <button id="startGameBtn">Start Game</button>
      </div>

      <div id="gameScreen">
        <div id="screen">
          <canvas id="gameCanvas" width="390" height="219"></canvas>

          <div id="gameOverBox">
            <h1>Game Over</h1>
            <p id="gameOverScore"></p>
            <button id="playAgainBtn">Play Again</button>
            <button id="backToMenuBtn">Player Menu</button>
          </div>
        </div>

        <div id="lcd">
          <div id="lcdMessage">READY</div>
          <div id="lcdScore">SCORE: <span id="score">0</span></div>
          <div id="lcdBest">BEST: <span id="bestScore">0</span></div>
        </div>

        <div id="controls">
          <div id="dpad">
            <button id="dpadUp" class="dpadBtn" data-action="up">▲</button>
            <button id="dpadLeft" class="dpadBtn" data-action="left">◄</button>
            <button id="dpadCenter" class="dpadBtn"></button>
            <button id="dpadRight" class="dpadBtn" data-action="right">►</button>
            <button id="dpadDown" class="dpadBtn" data-action="down">▼</button>
          </div>

          <div id="faceButtons">
            <button id="buttonX" class="faceBtn" data-action="x">X</button>
            <button id="buttonY" class="faceBtn" data-action="y">Y</button>
            <button id="buttonA" class="faceBtn" data-action="a">A</button>
            <button id="buttonB" class="faceBtn" data-action="b">B</button>
          </div>

          <div id="leftJoystickPad" class="joystickPad" data-stick="left">
            <div class="joystickBase"></div>
            <div id="leftJoystickKnob" class="joystickKnob"></div>
          </div>

          <div id="rightJoystickPad" class="joystickPad" data-stick="right">
            <div class="joystickBase"></div>
            <div id="rightJoystickKnob" class="joystickKnob"></div>
          </div>

          <div id="systemButtons">
            <button id="selectButton" class="systemBtn" data-action="select">SELECT</button>
            <button id="startButton" class="systemBtn" data-action="start">START</button>
          </div>
        </div>
      </div>

      <div id="shellMenu" aria-hidden="true">
        <div id="shellMenuPanel" role="dialog" aria-modal="true" aria-label="Pause panel">
          <div id="shellMenuHeader">
            <h2>Pause</h2>
            <button id="shellMenuCloseBtn" type="button" aria-label="Close panel">×</button>
          </div>
          <div id="shellMenuTabs" role="tablist" aria-label="Pause panel tabs"></div>
          <div id="shellMenuBody"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const DESIGN_WIDTH = 390;
    const DESIGN_HEIGHT = 670;

    /*
      Change STORAGE_KEY for each separate arcade game if you want each game
      to keep its own local player list/leaderboard.
      Example: "meloMemoPlayers_v1", "staffSurvivorPlayers_v1", etc.
    */
    const STORAGE_KEY = "pitchPortalsMobilePlayers_v1";
    const FIRST_TIME_HELP_VERSION = "pitchPortalsMobileHowToPlay_v1";
    const STORAGE_MESSAGE_SOURCE = "PianoArcadeShell";
    const WIX_STORAGE_MESSAGE_SOURCE = "PianoArcadeWixStorage";
    const SCORE_LABEL = "Score";

    const appFrame = document.getElementById("appFrame");
    const appStage = document.getElementById("appStage");

    const menuScreen = document.getElementById("menuScreen");
    const gameScreen = document.getElementById("gameScreen");

    const leaderboardList = document.getElementById("leaderboardList");
    const playerSearchInput = document.getElementById("playerSearchInput");
    const playerSelect = document.getElementById("playerSelect");
    playerSelect.addEventListener("touchmove", event => event.stopPropagation(), { passive: true });
    const resetSelectedPlayerBtn = document.getElementById("resetSelectedPlayerBtn");
    const removeSelectedPlayerBtn = document.getElementById("removeSelectedPlayerBtn");
    const newPlayerName = document.getElementById("newPlayerName");
    const addPlayerBtn = document.getElementById("addPlayerBtn");
    const startGameBtn = document.getElementById("startGameBtn");
    const selectedPlayerText = document.getElementById("selectedPlayerText");

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const lcdMessage = document.getElementById("lcdMessage");
    const scoreEl = document.getElementById("score");
    const bestScoreEl = document.getElementById("bestScore");

    const gameOverBox = document.getElementById("gameOverBox");
    const gameOverScore = document.getElementById("gameOverScore");
    const playAgainBtn = document.getElementById("playAgainBtn");
    const backToMenuBtn = document.getElementById("backToMenuBtn");

    const leftJoystickPad = document.getElementById("leftJoystickPad");
    const rightJoystickPad = document.getElementById("rightJoystickPad");
    const leftJoystickKnob = document.getElementById("leftJoystickKnob");
    const rightJoystickKnob = document.getElementById("rightJoystickKnob");

    const shellMenu = document.getElementById("shellMenu");
    const shellMenuTabsEl = document.getElementById("shellMenuTabs");
    const shellMenuBody = document.getElementById("shellMenuBody");
    const shellMenuCloseBtn = document.getElementById("shellMenuCloseBtn");

    document.getElementById("dpadUp").textContent = "UP";
    document.getElementById("dpadDown").textContent = "DOWN";
    document.getElementById("buttonA").textContent = "REPLAY";
    document.getElementById("startButton").textContent = "MENU";

    let appScale = 1;
    let players = {};
    let selectedPlayer = null;
    let score = 0;
    let running = false;
    let loopId = null;
    let audioCtx = null;
    let shellMenuWasRunning = false;
    let wixStorageAnswered = false;
    let pendingStartAfterHelp = false;

    const sticks = {
      left: {
        active: false,
        pointerId: null,
        x: 0,
        y: 0,
        maxDistance: 34,
        pad: leftJoystickPad,
        knob: leftJoystickKnob
      },
      right: {
        active: false,
        pointerId: null,
        x: 0,
        y: 0,
        maxDistance: 34,
        pad: rightJoystickPad,
        knob: rightJoystickKnob
      }
    };


    /*
      EXPANDABLE SHELL MENU
      Add game-specific tabs with:
      MobileArcadeShell.registerMenuTab("map", "Map", "<h3>Map</h3><p>Map content...</p>");
      Update default tabs with:
      MobileArcadeShell.updateMenuTab("instructions", "<h3>How to Play</h3><p>New instructions...</p>");
    */
    const shellMenuTabs = [
      {
        id: "pause",
        label: "Pause",
        html: `
          <h3>Pause</h3>
          <p>Take a break, return to the player menu, or keep playing.</p>
          <div class="pauseMenuActions">

        Either way, this template stores only each player's best score.

      if (!savedData || typeof savedData !== "object") {
        return { players: {}, selectedPlayer: null };
      }

      if (
        savedData.players &&
        typeof savedData.players === "object" &&
        !Array.isArray(savedData.players)
      ) {
        return {
          players: cleanPlayers(savedData.players),
          selectedPlayer: savedData.selectedPlayer || null
        };
      }

      return {
        players: cleanPlayers(savedData),
        selectedPlayer: null
      };

    function sendStorageMessageToWix(type, payload = {}) {
      if (!window.parent || window.parent === window) {
        return false;
      }

      window.parent.postMessage({
        source: STORAGE_MESSAGE_SOURCE,
        type,
        storageKey: STORAGE_KEY,
        ...payload
      }, "*");

      return true;
    }

        this fallback keeps the old desktop/localStorage behavior working.

      if (askedWixParent) {

        }, 600);

      */
      try {

      sendStorageMessageToWix("ARCADE_STORAGE_SAVE", { payload });

    function joystickPointFromEvent(event, stick) {
      const rect = stick.pad.getBoundingClientRect();

      return {
        x: (event.clientX - rect.left) / appScale,
        y: (event.clientY - rect.top) / appScale
      };
    }

    function setJoystickFromEvent(event, stick) {
      const point = joystickPointFromEvent(event, stick);

      const centerX = stick.pad.offsetWidth / 2;
      const centerY = stick.pad.offsetHeight / 2;

      const limitedX = clamp(point.x, centerX - stick.maxDistance, centerX + stick.maxDistance);
      const limitedY = clamp(point.y, centerY - stick.maxDistance, centerY + stick.maxDistance);

      const dx = limitedX - centerX;
      const dy = limitedY - centerY;

      stick.x = dx / stick.maxDistance;
      stick.y = dy / stick.maxDistance;

      stick.knob.style.left = `${centerX + dx}px`;
      stick.knob.style.top = `${centerY + dy}px`;
    }

    function resetJoystick(stick) {
      stick.active = false;
      stick.pointerId = null;
      stick.x = 0;
      stick.y = 0;

      stick.knob.style.left = `${stick.pad.offsetWidth / 2}px`;
      stick.knob.style.top = `${stick.pad.offsetHeight / 2}px`;
    }

    function bindJoystick(stick) {
      stick.pad.addEventListener("pointerdown", event => {
        event.preventDefault();

        stick.active = true;
        stick.pointerId = event.pointerId;

        stick.pad.setPointerCapture(event.pointerId);
        setJoystickFromEvent(event, stick);
      });

      stick.pad.addEventListener("pointermove", event => {
        if (!stick.active || event.pointerId !== stick.pointerId) return;

        event.preventDefault();
        setJoystickFromEvent(event, stick);
      });

      stick.pad.addEventListener("pointerup", event => {
        if (event.pointerId !== stick.pointerId) return;

        event.preventDefault();

        if (stick.pad.hasPointerCapture(event.pointerId)) {
          stick.pad.releasePointerCapture(event.pointerId);
        }

        resetJoystick(stick);
      });

      stick.pad.addEventListener("pointercancel", () => resetJoystick(stick));
    }

    function getAudio() {

        if (!AudioContextClass) return null;

    function beep(freq, duration, type = "sine", volume = 0.08) {
      const ac = getAudio();
      if (!ac) return;

      const osc = ac.createOscillator();
      const gain = ac.createGain();

      osc.type = type;
      osc.frequency.value = freq;

      gain.gain.setValueAtTime(volume, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);

      osc.connect(gain);
      gain.connect(ac.destination);

      osc.start();
      osc.stop(ac.currentTime + duration);
    }

    /*

    const PP_LANES = [

    const PP_LOW_MIDI = 48;  // C3
    const PP_HIGH_MIDI = 72; // C5
    const pitchPool = [];

    for (let midi = PP_LOW_MIDI; midi <= PP_HIGH_MIDI; midi++) {
      const noteName = PP_NOTE_NAMES[midi % 12];
      const octave = Math.floor(midi / 12) - 1;
      pitchPool.push({
        name: `${noteName}${octave}`,
        midi,
        freq: 440 * Math.pow(2, (midi - 69) / 12)

    const PP_FRAME_STEP = 1 / 60;
    const PP_CATCHUP_PER_FRAME = 1 / 240;
    const PP_MAX_TIME_DEBT = 0.22;
    let phase = "idle";
    let phaseTimer = 0;

    function gameInit() {
      setScore(0);
      shipLane = 1;
      shipY = PP_LANES[shipLane].y;
      laneGlowY = PP_LANES[shipLane].y;
      portalX = PP_W + 85;

      nextPitchIndex = PP_START_PITCH_INDEX;
      correctLane = 1;
      pitchDuration = 0.65;
      resetDirectionBalance();
      flashFrames = 0;
      lastFrameTime = 0;
      timeDebt = 0;
      phase = "firstPitchDelay";
      phaseTimer = 0.75;
      makeStars();
      setMessage("Listen for Middle C...");
    }

    function gameStop() {
      portalActive = false;
      portalChecked = false;
      phase = "idle";
      phaseTimer = 0;
      lastFrameTime = 0;
      timeDebt = 0;
    }

    function gameInput(action) {
      if (action === "up") moveShip("up");
      if (action === "down") moveShip("down");
      if (action === "left") moveShip("up");
      if (action === "right") moveShip("down");

      if (action === "a") {
        const index = firstPortal ? previousPitchIndex : nextPitchIndex;
        safePlayPitch(pitchPool[index].freq, 0.42);
      }
    }

    canvas.addEventListener("pointerdown", event => {
      if (!running || shellMenu.classList.contains("open")) return;
      event.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const y = (event.clientY - rect.top) * (canvas.height / rect.height);
      const third = canvas.height / 3;
      if (y < third) shipLane = 0;
      else if (y < third * 2) shipLane = 1;
      else shipLane = 2;
    });

    function gameUpdate() {
      const now = performance.now();
      const elapsed = lastFrameTime ? (now - lastFrameTime) / 1000 : PP_FRAME_STEP;
      lastFrameTime = now;

      // Mobile button taps can briefly delay requestAnimationFrame.
      // A full catch-up makes the portal jump forward; throwing time away makes
      // repeated taps slow the game down. So we keep small timing debt and repay
      // it gradually over several frames.
      const clampedElapsed = Math.max(0, Math.min(elapsed, 0.12));
      const baseDt = Math.min(clampedElapsed, PP_FRAME_STEP);
      timeDebt = Math.min(
        PP_MAX_TIME_DEBT,
        timeDebt + Math.max(0, clampedElapsed - PP_FRAME_STEP)
      );
      const catchupDt = Math.min(timeDebt, PP_CATCHUP_PER_FRAME);
      timeDebt -= catchupDt;
      const dt = baseDt + catchupDt;

      maybeSendLeftJoystickInput();

      stars.forEach(star => {
        star.x -= (star.speed + portalSpeed * 0.05) * dt * 60;
        if (star.x < -8) {
          star.x = PP_W + 8;
          star.y = Math.random() * PP_H;
        }
      });

      const targetLaneY = PP_LANES[shipLane].y;
      shipY += (targetLaneY - shipY) * 0.24;
      laneGlowY += (targetLaneY - laneGlowY) * 0.24;

      if (phaseTimer > 0) {
        phaseTimer -= dt;
        if (phaseTimer <= 0) advancePhase();
      }

      if (portalActive) {
        portalX -= portalSpeed * dt * 60;

        if (!portalChecked && portalX <= PP_SHIP_X + 30) {
          portalChecked = true;
          checkPortal();
        }

        if (portalX < -65) {
          endGame("Missed portal!");
          return;
        }
      }

      if (flashFrames > 0) flashFrames--;
    }

    function gameDraw() {
      ctx.clearRect(0, 0, PP_W, PP_H);
      drawSpace();
      drawLaneGlow();
      drawPortals();
      drawShip();

      if (flashFrames > 0) {
        ctx.fillStyle = `rgba(255,255,255,${flashFrames / 25})`;
        ctx.fillRect(0, 0, PP_W, PP_H);
      }
    }

    function advancePhase() {
      if (phase === "firstPitchDelay") {
        safePlayPitch(pitchPool[previousPitchIndex].freq, 0.65);
        setMessage("First portal: fly through =");
        portalX = PP_W + 85;
        portalActive = true;
        portalChecked = false;
        phase = "firstPortal";
        return;
      }

      if (phase === "waitingPitch") {
        chooseNextPitch();
        portalX = PP_W + 85;
        pitchDuration = getPitchDurationToHalfway();
        safePlayPitch(pitchPool[nextPitchIndex].freq, pitchDuration);
        setMessage("Higher, same, or lower?");
        portalActive = true;
        portalChecked = false;
        phase = "portalActive";
      }
    }

    function checkPortal() {
      portalActive = false;

      if (firstPortal) {
        firstPortal = false;
        setScore(score + 1);
        soundCorrect();
        flashFrames = 10;
        scheduleNextPitchAndPortal();
        return;
      }

      if (shipLane === correctLane) {
        setScore(score + 1);
        previousPitchIndex = nextPitchIndex;
        portalSpeed += 0.08;
        soundCorrect();
        flashFrames = 10;
        if (score % 10 === 0) soundWin();
        scheduleNextPitchAndPortal();
      } else {
        endGame("Wrong portal!");
      }
    }

    function scheduleNextPitchAndPortal() {
      setMessage("Listen...");
      phase = "waitingPitch";
      phaseTimer = Math.max(0.28, 0.82 - score * 0.01);
    }

    function getPitchDurationToHalfway() {
      const travelDistance = portalX - (PP_SHIP_X + 30);
      const framesUntilPortal = Math.max(1, travelDistance / Math.max(0.1, portalSpeed));
      const secondsUntilPortal = framesUntilPortal / 60;
      return Math.max(0.22, Math.min(0.75, secondsUntilPortal * 0.5));
    }

    function resetDirectionBalance() {
      directionCounts = { higher: 0, same: 0, lower: 0 };
    }

    function randomIntInclusive(min, max) {
      return min + Math.floor(Math.random() * (max - min + 1));
    }

    function chooseNextPitch() {
      const availableDirections = ["same"];

      if (previousPitchIndex < pitchPool.length - 1) availableDirections.push("higher");
      if (previousPitchIndex > 0) availableDirections.push("lower");

      const lowestCount = Math.min(...availableDirections.map(dir => directionCounts[dir] || 0));
      const leastUsedDirections = availableDirections.filter(dir => (directionCounts[dir] || 0) === lowestCount);
      const chosenDirection = leastUsedDirections[Math.floor(Math.random() * leastUsedDirections.length)];

      if (chosenDirection === "higher") {
        nextPitchIndex = randomIntInclusive(previousPitchIndex + 1, pitchPool.length - 1);
        correctLane = 0;
      } else if (chosenDirection === "lower") {
        nextPitchIndex = randomIntInclusive(0, previousPitchIndex - 1);
        correctLane = 2;
      } else {
        nextPitchIndex = previousPitchIndex;
        correctLane = 1;
      }

      directionCounts[chosenDirection] = (directionCounts[chosenDirection] || 0) + 1;
    }

    function moveShip(dir) {
      if (dir === "up") shipLane = Math.max(0, shipLane - 1);
      if (dir === "down") shipLane = Math.min(2, shipLane + 1);
    }

    function joystickDirection(stick) {
      const ax = Math.abs(stick.x);
      const ay = Math.abs(stick.y);
      if (Math.max(ax, ay) < 0.5) return "";
      if (ay < ax) return "";
      return stick.y < 0 ? "up" : "down";
    }

    function maybeSendLeftJoystickInput() {
      const direction = joystickDirection(sticks.left);
      if (!direction) {
        leftStickLastDirection = "";
        return;
      }

      const now = performance.now();
      if (direction !== leftStickLastDirection || now - leftStickLastInput > 260) {
        leftStickLastDirection = direction;
        leftStickLastInput = now;
        moveShip(direction);
      }
    }

    function makeStars() {
      stars = [];
      for (let i = 0; i < 55; i++) {
        stars.push({
          x: Math.random() * PP_W,
          y: Math.random() * PP_H,
          size: Math.random() < 0.8 ? 1.5 : 2.4,
          speed: 0.45 + Math.random() * 1.4
        });
      }
    }

    function drawSpace() {
      ctx.fillStyle = "#050816";
      ctx.fillRect(0, 0, PP_W, PP_H);

      ctx.save();
      ctx.globalAlpha = 0.17;
      ctx.fillStyle = "#2563eb";
      ctx.fillRect(245, 48, 86, 34);
      ctx.fillRect(270, 35, 38, 86);
      ctx.fillStyle = "#7c3aed";
      ctx.fillRect(260, 80, 94, 35);
      ctx.fillStyle = "#60a5fa";
      ctx.fillRect(295, 68, 36, 36);
      ctx.restore();

      stars.forEach(star => {
        ctx.fillStyle = star.size < 2 ? "#dbeafe" : "#fef3c7";
        ctx.fillRect(Math.round(star.x), Math.round(star.y), star.size, star.size);
      });

      ctx.fillStyle = "rgba(30, 64, 175, 0.28)";
      ctx.fillRect(0, 0, PP_W, 8);
      ctx.fillRect(0, PP_H - 8, PP_W, 8);
    }

    function drawLaneGlow() {
      // Draw fixed lane guides first.
      PP_LANES.forEach(lane => {
        ctx.strokeStyle = "rgba(255,255,255,0.09)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, lane.y);
        ctx.lineTo(PP_W, lane.y);
        ctx.stroke();
      });

      // The selected-lane glow eases with the ship instead of snapping instantly.
      // This prevents the whole playfield from appearing to jump when pressing up/down.
      ctx.strokeStyle = "rgba(255,224,138,0.52)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, laneGlowY);
      ctx.lineTo(PP_W, laneGlowY);
      ctx.stroke();
    }

    function drawPortals() {
      if (!portalActive) return;
      const stablePortalX = Math.round(portalX * 2) / 2;
      if (firstPortal) {
        drawPortal(stablePortalX, PP_LANES[1].y, "●");
        return;
      }
      drawPortal(stablePortalX, PP_LANES[0].y, "↑");
      drawPortal(stablePortalX, PP_LANES[1].y, "=");
      drawPortal(stablePortalX, PP_LANES[2].y, "↓");
    }

    function drawPortal(x, y, symbol) {
      const pulse = Math.sin(performance.now() / 90) * 2.5;
      ctx.save();
      ctx.translate(x, y);

      ctx.strokeStyle = "#60a5fa";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(0, 0, 24 + pulse, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = "rgba(147,197,253,0.55)";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, 0, 17.5 - pulse * 0.35, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = "rgba(37,99,235,0.18)";
      ctx.beginPath();
      ctx.arc(0, 0, 21, 0, Math.PI * 2);
      ctx.fill();

      drawPortalSymbol(symbol);

      ctx.restore();
    }

    function drawPortalSymbol(symbol) {
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#111827";
      ctx.fillStyle = "white";

      if (symbol === "↑" || symbol === "↓") {
        const flip = symbol === "↑" ? 1 : -1;

        // Shadow/backing stroke first, then white stroke on top.
        ctx.lineWidth = 7;
        drawCenteredArrowPath(flip);
        ctx.stroke();

        ctx.strokeStyle = "white";
        ctx.lineWidth = 4;
        drawCenteredArrowPath(flip);
        ctx.stroke();

        ctx.restore();
        return;
      }

      if (symbol === "=") {
        ctx.lineWidth = 7;
        drawCenteredEqualsPath();
        ctx.stroke();

        ctx.strokeStyle = "white";
        ctx.lineWidth = 4;
        drawCenteredEqualsPath();
        ctx.stroke();

        ctx.restore();
        return;
      }

      // First-portal dot: centered filled circle with a dark outline.
      ctx.beginPath();
      ctx.arc(0, 0, 6.5, 0, Math.PI * 2);
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.fill();

      ctx.restore();
    }

    function drawCenteredArrowPath(flip) {
      ctx.beginPath();
      ctx.moveTo(0, 9 * flip);
      ctx.lineTo(0, -9 * flip);
      ctx.moveTo(0, -9 * flip);
      ctx.lineTo(-7, -2 * flip);
      ctx.moveTo(0, -9 * flip);
      ctx.lineTo(7, -2 * flip);
    }

    function drawCenteredEqualsPath() {
      ctx.beginPath();
      ctx.moveTo(-9, -5);
      ctx.lineTo(9, -5);
      ctx.moveTo(-9, 5);
      ctx.lineTo(9, 5);
    }

    function drawShip() {
      const x = PP_SHIP_X;
      const y = shipY;
      ctx.save();
      ctx.translate(x, y);

      ctx.fillStyle = "#2563eb";
      ctx.fillRect(-22, -14, 11, 8);
      ctx.fillRect(-22, 6, 11, 8);

      ctx.fillStyle = "#60a5fa";
      ctx.fillRect(-18, -8, 29, 16);

      ctx.fillStyle = "#111827";
      ctx.fillRect(-18, -8, 29, 3);
      ctx.fillRect(-18, 5, 29, 3);
      ctx.fillRect(-22, -14, 11, 3);
      ctx.fillRect(-22, 11, 11, 3);

      ctx.fillStyle = "#e0f2fe";
      ctx.fillRect(-3, -5, 8, 10);
      ctx.fillStyle = "#111827";
      ctx.fillRect(4, -4, 2, 8);

      ctx.fillStyle = "#facc15";
      ctx.fillRect(11, -6, 11, 12);
      ctx.fillStyle = "#111827";
      ctx.fillRect(18, -4, 4, 8);

      ctx.fillStyle = "#fb923c";
      ctx.fillRect(-30, -5, 9 + Math.floor(Math.random() * 5), 10);
      ctx.fillStyle = "#fef3c7";
      ctx.fillRect(-36, -2, 7 + Math.floor(Math.random() * 4), 4);

      ctx.restore();
    }

    function safePlayPitch(freq, duration) {
      try {
        const ac = getAudio();
        if (!ac) return;

        const now = ac.currentTime;
        const attack = 0.012;
        const release = 0.045;
        const endTime = now + Math.max(0.08, duration);
        const releaseStart = Math.max(now + attack, endTime - release);

        const output = ac.createGain();
        output.gain.setValueAtTime(0.0001, now);
        output.gain.linearRampToValueAtTime(0.205, now + attack);
        output.gain.setValueAtTime(0.205, releaseStart);
        output.gain.linearRampToValueAtTime(0.0001, endTime);
        output.connect(ac.destination);

        const square = ac.createOscillator();
        square.type = "square";
        square.frequency.setValueAtTime(freq, now);

        square.connect(output);
        square.start(now);
        square.stop(endTime + 0.02);

        setTimeout(() => {
          try { square.disconnect(); } catch (err) {}
          try { output.disconnect(); } catch (err) {}
        }, Math.ceil((duration + 0.12) * 1000));
      } catch (err) {}
    }

    window.MobileArcadeShell = {
      canvas,
      ctx,
      sticks,
      setScore,
      addScore,
      setMessage,
      endGame,
      soundCorrect,
      soundWin,
      soundLose,
      getAudio,
      savePlayers,
      loadPlayers,
      openMenu: openShellMenu,
      closeMenu: closeShellMenu,
      exitToPlayerMenu,
      saveCurrentScoreForSelectedPlayer,
      registerMenuTab: registerShellMenuTab,
      updateMenuTab: updateShellMenuTab
    };

    scaleAppToFrame();
    loadPlayers();
    resetJoystick(sticks.left);
    resetJoystick(sticks.right);
    gameInit();
    gameDraw();
  </script>
</body>
</html>
