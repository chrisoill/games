      height: mix("height"),
      font: mix("font"),
      pitchOffset: mix("pitchOffset"),

      curveScale: mix("curveScale"),
      lineWidth: mix("lineWidth"),
      stemWidth: mix("stemWidth"),
      minGapX: mix("minGapX"),
      minGapY: mix("minGapY")

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#101827";
      }

      function tieGameDrawGlyph(glyph, x, y, size, align = "center") {
        ctx.save();
        tieGameSetSmuflFont(size);
        ctx.textAlign = align;
        ctx.fillText(glyph, x, y);
        ctx.restore();
      }

      function tieGameDrawNote(x, y, rhythm, style) {
        const isWhole = rhythm === "whole";
        const isHalf = rhythm === "half";
        const hasStem = !isWhole;
        const hasFlag = rhythm === "eighth";
        const notehead = isWhole
          ? TIE_GAME_GLYPHS.noteheadWhole
          : isHalf
            ? TIE_GAME_GLYPHS.noteheadHalf
            : TIE_GAME_GLYPHS.noteheadBlack;

        ctx.save();
        tieGameSetSmuflFont(style.font);
        const metrics = ctx.measureText(notehead);
        const rightEdge = x + (metrics.actualBoundingBoxRight || metrics.width * 0.5);
        const visualTop = y - (metrics.actualBoundingBoxAscent || style.font * 0.18);
        ctx.restore();

        tieGameDrawGlyph(notehead, x, y, style.font);

        if (hasStem) {
          const edgeOverlap = Math.max(0.55, 1.15 * style.curveScale);
          const stemX = rightEdge - edgeOverlap;
          const stemBottomY = y - Math.max(0.8, 1.8 * style.curveScale);
          const stemTopY = visualTop - style.stemExtra;

          ctx.save();
          ctx.strokeStyle = "#101827";
          ctx.lineWidth = style.stemWidth;
          ctx.lineCap = "butt";
          ctx.beginPath();
          ctx.moveTo(stemX, stemBottomY);
          ctx.lineTo(stemX, stemTopY);
          ctx.stroke();
          ctx.restore();

          if (hasFlag) {
            tieGameDrawGlyph(TIE_GAME_GLYPHS.flag8thUp, stemX, stemTopY, style.font, "left");
          }
        }
      }

      function tieGameCurveEndpointShift(noteY, lowestNoteY) {
        return -(lowestNoteY - noteY) * 0.32;
      }

      function tieGameDrawCurve(x1, x2, note1Y, note2Y, style) {
        const scale = style.curveScale;
        const startX = x1 + Math.max(0.5, scale);
        const endX = x2 - Math.max(0.5, scale);
        const span = endX - startX;
        const lowestNoteY = Math.max(note1Y, note2Y);

        const isTie = Math.abs(note1Y - note2Y) < 0.001;
        const slurLift = isTie ? 0 : 1.25 * scale;
        const endpointBaseY = lowestNoteY + 10.8 * scale - slurLift;
        const startY = endpointBaseY + tieGameCurveEndpointShift(note1Y, lowestNoteY);
        const endY = endpointBaseY + tieGameCurveEndpointShift(note2Y, lowestNoteY);
        const outerBowlY = lowestNoteY + 22.3 * scale - slurLift;
        const innerBowlY = lowestNoteY + 18.8 * scale - slurLift;

        ctx.save();
        ctx.fillStyle = "#101827";
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.bezierCurveTo(
          startX + span * 0.29, outerBowlY,
          startX + span * 0.71, outerBowlY,
          endX, endY
        );
        ctx.bezierCurveTo(
          startX + span * 0.71, innerBowlY,
          startX + span * 0.29, innerBowlY,
          startX, startY
        );
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

  function tieGameDrawExample(example, index) {
    const { x, y, width, height, style } = example;
    const lineY = y + height * 0.56;
    const lineInset = Math.max(3, width * 0.06);
    const lineStartX = x + lineInset;
    const lineEndX = x + width - lineInset;
    const note1X = x + width * 0.31;
    const note2X = x + width * 0.69;
    const note1Y = tieGamePitchY(lineY, example.p1, style.pitchOffset);
    const note2Y = tieGamePitchY(lineY, example.p2, style.pitchOffset);
    const transform = tieGamePowerTransform(example, index);
    const cx = x + width / 2;
    const cy = y + height / 2;

    ctx.save();
    ctx.globalAlpha *= transform.alpha;
    ctx.translate(cx + transform.dx, cy + transform.dy);
    ctx.rotate(transform.rotation);
    ctx.scale(transform.scaleX || 1, transform.scaleY || 1);
    ctx.translate(-cx, -cy);

    const chickenSlur = tieGamePowerEffect?.id === "chickenRun" && tieGamePowerEffect.affected.includes(index);
    if (chickenSlur) {
      tieGameDrawChickenCharacter(example, false, tieGameAmbientTime / 12 + index * 0.7);
      ctx.restore();
      return;
    }

    ctx.strokeStyle = "#101827";
    ctx.lineWidth = style.lineWidth;
    ctx.beginPath();
    ctx.moveTo(lineStartX, lineY);
    ctx.lineTo(lineEndX, lineY);
    ctx.stroke();

    tieGameDrawNote(note1X, note1Y, example.r1, style);
    tieGameDrawNote(note2X, note2Y, example.r2, style);
    tieGameDrawCurve(note1X, note2X, note1Y, note2Y, style);

    if (tieGamePowerEffect?.id === "achoo" && example.isTie) {
      tieGameDrawAchooFace(note1X, note1Y, note2X, note2Y, style);
    }
    tieGameDrawBusinessCharacter(example, index);
    tieGameDrawDamageMarks(example);
    ctx.restore();
  }

  function tieGameMakeTie() {
        const pitch = tieGameRandomChoice(TIE_GAME_PITCHES);
        return {
          isTie: true,
          p1: pitch,
          p2: pitch,
          r1: tieGameRandomChoice(TIE_GAME_RHYTHMS),
          r2: tieGameRandomChoice(TIE_GAME_RHYTHMS)
        };
      }

      function tieGameMakeSlur() {
        const pair = tieGameRandomChoice(TIE_GAME_SLUR_PAIRS);
        return {
          isTie: false,
          p1: pair[0],
          p2: pair[1],
          r1: tieGameRandomChoice(TIE_GAME_RHYTHMS),
          r2: tieGameRandomChoice(TIE_GAME_RHYTHMS)
        };
      }

      function tieGameRoundExampleCount() {
        return Math.min(TIE_GAME_MAX_CHOICES, tieGameRound);
      }
      function tieGameRoundDurationMs() {
        const upgradedDuration = TIE_GAME_FULL_BOARD_TIME_MS + tieGamePermanentBonusTimeMs;

        // Through Round 100, permanent Bonus Time upgrades increase the round
        // maximum from 30s toward 60s. Round 101+ is survival mode: the fully
        // upgraded timer gets progressively shorter until the true 6s floor.
        if (tieGameRound <= TIE_GAME_MAX_CHOICES) return upgradedDuration;

        const speedStage = tieGameRound - TIE_GAME_MAX_CHOICES;
        return Math.max(
          TIE_GAME_MIN_TIME_MS,
          upgradedDuration - speedStage * TIE_GAME_TIME_STEP_MS
        );
      }

      /* Build a genuinely free-scattered, collision-free layout EVERY round.
     There are no rows, columns, slots, bands, or grid anchors. Each candidate
     gets an independent random X/Y coordinate anywhere inside the playfield.
     If it touches an existing example, reject it and roll a new coordinate. */
  function tieGamePlacementsOverlap(a, b, gapX, gapY) {
    return !(
      a.x + a.width + gapX <= b.x ||
      b.x + b.width + gapX <= a.x ||
      a.y + a.height + gapY <= b.y ||
      b.y + b.height + gapY <= a.y
    );
  }

  function tieGameTryRandomScatter(total, style) {
    const left = TIE_GAME_LAYOUT_LEFT;
    const right = GAME_CANVAS_LOGICAL_WIDTH - TIE_GAME_LAYOUT_RIGHT;
    const top = TIE_GAME_LAYOUT_TOP;
    const bottom = GAME_CANVAS_LOGICAL_HEIGHT - TIE_GAME_LAYOUT_BOTTOM;
    const maxX = right - style.width;
    const maxY = bottom - style.height;
    const placements = [];
    const attemptsPerExample = total <= 30 ? 1800 : total <= 60 ? 2800 : 4200;

    for (let index = 0; index < total; index += 1) {
      let placed = false;

      for (let attempt = 0; attempt < attemptsPerExample; attempt += 1) {
        const candidate = {
          x: tieGameRandomBetween(left, maxX),
          y: tieGameRandomBetween(top, maxY),
          width: style.width,
          height: style.height,
          style
        };

        const collides = placements.some(existing =>
          tieGamePlacementsOverlap(candidate, existing, style.minGapX, style.minGapY)
        );

        if (!collides) {
          placements.push(candidate);
          placed = true;
          break;
        }
      }

      if (!placed) return null;
    }

    return placements;
  }

  function tieGameGeneratePlacements(total, style) {
    // Restart the entire scatter if random placement paints itself into a
    // corner. A restart is also fully random, so no hidden grid fallback exists.
    const maxRestarts = 36;
    for (let restart = 0; restart < maxRestarts; restart += 1) {
      const placements = tieGameTryRandomScatter(total, style);
      if (placements) return tieGameShuffle(placements);
    }

    // With the continuous density-aware shrink this should be exceptionally
    // rare. If it does happen, retry indefinitely with fresh random coordinates
    // rather than falling back to rows or a deterministic grid.
    while (true) {
      const placements = tieGameTryRandomScatter(total, style);
      if (placements) return tieGameShuffle(placements);
    }
  }

  function tieGameBuildRound() {
        const total = tieGameRoundExampleCount();
        const style = tieGameGetSizeStyle(total);
        const examples = [tieGameMakeTie()];
        while (examples.length < total) examples.push(tieGameMakeSlur());

        const shuffledExamples = tieGameShuffle(examples);
        const freshPlacements = tieGameGeneratePlacements(total, style);
        tieGameLayoutSerial += 1;

        tieGameExamples = shuffledExamples.map((example, index) => ({
          ...example,
          ...freshPlacements[index],
          layoutSerial: tieGameLayoutSerial
        }));

        tieGameRoundAssisted = false;
        tieGameMilestoneUpgrade = null;
        tieGamePendingRoundAdvance = false;
        tieGameTimeLimitMs = tieGameRoundDurationMs();
        tieGameTimeRemainingMs = tieGameTimeLimitMs;
        tieGameInputCooldownSteps = 8;
        tieGameFeedback = null;
        tieGameGrandSpotlight = null;
        tieGameChickenRun = null;
        tieGameEntrySteps = TIE_GAME_ENTRANCE_STEPS;

        if (typeof setMessage === "function") {
          setMessage("FIND THE TIE");
        }
      }

      function tieGameClamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function tieGameRoundRectPath(x, y, width, height, radius) {
        const r = Math.max(0, Math.min(radius, width * 0.5, height * 0.5));
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + width, y, x + width, y + height, r);
        ctx.arcTo(x + width, y + height, x, y + height, r);
        ctx.arcTo(x, y + height, x, y, r);
        ctx.arcTo(x, y, x + width, y, r);
        ctx.closePath();
      }

      function tieGameEntryRatio() {
        return tieGameClamp(1 - tieGameEntrySteps / TIE_GAME_ENTRANCE_STEPS, 0, 1);
      }

      function tieGameDrawBackdrop() {
    ctx.save();
    const bg = ctx.createLinearGradient(0, 0, 0, GAME_CANVAS_LOGICAL_HEIGHT);
    bg.addColorStop(0, "#fbfdff");
    bg.addColorStop(0.55, "#eef7fb");
    bg.addColorStop(1, "#e1f0f7");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);

    const wash = ctx.createLinearGradient(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);
    wash.addColorStop(0, "rgba(186, 230, 253, 0.12)");
    wash.addColorStop(0.5, "rgba(255,255,255,0.00)");
    wash.addColorStop(1, "rgba(153, 246, 228, 0.10)");
    ctx.fillStyle = wash;
    ctx.fillRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);

    const t = tieGameAmbientTime;
    const glows = [
      { x: 120, y: 94, r: 92, dx: 14, dy: 8, speed: 0.010, color: "rgba(56, 189, 248, 0.11)" },
      { x: 600, y: 116, r: 108, dx: 18, dy: 10, speed: 0.013, color: "rgba(45, 212, 191, 0.10)" },
      { x: 170, y: 420, r: 126, dx: 18, dy: 9, speed: 0.008, color: "rgba(129, 140, 248, 0.08)" },
      { x: 565, y: 386, r: 116, dx: 16, dy: 11, speed: 0.011, color: "rgba(250, 204, 21, 0.06)" }
    ];
    glows.forEach((glow, index) => {
      const gx = glow.x + Math.cos(t * glow.speed + index) * glow.dx;
      const gy = glow.y + Math.sin(t * glow.speed * 1.2 + index * 0.8) * glow.dy;
      const grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, glow.r);
      grad.addColorStop(0, glow.color);
      grad.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(gx, gy, glow.r, 0, Math.PI * 2);
      ctx.fill();
    });

    // Intentional slim separators framing the search area.
    ctx.strokeStyle = "rgba(30, 41, 59, 0.18)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(18, 40);
    ctx.lineTo(GAME_CANVAS_LOGICAL_WIDTH - 18, 40);
    ctx.moveTo(18, GAME_CANVAS_LOGICAL_HEIGHT - 40);
    ctx.lineTo(GAME_CANVAS_LOGICAL_WIDTH - 18, GAME_CANVAS_LOGICAL_HEIGHT - 40);
    ctx.stroke();
    ctx.restore();
  }

  function tieGameDrawTimer() {
    const ratio = tieGameTimeLimitMs > 0
      ? Math.max(0, Math.min(1, tieGameTimeRemainingMs / tieGameTimeLimitMs))
      : 0;
    const seconds = Math.ceil(tieGameTimeRemainingMs / 1000);
    const frozen = tieGameFreezeSteps > 0;
    const rewinding = tieGamePowerEffect?.id === "rewind";
    const bonusBurst = tieGamePowerEffect?.id === "bonusTime";
    const effectP = tieGamePowerEffect ? tieGameEffectProgress() : 0;
    const stretch = bonusBurst ? Math.sin(Math.PI * Math.min(1, effectP)) * 22 : 0;
    ctx.save();

    // Treat the top HUD as one compact baseline: label, bar and seconds all share
    // the same optical center so upgrades never knock TIME out of alignment.
    const barX = 62;
    const barY = 15.5;
    const baseBarW = 566;
    const barW = baseBarW + stretch;
    const barH = 11;
    const hudCenterY = barY + barH * 0.5;

    const label = frozen ? "FROZEN" : rewinding ? "REWIND!" : "TIME";
    const labelColor = frozen ? "#1d4ed8" : rewinding ? "#7c3aed" : bonusBurst ? "#b45309" : "rgba(15, 23, 42, 0.80)";
    ctx.fillStyle = labelColor;
    ctx.font = "bold 11px Arial";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillText(label, 54, hudCenterY);
    tieGameRoundRectPath(barX, barY, barW, barH, 999);
    ctx.fillStyle = frozen ? "rgba(219,234,254,0.92)" : rewinding ? "rgba(237,233,254,0.76)" : bonusBurst ? "rgba(254,243,199,0.88)" : "rgba(255,255,255,0.54)";
    ctx.fill();

    const fillW = Math.max(8, barW * ratio);
    tieGameRoundRectPath(barX, barY, fillW, barH, 999);
    const fill = ctx.createLinearGradient(barX, barY, barX + barW, barY);
    if (frozen) {
      fill.addColorStop(0, "#e0f2fe");
      fill.addColorStop(0.45, "#7dd3fc");
      fill.addColorStop(1, "#3b82f6");
    } else if (rewinding) {
      fill.addColorStop(0, "#c4b5fd");
      fill.addColorStop(0.48, "#a855f7");
      fill.addColorStop(1, "#7c3aed");
    } else if (bonusBurst) {
      fill.addColorStop(0, "#fde68a");
      fill.addColorStop(0.50, "#f59e0b");
      fill.addColorStop(1, "#fbbf24");
    } else {
      fill.addColorStop(0, "#5eead4");
      fill.addColorStop(0.58, "#38bdf8");
      fill.addColorStop(1, "#818cf8");
    }
    ctx.fillStyle = fill;
    ctx.fill();

    if (rewinding) {
      // Animated reverse chevrons travel toward the newly filling end of the bar.
      ctx.save();
      ctx.beginPath();
      ctx.rect(barX, barY - 3, Math.max(0, fillW), barH + 6);
      ctx.clip();
      const shift = (tieGameAmbientTime * 2.4) % 34;
      ctx.strokeStyle = "rgba(255,255,255,0.80)";
      ctx.lineWidth = 2;
      for (let x = barX - 20 + shift; x < barX + fillW + 20; x += 34) {
        ctx.beginPath();
        ctx.moveTo(x - 5, barY + 2);
        ctx.lineTo(x + 2, barY + barH / 2);
        ctx.lineTo(x - 5, barY + barH - 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    if (bonusBurst) {
      // The timer physically stretches and throws clockwork sparks while its max grows.
      ctx.save();
      ctx.shadowColor = "rgba(245,158,11,0.75)";
      ctx.shadowBlur = 12;
      ctx.strokeStyle = "rgba(245,158,11,0.90)";
      ctx.lineWidth = 2;
      tieGameRoundRectPath(barX - 2, barY - 2, barW + 4, barH + 4, 999);
      ctx.stroke();
      ctx.shadowBlur = 0;
      const endX = barX + barW;
      ctx.fillStyle = "#f59e0b";
      for (let i = 0; i < 8; i += 1) {
        const a = i * Math.PI / 4 + effectP * 5;
        const r = 9 + (i % 3) * 4 + Math.sin(effectP * Math.PI) * 10;
        ctx.beginPath();
        ctx.arc(endX + Math.cos(a) * r, barY + barH / 2 + Math.sin(a) * r * 0.55, 2.1, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    if (frozen) {
      ctx.fillStyle = "rgba(239,248,255,0.96)";
      ctx.beginPath();
      ctx.moveTo(barX + 3, barY + 1);
      for (let x = barX + 3; x <= barX + baseBarW - 3; x += 18) {
        ctx.quadraticCurveTo(x + 5, barY - 3 - ((x / 18) % 2) * 2, x + 10, barY + 1);
      }
      ctx.lineTo(barX + baseBarW - 3, barY + 5);
      ctx.lineTo(barX + 3, barY + 5);
      ctx.closePath();
      ctx.fill();

      const icicles = [70, 116, 168, 224, 282, 344, 409, 477, 548, 608];
      ctx.fillStyle = "rgba(186,230,253,0.98)";
      ctx.strokeStyle = "rgba(59,130,246,0.40)";
      ctx.lineWidth = 1;
      icicles.forEach((x, i) => {
        const len = 7 + (i % 3) * 5;
        ctx.beginPath();
        ctx.moveTo(x - 5, barY + barH - 1);
        ctx.lineTo(x + 5, barY + barH - 1);
        ctx.lineTo(x + (i % 2 ? 1 : -1), barY + barH + len);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      });
    }

    ctx.font = "bold 18px Arial";
    ctx.textAlign = "right";
    ctx.fillStyle = frozen ? "#1d4ed8" : rewinding ? "#6d28d9" : bonusBurst ? "#b45309" : "#0f172a";
    ctx.fillText(`${seconds}s`, GAME_CANVAS_LOGICAL_WIDTH - 20, hudCenterY);

    ctx.textAlign = "left";
    ctx.font = "bold 13px Arial";
    ctx.fillStyle = "rgba(15, 23, 42, 0.78)";
    ctx.fillText(`ROUND ${tieGameRound}`, 20, GAME_CANVAS_LOGICAL_HEIGHT - 21);
    ctx.restore();
  }
  function tieGameEarnPower({ quietFull = false } = {}) {
    if (tieGamePowerInventory.length >= tieGamePowerBankMax) {
      if (!quietFull) tieGamePowerNotice = { text: "POWER BANK FULL", steps: 75 };
      return null;
    }
    const power = tieGameRandomChoice(TIE_GAME_POWER_CATALOG);
    const earned = { ...power };
    tieGamePowerInventory.push(earned);
    return earned;
  }

  function tieGameRollPowerDrop() {
    if (tieGameRoundAssisted) return null;
    if (tieGamePowerChance <= 0) return null;
    if (tieGamePowerInventory.length >= tieGamePowerBankMax) return null;
    if (Math.random() >= tieGamePowerChance) return null;
    const earned = tieGameEarnPower({ quietFull: true });
    if (earned) {
      tieGamePowerNotice = { text: "POWER FOUND!", steps: 75 };
      if (typeof soundMilestone === "function") soundMilestone();
    }
    return earned;
  }

  function tieGameApplyMilestoneUpgrade(completedRound) {
    if (completedRound <= 0 || completedRound > 100 || completedRound % 5 !== 0) return false;

    if (completedRound % 10 === 5) {
      const oldMax = tieGamePowerBankMax;
      tieGamePowerBankMax = Math.min(TIE_GAME_POWER_BANK_MAX, tieGamePowerBankMax + 1);
      if (tieGamePowerBankMax <= oldMax) return false;
      const freePower = tieGameEarnPower({ quietFull: true });
      tieGameMilestoneUpgrade = {
        kind: "slot", oldMax, newMax: tieGamePowerBankMax, freePower,
        totalSteps: 126, steps: 126
      };
      if (typeof soundPowerPowerUp === "function") soundPowerPowerUp();
      if (typeof soundMilestone === "function") soundMilestone();
      return true;
    }

    const oldChance = tieGamePowerChance;
    const oldBonus = tieGamePermanentBonusTimeMs;
    tieGamePowerChance = Math.min(TIE_GAME_POWER_CHANCE_MAX, Math.round((tieGamePowerChance + TIE_GAME_POWER_CHANCE_STEP) * 100) / 100);
    tieGamePermanentBonusTimeMs = Math.min(TIE_GAME_BONUS_TIME_MAX_MS, tieGamePermanentBonusTimeMs + TIE_GAME_BONUS_TIME_STEP_MS);
    tieGameMilestoneUpgrade = {
      kind: "stats", oldChance, newChance: tieGamePowerChance,
      oldBonus, newBonus: tieGamePermanentBonusTimeMs,
      totalSteps: completedRound === 100 ? 156 : 132,
      steps: completedRound === 100 ? 156 : 132,
      maxed: completedRound === 100
    };
    if (typeof soundPowerBonusTime === "function") soundPowerBonusTime();
    if (typeof soundPowerChanceUpgrade === "function") soundPowerChanceUpgrade(completedRound === 100);
    return true;
  }

  function tieGameUsePower(index) {
    if (tieGameFeedback || tieGamePowerEffect || tieGamePowerNoEffect) return false;
    if (index < 0 || index >= tieGamePowerInventory.length) return false;
    const power = tieGamePowerInventory[index];
    const noEffectMessage = tieGamePowerNoEffectMessage(power.id);
    if (noEffectMessage) {
      tieGamePowerNoEffect = { text: noEffectMessage, steps: 54, totalSteps: 54 };
      return false;
    }

    // Close the full-screen bank before the animation starts.
    tieGamePowerMenuOpen = false;
    tieGamePowerMenuHoldDir = 0;
    tieGamePowerMenuRepeatSteps = 0;
    if (!tieGameStartPowerEffect(power.id)) {
      tieGamePowerMenuOpen = true;
      return false;
    }
    tieGameRoundAssisted = true;
    tieGamePowerInventory.splice(index, 1);
    tieGamePowerMenuIndex = Math.max(0, Math.min(tieGamePowerMenuIndex, tieGamePowerInventory.length - 1));
    if (typeof soundPowerStart === "function") soundPowerStart(power.id);
    if (typeof setMessage === "function") setMessage(power.label);
    return true;
  }
  function tieGameTogglePowerMenu(force = null) {
    if (tieGamePowerEffect || tieGameFeedback || tieGameMilestoneUpgrade) return;
    if (tieGamePowerBankMax <= 0) {
      tieGamePowerMenuOpen = false;
      tieGamePowerNotice = { text: "POWER UNLOCKS AFTER ROUND 5", steps: 75 };
      return;
    }
    tieGamePowerMenuOpen = force === null ? !tieGamePowerMenuOpen : !!force;
    tieGamePowerMenuHoldDir = 0;
    tieGamePowerMenuRepeatSteps = 0;
    tieGamePowerNoEffect = null;
    if (tieGamePowerMenuOpen) {
      tieGamePowerMenuIndex = Math.max(0, Math.min(tieGamePowerMenuIndex, tieGamePowerInventory.length - 1));
      if (typeof setMessage === "function") setMessage(tieGamePowerInventory.length ? "POWER BANK  •  SELECT TO USE" : "POWER BANK  •  EMPTY");
    } else if (typeof setMessage === "function") {
      setMessage(`FIND THE TIE  •  ROUND ${tieGameRound}`);
    }
  }

  function tieGameStepPowerMenu(dir) {
    if (tieGamePowerInventory.length <= 1) return;
    tieGamePowerMenuIndex = (tieGamePowerMenuIndex + dir + tieGamePowerInventory.length) % tieGamePowerInventory.length;
  }

  function tieGameReadPowerMenuJoystick() {
    if (typeof sticks === "undefined" || !sticks?.left || tieGamePowerNoEffect) return;
    const x = Number(sticks.left.x || 0);
    const y = Number(sticks.left.y || 0);
    const absX = Math.abs(x);
    const absY = Math.abs(y);
    const dir = absX >= 0.48 && absX >= absY ? (x >= 0 ? 1 : -1) : 0;

    if (!dir) {
      tieGamePowerMenuHoldDir = 0;
      tieGamePowerMenuRepeatSteps = 0;
      return;
    }

    if (dir !== tieGamePowerMenuHoldDir) {
      tieGamePowerMenuHoldDir = dir;
      tieGamePowerMenuRepeatSteps = 15;
      tieGameStepPowerMenu(dir);
      return;
    }

    tieGamePowerMenuRepeatSteps -= 1;
    if (tieGamePowerMenuRepeatSteps <= 0) {
      tieGameStepPowerMenu(dir);
      // Stronger tilt repeats faster, but a held tilt always continues moving.
      tieGamePowerMenuRepeatSteps = Math.max(5, Math.round(12 - absX * 6));
    }
  }
  function tieGamePowerHudLayout() {
    const max = Math.max(0, tieGamePowerBankMax);
    const right = GAME_CANVAS_LOGICAL_WIDTH - 20;
    const centerY = GAME_CANVAS_LOGICAL_HEIGHT - 21;
    if (max <= 0) {
      return { max: 0, shown: 0, compact: false, maxWidth: 0, gap: 0, slotSize: 0, right, centerY, firstCenterX: right };
    }
    const compact = max > 9;
    const shown = compact ? Math.min(5, Math.max(1, tieGamePowerInventory.length)) : max;
    const maxWidth = compact ? 118 : 248;
    const gap = compact ? 5 : (max <= 8 ? 7 : 4);
    const slotSize = compact ? 12 : Math.max(10, Math.min(16, (maxWidth - gap * (max - 1)) / max));
    const firstCenterX = right - (shown - 1) * (slotSize + gap) - slotSize / 2;
    return { max, shown, compact, maxWidth, gap, slotSize, right, centerY, firstCenterX };
  }

  function tieGamePowerSlotRects() {
    const layout = tieGamePowerHudLayout();
    if (layout.shown <= 0) return [];
    return Array.from({ length: layout.shown }, (_, index) => {
      const cx = layout.firstCenterX + index * (layout.slotSize + layout.gap);
      return {
        x: cx - layout.slotSize / 2,
        y: layout.centerY - layout.slotSize / 2,
        width: layout.slotSize,
        height: layout.slotSize,
        index
      };
    });
  }

  function tieGamePowerMenuGeometry() {
    const total = tieGamePowerInventory.length;
    const pageCount = Math.max(1, Math.ceil(total / TIE_GAME_POWER_MENU_PAGE_SIZE));
    const safeIndex = total ? Math.max(0, Math.min(tieGamePowerMenuIndex, total - 1)) : 0;
    const page = total ? Math.floor(safeIndex / TIE_GAME_POWER_MENU_PAGE_SIZE) : 0;
    const startIndex = page * TIE_GAME_POWER_MENU_PAGE_SIZE;
    const endIndex = Math.min(total, startIndex + TIE_GAME_POWER_MENU_PAGE_SIZE);
    const pageItems = Math.max(0, endIndex - startIndex);
    const rows = Math.max(1, Math.ceil(pageItems / TIE_GAME_POWER_MENU_COLS));
    const colSpacing = 148;
    const rowSpacing = 102;
    const firstY = rows === 1 ? 270 : rows === 2 ? 220 : 168;
    const positions = [];

    for (let local = 0; local < pageItems; local += 1) {
      const row = Math.floor(local / TIE_GAME_POWER_MENU_COLS);
      const col = local % TIE_GAME_POWER_MENU_COLS;
      const rowStart = row * TIE_GAME_POWER_MENU_COLS;
      const rowCount = Math.min(TIE_GAME_POWER_MENU_COLS, pageItems - rowStart);
      const rowWidth = (rowCount - 1) * colSpacing;
      const x = GAME_CANVAS_LOGICAL_WIDTH / 2 - rowWidth / 2 + col * colSpacing;
      const y = firstY + row * rowSpacing;
      positions.push({ index: startIndex + local, x, y });
    }

    return { total, pageCount, page, startIndex, endIndex, positions };
  }

        const boxHeight = 30;
        const boxX = (GAME_CANVAS_LOGICAL_WIDTH - boxWidth) / 2;
        const boxY = GAME_CANVAS_LOGICAL_HEIGHT - boxHeight - 8;
        ctx.fillStyle = "rgba(16, 24, 39, 0.90)";
        ctx.fillRect(boxX, boxY, boxWidth, boxHeight);
        ctx.fillStyle = "#ffffff";
        ctx.fillText(label, GAME_CANVAS_LOGICAL_WIDTH / 2, boxY + boxHeight / 2 + 0.25);
        ctx.restore();
      }

  function tieGameSubmit(index) {
    if (tieGameFeedback) return;
    if (index < 0 || index >= tieGameExamples.length) return;

    const chosen = tieGameExamples[index];
    // Fairness rule for live powers: if the tie is visible while a power animation
    // is running, the player may always select it immediately. Never let a tiny
    // transition cooldown steal a correct answer while the round clock is live.
    const correctDuringPower = !!tieGamePowerEffect && chosen.isTie;
    if (tieGameInputCooldownSteps > 0 && !correctDuringPower) return;
    tieGameBeginFeedback(chosen.isTie ? "correct" : "wrong", index);
  }


  function tieGameExampleAtPoint(point) {
        return tieGameExamples.findIndex(example => (
          point.x >= example.x &&
          point.x <= example.x + example.width &&
          point.y >= example.y &&
          point.y <= example.y + example.height
        ));
      }
      const TIE_GAME_CURSOR_SPEED = 11.5;
      const TIE_GAME_CURSOR_RADIUS = 8;
      const TIE_GAME_CURSOR_DEAD_ZONE = 0.06;
      const TIE_GAME_CURSOR_RESPONSE_EXPONENT = 1.65;

      function tieGameReadJoystick() {
        if (typeof sticks === "undefined" || !sticks?.left) return;

        let x = Number(sticks.left.x || 0);
        let y = Number(sticks.left.y || 0);
        const magnitude = Math.hypot(x, y);

        if (magnitude <= TIE_GAME_CURSOR_DEAD_ZONE) return;

        // A curved response gives much finer slow-speed control near center,
        // while still reaching a slightly faster top speed at full deflection.
        const linearMagnitude = Math.min(
          1,
          (magnitude - TIE_GAME_CURSOR_DEAD_ZONE) / (1 - TIE_GAME_CURSOR_DEAD_ZONE)
        );
        const scaledMagnitude = Math.pow(linearMagnitude, TIE_GAME_CURSOR_RESPONSE_EXPONENT);
        const normalizer = magnitude > 0 ? scaledMagnitude / magnitude : 0;
        x *= normalizer;
        y *= normalizer;

        tieGameCursorX += x * TIE_GAME_CURSOR_SPEED;
        tieGameCursorY += y * TIE_GAME_CURSOR_SPEED;

        tieGameCursorX = Math.max(TIE_GAME_CURSOR_RADIUS, Math.min(GAME_CANVAS_LOGICAL_WIDTH - TIE_GAME_CURSOR_RADIUS, tieGameCursorX));
        tieGameCursorY = Math.max(TIE_GAME_CURSOR_RADIUS, Math.min(GAME_CANVAS_LOGICAL_HEIGHT - TIE_GAME_CURSOR_RADIUS, tieGameCursorY));
      }

      function tieGameDrawCursor() {
        if (tieGameFeedback) return;
        const overExample = tieGameExampleAtPoint({ x: tieGameCursorX, y: tieGameCursorY }) >= 0;
        ctx.save();
        ctx.strokeStyle = overExample ? "#1d4ed8" : "#111827";
        ctx.fillStyle = overExample ? "rgba(191, 219, 254, 0.92)" : "rgba(255,255,255,0.92)";
        ctx.lineWidth = 2.2;
        ctx.shadowColor = overExample ? "rgba(59,130,246,0.35)" : "transparent";
        ctx.shadowBlur = overExample ? 12 : 0;
        ctx.beginPath();
        ctx.arc(tieGameCursorX, tieGameCursorY, TIE_GAME_CURSOR_RADIUS + 1, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.shadowColor = "transparent";

        ctx.fillStyle = overExample ? "#1d4ed8" : "#111827";
        ctx.beginPath();
        ctx.arc(tieGameCursorX, tieGameCursorY, 2.6, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(tieGameCursorX - 12, tieGameCursorY);
        ctx.lineTo(tieGameCursorX - 5, tieGameCursorY);
        ctx.moveTo(tieGameCursorX + 5, tieGameCursorY);
        ctx.lineTo(tieGameCursorX + 12, tieGameCursorY);
        ctx.moveTo(tieGameCursorX, tieGameCursorY - 12);
        ctx.lineTo(tieGameCursorX, tieGameCursorY - 5);
        ctx.moveTo(tieGameCursorX, tieGameCursorY + 5);
        ctx.lineTo(tieGameCursorX, tieGameCursorY + 12);
        ctx.stroke();
        ctx.restore();
      }

      function gameInit() {
        tieGameRound = 1;
        tieGameCursorX = GAME_CANVAS_LOGICAL_WIDTH / 2;
        tieGameCursorY = GAME_CANVAS_LOGICAL_HEIGHT / 2;
        tieGameLayoutSerial = 0;
        tieGameFeedback = null;
        tieGameAmbientTime = 0;
        tieGameEntrySteps = 0;
        tieGamePowerBankMax = TIE_GAME_POWER_BANK_START;
        tieGamePowerInventory = [];
        tieGamePowerChance = TIE_GAME_POWER_CHANCE_START;
        tieGamePermanentBonusTimeMs = 0;
        tieGameRoundAssisted = false;
        tieGameMilestoneUpgrade = null;
        tieGamePendingRoundAdvance = false;
        tieGamePowerEffect = null;
        tieGameFreezeSteps = 0;
        tieGameGrandSpotlight = null;
        tieGameChickenRun = null;
        tieGamePowerMenuOpen = false;
        tieGamePowerMenuIndex = 0;
        tieGamePowerMenuHoldDir = 0;
        tieGamePowerMenuRepeatSteps = 0;
        tieGamePowerNoEffect = null;
        tieGamePowerNotice = null;
        tieGameBuildRound();
      }
      function gameUpdate() {
        if (tieGameInputCooldownSteps > 0) tieGameInputCooldownSteps -= 1;
        if (tieGameEntrySteps > 0) tieGameEntrySteps -= 1;
        tieGameAmbientTime += 1;
        if (tieGamePowerNotice?.steps > 0) tieGamePowerNotice.steps -= 1;

        if (tieGameFeedback) {
          tieGameFeedback.steps -= 1;
          if (tieGameFeedback.steps <= 0) tieGameFinishFeedback();
          return;
        }

        if (tieGameMilestoneUpgrade) {
          tieGameMilestoneUpgrade.steps -= 1;
          if (tieGameMilestoneUpgrade.steps <= 0) {
            tieGameMilestoneUpgrade = null;
            if (tieGamePendingRoundAdvance) tieGameAdvanceToNextRound();
          }
          return;
        }

        // Power animations advance live. Freeze Frame stops time; Rewind runs it backward.
        const rewindingThisFrame = tieGamePowerEffect?.id === "rewind";
        tieGameUpdatePowerEffect();

        if (tieGamePowerMenuOpen) {
          if (tieGamePowerNoEffect?.steps > 0) {
            tieGamePowerNoEffect.steps -= 1;
            if (tieGamePowerNoEffect.steps <= 0) tieGamePowerNoEffect = null;
          } else {
            tieGameReadPowerMenuJoystick();
          }
          return;
        }

        // The free cursor remains controllable while a power animation is happening.
        tieGameReadJoystick();

        if (tieGameFreezeSteps > 0) {


          tieGameFreezeSteps -= 1;


        } else if (!rewindingThisFrame) {


          tieGameTimeRemainingMs = Math.max(0, tieGameTimeRemainingMs - TIE_GAME_FIXED_STEP_MS);


        }

        if (tieGameTimeRemainingMs <= 0) {
          tieGameBeginFeedback("timeout", -1);
        }
      }
      function gameDraw() {
        ctx.clearRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);
        tieGameDrawBackdrop();
        tieGameDrawTimer();
        tieGameExamples.forEach(tieGameDrawExample);
        tieGameDrawGrandSpotlightPersistent();
        tieGameDrawPowerEffectOverlay();
        tieGameDrawActivePowerStatus();
        if (!tieGamePowerMenuOpen) tieGameDrawCursor();
        tieGameDrawFeedback();
        tieGameDrawMilestoneUpgrade();
        tieGameDrawPowerHud();
        tieGameDrawPowerMenu();
      }
      function gameInput(action) {
        if (tieGameFeedback || tieGameMilestoneUpgrade) return;

        if (action === "b") {
          // Do not stack/open another power while a one-shot animation is in flight.
          if (!tieGamePowerEffect) tieGameTogglePowerMenu();
          return;
        }

        if (action === "a") {
          if (tieGamePowerMenuOpen) {
            if (tieGamePowerInventory.length && !tieGamePowerNoEffect) {
              tieGameUsePower(tieGamePowerMenuIndex);
            }
            return;
          }
          const index = tieGameExampleAtPoint({ x: tieGameCursorX, y: tieGameCursorY });
          if (index >= 0) tieGameSubmit(index);
        }
      }


      function gamePointer(point) {
        // Mobile gameplay is controller-based: move the free cursor with the left stick
        // and press SELECT. Direct playfield taps do not choose an answer.
      }

      function gameStop() {
        tieGameFeedback = null;
        tieGamePowerEffect = null;
        tieGameFreezeSteps = 0;
        tieGameGrandSpotlight = null;
        tieGameChickenRun = null;
        tieGamePowerMenuOpen = false;
        tieGamePowerMenuHoldDir = 0;
        tieGamePowerMenuRepeatSteps = 0;
        tieGamePowerNoEffect = null;
      }

      if (document.fonts?.load) {
        document.fonts.load(`46px ${TIE_GAME_SMUFL_FONT}`).then(() => {
          resetGameCanvasTransform();
          gameDraw();
        }).catch(() => {});
      }

    let resizeObserver = null;

    if ("ResizeObserver" in window) {
      resizeObserver = new ResizeObserver(() => {
        scaleAppToFrame();
        if (!sticks.left.active) resetJoystick(sticks.left);
        if (!sticks.right.active) resetJoystick(sticks.right);

        if (!running) {
          resetGameCanvasTransform();
          gameDraw();
        }
      });

      resizeObserver.observe(appFrame);
    }

    window.addEventListener("orientationchange", () => {
      setTimeout(() => {
        scaleAppToFrame();
        if (!sticks.left.active) resetJoystick(sticks.left);
        if (!sticks.right.active) resetJoystick(sticks.right);

        if (!running) {
          resetGameCanvasTransform();
          gameDraw();
        }
      }, 250);
    });

    function shutDownMobileArcade() {
      try {
        stopGame();
      } catch (err) {}

      if (audioCtx && audioCtx.state !== "closed") {
        audioCtx.close().catch(() => {});
      }

      audioCtx = null;
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        resetJoystick(sticks.left);
        resetJoystick(sticks.right);
        document.querySelectorAll("button[data-action]").forEach(button => {
          button.dataset.touchId = "";
          button.classList.remove("pressed");
        });
      }
    });

    window.addEventListener("pagehide", shutDownMobileArcade);


    scaleAppToFrame();
    loadPlayers();
    resetJoystick(sticks.left);
    resetJoystick(sticks.right);
    document.getElementById("controls")?.classList.add("tieGameControls");

    // Tie Game control layout: left joystick opposite the original A/B diagonal pair.
    // Moving the joystick into the primary row keeps those three controls together while
    // allowing the shell's MENU row to remain at its normal, higher vertical position.
    if (primaryControlsRow && leftJoystickPad && faceButtons) {
      primaryControlsRow.insertBefore(leftJoystickPad, faceButtons);
    }

    // Give the enlarged stick substantially more physical travel before it
    // reaches full speed, making partial-speed aiming much easier.
    sticks.left.maxDistance = 49;

    configureMobileControls({
      showDpad: false,
      showLeftJoystick: true,
      showRightJoystick: false,
      faceButtons: ["a", "b"],
      systemButtons: ["start"],
      labels: { a: "SELECT", b: "POWER", start: "MENU" }
    });

    // The left joystick now lives in primaryControlsRow for this game, so the otherwise
    // empty joystick row should not reserve vertical space.
    stickControlsRow.classList.add("hidden");
    gameInit();
    resetGameCanvasTransform();
    gameDraw();
  </script>
