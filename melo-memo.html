  function MemodyBuildTone(index, volume = 0.09) {
    const ac = getAudio();
    if (!ac || !Memody_NOTES[index]) return null;

    const note = Memody_NOTES[index];
    const now = ac.currentTime;
    const osc = ac.createOscillator();
    const soft = ac.createOscillator();
    const gain = ac.createGain();
    const filter = ac.createBiquadFilter();

    osc.type = "triangle";
    soft.type = "sine";
    osc.frequency.setValueAtTime(note.freq, now);
    soft.frequency.setValueAtTime(note.freq * 2, now);
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(1900, now);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(volume, now + 0.018);

    osc.connect(filter);
    soft.connect(filter);
    filter.connect(gain);
    gain.connect(ac.destination);

    osc.start(now);
    soft.start(now);

    return { ac, osc, soft, gain, stopped: false, index };
  }

  function MemodyStopTone(tone, releaseSeconds = 0.065) {
    if (!tone || tone.stopped) return;
    tone.stopped = true;
    const now = tone.ac.currentTime;
    tone.gain.gain.cancelScheduledValues(now);
    tone.gain.gain.setValueAtTime(Math.max(0.0001, tone.gain.gain.value), now);
    tone.gain.gain.exponentialRampToValueAtTime(0.0001, now + releaseSeconds);
    tone.osc.stop(now + releaseSeconds + 0.02);
    tone.soft.stop(now + releaseSeconds + 0.02);
  }

  function MemodyPreviewNote(index, durationSeconds = 0.24, volume = 0.085) {
    const tone = MemodyBuildTone(index, volume);
    if (!tone) return;
    setTimeout(() => MemodyStopTone(tone, 0.07), durationSeconds * 1000);
  }

  function MemodyStartHeldTone(index, volume = 0.095) {
    if (MemodyHeldTone && MemodyHeldTone.index === index) return;
    MemodyStopHeldTone();
    MemodyHeldTone = MemodyBuildTone(index, volume);
    MemodyHeldNoteIndex = index;
  }

  function MemodyStopHeldTone() {
    if (MemodyHeldTone) MemodyStopTone(MemodyHeldTone, 0.06);
    MemodyHeldTone = null;
    MemodyHeldNoteIndex = null;
  }

  function MemodySoundDoor() {
    [210, 176, 148, 126].forEach((freq, i) => setTimeout(() => beep(freq, 0.08, "sawtooth", 0.032), i * 55));
  }

  function MemodySoundTreasure() {
    [659, 784, 988, 1318, 1568].forEach((freq, i) => setTimeout(() => beep(freq, 0.09, "triangle", 0.043), i * 65));
  }

  function MemodySoundMonster() {
    [98, 82, 65, 54].forEach((freq, i) => setTimeout(() => beep(freq, 0.16, "sawtooth", 0.07), i * 78));
    setTimeout(() => beep(41, 0.26, "square", 0.045), 120);
  }

  function MemodyMakeMonster() {
    const glyphs = ["♪", "♫", "♬", "♭", "♯", "𝄞"];
    MemodyMonsterBits = Array.from({ length: 16 }, (_, i) => ({
      angle: (i / 16) * Math.PI * 2,
      radius: 24 + (i % 4) * 12 + Math.random() * 8,
      drift: 0.4 + Math.random() * 0.9,
      size: 14 + Math.random() * 14,
      char: glyphs[i % glyphs.length],
      side: i % 2 ? 1 : -1,
      lift: 8 + Math.random() * 20,
      alpha: 0.20 + Math.random() * 0.25
    }));
  }


  function MemodyTriggerOutcome(success) {
    MemodyPhase = "walk";
    MemodyOutcome = success ? "treasure" : "monster";
    MemodyAnimStart = performance.now();
    MemodyResultCueDone = false;
    MemodyStopHeldTone();
    MemodyControlHeld = false;
    MemodySelectionVisible = false;
    MemodyActiveNote = null;
    MemodySetPrompt("The door opens...");
    MemodySoundDoor();
    if (!success) MemodyMakeMonster();
  }


  function MemodyBuildMobileTouchKeyboard() {
    if (!memodyMobileKeyboard || memodyMobileKeyboard.dataset.built === "yes") return;
    memodyMobileKeyboard.dataset.built = "yes";
    memodyMobileKeyboard.innerHTML = "";

    const whiteNotes = Memody_NOTES
      .map((note, index) => ({ ...note, index }))
      .filter(note => !note.black);
    const whiteWidth = 100 / whiteNotes.length;

    whiteNotes.forEach((note, i) => {
      const key = document.createElement("button");
      key.type = "button";
      key.className = "memodyTouchWhiteKey memodyTouchKey";
      key.dataset.noteIndex = String(note.index);
      key.style.left = `${i * whiteWidth}%`;
      key.style.width = `${whiteWidth}%`;
      key.innerHTML = `<span class="memodyTouchKeyLabel">${note.key}</span>`;
      memodyMobileKeyboard.appendChild(key);
    });

    const blackSpecs = [
      { index: 1, left: whiteWidth * 0.68 },
      { index: 3, left: whiteWidth * 1.68 },
      { index: 6, left: whiteWidth * 3.68 },
      { index: 8, left: whiteWidth * 4.68 },
      { index: 10, left: whiteWidth * 5.68 }
    ];
    const blackWidth = whiteWidth * 0.64;

    blackSpecs.forEach(spec => {
      const note = Memody_NOTES[spec.index];
      if (!note) return;
      const key = document.createElement("button");
      key.type = "button";
      key.className = "memodyTouchBlackKey memodyTouchKey";
      key.dataset.noteIndex = String(spec.index);
      key.style.left = `${spec.left}%`;
      key.style.width = `${blackWidth}%`;
      key.innerHTML = `<span class="memodyTouchKeyLabel">${note.key}</span>`;
      memodyMobileKeyboard.appendChild(key);
    });
  }

  function MemodySetTouchKeyboardPressed(index) {
    if (!memodyMobileKeyboard) return;
    memodyMobileKeyboard.querySelectorAll(".memodyTouchKey.pressed").forEach(key => key.classList.remove("pressed"));
    if (index == null) return;
    const activeKey = memodyMobileKeyboard.querySelector(`.memodyTouchKey[data-note-index="${index}"]`);
    if (activeKey) activeKey.classList.add("pressed");
  }

  function MemodyBindMobileTouchKeyboard() {
    if (!memodyMobileKeyboard || memodyMobileKeyboard.dataset.bound === "yes") return;
    memodyMobileKeyboard.dataset.bound = "yes";
    MemodyBuildMobileTouchKeyboard();

    const keyFromTarget = target => target && target.closest ? target.closest('.memodyTouchKey') : null;

    memodyMobileKeyboard.addEventListener("pointerdown", event => {
      if (!running || shellMenu.classList.contains("open")) return;
      const key = keyFromTarget(event.target);
      if (!key) return;
      event.preventDefault();
      const index = Number(key.dataset.noteIndex);
      MemodyTouchKeyboardPointerId = event.pointerId;
      MemodyTouchKeyboardActiveIndex = index;
      try { memodyMobileKeyboard.setPointerCapture(event.pointerId); } catch (err) {}
      MemodyIgnoreClickUntil = performance.now() + 700;
      MemodySetTouchKeyboardPressed(index);
      MemodyHandlePointerNote(index);
    });

    memodyMobileKeyboard.addEventListener("pointermove", event => {
      if (MemodyTouchKeyboardPointerId == null || event.pointerId !== MemodyTouchKeyboardPointerId) return;
      event.preventDefault();
      const hoverKey = keyFromTarget(document.elementFromPoint(event.clientX, event.clientY));
      const index = hoverKey ? Number(hoverKey.dataset.noteIndex) : null;
      if (index === MemodyTouchKeyboardActiveIndex) return;
      MemodyTouchKeyboardActiveIndex = index;
      MemodySetTouchKeyboardPressed(index);
      MemodyHandlePointerNote(index);
    });

    const releaseTouchKeyboard = event => {
      if (MemodyTouchKeyboardPointerId == null || event.pointerId !== MemodyTouchKeyboardPointerId) return;
      event.preventDefault();
      const commitIndex = MemodyHeldNoteIndex;
      MemodyTouchKeyboardPointerId = null;
      MemodyTouchKeyboardActiveIndex = null;
      MemodySetTouchKeyboardPressed(null);
      MemodyIgnoreClickUntil = performance.now() + 500;
      MemodyStopHeldTone();
      MemodyActiveNote = null;
      if (commitIndex != null) MemodyHandleNote(commitIndex);
      try {
        if (memodyMobileKeyboard.hasPointerCapture(event.pointerId)) memodyMobileKeyboard.releasePointerCapture(event.pointerId);
      } catch (err) {}
    };

    memodyMobileKeyboard.addEventListener("pointerup", releaseTouchKeyboard);
    memodyMobileKeyboard.addEventListener("pointercancel", releaseTouchKeyboard);
    memodyMobileKeyboard.addEventListener("lostpointercapture", event => {
      if (MemodyTouchKeyboardPointerId == null || event.pointerId !== MemodyTouchKeyboardPointerId) return;
      MemodyTouchKeyboardPointerId = null;
      MemodyTouchKeyboardActiveIndex = null;
      MemodySetTouchKeyboardPressed(null);
      MemodyStopHeldTone();
      MemodyActiveNote = null;
    });

    if (memodyMenuBtn && !memodyMenuBtn.dataset.bound) {
      memodyMenuBtn.dataset.bound = "yes";
      let pointerId = null;
      memodyMenuBtn.addEventListener("pointerdown", event => {
        event.preventDefault();
        pointerId = event.pointerId;
        memodyMenuBtn.classList.add("pressed");
        try { memodyMenuBtn.setPointerCapture(event.pointerId); } catch (err) {}
      });
      const releaseMenu = event => {
        if (pointerId == null || event.pointerId !== pointerId) return;
        event.preventDefault();
        pointerId = null;
        memodyMenuBtn.classList.remove("pressed");
        try {
          if (memodyMenuBtn.hasPointerCapture(event.pointerId)) memodyMenuBtn.releasePointerCapture(event.pointerId);
        } catch (err) {}
        openShellMenu("pause");
      };
      memodyMenuBtn.addEventListener("pointerup", releaseMenu);
      memodyMenuBtn.addEventListener("pointercancel", event => {
        if (pointerId == null || event.pointerId !== pointerId) return;
        pointerId = null;
        memodyMenuBtn.classList.remove("pressed");
      });
    }
  }

  function MemodyHandleNote(index) {
    if (index == null) return;

    MemodySelectedNote = index;
    MemodyActiveNote = index;
    MemodyActiveUntil = performance.now() + 150;

    if (MemodyPhase !== "input") return;

    if (index === MemodySequence[MemodyInputIndex]) {
      soundCorrect();
      MemodyInputIndex += 1;
      if (MemodyInputIndex >= MemodySequence.length) {
        addScore(1);
        MemodyTriggerOutcome(true);
      } else {
        MemodySetPrompt("Keep the melody going");
      }
    } else {
      MemodyTriggerOutcome(false);
    }
  }

  function MemodyHandlePointerNote(index) {
    if (index == null) {
      MemodyActiveNote = null;
      return;
    }
    MemodySelectionVisible = false;
    MemodySelectedNote = index;
    MemodyActiveNote = index;
    MemodyActiveUntil = performance.now() + 140;
    if (MemodyHeldNoteIndex === index) return;
    MemodyStartHeldTone(index, 0.095);
  }

  
  function MemodyRoundedRectPath(x, y, w, h, r) {
    const radius = Math.min(r, w * 0.5, h * 0.5);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
  }

  function MemodyDrawSpark(x, y, size, rotation = 0, color = "#fff2a6", alpha = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);
    ctx.globalAlpha *= alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1.2, size * 0.16);
    ctx.lineCap = "round";
    for (let i = 0; i < 4; i += 1) {
      ctx.rotate(Math.PI / 4);
      ctx.beginPath();
      ctx.moveTo(-size * 0.18, 0);
      ctx.lineTo(-size, 0);
      ctx.moveTo(size * 0.18, 0);
      ctx.lineTo(size, 0);
      ctx.stroke();
    }
    ctx.restore();
  }

  function MemodyDrawCoin(x, y, radius, squash = 1, glow = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(1, squash);
    const grad = ctx.createRadialGradient(-radius * 0.25, -radius * 0.3, radius * 0.18, 0, 0, radius * 1.1);
    grad.addColorStop(0, "#fff6bf");
    grad.addColorStop(0.45, "#ffd95a");
    grad.addColorStop(1, "#d18e14");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#8a5c0e";
    ctx.lineWidth = Math.max(1.2, radius * 0.16);
    ctx.stroke();
    ctx.fillStyle = `rgba(255, 255, 255, ${0.18 * glow})`;
    ctx.beginPath();
    ctx.ellipse(-radius * 0.22, -radius * 0.32, radius * 0.30, radius * 0.17, -0.45, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function MemodyDrawGem(x, y, size, colorA, colorB, rotation = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);
    const grad = ctx.createLinearGradient(0, -size, 0, size);
    grad.addColorStop(0, colorA);
    grad.addColorStop(1, colorB);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, -size);
    ctx.lineTo(size * 0.82, 0);
    ctx.lineTo(0, size);
    ctx.lineTo(-size * 0.82, 0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.72)";
    ctx.lineWidth = Math.max(1, size * 0.12);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -size);
    ctx.lineTo(0, size);
    ctx.moveTo(-size * 0.82, 0);
    ctx.lineTo(size * 0.82, 0);
    ctx.stroke();
    ctx.restore();
  }

  function MemodyDrawSharpSign(x, y, scale, color = "#ff6b6b") {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.6;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-8, -12); ctx.lineTo(-10, 12);
    ctx.moveTo(8, -12); ctx.lineTo(6, 12);
    ctx.moveTo(-14, -4); ctx.lineTo(14, -8);
    ctx.moveTo(-14, 8); ctx.lineTo(14, 4);
    ctx.stroke();
    ctx.restore();
  }

  function MemodyDrawFlatSign(x, y, scale, color = "#ff6b6b") {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.8;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-4, -14);
    ctx.lineTo(-4, 13);
    ctx.moveTo(-4, 1);
    ctx.bezierCurveTo(6, -2, 11, 2, 9, 10);
    ctx.bezierCurveTo(7, 17, -3, 15, -4, 9);
    ctx.stroke();
    ctx.restore();
  }
  function MemodyDrawChest(x, y, scale, openAmount) {
    const t = MemodyEaseOut(openAmount);
    const chestW = 126 * scale;
    const chestH = 84 * scale;
    const left = x - chestW / 2;
    const top = y - chestH / 2;
    const baseY = top + chestH * 0.18;
    const bodyH = chestH * 0.58;

    ctx.save();

    ctx.fillStyle = "rgba(0,0,0,0.30)";
    ctx.beginPath();
    ctx.ellipse(x, top + chestH * 0.94, chestW * 0.58, chestH * 0.14, 0, 0, Math.PI * 2);
    ctx.fill();

    const bodyGrad = ctx.createLinearGradient(0, baseY, 0, baseY + bodyH);
    bodyGrad.addColorStop(0, "#9b6330");
    bodyGrad.addColorStop(0.58, "#6c431d");
    bodyGrad.addColorStop(1, "#432512");
    ctx.fillStyle = bodyGrad;
    MemodyRoundedRectPath(left, baseY, chestW, bodyH, 10 * scale);
    ctx.fill();
    ctx.strokeStyle = "#24150d";
    ctx.lineWidth = Math.max(2, 5 * scale);
    ctx.stroke();

    const trimGrad = ctx.createLinearGradient(0, baseY, 0, baseY + bodyH);
    trimGrad.addColorStop(0, "#ffe694");
    trimGrad.addColorStop(0.5, "#e6b537");
    trimGrad.addColorStop(1, "#9b680d");
    ctx.fillStyle = trimGrad;
    [0.14, 0.50, 0.82].forEach(pos => {
      const bandW = chestW * 0.1;
      MemodyRoundedRectPath(left + chestW * pos - bandW / 2, baseY + 4 * scale, bandW, bodyH - 8 * scale, 5 * scale);
      ctx.fill();
    });
    MemodyRoundedRectPath(left + chestW * 0.07, baseY + bodyH * 0.20, chestW * 0.86, bodyH * 0.14, 4 * scale);
    ctx.fill();
    MemodyRoundedRectPath(left + chestW * 0.09, baseY + bodyH * 0.66, chestW * 0.82, bodyH * 0.11, 4 * scale);
    ctx.fill();

    if (t > 0.03) {
      const glowGrad = ctx.createRadialGradient(x, baseY + bodyH * 0.15, 0, x, baseY + bodyH * 0.15, chestW * 0.68);
      glowGrad.addColorStop(0, `rgba(255, 246, 183, ${0.48 * t})`);
      glowGrad.addColorStop(0.55, `rgba(255, 201, 76, ${0.26 * t})`);
      glowGrad.addColorStop(1, "rgba(255, 141, 54, 0)");
      ctx.fillStyle = glowGrad;
      MemodyRoundedRectPath(left + 8 * scale, baseY + 6 * scale, chestW - 16 * scale, bodyH * 0.50, 8 * scale);
      ctx.fill();
    }

    ctx.fillStyle = "#47301a";
    MemodyRoundedRectPath(x - 10 * scale, baseY + bodyH * 0.34, 20 * scale, 24 * scale, 4 * scale);
    ctx.fill();
    ctx.fillStyle = "#ffd556";
    MemodyRoundedRectPath(x - 7 * scale, baseY + bodyH * 0.37, 14 * scale, 18 * scale, 3 * scale);
    ctx.fill();
    ctx.strokeStyle = "#7c5208";
    ctx.lineWidth = Math.max(1.3, 2.2 * scale);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x, baseY + bodyH * 0.46, 2.3 * scale, 0, Math.PI * 2);
    ctx.fillStyle = "#8d6410";
    ctx.fill();

    ctx.save();
    ctx.translate(x, top + chestH * 0.17);
    ctx.rotate(-1.08 * t);
    const lidGrad = ctx.createLinearGradient(0, -chestH * 0.46, 0, chestH * 0.12);
    lidGrad.addColorStop(0, "#b17238");
    lidGrad.addColorStop(0.6, "#855026");
    lidGrad.addColorStop(1, "#4d2d16");
    ctx.fillStyle = lidGrad;
    ctx.beginPath();
    ctx.moveTo(-chestW * 0.52, 0);
    ctx.quadraticCurveTo(0, -chestH * 0.50, chestW * 0.52, 0);
    ctx.lineTo(chestW * 0.46, chestH * 0.13);
    ctx.quadraticCurveTo(0, -chestH * 0.26, -chestW * 0.46, chestH * 0.13);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#24150d";
    ctx.lineWidth = Math.max(2, 5 * scale);
    ctx.stroke();
    ctx.strokeStyle = "#f0c44f";
    ctx.lineWidth = Math.max(1.6, 3.2 * scale);
    ctx.beginPath();
    ctx.moveTo(-chestW * 0.38, -chestH * 0.09);
    ctx.quadraticCurveTo(0, -chestH * 0.28, chestW * 0.38, -chestH * 0.09);
    ctx.stroke();
    [0.24, 0.5, 0.76].forEach(pos => {
      const bandX = -chestW * 0.52 + chestW * pos;
      ctx.beginPath();
      ctx.moveTo(bandX, -chestH * 0.06);
      ctx.lineTo(bandX * 0.88, chestH * 0.10);
      ctx.stroke();
    });
    ctx.restore();

    ctx.restore();
  }

  function MemodyDrawTreasureBurst(now, x, y, reveal, scale) {
    const t = MemodyEaseOut(reveal);
    const pulse = 0.88 + Math.sin(now / 165) * 0.12;
    const mouthY = y - 10 * scale;

    ctx.save();
    ctx.globalAlpha *= 0.98;

    for (let i = 0; i < 10; i += 1) {
      const angle = -1.72 + i * 0.19;
      const len = (62 + (i % 3) * 18) * scale * (0.35 + 0.75 * t);
      ctx.strokeStyle = `rgba(255, 226, 125, ${0.11 + 0.18 * t})`;
      ctx.lineWidth = Math.max(1.5, (3.5 - (i % 2) * 0.6) * scale);
      ctx.beginPath();
      ctx.moveTo(x, mouthY);
      ctx.lineTo(x + Math.cos(angle) * len, mouthY + Math.sin(angle) * len);
      ctx.stroke();
    }

    const treasurePieces = [
      { kind: "coin", spread: -72, lift: 76, size: 10, squash: 0.82 },
      { kind: "coin", spread: -44, lift: 58, size: 8, squash: 0.92 },
      { kind: "gem",  spread: -18, lift: 88, size: 8, rot: -0.25 },
      { kind: "coin", spread: 12,  lift: 100, size: 9, squash: 0.86 },
      { kind: "gem",  spread: 46,  lift: 72, size: 9, rot: 0.18 },
      { kind: "coin", spread: 76,  lift: 62, size: 11, squash: 0.78 },
      { kind: "coin", spread: 38,  lift: 46, size: 7, squash: 0.95 },
      { kind: "gem",  spread: -58, lift: 44, size: 7, rot: 0.34 }
    ];

    treasurePieces.forEach((piece, i) => {
      const wobble = Math.sin(now / 180 + i * 0.9) * 7 * scale;
      const px = x + piece.spread * scale * (0.25 + 0.78 * t) + wobble * 0.25;
      const py = mouthY - Math.sin(Math.PI * t) * piece.lift * scale - Math.max(0, t - 0.55) * 14 * scale + Math.cos(now / 220 + i) * 2.5 * scale;
      if (piece.kind === "coin") {
        MemodyDrawCoin(px, py, piece.size * scale, piece.squash + Math.sin(now / 130 + i) * 0.08, pulse);
      } else {
        const gemTop = i % 2 ? "#b7f3ff" : "#ffc2f0";
        const gemBottom = i % 2 ? "#35c8ff" : "#db46b3";
        MemodyDrawGem(px, py, piece.size * scale, gemTop, gemBottom, (piece.rot || 0) + now / 700);
      }
    });

    ["♪", "♫", "♬"].forEach((glyph, i) => {
      const gx = x + (-30 + i * 30) * scale + Math.sin(now / 240 + i) * 4 * scale;
      const gy = mouthY - (70 + i * 18) * scale * t;
      ctx.fillStyle = ["#fff0a3", "#ffd54d", "#ffb347"][i];
      ctx.font = `bold ${Math.round((24 + i * 6) * scale)}px Georgia`;
      ctx.textAlign = "center";
      ctx.fillText(glyph, gx, gy);
    });

    for (let i = 0; i < 8; i += 1) {
      const angle = i * 0.78 + now / 410;
      const radius = (16 + (i % 4) * 10) * scale * (0.6 + 0.4 * t);
      MemodyDrawSpark(
        x + Math.cos(angle) * radius,
        mouthY - 10 * scale + Math.sin(angle) * radius * 0.55,
        (5 + (i % 3) * 1.7) * scale,
        angle,
        i % 2 ? "#fff6b4" : "#ffd465",
        0.65 + 0.25 * t
      );
    }

    ctx.restore();
  }

  function MemodyDrawMonsterFigure(now, x, y, reveal, scale) {
    const t = MemodyEaseOut(reveal);
    const bob = Math.sin(now / 140) * 4 * scale;
    const bodyLift = t * 46 * scale;
    const lunge = t * 26 * scale;

    ctx.save();
    ctx.translate(x, y - bodyLift + bob);

    ctx.fillStyle = "rgba(0,0,0,0.33)";
    ctx.beginPath();
    ctx.ellipse(0, 48 * scale, 62 * scale, 14 * scale, 0, 0, Math.PI * 2);
    ctx.fill();

    MemodyMonsterBits.forEach((bit, i) => {
      const angle = bit.angle + now / 520 * bit.drift * bit.side;
      const radius = bit.radius * scale * (0.68 + 0.3 * t);
      const px = Math.cos(angle) * radius;
      const py = -8 * scale - bit.lift * scale * 0.34 + Math.sin(angle * 1.15 + now / 420) * 12 * scale;
      ctx.save();
      ctx.globalAlpha *= bit.alpha;
      ctx.fillStyle = i % 2 ? "#6b7280" : "#4b5563";
      ctx.font = `bold ${Math.round(bit.size * scale)}px Georgia`;
      ctx.textAlign = "center";
      ctx.fillText(bit.char, px, py);
      ctx.restore();
    });

    ctx.save();
    ctx.translate(0, 4 * scale);
    ctx.scale(1.04 + Math.sin(now / 180) * 0.03, 0.94 + Math.cos(now / 200) * 0.02);
    const bodyGrad = ctx.createRadialGradient(-16 * scale, -22 * scale, 8 * scale, 0, 0, 84 * scale);
    bodyGrad.addColorStop(0, "#2b3347");
    bodyGrad.addColorStop(0.55, "#121826");
    bodyGrad.addColorStop(1, "#05070d");
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, 60 * scale, 48 * scale, -0.08, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#374151";
    ctx.lineWidth = Math.max(1.6, 3 * scale);
    ctx.stroke();
    ctx.restore();

    const shoulderOffset = 34 * scale;
    [[-1, -shoulderOffset], [1, shoulderOffset]].forEach(([side, offset]) => {
      ctx.save();
      ctx.translate(offset, -6 * scale);
      ctx.rotate(side * (-0.28 + Math.sin(now / 220 + side) * 0.06));
      ctx.fillStyle = "#0f172a";
      ctx.beginPath();
      ctx.ellipse(0, 0, 18 * scale, 13 * scale, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#374151";
      ctx.lineWidth = Math.max(1.2, 2.2 * scale);
      ctx.stroke();
      ctx.strokeStyle = "#111827";
      ctx.lineWidth = Math.max(1.8, 4 * scale);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(11 * side * scale, -2 * scale);
      ctx.lineTo(22 * side * scale, -43 * scale);
      ctx.stroke();
      ctx.restore();
    });

    ctx.strokeStyle = "#111827";
    ctx.lineWidth = Math.max(2, 5 * scale);
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-28 * scale, -32 * scale);
    ctx.lineTo(-14 * scale, -60 * scale);
    ctx.lineTo(-1 * scale, -54 * scale);
    ctx.moveTo(28 * scale, -32 * scale);
    ctx.lineTo(14 * scale, -60 * scale);
    ctx.lineTo(1 * scale, -54 * scale);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-14 * scale, -58 * scale);
    ctx.lineTo(14 * scale, -58 * scale);
    ctx.stroke();

    for (let i = 0; i < 4; i += 1) {
      const px = -18 * scale + i * 12 * scale;
      ctx.strokeStyle = `rgba(127, 29, 29, ${0.45 + i * 0.07})`;
      ctx.lineWidth = Math.max(1.6, 2.4 * scale);
      ctx.beginPath();
      ctx.moveTo(px, 10 * scale);
      ctx.lineTo(px + Math.sin(now / 190 + i) * 3 * scale, 28 * scale);
      ctx.stroke();
    }

    const eyeGlow = 1 + Math.sin(now / 95) * 0.12;
    [[-16, -10], [16, -10]].forEach(([ex, ey]) => {
      const grad = ctx.createRadialGradient(ex * scale, ey * scale, 1, ex * scale, ey * scale, 14 * scale);
      grad.addColorStop(0, `rgba(255, 245, 245, ${0.95 * eyeGlow})`);
      grad.addColorStop(0.3, `rgba(255, 98, 98, ${0.95 * eyeGlow})`);
      grad.addColorStop(1, "rgba(255, 98, 98, 0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(ex * scale, ey * scale, 14 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ff5b5b";
      ctx.beginPath();
      ctx.arc(ex * scale, ey * scale, 6.5 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff7f7";
      ctx.beginPath();
      ctx.arc(ex * scale + 1.6 * scale, ey * scale - 1.2 * scale, 2.3 * scale, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.strokeStyle = "#0b0f18";
    ctx.lineWidth = Math.max(1.6, 3 * scale);
    ctx.beginPath();
    ctx.moveTo(-28 * scale, -26 * scale);
    ctx.lineTo(-6 * scale, -18 * scale);
    ctx.moveTo(28 * scale, -26 * scale);
    ctx.lineTo(6 * scale, -18 * scale);
    ctx.stroke();

    ctx.fillStyle = "#7f1d1d";
    ctx.beginPath();
    ctx.moveTo(-22 * scale, 12 * scale);
    ctx.quadraticCurveTo(0, 30 * scale, 22 * scale, 12 * scale);
    ctx.quadraticCurveTo(0, 40 * scale, -22 * scale, 12 * scale);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#fecaca";
    ctx.lineWidth = Math.max(1.2, 2.2 * scale);
    ctx.beginPath();
    [-14, -5, 4, 13].forEach(toothX => {
      ctx.moveTo(toothX * scale, 13 * scale);
      ctx.lineTo((toothX + 4) * scale, 22 * scale);
      ctx.lineTo((toothX + 8) * scale, 13 * scale);
    });
    ctx.stroke();

    [[-1, -1], [1, 1]].forEach(([side, dir], i) => {
      ctx.save();
      ctx.translate(side * (38 * scale + lunge * 0.35), 6 * scale);
      ctx.rotate(side * (0.55 + Math.sin(now / 210 + i) * 0.08));
      ctx.strokeStyle = "#111827";
      ctx.lineWidth = Math.max(1.8, 4.5 * scale);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(34 * side * scale, 22 * scale);
      ctx.stroke();
      ctx.fillStyle = "#0f172a";
      ctx.beginPath();
      ctx.ellipse(38 * side * scale, 25 * scale, 11 * scale, 8 * scale, 0.35 * side, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#fca5a5";
      ctx.lineWidth = Math.max(1.2, 2.2 * scale);
      for (let claw = 0; claw < 3; claw += 1) {
        const baseX = 44 * side * scale;
        const baseY = (18 + claw * 7) * scale;
        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(baseX + 10 * side * scale, (14 + claw * 7) * scale);
        ctx.stroke();
      }
      ctx.restore();
    });

    for (let i = 0; i < 4; i += 1) {
      const tailX = -16 * scale - i * 16 * scale;
      const tailY = 26 * scale + i * 7 * scale;
      ctx.save();
      ctx.translate(tailX, tailY);
      ctx.rotate(-0.28 + i * 0.12);
      ctx.fillStyle = i === 3 ? "#111827" : "#0f172a";
      ctx.beginPath();
      ctx.ellipse(0, 0, (10 - i) * scale, (7 - i * 0.7) * scale, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#111827";
      ctx.lineWidth = Math.max(1.1, 2.1 * scale);
      ctx.beginPath();
      ctx.moveTo((8 - i) * scale, 0);
      ctx.lineTo((18 - i * 2) * scale, (-12 - i * 2) * scale);
      ctx.stroke();
      ctx.restore();
    }

    MemodyDrawSharpSign(-70 * scale - lunge * 0.18, 8 * scale, 0.8 * scale);
    MemodyDrawFlatSign(70 * scale + lunge * 0.18, 12 * scale, 0.78 * scale);

    ctx.restore();
  }


  function MemodyCorridorMetrics(scale = 1, centerOffset = 0) {
    const w = GAME_CANVAS_LOGICAL_WIDTH;
    const h = GAME_CANVAS_LOGICAL_HEIGHT;
    const overdraw = Math.max(w, h) * 0.42;
    const cx = w / 2 + centerOffset;
    const wallCenterY = h * 0.42;
    const baseWallW = w * 0.31;
    const baseWallH = h * 0.24;
    const wallW = baseWallW * scale;
    const wallH = baseWallH * scale;
    const wallLeft = cx - wallW / 2;
    const wallRight = cx + wallW / 2;
    const wallTop = wallCenterY - wallH / 2;
    const wallBottom = wallCenterY + wallH / 2;
    const floorY = h * 0.75;
    const doorW = wallW * 0.23;
    const doorH = wallH * 0.70;
    const doorX = cx - doorW / 2;
    const doorY = wallCenterY - doorH / 2 + wallH * 0.06;
    return { w, h, overdraw, cx, wallCenterY, wallW, wallH, wallLeft, wallRight, wallTop, wallBottom, floorY, doorW, doorH, doorX, doorY, scale };
  }

  function MemodyDrawCorridorShell(metrics, options = {}) {
    const { w, h, overdraw, cx, wallW, wallH, wallLeft, wallRight, wallTop, wallBottom, floorY, doorW, doorH, doorX, doorY, scale } = metrics;
    const doorOpen = options.doorOpen || 0;
    const showClosedDoor = options.showClosedDoor !== false;
    const panelScale = Math.max(0, 1 - doorOpen);

    const sky = ctx.createLinearGradient(0, -overdraw, 0, h + overdraw);
    sky.addColorStop(0, "#18264a");
    sky.addColorStop(0.52, "#101827");
    sky.addColorStop(1, "#090d16");
    ctx.fillStyle = sky;
    ctx.fillRect(-overdraw, -overdraw, w + overdraw * 2, h + overdraw * 2);

    ctx.fillStyle = "#162138";
    ctx.beginPath();
    ctx.moveTo(-overdraw, -overdraw);
    ctx.lineTo(wallLeft, wallTop);
    ctx.lineTo(wallLeft, wallBottom);
    ctx.lineTo(-overdraw, floorY + overdraw * 0.35);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(w + overdraw, -overdraw);
    ctx.lineTo(wallRight, wallTop);
    ctx.lineTo(wallRight, wallBottom);
    ctx.lineTo(w + overdraw, floorY + overdraw * 0.35);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#1a2540";
    ctx.beginPath();
    ctx.moveTo(-overdraw, floorY + overdraw * 0.35);
    ctx.lineTo(wallLeft, wallBottom);
    ctx.lineTo(wallRight, wallBottom);
    ctx.lineTo(w + overdraw, floorY + overdraw * 0.35);
    ctx.lineTo(w + overdraw, h + overdraw);
    ctx.lineTo(-overdraw, h + overdraw);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#20304d";
    ctx.fillRect(wallLeft, wallTop, wallW, wallH);

    ctx.strokeStyle = "rgba(255,255,255,0.07)";
    ctx.lineWidth = Math.max(2, 2.8 * scale);
    [0.16, 0.32, 0.5, 0.68, 0.84].forEach(pos => {
      ctx.beginPath();
      ctx.moveTo(cx, wallBottom);
      ctx.lineTo(w * pos, h + overdraw * 0.12);
      ctx.stroke();
    });

    if (!showClosedDoor) return;

    const doorInnerX = doorX + 2 * scale;
    const doorInnerY = doorY + 2 * scale;
    const doorInnerW = Math.max(0, doorW - 4 * scale);
    const doorInnerH = doorH + 6 * scale;

    ctx.fillStyle = "rgba(0,0,0,0.32)";
    ctx.fillRect(doorX - 5 * scale, doorY + 6 * scale, doorW + 10 * scale, doorH + 8 * scale);

    ctx.fillStyle = "#05060a";
    ctx.fillRect(doorInnerX, doorInnerY, doorInnerW, doorInnerH);

    ctx.fillStyle = "#f8fafc";
    ctx.fillRect(doorX - 6 * scale, doorY - 6 * scale, doorW + 12 * scale, 8 * scale);
    ctx.fillRect(doorX - 6 * scale, doorY - 6 * scale, 8 * scale, doorH + 14 * scale);
    ctx.fillRect(doorX + doorW - 2 * scale, doorY - 6 * scale, 8 * scale, doorH + 14 * scale);

    if (panelScale > 0.001 && doorInnerW > 0) {
      ctx.save();
      ctx.translate(doorInnerX, doorInnerY);
      ctx.scale(panelScale, 1);
      const doorGrad = ctx.createLinearGradient(0, 0, doorInnerW, doorInnerH);
      doorGrad.addColorStop(0, "#8aa9ff");
      doorGrad.addColorStop(1, "#4361b9");
      ctx.fillStyle = doorGrad;
      ctx.fillRect(0, 0, doorInnerW, doorInnerH);
      ctx.fillStyle = "rgba(255,255,255,0.18)";
      ctx.fillRect(doorInnerW * 0.12, doorInnerH * 0.12, doorInnerW * 0.76, doorInnerH * 0.22);
      ctx.fillRect(doorInnerW * 0.12, doorInnerH * 0.47, doorInnerW * 0.76, doorInnerH * 0.30);
      ctx.fillStyle = "#e0edff";
      ctx.beginPath();
      ctx.arc(doorInnerW * 0.82, doorInnerH * 0.53, 4.5 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function MemodyDrawTreasureChestLayer(now, outcome, chestOpen, reveal) {
    const w = GAME_CANVAS_LOGICAL_WIDTH;
    const h = GAME_CANVAS_LOGICAL_HEIGHT;
    const chestX = w / 2;
    const chestY = h * 0.70;
    const chestScale = Math.max(0.72, Math.min(1.04, w / 760));
    MemodyDrawChest(chestX, chestY, chestScale, chestOpen);
    if (reveal > 0) {
      if (outcome === "treasure") MemodyDrawTreasureBurst(now, chestX, chestY - 24 * chestScale, reveal, chestScale);
      else MemodyDrawMonsterFigure(now, chestX, chestY - 10 * chestScale, reveal, chestScale);
    }
  }

  function MemodyDrawRoomScene(now, outcome, chestOpen, reveal) {
    const metrics = MemodyCorridorMetrics(1, 0);
    MemodyDrawCorridorShell(metrics, { doorOpen: 0, showClosedDoor: true });
    MemodyDrawTreasureChestLayer(now, outcome, chestOpen, reveal);
  }

  function MemodyDrawHallway(now) {
    const w = GAME_CANVAS_LOGICAL_WIDTH;
    const h = GAME_CANVAS_LOGICAL_HEIGHT;
    const elapsed = MemodyPhase === "walk" ? now - MemodyAnimStart : 0;
    const transitionUnclamped = MemodyPhase === "walk" ? elapsed / Memody_TRANSITION_MS : 0;
    const transitionRaw = MemodyClamp(transitionUnclamped, 0, 1);

    if (MemodyPhase === "walk" && transitionUnclamped >= 1) {
      const chestOpen = MemodyClamp((elapsed - Memody_TRANSITION_MS) / Memody_CHEST_OPEN_MS, 0, 1);
      const reveal = MemodyClamp((elapsed - Memody_TRANSITION_MS - Memody_CHEST_OPEN_MS * 0.35) / Memody_REVEAL_MS, 0, 1);
      MemodyDrawRoomScene(now, MemodyOutcome, chestOpen, reveal);
      return;
    }

    const progress = MemodyEaseInOut(transitionRaw);
    const waver = MemodyPhase === "walk" ? Math.sin((now - MemodyAnimStart) / 95) * (1 - transitionRaw) * 3 : 0;
    const zoom = 1 + progress * 17.2;
    const metrics = MemodyCorridorMetrics(zoom, waver);
    const doorOpen = MemodyPhase === "walk" ? MemodyEaseOut(MemodyClamp(elapsed / 340, 0, 1)) : 0;
    MemodyDrawCorridorShell(metrics, { doorOpen, showClosedDoor: true });
    if (MemodyPhase === "walk") {
      const childScale = 0.30 + transitionRaw * 0.70;
      const baseMetrics = MemodyCorridorMetrics(1, 0);
      const startChildX = baseMetrics.doorX + baseMetrics.doorW / 2;
      const startChildY = baseMetrics.doorY + baseMetrics.doorH / 2;
      const childCenterX = startChildX + (w / 2 - startChildX) * transitionRaw;
      const childCenterY = startChildY + (h / 2 - startChildY) * transitionRaw;
      const openWidth = Math.max(0, metrics.doorW * doorOpen - 4);
      if (openWidth > 1) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(metrics.doorX + metrics.doorW - openWidth - 2, metrics.doorY + 2, openWidth, Math.max(0, metrics.doorH - 4));
        ctx.clip();
        ctx.translate(childCenterX, childCenterY);
        ctx.scale(childScale, childScale);
        ctx.translate(-w / 2, -h / 2);
        MemodyDrawRoomScene(now, MemodyOutcome, 0, 0);
        ctx.restore();
      }
    }
  }


  function MemodyRoundRect(x, y, w, h, r) {
    const radius = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
    if (typeof ctx.roundRect === "function") {
      ctx.roundRect(x, y, w, h, radius);
      return;
    }
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + w - radius, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
    ctx.lineTo(x + w, y + h - radius);
    ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
    ctx.lineTo(x + radius, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
  }

function MemodyDrawKeyboard() {
    MemodyKeyboardRects = MemodyGetKeyboardRects();
    const frame = MemodyKeyboardRects[0];
    const totalW = MemodyKeyboardRects[MemodyKeyboardRects.length - 1].x + MemodyKeyboardRects[MemodyKeyboardRects.length - 1].w - frame.x;

    ctx.save();
    ctx.globalAlpha = MemodyPhase === "walk" ? 0.38 : 1;
    ctx.fillStyle = "rgba(10,16,30,0.55)";
    ctx.beginPath();
    MemodyRoundRect(frame.x - 18, frame.y - 18, totalW + 36, frame.h + 34, 20);
    ctx.fill();

    MemodyKeyboardRects.forEach((rect, index) => {
      if (rect.black) return;
      const isHeld = MemodyHeldNoteIndex === index;
      const isComputer = MemodyPhase === "show" && MemodyActiveNote === index;
      const isPressed = MemodyPhase !== "show" && MemodyActiveNote === index;
      const isSelected = MemodySelectionVisible && MemodySelectedNote === index && MemodyPhase === "input";
      ctx.fillStyle = (isHeld || isPressed) ? "#ffe08a" : isComputer ? "#3b82f6" : isSelected ? "#dbeafe" : "#f8fafc";
      ctx.fillRect(rect.x + 1, rect.y + 1, rect.w - 2, rect.h - 2);
      ctx.strokeStyle = "#111827";
      ctx.lineWidth = 1.2;
      ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
    });

    MemodyKeyboardRects.forEach((rect, index) => {
      if (!rect.black) return;
      const isHeld = MemodyHeldNoteIndex === index;
      const isComputer = MemodyPhase === "show" && MemodyActiveNote === index;
      const isPressed = MemodyPhase !== "show" && MemodyActiveNote === index;
      const isSelected = MemodySelectionVisible && MemodySelectedNote === index && MemodyPhase === "input";
      ctx.fillStyle = (isHeld || isPressed) ? "#f59e0b" : (isComputer || isSelected) ? "#1d4ed8" : "#0f172a";
      ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
      ctx.strokeStyle = "#020617";
      ctx.lineWidth = 1;
      ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
    });

    ctx.restore();
  }

  function MemodyDrawResultOverlay(now) {
    // The room now appears through the doorway during the first-person walk.
  }
  function MemodyBindDesktopPointer() {
    if (MemodyBoundPointerEvents) return;
    MemodyBoundPointerEvents = true;

    function getPoint(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * (GAME_CANVAS_LOGICAL_WIDTH / rect.width),
        y: (event.clientY - rect.top) * (GAME_CANVAS_LOGICAL_HEIGHT / rect.height)
      };
    }

    canvas.addEventListener("pointerdown", event => {
      if (!running || shellMenu.classList.contains("open")) return;
      const point = getPoint(event);
      const index = MemodyNoteFromPoint(point);
      if (index == null) return;
      event.preventDefault();
      MemodyIgnoreClickUntil = performance.now() + 700;
      MemodyPointerDown = true;
      MemodyPointerId = event.pointerId;
      try { canvas.setPointerCapture(event.pointerId); } catch (err) {}
      MemodyHandlePointerNote(index);
    });

    canvas.addEventListener("pointermove", event => {
      if (!MemodyPointerDown || event.pointerId !== MemodyPointerId) return;
      const point = getPoint(event);
      MemodyHandlePointerNote(MemodyNoteFromPoint(point));
    });

    function releasePointer(event) {
      if (!MemodyPointerDown || event.pointerId !== MemodyPointerId) return;
      const commitIndex = MemodyHeldNoteIndex;
      MemodyPointerDown = false;
      MemodyPointerId = null;
      MemodyIgnoreClickUntil = performance.now() + 500;
      MemodyStopHeldTone();
      if (commitIndex != null) MemodyHandleNote(commitIndex);
      try {
        if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      } catch (err) {}
    }

    canvas.addEventListener("pointerup", releasePointer);
    canvas.addEventListener("pointercancel", releasePointer);
  }

  function MemodyBindDesktopKeys() {
    if (MemodyBoundKeyboardEvents) return;
    MemodyBoundKeyboardEvents = true;

    document.addEventListener("keydown", event => {
      if (gameScreen.style.display !== "block" || !running) return;
      if (shellMenu.classList.contains("open")) return;
      const key = event.key.toLowerCase();
      if (!(key in Memody_KEYBOARD_MAP)) return;
      event.preventDefault();
      if (MemodyKeysHeld.has(key)) return;
      MemodyKeysHeld.add(key);
      const index = Memody_KEYBOARD_MAP[key];
      MemodySelectionVisible = false;
      MemodyStartHeldTone(index, 0.095);
      MemodyHandleNote(index);
    });

    document.addEventListener("keyup", event => {
      const key = event.key.toLowerCase();
      if (key === " " || key === "enter") {
        event.preventDefault();
        MemodyReleaseControlHold();
        return;
      }
      if (!(key in Memody_KEYBOARD_MAP)) return;
      MemodyKeysHeld.delete(key);
      if (MemodyHeldNoteIndex === Memody_KEYBOARD_MAP[key]) MemodyStopHeldTone();
    });
  }

  function gameInit() {
    MemodySequence = [];
    MemodyOutcome = "treasure";
    MemodyInputIndex = 0;
    MemodySelectedNote = 0;
    MemodySelectionVisible = false;
    MemodyControlHeld = false;
    MemodyActiveNote = null;
    MemodyKeyboardRects = [];
    MemodyResultCueDone = false;
    MemodyPointerDown = false;
    MemodyPointerId = null;
    MemodyKeysHeld.clear();
    MemodyStopHeldTone();
    MemodyBindDesktopPointer();
    MemodyBindDesktopKeys();
    MemodyAddRandomNote();
    MemodyBeginShowing();
    gameDraw();
  }

    function gameUpdate() {
    const now = performance.now();

    if (MemodyActiveNote != null && now > MemodyActiveUntil && MemodyPhase !== "show") {
      MemodyActiveNote = null;
    }

    if (MemodyPhase === "show" && now >= MemodyNextShowAt) {
      if (!MemodyShowOn) {
        if (MemodyShowIndex >= MemodySequence.length) {
          MemodyPhase = "input";
          MemodyActiveNote = null;
          MemodySelectedNote = 0;
          MemodySelectionVisible = false;
          MemodySetPrompt("Play the melody");
        } else {
          const noteIndex = MemodySequence[MemodyShowIndex];
          MemodyShowOn = true;
          MemodyActiveNote = noteIndex;
          MemodyActiveUntil = now + Memody_SHOW_MS;
          MemodyPreviewNote(noteIndex, Memody_SHOW_MS / 1000, 0.085);
          MemodyNextShowAt = now + Memody_SHOW_MS;
        }
      } else {
        MemodyShowOn = false;
        MemodyActiveNote = null;
        MemodyShowIndex += 1;
        MemodyNextShowAt = now + Memody_GAP_MS;
      }
    } else if (MemodyPhase === "walk") {
      const elapsed = now - MemodyAnimStart;
      if (!MemodyResultCueDone && elapsed > Memody_TRANSITION_MS + 140) {
        MemodyResultCueDone = true;
        if (MemodyOutcome === "treasure") {
          MemodySetPrompt("Treasure!");
          MemodySoundTreasure();
        } else {
          MemodySetPrompt("A monster attacks!");
          MemodySoundMonster();
        }
      }

      if (elapsed > Memody_WALK_MS) {
        if (MemodyOutcome === "treasure") {
          MemodyAddRandomNote();
          MemodyBeginShowing();
        } else {
          endGame("The monster got you!");
        }
      }
    }
  }
  function gameDraw() {
    const now = performance.now();
    MemodyDrawHallway(now);
    MemodyDrawResultOverlay(now);
    MemodyDrawKeyboard();
  }

  function MemodyMoveSelection(step) {
    if (MemodyPhase !== "input") return;
    if (!MemodySelectionVisible || MemodySelectedNote == null) {
      MemodySelectedNote = step > 0 ? 0 : Memody_NOTES.length - 1;
    } else {
      MemodySelectedNote = (MemodySelectedNote + step + Memody_NOTES.length) % Memody_NOTES.length;
    }
    MemodySelectionVisible = true;
    if (MemodyControlHeld) {
      MemodyActiveNote = MemodySelectedNote;
      MemodyActiveUntil = performance.now() + 160;
      MemodyStartHeldTone(MemodySelectedNote, 0.095);
    }
  }

  function MemodyStartControlHold() {
    if (MemodyPhase !== "input") return;
    if (!MemodySelectionVisible || MemodySelectedNote == null) {
      MemodySelectedNote = 0;
      MemodySelectionVisible = true;
    }
    if (MemodyControlHeld && MemodyHeldNoteIndex === MemodySelectedNote) return;
    MemodyControlHeld = true;
    MemodyActiveNote = MemodySelectedNote;
    MemodyActiveUntil = performance.now() + 160;
    MemodyStartHeldTone(MemodySelectedNote, 0.095);
  }

  function MemodyReleaseControlHold() {
    if (!MemodyControlHeld) return;
    const commitIndex = MemodyHeldNoteIndex != null ? MemodyHeldNoteIndex : MemodySelectedNote;
    MemodyControlHeld = false;
    MemodyStopHeldTone();
    if (commitIndex != null) MemodyHandleNote(commitIndex);
    if (MemodyPhase === "input") {
      MemodySelectedNote = commitIndex;
      MemodySelectionVisible = true;
    }
  }

  MemodyBuildMobileTouchKeyboard();
  MemodyBindMobileTouchKeyboard();

  function gameInput(action) {
    if (action === "left" && MemodyPhase === "input") {
      MemodyMoveSelection(-1);
      return;
    }

    if (action === "right" && MemodyPhase === "input") {
      MemodyMoveSelection(1);
      return;
    }

    if ((action === "up" || action === "down") && MemodyPhase === "input") {
      MemodyMoveSelection(action === "up" ? 1 : -1);
      return;
    }

    if (action === "a" && MemodyPhase === "input") {
      MemodyStartControlHold();
      return;
    }

    if ((action === "a_release" || action === "a_up") && MemodyPhase === "input") {
      MemodyReleaseControlHold();
    }
  }

  function gamePointer(point) {
    if (performance.now() < MemodyIgnoreClickUntil) return;
    const index = MemodyNoteFromPoint(point);
    if (index == null) return;
    MemodyPreviewNote(index, 0.2, 0.085);
    MemodyHandleNote(index);
  }

  function gameStop() {
    MemodyStopHeldTone();
    MemodyPointerDown = false;
    MemodyPointerId = null;
    MemodyTouchKeyboardPointerId = null;
    MemodyTouchKeyboardActiveIndex = null;
    MemodySetTouchKeyboardPressed(null);
    MemodyControlHeld = false;
    MemodySelectionVisible = false;
    MemodyActiveNote = null;
  }



    let resizeObserver = null;

    if ("ResizeObserver" in window) {
      resizeObserver = new ResizeObserver(() => {
        scaleAppToFrame();
        if (!sticks.left.active) resetJoystick(sticks.left);
        if (!sticks.right.active) resetJoystick(sticks.right);

        if (!running) {
          resetGameCanvasTransform();
          gameDraw();
        }
      });

      resizeObserver.observe(appFrame);
    }

    window.addEventListener("resize", () => {
      scaleAppToFrame();
      if (!sticks.left.active) resetJoystick(sticks.left);
      if (!sticks.right.active) resetJoystick(sticks.right);

      if (!running) {
        resetGameCanvasTransform();
        gameDraw();
      }
    });

    window.addEventListener("orientationchange", () => {
      setTimeout(() => {
        scaleAppToFrame();
        if (!sticks.left.active) resetJoystick(sticks.left);
        if (!sticks.right.active) resetJoystick(sticks.right);

        if (!running) {
          resetGameCanvasTransform();
          gameDraw();
        }
      }, 250);
    });

    function shutDownMobileArcade() {
      try {
        stopGame();
      } catch (err) {}

      if (audioCtx && audioCtx.state !== "closed") {
        audioCtx.close().catch(() => {});
      }

      audioCtx = null;
    }

    window.addEventListener("pagehide", shutDownMobileArcade);

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "hidden") return;
      resetJoystick(sticks.left);
      resetJoystick(sticks.right);
    });

    scaleAppToFrame();
    loadPlayers();
    resetJoystick(sticks.left);
    resetJoystick(sticks.right);
    configureMobileControls();
    gameInit();
    resetGameCanvasTransform();
    gameDraw();



  </script>
