<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Melo Memo | Piano Arcade</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #appFrame {
      width: 100%;
      aspect-ratio: 390 / 670;
      min-height: min(100vh, 670px);
      position: relative;
      overflow: hidden;
      background: #202020;
    }

    #appStage {
      width: 390px;
      height: 670px;
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: top left;
      transform: scale(var(--app-scale, 1));
      overflow: hidden;
      background: linear-gradient(180deg, #2f2f2f, #191919);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: auto;
      color: white;
    }

    #appStage *:not(input):not(textarea) {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    button {
      font-family: Arial, sans-serif;
      touch-action: none;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input,
    select {
      font-size: 16px;
      padding: 8px;
      border-radius: 10px;
      border: 2px solid #111;
      box-sizing: border-box;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       PLAYER MENU
       ========================= */

    #menuScreen {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #2f2f2f, #191919);
      padding: 13px 16px 14px;
      overflow: visible;
      text-align: center;
      z-index: 20;
      touch-action: pan-y;
    }

    #menuScreen h1 {
      margin: 4px 0 9px;
      font-size: 28px;
    }

    #leaderboardBox {
      margin: 0 auto 9px;
      padding: 9px;
      background: rgba(255,255,255,0.1);
      border-radius: 14px;
      max-width: 350px;
    }

    #leaderboardBox h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    #leaderboardList {
      text-align: left;
      max-width: 230px;
      margin: 0 auto;
      font-size: 15px;
    }

    #playerPickerBox {
      margin: 0 auto 9px;
      padding: 9px;
      background: rgba(255,255,255,0.08);
      border-radius: 14px;
      max-width: 350px;
    }

    #playerSearchInput {
      width: 100%;
      margin-bottom: 8px;
    }

    #playerSelect {
      width: 100%;
      height: 120px;
      background: #f8fbff;
      color: #111827;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border: 2px solid #111;
      border-radius: 10px;
      text-align: left;
    }

    .playerOption {
      padding: 10px;
      border-bottom: 1px solid rgba(17,24,39,0.12);
      font-size: 16px;
      line-height: 1.2;
      background: #f8fbff;
      color: #111827;
    }

    .playerOption:last-child {
      border-bottom: 0;
    }

    .playerOption.selected {
      background: #ffe08a;
      font-weight: bold;
    }

    .playerOption.disabled {
      color: rgba(17,24,39,0.55);
      text-align: center;
      font-style: italic;
    }

    #selectedPlayerActions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 7px;
    }

    #selectedPlayerActions button,
    #addPlayerBtn,
    #startGameBtn,
    #exitPageBtn {
      min-height: 38px;
      border-radius: 12px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
    }

    #resetSelectedPlayerBtn {
      background: #fff3bf;
    }

    #removeSelectedPlayerBtn {
      background: #ffd6d6;
    }

    #addPlayerRow {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
      margin: 0 auto 8px;
      max-width: 350px;
    }

    #newPlayerName {
      width: 100%;
    }

    #selectedPlayerText {
      margin: 7px 0;
      font-size: 15px;
      opacity: 0.9;
    }

    #startGameBtn {
      background: #dff3ff;
      min-width: 150px;
    }

    #exitPageBtn {
      min-width: 110px;
    }

    /* =========================
       GAME / EMULATOR
       ========================= */

    #gameScreen {
      position: absolute;
      inset: 0;
      display: none;
      background: linear-gradient(180deg, #2f2f2f, #191919);
      z-index: 10;
      touch-action: auto;
    }

    #screen {
      position: absolute;
      left: 0;
      top: 0;
      width: 390px;
      height: 219px;
      overflow: hidden;
      background: #0b1420;
      border: 1px solid #2b2b2b;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.05),
        0 1px 3px rgba(0,0,0,0.45);
    }

    #gameCanvas {
      width: 390px;
      height: 219px;
      display: block;
      background: #f7fbff;
      image-rendering: pixelated;
    }

    #gameOverBox {
      display: none;
      position: absolute;
      left: 34px;
      right: 34px;
      top: 35px;
      padding: 18px 12px;
      background: rgba(16, 24, 39, 0.93);
      border: 3px solid white;
      border-radius: 16px;
      color: white;
      text-align: center;
      z-index: 8;
    }

    #gameOverBox h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    #gameOverScore {
      margin: 0 0 10px;
      font-size: 15px;
    }

    #gameOverBox button {
      border: 2px solid #111;
      border-radius: 12px;
      background: white;
      color: #111827;
      padding: 8px 12px;
      margin: 3px;
      font-size: 12px;
      font-weight: bold;
    }

    #lcd {
      position: absolute;
      left: 0;
      top: 219px;
      width: 390px;
      height: 48px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02)),
        #17251c;
      border-top: 3px solid #0c0c0c;
      border-bottom: 3px solid #0c0c0c;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.04),
        inset 0 0 14px rgba(0,0,0,0.35);
      color: #b7ff9e;
      font-family: "Courier New", monospace;
      text-shadow: 0 0 7px rgba(183,255,158,0.35);
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: 1fr 1fr;
      align-items: center;
      padding: 5px 16px;
      pointer-events: none;
    }

    #lcdMessage {
      grid-column: 1 / 3;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #lcdScore {
      font-size: 12px;
    }

    #lcdBest {
      font-size: 13px;
      text-align: right;
    }

    #controls {
      position: absolute;
      left: 0;
      top: 267px;
      width: 390px;
      height: 400px;
      background: linear-gradient(180deg, #303030, #181818);
      touch-action: auto;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    #controls *,
    #screen,
    #gameCanvas {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* D-PAD */

    #dpad {
      position: absolute;
      left: 17px;
      top: 19px;
      width: 150px;
      height: 150px;
      touch-action: manipulation;
    }

    .dpadBtn {
      position: absolute;
      width: 50px;
      height: 50px;
      border: none;
      background: #111;
      color: rgba(255,255,255,0.86);
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 22px;
      line-height: 50px;
      text-align: center;
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.08),
        0 7px 13px rgba(0,0,0,0.45);
    }

    .dpadBtn.pressed,
    .dpadBtn:active {
      filter: brightness(1.35);
      transform: scale(0.94);
    }

    #dpadUp { left: 50px; top: 0; border-radius: 10px 10px 3px 3px; }
    #dpadLeft { left: 0; top: 50px; border-radius: 10px 3px 3px 10px; }
    #dpadCenter { left: 50px; top: 50px; border-radius: 4px; pointer-events: none; }
    #dpadRight { left: 100px; top: 50px; border-radius: 3px 10px 10px 3px; }
    #dpadDown { left: 50px; top: 100px; border-radius: 3px 3px 10px 10px; }

    /* FACE BUTTONS */

    #faceButtons {
      position: absolute;
      right: 18px;
      top: 20px;
      width: 150px;
      height: 150px;
    }

    .faceBtn {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 20px;
      font-weight: bold;
      background: radial-gradient(circle at 30% 30%, #ff82ad, #9d003d);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.15),
        0 10px 18px rgba(0,0,0,0.45);
    }

    .faceBtn.pressed,
    .faceBtn:active {
      transform: scale(0.92);
      filter: brightness(1.2);
    }

    #buttonX { left: 46px; top: 0; }
    #buttonY { left: 0; top: 46px; }
    #buttonA { left: 92px; top: 46px; }
    #buttonB { left: 46px; top: 92px; }

    /* JOYSTICKS */

    .joystickPad {
      position: absolute;
      width: 112px;
      height: 112px;
      border-radius: 18px;
      background: rgba(255,255,255,0.035);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.07);
      touch-action: none;
    }

    #leftJoystickPad {
      left: 36px;
      top: 188px;
    }

    #rightJoystickPad {
      right: 37px;
      top: 188px;
    }

    .joystickBase {
      position: absolute;
      left: 11px;
      top: 11px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, #3f3f3f, #161616);
      box-shadow:
        inset 0 0 0 3px rgba(255,255,255,0.08),
        0 9px 18px rgba(0,0,0,0.45);
      pointer-events: none;
    }

    .joystickKnob {
      position: absolute;
      left: 56px;
      top: 56px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #777, #202020);
      transform: translate(-50%, -50%);
      box-shadow: 0 8px 18px rgba(0,0,0,0.55);
      pointer-events: none;
    }

    /* START / SELECT */

    #systemButtons {
      position: absolute;
      left: 50%;
      top: 326px;
      width: 164px;
      height: 34px;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .systemBtn {
      width: 76px;
      height: 32px;
      border-radius: 999px;
      border: none;
      background: #101010;
      color: rgba(255,255,255,0.78);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.12);
    }

    .systemBtn.pressed,
    .systemBtn:active {
      transform: scale(0.96);
      filter: brightness(1.2);
    }

    /* =========================
       EXPANDABLE SHELL MENU
       ========================= */

    #shellMenu {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 60;
      background: rgba(0,0,0,0.62);
      padding: 22px 14px;
      color: white;
    }

    #shellMenu.open {
      display: block;
    }

    #shellMenuPanel {
      width: 100%;
      max-height: 100%;
      overflow: hidden;
      background: #101827;
      border: 3px solid white;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.45);
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    #shellMenuHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 12px 7px;
    }

    #shellMenuHeader h2 {
      margin: 0;
      font-size: 22px;
    }

    #shellMenuCloseBtn {
      width: 40px;
      height: 36px;
      padding: 0;
      border-radius: 12px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 26px;
      font-weight: bold;
      line-height: 1;
    }

    #shellMenuTabs {
      display: flex;
      gap: 7px;
      padding: 0 12px 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .shellMenuTab {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 7px 11px;
      border-radius: 999px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
    }

    .shellMenuTab.active {
      background: #ffe08a;
    }

    #shellMenuBody {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 14px 14px;
      text-align: left;
      font-size: 15px;
      line-height: 1.38;
      touch-action: pan-y;
    }


    .pauseMenuActions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
      margin-top: 12px;
    }

    .pauseActionBtn {
      min-height: 42px;
      border-radius: 12px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
    }

    .pauseActionBtn.saveExit {
      background: #dff3ff;
    }

    .pauseActionBtn.noSaveExit {
      background: #ffd6d6;
    }

    .pauseActionBtn.resumeGame {
      background: #fff3bf;
    }

    #shellMenuBody h3 {
      margin: 4px 0 8px;
      font-size: 20px;
    }

    #shellMenuBody ul {
      margin-top: 8px;
      padding-left: 21px;
    }

    #shellMenuBody code {
      background: rgba(255,255,255,0.12);
      padding: 2px 5px;
      border-radius: 6px;
    }

  


    /* Melo Memo only: keep the controls that help the player repeat melodies. */
    #dpad {
      left: 32px;
      top: 52px;
      width: 132px;
      height: 56px;
    }

    #dpadUp,
    #dpadDown,
    #dpadCenter,
    #buttonX,
    #buttonY,
    #buttonB,
    #leftJoystickPad,
    #rightJoystickPad,
    #selectButton {
      display: none !important;
    }

    #dpadLeft,
    #dpadRight {
      top: 3px;
      width: 58px;
      height: 50px;
      line-height: 50px;
      font-size: 22px;
      border-radius: 14px;
    }

    #dpadLeft { left: 0; }
    #dpadRight { left: 74px; }

    #faceButtons {
      right: 25px;
      top: 38px;
      width: 140px;
      height: 86px;
    }

    #buttonA {
      left: 19px;
      top: 9px;
      width: 102px;
      height: 62px;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    #systemButtons {
      top: 326px;
      width: 92px;
    }

    #startButton {
      width: 88px;
      font-size: 11px;
    }


  </style>
</head>

<body>
  <main id="appFrame">
    <section id="appStage">
      <div id="menuScreen">
        <h1>Choose Player</h1>

        <div id="leaderboardBox">
          <h2>Leaderboard</h2>
          <ol id="leaderboardList"></ol>
        </div>

        <div id="playerPickerBox">
          <input id="playerSearchInput" placeholder="Search players..." autocomplete="off" />
          <div id="playerSelect" role="listbox" aria-label="Choose player"></div>

          <div id="selectedPlayerActions">
            <button id="resetSelectedPlayerBtn">Reset</button>
            <button id="removeSelectedPlayerBtn">Remove</button>
          </div>
        </div>

        <div id="addPlayerRow">
          <input id="newPlayerName" placeholder="New player name" />
          <button id="addPlayerBtn">Add Player</button>
        </div>

        <p id="selectedPlayerText">No player selected</p>
        <button id="startGameBtn">Start Game</button>
      </div>

      <div id="gameScreen">
        <div id="screen">
          <canvas id="gameCanvas" width="390" height="219"></canvas>

          <div id="gameOverBox">
            <h1>Game Over</h1>
            <p id="gameOverScore"></p>
            <button id="playAgainBtn">Play Again</button>
            <button id="backToMenuBtn">Player Menu</button>
          </div>
        </div>

        <div id="lcd">
          <div id="lcdMessage">READY</div>
          <div id="lcdScore">SCORE: <span id="score">0</span></div>
          <div id="lcdBest">BEST: <span id="bestScore">0</span></div>
        </div>

        <div id="controls">
          <div id="dpad">
            <button id="dpadUp" class="dpadBtn" data-action="up">▲</button>
            <button id="dpadLeft" class="dpadBtn" data-action="left">◄</button>
            <button id="dpadCenter" class="dpadBtn"></button>
            <button id="dpadRight" class="dpadBtn" data-action="right">►</button>
            <button id="dpadDown" class="dpadBtn" data-action="down">▼</button>
          </div>

          <div id="faceButtons">
            <button id="buttonX" class="faceBtn" data-action="x">X</button>
            <button id="buttonY" class="faceBtn" data-action="y">Y</button>
            <button id="buttonA" class="faceBtn" data-action="a">PLAY</button>
            <button id="buttonB" class="faceBtn" data-action="b">B</button>
          </div>

          <div id="leftJoystickPad" class="joystickPad" data-stick="left">
            <div class="joystickBase"></div>
            <div id="leftJoystickKnob" class="joystickKnob"></div>
          </div>

          <div id="rightJoystickPad" class="joystickPad" data-stick="right">
            <div class="joystickBase"></div>
            <div id="rightJoystickKnob" class="joystickKnob"></div>
          </div>

          <div id="systemButtons">
            <button id="selectButton" class="systemBtn" data-action="select">SELECT</button>
            <button id="startButton" class="systemBtn" data-action="start">MENU</button>
          </div>
        </div>
      </div>

      <div id="shellMenu" aria-hidden="true">
        <div id="shellMenuPanel" role="dialog" aria-modal="true" aria-label="Pause panel">
          <div id="shellMenuHeader">
            <h2>Pause</h2>
            <button id="shellMenuCloseBtn" type="button" aria-label="Close panel">×</button>
          </div>
          <div id="shellMenuTabs" role="tablist" aria-label="Pause panel tabs"></div>
          <div id="shellMenuBody"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const DESIGN_WIDTH = 390;
    const DESIGN_HEIGHT = 670;
    const STORAGE_KEY = "memodyMobilePlayers_v1";
    const FIRST_TIME_HELP_VERSION = "memodyMobileHowToPlay_v1";
    const STORAGE_MESSAGE_SOURCE = "PianoArcadeShell";
    const WIX_STORAGE_MESSAGE_SOURCE = "PianoArcadeWixStorage";
    const SCORE_LABEL = "Doors";

    const appFrame = document.getElementById("appFrame");
    const appStage = document.getElementById("appStage");

    const menuScreen = document.getElementById("menuScreen");
    const gameScreen = document.getElementById("gameScreen");

    const leaderboardList = document.getElementById("leaderboardList");
    const playerSearchInput = document.getElementById("playerSearchInput");
    const playerSelect = document.getElementById("playerSelect");
    playerSelect.addEventListener("touchmove", event => event.stopPropagation(), { passive: true });
    const resetSelectedPlayerBtn = document.getElementById("resetSelectedPlayerBtn");
    const removeSelectedPlayerBtn = document.getElementById("removeSelectedPlayerBtn");
    const newPlayerName = document.getElementById("newPlayerName");
    const addPlayerBtn = document.getElementById("addPlayerBtn");
    const startGameBtn = document.getElementById("startGameBtn");
    const selectedPlayerText = document.getElementById("selectedPlayerText");

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const lcdMessage = document.getElementById("lcdMessage");
    const scoreEl = document.getElementById("score");
    const bestScoreEl = document.getElementById("bestScore");

    const gameOverBox = document.getElementById("gameOverBox");
    const gameOverScore = document.getElementById("gameOverScore");
    const playAgainBtn = document.getElementById("playAgainBtn");
    const backToMenuBtn = document.getElementById("backToMenuBtn");

    const leftJoystickPad = document.getElementById("leftJoystickPad");
    const rightJoystickPad = document.getElementById("rightJoystickPad");
    const leftJoystickKnob = document.getElementById("leftJoystickKnob");
    const rightJoystickKnob = document.getElementById("rightJoystickKnob");

    const shellMenu = document.getElementById("shellMenu");
    const shellMenuTabsEl = document.getElementById("shellMenuTabs");
    const shellMenuBody = document.getElementById("shellMenuBody");
    const shellMenuCloseBtn = document.getElementById("shellMenuCloseBtn");

    let appScale = 1;
    let players = {};
    let selectedPlayer = null;
    let score = 0;
    let running = false;
    let loopId = null;
    let audioCtx = null;
    let shellMenuWasRunning = false;
    let pendingStartAfterHelp = false;
    let wixStorageAnswered = false;

    const sticks = {
      left: {
        active: false,
        pointerId: null,
        x: 0,
        y: 0,
        maxDistance: 34,
        pad: leftJoystickPad,
        knob: leftJoystickKnob
      },
      right: {
        active: false,
        pointerId: null,
        x: 0,
        y: 0,
        maxDistance: 34,
        pad: rightJoystickPad,
        knob: rightJoystickKnob
      }
    };


    /*
      EXPANDABLE SHELL MENU
      Add game-specific tabs with:
      registerShellMenuTab("map", "Map", "<h3>Map</h3><p>Map content...</p>");
      Update default tabs with:
      updateShellMenuTab("instructions", "<h3>How to Play</h3><p>New instructions...</p>");
    */
    const shellMenuTabs = [
      {
        id: "pause",
        label: "Pause",
        html: `
          <h3>Pause</h3>
          <p>Return to the player menu. Choose whether this run should count toward the saved best score.</p>
          <div class="pauseMenuActions">
            <button type="button" class="pauseActionBtn saveExit" data-pause-action="save-exit">Save &amp; Exit</button>
            <button type="button" class="pauseActionBtn noSaveExit" data-pause-action="exit-no-save">Exit Without Saving</button>
            <button type="button" class="pauseActionBtn resumeGame" data-pause-action="resume">Resume Game</button>
          </div>
        `
      },
      {
        id: "controls",
        label: "Controls",
        html: `
          <h3>Controls</h3>
          <ul>

        Either way, this stores only each player's best score.

      if (!savedData || typeof savedData !== "object") {
        return { players: {}, selectedPlayer: null };

      if (

        typeof savedData.players === "object" &&
        !Array.isArray(savedData.players)
      ) {
        return {
          players: cleanPlayers(savedData.players),

        };

      return {

        type,
        storageKey: STORAGE_KEY,

      return true;

      if (askedWixParent) {

    function joystickPointFromEvent(event, stick) {
      const rect = stick.pad.getBoundingClientRect();

      return {
        x: (event.clientX - rect.left) / appScale,
        y: (event.clientY - rect.top) / appScale
      };
    }

    function setJoystickFromEvent(event, stick) {
      const point = joystickPointFromEvent(event, stick);

      const centerX = stick.pad.offsetWidth / 2;
      const centerY = stick.pad.offsetHeight / 2;

      const limitedX = clamp(point.x, centerX - stick.maxDistance, centerX + stick.maxDistance);
      const limitedY = clamp(point.y, centerY - stick.maxDistance, centerY + stick.maxDistance);

      const dx = limitedX - centerX;
      const dy = limitedY - centerY;

      stick.x = dx / stick.maxDistance;
      stick.y = dy / stick.maxDistance;

      stick.knob.style.left = `${centerX + dx}px`;
      stick.knob.style.top = `${centerY + dy}px`;
    }

    function resetJoystick(stick) {
      stick.active = false;
      stick.pointerId = null;
      stick.x = 0;
      stick.y = 0;

      stick.knob.style.left = `${stick.pad.offsetWidth / 2}px`;
      stick.knob.style.top = `${stick.pad.offsetHeight / 2}px`;
    }

    function bindJoystick(stick) {
      stick.pad.addEventListener("pointerdown", event => {
        event.preventDefault();

        stick.active = true;
        stick.pointerId = event.pointerId;

        stick.pad.setPointerCapture(event.pointerId);
        setJoystickFromEvent(event, stick);
      });

      stick.pad.addEventListener("pointermove", event => {
        if (!stick.active || event.pointerId !== stick.pointerId) return;

        event.preventDefault();
        setJoystickFromEvent(event, stick);
      });

      stick.pad.addEventListener("pointerup", event => {
        if (event.pointerId !== stick.pointerId) return;

        event.preventDefault();

        if (stick.pad.hasPointerCapture(event.pointerId)) {
          stick.pad.releasePointerCapture(event.pointerId);
        }

        resetJoystick(stick);
      });

      stick.pad.addEventListener("pointercancel", () => resetJoystick(stick));
    }

    bindJoystick(sticks.left);

        if (!AudioContextClass) return null;

    function beep(freq, duration, type = "sine", volume = 0.08) {
      const ac = getAudio();
      if (!ac) return;

      const osc = ac.createOscillator();
      const gain = ac.createGain();

      osc.type = type;
      osc.frequency.value = freq;

      gain.gain.setValueAtTime(volume, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);

      osc.connect(gain);
      gain.connect(ac.destination);

      osc.start();
      osc.stop(ac.currentTime + duration);
    }

    function memodyGetKeyboardRects() {
      const totalW = Math.min(canvas.width * 0.58, 232);
      const totalH = Math.min(canvas.height * 0.24, 60);
      const x0 = (canvas.width - totalW) / 2;
      const y0 = canvas.height - totalH - 10;
      const whiteCount = MEMODY_NOTES.filter(note => !note.black).length;
      const whiteW = totalW / whiteCount;
      const blackW = whiteW * 0.62;
      const blackH = totalH * 0.62;
      const rects = [];
      let whiteIndex = 0;

      MEMODY_NOTES.forEach((note, index) => {
        if (!note.black) {
          rects[index] = { x: x0 + whiteIndex * whiteW, y: y0, w: whiteW, h: totalH, black: false, z: 0 };
          whiteIndex += 1;
        } else {
          rects[index] = { x: x0 + whiteIndex * whiteW - blackW / 2, y: y0, w: blackW, h: blackH, black: true, z: 1 };

    function memodyNoteFromPoint(point) {

      for (const rect of sorted) {
        if (point.x >= rect.x && point.x <= rect.x + rect.w && point.y >= rect.y && point.y <= rect.y + rect.h) {

    function memodyBuildTone(index, volume = 0.088) {
      const ac = getAudio();
      if (!ac || !MEMODY_NOTES[index]) return null;
      const note = MEMODY_NOTES[index];
      const now = ac.currentTime;
      const osc = ac.createOscillator();
      const soft = ac.createOscillator();
      const gain = ac.createGain();
      const filter = ac.createBiquadFilter();

      osc.type = "triangle";
      soft.type = "sine";
      osc.frequency.setValueAtTime(note.freq, now);
      soft.frequency.setValueAtTime(note.freq * 2, now);
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(1850, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + 0.016);
      osc.connect(filter);
      soft.connect(filter);
      filter.connect(gain);
      gain.connect(ac.destination);
      osc.start(now);
      soft.start(now);

      return { ac, osc, soft, gain, stopped: false, index };

      tone.gain.gain.setValueAtTime(Math.max(0.0001, tone.gain.gain.value), now);
      tone.gain.gain.exponentialRampToValueAtTime(0.0001, now + releaseSeconds);
      tone.osc.stop(now + releaseSeconds + 0.02);
      tone.soft.stop(now + releaseSeconds + 0.02);

    function memodyCorridorMetrics(scale = 1, centerOffset = 0) {

    function memodyDrawCorridorShell(metrics, options = {}) {

    function memodyBindCanvasEvents() {

        if (commitIndex != null) memodyHandleNote(commitIndex);
        try {
          if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
        } catch (err) {}
      }

      canvas.addEventListener("pointerup", releasePointer);
      canvas.addEventListener("pointercancel", releasePointer);
    }

    function memodySlideSelectedNote(step) {
      if (memodyPhase !== "input") return;
      if (!memodySelectionVisible || memodySelectedNote == null) {
        memodySelectedNote = step > 0 ? 0 : MEMODY_NOTES.length - 1;
      } else {
        memodySelectedNote = (memodySelectedNote + step + MEMODY_NOTES.length) % MEMODY_NOTES.length;
      }
      memodySelectionVisible = true;
      if (memodyButtonAHeld) {
        memodyActiveNote = memodySelectedNote;
        memodyActiveUntil = performance.now() + 130;
        memodyStartHeldTone(memodySelectedNote, 0.09);
      }
    }

    function memodyStartButtonHold() {
      if (memodyPhase !== "input") return;
      if (!memodySelectionVisible || memodySelectedNote == null) {
        memodySelectedNote = 0;
        memodySelectionVisible = true;
      }
      if (memodyButtonAHeld && memodyHeldNoteIndex === memodySelectedNote) return;
      memodyButtonAHeld = true;
      memodyActiveNote = memodySelectedNote;
      memodyActiveUntil = performance.now() + 130;
      memodyStartHeldTone(memodySelectedNote, 0.09);
    }

    function memodyReleaseButtonHold() {
      if (!memodyButtonAHeld) return;
      const commitIndex = memodyHeldNoteIndex != null ? memodyHeldNoteIndex : memodySelectedNote;
      memodyButtonAHeld = false;
      memodySelectionVisible = false;
      memodyAButtonPointerId = null;
      memodyStopHeldTone();
      if (commitIndex != null) memodyHandleNote(commitIndex);
      if (memodyPhase === "input") {
        memodySelectedNote = commitIndex;
        memodySelectionVisible = true;
      }
    }

    function memodyBindButtonHoldEvents() {
      if (memodyButtonHoldEventsBound) return;
      memodyButtonHoldEventsBound = true;
      const aButton = document.getElementById("buttonA");
      if (!aButton) return;

      aButton.addEventListener("pointerdown", event => {
        memodyAButtonPointerId = event.pointerId;
      });

      aButton.addEventListener("pointerup", event => {
        if (memodyAButtonPointerId !== event.pointerId) return;
        event.preventDefault();
        memodyAButtonPointerId = null;
        memodyReleaseButtonHold();
      });

      aButton.addEventListener("pointercancel", event => {
        if (memodyAButtonPointerId !== event.pointerId) return;
        event.preventDefault();
        memodyAButtonPointerId = null;
        memodyButtonAHeld = false;
        memodyStopHeldTone();
      });

      document.addEventListener("pointerup", event => {
        if (memodyAButtonPointerId !== event.pointerId) return;
        memodyAButtonPointerId = null;
        memodyReleaseButtonHold();
      });
    }

    function gameInit() {
      memodySequence = [];
      memodyOutcome = "treasure";
      memodyInputIndex = 0;
      memodySelectedNote = 0;
      memodySelectionVisible = false;
      memodyActiveNote = null;
      memodyKeyboardRects = [];
      memodyResultCueDone = false;
      memodyPointerDown = false;
      memodyPointerId = null;
      resetJoystick(sticks.left);
      resetJoystick(sticks.right);
      memodyStopHeldTone();
      memodyBindCanvasEvents();
      memodyBindButtonHoldEvents();
      memodyAddRandomNote();
      memodyBeginShowing();
      gameDraw();
    }

        function gameUpdate() {
      const now = performance.now();

      if (memodyButtonAHeld && memodyPhase === "input" && now - memodyLastSlideAt > 135) {
        const x = sticks.left.x || 0;
        if (x > 0.55) {
          memodyLastSlideAt = now;
          memodySlideSelectedNote(1);
        } else if (x < -0.55) {
          memodyLastSlideAt = now;
          memodySlideSelectedNote(-1);
        }
      }

      if (memodyActiveNote != null && now > memodyActiveUntil && memodyPhase !== "show") {
        memodyActiveNote = null;
      }

      if (memodyPhase === "show" && now >= memodyNextShowAt) {
        if (!memodyShowOn) {
          if (memodyShowIndex >= memodySequence.length) {
            memodyPhase = "input";
            memodyActiveNote = null;
            memodySelectedNote = 0;
            memodySelectionVisible = false;
            setMessage("PLAY THE MELODY");
          } else {
            const noteIndex = memodySequence[memodyShowIndex];
            memodyShowOn = true;
            memodyActiveNote = noteIndex;
            memodyActiveUntil = now + MEMODY_SHOW_MS;
            memodyPreviewNote(noteIndex, MEMODY_SHOW_MS / 1000, 0.082);
            memodyNextShowAt = now + MEMODY_SHOW_MS;
          }
        } else {
          memodyShowOn = false;
          memodyActiveNote = null;
          memodyShowIndex += 1;
          memodyNextShowAt = now + MEMODY_GAP_MS;
        }
      } else if (memodyPhase === "walk") {
        const elapsed = now - memodyAnimStart;
        if (!memodyResultCueDone && elapsed > MEMODY_TRANSITION_MS + 120) {
          memodyResultCueDone = true;
          if (memodyOutcome === "treasure") {
            setMessage("TREASURE!");
            memodySoundTreasure();
          } else {
            setMessage("MONSTER!");
            memodySoundMonster();
          }
        }

        if (elapsed > MEMODY_WALK_MS) {
          if (memodyOutcome === "treasure") {
            memodyAddRandomNote();
            memodyBeginShowing();
          } else {
            endGame("The monster got you!");
          }
        }
      }
    }
    function gameDraw() {
      const now = performance.now();
      memodyDrawHallway(now);
      memodyDrawResultOverlay(now);
      memodyDrawKeyboard();
    }

    function gameInput(action) {
      if (memodyPhase !== "input") {
        if (action === "x") setMessage("WATCH FIRST");
        if (action === "y") setMessage(`DOORS ${score}`);
        if (action === "b") setMessage("WATCH THE DOOR");
        if (action === "select") setMessage("REMEMBER");
        return;
      }

      if (action === "left") {
        memodySlideSelectedNote(-1);
        return;
      }

      if (action === "right") {
        memodySlideSelectedNote(1);
        return;
      }

      if (action === "up") {
        memodySlideSelectedNote(1);
        return;
      }

      if (action === "down") {
        memodySlideSelectedNote(-1);
        return;
      }

      if (action === "a") {
        memodyStartButtonHold();
        return;
      }

      if (action === "x") setMessage("TAP OR HOLD KEYS");
      if (action === "y") setMessage(`DOORS ${score}`);
      if (action === "b") setMessage("ONE DOOR AHEAD");
      if (action === "select") setMessage("PLAY THE MELODY");
    }
    function gameStop() {
      resetJoystick(sticks.left);
      resetJoystick(sticks.right);
      memodyButtonAHeld = false;
      memodySelectionVisible = false;
      memodyAButtonPointerId = null;
      memodyStopHeldTone();
      memodyPointerDown = false;
      memodyPointerId = null;
      memodyActiveNote = null;
      memodyPhase = "idle";
    }



    window.MobileArcadeShell = {
      canvas,
      ctx,
      sticks,
      setScore,
      addScore,
      setMessage,
      endGame,
      soundCorrect,
      soundWin,
      soundLose,
      getAudio,
      openMenu: openShellMenu,
      closeMenu: closeShellMenu,
      registerMenuTab: registerShellMenuTab,
      updateMenuTab: updateShellMenuTab
    };

    function handleMemodyResize() {
      scaleAppToFrame();
      resetJoystick(sticks.left);
      resetJoystick(sticks.right);
    }

    if (typeof ResizeObserver !== "undefined") {
      const resizeObserver = new ResizeObserver(handleMemodyResize);
      resizeObserver.observe(appFrame);
    }

    window.addEventListener("resize", handleMemodyResize);
    window.addEventListener("orientationchange", () => setTimeout(handleMemodyResize, 250));

    handleMemodyResize();
    requestAnimationFrame(handleMemodyResize);
    setTimeout(handleMemodyResize, 80);
    loadPlayers();
    // Game initializes when Start Game is pressed.
  </script>
</body>
</html>
