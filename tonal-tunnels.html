    const firstCol = ttClamp(Math.floor((viewLeft - TT_ROOM_MARGIN_X) / TT_CELL_WIDTH), 0, TT_MAZE_COLS - 1);
    const lastCol = ttClamp(Math.floor((viewRight - TT_ROOM_MARGIN_X) / TT_CELL_WIDTH), 0, TT_MAZE_COLS - 1);
    const firstRow = ttClamp(Math.floor((viewTop - TT_ROOM_MARGIN_Y) / TT_CELL_HEIGHT), 0, TT_MAZE_ROWS - 1);
    const lastRow = ttClamp(Math.floor((viewBottom - TT_ROOM_MARGIN_Y) / TT_CELL_HEIGHT), 0, TT_MAZE_ROWS - 1);

    for (let row = firstRow; row <= lastRow; row++) {
      for (let col = firstCol; col <= lastCol; col++) {
        ttMapVisited.add(ttCellIndex(row, col));
      }
    }

    const currentCell = ttMapCellAtWorldPoint(ttPlayer.x + ttPlayer.w / 2, ttPlayer.y + ttPlayer.h / 2);
    ttMapVisited.add(currentCell);
    ttMapExplored.add(currentCell);

    // The map represents chambers, not exact camera pixels. Once the chamber that
    // contains the exit has been uncovered, reveal its door marker as well.
    if (ttMapVisited.has(ttMapExitCell)) {
      ttMapExitDiscovered = true;
    }
  }

  function ttClearHeldInputsForMap() {
    ttInput.left = false;
    ttInput.right = false;
    ttInput.up = false;
    ttInput.down = false;
    ttInput.jumpButton = false;
    ttInput.jumpQueued = false;
    ttInput.dashQueued = false;
    ttInput.interactQueued = false;
    ttInput.dropQueued = false;
    ttInput.joystickDownHeld = false;
    if (typeof resetJoystick === "function" && typeof sticks !== "undefined") {
      resetJoystick(sticks.left);
      resetJoystick(sticks.right);
    }
  }

  function ttSetMapOpen(open) {
    const nextOpen = Boolean(open);
    if (nextOpen && ttCollapseActive) return;
    if (ttMapOpen === nextOpen) return;
    ttMapOpen = nextOpen;
    if (ttMapOpen) {
      ttRepeatMenuOpen = false;
      stopAllGameSounds();
    }
    ttClearHeldInputsForMap();
    ttLastTime = performance.now();
    ttAccumulator = 0;
    if (ttMapOpen) ttUpdateMapDiscovery();
    ttRefreshMobileButtonLabels();
  }

  function ttToggleMap() {
    if (ttRepeatMenuOpen) return;
    ttSetMapOpen(!ttMapOpen);
  }

  function ttRefreshMobileButtonLabels() {
    if (typeof document === "undefined") return;
    const jumpBtn = document.getElementById("buttonA");
    const dashBtn = document.getElementById("buttonB");
    const useBtn = document.getElementById("buttonX");
    const mapBtn = document.getElementById("selectButton");
    const menuBtn = document.getElementById("startButton");
    if (jumpBtn) jumpBtn.textContent = ttMapOpen ? "CLOSE" : "JUMP";
    if (dashBtn) dashBtn.textContent = "DASH";
    if (useBtn) useBtn.textContent = "USE";
    if (mapBtn) mapBtn.textContent = "MAP";
    if (menuBtn) menuBtn.textContent = "MENU";
  }

  function ttCloneData(data) {
    return JSON.parse(JSON.stringify(data));
  }

  function ttAnyOverlayOpen() {
    return ttMapOpen || ttRepeatMenuOpen;
  }

  function ttResetPowerState() {
    ttFermataTime = 0;
    ttMetronomeTime = 0;
    ttAccentTime = 0;
    ttSlurTime = 0;
    ttMapRevealAll = false;
    ttSlurEdges = [];
    ttTrillEarthquakeTime = 0;
    ttTrillPendingCrystals = [];
    ttTrebleFlyTime = 0;
    ttRitTime = 0;
    ttBassCharges = 0;
    ttCrescendoArmed = false;
    ttDecrescendoArmed = false;
    ttLastPowerStatus = "";
  }

  function ttSetRepeatMenuOpen(open) {
    const nextOpen = Boolean(open);
    if (ttRepeatMenuOpen === nextOpen) return;
    ttRepeatMenuOpen = nextOpen;
    if (ttRepeatMenuOpen) {
      ttMapOpen = false;
      stopAllGameSounds();
      ttRepeatSelectedCell = ttMapCellAtWorldPoint(ttPlayer.x + ttPlayer.w / 2, ttPlayer.y + ttPlayer.h / 2);
    }
    ttClearHeldInputsForMap();
    ttLastTime = performance.now();
    ttAccumulator = 0;
  }

  function ttStoreCurrentRoomSnapshot() {
    ttRoomHistory.set(ttRoomNumber, {
      roomNumber: ttRoomNumber,
      platforms: ttCloneData(ttPlatforms),
      solids: ttCloneData(ttSolids.filter(solid => !solid.boundary)),
      spikes: ttCloneData(ttSpikes),
      shaftLandingZones: ttCloneData(ttShaftLandingZones),
      entranceDoor: ttCloneData(ttEntranceDoor),
      exitDoor: ttCloneData(ttExitDoor),
      spawn: ttCloneData(ttSpawn),
      routePlatformIds: Array.from(ttRoutePlatformIds),
      crystals: ttCloneData(ttCrystals),
      powerUps: ttCloneData(ttPowerUps),
      roomTarget: ttCloneData(ttRoomTarget),
      roomTimeLimit: ttRoomTimeLimit,
      roomTimeRemaining: ttRoomTimeRemaining,
      mapEdges: ttCloneData(ttMapEdges),
      mapEntranceCell: ttMapEntranceCell,
      mapExitCell: ttMapExitCell,
      mapVisited: Array.from(ttMapVisited),
      mapExplored: Array.from(ttMapExplored),
      mapRevealAll: ttMapRevealAll,
      slurEdges: ttCloneData(ttSlurEdges),
      mapExitDiscovered: ttMapExitDiscovered
    });
    ttHighestRoomGenerated = Math.max(ttHighestRoomGenerated, ttRoomNumber);
  }

  function ttLoadRoomSnapshot(snapshot) {
    if (!snapshot) return false;
    ttRoomNumber = snapshot.roomNumber;
    ttPlatforms = ttCloneData(snapshot.platforms);
    ttSolids = ttCloneData(snapshot.solids);
    ttSpikes = ttCloneData(snapshot.spikes);
    ttShaftLandingZones = ttCloneData(snapshot.shaftLandingZones);
    ttEntranceDoor = ttCloneData(snapshot.entranceDoor);
    ttExitDoor = ttCloneData(snapshot.exitDoor);
    ttSpawn = ttCloneData(snapshot.spawn);
    ttRoutePlatformIds = new Set(snapshot.routePlatformIds || []);
    ttCrystals = ttCloneData(snapshot.crystals);
    ttPowerUps = ttCloneData(snapshot.powerUps || []);
    ttCrystalBursts = [];
    ttRoomTarget = ttCloneData(snapshot.roomTarget);
    ttRoomTimeLimit = snapshot.roomTimeLimit;
    ttRoomTimeRemaining = snapshot.roomTimeRemaining;
    ttMapEdges = ttCloneData(snapshot.mapEdges || []);
    ttMapEntranceCell = snapshot.mapEntranceCell || 0;
    ttMapExitCell = snapshot.mapExitCell || 0;
    ttMapVisited = new Set(snapshot.mapVisited || []);
    ttMapExplored = new Set(snapshot.mapExplored || snapshot.mapVisited || []);
    ttMapRevealAll = Boolean(snapshot.mapRevealAll);
    ttSlurEdges = ttCloneData(snapshot.slurEdges || []);
    ttMapExitDiscovered = Boolean(snapshot.mapExitDiscovered);
    ttRoomIntroPhase = "active";
    ttRoomIntroTimer = 0;
    ttIntroCueStamp = "";
    ttCollapseActive = false;
    ttCollapseTimer = 0;
    ttFeedbackText = "";
    ttFeedbackTimer = 0;
    ttMapOpen = false;
    ttRepeatMenuOpen = false;
    const restoredMapRevealAll = ttMapRevealAll;
    const restoredSlurEdges = ttCloneData(ttSlurEdges);
    ttResetPowerState();
    ttMapRevealAll = restoredMapRevealAll;
    ttSlurEdges = restoredSlurEdges;
    ttBuildCollisionArrays();
    ttResetTraversalObjects();
    ttResetPlayer(true);
    ttUpdateRoomLabel();
    return true;
  }

  function ttOpenRepeatMenu() {
    const options = Array.from(ttVisibleMapCellSet())
      .filter(cellIndex => cellIndex !== ttMapCellAtWorldPoint(ttPlayer.x + ttPlayer.w / 2, ttPlayer.y + ttPlayer.h / 2))
      .sort((a, b) => a - b);
    if (!options.length) { ttSetFeedback("REPEAT • NO OTHER ROOMS", false); return false; }
    ttRepeatOptions = options;
    ttRepeatSelectedCell = options[0];
    ttSetRepeatMenuOpen(true);
    return true;
  }

  function ttConfirmRepeatSelection() {
    if (!ttRepeatMenuOpen) return false;
    ttTeleportToCell(ttRepeatSelectedCell);
    return true;
  }

  function ttGoToNextRoom() {
    const nextRoom = ttRoomNumber + 1;
    ttStoreCurrentRoomSnapshot();
    ttResetPowerState();
    if (ttRoomHistory.has(nextRoom)) {
      ttLoadRoomSnapshot(ttRoomHistory.get(nextRoom));
    } else {
      ttRoomNumber = nextRoom;
      ttGenerateRoom();
      ttResetPlayer(true);
      ttUpdateRoomLabel();
      ttHighestRoomGenerated = Math.max(ttHighestRoomGenerated, ttRoomNumber);
    }
  }

  function ttBuildMazeEdgeCandidate() {
    const total = TT_MAZE_COLS * TT_MAZE_ROWS;
    const start = ttRandInt(0, total - 1);
    const visited = new Set([start]);
    const stack = [start];
    const edgeSet = new Set();
    const edges = [];

    while (stack.length) {
      const current = stack[stack.length - 1];
      const choices = ttShuffle(ttCellNeighbors(current).filter(next => !visited.has(next)));
      if (!choices.length) {
        stack.pop();
        continue;
      }
      const next = choices[0];
      visited.add(next);
      stack.push(next);
      edgeSet.add(ttEdgeKey(current, next));
      edges.push({ a: current, b: next, extra: false, type: "corridor" });
    }

    for (let index = 0; index < total; index++) {
      for (const next of ttCellNeighbors(index)) {
        if (next < index) continue;
        const key = ttEdgeKey(index, next);
        if (edgeSet.has(key) || !ttChance(TT_EXTRA_EDGE_CHANCE)) continue;
        edgeSet.add(key);
        edges.push({ a: index, b: next, extra: true, type: "corridor" });
      }
    }

    return edges;
  }

  function ttEdgesConnectAll(edges, skippedIndex = -1) {
    const total = TT_MAZE_COLS * TT_MAZE_ROWS;
    const graph = Array.from({ length: total }, () => []);

    edges.forEach((edge, edgeIndex) => {
      if (edgeIndex === skippedIndex) return;
      graph[edge.a].push(edge.b);
      graph[edge.b].push(edge.a);
    });

    const visited = new Set([0]);
    const queue = [0];
    for (let head = 0; head < queue.length; head++) {
      for (const next of graph[queue[head]]) {
        if (visited.has(next)) continue;
        visited.add(next);
        queue.push(next);
      }
    }
    return visited.size === total;
  }

  function ttVerticalEdgeInfo(edge) {
    const a = ttCellFromIndex(edge.a);
    const b = ttCellFromIndex(edge.b);
    if (a.col !== b.col) return null;
    return {
      boundaryRow: Math.min(a.row, b.row),
      col: a.col
    };
  }

  function ttBalanceVerticalEdges(sourceEdges) {
    let edges = sourceEdges.map(edge => ({ ...edge }));

    const getBoundaryItems = boundaryRow => edges
      .map((edge, edgeIndex) => ({ edge, edgeIndex, info: ttVerticalEdgeInfo(edge) }))
      .filter(item => item.info && item.info.boundaryRow === boundaryRow);

    // First add missing vertical links. Three per floor boundary gives the map a
    // consistent number of ways up/down without turning every floor into a ladder.
    for (let boundaryRow = 0; boundaryRow < TT_MAZE_ROWS - 1; boundaryRow++) {
      while (getBoundaryItems(boundaryRow).length < TT_VERTICAL_LINK_TARGET) {
        const currentCols = new Set(getBoundaryItems(boundaryRow).map(item => item.info.col));
        const previousCols = boundaryRow > 0
          ? new Set(getBoundaryItems(boundaryRow - 1).map(item => item.info.col))
          : new Set();
        const nextCols = boundaryRow < TT_MAZE_ROWS - 2
          ? new Set(getBoundaryItems(boundaryRow + 1).map(item => item.info.col))
          : new Set();

        const choices = [];
        for (let col = 0; col < TT_MAZE_COLS; col++) {
          if (currentCols.has(col)) continue;
          let score = ttRand(0, 2);
          if (previousCols.has(col)) score -= 12;
          if (nextCols.has(col)) score -= 8;
          if (currentCols.size) {
            const minDistance = Math.min(...Array.from(currentCols, used => Math.abs(col - used)));
            score += minDistance * 5;
          }
          choices.push({ col, score });
        }

        choices.sort((a, b) => b.score - a.score);
        const choice = choices[0];
        if (!choice) break;
        edges.push({
          a: ttCellIndex(boundaryRow, choice.col),
          b: ttCellIndex(boundaryRow + 1, choice.col),
          extra: true,
          type: "corridor"
        });
      }
    }

    // Then remove surplus vertical links only when the full maze remains connected.
    for (let boundaryRow = 0; boundaryRow < TT_MAZE_ROWS - 1; boundaryRow++) {
      let guard = 0;
      while (getBoundaryItems(boundaryRow).length > TT_VERTICAL_LINK_TARGET && guard++ < 20) {
        const previousCols = boundaryRow > 0
          ? new Set(getBoundaryItems(boundaryRow - 1).map(item => item.info.col))
          : new Set();
        const nextCols = boundaryRow < TT_MAZE_ROWS - 2
          ? new Set(getBoundaryItems(boundaryRow + 1).map(item => item.info.col))
          : new Set();

        const removable = getBoundaryItems(boundaryRow)
          .map(item => ({
            ...item,
            priority:
              (item.edge.extra ? 30 : 0) +
              (previousCols.has(item.info.col) ? 10 : 0) +
              (nextCols.has(item.info.col) ? 8 : 0) +
              ttRand(0, 2)
          }))
          .sort((a, b) => b.priority - a.priority);

        let removed = false;
        for (const item of removable) {
          if (!ttEdgesConnectAll(edges, item.edgeIndex)) continue;
          edges.splice(item.edgeIndex, 1);
          removed = true;
          break;
        }
        if (!removed) break;
      }
    }

    return edges;
  }

  function ttScoreMazeEdges(edges) {
    const verticalCounts = new Array(TT_MAZE_ROWS - 1).fill(0);
    const verticalColumns = Array.from({ length: TT_MAZE_ROWS - 1 }, () => new Set());

    for (const edge of edges) {
      const info = ttVerticalEdgeInfo(edge);
      if (!info) continue;
      verticalCounts[info.boundaryRow]++;
      verticalColumns[info.boundaryRow].add(info.col);
    }

    let score = 0;
    for (let row = 0; row < verticalCounts.length; row++) {
      score += Math.abs(verticalCounts[row] - TT_VERTICAL_LINK_TARGET) * 30;
      const cols = Array.from(verticalColumns[row]).sort((a, b) => a - b);
      if (cols.length >= 2) {
        const span = cols[cols.length - 1] - cols[0];
        if (span < 3) score += (3 - span) * 10;
      }
      if (row > 0) {
        for (const col of verticalColumns[row]) {
          if (verticalColumns[row - 1].has(col)) score += 7;
        }
      }
    }
    return score;
  }

  function ttBuildMazeEdges() {
    let bestEdges = null;
    let bestScore = Infinity;

    for (let attempt = 0; attempt < 24; attempt++) {
      const candidate = ttBalanceVerticalEdges(ttBuildMazeEdgeCandidate());
      const score = ttScoreMazeEdges(candidate);
      if (score < bestScore) {
        bestScore = score;
        bestEdges = candidate;
      }
      if (score === 0) break;
    }

    return bestEdges || ttBalanceVerticalEdges(ttBuildMazeEdgeCandidate());
  }

  function ttBuildGraph(edges) {
    const total = TT_MAZE_COLS * TT_MAZE_ROWS;
    const graph = Array.from({ length: total }, () => []);
    edges.forEach((edge, edgeIndex) => {
      graph[edge.a].push({ node: edge.b, edgeIndex });
      graph[edge.b].push({ node: edge.a, edgeIndex });
    });
    return graph;
  }

  function ttBreadthFirstGraph(start, graph) {
    const distance = new Array(graph.length).fill(Infinity);
    const parent = new Array(graph.length).fill(-1);
    const parentEdge = new Array(graph.length).fill(-1);
    const queue = [start];
    distance[start] = 0;

    for (let head = 0; head < queue.length; head++) {
      const current = queue[head];
      for (const link of graph[current]) {
        if (distance[link.node] !== Infinity) continue;
        distance[link.node] = distance[current] + 1;
        parent[link.node] = current;
        parentEdge[link.node] = link.edgeIndex;
        queue.push(link.node);
      }
    }

    return { distance, parent, parentEdge };
  }

  function ttChooseDoorNodes(graph) {
    const total = graph.length;
    const entrance = ttRandInt(0, total - 1);
    const firstSearch = ttBreadthFirstGraph(entrance, graph);
    let exit = entrance;
    for (let i = 0; i < total; i++) {
      if (firstSearch.distance[i] > firstSearch.distance[exit]) exit = i;
    }

    const routeNodes = [];
    const routeEdges = [];
    let cursor = exit;
    while (cursor !== -1) {
      routeNodes.push(cursor);
      const edgeIndex = firstSearch.parentEdge[cursor];
      if (edgeIndex !== -1) routeEdges.push(edgeIndex);
      if (cursor === entrance) break;
      cursor = firstSearch.parent[cursor];
    }

    return {
      entrance,
      exit,
      routeNodes: new Set(routeNodes),
      routeEdges: new Set(routeEdges)
    };
  }

  function ttCreateMazeNodes() {
    const boundaries = [TT_ROOM_MARGIN_X];
    for (let col = 1; col < TT_MAZE_COLS; col++) {
      const base = TT_ROOM_MARGIN_X + col * TT_CELL_WIDTH;
      const min = boundaries[col - 1] + TT_CELL_WIDTH * 0.72;
      const max = TT_ROOM_MARGIN_X + (col + 0.28) * TT_CELL_WIDTH;
      boundaries.push(ttClamp(base + ttRand(-TT_COLUMN_JITTER, TT_COLUMN_JITTER), min, max));
    }
    boundaries.push(TT_WORLD_WIDTH - TT_ROOM_MARGIN_X);

    const floorY = Array.from({ length: TT_MAZE_ROWS }, (_, row) =>
      TT_ROOM_MARGIN_Y + (row + 0.82) * TT_CELL_HEIGHT + ttRand(-TT_BAND_JITTER, TT_BAND_JITTER)
    );

    const nodes = [];
    for (let row = 0; row < TT_MAZE_ROWS; row++) {
      for (let col = 0; col < TT_MAZE_COLS; col++) {
        const left = boundaries[col];
        const right = boundaries[col + 1];
        nodes.push({
          id: nodes.length,
          row,
          col,
          x: left,
          right,
          w: right - left,
          floorY: floorY[row],
          ceilingY: row === 0 ? TT_BOUNDARY : floorY[row - 1] + TT_FLOOR_THICKNESS,
          floorCuts: [],
          floorSegments: [],
          mainRoute: false
        });
      }
    }
    return nodes;
  }

  function ttAddFloorCut(node, start, end) {
    // Place the full requested opening without shrinking it. Existing edge cuts
    // (dash/crumble bridges) must retain a real solid landing on both ends, so a
    // shaft also keeps at least one full floor segment between nearby openings.
    const requestedWidth = Math.abs(end - start);
    const desiredCenter = (start + end) / 2;
    const safeInset = TT_MIN_FLOOR_SEGMENT + (TT_IS_MOBILE ? 8 : 14);
    const separation = TT_MIN_FLOOR_SEGMENT;
    const allowedStart = node.x + safeInset;
    const allowedEnd = node.right - safeInset;

    if (allowedEnd - allowedStart < requestedWidth) return null;

    const blocked = node.floorCuts
      .map(cut => ({
        start: cut.start - separation,
        end: cut.end + separation
      }))
      .sort((a, b) => a.start - b.start);

    const freeIntervals = [];
    let cursor = allowedStart;
    for (const interval of blocked) {
      if (interval.end <= allowedStart || interval.start >= allowedEnd) continue;
      const clippedStart = Math.max(allowedStart, interval.start);
      const clippedEnd = Math.min(allowedEnd, interval.end);
      if (clippedStart > cursor) freeIntervals.push({ start: cursor, end: clippedStart });
      cursor = Math.max(cursor, clippedEnd);
    }
    if (cursor < allowedEnd) freeIntervals.push({ start: cursor, end: allowedEnd });

    let best = null;
    for (const interval of freeIntervals) {
      if (interval.end - interval.start < requestedWidth) continue;
      const minCenter = interval.start + requestedWidth / 2;
      const maxCenter = interval.end - requestedWidth / 2;
      const center = ttClamp(desiredCenter, minCenter, maxCenter);
      const score = Math.abs(center - desiredCenter);
      if (!best || score < best.score) best = { center, score };
    }

    if (!best) return null;
    const cut = {
      start: best.center - requestedWidth / 2,
      end: best.center + requestedWidth / 2
    };
    node.floorCuts.push(cut);
    return cut;
  }

  function ttAddEdgeFloorCut(node, start, end, openSide) {
    const minSegment = TT_MIN_FLOOR_SEGMENT + (TT_IS_MOBILE ? 8 : 14);
    let cutStart = Math.min(start, end);
    let cutEnd = Math.max(start, end);

    if (openSide === "right") {
      cutStart = ttClamp(cutStart, node.x + minSegment, node.right - 2);
      cutEnd = node.right;
    } else {
      cutStart = node.x;
      cutEnd = ttClamp(cutEnd, node.x + 2, node.right - minSegment);
    }

    if (cutEnd - cutStart < (TT_IS_MOBILE ? 24 : 38)) return null;

    // Optional thin/crumbling bridges are allowed only when a full solid floor
    // segment survives between the bridge and every shaft opening in this chamber.
    // If not, this horizontal edge simply remains an ordinary solid corridor.
    for (const existing of node.floorCuts) {
      const separated = cutEnd <= existing.start || cutStart >= existing.end;
      if (!separated) return null;
      const distance = cutEnd <= existing.start
        ? existing.start - cutEnd
        : cutStart - existing.end;
      if (distance < TT_MIN_FLOOR_SEGMENT) return null;
    }

    const cut = { start: cutStart, end: cutEnd };
    node.floorCuts.push(cut);
    return cut;
  }

  function ttAddPlatform(platform) {
    platform.id = ttPlatforms.length;
    platform.state = platform.state || "idle";
    platform.timer = platform.timer || 0;
    platform.touched = false;
    ttPlatforms.push(platform);
    return platform;
  }

  function ttAddSolid(solid) {
    solid.id = ttSolids.length;
    ttSolids.push(solid);
    return solid;
  }

  function ttBuildNodeFloor(node) {
    const cuts = node.floorCuts
      .slice()
      .sort((a, b) => a.start - b.start);

    const merged = [];
    for (const cut of cuts) {
      const last = merged[merged.length - 1];
      if (!last || cut.start > last.end + 2) {
        merged.push({ ...cut });
      } else {
        last.end = Math.max(last.end, cut.end);
      }
    }

    const remaining = [];
    let cursor = node.x;
    for (const cut of merged) {
      if (cut.start > cursor) {
        remaining.push({ x: cursor, w: cut.start - cursor });
      }
      cursor = Math.max(cursor, cut.end);
    }
    if (node.right > cursor) {
      remaining.push({ x: cursor, w: node.right - cursor });
    }

    for (const interval of remaining) {
      if (interval.w < TT_MIN_FLOOR_SEGMENT) continue;
      const segment = ttAddSolid({
        x: interval.x,
        y: node.floorY,
        w: interval.w,
        h: TT_FLOOR_THICKNESS,
        floor: true,
        nodeId: node.id,
        internalWall: true,
        noWallJump: false
      });
      node.floorSegments.push(segment);
    }

    // Never repair a heavily cut chamber by drawing a centered floor across its
    // openings. That old fallback could partially cap a wall-jump shaft. If no
    // normal segment survives, keep only the largest genuinely uncut remnant.
    if (!node.floorSegments.length && remaining.length) {
      const largest = remaining.slice().sort((a, b) => b.w - a.w)[0];
      const emergencyMinimum = TT_IS_MOBILE ? 28 : 46;
      if (largest.w >= emergencyMinimum) {
        const segment = ttAddSolid({
          x: largest.x,
          y: node.floorY,
          w: largest.w,
          h: TT_FLOOR_THICKNESS,
          floor: true,
          nodeId: node.id,
          internalWall: true,
          noWallJump: false
        });
        node.floorSegments.push(segment);
      }
    }
  }

  function ttClassifySpecialHorizontalEdges(edges, doorInfo) {
    const collectCandidates = () => edges
      .map((edge, edgeIndex) => ({ edge, edgeIndex }))
      .filter(item => {
        const a = ttCellFromIndex(item.edge.a);
        const b = ttCellFromIndex(item.edge.b);
        return a.row === b.row &&
          !doorInfo.routeEdges.has(item.edgeIndex) &&
          item.edge.a !== doorInfo.entrance &&
          item.edge.b !== doorInfo.entrance &&
          item.edge.a !== doorInfo.exit &&
          item.edge.b !== doorInfo.exit &&
          ttEdgesConnectAll(edges, item.edgeIndex);
      });

    let candidates = collectCandidates();

    // Keep the extra horizontal loop-crossings that make the cave feel connected,
    // but patch up every non-shaft floor opening. In other words: preserve extra
    // corridor links, remove dash-gap / crumble-gap generation entirely.
    if (candidates.length < TT_MIN_SINGLE_DASH_LINKS) {
      const existing = new Set(edges.map(edge => ttEdgeKey(edge.a, edge.b)));
      const candidateRows = new Set(candidates.map(item => ttCellFromIndex(item.edge.a).row));
      const missingLinks = [];

      for (let row = 0; row < TT_MAZE_ROWS; row++) {
        for (let col = 0; col < TT_MAZE_COLS - 1; col++) {
          const a = ttCellIndex(row, col);
          const b = ttCellIndex(row, col + 1);
          if (existing.has(ttEdgeKey(a, b))) continue;
          if (a === doorInfo.entrance || b === doorInfo.entrance ||
              a === doorInfo.exit || b === doorInfo.exit) continue;
          missingLinks.push({
            a,
            b,
            row,
            score: (candidateRows.has(row) ? 0 : 20) + ttRand(0, 5)
          });
        }
      }

      missingLinks.sort((a, b) => b.score - a.score);
      while (candidates.length < TT_MIN_SINGLE_DASH_LINKS && missingLinks.length) {
        const link = missingLinks.shift();
        edges.push({ a: link.a, b: link.b, extra: true, type: "corridor" });
        existing.add(ttEdgeKey(link.a, link.b));
        candidateRows.add(link.row);
        candidates = collectCandidates();
      }
    }

    for (const item of candidates) {
      item.edge.type = "corridor";
    }
  }

  function ttAddHorizontalConnection(edge, nodes) {
    const first = nodes[edge.a];
    const second = nodes[edge.b];
    const left = first.col < second.col ? first : second;
    const right = left === first ? second : first;
    const boundaryX = left.right;
    const floorY = (left.floorY + right.floorY) / 2;

    if (edge.type === "dashGap") {
      const halfGap = TT_SINGLE_DASH_GAP / 2;
      const leftCut = ttAddEdgeFloorCut(left, boundaryX - halfGap, boundaryX, "right");
      const rightCut = ttAddEdgeFloorCut(right, boundaryX, boundaryX + halfGap, "left");
      if (leftCut && rightCut) return;
      edge.type = "corridor";
    }

    if (edge.type === "crumble") {
      const halfGap = TT_CRUMBLE_GAP / 2;
      const leftCut = ttAddEdgeFloorCut(left, boundaryX - halfGap, boundaryX, "right");
      const rightCut = ttAddEdgeFloorCut(right, boundaryX, boundaryX + halfGap, "left");
      if (leftCut && rightCut) {
        ttAddPlatform({
          x: boundaryX - halfGap,
          y: floorY,
          w: TT_CRUMBLE_GAP,
          h: TT_IS_MOBILE ? 9 : 15,
          kind: "crumble",
          mainRoute: false
        });
        return;
      }
      edge.type = "corridor";
    }

    // Ordinary horizontal edges are long, continuous tunnel floors.
  }

  function ttPlanVerticalShaftCenters(edges, nodes) {
    const plans = new Map();
    const previousBoundaryCenters = [];

    for (let boundaryRow = 0; boundaryRow < TT_MAZE_ROWS - 1; boundaryRow++) {
      const edgeItems = edges
        .map((edge, edgeIndex) => ({ edge, edgeIndex }))
        .filter(item => {
          const a = ttCellFromIndex(item.edge.a);
          const b = ttCellFromIndex(item.edge.b);
          return a.col === b.col && Math.min(a.row, b.row) === boundaryRow;
        });

      ttShuffle(edgeItems);
      const usedThisBoundary = [];

      for (const item of edgeItems) {
        const first = nodes[item.edge.a];
        const second = nodes[item.edge.b];
        const upper = first.row < second.row ? first : second;
        const inset = TT_IS_MOBILE ? 82 : 132;
        const minCenter = upper.x + inset;
        const maxCenter = upper.right - inset;
        const fractions = [0.20, 0.34, 0.50, 0.66, 0.80];
        let bestCenter = (minCenter + maxCenter) / 2;
        let bestScore = -Infinity;

        for (const fraction of fractions) {
          const base = upper.x + upper.w * fraction;
          const candidate = ttClamp(
            base + ttRand(-TT_SHAFT_CENTER_JITTER, TT_SHAFT_CENTER_JITTER),
            minCenter,
            maxCenter
          );

          let score = ttRand(0, 3);
          for (const existing of usedThisBoundary) {
            const distance = Math.abs(candidate - existing);
            if (distance < TT_SHAFT_SAME_FLOOR_SPACING) {
              score -= (TT_SHAFT_SAME_FLOOR_SPACING - distance) * 0.75;
            }
          }
          for (const existing of previousBoundaryCenters) {
            const distance = Math.abs(candidate - existing);
            if (distance < TT_SHAFT_STACK_AVOID_DISTANCE) {
              score -= (TT_SHAFT_STACK_AVOID_DISTANCE - distance) * 3.2;
            }
          }

          if (score > bestScore) {
            bestScore = score;
            bestCenter = candidate;
          }
        }

        plans.set(item.edgeIndex, bestCenter);
        usedThisBoundary.push(bestCenter);
      }

      previousBoundaryCenters.length = 0;
      previousBoundaryCenters.push(...usedThisBoundary);
    }

    return plans;
  }

  function ttAddVerticalConnection(edge, nodes, isRoute, plannedCenter = null) {
    const first = nodes[edge.a];
    const second = nodes[edge.b];
    const upper = first.row < second.row ? first : second;
    const lower = upper === first ? second : first;
    const requestedClearWidth = ttRand(TT_SHAFT_CLEAR_MIN, TT_SHAFT_CLEAR_MAX);
    const totalFootprint = requestedClearWidth + TT_WALL_THICKNESS * 2;
    const centerInset = totalFootprint / 2 + (TT_IS_MOBILE ? 22 : 36);
    const centerMin = upper.x + centerInset;
    const centerMax = upper.right - centerInset;
    const shaftCenter = Number.isFinite(plannedCenter)
      ? ttClamp(plannedCenter, centerMin, centerMax)
      : ttRand(centerMin, centerMax);

    // The floor cut is ONLY the clear opening. The solid floor extends across the
    // top of each shaft wall: the left floor's right edge matches the left wall's
    // right edge, and the right floor's left edge matches the right wall's left edge.
    let shaftCut = ttAddFloorCut(
      upper,
      shaftCenter - requestedClearWidth / 2,
      shaftCenter + requestedClearWidth / 2
    );

    // Every graph connection must become a physical opening. Try a few slightly
    // narrower (but still forgiving) widths before using a centered fallback.
    if (!shaftCut) {
      const retryWidths = [
        TT_SHAFT_CLEAR_MIN,
        TT_SHAFT_CLEAR_MIN * 0.94,
        TT_SHAFT_CLEAR_MIN * 0.88
      ];
      for (const retryWidth of retryWidths) {
        shaftCut = ttAddFloorCut(
          upper,
          shaftCenter - retryWidth / 2,
          shaftCenter + retryWidth / 2
        );
        if (shaftCut) break;
      }
    }

    if (!shaftCut) {
      const fallbackWidth = TT_SHAFT_CLEAR_MIN * 0.88;
      const fallbackCenter = (upper.x + upper.right) / 2;
      shaftCut = {
        start: fallbackCenter - fallbackWidth / 2,
        end: fallbackCenter + fallbackWidth / 2
      };
      upper.floorCuts.push(shaftCut);
    }

    const clearLeft = shaftCut.start;
    const clearRight = shaftCut.end;
    const clearWidth = clearRight - clearLeft;
    const leftWallX = clearLeft - TT_WALL_THICKNESS;
    const rightWallX = clearRight;

    const shaftTop = upper.floorY + TT_FLOOR_THICKNESS;
    const shaftBottom = lower.floorY;
    const shaftHeight = Math.max(TT_IS_MOBILE ? 90 : 145, shaftBottom - shaftTop);
    const shaftWallHeight = Math.max(
      TT_IS_MOBILE ? 34 : 56,
      shaftHeight - TT_SHAFT_BOTTOM_OPENING
    );

    // Do not extend these walls to the lower floor. The opening underneath lets
    // the player enter the shaft from either side and keeps the chamber connected.
    ttAddSolid({
      x: leftWallX,
      y: shaftTop,
      w: TT_WALL_THICKNESS,
      h: shaftWallHeight,
      internalWall: true,
      shaftWall: true,
      noWallJump: false
    });
    ttAddSolid({
      x: rightWallX,
      y: shaftTop,
      w: TT_WALL_THICKNESS,
      h: shaftWallHeight,
      internalWall: true,
      shaftWall: true,
      noWallJump: false
    });

    // Reserve a safe landing area beneath every shaft. Spike placement uses this
    // physical opening data rather than the abstract maze graph, so a player can
    // never drop through a shaft directly onto a spike patch.
    // Protect only the actual drop path beneath the shaft, plus a modest landing
    // buffer. The previous zone included both shaft walls and very large padding,
    // which unintentionally removed nearly every valid spike location on lower floors.
    const shaftLandingPadding = TT_IS_MOBILE ? 12 : 20;
    ttShaftLandingZones.push({
      x: clearLeft - shaftLandingPadding,
      y: lower.floorY,
      w: clearWidth + shaftLandingPadding * 2,
      floorY: lower.floorY
    });

    // Thin hatches always span exactly from one solid floor edge to the other.
    const useHatch = isRoute ? ttChance(0.55) : ttChance(0.34);
    if (useHatch) {
      ttAddPlatform({
        x: clearLeft,
        y: upper.floorY,
        w: clearWidth,
        h: TT_IS_MOBILE ? 8 : 13,
        kind: "oneway",
        hatch: true,
        mainRoute: isRoute
      });
    }
  }

  function ttAddClosedHorizontalWalls(edges, nodes) {
    const openEdges = new Set(edges.map(edge => ttEdgeKey(edge.a, edge.b)));

    for (let row = 0; row < TT_MAZE_ROWS; row++) {
      for (let col = 0; col < TT_MAZE_COLS - 1; col++) {
        const leftIndex = ttCellIndex(row, col);
        const rightIndex = ttCellIndex(row, col + 1);
        if (openEdges.has(ttEdgeKey(leftIndex, rightIndex))) continue;

        const left = nodes[leftIndex];
        const wallX = left.right - TT_WALL_THICKNESS / 2;
        const wallY = left.ceilingY;
        const wallHeight = left.floorY + TT_FLOOR_THICKNESS - wallY;
        ttAddSolid({
          x: wallX,
          y: wallY,
          w: TT_WALL_THICKNESS,
          h: wallHeight,
          internalWall: true,
          chamberWall: true,
          noWallJump: false
        });
      }
    }
  }

  function ttDoorOnNode(node, isEntrance) {
    const candidates = node.floorSegments
      .filter(segment => segment.w >= TT_DOOR_WIDTH + (TT_IS_MOBILE ? 28 : 46))
      .sort((a, b) => b.w - a.w);
    const platform = candidates[0] || node.floorSegments[0];
    const sideInset = TT_IS_MOBILE ? 7 : 12;
    const placeOnLeft = ttChance(0.5);
    const x = placeOnLeft
      ? platform.x + sideInset
      : platform.x + platform.w - TT_DOOR_WIDTH - sideInset;

    return {
      x: ttClamp(x, platform.x + 2, platform.x + platform.w - TT_DOOR_WIDTH - 2),
      y: platform.y - TT_DOOR_HEIGHT,
      w: TT_DOOR_WIDTH,
      h: TT_DOOR_HEIGHT,
      platformId: platform.id,
      platform,
      onLeft: placeOnLeft,
      isEntrance
    };
  }

  function ttFindSpikeXAwayFromShafts(platform, preferredX, spikeWidth, safeMargin) {
    const minX = platform.x + safeMargin;
    const maxX = platform.x + platform.w - safeMargin - spikeWidth;
    if (maxX < minX) return null;

    let allowedRanges = [[minX, maxX]];
    const floorTolerance = TT_IS_MOBILE ? 5 : 8;
    const extraLandingClearance = TT_IS_MOBILE ? 30 : 48;

    for (const zone of ttShaftLandingZones) {
      if (Math.abs(platform.y - zone.floorY) > floorTolerance) continue;

      // These are forbidden START positions for the spike patch. Expanding by
      // spikeWidth guarantees the entire patch stays clear of the shaft landing.
      const forbiddenStart = zone.x - extraLandingClearance - spikeWidth;
      const forbiddenEnd = zone.x + zone.w + extraLandingClearance;
      const nextRanges = [];

      for (const [start, end] of allowedRanges) {
        if (forbiddenEnd <= start || forbiddenStart >= end) {
          nextRanges.push([start, end]);
          continue;
        }
        if (forbiddenStart > start) nextRanges.push([start, Math.min(end, forbiddenStart)]);
        if (forbiddenEnd < end) nextRanges.push([Math.max(start, forbiddenEnd), end]);
      }

      allowedRanges = nextRanges.filter(([start, end]) => end - start >= 0.5);
      if (allowedRanges.length === 0) return null;
    }

    let bestX = null;
    let bestDistance = Infinity;
    for (const [start, end] of allowedRanges) {
      const candidate = ttClamp(preferredX, start, end);
      const distance = Math.abs(candidate - preferredX);
      if (distance < bestDistance) {
        bestDistance = distance;
        bestX = candidate;
      }
    }
    return bestX;
  }

  function ttAddBranchHazards(nodes, graph, doorInfo) {
    const candidatesByRow = Array.from({ length: TT_MAZE_ROWS }, () => []);

    for (let index = 0; index < graph.length; index++) {
      if (index === doorInfo.entrance || index === doorInfo.exit) continue;
      if (doorInfo.routeNodes.has(index)) continue;
      if (graph[index].length > 2) continue;

      const node = nodes[index];
      const platforms = node.floorSegments
        .slice()
        .sort((a, b) => b.w - a.w);
      if (platforms.length === 0) continue;
      candidatesByRow[node.row].push({ index, node, platforms });
    }

    candidatesByRow.forEach(ttShuffle);
    const orderedCandidates = [];
    let addedInPass = true;
    while (addedInPass) {
      addedInPass = false;
      for (let row = 0; row < candidatesByRow.length; row++) {
        const candidate = candidatesByRow[row].pop();
        if (!candidate) continue;
        orderedCandidates.push(candidate);
        addedInPass = true;
      }
    }

    const spikeLimit = TT_IS_MOBILE ? 8 : 12;
    let placed = 0;

    for (const candidate of orderedCandidates) {
      if (placed >= spikeLimit) break;
      const { index, platforms } = candidate;
      const spikeUnit = TT_IS_MOBILE ? 14 : 24;
      const desiredSpikeCount = TT_IS_MOBILE ? ttRandInt(3, 6) : ttRandInt(5, 9);
      const minimumSpikeCount = TT_IS_MOBILE ? 2 : 3;
      const safeMargin = TT_IS_MOBILE ? 42 : 70;

      const incomingNodes = graph[index].map(link => nodes[link.node]);
      const horizontalIncoming = incomingNodes.find(node => node.row === candidate.node.row);
      let placement = null;

      // Start with the intended chain length, then shorten it only as much as
      // necessary to preserve a clean straight-down release beside shaft walls.
      for (let spikeCount = desiredSpikeCount; spikeCount >= minimumSpikeCount && !placement; spikeCount--) {
        const spikeWidth = spikeUnit * spikeCount;

        // Try every substantial solid floor stretch in the chamber instead of only
        // the single longest segment. This preserves shaft landing safety while still
        // allowing lower floors to receive hazards on the other side of an opening.
        for (const platform of platforms) {
          if (platform.w < spikeWidth + safeMargin * 2) continue;

          let preferredX;
          if (horizontalIncoming && horizontalIncoming.x < candidate.node.x) {
            preferredX = platform.x + platform.w - safeMargin - spikeWidth;
          } else if (horizontalIncoming && horizontalIncoming.x > candidate.node.x) {
            preferredX = platform.x + safeMargin;
          } else {
            const minX = platform.x + safeMargin;
            const maxX = platform.x + platform.w - safeMargin - spikeWidth;
            preferredX = ttRand(minX, Math.max(minX, maxX));
          }

          const x = ttFindSpikeXAwayFromShafts(platform, preferredX, spikeWidth, safeMargin);
          if (x === null) continue;
          placement = { platform, x, spikeWidth };
          break;
        }
      }

      if (!placement) continue;
      const { platform, x, spikeWidth } = placement;
      ttSpikes.push({
        x,
        y: platform.y - (TT_IS_MOBILE ? 16 : 28),
        w: spikeWidth,
        h: TT_IS_MOBILE ? 16 : 28,
        platformId: platform.id
      });
      placed++;
    }
  }

  function ttPlatformHasSolidSupport(platform, side) {
    const tolerance = TT_IS_MOBILE ? 2.5 : 4;
    const edgeX = side === "left" ? platform.x : platform.x + platform.w;
    return ttSolids.some(solid => {
      if (!solid.floor || Math.abs(solid.y - platform.y) > tolerance) return false;
      const solidEdge = side === "left" ? solid.x + solid.w : solid.x;
      return Math.abs(solidEdge - edgeX) <= tolerance;
    });
  }

  function ttEnforceBridgeSupportRule() {
    const kept = [];
    for (const platform of ttPlatforms) {
      if (platform.kind !== "oneway" && platform.kind !== "crumble") {
        kept.push(platform);
        continue;
      }

      const leftSupported = ttPlatformHasSolidSupport(platform, "left");
      const rightSupported = ttPlatformHasSolidSupport(platform, "right");
      if (leftSupported && rightSupported) {
        kept.push(platform);
        continue;
      }

      // A hatch can safely become an open shaft. A rare malformed crumble bridge
      // is replaced by solid tunnel floor so the maze never inherits a broken gap.
      if (platform.kind === "crumble") {
        ttAddSolid({
          x: platform.x,
          y: platform.y,
          w: platform.w,
          h: TT_FLOOR_THICKNESS,
          floor: true,
          internalWall: true,
          noWallJump: false
        });
      }
    }
    ttPlatforms = kept;
  }

  function ttBuildCollisionArrays() {
    const generatedSolids = ttSolids.slice();
    ttSolids = [
      { x: 0, y: 0, w: TT_WORLD_WIDTH, h: TT_BOUNDARY, boundary: true, noWallJump: false },
      { x: 0, y: TT_WORLD_HEIGHT - TT_BOUNDARY, w: TT_WORLD_WIDTH, h: TT_BOUNDARY, boundary: true, noWallJump: false },
      { x: 0, y: 0, w: TT_BOUNDARY, h: TT_WORLD_HEIGHT, boundary: true, noWallJump: false },
      { x: TT_WORLD_WIDTH - TT_BOUNDARY, y: 0, w: TT_BOUNDARY, h: TT_WORLD_HEIGHT, boundary: true, noWallJump: false },
      ...generatedSolids
    ];

    ttOneWays = [];
    ttCrumblePlatforms = [];
    for (const platform of ttPlatforms) {
      if (platform.kind === "oneway") ttOneWays.push(platform);
      if (platform.kind === "crumble") ttCrumblePlatforms.push(platform);
    }
  }

  function ttGenerateRoom() {
    const edges = ttBuildMazeEdges();
    const graph = ttBuildGraph(edges);
    const doorInfo = ttChooseDoorNodes(graph);
    const nodes = ttCreateMazeNodes();

    ttPlatforms = [];
    ttSolids = [];
    ttOneWays = [];
    ttCrumblePlatforms = [];
    ttSpikes = [];
    ttShaftLandingZones = [];
    ttCrystals = [];
    ttCrystalBursts = [];
    ttPowerUps = [];
    ttResetJuiceState(ttTransitionActive);
    ttResetPowerState();
    ttRoutePlatformIds = new Set();

    nodes.forEach((node, index) => {
      node.mainRoute = doorInfo.routeNodes.has(index);
    });

    ttClassifySpecialHorizontalEdges(edges, doorInfo);
    // Classification may append solid horizontal corridor links. Build the map
    // from this final edge list so every physical connector is represented.
    ttResetMapDiscovery(edges, doorInfo.entrance, doorInfo.exit);
    const shaftCenters = ttPlanVerticalShaftCenters(edges, nodes);

    // Vertical shafts define the room's essential traversal geometry, so place
    // them before optional horizontal gaps. This guarantees generous shaft width
    // and exact floor/wall alignment; a dash or crumble gap yields when space is tight.
    edges.forEach((edge, edgeIndex) => {
      const a = ttCellFromIndex(edge.a);
      const b = ttCellFromIndex(edge.b);
      if (a.row === b.row) return;
      const isRoute = doorInfo.routeEdges.has(edgeIndex);
      ttAddVerticalConnection(edge, nodes, isRoute, shaftCenters.get(edgeIndex));
    });

    edges.forEach(edge => {
      const a = ttCellFromIndex(edge.a);
      const b = ttCellFromIndex(edge.b);
      if (a.row !== b.row) return;
      ttAddHorizontalConnection(edge, nodes);
    });

    ttAddClosedHorizontalWalls(edges, nodes);
    nodes.forEach(node => ttBuildNodeFloor(node));
    ttEnforceBridgeSupportRule();

    ttEntranceDoor = ttDoorOnNode(nodes[doorInfo.entrance], true);
    ttExitDoor = ttDoorOnNode(nodes[doorInfo.exit], false);

    const startPlatform = ttEntranceDoor.platform;
    const spawnPadding = TT_IS_MOBILE ? 5 : 8;
    const preferredX = ttEntranceDoor.onLeft
      ? ttEntranceDoor.x + ttEntranceDoor.w + spawnPadding
      : ttEntranceDoor.x - ttPlayer.w - spawnPadding;
    ttSpawn = {
      x: ttClamp(preferredX, startPlatform.x + 2, startPlatform.x + startPlatform.w - ttPlayer.w - 2),
      y: startPlatform.y - ttPlayer.h
    };

    ttAddBranchHazards(nodes, graph, doorInfo);
    ttBuildCollisionArrays();
    ttChooseRoomTarget();
    ttPopulateCrystals();
    ttAssignCrystalPitches();
    ttPopulatePowerUps();
    ttStartRoomIntro();
    ttResetRoomTimer();
    ttResetTraversalObjects();
  }

  function ttResetTraversalObjects() {
    for (const platform of ttCrumblePlatforms) {
      platform.state = "idle";
      platform.timer = 0;
      platform.touched = false;
    }
  }

  function ttCenterCameraImmediately() {
    ttCamera.x = ttClamp(
      ttPlayer.x + ttPlayer.w / 2 - GAME_CANVAS_LOGICAL_WIDTH / 2,
      0,
      Math.max(0, TT_WORLD_WIDTH - GAME_CANVAS_LOGICAL_WIDTH)
    );
    ttCamera.y = ttClamp(
      ttPlayer.y + ttPlayer.h / 2 - GAME_CANVAS_LOGICAL_HEIGHT / 2,
      0,
      Math.max(0, TT_WORLD_HEIGHT - GAME_CANVAS_LOGICAL_HEIGHT)
    );
    ttUpdateMapDiscovery();
  }

  function ttResetPlayer(resetCamera = true) {
    ttPlayer.x = ttSpawn.x;
    ttPlayer.y = ttSpawn.y;
    ttPlayer.vx = 0;
    ttPlayer.vy = 0;
    ttPlayer.facing = ttEntranceDoor && ttEntranceDoor.onLeft ? 1 : -1;
    ttPlayer.onGround = false;
    ttPlayer.groundKind = null;
    ttPlayer.groundPlatformId = -1;
    ttPlayer.dropThroughTimer = 0;
    ttPlayer.coyote = 0;
    ttPlayer.jumpBuffer = 0;
    ttPlayer.dashTimer = 0;
    ttPlayer.dashCooldown = 0;
    ttPlayer.canDash = true;
    ttPlayer.dashX = ttPlayer.facing;
    ttPlayer.dashY = 0;
    ttPlayer.wallDir = 0;
    ttPlayer.lastWallDir = 0;
    ttPlayer.wallCoyote = 0;
    ttPlayer.wallControlLock = 0;
    ttPlayer.answerStun = 0;
    ttPlayer.runCycle = 0;
    ttDashTrailTimer = 0;
    if (resetCamera) ttCenterCameraImmediately();
  }

  function ttRespawnPlayer() {
    ttResetTraversalObjects();
    ttResetPlayer(true);
  }

  function ttTimeLimitForRoom(roomNumber) {
    // No positive floor: the arcade curve keeps shrinking until rooms become impossible.
    return Math.max(
      0,
      TT_ROOM_TIME_START - Math.max(0, roomNumber - 1) * TT_ROOM_TIME_DECREASE
    );
  }

  function ttFormatRoomTime(seconds) {
    const safe = Math.max(0, seconds);
    if (safe < 10) return safe.toFixed(1);
    const whole = Math.ceil(safe);
    const minutes = Math.floor(whole / 60);
    const remainder = String(whole % 60).padStart(2, "0");
    return `${minutes}:${remainder}`;
  }

  function ttResetRoomTimer() {
    ttRoomTimeLimit = ttTimeLimitForRoom(ttRoomNumber);
    ttRoomTimeRemaining = ttRoomTimeLimit;
    ttTimerDisplayStamp = "";
    ttCollapseActive = false;
    ttCollapseTimer = 0;
    ttLastTimerWarningStamp = null;
    ttUpdatePowerupHudState();
  }

  function ttBeginCaveCollapse() {
    if (ttCollapseActive || ttTransitionActive) return;
    ttCollapseActive = true;
    ttCollapseTimer = 0;
    ttRoomTimeRemaining = 0;
    ttTimerDisplayStamp = "0.0";
    ttPlayer.vx = 0;
    ttPlayer.vy = 0;
    ttClearHeldInputsForMap();
    ttFeedbackText = "";
    ttFeedbackTimer = 0;
    soundCollapse();
    ttTriggerScreenFlash("224, 235, 238", 0.22, 0.32);
    ttAddCameraShake(TT_IS_MOBILE ? 7 : 11, TT_COLLAPSE_DURATION);
    ttCollapseDebrisTimer = 0;
    ttUpdateRoomLabel();
  }

  function ttUpdateCaveCollapse(dt) {
    ttCollapseTimer += dt;
    if (ttCollapseTimer >= TT_COLLAPSE_DURATION) {
      endGame("The exit was buried.");
    }
  }

  function ttUpdateRoomTimer(dt) {
    if (ttRoomIntroPhase !== "active" || ttTransitionActive || ttCollapseActive) return false;
    const timerRate = ttFermataTime > 0 ? 0 : (ttRitTime > 0 ? TT_RIT_RATE_MULTIPLIER : 1);
    ttRoomTimeRemaining = Math.max(0, ttRoomTimeRemaining - dt * timerRate);
    const nextStamp = ttFormatRoomTime(ttRoomTimeRemaining);
    if (nextStamp !== ttTimerDisplayStamp) {
      ttTimerDisplayStamp = nextStamp;
      ttUpdateRoomLabel();
    }
    if (ttRoomTimeRemaining <= 10 && ttRoomTimeRemaining > 0) {
      const warningStamp = ttRoomTimeRemaining <= 5
        ? Math.floor(ttRoomTimeRemaining * 2)
        : Math.ceil(ttRoomTimeRemaining);
      if (warningStamp !== ttLastTimerWarningStamp) {
        ttLastTimerWarningStamp = warningStamp;
        soundTimerTick(ttRoomTimeRemaining <= 5);
        if (ttRoomTimeRemaining <= 5) ttTriggerScreenFlash("255, 104, 78", 0.055, 0.08);
      }
    }
    if (ttRoomTimeRemaining <= 0) {
      ttBeginCaveCollapse();
      return true;
    }
    return false;
  }

  function ttGetReadySetGoCue() {
    if (ttRoomIntroPhase !== "show") return null;
    const progress = ttClamp(ttRoomIntroTimer / TT_TARGET_SHOW_DURATION, 0, 0.9999);
    if (progress < 1 / 3) return { label: "READY", color: "#ff675b", glow: "255, 76, 64" };
    if (progress < 2 / 3) return { label: "SET", color: "#ffe36f", glow: "255, 214, 62" };
    return { label: "GO!", color: "#78f09a", glow: "72, 230, 119" };
  }

  function ttUpdateRoomLabel() {
    const timeText = ttFormatRoomTime(ttRoomTimeRemaining);
    const cue = ttGetReadySetGoCue();

    // The target remains visible throughout the room. On mobile this string is
    // the persistent LCD readout; desktop uses the canvas HUD drawn below.
    let text = `TARGET ${ttRoomTarget.label} • ${timeText}`;
    if (cue) text = `TARGET ${ttRoomTarget.label} • ${cue.label} • ${timeText}`;
    if (ttRoomIntroPhase === "flight") text = `TARGET ${ttRoomTarget.label} • GO! • ${timeText}`;
    if (ttFeedbackTimer > 0 && ttFeedbackText) text = `TARGET ${ttRoomTarget.label} • ${ttFeedbackText} • ${timeText}`;
    if (ttCollapseActive) text = `TARGET ${ttRoomTarget.label} • EXIT BURIED`;

    if (typeof setMessage === "function") setMessage(text);
    if (typeof questionBox !== "undefined" && questionBox) questionBox.textContent = "";
  }

  function gameInit() {
    ttRoomNumber = 1;
    ttHighestRoomGenerated = 1;
    ttRoomHistory = new Map();
    ttCombo = 0;
    ttFeedbackText = "";
    ttFeedbackTimer = 0;
    ttRepeatMenuOpen = false;
    ttMapOpen = false;
    ttResetPowerState();
    ttGenerateRoom();
    ttResetPlayer(true);
    ttLastTime = performance.now();
    ttAccumulator = 0;
    ttInput.left = false;
    ttInput.right = false;
    ttInput.up = false;
    ttInput.down = false;
    ttInput.jumpButton = false;
    ttInput.jumpQueued = false;
    ttInput.dashQueued = false;
    ttInput.dashQueuedX = ttPlayer.facing;
    ttInput.dashQueuedY = 0;
    ttInput.interactQueued = false;
    ttInput.dropQueued = false;
    ttInput.joystickDownHeld = false;
    ttTransitionActive = false;
    ttTransitionTimer = 0;
    ttTransitionSwapped = false;
    ttResetJuiceState();

    if (typeof configureMobileControls === "function") {
      configureMobileControls({
        showDpad: true,
        showLeftJoystick: true,
        showRightJoystick: false,
        faceButtons: ["a", "b", "x"],
        systemButtons: ["select", "start"],
        labels: { a: "JUMP", b: "DASH", x: "USE", select: "MAP", start: "MENU" }
      });
      ttRefreshMobileButtonLabels();
    }

    ttUpdateRoomLabel();
  }

  function ttReadMovementInput() {
    let move = (ttInput.right ? 1 : 0) - (ttInput.left ? 1 : 0);
    if (typeof sticks !== "undefined" && sticks.left && Math.abs(sticks.left.x) > 0.16) {
      move = sticks.left.x;
    }
    return ttClamp(move, -1, 1);
  }

  function ttReadDashVector() {
    let x = 0;
    let y = 0;

    if (typeof sticks !== "undefined" && sticks.left) {
      const joystickMagnitude = Math.hypot(sticks.left.x, sticks.left.y);
      if (joystickMagnitude > 0.16) {
        x = sticks.left.x;
        y = sticks.left.y;
      }
    }

    if (x === 0 && y === 0) {
      x = (ttInput.right ? 1 : 0) - (ttInput.left ? 1 : 0);
      y = (ttInput.down ? 1 : 0) - (ttInput.up ? 1 : 0);
    }

    if (x === 0 && y === 0) x = ttPlayer.facing;
    const length = Math.hypot(x, y) || 1;
    return { x: x / length, y: y / length };
  }

  function ttQueueJump() {
    ttInput.jumpQueued = true;
  }

  function ttReleaseJumpIfNeeded() {
    const stillHeld = ttInput.up || ttInput.jumpButton;
    if (!stillHeld && ttPlayer.dashTimer <= 0 && ttPlayer.vy < 0) {
      ttPlayer.vy *= TT_JUMP_RELEASE_MULTIPLIER;
    }
  }

  function gameKeyDown(key, isRepeat) {
    if (ttRepeatMenuOpen) {
      if (!isRepeat && (key === "arrowup" || key === "w")) ttMoveRepeatSelection(-1, 0);
      if (!isRepeat && (key === "arrowdown" || key === "s")) ttMoveRepeatSelection(1, 0);
      if (!isRepeat && (key === "arrowleft" || key === "a")) ttMoveRepeatSelection(0, -1);
      if (!isRepeat && (key === "arrowright" || key === "d")) ttMoveRepeatSelection(0, 1);
      if (!isRepeat && (key === " " || key === "enter")) ttConfirmRepeatSelection();
      if (!isRepeat && key === "escape") ttSetRepeatMenuOpen(false);
      return;
    }
    if (!isRepeat && key === "m") {
      ttToggleMap();
      return;
    }
    if (!isRepeat && key === "escape" && ttMapOpen) {
      ttSetMapOpen(false);
      return;
    }
    if (ttMapOpen) return;
    if (key === "arrowleft" || key === "a") ttInput.left = true;
    if (key === "arrowright" || key === "d") ttInput.right = true;
    if (key === "arrowup" || key === "w") {
      ttInput.up = true;
      if (!isRepeat) ttQueueJump();
    }
    if (key === "arrowdown" || key === "s") {
      ttInput.down = true;
      if (!isRepeat) ttInput.dropQueued = true;
    }
    if (!isRepeat && (key === " " || key === "enter")) {
      ttInput.interactQueued = true;
    }
    if (!isRepeat && key === "shift") {
      const dash = ttReadDashVector();
      ttInput.dashQueuedX = dash.x;
      ttInput.dashQueuedY = dash.y;
      ttInput.dashQueued = true;
    }
  }

  function gameKeyUp(key) {
    if (key === "arrowleft" || key === "a") ttInput.left = false;
    if (key === "arrowright" || key === "d") ttInput.right = false;
    if (key === "arrowup" || key === "w") {
      ttInput.up = false;
      ttReleaseJumpIfNeeded();
    }
    if (key === "arrowdown" || key === "s") ttInput.down = false;
  }

  function ttDetectWallContact() {
    const probe = TT_IS_MOBILE ? 1.5 : 2;
    const inset = TT_IS_MOBILE ? 2 : 3;
    const probeHeight = Math.max(1, ttPlayer.h - inset * 2);
    const leftProbe = { x: ttPlayer.x - probe, y: ttPlayer.y + inset, w: probe, h: probeHeight };
    const rightProbe = { x: ttPlayer.x + ttPlayer.w, y: ttPlayer.y + inset, w: probe, h: probeHeight };

    let touchesLeft = false;
    let touchesRight = false;
    for (const solid of ttSolids) {
      if (solid.noWallJump) continue;
      if (!touchesLeft && ttIntersects(leftProbe, solid)) touchesLeft = true;
      if (!touchesRight && ttIntersects(rightProbe, solid)) touchesRight = true;
      if (touchesLeft && touchesRight) break;
    }

    if (touchesLeft && !touchesRight) return -1;
    if (touchesRight && !touchesLeft) return 1;
    if (touchesLeft && touchesRight) return ttPlayer.lastWallDir || ttPlayer.facing;
    return 0;
  }

  function ttMoveHorizontal(dx) {
    ttPlayer.wallDir = 0;
    ttPlayer.x += dx;

    for (const solid of ttSolids) {
      if (!ttIntersects(ttPlayer, solid)) continue;
      if (dx > 0) {
        ttPlayer.x = solid.x - ttPlayer.w;
        ttPlayer.wallDir = 1;
      } else if (dx < 0) {
        ttPlayer.x = solid.x + solid.w;
        ttPlayer.wallDir = -1;
      }
      ttPlayer.vx = 0;
    }

    if (ttPlayer.wallDir !== 0) ttPlayer.lastWallDir = ttPlayer.wallDir;
  }

  function ttLandOnPlatform(platform, previousBottom, newBottom) {
    if (ttPlayer.dropThroughTimer > 0) return false;
    if (ttPlayer.vy < 0) return false;
    if (previousBottom > platform.y + (TT_IS_MOBILE ? 3 : 5)) return false;
    if (newBottom < platform.y) return false;
    if (ttPlayer.x + ttPlayer.w <= platform.x || ttPlayer.x >= platform.x + platform.w) return false;

    ttPlayer.y = platform.y - ttPlayer.h;
    ttPlayer.vy = 0;
    ttPlayer.onGround = true;
    ttPlayer.groundKind = platform.kind;
    ttPlayer.groundPlatformId = platform.id;
    return true;
  }

  function ttMoveVertical(dy) {
    const previousBottom = ttPlayer.y + ttPlayer.h;
    ttPlayer.onGround = false;
    ttPlayer.groundKind = null;
    ttPlayer.groundPlatformId = -1;
    ttPlayer.y += dy;
    const newBottom = ttPlayer.y + ttPlayer.h;

    for (const solid of ttSolids) {
      if (!ttIntersects(ttPlayer, solid)) continue;
      if (dy > 0) {
        ttPlayer.y = solid.y - ttPlayer.h;
        ttPlayer.vy = 0;
        ttPlayer.onGround = true;
        ttPlayer.groundKind = "solid";
        ttPlayer.groundPlatformId = solid.id ?? -1;
      } else if (dy < 0) {
        ttPlayer.y = solid.y + solid.h;
        ttPlayer.vy = 0;
      }
    }

    if (ttTrebleFlyTime <= 0 && !ttPlayer.onGround && dy >= 0) {
      for (const platform of ttOneWays) {
        if (ttLandOnPlatform(platform, previousBottom, newBottom)) break;
      }
    }

    if (ttTrebleFlyTime <= 0 && !ttPlayer.onGround && dy >= 0) {
      for (const platform of ttCrumblePlatforms) {
        if (platform.state === "gone") continue;
        if (ttLandOnPlatform(platform, previousBottom, newBottom)) {
          platform.touched = true;
          break;
        }
      }
    }

    if (ttPlayer.y > TT_WORLD_HEIGHT + 100) ttRespawnPlayer();
  }

  function ttUpdateCrumblePlatforms(dt) {
    for (const platform of ttCrumblePlatforms) {
      if (platform.state === "idle" && platform.touched) {
        platform.state = "crumbling";
        platform.timer = TT_CRUMBLE_DELAY;
        if (ttCrumbleSoundCooldown <= 0) {
          soundCrumble(true);
          ttCrumbleSoundCooldown = 0.08;
        }
        ttSpawnDust(ttPlayer.x + ttPlayer.w / 2, platform.y, TT_IS_MOBILE ? 3 : 5);
      } else if (platform.state === "crumbling") {
        platform.timer -= dt;
        if (platform.timer <= 0) {
          platform.state = "gone";
          platform.timer = TT_CRUMBLE_RESPAWN;
          soundCrumble(false);
          ttAddCameraShake(TT_IS_MOBILE ? 2.5 : 4, 0.16);
          const pieces = TT_IS_MOBILE ? 7 : 12;
          for (let index = 0; index < pieces; index++) {
            ttPushParticle({
              x: platform.x + ttRand(0, platform.w),
              y: platform.y + ttRand(0, platform.h),
              vx: ttRand(-(TT_IS_MOBILE ? 45 : 70), TT_IS_MOBILE ? 45 : 70),
              vy: ttRand(TT_IS_MOBILE ? 45 : 70, TT_IS_MOBILE ? 130 : 200),
              life: ttRand(0.35, 0.68),
              size: ttRand(TT_IS_MOBILE ? 2 : 3, TT_IS_MOBILE ? 4.5 : 7),
              color: "#7e6d65",
              gravity: TT_IS_MOBILE ? 260 : 390,
              drag: 0.96,
              shape: "rect",
              rotation: ttRand(0, Math.PI * 2),
              spin: ttRand(-7, 7)
            });
          }
        }
      } else if (platform.state === "gone") {
        platform.timer -= dt;
        if (platform.timer <= 0) {
          platform.state = "idle";
          platform.timer = 0;
        }
      }
      platform.touched = false;
    }
  }

  function ttTouchesSpike() {
    for (const spike of ttSpikes) {
      const hitbox = {
        x: spike.x + (TT_IS_MOBILE ? 4 : 7),
        y: spike.y + (TT_IS_MOBILE ? 5 : 8),
        w: Math.max(1, spike.w - (TT_IS_MOBILE ? 8 : 14)),
        h: Math.max(1, spike.h - (TT_IS_MOBILE ? 5 : 8))
      };
      if (ttIntersects(ttPlayer, hitbox)) return true;
    }
    return false;
  }

  function ttBeginRoomTransition() {
    if (ttTransitionActive) return;
    ttApplyExitBonuses();
    ttTransitionActive = true;
    ttTransitionTimer = 0;
    ttTransitionSwapped = false;
    ttEmitDoorFeedback();
    ttPlayer.vx = 0;
    ttPlayer.vy = 0;
  }

  function ttUpdateTransition(dt) {
    ttTransitionTimer += dt;
    if (!ttTransitionSwapped && ttTransitionTimer >= TT_TRANSITION_DURATION * 0.5) {
      ttGoToNextRoom();
      ttTransitionSwapped = true;
    }
    if (ttTransitionTimer >= TT_TRANSITION_DURATION) {
      ttTransitionActive = false;
      ttTransitionTimer = 0;
      ttTransitionSwapped = false;
    }
  }

  function ttPhysicsStep(dt) {
    ttUpdateJuice(dt);
    if (ttTransitionActive) {
      ttUpdateTransition(dt);
      return;
    }
    if (ttCollapseActive) {
      ttUpdateCaveCollapse(dt);
      return;
    }

    ttUpdateCrystals(dt);
    ttUpdatePowerups(dt);
    if (ttUpdateRoomIntro(dt)) return;
    if (ttUpdateRoomTimer(dt)) return;

    let move = ttReadMovementInput();
    ttPlayer.answerStun = Math.max(0, ttPlayer.answerStun - dt);
    if (ttPlayer.answerStun > 0) move = 0;
    if (Math.abs(move) > 0.08) ttPlayer.facing = move > 0 ? 1 : -1;

    const joystickDown =
      typeof sticks !== "undefined" &&
      sticks.left &&
      sticks.left.y > 0.62;
    if (joystickDown && !ttInput.joystickDownHeld) ttInput.dropQueued = true;
    ttInput.joystickDownHeld = joystickDown;
    ttPlayer.dropThroughTimer = Math.max(0, ttPlayer.dropThroughTimer - dt);

    if (ttInput.dropQueued) {
      if (
        ttPlayer.onGround &&
        (ttPlayer.groundKind === "oneway" || ttPlayer.groundKind === "crumble")
      ) {
        ttPlayer.dropThroughTimer = TT_DROP_THROUGH_TIME;
        ttPlayer.onGround = false;
        ttPlayer.groundKind = null;
        ttPlayer.groundPlatformId = -1;
        ttPlayer.y += TT_IS_MOBILE ? 4 : 7;
        ttPlayer.vy = Math.max(ttPlayer.vy, TT_IS_MOBILE ? 70 : 105);
      }
      ttInput.dropQueued = false;
    }

    for (const platform of ttCrumblePlatforms) platform.touched = false;

    ttPlayer.wallDir = ttDetectWallContact();
    if (ttPlayer.wallDir !== 0) ttPlayer.lastWallDir = ttPlayer.wallDir;
    ttPlayer.wallCoyote = ttPlayer.wallDir !== 0
      ? TT_WALL_COYOTE_TIME
      : Math.max(0, ttPlayer.wallCoyote - dt);
    ttPlayer.wallControlLock = Math.max(0, ttPlayer.wallControlLock - dt);

    if (ttInput.jumpQueued && ttPlayer.answerStun <= 0) {
      ttPlayer.jumpBuffer = TT_JUMP_BUFFER;
      ttInput.jumpQueued = false;
    }

    if (ttInput.dashQueued) {
      if (ttPlayer.answerStun <= 0 && ttPlayer.canDash && ttPlayer.dashCooldown <= 0 && ttPlayer.dashTimer <= 0) {
        ttPlayer.dashX = ttInput.dashQueuedX;
        ttPlayer.dashY = ttInput.dashQueuedY;
        ttPlayer.dashTimer = TT_DASH_DURATION;
        ttPlayer.jumpBuffer = 0;
        ttPlayer.dashCooldown = TT_DASH_COOLDOWN;
        ttPlayer.canDash = false;
        ttDashTrailTimer = 0;
        ttSpawnDashBurst();
        soundDash();
        ttAddCameraShake(TT_IS_MOBILE ? 1.8 : 2.8, 0.1);
      }
      ttInput.dashQueued = false;
    }

    ttPlayer.jumpBuffer = Math.max(0, ttPlayer.jumpBuffer - dt);
    ttPlayer.dashCooldown = Math.max(0, ttPlayer.dashCooldown - dt);
    ttPlayer.coyote = ttPlayer.onGround ? TT_COYOTE_TIME : Math.max(0, ttPlayer.coyote - dt);

    if (ttPlayer.jumpBuffer > 0 && ttPlayer.dashTimer <= 0) {
      if (ttPlayer.coyote > 0) {
        ttPlayer.vy = -TT_JUMP_SPEED;
        ttPlayer.onGround = false;
        ttPlayer.coyote = 0;
        ttPlayer.jumpBuffer = 0;
        ttEmitJumpFeedback(false);
      } else if (ttPlayer.wallCoyote > 0 && ttPlayer.lastWallDir !== 0) {
        ttPlayer.vx = -ttPlayer.lastWallDir * TT_WALL_JUMP_X;
        ttPlayer.vy = -TT_WALL_JUMP_Y;
        ttPlayer.facing = -ttPlayer.lastWallDir;
        ttPlayer.wallDir = 0;
        ttPlayer.wallCoyote = 0;
        ttPlayer.wallControlLock = TT_WALL_CONTROL_LOCK;
        ttPlayer.jumpBuffer = 0;
        ttEmitJumpFeedback(true);
      }
    }

    const runSpeed = TT_RUN_SPEED * (ttMetronomeTime > 0 ? TT_METRONOME_SPEED_MULTIPLIER : 1);
    const dashSpeed = TT_DASH_SPEED * (ttMetronomeTime > 0 ? 1.1 : 1);

    if (ttPlayer.answerStun > 0) {
      ttPlayer.vx = ttMoveToward(ttPlayer.vx, 0, (TT_IS_MOBILE ? 360 : 560) * dt);
      ttPlayer.vy = Math.min(TT_MAX_FALL_SPEED, ttPlayer.vy + TT_GRAVITY * dt);
    } else if (ttTrebleFlyTime > 0) {
      const fly = ttGetDirectionalInputVector();
      ttPlayer.dashTimer = 0;
      ttPlayer.onGround = false;
      ttPlayer.groundKind = null;
      ttPlayer.groundPlatformId = -1;
      ttPlayer.wallDir = 0;
      ttPlayer.vx = fly.x * TT_FLY_SPEED;
      ttPlayer.vy = fly.y * TT_FLY_SPEED;
      if (Math.abs(fly.x) > 0.08) ttPlayer.facing = fly.x > 0 ? 1 : -1;
    } else if (ttPlayer.dashTimer > 0) {
      ttPlayer.dashTimer = Math.max(0, ttPlayer.dashTimer - dt);
      ttPlayer.vx = ttPlayer.dashX * dashSpeed;
      ttPlayer.vy = ttPlayer.dashY * dashSpeed;
    } else {
      if (ttPlayer.wallControlLock > 0) {
        // Preserve the brief push away from a wall jump before direct air control resumes.
      } else if (ttPlayer.onGround) {
        const targetVX = move * runSpeed;
        if (Math.abs(move) > 0.05) {
          ttPlayer.vx = ttMoveToward(ttPlayer.vx, targetVX, TT_GROUND_ACCEL * dt);
        } else {
          ttPlayer.vx = ttMoveToward(ttPlayer.vx, 0, TT_GROUND_FRICTION * dt);
        }
      } else {
        // Deliberately responsive air control: no retained left/right drift.
        ttPlayer.vx = Math.abs(move) > 0.05 ? move * runSpeed : 0;
      }

      ttPlayer.vy = Math.min(TT_MAX_FALL_SPEED, ttPlayer.vy + TT_GRAVITY * dt);

      const pressingIntoWall =
        (ttPlayer.wallDir === 1 && move > 0.12) ||
        (ttPlayer.wallDir === -1 && move < -0.12);
      const pressingAwayFromWall =
        (ttPlayer.wallDir === 1 && move < -0.12) ||
        (ttPlayer.wallDir === -1 && move > 0.12);
      const neutralOnWall = ttPlayer.wallDir !== 0 && Math.abs(move) <= 0.12;

      if (!ttPlayer.onGround && ttPlayer.wallDir !== 0 && ttPlayer.vy > 0) {
        if (pressingIntoWall) {
          ttPlayer.vy = 0;
        } else if (neutralOnWall && ttPlayer.vy > TT_WALL_SLIDE_SPEED) {
          ttPlayer.vy = TT_WALL_SLIDE_SPEED;
        } else if (pressingAwayFromWall) {
          // Full gravity applies when the player deliberately leaves the wall.
        }
      }
    }

    const wasGroundedBeforeMove = ttPlayer.onGround;
    const verticalSpeedBeforeMove = ttPlayer.vy;
    ttMoveHorizontal(ttPlayer.vx * dt);
    ttMoveVertical(ttPlayer.vy * dt);
    if (!wasGroundedBeforeMove && ttPlayer.onGround && verticalSpeedBeforeMove > (TT_IS_MOBILE ? 150 : 220)) {
      ttEmitLandingFeedback(verticalSpeedBeforeMove);
    }
    ttPlayer.wallDir = ttDetectWallContact();
    if (ttPlayer.wallDir !== 0) ttPlayer.lastWallDir = ttPlayer.wallDir;

    if (ttPlayer.onGround && ttPlayer.dashTimer <= 0) ttPlayer.canDash = true;

    ttUpdateCrumblePlatforms(dt);

    if (ttTouchesSpike()) {
      ttEmitSpikeFeedback();
      ttRespawnPlayer();
      return;
    }

    if (ttInput.interactQueued) {
      const interactMargin = TT_IS_MOBILE ? 8 : 14;
      const exitInteractionBox = ttExitDoor ? {
        x: ttExitDoor.x - interactMargin,
        y: ttExitDoor.y - interactMargin,
        w: ttExitDoor.w + interactMargin * 2,
        h: ttExitDoor.h + interactMargin * 2
      } : null;
      ttInput.interactQueued = false;

      if (ttTryBassBreak()) {
        return;
      } else if (ttTryCollectNearbyPowerUp()) {
        return;
      } else if (ttTryCollectNearbyCrystal()) {
        // One interact press affects one object only.
      } else if (exitInteractionBox && ttIntersects(ttPlayer, exitInteractionBox)) {
        ttBeginRoomTransition();
        return;
      }
    }

    if (ttFeedbackTimer <= 0 && ttFeedbackText) {
      ttFeedbackText = "";
      ttUpdateRoomLabel();
    }

    const speedRatio = Math.min(1, Math.abs(ttPlayer.vx) / (TT_RUN_SPEED * (ttMetronomeTime > 0 ? TT_METRONOME_SPEED_MULTIPLIER : 1)));
    if (ttPlayer.onGround && speedRatio > 0.08) {
      ttPlayer.runCycle += dt * (8 + speedRatio * 6);
    }

    const desiredCameraX = ttClamp(
      ttPlayer.x + ttPlayer.w / 2 - GAME_CANVAS_LOGICAL_WIDTH / 2,
      0,
      Math.max(0, TT_WORLD_WIDTH - GAME_CANVAS_LOGICAL_WIDTH)
    );
    const desiredCameraY = ttClamp(
      ttPlayer.y + ttPlayer.h / 2 - GAME_CANVAS_LOGICAL_HEIGHT / 2,
      0,
      Math.max(0, TT_WORLD_HEIGHT - GAME_CANVAS_LOGICAL_HEIGHT)
    );
    const cameraRate = TT_IS_MOBILE ? 10.5 : 8.5;
    ttCamera.x += (desiredCameraX - ttCamera.x) * Math.min(1, dt * cameraRate);
    ttCamera.y += (desiredCameraY - ttCamera.y) * Math.min(1, dt * cameraRate);
    ttUpdateMapDiscovery();
  }

  function gameUpdate() {
    const now = performance.now();
    if (ttAnyOverlayOpen()) {
      ttLastTime = now;
      ttAccumulator = 0;
      return;
    }
    const frameSeconds = Math.min(0.05, Math.max(0, (now - ttLastTime) / 1000));
    ttLastTime = now;
    ttAccumulator += frameSeconds;
    while (ttAccumulator >= TT_FIXED_STEP) {
      ttPhysicsStep(TT_FIXED_STEP);
      ttAccumulator -= TT_FIXED_STEP;
    }
  }

  function ttScreenX(worldX) {
    return Math.round(worldX - ttCamera.x);
  }

  function ttScreenY(worldY) {
    return Math.round(worldY - ttCamera.y);
  }


  function ttDrawDashGhosts() {
    for (const ghost of ttDashGhosts) {
      const alpha = ttClamp(ghost.life / ghost.maxLife, 0, 1) * 0.34;
      const x = ttScreenX(ghost.x);
      const y = ttScreenY(ghost.y);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x + ttPlayer.w / 2, y + ttPlayer.h / 2);
      ctx.scale(ghost.facing, 1);
      ctx.fillStyle = "#8fe7fb";
      if (TT_IS_MOBILE) {
        ctx.fillRect(-6, -13, 12, 8);
        ctx.fillRect(-7, -4, 14, 13);
        ctx.fillRect(-7, 7, 6, 8);
        ctx.fillRect(1, 7, 6, 8);
      } else {
        ctx.fillRect(-10, -22, 20, 13);
        ctx.fillRect(-12, -7, 24, 22);
        ctx.fillRect(-11, 13, 9, 14);
        ctx.fillRect(2, 13, 9, 14);
      }
      ctx.restore();
    }
  }

  function ttDrawParticles(screenSpace) {
    for (const particle of ttParticles) {
      if (particle.screenSpace !== screenSpace) continue;
      const alpha = ttClamp(particle.life / particle.maxLife, 0, 1);
      const x = screenSpace ? particle.x : ttScreenX(particle.x);
      const y = screenSpace ? particle.y : ttScreenY(particle.y);
      if (x < -30 || x > GAME_CANVAS_LOGICAL_WIDTH + 30 || y < -30 || y > GAME_CANVAS_LOGICAL_HEIGHT + 30) continue;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x, y);
      ctx.rotate(particle.rotation);
      ctx.fillStyle = particle.color;
      if (particle.shape === "shard") {
        ctx.beginPath();
        ctx.moveTo(0, -particle.size);
        ctx.lineTo(particle.size * 0.75, particle.size * 0.65);
        ctx.lineTo(-particle.size * 0.7, particle.size * 0.5);
        ctx.closePath();
        ctx.fill();
      } else if (particle.shape === "rect") {
        ctx.fillRect(-particle.size, -particle.size * 0.65, particle.size * 2, particle.size * 1.3);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, particle.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function ttDrawFloatingTexts() {
    for (const text of ttFloatingTexts) {
      const progress = 1 - text.life / text.maxLife;
      const alpha = ttClamp(text.life / text.maxLife * 1.6, 0, 1);
      const scale = text.scale * (1 + Math.sin(Math.min(1, progress * 2.2) * Math.PI) * 0.12);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(ttScreenX(text.x), ttScreenY(text.y));
      ctx.scale(scale, scale);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `bold ${TT_IS_MOBILE ? 11 : 18}px Arial, sans-serif`;
      ctx.fillStyle = text.color;
      ctx.shadowColor = "rgba(0, 0, 0, 0.65)";
      ctx.shadowBlur = TT_IS_MOBILE ? 3 : 5;
      ctx.fillText(text.text, 0, 0);
      ctx.restore();
    }
  }

  function ttDrawCrystalSparkles() {
    for (const crystal of ttCrystals) {
      if (crystal.collected || !crystal.revealed) continue;
      const twinkle = Math.sin(ttCrystalClock * 4.8 + crystal.phase * 1.7);
      if (twinkle < 0.78) continue;
      const alpha = (twinkle - 0.78) / 0.22;
      const x = ttScreenX(crystal.x + crystal.w * (0.72 + 0.12 * Math.sin(crystal.phase)));
      const y = ttScreenY(crystal.y + crystal.h * (0.18 + 0.12 * Math.cos(crystal.phase)));
      const size = (TT_IS_MOBILE ? 2.2 : 3.5) + alpha * (TT_IS_MOBILE ? 1.7 : 2.8);
      ctx.save();
      ctx.globalAlpha = alpha * 0.85;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = TT_IS_MOBILE ? 0.8 : 1.2;
      ctx.beginPath();
      ctx.moveTo(x - size, y);
      ctx.lineTo(x + size, y);
      ctx.moveTo(x, y - size);
      ctx.lineTo(x, y + size);
      ctx.stroke();
      ctx.restore();
    }
  }

  function ttDrawDoorPrompt() {
    if (!ttExitDoor || ttRoomIntroPhase !== "active" || ttTransitionActive || ttCollapseActive) return;
    const margin = TT_IS_MOBILE ? 8 : 14;
    const box = {
      x: ttExitDoor.x - margin,
      y: ttExitDoor.y - margin,
      w: ttExitDoor.w + margin * 2,
      h: ttExitDoor.h + margin * 2
    };
    if (!ttIntersects(ttPlayer, box)) return;
    const x = ttScreenX(ttExitDoor.x + ttExitDoor.w / 2);
    const y = ttScreenY(ttExitDoor.y - (TT_IS_MOBILE ? 9 : 15));
    const pulse = 0.82 + Math.sin(ttCrystalClock * 6) * 0.1;
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    ctx.font = `bold ${TT_IS_MOBILE ? 9 : 14}px Arial, sans-serif`;
    ctx.fillStyle = "#ffe69b";
    ctx.shadowColor = "rgba(0, 0, 0, 0.8)";
    ctx.shadowBlur = TT_IS_MOBILE ? 3 : 5;
    ctx.fillText(TT_IS_MOBILE ? "USE" : "INTERACT", x, y);
    ctx.restore();
  }



  function ttDrawSlurRoute() {
    return;
    ctx.save();
    ctx.globalAlpha = 0.52 + Math.sin(ttPowerClock * 4) * 0.10;
    ctx.fillStyle = "#ffd675";
    for (const solid of ttSolids) {
      if (!solid.floor || !ttRoutePlatformIds.has(solid.id)) continue;
      const x = ttScreenX(solid.x);
      const y = ttScreenY(solid.y);
      if (x + solid.w < -20 || x > GAME_CANVAS_LOGICAL_WIDTH + 20 || y > GAME_CANVAS_LOGICAL_HEIGHT + 20) continue;
      ctx.fillRect(x, y - (TT_IS_MOBILE ? 3 : 5), solid.w, TT_IS_MOBILE ? 3 : 5);
    }
    if (ttExitDoor) {
      const x = ttScreenX(ttExitDoor.x + ttExitDoor.w / 2);
      const y = ttScreenY(ttExitDoor.y - (TT_IS_MOBILE ? 14 : 24));
      ctx.fillStyle = "#fff0a8";
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - (TT_IS_MOBILE ? 6 : 10), y - (TT_IS_MOBILE ? 10 : 16));
      ctx.lineTo(x + (TT_IS_MOBILE ? 6 : 10), y - (TT_IS_MOBILE ? 10 : 16));
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function ttDrawMetronomeIcon(cx, cy, size, highlighted) {
    const w = size * 0.68;
    const h = size * 0.92;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.strokeStyle = highlighted ? "rgba(255,255,255,0.96)" : "rgba(255,255,255,0.88)";
    ctx.lineWidth = Math.max(1.4, size * 0.08);
    ctx.beginPath();
    ctx.moveTo(-w * 0.42, h * 0.46);
    ctx.lineTo(-w * 0.18, -h * 0.42);
    ctx.lineTo(w * 0.18, -h * 0.42);
    ctx.lineTo(w * 0.42, h * 0.46);
    ctx.closePath();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -h * 0.28);
    ctx.lineTo(w * 0.16, h * 0.18);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(w * 0.16, h * 0.18, size * 0.07, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.94)";
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-w * 0.20, h * 0.46);
    ctx.lineTo(w * 0.20, h * 0.46);
    ctx.stroke();
    ctx.restore();
  }

  function ttDrawQuillMapIcon(cx, cy, size) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-0.35);
    ctx.fillStyle = "rgba(255,255,255,0.96)";
    ctx.strokeStyle = "rgba(255,255,255,0.98)";
    ctx.lineWidth = Math.max(1.1, size * 0.055);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.beginPath();
    ctx.moveTo(-size * 0.33, size * 0.38);
    ctx.quadraticCurveTo(-size * 0.08, size * 0.02, size * 0.28, -size * 0.42);
    ctx.quadraticCurveTo(size * 0.42, -size * 0.50, size * 0.34, -size * 0.28);
    ctx.quadraticCurveTo(size * 0.18, size * 0.02, -size * 0.33, size * 0.38);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "rgba(20,33,40,0.72)";
    ctx.lineWidth = Math.max(0.9, size * 0.042);
    ctx.beginPath();
    ctx.moveTo(-size * 0.36, size * 0.43);
    ctx.lineTo(size * 0.31, -size * 0.38);
    ctx.stroke();

    for (let i = 0; i < 4; i++) {
      const t = 0.20 + i * 0.16;
      const stemX = -size * 0.36 + size * 0.67 * t;
      const stemY = size * 0.43 - size * 0.81 * t;
      ctx.beginPath();
      ctx.moveTo(stemX, stemY);
      ctx.lineTo(stemX - size * (0.12 - i * 0.012), stemY - size * 0.03);
      ctx.moveTo(stemX, stemY);
      ctx.lineTo(stemX + size * (0.11 - i * 0.012), stemY + size * 0.015);
      ctx.stroke();
    }

    ctx.fillStyle = "rgba(255,255,255,0.98)";
    ctx.beginPath();
    ctx.moveTo(-size * 0.40, size * 0.47);
    ctx.lineTo(-size * 0.29, size * 0.32);
    ctx.lineTo(-size * 0.23, size * 0.42);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function ttDrawHairpinIcon(cx, cy, size, crescendo) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = "rgba(255,255,255,0.98)";
    ctx.lineWidth = Math.max(1.8, size * 0.075);
    ctx.lineCap = "round";
    ctx.beginPath();
    if (crescendo) {
      ctx.moveTo(-size * 0.34, 0);
      ctx.lineTo(size * 0.34, -size * 0.22);
      ctx.moveTo(-size * 0.34, 0);
      ctx.lineTo(size * 0.34, size * 0.22);
    } else {
      ctx.moveTo(size * 0.34, 0);
      ctx.lineTo(-size * 0.34, -size * 0.22);
      ctx.moveTo(size * 0.34, 0);
      ctx.lineTo(-size * 0.34, size * 0.22);
    }
    ctx.stroke();
    ctx.restore();
  }

  function ttDrawLinedRestIcon(cx, cy, size, wholeRest) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = "rgba(255,255,255,0.98)";
    ctx.strokeStyle = "rgba(255,255,255,0.98)";
    ctx.lineCap = "butt";

    // Match the clean Rhythm Snake proportions: a short staff line and a compact
    // rectangle either sitting on it (half) or hanging directly beneath it (whole).
    const lineHalf = size * 0.34;
    const blockW = size * 0.50;
    const blockH = Math.max(3, size * 0.18);
    const lineWidth = Math.max(1.15, size * 0.05);
    const lineY = wholeRest ? -size * 0.13 : size * 0.14;
    ctx.lineWidth = lineWidth;

    ctx.beginPath();
    ctx.moveTo(-lineHalf, lineY);
    ctx.lineTo(lineHalf, lineY);
    ctx.stroke();

    const blockY = wholeRest
      ? lineY
      : lineY - blockH;
    ctx.fillRect(-blockW / 2, blockY, blockW, blockH);
    ctx.restore();
  }

  function ttDrawQuarterRestIcon(cx, cy, size) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = "rgba(255,255,255,0.98)";
    ctx.lineWidth = Math.max(2.0, size * 0.095);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // Literal quarter-rest construction:
    // down-right, down-left, down-right, then a left-half semicircular hook.
    ctx.beginPath();
    ctx.moveTo(-size * 0.18, -size * 0.42);
    ctx.lineTo(size * 0.10, -size * 0.18);
    ctx.lineTo(-size * 0.08, size * 0.03);
    ctx.lineTo(size * 0.12, size * 0.20);
    ctx.bezierCurveTo(
      -size * 0.10, size * 0.21,
      -size * 0.11, size * 0.42,
      size * 0.08, size * 0.42
    );
    ctx.stroke();
    ctx.restore();
  }

  function ttDrawEighthRestIcon(cx, cy, size) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = "rgba(255,255,255,0.98)";
    ctx.strokeStyle = "rgba(255,255,255,0.98)";
    ctx.lineWidth = Math.max(2.0, size * 0.09);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // Literal eighth-rest construction:
    // dot, connected lower-half semicircle, then diagonal top-right to bottom-left.
    const dotX = -size * 0.20;
    const dotY = -size * 0.22;
    const dotR = size * 0.105;
    ctx.beginPath();
    ctx.arc(dotX, dotY, dotR, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(dotX + dotR * 0.72, dotY + dotR * 0.18);
    ctx.bezierCurveTo(
      -size * 0.08, size * 0.01,
      size * 0.10, size * 0.01,
      size * 0.18, -size * 0.18
    );
    ctx.lineTo(-size * 0.07, size * 0.42);
    ctx.stroke();
    ctx.restore();
  }

  function ttDrawPowerUps() {
    const nearest = ttFindNearestInteractivePowerUp();
    for (const powerUp of ttPowerUps) {
