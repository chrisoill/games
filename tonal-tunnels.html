      if (powerUp.collected) continue;
      const def = TT_POWERUP_LIBRARY[powerUp.type];
      const floatY = Math.sin(ttPowerClock * 2.5 + powerUp.phase) * TT_POWERUP_FLOAT_AMPLITUDE;
      const x = ttScreenX(powerUp.x);
      const y = ttScreenY(powerUp.y + floatY);
      if (x + powerUp.w < -20 || x > GAME_CANVAS_LOGICAL_WIDTH + 20 || y + powerUp.h < -20 || y > GAME_CANVAS_LOGICAL_HEIGHT + 20) continue;
      const highlighted = nearest === powerUp;
      const cx = x + powerUp.w / 2;
      const cy = y + powerUp.h / 2;
      const glowPulse = 0.72 + 0.18 * Math.sin(ttPowerClock * 4 + powerUp.phase);
      const haloR = powerUp.w * (highlighted ? 0.64 : 0.54);
      ctx.save();
      const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, haloR);
      halo.addColorStop(0, `rgba(${def.glow}, ${highlighted ? 0.24 : 0.16})`);
      halo.addColorStop(0.62, `rgba(${def.glow}, ${highlighted ? 0.10 : 0.06})`);
      halo.addColorStop(1, `rgba(${def.glow}, 0)`);
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(cx, cy, haloR, 0, Math.PI * 2);
      ctx.fill();

      if (highlighted) {
        ctx.strokeStyle = `rgba(${def.glow}, 0.78)`;
        ctx.lineWidth = TT_IS_MOBILE ? 1.3 : 2;
        ctx.beginPath();
        ctx.arc(cx, cy, powerUp.w * 0.44 + Math.sin(ttPowerClock * 8 + powerUp.phase) * (TT_IS_MOBILE ? 1 : 1.6), 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.shadowColor = `rgba(${def.glow}, ${highlighted ? 0.98 : 0.82})`;
      ctx.shadowBlur = (TT_IS_MOBILE ? 10 : 16) + (highlighted ? (TT_IS_MOBILE ? 6 : 9) : 0);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "rgba(255,255,255,0.98)";
      if (powerUp.type === "metronome") {
        ttDrawMetronomeIcon(cx, cy, powerUp.w * (TT_IS_MOBILE ? 0.74 : 0.82), highlighted);
      } else if (powerUp.type === "quill") {
        ttDrawQuillMapIcon(cx, cy, powerUp.w * (TT_IS_MOBILE ? 0.86 : 0.94));
      } else if (powerUp.type === "crescendo") {
        ttDrawHairpinIcon(cx, cy, powerUp.w * 0.84, true);
      } else if (powerUp.type === "decrescendo") {
        ttDrawHairpinIcon(cx, cy, powerUp.w * 0.84, false);
      } else if (powerUp.type === "restQ") {
        ttDrawQuarterRestIcon(cx, cy, powerUp.w * 0.84);
      } else if (powerUp.type === "rest8") {
        ttDrawEighthRestIcon(cx, cy, powerUp.w * 0.84);
      } else if (powerUp.type === "restH") {
        ttDrawLinedRestIcon(cx, cy, powerUp.w * 0.84, false);
      } else if (powerUp.type === "restW") {
        ttDrawLinedRestIcon(cx, cy, powerUp.w * 0.84, true);
      } else if (def.smufl) {
        ctx.font = `${TT_IS_MOBILE ? 24 : 34}px BravuraTT`;
        ctx.fillText(def.label, cx, cy + (TT_IS_MOBILE ? 1 : 2));
      } else if (powerUp.type === "slur") {
        ctx.shadowBlur = (TT_IS_MOBILE ? 9 : 14) + (highlighted ? (TT_IS_MOBILE ? 5 : 8) : 0);
        ctx.strokeStyle = "rgba(255,255,255,0.97)";
        ctx.lineWidth = TT_IS_MOBILE ? 2.2 : 3.3;
        ctx.beginPath();
        ctx.moveTo(cx - powerUp.w * 0.30, cy + powerUp.h * 0.08);
        ctx.quadraticCurveTo(cx, cy - powerUp.h * 0.28, cx + powerUp.w * 0.30, cy + powerUp.h * 0.08);
        ctx.stroke();
      } else {
        ctx.font = `bold ${TT_IS_MOBILE ? 12.5 : 19}px Arial, sans-serif`;
        if (powerUp.type === "trill") ctx.font = `italic bold ${TT_IS_MOBILE ? 12.5 : 19}px Arial, sans-serif`;
        if (powerUp.type === "rit") {
          ctx.font = `bold ${TT_IS_MOBILE ? 8.8 : 12.8}px Arial, sans-serif`;
        }
        ctx.fillText(def.label, cx, cy);
      }
      ctx.restore();
    }
  }

  function ttDrawPowerStatusHud() {
    if (!ttLastPowerStatus) return;
    ctx.save();
    const x = TT_IS_MOBILE ? 8 : 12;
    const y = TT_IS_MOBILE ? 8 : 10;
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.font = `bold ${TT_IS_MOBILE ? 9 : 13}px Arial, sans-serif`;
    ctx.fillStyle = "rgba(12, 21, 26, 0.72)";
    const width = Math.min(GAME_CANVAS_LOGICAL_WIDTH - x * 2, ctx.measureText(ttLastPowerStatus).width + 14);
    ttRoundedRectPath(x - 4, y - 3, width, TT_IS_MOBILE ? 15 : 21, TT_IS_MOBILE ? 4 : 6);
    ctx.fill();
    ctx.fillStyle = "#e9f9ff";
    ctx.fillText(ttLastPowerStatus, x + 2, y);
    ctx.restore();
  }

  function ttDrawRepeatMenuOverlay() {
    if (!ttRepeatMenuOpen) return;
    const outerMargin = TT_IS_MOBILE ? 8 : 24;
    const panelX = outerMargin, panelY = outerMargin;
    const panelW = GAME_CANVAS_LOGICAL_WIDTH - outerMargin * 2;
    const panelH = GAME_CANVAS_LOGICAL_HEIGHT - outerMargin * 2;
    const titleH = TT_IS_MOBILE ? 28 : 42, footerH = TT_IS_MOBILE ? 22 : 34, mapPadding = TT_IS_MOBILE ? 7 : 13;
    const mapAreaX = panelX + mapPadding, mapAreaY = panelY + titleH;
    const mapAreaW = panelW - mapPadding * 2, mapAreaH = panelH - titleH - footerH - mapPadding;
    const scale = Math.min(mapAreaW / TT_WORLD_WIDTH, mapAreaH / TT_WORLD_HEIGHT);
    const drawW = TT_WORLD_WIDTH * scale, drawH = TT_WORLD_HEIGHT * scale;
    const originX = mapAreaX + (mapAreaW - drawW) / 2, originY = mapAreaY + (mapAreaH - drawH) / 2;
    const visibleCells = ttVisibleMapCellSet();
    const visibleEdges = ttMapEdges.concat(ttSlurEdges);
    ctx.save();
    ctx.fillStyle = "rgba(3, 8, 12, 0.82)"; ctx.fillRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);
    ctx.fillStyle = "rgba(18, 31, 40, 0.98)"; ctx.strokeStyle = "#d8edf3"; ctx.lineWidth = TT_IS_MOBILE ? 1.5 : 2.5;
    ctx.fillRect(panelX, panelY, panelW, panelH); ctx.strokeRect(panelX + 0.5, panelY + 0.5, panelW - 1, panelH - 1);
    ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillStyle = "#e7f6fa"; ctx.font = `bold ${TT_IS_MOBILE ? 11 : 18}px Arial, sans-serif`;
    ctx.fillText("REPEAT SIGN", panelX + mapPadding, panelY + titleH * 0.48);
    ctx.textAlign = "right"; ctx.fillStyle = "#9bb5bf"; ctx.font = `${TT_IS_MOBILE ? 8 : 12}px Arial, sans-serif`;
    ctx.fillText("SELECT A DISCOVERED ROOM", panelX + panelW - mapPadding, panelY + titleH * 0.48);
    ctx.fillStyle = "#0b151b"; ctx.fillRect(originX, originY, drawW, drawH); ctx.strokeStyle = "rgba(184, 218, 228, 0.24)"; ctx.lineWidth = TT_IS_MOBILE ? 0.7 : 1; ctx.strokeRect(originX, originY, drawW, drawH);
    const cellMapW = TT_CELL_WIDTH * scale, cellMapH = TT_CELL_HEIGHT * scale; const chamberW = cellMapW * 0.74, chamberH = cellMapH * 0.52;
    ctx.lineWidth = Math.max(TT_IS_MOBILE ? 2 : 3, Math.min(cellMapW, cellMapH) * 0.18); ctx.lineCap = "round";
    for (const edge of visibleEdges) {
      if (!visibleCells.has(edge.a) || !visibleCells.has(edge.b)) continue;
      ctx.strokeStyle = ttMapExplored.has(edge.a) && ttMapExplored.has(edge.b) ? "#536e79" : "rgba(83, 110, 121, 0.34)";
      const a = ttCellFromIndex(edge.a), b = ttCellFromIndex(edge.b);
      const ax = originX + (TT_ROOM_MARGIN_X + (a.col + 0.5) * TT_CELL_WIDTH) * scale;
      const ay = originY + (TT_ROOM_MARGIN_Y + (a.row + 0.5) * TT_CELL_HEIGHT) * scale;
      const bx = originX + (TT_ROOM_MARGIN_X + (b.col + 0.5) * TT_CELL_WIDTH) * scale;
      const by = originY + (TT_ROOM_MARGIN_Y + (b.row + 0.5) * TT_CELL_HEIGHT) * scale;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    }
    const currentCell = ttMapCellAtWorldPoint(ttPlayer.x + ttPlayer.w / 2, ttPlayer.y + ttPlayer.h / 2);
    for (const index of visibleCells) {
      const cell = ttCellFromIndex(index);
      const cx = originX + (TT_ROOM_MARGIN_X + (cell.col + 0.5) * TT_CELL_WIDTH) * scale;
      const cy = originY + (TT_ROOM_MARGIN_Y + (cell.row + 0.5) * TT_CELL_HEIGHT) * scale;
      const explored = ttMapExplored.has(index);
      let fill = explored ? "#607b86" : "rgba(96, 123, 134, 0.34)";
      if (index === currentCell) fill = "#7895a0";
      if (index === ttRepeatSelectedCell) fill = "#fff0a0";
      ctx.fillStyle = fill; ctx.fillRect(cx - chamberW / 2, cy - chamberH / 2, chamberW, chamberH);
      ctx.strokeStyle = index === ttRepeatSelectedCell ? "#fff7d0" : explored ? "#aac3cb" : "rgba(170, 195, 203, 0.36)";
      ctx.lineWidth = index === ttRepeatSelectedCell ? (TT_IS_MOBILE ? 1.2 : 1.8) : (TT_IS_MOBILE ? 0.6 : 1);
      ctx.strokeRect(cx - chamberW / 2, cy - chamberH / 2, chamberW, chamberH);
    }
    function mapPoint(worldX, worldY) { return { x: originX + worldX * scale, y: originY + worldY * scale }; }
    function mapCellCenter(cellIndex) { const cell = ttCellFromIndex(cellIndex); return mapPoint(TT_ROOM_MARGIN_X + (cell.col + 0.5) * TT_CELL_WIDTH, TT_ROOM_MARGIN_Y + (cell.row + 0.5) * TT_CELL_HEIGHT); }
    if (ttEntranceDoor) { const point = mapCellCenter(ttMapEntranceCell); ttDrawMapDoorSymbol(point.x, point.y, false); }
    if ((ttMapExitDiscovered || ttMapRevealAll) && ttExitDoor) { const point = mapCellCenter(ttMapExitCell); ttDrawMapDoorSymbol(point.x, point.y, true); }
    const playerPoint = mapPoint(ttPlayer.x + ttPlayer.w / 2, ttPlayer.y + ttPlayer.h / 2); ctx.fillStyle = "#ff6f61"; ctx.beginPath(); ctx.arc(playerPoint.x, playerPoint.y, TT_IS_MOBILE ? 3 : 5, 0, Math.PI * 2); ctx.fill();
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#b9ced6"; ctx.font = `${TT_IS_MOBILE ? 9 : 12}px Arial, sans-serif`;
    ctx.fillText(TT_IS_MOBILE ? "D-PAD + A/X TO TELEPORT" : "ARROWS/WASD + ENTER TO TELEPORT", panelX + panelW / 2, panelY + panelH - footerH * 0.5);
    ctx.restore();
  }

  function ttDrawRoomArrivalPulse() {
    if (ttRoomArrivalPulse <= 0) return;
    const progress = 1 - ttRoomArrivalPulse / 0.42;
    ctx.save();
    ctx.globalAlpha = (1 - progress) * 0.35;
    ctx.strokeStyle = "#d7f7ff";
    ctx.lineWidth = TT_IS_MOBILE ? 1.4 : 2.3;
    ctx.beginPath();
    ctx.arc(
      GAME_CANVAS_LOGICAL_WIDTH / 2,
      GAME_CANVAS_LOGICAL_HEIGHT / 2,
      (TT_IS_MOBILE ? 18 : 28) + progress * Math.max(GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT) * 0.58,
      0,
      Math.PI * 2
    );
    ctx.stroke();
    ctx.restore();
  }

  function ttDrawScreenFlash() {
    if (ttScreenFlashTime <= 0 || ttScreenFlashAlpha <= 0) return;
    const fade = ttScreenFlashDuration > 0 ? ttScreenFlashTime / ttScreenFlashDuration : 0;
    ctx.save();
    ctx.fillStyle = `rgba(${ttScreenFlashColor}, ${ttScreenFlashAlpha * ttClamp(fade, 0, 1)})`;
    ctx.fillRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);
    ctx.restore();
  }

  function ttVisualHash(value) {
    const raw = Math.sin(value * 12.9898 + 78.233) * 43758.5453123;
    return raw - Math.floor(raw);
  }

  function ttRoundedRectPath(x, y, width, height, radius) {
    const r = Math.max(0, Math.min(radius, width / 2, height / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + width - r, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + r);
    ctx.lineTo(x + width, y + height - r);
    ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
    ctx.lineTo(x + r, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function ttDrawBackground() {
    const width = GAME_CANVAS_LOGICAL_WIDTH;
    const height = GAME_CANVAS_LOGICAL_HEIGHT;
    const gradient = ctx.createLinearGradient(0, 0, 0, height);
    gradient.addColorStop(0, "#0c1820");
    gradient.addColorStop(0.48, "#142733");
    gradient.addColorStop(1, "#091218");
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);

    function drawCaveSilhouette(color, parallaxX, parallaxY, spacing, depth, fromTop) {
      const offsetX = -((ttCamera.x * parallaxX) % spacing) - spacing;
      const drift = (ttCamera.y * parallaxY) % (TT_IS_MOBILE ? 20 : 32);
      ctx.fillStyle = color;
      ctx.beginPath();
      if (fromTop) {
        ctx.moveTo(-spacing, 0);
        for (let x = offsetX, index = 0; x <= width + spacing; x += spacing, index++) {
          const seed = ttVisualHash(index + Math.floor(ttCamera.x / spacing) * 0.37 + parallaxX * 91);
          const tip = depth * (0.38 + seed * 0.62) + drift;
          ctx.lineTo(x, 0);
          ctx.lineTo(x + spacing * (0.34 + seed * 0.16), tip);
          ctx.lineTo(x + spacing, 0);
        }
        ctx.lineTo(width + spacing, 0);
      } else {
        ctx.moveTo(-spacing, height);
        for (let x = offsetX, index = 0; x <= width + spacing; x += spacing, index++) {
          const seed = ttVisualHash(index + Math.floor(ttCamera.x / spacing) * 0.29 + parallaxX * 137);
          const tip = height - depth * (0.28 + seed * 0.72) - drift;
          ctx.lineTo(x, height);
          ctx.lineTo(x + spacing * (0.38 + seed * 0.12), tip);
          ctx.lineTo(x + spacing, height);
        }
        ctx.lineTo(width + spacing, height);
      }
      ctx.closePath();
      ctx.fill();
    }

    drawCaveSilhouette("#10212b", 0.06, 0.018, TT_IS_MOBILE ? 82 : 132, TT_IS_MOBILE ? 35 : 58, true);
    drawCaveSilhouette("#0d1b23", 0.09, 0.026, TT_IS_MOBILE ? 69 : 112, TT_IS_MOBILE ? 29 : 48, false);
    drawCaveSilhouette("rgba(35, 62, 73, 0.48)", 0.14, 0.04, TT_IS_MOBILE ? 54 : 88, TT_IS_MOBILE ? 18 : 30, true);

    const veinSpacing = TT_IS_MOBILE ? 118 : 188;
    const veinOffsetX = -((ttCamera.x * 0.11) % veinSpacing);
    const veinOffsetY = -((ttCamera.y * 0.08) % veinSpacing);
    ctx.lineWidth = TT_IS_MOBILE ? 0.8 : 1.25;
    for (let row = -1; row < Math.ceil(height / veinSpacing) + 2; row++) {
      for (let col = -1; col < Math.ceil(width / veinSpacing) + 2; col++) {
        const seed = row * 71 + col * 43;
        const x = veinOffsetX + col * veinSpacing + ttVisualHash(seed) * veinSpacing * 0.45;
        const y = veinOffsetY + row * veinSpacing + ttVisualHash(seed + 9) * veinSpacing * 0.42;
        ctx.strokeStyle = ttVisualHash(seed + 17) > 0.53
          ? "rgba(92, 145, 153, 0.11)"
          : "rgba(100, 92, 123, 0.09)";
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + veinSpacing * 0.15, y + veinSpacing * 0.08);
        ctx.lineTo(x + veinSpacing * 0.24, y + veinSpacing * 0.24);
        ctx.lineTo(x + veinSpacing * 0.39, y + veinSpacing * 0.29);
        ctx.stroke();
      }
    }

    const moteSpacing = TT_IS_MOBILE ? 47 : 74;
    const moteOffsetX = -((ttCamera.x * 0.2) % moteSpacing);
    const moteOffsetY = -((ttCamera.y * 0.16) % moteSpacing);
    for (let y = moteOffsetY - moteSpacing; y < height + moteSpacing; y += moteSpacing) {
      for (let x = moteOffsetX - moteSpacing; x < width + moteSpacing; x += moteSpacing) {
        const seed = Math.floor((x + ttCamera.x * 0.2) / moteSpacing) * 19 + Math.floor((y + ttCamera.y * 0.16) / moteSpacing) * 31;
        const alpha = 0.06 + ttVisualHash(seed) * 0.08;
        ctx.fillStyle = `rgba(180, 220, 218, ${alpha})`;
        ctx.beginPath();
        ctx.arc(x + ttVisualHash(seed + 4) * moteSpacing * 0.35, y + ttVisualHash(seed + 8) * moteSpacing * 0.35, TT_IS_MOBILE ? 0.65 : 1.05, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }


  function ttDrawRectPlatform(platform, topHeight, baseColor, topColor) {
    const sx = ttScreenX(platform.x);
    const sy = ttScreenY(platform.y);
    if (
      sx + platform.w < -14 || sx > GAME_CANVAS_LOGICAL_WIDTH + 14 ||
      sy + platform.h < -14 || sy > GAME_CANVAS_LOGICAL_HEIGHT + 14
    ) return;

    const isVertical = platform.h > platform.w * 1.35;
    const seed = (platform.id || 0) * 37 + Math.round(platform.x * 0.07) + Math.round(platform.y * 0.11);
    ctx.save();
    ctx.beginPath();
    ctx.rect(sx, sy, platform.w, platform.h);
    ctx.clip();

    const rockGradient = ctx.createLinearGradient(0, sy, 0, sy + platform.h);
    rockGradient.addColorStop(0, topColor);
    rockGradient.addColorStop(0.22, baseColor);
    rockGradient.addColorStop(1, "#304047");
    ctx.fillStyle = rockGradient;
    ctx.fillRect(sx, sy, platform.w, platform.h);

    if (isVertical) {
      const edge = Math.min(platform.w * 0.24, TT_IS_MOBILE ? 6 : 10);
      ctx.fillStyle = "rgba(170, 194, 194, 0.18)";
      ctx.fillRect(sx, sy, edge, platform.h);
      ctx.fillStyle = "rgba(4, 11, 15, 0.18)";
      ctx.fillRect(sx + platform.w - edge, sy, edge, platform.h);
    } else {
      const rim = Math.min(topHeight + (TT_IS_MOBILE ? 2 : 3), platform.h);
      const rimGradient = ctx.createLinearGradient(0, sy, 0, sy + rim);
      rimGradient.addColorStop(0, "rgba(187, 205, 202, 0.68)");
      rimGradient.addColorStop(0.34, topColor);
      rimGradient.addColorStop(1, "rgba(31, 45, 50, 0.2)");
      ctx.fillStyle = rimGradient;
      ctx.fillRect(sx, sy, platform.w, rim);
      ctx.fillStyle = "rgba(2, 8, 11, 0.14)";
      ctx.fillRect(sx, sy + platform.h - Math.min(platform.h, TT_IS_MOBILE ? 4 : 7), platform.w, Math.min(platform.h, TT_IS_MOBILE ? 4 : 7));
    }

    const cellW = TT_IS_MOBILE ? 27 : 44;
    const cellH = TT_IS_MOBILE ? 18 : 29;
    ctx.strokeStyle = "rgba(10, 20, 24, 0.29)";
    ctx.lineWidth = TT_IS_MOBILE ? 0.75 : 1.2;
    for (let row = 0; row <= Math.ceil(platform.h / cellH); row++) {
      const yy = sy + row * cellH + (ttVisualHash(seed + row * 13) - 0.5) * (TT_IS_MOBILE ? 3 : 5);
      ctx.beginPath();
      ctx.moveTo(sx, yy);
      ctx.lineTo(sx + platform.w, yy);
      ctx.stroke();
    }
    for (let row = 0; row < Math.ceil(platform.h / cellH); row++) {
      const shift = row % 2 ? cellW * 0.46 : 0;
      for (let col = -1; col <= Math.ceil(platform.w / cellW); col++) {
        const xx = sx + col * cellW + shift + (ttVisualHash(seed + row * 31 + col * 7) - 0.5) * (TT_IS_MOBILE ? 4 : 7);
        const y0 = sy + row * cellH;
        const y1 = Math.min(sy + platform.h, y0 + cellH);
        ctx.beginPath();
        ctx.moveTo(xx, y0);
        ctx.lineTo(xx + (ttVisualHash(seed + row * 17 + col * 23) - 0.5) * (TT_IS_MOBILE ? 3 : 5), y1);
        ctx.stroke();
      }
    }

    const crackCount = Math.min(5, Math.max(1, Math.floor((platform.w + platform.h) / (TT_IS_MOBILE ? 110 : 175))));
    ctx.strokeStyle = "rgba(4, 10, 13, 0.42)";
    ctx.lineWidth = TT_IS_MOBILE ? 0.9 : 1.45;
    for (let i = 0; i < crackCount; i++) {
      const px = sx + ttVisualHash(seed + 100 + i * 17) * platform.w;
      const py = sy + ttVisualHash(seed + 200 + i * 29) * platform.h;
      const length = (TT_IS_MOBILE ? 7 : 12) + ttVisualHash(seed + 300 + i) * (TT_IS_MOBILE ? 10 : 17);
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px + length * 0.38, py + length * 0.34);
      ctx.lineTo(px + length * 0.12, py + length * 0.72);
      ctx.stroke();
    }
    ctx.restore();
  }


  function ttDrawPlatforms() {
    for (const solid of ttSolids) {
      ttDrawRectPlatform(solid, TT_IS_MOBILE ? 4 : 7, "#405159", "#6f7e80");
    }

    for (const platform of ttOneWays) {
      const sx = ttScreenX(platform.x);
      const sy = ttScreenY(platform.y);
      if (sx + platform.w < -12 || sx > GAME_CANVAS_LOGICAL_WIDTH + 12 || sy + platform.h < -12 || sy > GAME_CANVAS_LOGICAL_HEIGHT + 12) continue;
      ctx.save();
      const shelfGradient = ctx.createLinearGradient(0, sy, 0, sy + platform.h);
      shelfGradient.addColorStop(0, "#9aa9a8");
      shelfGradient.addColorStop(0.28, "#66777b");
      shelfGradient.addColorStop(1, "#35444a");
      ctx.fillStyle = shelfGradient;
      ctx.fillRect(sx, sy, platform.w, platform.h);
      ctx.fillStyle = "rgba(223, 235, 227, 0.45)";
      ctx.fillRect(sx, sy, platform.w, TT_IS_MOBILE ? 1.5 : 2.5);
      ctx.fillStyle = "rgba(7, 14, 17, 0.36)";
      ctx.fillRect(sx, sy + platform.h - (TT_IS_MOBILE ? 2 : 3), platform.w, TT_IS_MOBILE ? 2 : 3);
      const notch = TT_IS_MOBILE ? 12 : 19;
      ctx.fillStyle = "rgba(24, 37, 42, 0.58)";
      for (let x = sx + notch * 0.6; x < sx + platform.w - notch * 0.3; x += notch) {
        const depth = TT_IS_MOBILE ? 2.5 : 4;
        ctx.beginPath();
        ctx.moveTo(x, sy + platform.h);
        ctx.lineTo(x + notch * 0.25, sy + platform.h - depth);
        ctx.lineTo(x + notch * 0.5, sy + platform.h);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    for (const platform of ttCrumblePlatforms) {
      if (platform.state === "gone") continue;
      const ratio = platform.state === "crumbling" ? Math.max(0, Math.min(1, platform.timer / TT_CRUMBLE_DELAY)) : 1;
      const sx = ttScreenX(platform.x);
      const sy = ttScreenY(platform.y);
      if (sx + platform.w < -12 || sx > GAME_CANVAS_LOGICAL_WIDTH + 12 || sy + platform.h < -12 || sy > GAME_CANVAS_LOGICAL_HEIGHT + 12) continue;
      const segments = Math.max(3, Math.round(platform.w / (TT_IS_MOBILE ? 22 : 35)));
      const segmentW = platform.w / segments;
      ctx.save();
      for (let i = 0; i < segments; i++) {
        const jitter = (ttVisualHash((platform.id || 0) * 19 + i * 11) - 0.5) * (TT_IS_MOBILE ? 2 : 3.5);
        const drop = platform.state === "crumbling" ? (1 - ratio) * (i % 2 ? (TT_IS_MOBILE ? 2 : 4) : 0) : 0;
        const gradient = ctx.createLinearGradient(0, sy, 0, sy + platform.h);
        gradient.addColorStop(0, ratio < 0.45 ? "#c69372" : "#a89788");
        gradient.addColorStop(0.35, ratio < 0.45 ? "#855f50" : "#726b66");
        gradient.addColorStop(1, "#3b3532");
        ctx.fillStyle = gradient;
        ctx.fillRect(sx + i * segmentW + 0.5, sy + jitter + drop, Math.max(1, segmentW - 1), platform.h - Math.abs(jitter));
        ctx.strokeStyle = "rgba(45, 32, 29, 0.72)";
        ctx.lineWidth = TT_IS_MOBILE ? 0.8 : 1.25;
        ctx.strokeRect(sx + i * segmentW + 0.5, sy + jitter + drop, Math.max(1, segmentW - 1), platform.h - Math.abs(jitter));
      }
      ctx.strokeStyle = "rgba(42, 27, 24, 0.92)";
      ctx.lineWidth = TT_IS_MOBILE ? 1 : 1.7;
      for (let i = 1; i < segments; i += 2) {
        const xx = sx + i * segmentW;
        ctx.beginPath();
        ctx.moveTo(xx, sy + 1);
        ctx.lineTo(xx - segmentW * 0.17, sy + platform.h * 0.48);
        ctx.lineTo(xx + segmentW * 0.08, sy + platform.h - 1);
        ctx.stroke();
      }
      ctx.restore();
    }
  }



  function ttDrawCrystalNotation(crystal, x, y) {
    const calibration = TT_IS_MOBILE
      ? TT_SMUFL_CLEF_CALIBRATION.mobile
      : TT_SMUFL_CLEF_CALIBRATION.desktop;
    const staff = calibration.staff;
    const clef = crystal.pitch.clef === "treble"
      ? calibration.treble
      : calibration.bass;

    const staffLeft = x + staff.left;
    const staffRight = x + staff.right;
    const lineSpacing = staff.lineSpacing;
    const bottomLineY = y + staff.bottomLineY;

    ctx.strokeStyle = "#1b2933";
    ctx.lineWidth = TT_IS_MOBILE ? 0.9 : 1.35;
    for (let line = 0; line < 5; line++) {
      const ly = bottomLineY - line * lineSpacing;
      ctx.beginPath();
      ctx.moveTo(staffLeft, ly);
      ctx.lineTo(staffRight, ly);
      ctx.stroke();
    }

    ctx.fillStyle = "#17222c";
    ctx.font = `${clef.fontSize}px BravuraTT`;
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(clef.glyph, x + clef.x, y + clef.y);

    const isStaffNote = crystal.pitch.staffStep >= 0 && crystal.pitch.staffStep <= 8;
    const noteX = x + crystal.w * 0.5 + (isStaffNote ? (TT_IS_MOBILE ? 1 : 2) : 0);
    const noteY = bottomLineY - crystal.pitch.staffStep * lineSpacing / 2;
    const ledgerHalf = TT_IS_MOBILE ? 5.3 : 8.6;

    ctx.strokeStyle = "#152129";
    ctx.lineWidth = TT_IS_MOBILE ? 0.95 : 1.45;
    if (crystal.pitch.staffStep < 0) {
      for (let step = -2; step >= crystal.pitch.staffStep; step -= 2) {
        const ledgerY = bottomLineY - step * lineSpacing / 2;
        ctx.beginPath();
        ctx.moveTo(noteX - ledgerHalf, ledgerY);
        ctx.lineTo(noteX + ledgerHalf, ledgerY);
        ctx.stroke();
      }
    } else if (crystal.pitch.staffStep > 8) {
      for (let step = 10; step <= crystal.pitch.staffStep; step += 2) {
        const ledgerY = bottomLineY - step * lineSpacing / 2;
        ctx.beginPath();
        ctx.moveTo(noteX - ledgerHalf, ledgerY);
        ctx.lineTo(noteX + ledgerHalf, ledgerY);
        ctx.stroke();
      }
    }

    ctx.fillStyle = "#101a20";
    ctx.save();
    ctx.translate(noteX, noteY);
    ctx.rotate(-0.28);
    ctx.beginPath();
    ctx.ellipse(0, 0, TT_IS_MOBILE ? 3.7 : 5.9, TT_IS_MOBILE ? 2.35 : 3.75, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    const stemUp = crystal.pitch.staffStep < 5;
    ctx.strokeStyle = "#101a20";
    ctx.lineWidth = TT_IS_MOBILE ? 1.0 : 1.55;
    ctx.beginPath();
    if (stemUp) {
      ctx.moveTo(noteX + (TT_IS_MOBILE ? 3.1 : 5.0), noteY);
      ctx.lineTo(noteX + (TT_IS_MOBILE ? 3.1 : 5.0), noteY - lineSpacing * 3.0);
    } else {
      ctx.moveTo(noteX - (TT_IS_MOBILE ? 3.1 : 5.0), noteY);
      ctx.lineTo(noteX - (TT_IS_MOBILE ? 3.1 : 5.0), noteY + lineSpacing * 3.0);
    }
    ctx.stroke();

    if (crystal.pitch.accidental) {
      ctx.fillStyle = "#101a20";
      ctx.font = `bold ${TT_IS_MOBILE ? 10.5 : 17}px Arial, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(crystal.pitch.accidental, noteX - (TT_IS_MOBILE ? 8.2 : 13.2), noteY + (TT_IS_MOBILE ? 0.5 : 0.8));
    }
  }

  function ttDrawCrystals() {
    const nearest = ttFindNearestInteractiveCrystal();

    for (const crystal of ttCrystals) {
      if (crystal.collected || !crystal.revealed) continue;
      const floatY = Math.sin(ttCrystalClock * 2.25 + crystal.phase) * TT_CRYSTAL_FLOAT_AMPLITUDE;
      const x = ttScreenX(crystal.x);
      const y = ttScreenY(crystal.y + floatY);
      if (x + crystal.w < -20 || x > GAME_CANVAS_LOGICAL_WIDTH + 20 || y + crystal.h < -20 || y > GAME_CANVAS_LOGICAL_HEIGHT + 20) continue;

      const accentMarked = Boolean(crystal.accentMarked);
      const highlighted = nearest === crystal || accentMarked;
      const pulse = 0.5 + 0.5 * Math.sin(ttCrystalClock * 3.2 + crystal.phase);
      ctx.save();
      ctx.shadowColor = accentMarked ? "rgba(111, 255, 154, 0.95)" : highlighted ? "rgba(255, 222, 118, 0.92)" : "rgba(103, 218, 241, 0.82)";
      ctx.shadowBlur = (TT_IS_MOBILE ? 8 : 14) + pulse * (TT_IS_MOBILE ? 4 : 7);

      const crystalGradient = ctx.createLinearGradient(x, y, x + crystal.w, y + crystal.h);
      if (accentMarked) {
        crystalGradient.addColorStop(0, "#f3fff4");
        crystalGradient.addColorStop(0.45, "#d8ffd9");
        crystalGradient.addColorStop(1, "#97f0a5");
      } else if (highlighted) {
        crystalGradient.addColorStop(0, "#fffdf1");
        crystalGradient.addColorStop(0.45, "#fff3c9");
        crystalGradient.addColorStop(1, "#f5df9d");
      } else {
        crystalGradient.addColorStop(0, "#f8feff");
        crystalGradient.addColorStop(0.42, "#eaf9fc");
        crystalGradient.addColorStop(1, "#cceef4");
      }
      ctx.fillStyle = crystalGradient;
      ctx.beginPath();
      ctx.moveTo(x, y + crystal.h * 0.27);
      ctx.lineTo(x + crystal.w * 0.5, y);
      ctx.lineTo(x + crystal.w, y + crystal.h * 0.27);
      ctx.lineTo(x + crystal.w, y + crystal.h * 0.73);
      ctx.lineTo(x + crystal.w * 0.5, y + crystal.h);
      ctx.lineTo(x, y + crystal.h * 0.73);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.strokeStyle = accentMarked ? "#2d9951" : highlighted ? "#b68d2e" : "#4ea4b7";
      ctx.lineWidth = TT_IS_MOBILE ? 1.25 : 2;
      ctx.stroke();

      ctx.globalAlpha = 0.28;
      ctx.fillStyle = accentMarked ? "#f4fff4" : highlighted ? "#fffdf0" : "#ffffff";
      ctx.beginPath();
      ctx.moveTo(x + crystal.w * 0.08, y + crystal.h * 0.3);
      ctx.lineTo(x + crystal.w * 0.48, y + crystal.h * 0.06);
      ctx.lineTo(x + crystal.w * 0.38, y + crystal.h * 0.47);
      ctx.lineTo(x + crystal.w * 0.12, y + crystal.h * 0.58);
      ctx.closePath();
      ctx.fill();

      ctx.globalAlpha = 0.16;
      ctx.fillStyle = accentMarked ? "#98efab" : highlighted ? "#f5e8b4" : "#bdeaf2";
      ctx.beginPath();
      ctx.moveTo(x + crystal.w * 0.52, y + crystal.h * 0.06);
      ctx.lineTo(x + crystal.w * 0.92, y + crystal.h * 0.3);
      ctx.lineTo(x + crystal.w * 0.74, y + crystal.h * 0.62);
      ctx.lineTo(x + crystal.w * 0.58, y + crystal.h * 0.48);
      ctx.closePath();
      ctx.fill();

      ctx.globalAlpha = 1;
      ctx.strokeStyle = accentMarked ? "rgba(45, 153, 81, 0.22)" : highlighted ? "rgba(142, 102, 18, 0.20)" : "rgba(39, 126, 145, 0.18)";
      ctx.lineWidth = TT_IS_MOBILE ? 0.8 : 1.25;
      ctx.beginPath();
      ctx.moveTo(x + crystal.w * 0.5, y + crystal.h * 0.04);
      ctx.lineTo(x + crystal.w * 0.39, y + crystal.h * 0.49);
      ctx.lineTo(x + crystal.w * 0.5, y + crystal.h * 0.96);
      ctx.moveTo(x + crystal.w * 0.39, y + crystal.h * 0.49);
      ctx.lineTo(x + crystal.w * 0.09, y + crystal.h * 0.3);
      ctx.moveTo(x + crystal.w * 0.39, y + crystal.h * 0.49);
      ctx.lineTo(x + crystal.w * 0.1, y + crystal.h * 0.72);
      ctx.moveTo(x + crystal.w * 0.39, y + crystal.h * 0.49);
      ctx.lineTo(x + crystal.w * 0.91, y + crystal.h * 0.3);
      ctx.moveTo(x + crystal.w * 0.39, y + crystal.h * 0.49);
      ctx.lineTo(x + crystal.w * 0.91, y + crystal.h * 0.72);
      ctx.stroke();

      ttDrawCrystalNotation(crystal, x, y);
      ctx.restore();
    }

    for (const burst of ttCrystalBursts) {
      const progress = ttClamp(burst.timer / burst.duration, 0, 1);
      const alpha = 1 - progress;
      const x = ttScreenX(burst.x);
      const y = ttScreenY(burst.y);
      const radius = (TT_IS_MOBILE ? 8 : 13) + progress * (TT_IS_MOBILE ? 24 : 39);
      ctx.save();
      ctx.globalAlpha = alpha;
      const ringGradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
      ringGradient.addColorStop(0, burst.correct ? "rgba(217, 249, 255, 0.66)" : "rgba(255, 209, 198, 0.66)");
      ringGradient.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = ringGradient;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = burst.correct ? "#d8f8ff" : "#ffb2a5";
      ctx.lineWidth = TT_IS_MOBILE ? 1.5 : 2.4;
      ctx.beginPath();
      ctx.arc(x, y, radius * 0.55, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = burst.correct ? "#75def2" : "#ff7664";
      for (let shard = 0; shard < 7; shard++) {
        const angle = burst.phase + shard * Math.PI * 2 / 7;
        const sx = x + Math.cos(angle) * radius;
        const sy = y + Math.sin(angle) * radius;
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(angle + progress * 2.4);
        ctx.beginPath();
        ctx.moveTo(0, -(TT_IS_MOBILE ? 4 : 7));
        ctx.lineTo(TT_IS_MOBILE ? 2.4 : 4, TT_IS_MOBILE ? 3 : 5);
        ctx.lineTo(-(TT_IS_MOBILE ? 2 : 3.5), TT_IS_MOBILE ? 2 : 4);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      ctx.restore();
    }
  }


  function ttDrawSpikes() {
    for (const spike of ttSpikes) {
      const sx = ttScreenX(spike.x);
      const sy = ttScreenY(spike.y);
      if (sx + spike.w < -12 || sx > GAME_CANVAS_LOGICAL_WIDTH + 12 || sy + spike.h < -12 || sy > GAME_CANVAS_LOGICAL_HEIGHT + 12) continue;

      const unit = TT_IS_MOBILE ? 9 : 15;
      const count = Math.max(2, Math.round(spike.w / unit));
      const width = spike.w / count;
      ctx.save();
      ctx.fillStyle = "#2a3438";
      ctx.fillRect(sx, sy + spike.h * 0.74, spike.w, spike.h * 0.26);
      const metal = ctx.createLinearGradient(0, sy, 0, sy + spike.h);
      metal.addColorStop(0, "#f0f5f2");
      metal.addColorStop(0.22, "#b8c6c8");
      metal.addColorStop(0.66, "#66777d");
      metal.addColorStop(1, "#313e43");
      ctx.fillStyle = metal;
      ctx.strokeStyle = "#263137";
      ctx.lineWidth = TT_IS_MOBILE ? 0.8 : 1.25;
      for (let i = 0; i < count; i++) {
        const seed = spike.x * 0.13 + spike.y * 0.07 + i * 17;
        const heightScale = 0.74 + ttVisualHash(seed) * 0.26;
        const lean = (ttVisualHash(seed + 4) - 0.5) * width * 0.22;
        const left = sx + i * width;
        const tipX = left + width * 0.5 + lean;
        const tipY = sy + spike.h * (1 - heightScale);
        ctx.beginPath();
        ctx.moveTo(left - width * 0.03, sy + spike.h);
        ctx.lineTo(tipX, tipY);
        ctx.lineTo(left + width * 1.03, sy + spike.h);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = "rgba(255, 255, 255, 0.48)";
        ctx.lineWidth = TT_IS_MOBILE ? 0.55 : 0.9;
        ctx.beginPath();
        ctx.moveTo(left + width * 0.18, sy + spike.h * 0.86);
        ctx.lineTo(tipX, tipY + spike.h * 0.08);
        ctx.stroke();
        ctx.strokeStyle = "#263137";
        ctx.lineWidth = TT_IS_MOBILE ? 0.8 : 1.25;
      }
      ctx.restore();
    }
  }


  function ttEaseOutCubic(value) {
    return 1 - Math.pow(1 - value, 3);
  }

  function ttDrawRoomTargetIntro() {
    if (ttRoomIntroPhase === "active") return;
    const originX = ttScreenX(ttTargetOrigin.x);
    const originY = ttScreenY(ttTargetOrigin.y);

    if (ttRoomIntroPhase === "show") {
      const cue = ttGetReadySetGoCue() || { label: "READY", color: "#ff675b", glow: "255, 76, 64" };
      const phaseProgress = (ttRoomIntroTimer % (TT_TARGET_SHOW_DURATION / 3)) / (TT_TARGET_SHOW_DURATION / 3);
      const pulse = 0.5 + 0.5 * Math.sin(phaseProgress * Math.PI * 2.2);
      const scale = 1 + pulse * (TT_IS_MOBILE ? 0.025 : 0.035);

      ctx.save();
      ctx.translate(originX, originY);
      ctx.scale(scale, scale);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `bold ${TT_IS_MOBILE ? 30 : 48}px Arial, sans-serif`;
      ctx.shadowColor = `rgba(${cue.glow}, ${0.68 + pulse * 0.27})`;
      ctx.shadowBlur = (TT_IS_MOBILE ? 9 : 15) + pulse * (TT_IS_MOBILE ? 8 : 13);
      ctx.fillStyle = cue.color;
      ctx.fillText(ttRoomTarget.label, 0, 0);

      ctx.shadowBlur = (TT_IS_MOBILE ? 5 : 8) + pulse * (TT_IS_MOBILE ? 3 : 5);
      ctx.font = `bold ${TT_IS_MOBILE ? 10 : 16}px Arial, sans-serif`;
      ctx.fillText(cue.label, 0, -(TT_IS_MOBILE ? 29 : 46));

      // A softly breathing ring makes the pause feel charged rather than static.
      ctx.globalAlpha = 0.22 + pulse * 0.22;
      ctx.strokeStyle = cue.color;
      ctx.lineWidth = TT_IS_MOBILE ? 2 : 3;
      ctx.beginPath();
      ctx.arc(0, 0, (TT_IS_MOBILE ? 26 : 42) + pulse * (TT_IS_MOBILE ? 4 : 7), 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      return;
    }

    const baseProgress = ttClamp(ttRoomIntroTimer / TT_TARGET_FLIGHT_DURATION, 0, 1);
    ctx.save();
    for (let index = 0; index < ttCrystals.length; index++) {
      const crystal = ttCrystals[index];
      const stagger = ttCrystals.length > 1 ? (index / (ttCrystals.length - 1)) * 0.16 : 0;
      const progress = ttClamp((baseProgress - stagger) / (1 - stagger), 0, 1);
      const eased = ttEaseOutCubic(progress);
      const targetX = ttScreenX(crystal.x + crystal.w / 2);
      const targetY = ttScreenY(crystal.y + crystal.h / 2);
      const fan = Math.sin(crystal.phase) * (TT_IS_MOBILE ? 19 : 31) * (1 - eased);
      const px = originX + (targetX - originX) * eased + fan;
      const py = originY + (targetY - originY) * eased - Math.sin(progress * Math.PI) * (TT_IS_MOBILE ? 25 : 40);
      const size = (TT_IS_MOBILE ? 3.5 : 5.5) + progress * (TT_IS_MOBILE ? 1.5 : 2.5);
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(crystal.phase + progress * 5.5);
      ctx.fillStyle = "#d9f7ff";
      ctx.beginPath();
      ctx.moveTo(0, -size);
      ctx.lineTo(size * 0.8, size * 0.6);
      ctx.lineTo(-size * 0.75, size * 0.45);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  function ttDrawDesktopTimerHud() {
    if (TT_IS_MOBILE) return;
    const margin = 10;
    const barHeight = 42;
    const x = margin;
    const y = GAME_CANVAS_LOGICAL_HEIGHT - barHeight - margin;
    const width = GAME_CANVAS_LOGICAL_WIDTH - margin * 2;
    const timeText = ttFormatRoomTime(ttRoomTimeRemaining);
    const cue = ttGetReadySetGoCue();
    let centerText = `ROOM ${ttRoomNumber}`;
    if (cue) centerText = cue.label;
    else if (ttRoomIntroPhase === "flight") centerText = "GO!";
    else if (ttCollapseActive) centerText = "EXIT BURIED";
    else if (ttFeedbackTimer > 0 && ttFeedbackText) centerText = ttFeedbackText;
    else if (ttCombo > 1) centerText = `COMBO ${ttCombo}`;

    ctx.save();
    ctx.shadowColor = "rgba(0, 0, 0, 0.48)";
    ctx.shadowBlur = 10;
    const panelGradient = ctx.createLinearGradient(0, y, 0, y + barHeight);
    panelGradient.addColorStop(0, "rgba(48, 65, 68, 0.96)");
    panelGradient.addColorStop(0.22, "rgba(24, 38, 43, 0.97)");
    panelGradient.addColorStop(1, "rgba(10, 20, 25, 0.98)");
    ctx.fillStyle = panelGradient;
    ttRoundedRectPath(x, y, width, barHeight, 9);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(161, 190, 190, 0.7)";
    ctx.lineWidth = 1.5;
    ttRoundedRectPath(x + 0.75, y + 0.75, width - 1.5, barHeight - 1.5, 8);
    ctx.stroke();
    ctx.strokeStyle = "rgba(222, 236, 224, 0.2)";
    ctx.beginPath();
    ctx.moveTo(x + 12, y + 5);
    ctx.lineTo(x + width - 12, y + 5);
    ctx.stroke();

    const third = width / 3;
    ctx.strokeStyle = "rgba(126, 154, 157, 0.28)";
    ctx.beginPath();
    ctx.moveTo(x + third, y + 8);
    ctx.lineTo(x + third, y + barHeight - 8);
    ctx.moveTo(x + third * 2, y + 8);
    ctx.lineTo(x + third * 2, y + barHeight - 8);
    ctx.stroke();

    ctx.textBaseline = "middle";
    ctx.font = "bold 17px Arial, sans-serif";
    ctx.textAlign = "left";
    ctx.fillStyle = "#d9f7ff";
    ctx.fillText(`TARGET  ${ttRoomTarget.label}`, x + 15, y + barHeight / 2);

    ctx.textAlign = "center";
    ctx.fillStyle = cue ? cue.color : (ttCollapseActive ? "#ff8e7c" : "#f2dda0");
    ctx.fillText(centerText, x + width / 2, y + barHeight / 2);

    ctx.textAlign = "right";
    ctx.fillStyle = ttRoomTimeRemaining <= 10 ? "#ff8e7c" : "#edfafa";
    ctx.fillText(`TIME  ${timeText}`, x + width - 15, y + barHeight / 2);
    ctx.restore();
  }


  function ttDrawAnswerFeedback() {
    if (ttFeedbackTimer <= 0 || !ttFeedbackText) return;
    const alpha = ttClamp(ttFeedbackTimer / TT_FEEDBACK_DURATION, 0, 1);
    const entrance = 1 - alpha;
    const bounce = 1 + Math.sin(Math.min(1, entrance * 3) * Math.PI) * 0.08;
    ctx.save();
    ctx.globalAlpha = Math.min(1, alpha * 1.7);
    ctx.translate(GAME_CANVAS_LOGICAL_WIDTH / 2, TT_IS_MOBILE ? 10 : 62);
    ctx.scale(bounce, bounce);
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.font = `bold ${TT_IS_MOBILE ? 14 : 23}px Arial, sans-serif`;
    ctx.fillStyle = ttFeedbackCorrect ? "#d9f7ff" : "#ff9d8e";
    ctx.shadowColor = ttFeedbackCorrect ? "rgba(93, 215, 244, 0.8)" : "rgba(255, 91, 72, 0.75)";
    ctx.shadowBlur = TT_IS_MOBILE ? 5 : 8;
    ctx.fillText(ttFeedbackText, 0, 0);
    ctx.restore();
  }

  function ttDrawDoor(door, isExit) {
    if (!door) return;
    const x = ttScreenX(door.x);
    const y = ttScreenY(door.y);
    if (x + door.w < -14 || x > GAME_CANVAS_LOGICAL_WIDTH + 14 || y + door.h < -14 || y > GAME_CANVAS_LOGICAL_HEIGHT + 14) return;

    const open = isExit ? ttDoorOpenProgress : 0;
    const frame = TT_IS_MOBILE ? 4 : 7;
    const archHeight = door.h * 0.34;
    const innerX = x + frame;
    const innerY = y + frame;
    const innerW = door.w - frame * 2;
    const innerH = door.h - frame;
    const panelOffset = open * (innerH + frame);

    ctx.save();
    if (isExit) {
      ctx.shadowColor = `rgba(255, 220, 116, ${0.35 + open * 0.45})`;
      ctx.shadowBlur = (TT_IS_MOBILE ? 6 : 11) + open * (TT_IS_MOBILE ? 7 : 12);
    }

    ctx.fillStyle = isExit ? "#766b45" : "#4b5a60";
    ctx.beginPath();
    ctx.moveTo(x, y + door.h);
    ctx.lineTo(x, y + archHeight);
    ctx.quadraticCurveTo(x, y, x + door.w / 2, y);
    ctx.quadraticCurveTo(x + door.w, y, x + door.w, y + archHeight);
    ctx.lineTo(x + door.w, y + door.h);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = "#182329";
    ctx.beginPath();
    ctx.moveTo(innerX, y + door.h);
    ctx.lineTo(innerX, innerY + archHeight * 0.72);
    ctx.quadraticCurveTo(innerX, innerY, x + door.w / 2, innerY);
    ctx.quadraticCurveTo(innerX + innerW, innerY, innerX + innerW, innerY + archHeight * 0.72);
    ctx.lineTo(innerX + innerW, y + door.h);
    ctx.closePath();
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.rect(innerX, innerY, innerW, innerH);
    ctx.clip();
    const panelGradient = ctx.createLinearGradient(innerX, innerY, innerX + innerW, innerY + innerH);
    panelGradient.addColorStop(0, isExit ? "#596246" : "#32464e");
    panelGradient.addColorStop(0.5, isExit ? "#303f38" : "#24353c");
    panelGradient.addColorStop(1, "#17242a");
    ctx.fillStyle = panelGradient;
    ctx.fillRect(innerX, innerY - panelOffset, innerW, innerH);
    ctx.strokeStyle = isExit ? "rgba(237, 211, 116, 0.48)" : "rgba(145, 175, 181, 0.42)";
    ctx.lineWidth = TT_IS_MOBILE ? 0.8 : 1.25;
    const plankGap = innerW / 3;
    for (let i = 1; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(innerX + i * plankGap, innerY - panelOffset + archHeight * 0.45);
      ctx.lineTo(innerX + i * plankGap, innerY - panelOffset + innerH);
      ctx.stroke();
    }
    ctx.restore();

    const blockCount = 7;
    ctx.strokeStyle = isExit ? "#3b3828" : "#28383e";
    ctx.lineWidth = TT_IS_MOBILE ? 0.8 : 1.3;
    for (let i = 0; i < blockCount; i++) {
      const angle = Math.PI + (i / (blockCount - 1)) * Math.PI;
      const bx = x + door.w / 2 + Math.cos(angle) * door.w * 0.45;
      const by = y + archHeight + Math.sin(angle) * archHeight * 0.92;
      ctx.beginPath();
      ctx.moveTo(x + door.w / 2, y + archHeight * 0.82);
      ctx.lineTo(bx, by);
      ctx.stroke();
    }
    ctx.strokeRect(x + 1, y + archHeight, frame - 1, door.h - archHeight - 1);
    ctx.strokeRect(x + door.w - frame, y + archHeight, frame - 1, door.h - archHeight - 1);

    const runeY = y + door.h * 0.48 - panelOffset;
    if (open < 0.82) {
      ctx.save();
      ctx.translate(x + door.w / 2, runeY);
      ctx.strokeStyle = isExit ? "#f2d878" : "#98bcc2";
      ctx.fillStyle = isExit ? "#f2d878" : "#98bcc2";
      ctx.lineWidth = TT_IS_MOBILE ? 1.2 : 2;
      if (isExit) {
        ctx.beginPath();
        ctx.moveTo(0, -(TT_IS_MOBILE ? 6 : 10));
        ctx.lineTo(TT_IS_MOBILE ? 5 : 8, 0);
        ctx.lineTo(0, TT_IS_MOBILE ? 6 : 10);
        ctx.lineTo(-(TT_IS_MOBILE ? 5 : 8), 0);
        ctx.closePath();
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, TT_IS_MOBILE ? 2 : 3.2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, TT_IS_MOBILE ? 6 : 10, 0.35, Math.PI * 1.85);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(TT_IS_MOBILE ? 2 : 3, -(TT_IS_MOBILE ? 1 : 2), TT_IS_MOBILE ? 2 : 3.2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    if (isExit && open > 0) {
      const light = ctx.createLinearGradient(0, innerY, 0, y + door.h);
      light.addColorStop(0, `rgba(255, 247, 197, ${0.38 * open})`);
      light.addColorStop(1, `rgba(235, 184, 70, ${0.08 * open})`);
      ctx.fillStyle = light;
      ctx.fillRect(innerX, innerY, innerW, innerH);
    }
    ctx.restore();
  }



  function ttDrawPlayer() {
    const x = ttScreenX(ttPlayer.x);
    const y = ttScreenY(ttPlayer.y);
    const running = ttPlayer.onGround && Math.abs(ttPlayer.vx) > (TT_IS_MOBILE ? 18 : 25);
    const airborne = !ttPlayer.onGround;
    const clinging = airborne && ttPlayer.wallDir !== 0;
    const bob = running ? Math.sin(ttPlayer.runCycle) * (TT_IS_MOBILE ? 1.2 : 2) : 0;
    const stride = running ? Math.sin(ttPlayer.runCycle) : 0;
    const scale = TT_IS_MOBILE ? 0.62 : 1;

    ctx.save();
    if (ttPlayer.onGround) {
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = "#05090b";
      ctx.beginPath();
      ctx.ellipse(x + ttPlayer.w / 2, y + ttPlayer.h + (TT_IS_MOBILE ? 1 : 2), ttPlayer.w * 0.42, TT_IS_MOBILE ? 2.2 : 3.8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.translate(x + ttPlayer.w / 2, y + ttPlayer.h / 2 + bob);
    ctx.scale(ttPlayer.facing, 1);

    const lampX = (TT_IS_MOBILE ? 5 : 8) * scale;
    const lampY = -(TT_IS_MOBILE ? 15 : 24) * scale;
    const lampRadius = TT_IS_MOBILE ? 18 : 30;
    const lampGlow = ctx.createRadialGradient(lampX, lampY, 0, lampX, lampY, lampRadius);
    lampGlow.addColorStop(0, ttPlayer.dashTimer > 0 ? "rgba(171, 235, 255, 0.42)" : "rgba(255, 232, 153, 0.34)");
    lampGlow.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = lampGlow;
    ctx.beginPath();
    ctx.arc(lampX, lampY, lampRadius, 0, Math.PI * 2);
    ctx.fill();

    const bodyColor = ttPlayer.dashTimer > 0 ? "#75cce8" : "#d47a36";
    const coatDark = ttPlayer.dashTimer > 0 ? "#2f7e9b" : "#8a472b";
    const skin = "#edc483";
    const leather = "#4b2f25";
    const helmet = "#c89a4a";

    const legLen = TT_IS_MOBILE ? 13 : 21;
    const bootY = TT_IS_MOBILE ? 10 : 16;
    const bootH = TT_IS_MOBILE ? 4 : 6;
    const coatH = TT_IS_MOBILE ? 17 : 28;
    const coatStripeH = TT_IS_MOBILE ? 12 : 20;

    let legA = stride * (TT_IS_MOBILE ? 4 : 6);
    let legB = -legA;
    let armA = -stride * (TT_IS_MOBILE ? 3 : 5);
    let armB = -armA;
    if (airborne) {
      legA = TT_IS_MOBILE ? 2 : 4;
      legB = -(TT_IS_MOBILE ? 1 : 2);
      armA = -(TT_IS_MOBILE ? 2 : 4);
      armB = TT_IS_MOBILE ? 3 : 5;
    }
    if (clinging) {
      legA = TT_IS_MOBILE ? 3 : 5;
      legB = -(TT_IS_MOBILE ? 3 : 5);
      armA = -(TT_IS_MOBILE ? 5 : 8);
      armB = -(TT_IS_MOBILE ? 2 : 4);
    }

    // legs
    ctx.fillStyle = "#2a2020";
    ctx.save();
    ctx.translate(-(TT_IS_MOBILE ? 5 : 8), TT_IS_MOBILE ? 6 : 10);
    ctx.rotate(legA * 0.05);
    ctx.fillRect(-(TT_IS_MOBILE ? 3 : 5), 0, TT_IS_MOBILE ? 5 : 8, legLen);
    ctx.fillStyle = "#20292d";
    ctx.fillRect(-(TT_IS_MOBILE ? 4 : 6), bootY, TT_IS_MOBILE ? 7 : 11, bootH);
    ctx.restore();
    ctx.fillStyle = "#2a2020";
    ctx.save();
    ctx.translate(TT_IS_MOBILE ? 4 : 7, TT_IS_MOBILE ? 6 : 10);
    ctx.rotate(legB * 0.05);
    ctx.fillRect(-(TT_IS_MOBILE ? 2 : 4), 0, TT_IS_MOBILE ? 5 : 8, legLen);
    ctx.fillStyle = "#20292d";
    ctx.fillRect(-(TT_IS_MOBILE ? 2 : 4), bootY, TT_IS_MOBILE ? 7 : 11, bootH);
    ctx.restore();

    // back arm stays behind the torso
    ctx.fillStyle = coatDark;
    ctx.save();
    ctx.translate(TT_IS_MOBILE ? 8 : 13, -(TT_IS_MOBILE ? 4 : 6));
    ctx.rotate(armB * 0.06);
    ctx.fillRect(-(TT_IS_MOBILE ? 2 : 3), 0, TT_IS_MOBILE ? 5 : 8, TT_IS_MOBILE ? 11 : 18);
    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.arc(TT_IS_MOBILE ? 1 : 2, TT_IS_MOBILE ? 11 : 18, TT_IS_MOBILE ? 2.3 : 3.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // backpack
    ctx.fillStyle = leather;
    ttRoundedRectPath(-(TT_IS_MOBILE ? 9 : 14), -(TT_IS_MOBILE ? 5 : 8), TT_IS_MOBILE ? 7 : 11, TT_IS_MOBILE ? 14 : 23, TT_IS_MOBILE ? 2 : 3);
    ctx.fill();

    // torso / coat
    const coatGradient = ctx.createLinearGradient(0, -(TT_IS_MOBILE ? 8 : 13), 0, TT_IS_MOBILE ? 11 : 18);
    coatGradient.addColorStop(0, bodyColor);
    coatGradient.addColorStop(1, coatDark);
    ctx.fillStyle = coatGradient;
    ttRoundedRectPath(-(TT_IS_MOBILE ? 8 : 13), -(TT_IS_MOBILE ? 7 : 11), TT_IS_MOBILE ? 16 : 26, coatH, TT_IS_MOBILE ? 3 : 5);
    ctx.fill();
    ctx.fillStyle = "rgba(255, 221, 163, 0.35)";
    ctx.fillRect(-(TT_IS_MOBILE ? 6 : 10), -(TT_IS_MOBILE ? 5 : 8), TT_IS_MOBILE ? 2 : 3, coatStripeH);
    ctx.fillStyle = "#2f6f72";
    ctx.fillRect(-(TT_IS_MOBILE ? 7 : 11), -(TT_IS_MOBILE ? 8 : 13), TT_IS_MOBILE ? 14 : 22, TT_IS_MOBILE ? 3 : 5);
    ctx.beginPath();
    ctx.moveTo(TT_IS_MOBILE ? 5 : 8, -(TT_IS_MOBILE ? 6 : 10));
    ctx.lineTo(TT_IS_MOBILE ? 13 : 21, -(TT_IS_MOBILE ? 2 : 3));
    ctx.lineTo(TT_IS_MOBILE ? 7 : 11, TT_IS_MOBILE ? 1 : 2);
    ctx.closePath();
    ctx.fill();

    // front arm swings in front of the torso
    ctx.fillStyle = coatDark;
    ctx.save();
    ctx.translate(-(TT_IS_MOBILE ? 8 : 13), -(TT_IS_MOBILE ? 4 : 6));
    ctx.rotate(armA * 0.06);
    ctx.fillRect(-(TT_IS_MOBILE ? 3 : 5), 0, TT_IS_MOBILE ? 5 : 8, TT_IS_MOBILE ? 11 : 18);
    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.arc(0, TT_IS_MOBILE ? 11 : 18, TT_IS_MOBILE ? 2.3 : 3.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // head and helmet
    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.arc(0, -(TT_IS_MOBILE ? 13 : 21), TT_IS_MOBILE ? 6 : 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#433026";
    ctx.beginPath();
    ctx.arc(-(TT_IS_MOBILE ? 3 : 5), -(TT_IS_MOBILE ? 15 : 24), TT_IS_MOBILE ? 4 : 7, Math.PI, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = helmet;
    ctx.beginPath();
    ctx.arc(0, -(TT_IS_MOBILE ? 16 : 26), TT_IS_MOBILE ? 7 : 11, Math.PI, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(-(TT_IS_MOBILE ? 8 : 13), -(TT_IS_MOBILE ? 17 : 27), TT_IS_MOBILE ? 18 : 29, TT_IS_MOBILE ? 3 : 5);
    ctx.fillStyle = "#f6df8d";
    ctx.beginPath();
    ctx.arc(TT_IS_MOBILE ? 6 : 10, -(TT_IS_MOBILE ? 17 : 27), TT_IS_MOBILE ? 2.2 : 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#31221d";
    ctx.fillRect(TT_IS_MOBILE ? 2 : 3, -(TT_IS_MOBILE ? 14 : 22), TT_IS_MOBILE ? 2 : 3, TT_IS_MOBILE ? 2 : 3);
    ctx.restore();
  }


  function ttDrawMapDoorSymbol(centerX, centerY, isExit) {
    const w = TT_IS_MOBILE ? 7.5 : 12;
    const h = TT_IS_MOBILE ? 10 : 16;
    ctx.save();
    ctx.fillStyle = isExit ? "#ffe18a" : "#a9c9d6";
    ctx.fillRect(centerX - w / 2, centerY - h / 2, w, h);
    ctx.strokeStyle = isExit ? "#fff0b8" : "#e1f4fa";
    ctx.lineWidth = TT_IS_MOBILE ? 0.8 : 1.3;
    ctx.strokeRect(centerX - w / 2, centerY - h / 2, w, h);
    ctx.fillStyle = "#16232b";
    ctx.fillRect(centerX - w * 0.26, centerY - h * 0.22, w * 0.52, h * 0.72);
    ctx.fillStyle = isExit ? "#9d7a20" : "#5d7c89";
    ctx.fillRect(centerX + w * 0.16, centerY + h * 0.08, Math.max(1, w * 0.12), Math.max(1, w * 0.12));
    ctx.restore();
  }

  function ttDrawMapOverlay() {
    if (!ttMapOpen) return;

    const outerMargin = TT_IS_MOBILE ? 8 : 24;
    const panelX = outerMargin;
    const panelY = outerMargin;
    const panelW = GAME_CANVAS_LOGICAL_WIDTH - outerMargin * 2;
    const panelH = GAME_CANVAS_LOGICAL_HEIGHT - outerMargin * 2;
    const titleH = TT_IS_MOBILE ? 24 : 38;
    const footerH = TT_IS_MOBILE ? 20 : 30;
    const mapPadding = TT_IS_MOBILE ? 7 : 13;
    const mapAreaX = panelX + mapPadding;
    const mapAreaY = panelY + titleH;
    const mapAreaW = panelW - mapPadding * 2;
    const mapAreaH = panelH - titleH - footerH - mapPadding;
    const scale = Math.min(mapAreaW / TT_WORLD_WIDTH, mapAreaH / TT_WORLD_HEIGHT);
    const drawW = TT_WORLD_WIDTH * scale;
    const drawH = TT_WORLD_HEIGHT * scale;
    const originX = mapAreaX + (mapAreaW - drawW) / 2;
    const originY = mapAreaY + (mapAreaH - drawH) / 2;

    ctx.save();
    ctx.fillStyle = "rgba(3, 8, 12, 0.82)";
    ctx.fillRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);

    ctx.fillStyle = "rgba(18, 31, 40, 0.98)";
    ctx.strokeStyle = "#d8edf3";
    ctx.lineWidth = TT_IS_MOBILE ? 1.5 : 2.5;
    ctx.fillRect(panelX, panelY, panelW, panelH);
    ctx.strokeRect(panelX + 0.5, panelY + 0.5, panelW - 1, panelH - 1);

    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#e7f6fa";
    ctx.font = `bold ${TT_IS_MOBILE ? 11 : 18}px Arial, sans-serif`;
    ctx.fillText("CAVE MAP", panelX + mapPadding, panelY + titleH * 0.48);

    ctx.textAlign = "right";
    ctx.fillStyle = "#9bb5bf";
    ctx.font = `${TT_IS_MOBILE ? 8 : 12}px Arial, sans-serif`;
    const visibleCells = ttVisibleMapCellSet();
    const visibleEdges = ttMapEdges.concat(ttSlurEdges);
    ctx.fillText(`${ttMapExplored.size} EXPLORED • ${visibleCells.size} DISCOVERED`, panelX + panelW - mapPadding, panelY + titleH * 0.48);

    ctx.fillStyle = "#0b151b";
    ctx.fillRect(originX, originY, drawW, drawH);
    ctx.strokeStyle = "rgba(184, 218, 228, 0.24)";
    ctx.lineWidth = TT_IS_MOBILE ? 0.7 : 1;
    ctx.strokeRect(originX, originY, drawW, drawH);

    const cellMapW = TT_CELL_WIDTH * scale;
    const cellMapH = TT_CELL_HEIGHT * scale;
    const chamberW = cellMapW * 0.74;
    const chamberH = cellMapH * 0.52;

    // First draw discovered connecting tunnels.
    ctx.lineWidth = Math.max(TT_IS_MOBILE ? 2 : 3, Math.min(cellMapW, cellMapH) * 0.18);
    ctx.lineCap = "round";
    for (const edge of visibleEdges) {
      if (!visibleCells.has(edge.a) || !visibleCells.has(edge.b)) continue;
      ctx.strokeStyle = ttMapExplored.has(edge.a) && ttMapExplored.has(edge.b)
        ? "#536e79"
        : "rgba(83, 110, 121, 0.34)";
      const a = ttCellFromIndex(edge.a);
      const b = ttCellFromIndex(edge.b);
      const ax = originX + (TT_ROOM_MARGIN_X + (a.col + 0.5) * TT_CELL_WIDTH) * scale;
      const ay = originY + (TT_ROOM_MARGIN_Y + (a.row + 0.5) * TT_CELL_HEIGHT) * scale;
      const bx = originX + (TT_ROOM_MARGIN_X + (b.col + 0.5) * TT_CELL_WIDTH) * scale;
      const by = originY + (TT_ROOM_MARGIN_Y + (b.row + 0.5) * TT_CELL_HEIGHT) * scale;
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(bx, by);
      ctx.stroke();
    }

    // Then draw discovered chambers on top of their tunnel links.
    for (const index of visibleCells) {
      const cell = ttCellFromIndex(index);
      const cx = originX + (TT_ROOM_MARGIN_X + (cell.col + 0.5) * TT_CELL_WIDTH) * scale;
      const cy = originY + (TT_ROOM_MARGIN_Y + (cell.row + 0.5) * TT_CELL_HEIGHT) * scale;
      const currentCell = ttMapCellAtWorldPoint(ttPlayer.x + ttPlayer.w / 2, ttPlayer.y + ttPlayer.h / 2);
      const explored = ttMapExplored.has(index);
      ctx.fillStyle = index === currentCell
        ? "#7895a0"
        : explored
          ? "#607b86"
          : "rgba(96, 123, 134, 0.34)";
      ctx.fillRect(cx - chamberW / 2, cy - chamberH / 2, chamberW, chamberH);
      ctx.strokeStyle = explored ? "#aac3cb" : "rgba(170, 195, 203, 0.36)";
      ctx.lineWidth = TT_IS_MOBILE ? 0.6 : 1;
      ctx.strokeRect(cx - chamberW / 2, cy - chamberH / 2, chamberW, chamberH);
    }

    function mapPoint(worldX, worldY) {
      return {
        x: originX + worldX * scale,
        y: originY + worldY * scale
      };
    }

    function mapCellCenter(cellIndex) {
      const cell = ttCellFromIndex(cellIndex);
      return mapPoint(
        TT_ROOM_MARGIN_X + (cell.col + 0.5) * TT_CELL_WIDTH,
        TT_ROOM_MARGIN_Y + (cell.row + 0.5) * TT_CELL_HEIGHT
      );
    }

    if (ttEntranceDoor) {
      const point = mapCellCenter(ttMapEntranceCell);
      ttDrawMapDoorSymbol(point.x, point.y, false);
    }
    if ((ttMapExitDiscovered || ttMapRevealAll) && ttExitDoor) {
      const point = mapCellCenter(ttMapExitCell);
      ttDrawMapDoorSymbol(point.x, point.y, true);
    }

    const playerPoint = mapPoint(ttPlayer.x + ttPlayer.w / 2, ttPlayer.y + ttPlayer.h / 2);
    ctx.fillStyle = "#ff6f61";
    ctx.beginPath();
    ctx.arc(playerPoint.x, playerPoint.y, TT_IS_MOBILE ? 2.7 : 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#ffe9e6";
    ctx.lineWidth = TT_IS_MOBILE ? 0.8 : 1.4;
    ctx.stroke();

    const legendY = panelY + panelH - footerH * 0.52;
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.font = `${TT_IS_MOBILE ? 7.5 : 11}px Arial, sans-serif`;
    ttDrawMapDoorSymbol(panelX + mapPadding + (TT_IS_MOBILE ? 3 : 5), legendY, false);
    ctx.fillStyle = "#b7cbd2";
    ctx.fillText("ENTRANCE", panelX + mapPadding + (TT_IS_MOBILE ? 9 : 15), legendY);
    if (ttMapExitDiscovered) {
      const exitLegendX = panelX + panelW * 0.39;
      ttDrawMapDoorSymbol(exitLegendX, legendY, true);
      ctx.fillText("EXIT", exitLegendX + (TT_IS_MOBILE ? 6 : 10), legendY);
    }
    ctx.textAlign = "right";
    ctx.fillStyle = "#89a4ae";
    ctx.fillText(TT_IS_MOBILE ? "MAP TO CLOSE" : "M OR ESC TO CLOSE", panelX + panelW - mapPadding, legendY);

    ctx.restore();
  }

  function ttDrawCaveCollapse() {
    if (!ttCollapseActive) return;

    if (ttExitDoor) {
      const x = ttScreenX(ttExitDoor.x);
      const y = ttScreenY(ttExitDoor.y);
      const slabCount = 4;
      const slabH = ttExitDoor.h / slabCount;
      ctx.fillStyle = "#29343a";
      ctx.strokeStyle = "#65757d";
      ctx.lineWidth = TT_IS_MOBILE ? 1 : 1.5;
      for (let index = 0; index < slabCount; index++) {
        const slabY = y + index * slabH;
        ctx.fillRect(x - 2, slabY, ttExitDoor.w + 4, slabH + 1);
        ctx.strokeRect(x - 1.5, slabY + 0.5, ttExitDoor.w + 3, slabH);
      }
    }

    const progress = ttClamp(ttCollapseTimer / TT_COLLAPSE_DURATION, 0, 1);
    ctx.fillStyle = `rgba(3, 7, 10, ${0.28 + progress * 0.30})`;
    ctx.fillRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#eef4f5";
    ctx.font = `bold ${TT_IS_MOBILE ? 18 : 30}px Arial, sans-serif`;
    ctx.fillText("EXIT BURIED", GAME_CANVAS_LOGICAL_WIDTH / 2, GAME_CANVAS_LOGICAL_HEIGHT / 2);
  }

  function ttDrawTransition() {
    if (!ttTransitionActive) return;
    const halfway = TT_TRANSITION_DURATION * 0.5;
    const alpha = ttTransitionTimer <= halfway
      ? ttTransitionTimer / halfway
      : 1 - (ttTransitionTimer - halfway) / halfway;
    const clamped = ttClamp(alpha, 0, 1);
    ctx.fillStyle = `rgba(0, 0, 0, ${clamped})`;
    ctx.fillRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);
    if (ttTransitionSwapped) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, clamped * 1.4);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `bold ${TT_IS_MOBILE ? 16 : 27}px Arial, sans-serif`;
      ctx.fillStyle = "#e8f7fa";
      ctx.fillText(`ROOM ${ttRoomNumber}`, GAME_CANVAS_LOGICAL_WIDTH / 2, GAME_CANVAS_LOGICAL_HEIGHT / 2);
      ctx.restore();
    }
  }

  function ttDrawCaveLighting() {
    const width = GAME_CANVAS_LOGICAL_WIDTH;
    const height = GAME_CANVAS_LOGICAL_HEIGHT;
    const px = ttClamp(ttScreenX(ttPlayer.x + ttPlayer.w / 2), 0, width);
    const py = ttClamp(ttScreenY(ttPlayer.y + ttPlayer.h / 2), 0, height);
    const inner = TT_IS_MOBILE ? 58 : 95;
    const outer = TT_IS_MOBILE ? 230 : 370;
    ctx.save();
    const vignette = ctx.createRadialGradient(px, py, inner, px, py, outer);
    vignette.addColorStop(0, "rgba(1, 7, 10, 0)");
    vignette.addColorStop(0.54, "rgba(1, 7, 10, 0.02)");
    vignette.addColorStop(1, "rgba(1, 6, 9, 0.24)");
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, width, height);

    const edge = ctx.createLinearGradient(0, 0, 0, height);
    edge.addColorStop(0, "rgba(0, 4, 7, 0.13)");
    edge.addColorStop(0.18, "rgba(0, 4, 7, 0)");
    edge.addColorStop(0.82, "rgba(0, 4, 7, 0)");
    edge.addColorStop(1, "rgba(0, 4, 7, 0.17)");
    ctx.fillStyle = edge;
    ctx.fillRect(0, 0, width, height);
    ctx.restore();
  }

  function gameDraw() {
    ctx.clearRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);
    ttDrawBackground();

    const shake = ttCameraShakeOffset();
    ctx.save();
    ctx.translate(shake.x, shake.y);
    ttDrawPlatforms();
    ttDrawSpikes();
    ttDrawSlurRoute();
    ttDrawDashGhosts();
    ttDrawPowerUps();
    ttDrawCrystals();
    ttDrawCrystalSparkles();
    ttDrawRoomTargetIntro();
    ttDrawDoor(ttEntranceDoor, false);
    ttDrawDoor(ttExitDoor, true);
    ttDrawDoorPrompt();
    ttDrawParticles(false);
    ttDrawPlayer();
    ttDrawFloatingTexts();
    ctx.restore();

    ttDrawCaveLighting();
    ttDrawParticles(true);
    ttDrawRoomArrivalPulse();
    if (typeof ttDrawDesktopTimerHud === "function") ttDrawDesktopTimerHud();
    ttDrawPowerStatusHud();
    ttDrawAnswerFeedback();
    ttDrawCaveCollapse();
    ttDrawTransition();
    ttDrawScreenFlash();
    ttDrawMapOverlay();
    ttDrawRepeatMenuOverlay();
  }

  function gameInput(action) {
    if (ttRepeatMenuOpen) {
      if (action === "up") ttMoveRepeatSelection(-1, 0);
      if (action === "down") ttMoveRepeatSelection(1, 0);
      if (action === "left") ttMoveRepeatSelection(0, -1);
      if (action === "right") ttMoveRepeatSelection(0, 1);
      if (action === "a" || action === "x") ttConfirmRepeatSelection();
      if (action === "b" || action === "start") ttSetRepeatMenuOpen(false);
      return;
    }
    if (action === "select") {
      ttToggleMap();
      return;
    }
    if (ttMapOpen) {
      if (action === "a") ttSetMapOpen(false);
      return;
    }
    if (action === "left") ttInput.left = true;
    if (action === "right") ttInput.right = true;
    if (action === "up") {
      ttInput.up = true;
      ttQueueJump();
    }
    if (action === "down") {
      ttInput.down = true;
      ttInput.dropQueued = true;
    }
    if (action === "a") {
      ttInput.jumpButton = true;
      ttQueueJump();
    }
    if (action === "b") {
      const dash = ttReadDashVector();
      ttInput.dashQueuedX = dash.x;
      ttInput.dashQueuedY = dash.y;
      ttInput.dashQueued = true;
    }
    if (action === "x") ttInput.interactQueued = true;
  }

  function gameInputRelease(action) {
    if (action === "left") ttInput.left = false;
    if (action === "right") ttInput.right = false;
    if (action === "up") {
      ttInput.up = false;
      ttReleaseJumpIfNeeded();
    }
    if (action === "down") ttInput.down = false;
    if (action === "a") {
      ttInput.jumpButton = false;
      ttReleaseJumpIfNeeded();
    }
  }

  function gamePointer() {
    /* Step 7 has no pointer-specific gameplay. */
  }

  function gameStop() {
    stopAllGameSounds();
    ttResetJuiceState();
    ttMapOpen = false;
    ttInput.left = false;
    ttInput.right = false;
    ttInput.up = false;
    ttInput.down = false;
    ttInput.jumpButton = false;
    ttInput.jumpQueued = false;
    ttInput.dashQueued = false;
    ttInput.dashQueuedX = ttPlayer.facing;
    ttInput.dashQueuedY = 0;
    ttInput.interactQueued = false;
    ttInput.dropQueued = false;
    ttInput.joystickDownHeld = false;
    if (typeof resetJoystick === "function" && typeof sticks !== "undefined") {
      resetJoystick(sticks.left);
      resetJoystick(sticks.right);
    }
  }


    const resizeObserver = new ResizeObserver(() => {
      scaleAppToFrame();
      resetJoystick(sticks.left);
      resetJoystick(sticks.right);
      if (!running) gameDraw();
    });

    resizeObserver.observe(appFrame);

    window.addEventListener("orientationchange", () => {
      setTimeout(() => {
        scaleAppToFrame();
        resetJoystick(sticks.left);
        resetJoystick(sticks.right);
        if (!running) gameDraw();
      }, 250);
    });

    window.MobileArcadeShell = {
      canvas,
      ctx,
      gameWidth: GAME_CANVAS_LOGICAL_WIDTH,
      gameHeight: GAME_CANVAS_LOGICAL_HEIGHT,
      getCanvasSize: getGameCanvasSize,
      scaleGameCanvasBackingStore,
      resetGameCanvasTransform,
      sticks,
      setScore,
      addScore,
      setMessage,
      endGame,
      soundCorrect,
      soundWin,
      soundLose,
      getAudio,
      savePlayers,
      loadPlayers,
      openMenu: openShellMenu,
      closeMenu: closeShellMenu,
      exitToPlayerMenu,
      saveCurrentScoreForSelectedPlayer,
      registerMenuTab: registerShellMenuTab,
      updateMenuTab: updateShellMenuTab,
      configureControls: configureMobileControls,
      setFirstTimeHelpVersion
    };

    scaleAppToFrame();
    loadPlayers();
    resetJoystick(sticks.left);
    resetJoystick(sticks.right);
    configureMobileControls({
      showDpad: true,
      showLeftJoystick: true,
      showRightJoystick: false,
      faceButtons: ["a", "b", "x"],
      systemButtons: ["select", "start"],
      labels: { a: "JUMP", b: "DASH", x: "USE", select: "MAP", start: "MENU" }
    });
    ttRefreshMobileButtonLabels();
    gameInit();
    gameDraw();
  </script>
</body>
