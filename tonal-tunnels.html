<!DOCTYPE html>
<!-- TONAL TUNNELS STEP 8 VISUAL REFINEMENT BUILD — MOBILE — landing threshold + persistent target + timer HUD + READY/SET/GO -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tonal Tunnels — Mobile Step 6</title>

  <style>
    @font-face {
      font-family: "BravuraTT";
      src: url("https://raw.githubusercontent.com/steinbergmedia/bravura/master/redist/otf/Bravura.otf") format("opentype");
      font-display: block;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      overscroll-behavior: none;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #appFrame {
      width: 100%;
      aspect-ratio: 390 / 670;
      position: relative;
      overflow: hidden;
      background: #202020;
    }

    #appStage {
      width: 390px;
      height: 670px;
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: top left;
      transform: scale(var(--app-scale, 1));
      overflow: hidden;
      background: linear-gradient(180deg, #2f2f2f, #191919);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: auto;
      color: white;
    }

    #appStage *:not(input):not(textarea) {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    button {
      font-family: Arial, sans-serif;
      touch-action: none;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input,
    select {
      font-size: 16px;
      padding: 8px;
      border-radius: 10px;
      border: 2px solid #111;
      box-sizing: border-box;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       PLAYER MENU
       ========================= */

    #menuScreen {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #2f2f2f, #191919);
      padding: 13px 16px 14px;
      overflow: visible;
      text-align: center;
      z-index: 20;
      touch-action: pan-y;
    }

    #menuScreen h1 {
      margin: 4px 0 9px;
      font-size: 28px;
    }

    #leaderboardBox {
      margin: 0 auto 9px;
      padding: 9px;
      background: rgba(255,255,255,0.1);
      border-radius: 14px;
      max-width: 350px;
    }

    #leaderboardBox h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    #leaderboardList {
      text-align: left;
      max-width: 230px;
      margin: 0 auto;
      font-size: 15px;
    }

    #playerPickerBox {
      margin: 0 auto 9px;
      padding: 9px;
      background: rgba(255,255,255,0.08);
      border-radius: 14px;
      max-width: 350px;
    }

    #playerSearchInput {
      width: 100%;
      margin-bottom: 8px;
    }

    #playerSelect {
      width: 100%;
      height: 120px;
      background: #f8fbff;
      color: #111827;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border: 2px solid #111;
      border-radius: 10px;
      text-align: left;
    }

    .playerOption {
      padding: 10px;
      border-bottom: 1px solid rgba(17,24,39,0.12);
      font-size: 16px;
      line-height: 1.2;
      background: #f8fbff;
      color: #111827;
    }

    .playerOption:last-child {
      border-bottom: 0;
    }

    .playerOption.selected {
      background: #ffe08a;
      font-weight: bold;
    }

    .playerOption.disabled {
      color: rgba(17,24,39,0.55);
      text-align: center;
      font-style: italic;
    }

    #selectedPlayerActions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 7px;
    }

    #selectedPlayerActions button,
    #addPlayerBtn,
    #startGameBtn,
    #exitPageBtn {
      min-height: 38px;
      border-radius: 12px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
    }

    #resetSelectedPlayerBtn {
      background: #fff3bf;
    }

    #removeSelectedPlayerBtn {
      background: #ffd6d6;
    }

    #addPlayerRow {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
      margin: 0 auto 8px;
      max-width: 350px;
    }

    #newPlayerName {
      width: 100%;
    }

    #selectedPlayerText {
      margin: 7px 0;
      font-size: 15px;
      opacity: 0.9;
    }

    #startGameBtn {
      background: #dff3ff;
      min-width: 150px;
    }

    #exitPageBtn {
      min-width: 110px;
    }

    /* =========================
       GAME / EMULATOR
       ========================= */

    #gameScreen {
      position: absolute;
      inset: 0;
      display: none;
      background: linear-gradient(180deg, #2f2f2f, #191919);
      z-index: 10;
      touch-action: auto;
    }

    #screen {
      position: absolute;
      left: 0;
      top: 0;
      width: 390px;
      height: 219px;
      overflow: hidden;
      background: #0b1420;
      border: 2px solid #34454b;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.05),
        0 1px 3px rgba(0,0,0,0.45);
    }

    #gameCanvas {
      width: 390px;
      height: 219px;
      display: block;
      background: #0c1820;
      image-rendering: auto;
    }

    #gameOverBox {
      display: none;
      position: absolute;
      left: 34px;
      right: 34px;
      top: 35px;
      padding: 18px 12px;
      background: rgba(16, 24, 39, 0.93);
      border: 3px solid white;
      border-radius: 16px;
      color: white;
      text-align: center;
      z-index: 8;
    }

    #gameOverBox h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    #gameOverScore {
      margin: 0 0 10px;
      font-size: 15px;
    }

    #gameOverBox button {
      border: 2px solid #111;
      border-radius: 12px;
      background: white;
      color: #111827;
      padding: 8px 12px;
      margin: 3px;
      font-size: 12px;
      font-weight: bold;
    }

    #lcd {
      position: absolute;
      left: 0;
      top: 219px;
      width: 390px;
      height: 48px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02)),
        #14271c;
      border-top: 3px solid #263b31;
      border-bottom: 3px solid #0c0c0c;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.04),
        inset 0 0 14px rgba(0,0,0,0.35);
      color: #b7ff9e;
      font-family: "Courier New", monospace;
      text-shadow: 0 0 7px rgba(183,255,158,0.35);
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: 1fr 1fr;
      align-items: center;
      padding: 5px 16px;
      pointer-events: none;
    }

    #lcdMessage {
      grid-column: 1 / 3;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #lcdScore {
      font-size: 12px;
    }

    #lcdBest {
      font-size: 13px;
      text-align: right;
    }

    #controls {
      position: absolute;
      left: 0;
      top: 267px;
      width: 390px;
      height: 400px;
      background: linear-gradient(180deg, #303030, #181818);
      touch-action: auto;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    #controls *,
    #screen,
    #gameCanvas {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* D-PAD */

    #dpad {
      position: absolute;
      left: 17px;
      top: 19px;
      width: 150px;
      height: 150px;
      touch-action: manipulation;
    }

    .dpadBtn {
      position: absolute;
      width: 50px;
      height: 50px;
      border: none;
      background: #111;
      color: rgba(255,255,255,0.86);
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 22px;
      line-height: 50px;
      text-align: center;
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.08),
        0 7px 13px rgba(0,0,0,0.45);
    }

    .dpadBtn.pressed,
    .dpadBtn:active {
      filter: brightness(1.35);
      transform: scale(0.94);
    }

    #dpadUp { left: 50px; top: 0; border-radius: 10px 10px 3px 3px; }
    #dpadLeft { left: 0; top: 50px; border-radius: 10px 3px 3px 10px; }
    #dpadCenter { left: 50px; top: 50px; border-radius: 4px; pointer-events: none; }
    #dpadRight { left: 100px; top: 50px; border-radius: 3px 10px 10px 3px; }
    #dpadDown { left: 50px; top: 100px; border-radius: 3px 3px 10px 10px; }

    /* FACE BUTTONS */

    #controls,
    #controls * {
      touch-action: none !important;
      user-select: none !important;
      -webkit-user-select: none !important;
      -webkit-touch-callout: none !important;
      -webkit-user-drag: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }

    #faceButtons {
      position: absolute;
      right: 8px;
      top: 14px;
      width: 170px;
      height: 218px;
      touch-action: none;
    }

    .faceBtn {
      position: absolute;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 20px;
      font-weight: bold;
      background: radial-gradient(circle at 30% 30%, #ff82ad, #9d003d);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.15),
        0 10px 18px rgba(0,0,0,0.45);
      touch-action: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
    }

    .faceBtn.pressed,
    .faceBtn:active {
      transform: scale(0.92);
      filter: brightness(1.2);
    }

    #buttonY { left: 0; top: 0; }

    /* DASH sits on the right; JUMP is the lower centered face button. */
    #buttonB {
      left: 75px;
      top: 20px;
    }

    #buttonA {
      left: 31px;
      top: 88px;
    }

    /* USE occupies the exact 112×112 footprint of the removed right joystick. */
    #buttonX {
      left: 29px;
      top: 174px;
      width: 112px;
      height: 112px;
      border-radius: 18px;
      background: radial-gradient(circle at 35% 25%, #fff4a3, #e2ad08 72%, #9b6c00);
      color: #302300;
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.34),
        0 10px 18px rgba(0,0,0,0.45);
    }

    #buttonX,
    #buttonA,
    #buttonB {
      font-size: 12px;
      line-height: 1;
      padding: 0 3px;
      letter-spacing: -0.2px;
    }

    #buttonX {
      font-size: 15px;
      letter-spacing: 0.2px;
    }

    #controls .faceBtn,
    #controls .systemBtn {
      touch-action: manipulation !important;
    }

    #controls .joystickPad,
    #controls .dpadBtn {
      touch-action: none !important;
    }

    /* JOYSTICKS */

    .joystickPad {
      position: absolute;
      width: 112px;
      height: 112px;
      border-radius: 18px;
      background: rgba(255,255,255,0.035);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.07);
      touch-action: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    #leftJoystickPad {
      left: 36px;
      top: 188px;
    }

    #rightJoystickPad {
      right: 37px;
      top: 188px;
    }

    .joystickBase {
      position: absolute;
      left: 11px;
      top: 11px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, #3f3f3f, #161616);
      box-shadow:
        inset 0 0 0 3px rgba(255,255,255,0.08),
        0 9px 18px rgba(0,0,0,0.45);
      pointer-events: none;
    }

    .joystickKnob {
      position: absolute;
      left: 56px;
      top: 56px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #777, #202020);
      transform: translate(-50%, -50%);
      box-shadow: 0 8px 18px rgba(0,0,0,0.55);
      pointer-events: none;
    }

    /* START / SELECT */

    #systemButtons {
      position: absolute;
      left: 50%;
      top: 326px;
      width: 164px;
      height: 34px;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-direction: row-reverse;
      touch-action: none;
    }

    .systemBtn {
      width: 76px;
      height: 32px;
      touch-action: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      border-radius: 999px;
      border: none;
      background: #101010;
      color: rgba(255,255,255,0.78);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.12);
    }

    .systemBtn.pressed,
    .systemBtn:active {
      transform: scale(0.96);
      filter: brightness(1.2);
    }

    #faceButtons.singleFace .faceBtn.singleAction {
      width: 76px;
      height: 76px;
      left: 37px !important;
      top: 37px !important;
      border-radius: 22px;
      padding: 0 8px;
      font-size: 14px;
      line-height: 1.05;
      white-space: normal;
    }

    #systemButtons.singleSystem {
      width: 92px;
    }

    #systemButtons.singleSystem .systemBtn {
      width: 92px;
    }

    /* =========================
       EXPANDABLE SHELL MENU
       ========================= */

    #shellMenu {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 60;
      background: rgba(0,0,0,0.62);
      padding: 22px 14px;
      color: white;
    }

    #shellMenu.open {
      display: block;
    }

    #shellMenuPanel {
      width: 100%;
      max-height: 100%;
      overflow: hidden;
      background: #101827;
      border: 3px solid white;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.45);
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    #shellMenuHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 12px 7px;
    }

    #shellMenuHeader h2 {
      margin: 0;
      font-size: 22px;
    }

    #shellMenuCloseBtn {
      width: 40px;
      height: 36px;
      padding: 0;
      border-radius: 12px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 26px;
      font-weight: bold;
      line-height: 1;
    }

    #shellMenuTabs {
      display: flex;
      gap: 7px;
      padding: 0 12px 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .shellMenuTab {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 7px 11px;
      border-radius: 999px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
    }

    .shellMenuTab.active {
      background: #ffe08a;
    }

    #shellMenuBody {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 14px 14px;
      text-align: left;
      font-size: 15px;
      line-height: 1.38;
      touch-action: pan-y;
    }

    .pauseMenuActions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
      margin-top: 12px;
    }

    .pauseActionBtn {
      min-height: 42px;
      border-radius: 12px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
    }

    .pauseActionBtn.saveExit {
      background: #dff3ff;
    }

    .pauseActionBtn.noSaveExit {
      background: #ffd6d6;
    }

    .pauseActionBtn.resumeGame {
      background: #fff3bf;
    }

    #shellMenuBody h3 {
      margin: 4px 0 8px;
      font-size: 20px;
    }

    #shellMenuBody ul {
      margin-top: 8px;
      padding-left: 21px;
    }

    #shellMenuBody code {
      background: rgba(255,255,255,0.12);
      padding: 2px 5px;
      border-radius: 6px;
    }

  </style>
</head>

<body>
  <main id="appFrame">
    <section id="appStage">
      <div id="menuScreen">
        <h1>Choose Player</h1>

        <div id="leaderboardBox">
          <h2>Leaderboard</h2>
          <ol id="leaderboardList"></ol>
        </div>

        <div id="playerPickerBox">
          <input id="playerSearchInput" placeholder="Search players..." autocomplete="off" />
          <div id="playerSelect" role="listbox" aria-label="Choose player"></div>

          <div id="selectedPlayerActions">
            <button id="resetSelectedPlayerBtn">Reset</button>
            <button id="removeSelectedPlayerBtn">Remove</button>
          </div>
        </div>

        <div id="addPlayerRow">
          <input id="newPlayerName" placeholder="New player name" />
          <button id="addPlayerBtn">Add Player</button>
        </div>

        <p id="selectedPlayerText">No player selected</p>
        <button id="startGameBtn">Start Game</button>
      </div>

      <div id="gameScreen">
        <div id="screen">
          <canvas id="gameCanvas" width="390" height="219"></canvas>

          <div id="gameOverBox">
            <h1>Game Over</h1>
            <p id="gameOverScore"></p>
            <button id="playAgainBtn">Play Again</button>
            <button id="backToMenuBtn">Player Menu</button>
          </div>
        </div>

        <div id="lcd">
          <div id="lcdMessage">TONAL TUNNELS — PLATFORMING</div>
          <div id="lcdScore">SCORE: <span id="score">0</span></div>
          <div id="lcdBest">BEST: <span id="bestScore">0</span></div>
        </div>

        <div id="controls">
          <div id="dpad">
            <button id="dpadUp" class="dpadBtn" data-action="up">▲</button>
            <button id="dpadLeft" class="dpadBtn" data-action="left">◄</button>
            <button id="dpadCenter" class="dpadBtn"></button>
            <button id="dpadRight" class="dpadBtn" data-action="right">►</button>
            <button id="dpadDown" class="dpadBtn" data-action="down">▼</button>
          </div>

          <div id="faceButtons">
            <button id="buttonX" class="faceBtn" data-action="x">X</button>
            <button id="buttonY" class="faceBtn" data-action="y">Y</button>
            <button id="buttonA" class="faceBtn" data-action="a">A</button>
            <button id="buttonB" class="faceBtn" data-action="b">B</button>
          </div>

          <div id="leftJoystickPad" class="joystickPad" data-stick="left">
            <div class="joystickBase"></div>
            <div id="leftJoystickKnob" class="joystickKnob"></div>
          </div>

          <div id="rightJoystickPad" class="joystickPad" data-stick="right">
            <div class="joystickBase"></div>
            <div id="rightJoystickKnob" class="joystickKnob"></div>
          </div>

          <div id="systemButtons">
            <button id="selectButton" class="systemBtn" data-action="select">SELECT</button>
            <button id="startButton" class="systemBtn" data-action="start">START</button>
          </div>
        </div>
      </div>

      <div id="shellMenu" aria-hidden="true">
        <div id="shellMenuPanel" role="dialog" aria-modal="true" aria-label="Pause panel">
          <div id="shellMenuHeader">
            <h2>Pause</h2>
            <button id="shellMenuCloseBtn" type="button" aria-label="Close panel">×</button>
          </div>
          <div id="shellMenuTabs" role="tablist" aria-label="Pause panel tabs"></div>
          <div id="shellMenuBody"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const DESIGN_WIDTH = 390;
    const DESIGN_HEIGHT = 670;
    const GAME_CANVAS_LOGICAL_WIDTH = 390;
    const GAME_CANVAS_LOGICAL_HEIGHT = 219;
    const MAX_GAME_CANVAS_PIXEL_SCALE = 4;

    /*
      Change STORAGE_KEY for each separate arcade game if you want each game
      to keep its own local player list/leaderboard.
      Example: "meloMemoPlayers_v1", "staffSurvivorPlayers_v1", etc.
    */
    const STORAGE_KEY = "treasureTunnelsMobilePlayers_v1";
    const STORAGE_MESSAGE_SOURCE = "PianoArcadeShell";
    const WIX_STORAGE_MESSAGE_SOURCE = "PianoArcadeWixStorage";
    const SCORE_LABEL = "Score";
    const FIRST_TIME_HELP_DEFAULT_VERSION = "howToPlay_v2";
    let firstTimeHelpVersion = FIRST_TIME_HELP_DEFAULT_VERSION;

    const appFrame = document.getElementById("appFrame");
    const appStage = document.getElementById("appStage");

    const menuScreen = document.getElementById("menuScreen");
    const gameScreen = document.getElementById("gameScreen");

    const leaderboardList = document.getElementById("leaderboardList");
    const playerSearchInput = document.getElementById("playerSearchInput");
    const playerSelect = document.getElementById("playerSelect");
    playerSelect.addEventListener("touchmove", event => event.stopPropagation(), { passive: true });
    const resetSelectedPlayerBtn = document.getElementById("resetSelectedPlayerBtn");
    const removeSelectedPlayerBtn = document.getElementById("removeSelectedPlayerBtn");
    const newPlayerName = document.getElementById("newPlayerName");
    const addPlayerBtn = document.getElementById("addPlayerBtn");
    const startGameBtn = document.getElementById("startGameBtn");
    const selectedPlayerText = document.getElementById("selectedPlayerText");

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    let gameCanvasPixelScale = 1;

    function scaleGameCanvasBackingStore() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const stageScale = Math.max(1, appScale || 1);
      const targetScale = Math.min(MAX_GAME_CANVAS_PIXEL_SCALE, dpr * stageScale);
      const targetWidth = Math.max(1, Math.round(GAME_CANVAS_LOGICAL_WIDTH * targetScale));
      const targetHeight = Math.max(1, Math.round(GAME_CANVAS_LOGICAL_HEIGHT * targetScale));

      if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
        canvas.width = targetWidth;
        canvas.height = targetHeight;
      }

      canvas.style.width = GAME_CANVAS_LOGICAL_WIDTH + "px";

    function cleanPlayers(rawPlayers) {
      const cleaned = {};

      Object.entries(rawPlayers || {}).forEach(([name, data]) => {
        const cleanName = String(name || "").trim();
        if (!cleanName) return;

        const isObjectData = data && typeof data === "object" && !Array.isArray(data);
        const best = isObjectData
          ? Number(data.best || 0)
          : Number(data || 0);

        cleaned[cleanName] = {
          ...(isObjectData ? data : {}),
          best: Math.max(0, Math.floor(best || 0))
        };
      });

      return cleaned;

    function normalizeSavedData(savedData) {
      /*
        Supports both:
        1. New format: { v: 1, selectedPlayer: "Chris", players: { ... } }
        2. Old format: { "Chris": { best: 100, lastScore: 80 }, ... }
        Either way, this template stores only each player's best score.
      */
      if (!savedData || typeof savedData !== "object") {
        return { players: {}, selectedPlayer: null };
      }

      if (
        savedData.players &&
        typeof savedData.players === "object" &&
        !Array.isArray(savedData.players)
      ) {
        return {
          players: cleanPlayers(savedData.players),
          selectedPlayer: savedData.selectedPlayer || null
        };
      }

      return {
        players: cleanPlayers(savedData),
        selectedPlayer: null
      };
    }

    function applySavedData(savedData) {
      const normalized = normalizeSavedData(savedData);

      players = normalized.players || {};
      selectedPlayer = normalized.selectedPlayer || selectedPlayer || null;

      if (selectedPlayer && !players[selectedPlayer]) {
        selectedPlayer = null;
      }

      renderPlayers();
      renderLeaderboard();

        players = {};
        selectedPlayer = null;

        renderLeaderboard();
      }

    function sendStorageMessageToWix(type, payload = {}) {
      if (!window.parent || window.parent === window) {
        return false;
      }

      window.parent.postMessage({
        source: STORAGE_MESSAGE_SOURCE,
        type,
        storageKey: STORAGE_KEY,
        ...payload
      }, "*");

      return true;
    }

    function loadPlayers() {
      wixStorageAnswered = false;
      const askedWixParent = sendStorageMessageToWix("ARCADE_STORAGE_LOAD");

      /*
        In Wix on iPhone Safari, the parent page should answer and provide
        Wix/Velo local storage. Outside Wix, or if the Velo bridge is not added,
        this fallback keeps the old desktop/localStorage behavior working.
      */
      if (askedWixParent) {
        setTimeout(() => {
          if (!wixStorageAnswered) {
            loadPlayersFromLocalStorage();
          }
        }, 600);
      } else {
        loadPlayersFromLocalStorage();
      }
    }

    function savePlayers() {
      const payload = getSavePayload();

      /*
        Keep the original browser localStorage path for desktop/non-Wix tests.
        On iPhone Safari inside Wix, this may not persist, so we also send
        the same payload to the Wix parent page.
      */
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (err) {}

      sendStorageMessageToWix("ARCADE_STORAGE_SAVE", { payload });

      if (data.type === "ARCADE_STORAGE_DATA") {

    function joystickPointFromClient(clientX, clientY, stick) {
      const rect = stick.pad.getBoundingClientRect();
      return {
        x: (clientX - rect.left) / appScale,
        y: (clientY - rect.top) / appScale
      };
    }

    function setJoystickFromClient(clientX, clientY, stick) {
      const point = joystickPointFromClient(clientX, clientY, stick);
      const centerX = stick.pad.offsetWidth / 2;
      const centerY = stick.pad.offsetHeight / 2;
      const rawDx = point.x - centerX;
      const rawDy = point.y - centerY;
      const magnitude = Math.hypot(rawDx, rawDy);
      const scale = magnitude > stick.maxDistance ? stick.maxDistance / magnitude : 1;
      const dx = rawDx * scale;
      const dy = rawDy * scale;

      stick.x = dx / stick.maxDistance;
      stick.y = dy / stick.maxDistance;
      stick.knob.style.left = `${centerX + dx}px`;
      stick.knob.style.top = `${centerY + dy}px`;
    }

    function resetJoystick(stick) {
      stick.active = false;
      stick.pointerId = null;
      stick.touchId = null;
      stick.x = 0;
      stick.y = 0;
      stick.knob.style.left = `${stick.pad.offsetWidth / 2}px`;
      stick.knob.style.top = `${stick.pad.offsetHeight / 2}px`;
    }

    const ttActiveControlPointers = new Set();

    function hardResetMobileHeldInputs() {
      ttActiveControlPointers.clear();
      resetJoystick(sticks.left);
      resetJoystick(sticks.right);
      document.querySelectorAll("button[data-action]").forEach(button => {
        button.dataset.pointerId = "";
        button.dataset.touchId = "";
        button.classList.remove("pressed");
      });
      if (typeof gameInputRelease === "function") {
        ["left", "right", "up", "down", "a", "b", "x", "y", "select", "start"].forEach(gameInputRelease);
      }
    }

    function bindJoystick(stick) {
      stick.pad.addEventListener("pointerdown", event => {
        if (event.pointerType === "mouse" && event.button !== 0) return;
        event.preventDefault();
        if (stick.active) return;
        stick.active = true;
        stick.pointerId = event.pointerId;
        ttActiveControlPointers.add(event.pointerId);

        if (!stick.active || event.pointerId !== stick.pointerId) return;
        event.preventDefault();
        ttActiveControlPointers.delete(event.pointerId);

  function ttTrackAudioSource(source) {
    if (!source) return source;
    ttActiveAudioSources.add(source);

      if (!force && (!running || ttMapOpen || shellOpen)) return;

  function beep(freq, duration, type = "sine", volume = 0.08, endFreq = null) {
    const ac = getAudio();
    if (!ac) return null;
    const osc = ttTrackAudioSource(ac.createOscillator());
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(20, freq), ac.currentTime);
    if (Number.isFinite(endFreq)) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), ac.currentTime + duration);
    }
    gain.gain.setValueAtTime(Math.max(0.0001, volume), ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.start();
    osc.stop(ac.currentTime + duration);
    return osc;
  }

  function ttNoiseBurst(duration = 0.1, volume = 0.04, filterFrequency = 900, filterType = "lowpass") {
    const ac = getAudio();
    if (!ac) return null;
    const frameCount = Math.max(1, Math.floor(ac.sampleRate * duration));
    const buffer = ac.createBuffer(1, frameCount, ac.sampleRate);
    const channel = buffer.getChannelData(0);
    for (let index = 0; index < frameCount; index++) {
      const decay = 1 - index / frameCount;
      channel[index] = (Math.random() * 2 - 1) * decay;
    }
    const source = ttTrackAudioSource(ac.createBufferSource());
    const filter = ac.createBiquadFilter();
    const gain = ac.createGain();
    source.buffer = buffer;
    filter.type = filterType;
    filter.frequency.value = filterFrequency;
    gain.gain.setValueAtTime(volume, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
    source.connect(filter);
    filter.connect(gain);
    gain.connect(ac.destination);
    source.start();
    source.stop(ac.currentTime + duration);
    return source;
  }

  function ttClamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function ttRand(min, max) {
    return min + Math.random() * (max - min);
  }

  function ttRandInt(min, max) {
    return Math.floor(ttRand(min, max + 1));
  }

  function ttChance(probability) {
    return Math.random() < probability;
  }

  function ttShuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }


  const TT_LETTER_NAMES = ["C", "D", "E", "F", "G", "A", "B"];
  const TT_ALLOWED_ACCIDENTALS = {
    C: ["", "♯"],
    D: ["", "♯", "♭"],
    E: ["", "♭"],
    F: ["", "♯"],
    G: ["", "♯", "♭"],
    A: ["", "♯", "♭"],
    B: ["", "♭"]
  };
  const TT_TARGET_PITCH_CLASSES = TT_LETTER_NAMES.flatMap(letter =>
    TT_ALLOWED_ACCIDENTALS[letter].map(accidental => ({
      letter,
      accidental,
      label: `${letter}${accidental}`
    }))
  );

  function ttDiatonicToPitch(diatonicIndex) {
    const octave = Math.floor(diatonicIndex / 7);
    const letterIndex = ((diatonicIndex % 7) + 7) % 7;
    return { letter: TT_LETTER_NAMES[letterIndex], octave };
  }

  function ttChooseRoomTarget() {
    const candidates = TT_TARGET_PITCH_CLASSES.filter(candidate => candidate.label !== ttRoomTarget.label);
    ttRoomTarget = { ...candidates[ttRandInt(0, candidates.length - 1)] };
  }

  function ttAllReadablePitchPositions() {
    const positions = [];
    for (const clef of ["treble", "bass"]) {
      const bottomLineDiatonic = clef === "treble" ? 4 * 7 + 2 : 2 * 7 + 4;
      for (let staffStep = -2; staffStep <= 12; staffStep++) {
        const pitch = ttDiatonicToPitch(bottomLineDiatonic + staffStep);
        positions.push({ clef, staffStep, letter: pitch.letter, octave: pitch.octave });
      }
    }
    return positions;
  }

  const TT_READABLE_PITCH_POSITIONS = ttAllReadablePitchPositions();

  function ttCreateCrystalPitch(shouldMatchTarget) {
    let positionPool = TT_READABLE_PITCH_POSITIONS;
    if (shouldMatchTarget) {
      positionPool = positionPool.filter(position => position.letter === ttRoomTarget.letter);
    }

    for (let attempt = 0; attempt < 80; attempt++) {
      const position = positionPool[ttRandInt(0, positionPool.length - 1)];
      let accidental = shouldMatchTarget
        ? ttRoomTarget.accidental
        : TT_ALLOWED_ACCIDENTALS[position.letter][ttRandInt(0, TT_ALLOWED_ACCIDENTALS[position.letter].length - 1)];
      const label = `${position.letter}${accidental}`;
      if (!shouldMatchTarget && label === ttRoomTarget.label) continue;
      return {
        ...position,
        accidental,
        label,
        name: `${position.letter}${accidental}${position.octave}`
      };
    }

    const fallback = TT_READABLE_PITCH_POSITIONS.find(position => position.letter !== ttRoomTarget.letter)
      || TT_READABLE_PITCH_POSITIONS[0];
    return {
      ...fallback,
      accidental: "",
      label: fallback.letter,
      name: `${fallback.letter}${fallback.octave}`
    };
  }

  function ttCrystalBoxAt(x, y) {
    return { x, y, w: TT_CRYSTAL_WIDTH, h: TT_CRYSTAL_HEIGHT };
  }

  function ttExpandedBox(box, margin) {
    return {
      x: box.x - margin,
      y: box.y - margin,
      w: box.w + margin * 2,
      h: box.h + margin * 2
    };
  }

  function ttCrystalPlacementIsClear(box) {
    const padded = ttExpandedBox(box, TT_IS_MOBILE ? 8 : 13);

    if (ttEntranceDoor && ttIntersects(padded, ttExpandedBox(ttEntranceDoor, TT_IS_MOBILE ? 14 : 24))) return false;
    if (ttExitDoor && ttIntersects(padded, ttExpandedBox(ttExitDoor, TT_IS_MOBILE ? 14 : 24))) return false;

    for (const spike of ttSpikes) {
      if (ttIntersects(padded, ttExpandedBox(spike, TT_IS_MOBILE ? 10 : 17))) return false;
    }

    // Aerial crystals must remain in genuine open space rather than clipping
    // into tunnel walls, ceilings, hatches, or crumbling bridges.
    for (const solid of ttSolids) {
      if (ttIntersects(box, solid)) return false;
    }
    for (const platform of ttOneWays) {
      if (ttIntersects(box, platform)) return false;
    }
    for (const platform of ttCrumblePlatforms) {
      if (ttIntersects(box, platform)) return false;
    }

    for (const crystal of ttCrystals) {
      if (ttIntersects(padded, ttExpandedBox(crystal, TT_IS_MOBILE ? 16 : 26))) return false;
    }

    return true;
  }

  function ttTryPlaceCrystalOnNode(nodeId, floorSegments) {
    const segments = floorSegments
      .filter(segment => segment.w >= TT_CRYSTAL_WIDTH + TT_CRYSTAL_EDGE_MARGIN * 2)
      .sort((a, b) => b.w - a.w);
    if (!segments.length) return false;

    // Prefer a broad stable floor, but vary among the strongest candidates.
    const choicePool = segments.slice(0, Math.min(3, segments.length));
    for (let attempt = 0; attempt < 18; attempt++) {
      const platform = choicePool[ttRandInt(0, choicePool.length - 1)];
      const minX = platform.x + TT_CRYSTAL_EDGE_MARGIN;
      const maxX = platform.x + platform.w - TT_CRYSTAL_EDGE_MARGIN - TT_CRYSTAL_WIDTH;
      if (maxX < minX) continue;

      const x = ttRand(minX, maxX);
      // Most crystals now ask for a jump. The lift remains comfortably inside
      // the controller's normal jump envelope and does not require a dash.
      const aerial = ttChance(TT_CRYSTAL_AIR_CHANCE);
      const airLift = aerial ? ttRand(TT_CRYSTAL_AIR_LIFT_MIN, TT_CRYSTAL_AIR_LIFT_MAX) : 0;
      const y = platform.y - TT_CRYSTAL_HEIGHT - TT_CRYSTAL_FLOOR_GAP - airLift;
      const box = ttCrystalBoxAt(x, y);
      if (!ttCrystalPlacementIsClear(box)) continue;

      ttCrystals.push({
        ...box,
        nodeId,
        platformId: platform.id,
        aerial,
        pitch: null,
        correct: false,
        revealed: false,
        phase: ttRand(0, Math.PI * 2),
        collected: false
      });
      return true;
    }
    return false;
  }

  function ttPopulateCrystals() {
    ttCrystals = [];
    ttCrystalBursts = [];

    const floorSegmentsByNode = new Map();
    for (const solid of ttSolids) {
      if (!solid.floor || !Number.isInteger(solid.nodeId)) continue;
      if (!floorSegmentsByNode.has(solid.nodeId)) floorSegmentsByNode.set(solid.nodeId, []);
      floorSegmentsByNode.get(solid.nodeId).push(solid);
    }

    const nodeIdsByRow = Array.from({ length: TT_MAZE_ROWS }, () => []);
    for (const nodeId of floorSegmentsByNode.keys()) {
      nodeIdsByRow[Math.floor(nodeId / TT_MAZE_COLS)].push(nodeId);
    }
    nodeIdsByRow.forEach(ttShuffle);

    // Round-robin through floor bands so crystals populate the whole cave rather
    // than clustering near whichever chambers happened to be generated first.
    let madeProgress = true;
    while (ttCrystals.length < TT_CRYSTAL_TARGET_COUNT && madeProgress) {
      madeProgress = false;
      const rowOrder = ttShuffle(Array.from({ length: TT_MAZE_ROWS }, (_, index) => index));
      for (const row of rowOrder) {
        const nodeId = nodeIdsByRow[row].pop();
        if (nodeId === undefined) continue;
        madeProgress = true;
        ttTryPlaceCrystalOnNode(nodeId, floorSegmentsByNode.get(nodeId));
        if (ttCrystals.length >= TT_CRYSTAL_TARGET_COUNT) break;
      }
    }
  }

  function ttAssignCrystalPitches() {
    const correctCount = Math.max(5, Math.round(ttCrystals.length * TT_TARGET_CORRECT_RATIO));
    const correctIds = new Set();
    const crystalsByRow = Array.from({ length: TT_MAZE_ROWS }, () => []);
    for (let index = 0; index < ttCrystals.length; index++) {
      const row = Number.isInteger(ttCrystals[index].nodeId)
        ? Math.floor(ttCrystals[index].nodeId / TT_MAZE_COLS)
        : 0;
      crystalsByRow[ttClamp(row, 0, TT_MAZE_ROWS - 1)].push(index);
    }
    crystalsByRow.forEach(ttShuffle);

    while (correctIds.size < Math.min(correctCount, ttCrystals.length)) {
      let progressed = false;
      for (const row of ttShuffle(Array.from({ length: TT_MAZE_ROWS }, (_, i) => i))) {
        const index = crystalsByRow[row].pop();
        if (index === undefined) continue;
        correctIds.add(index);
        progressed = true;
        if (correctIds.size >= correctCount) break;
      }
      if (!progressed) break;
    }

    ttCrystals.forEach((crystal, index) => {
      crystal.correct = correctIds.has(index);
      crystal.pitch = ttCreateCrystalPitch(crystal.correct);
      crystal.revealed = false;
      crystal.collected = false;
    });
  }

  function ttStartRoomIntro() {
    ttRoomIntroPhase = "show";

  function ttUpdateRoomIntro(dt) {
    if (ttRoomIntroPhase === "active") return false;
    ttRoomIntroTimer += dt;
    ttPlayer.vx = 0;
    ttPlayer.vy = 0;
    ttInput.jumpQueued = false;
    ttInput.dashQueued = false;
    ttInput.interactQueued = false;
    ttInput.dropQueued = false;

    if (ttRoomIntroPhase === "show") {
      const cue = ttGetReadySetGoCue();
      const nextCueStamp = cue ? cue.label : "";
      if (nextCueStamp !== ttIntroCueStamp) {
        ttIntroCueStamp = nextCueStamp;
        ttUpdateRoomLabel();
      }
    }

    if (ttRoomIntroPhase === "show" && ttRoomIntroTimer >= TT_TARGET_SHOW_DURATION) {
      ttRoomIntroPhase = "flight";
      ttRoomIntroTimer = 0;
      ttEmitTargetShatterFeedback();
      ttUpdateRoomLabel();
    } else if (ttRoomIntroPhase === "flight" && ttRoomIntroTimer >= TT_TARGET_FLIGHT_DURATION) {
      ttRoomIntroPhase = "active";
      ttRoomIntroTimer = 0;
      for (const crystal of ttCrystals) crystal.revealed = true;
      ttEmitCrystalFormFeedback();
      ttUpdateRoomLabel();
    }
    return true;
  }

  function ttCrystalIsInInteractionRange(crystal) {
    if (!crystal || crystal.collected || !crystal.revealed || ttRoomIntroPhase !== "active") return false;
    return ttIntersects(ttPlayer, ttExpandedBox(crystal, TT_CRYSTAL_INTERACT_MARGIN));
  }

  function ttFindNearestInteractiveCrystal() {
    const playerCenterX = ttPlayer.x + ttPlayer.w / 2;
    const playerCenterY = ttPlayer.y + ttPlayer.h / 2;
    let nearest = null;
    let nearestDistance = Infinity;

    for (const crystal of ttCrystals) {
      if (!ttCrystalIsInInteractionRange(crystal)) continue;
      const dx = crystal.x + crystal.w / 2 - playerCenterX;
      const dy = crystal.y + crystal.h / 2 - playerCenterY;
      const distance = dx * dx + dy * dy;
      if (distance < nearestDistance) {
        nearest = crystal;
        nearestDistance = distance;
      }
    }
    return nearest;
  }

  function ttPickWeightedPowerupType() {
    const pool = [
      "fermata", "metronome", "rest8", "restQ", "restH", "restW",
      "slur", "accent", "trill", "repeat", "treble", "bass", "rit"
    ];
    return pool[ttRandInt(0, pool.length - 1)];
  }

  function ttPowerupPlacementIsClear(x, y, w, h) {
    const box = { x, y, w, h };
    for (const door of [ttEntranceDoor, ttExitDoor]) {
      if (door && ttIntersects(box, ttExpandedBox(door, TT_IS_MOBILE ? 22 : 34))) return false;
    }
    for (const crystal of ttCrystals) {
      if (ttIntersects(box, ttExpandedBox(crystal, TT_IS_MOBILE ? 8 : 12))) return false;
    }
    for (const powerUp of ttPowerUps) {
      if (ttIntersects(box, ttExpandedBox(powerUp, TT_IS_MOBILE ? 10 : 14))) return false;
    }
    for (const spike of ttSpikes) {
      if (ttIntersects(box, ttExpandedBox(spike, TT_IS_MOBILE ? 8 : 12))) return false;
    }
    return true;
  }

  function ttPlaceSpecificPowerUp(type, preferredSegments = null) {
    const floorSegments = preferredSegments || ttSolids.filter(solid => solid.floor && solid.w >= TT_POWERUP_SIZE + (TT_IS_MOBILE ? 14 : 22));
    if (!floorSegments.length) return false;
    for (let attempt = 0; attempt < 80; attempt++) {
      const segment = floorSegments[ttRandInt(0, floorSegments.length - 1)];
      const margin = TT_IS_MOBILE ? 5 : 8;
      if (segment.w <= TT_POWERUP_SIZE + margin * 2) continue;
      const x = ttRand(segment.x + margin, segment.x + segment.w - TT_POWERUP_SIZE - margin);
      const airLift = ttChance(0.46) ? ttRand(TT_IS_MOBILE ? 14 : 20, TT_IS_MOBILE ? 52 : 82) : 0;
      const y = segment.y - TT_POWERUP_SIZE - (TT_IS_MOBILE ? 3 : 5) - airLift;
      if (!ttPowerupPlacementIsClear(x, y, TT_POWERUP_SIZE, TT_POWERUP_SIZE)) continue;
      ttPowerUps.push({ type, x, y, w: TT_POWERUP_SIZE, h: TT_POWERUP_SIZE, phase: ttRand(0, Math.PI * 2), collected: false });
      return true;
    }
    return false;
  }

  function ttPopulatePowerUps() {
    ttPowerUps = [];
    const floorSegments = ttSolids.filter(solid => solid.floor && solid.w >= TT_POWERUP_SIZE + (TT_IS_MOBILE ? 14 : 22));
    if (!floorSegments.length) return;
    ttPlaceSpecificPowerUp("crescendo", floorSegments);
    ttPlaceSpecificPowerUp("decrescendo", floorSegments);
    ttPlaceSpecificPowerUp("quill", floorSegments);
    const desiredCount = ttRandInt(TT_POWERUP_COUNT_MIN, TT_POWERUP_COUNT_MAX);
    const attempts = desiredCount * 45;
    let spawned = ttPowerUps.length;
    for (let attempt = 0; attempt < attempts && spawned < desiredCount; attempt++) {
      if (ttPlaceSpecificPowerUp(ttPickWeightedPowerupType(), floorSegments)) spawned++;
    }
  }

  function ttPowerUpIsInInteractionRange(powerUp) {
    if (!powerUp || powerUp.collected || ttRoomIntroPhase !== "active") return false;
    return ttIntersects(ttPlayer, ttExpandedBox(powerUp, TT_POWERUP_INTERACT_MARGIN));
  }

  function ttFindNearestInteractivePowerUp() {
    const playerCenterX = ttPlayer.x + ttPlayer.w / 2;
    const playerCenterY = ttPlayer.y + ttPlayer.h / 2;
    let nearest = null;
    let nearestDistance = Infinity;
    for (const powerUp of ttPowerUps) {
      if (!ttPowerUpIsInInteractionRange(powerUp)) continue;
      const dx = powerUp.x + powerUp.w / 2 - playerCenterX;
      const dy = powerUp.y + powerUp.h / 2 - playerCenterY;
      const distance = dx * dx + dy * dy;
      if (distance < nearestDistance) {
        nearest = powerUp;
        nearestDistance = distance;
      }
    }
    return nearest;
  }

  function ttAddRoomTime(amount) {
    ttRoomTimeRemaining = Math.min(ttRoomTimeLimit, ttRoomTimeRemaining + amount);
    ttTimerDisplayStamp = "";
    ttUpdateRoomLabel();

  function ttFinishTrillEarthquake() {
    const crystals = ttTrillPendingCrystals.filter(crystal => crystal && !crystal.collected && !crystal.correct);
    ttTrillPendingCrystals = [];
    for (const crystal of crystals) {
      crystal.collected = true;
      const centerX = crystal.x + crystal.w / 2;
      const centerY = crystal.y + crystal.h / 2;
      ttCrystalBursts.push({ x: centerX, y: centerY, timer: 0, duration: TT_CRYSTAL_COLLECT_DURATION, phase: crystal.phase, correct: false });
      ttSpawnCrystalParticles(centerX, centerY, false);
    }
    if (crystals.length) {
      soundShatterWrong();
      ttTriggerScreenFlash("255, 171, 216", 0.16, 0.18);
      ttSetFeedback(`TRILL • SHATTERED ${crystals.length}`, true);
    } else {
      ttSetFeedback("TRILL • NO WRONG CRYSTALS", true);
    }
  }

  function ttTriggerTrill() {
    const wrongCrystals = ttCrystals.filter(crystal => crystal.revealed && !crystal.collected && !crystal.correct);
    if (!wrongCrystals.length) {
      ttSetFeedback("TRILL • NO WRONG CRYSTALS", true);
      return;
    }
    ttShuffle(wrongCrystals);
    const amount = Math.max(1, Math.min(wrongCrystals.length, ttRandInt(2, Math.max(2, Math.ceil(wrongCrystals.length * 0.45)))));
    ttTrillPendingCrystals = wrongCrystals.slice(0, amount);
    ttTrillEarthquakeTime = TT_TRILL_EARTHQUAKE_DURATION;
    ttSetFeedback("TRILL • EARTHQUAKE", true);
  }

  function ttPowerupStatusString() {
    const parts = [];
    if (ttFermataTime > 0) parts.push(`FERMATA ${ttFermataTime.toFixed(1)}s`);
    if (ttMetronomeTime > 0) parts.push(`METRO ${ttMetronomeTime.toFixed(1)}s`);
    if (ttMapRevealAll) parts.push(`MAP REVEALED`);
    if (ttTrebleFlyTime > 0) parts.push(`TREBLE ${ttTrebleFlyTime.toFixed(1)}s`);
    if (ttRitTime > 0) parts.push(`RIT. ${ttRitTime.toFixed(1)}s`);
    if (ttBassCharges > 0) parts.push(`BASS ×${ttBassCharges}`);
    if (ttCrescendoArmed) parts.push(`CRESC.`);
    if (ttDecrescendoArmed) parts.push(`DECRESC.`);
    return parts.join(" • ");
  }

  function ttUpdatePowerupHudState() {
    ttLastPowerStatus = ttPowerupStatusString();
  }

  function ttAllCellSet() {
    return new Set(Array.from({ length: TT_MAZE_COLS * TT_MAZE_ROWS }, (_, index) => index));
  }

  function ttSelectAccentCrystals(count = 3) {
    const candidates = ttCrystals.filter(crystal => crystal.correct && !crystal.collected && !crystal.accentMarked);
    if (!candidates.length) {
      addScore(1);
      ttSetFeedback("ACCENT • +1 BONUS", true);
      return 0;
    }
    ttShuffle(candidates);
    const chosen = candidates.slice(0, Math.min(count, candidates.length));
    chosen.forEach(crystal => crystal.accentMarked = true);
    ttSetFeedback(`ACCENT • ${chosen.length} GREEN NOTES`, true);
    return chosen.length;
  }

  function ttSplitSolidAroundRect(solid, cut) {
    if (!ttIntersects(solid, cut)) return [solid];
    const pieces = [];
    const leftW = cut.x - solid.x;
    const rightX = cut.x + cut.w;
    const rightW = solid.x + solid.w - rightX;
    const topH = cut.y - solid.y;
    const bottomY = cut.y + cut.h;
    const bottomH = solid.y + solid.h - bottomY;

    if (leftW > 4) pieces.push({ ...solid, w: leftW });
    if (rightW > 4) pieces.push({ ...solid, x: rightX, w: rightW });

    const middleLeft = Math.max(solid.x, cut.x);
    const middleRight = Math.min(solid.x + solid.w, cut.x + cut.w);
    const middleW = middleRight - middleLeft;
    if (middleW > 4 && topH > 4) pieces.push({ ...solid, x: middleLeft, w: middleW, h: topH });
    if (middleW > 4 && bottomH > 4) pieces.push({ ...solid, x: middleLeft, y: bottomY, w: middleW, h: bottomH });
    return pieces;
  }

  function ttRelocationPlacementIsClear(box, ignoreCrystal = null, ignorePowerUp = null) {
    const padded = ttExpandedBox(box, TT_IS_MOBILE ? 7 : 11);
    if (box.x < TT_BOUNDARY || box.y < TT_BOUNDARY || box.x + box.w > TT_WORLD_WIDTH - TT_BOUNDARY || box.y + box.h > TT_WORLD_HEIGHT - TT_BOUNDARY) return false;

    for (const door of [ttEntranceDoor, ttExitDoor]) {
      if (door && ttIntersects(padded, ttExpandedBox(door, TT_IS_MOBILE ? 14 : 22))) return false;
    }
    for (const spike of ttSpikes) {
      if (ttIntersects(padded, ttExpandedBox(spike, TT_IS_MOBILE ? 8 : 13))) return false;
    }
    for (const solid of ttSolids) {
      if (ttIntersects(box, solid)) return false;
    }
    for (const platform of ttOneWays) {
      if (ttIntersects(box, platform)) return false;
    }
    for (const platform of ttCrumblePlatforms) {
      if (ttIntersects(box, platform)) return false;
    }
    for (const crystal of ttCrystals) {
      if (crystal === ignoreCrystal || crystal.collected) continue;
      if (ttIntersects(padded, ttExpandedBox(crystal, TT_IS_MOBILE ? 10 : 16))) return false;
    }
    for (const powerUp of ttPowerUps) {
      if (powerUp === ignorePowerUp || powerUp.collected) continue;
      if (ttIntersects(padded, ttExpandedBox(powerUp, TT_IS_MOBILE ? 8 : 12))) return false;
    }
    return true;
  }

  function ttFindNearbyRelocation(item, kind) {
    const originalX = item.x + item.w / 2;
    const originalY = item.y + item.h / 2;
    const edgeMargin = kind === "crystal" ? TT_CRYSTAL_EDGE_MARGIN : (TT_IS_MOBILE ? 8 : 12);
    const floors = ttSolids
      .filter(solid => solid.floor && solid.w >= item.w + edgeMargin * 2)
      .sort((a, b) => {
        const adx = a.x + a.w / 2 - originalX;
        const ady = a.y - originalY;
        const bdx = b.x + b.w / 2 - originalX;
        const bdy = b.y - originalY;
        return adx * adx + ady * ady - (bdx * bdx + bdy * bdy);
      });

    const nearbyFloors = floors.slice(0, Math.min(24, floors.length));
    for (let attempt = 0; attempt < 160 && nearbyFloors.length; attempt++) {
      const floor = nearbyFloors[attempt % nearbyFloors.length];
      const minX = floor.x + edgeMargin;
      const maxX = floor.x + floor.w - edgeMargin - item.w;
      if (maxX < minX) continue;
      const x = ttRand(minX, maxX);
      let lift = 0;
      if (kind === "crystal") {
        lift = item.aerial ? ttRand(TT_CRYSTAL_AIR_LIFT_MIN, TT_CRYSTAL_AIR_LIFT_MAX) : 0;
      } else if (ttChance(0.42)) {
        lift = ttRand(TT_IS_MOBILE ? 14 : 20, TT_IS_MOBILE ? 52 : 82);
      }
      const floorGap = kind === "crystal" ? TT_CRYSTAL_FLOOR_GAP : (TT_IS_MOBILE ? 3 : 5);
      const y = floor.y - item.h - floorGap - lift;
      const box = { x, y, w: item.w, h: item.h };
      const clear = kind === "crystal"
        ? ttRelocationPlacementIsClear(box, item, null)
        : ttRelocationPlacementIsClear(box, null, item);
      if (!clear) continue;
      return {
        x,
        y,
        floor,
        aerial: lift > 0
      };
    }
    return null;
  }

  function ttRelocateObjectsForNewShaft(openingZone, wallBoxes) {
    const upperItemZone = {
      x: openingZone.x,
      y: openingZone.y - Math.max(TT_CRYSTAL_HEIGHT, TT_POWERUP_SIZE) - (TT_IS_MOBILE ? 8 : 14),
      w: openingZone.w,
      h: Math.max(TT_CRYSTAL_HEIGHT, TT_POWERUP_SIZE) + TT_FLOOR_THICKNESS + (TT_IS_MOBILE ? 16 : 26)
    };
    const touchesNewGeometry = item => {
      const itemBox = ttExpandedBox(item, TT_IS_MOBILE ? 3 : 5);
      return ttIntersects(itemBox, upperItemZone) || wallBoxes.some(wall => ttIntersects(itemBox, ttExpandedBox(wall, TT_IS_MOBILE ? 4 : 7)));
    };

    for (const crystal of ttCrystals) {
      if (crystal.collected || !touchesNewGeometry(crystal)) continue;
      const placement = ttFindNearbyRelocation(crystal, "crystal");
      if (!placement) continue;
      crystal.x = placement.x;
      crystal.y = placement.y;
      crystal.nodeId = Number.isInteger(placement.floor.nodeId) ? placement.floor.nodeId : crystal.nodeId;
      crystal.platformId = placement.floor.id;
      crystal.aerial = placement.aerial;
    }

    for (const powerUp of ttPowerUps) {
      if (powerUp.collected || !touchesNewGeometry(powerUp)) continue;
      const placement = ttFindNearbyRelocation(powerUp, "powerup");
      if (!placement) continue;
      powerUp.x = placement.x;
      powerUp.y = placement.y;
      powerUp.floorId = placement.floor.id;
    }
  }

  function ttCarveSlurShaft(edge) {
    const aCell = ttCellFromIndex(edge.a);
    const bCell = ttCellFromIndex(edge.b);
    const upperIndex = aCell.row < bCell.row ? edge.a : edge.b;
    const lowerIndex = upperIndex === edge.a ? edge.b : edge.a;
    const upperCell = ttCellFromIndex(upperIndex);
    const upperFloors = ttSolids.filter(solid => solid.floor && solid.nodeId === upperIndex);
    const lowerFloors = ttSolids.filter(solid => solid.floor && solid.nodeId === lowerIndex);
    if (!upperFloors.length || !lowerFloors.length) return false;

    const cellLeft = TT_ROOM_MARGIN_X + upperCell.col * TT_CELL_WIDTH;
    const cellRight = cellLeft + TT_CELL_WIDTH;
    const widthOptions = TT_IS_MOBILE ? [78, 70, 64] : [126, 114, 104];
    const floorPairs = [];

    for (const clearWidth of widthOptions) {
      for (const upperFloor of upperFloors) {
        for (const lowerFloor of lowerFloors) {
          const sideRoom = TT_WALL_THICKNESS + (TT_IS_MOBILE ? 8 : 13);
          const minCenter = Math.max(
            cellLeft + clearWidth / 2 + sideRoom,
            upperFloor.x + clearWidth / 2 + sideRoom,
            lowerFloor.x + clearWidth / 2 + (TT_IS_MOBILE ? 8 : 13)
          );
          const maxCenter = Math.min(
            cellRight - clearWidth / 2 - sideRoom,
            upperFloor.x + upperFloor.w - clearWidth / 2 - sideRoom,
            lowerFloor.x + lowerFloor.w - clearWidth / 2 - (TT_IS_MOBILE ? 8 : 13)
          );
          if (maxCenter <= minCenter) continue;
          floorPairs.push({ clearWidth, upperFloor, lowerFloor, minCenter, maxCenter });
        }
      }
      if (floorPairs.length) break;
    }
    if (!floorPairs.length) return false;

    ttShuffle(floorPairs);
    for (const pair of floorPairs) {
      const { clearWidth, upperFloor, lowerFloor, minCenter, maxCenter } = pair;
      const centerX = ttRand(minCenter, maxCenter);
      const clearLeft = centerX - clearWidth / 2;
      const clearRight = centerX + clearWidth / 2;
      const leftWallX = clearLeft - TT_WALL_THICKNESS;
      const rightWallX = clearRight;
      const shaftTop = upperFloor.y + upperFloor.h;
      const shaftBottom = lowerFloor.y;
      const shaftWallHeight = shaftBottom - shaftTop - TT_SHAFT_BOTTOM_OPENING;
      if (shaftWallHeight < (TT_IS_MOBILE ? 34 : 56)) continue;

      const openingCut = {
        x: clearLeft,
        y: upperFloor.y - 2,
        w: clearWidth,
        h: upperFloor.h + 4
      };
      const passageCut = {
        x: leftWallX,
        y: shaftTop - 2,
        w: clearWidth + TT_WALL_THICKNESS * 2,
        h: Math.max(4, shaftBottom - shaftTop + 2)
      };
      const shaftFootprint = {
        x: leftWallX,
        y: upperFloor.y - 2,
        w: clearWidth + TT_WALL_THICKNESS * 2,
        h: shaftBottom - upperFloor.y + 4
      };
      if (ttEntranceDoor && ttIntersects(shaftFootprint, ttExpandedBox(ttEntranceDoor, TT_IS_MOBILE ? 10 : 16))) continue;
      if (ttExitDoor && ttIntersects(shaftFootprint, ttExpandedBox(ttExitDoor, TT_IS_MOBILE ? 10 : 16))) continue;

      const rebuilt = [];
      for (const solid of ttSolids) {
        if (solid.boundary) {
          rebuilt.push(solid);
          continue;
        }
        if (solid === upperFloor) {
          rebuilt.push(...ttSplitSolidAroundRect(solid, openingCut));
          continue;
        }
        if (solid.floor) {
          rebuilt.push(solid);
          continue;
        }
        const crossesVerticalPassage = solid.y < shaftBottom - 1 && solid.y + solid.h > shaftTop;
        if (crossesVerticalPassage && ttIntersects(solid, passageCut)) {
          rebuilt.push(...ttSplitSolidAroundRect(solid, passageCut));
        } else {
          rebuilt.push(solid);
        }
      }
      ttSolids = rebuilt;

      const leftWall = {
        id: ttSolids.length,
        x: leftWallX,
        y: shaftTop,
        w: TT_WALL_THICKNESS,
        h: shaftWallHeight,
        internalWall: true,
        shaftWall: true,
        slurWall: true,
        noWallJump: false
      };
      ttSolids.push(leftWall);
      const rightWall = {
        id: ttSolids.length,
        x: rightWallX,
        y: shaftTop,
        w: TT_WALL_THICKNESS,
        h: shaftWallHeight,
        internalWall: true,
        shaftWall: true,
        slurWall: true,
        noWallJump: false
      };
      ttSolids.push(rightWall);

      const spikeClearZone = {
        x: leftWallX - (TT_IS_MOBILE ? 8 : 13),
        y: upperFloor.y - (TT_IS_MOBILE ? 22 : 36),
        w: clearWidth + TT_WALL_THICKNESS * 2 + (TT_IS_MOBILE ? 16 : 26),
        h: shaftBottom - upperFloor.y + (TT_IS_MOBILE ? 26 : 42)
      };
      ttSpikes = ttSpikes.filter(spike => !ttIntersects(spike, spikeClearZone));

      ttShaftLandingZones.push({
        x: clearLeft - (TT_IS_MOBILE ? 12 : 20),
        y: lowerFloor.y,
        w: clearWidth + (TT_IS_MOBILE ? 24 : 40),
        floorY: lowerFloor.y
      });

      ttRelocateObjectsForNewShaft(openingCut, [leftWall, rightWall]);

      const slurEdge = { a: upperIndex, b: lowerIndex, extra: true, type: "slurShaft" };
      ttSlurEdges.push(slurEdge);
      ttMapVisited.add(upperIndex);
      ttMapVisited.add(lowerIndex);
      if (ttMapVisited.has(ttMapExitCell)) ttMapExitDiscovered = true;
      return true;
    }
    return false;
  }

  function ttAddSlurShafts(count = 3) {
    const keySet = new Set([
      ...ttMapEdges.map(edge => ttEdgeKey(edge.a, edge.b)),
      ...ttSlurEdges.map(edge => ttEdgeKey(edge.a, edge.b))
    ]);
    const choices = [];
    for (let row = 0; row < TT_MAZE_ROWS - 1; row++) {
      for (let col = 0; col < TT_MAZE_COLS; col++) {
        const a = ttCellIndex(row, col);
        const b = ttCellIndex(row + 1, col);
        if (keySet.has(ttEdgeKey(a, b))) continue;
        choices.push({ a, b, extra: true, type: "slurShaft" });
      }
    }
    ttShuffle(choices);
    let added = 0;
    for (const edge of choices) {
      if (added >= count) break;
      if (ttCarveSlurShaft(edge)) {
        keySet.add(ttEdgeKey(edge.a, edge.b));
        added++;
      }
    }
    return added;
  }

  function ttVisibleMapCellSet() {
    return ttMapRevealAll ? ttAllCellSet() : ttMapVisited;
  }

  function ttFindTeleportPointForCell(cellIndex) {
    const cell = ttCellFromIndex(cellIndex);
    const x0 = TT_ROOM_MARGIN_X + cell.col * TT_CELL_WIDTH;
    const x1 = x0 + TT_CELL_WIDTH;
    const y0 = TT_ROOM_MARGIN_Y + cell.row * TT_CELL_HEIGHT;
    const y1 = y0 + TT_CELL_HEIGHT;
    const centerX = x0 + TT_CELL_WIDTH / 2;
    const candidateFloors = ttSolids.filter(solid => solid.floor && solid.x < x1 - 6 && solid.x + solid.w > x0 + 6 && solid.y >= y0 - 6 && solid.y <= y1 + TT_CELL_HEIGHT * 0.35);
    if (candidateFloors.length) {
      candidateFloors.sort((a, b) => {
        const da = Math.abs((a.x + a.w / 2) - centerX);
        const db = Math.abs((b.x + b.w / 2) - centerX);
        if (da !== db) return da - db;
        return a.y - b.y;
      });
      const floor = candidateFloors[0];
      return { x: ttClamp(centerX - ttPlayer.w / 2, floor.x + 2, floor.x + floor.w - ttPlayer.w - 2), y: floor.y - ttPlayer.h };
    }
    return { x: centerX - ttPlayer.w / 2, y: y0 + TT_CELL_HEIGHT * 0.5 - ttPlayer.h };
  }

  function ttTeleportToCell(cellIndex) {
    const point = ttFindTeleportPointForCell(cellIndex);
    ttPlayer.x = point.x; ttPlayer.y = point.y; ttPlayer.vx = 0; ttPlayer.vy = 0;
    ttPlayer.onGround = false; ttPlayer.wallDir = 0; ttPlayer.dashTimer = 0; ttPlayer.answerStun = 0;
    ttCenterCameraImmediately();
    ttUpdateMapDiscovery();
    ttTriggerScreenFlash("194, 240, 255", 0.18, 0.16);
    ttAddCameraShake(TT_IS_MOBILE ? 3.5 : 5.5, 0.18);
    ttSetRepeatMenuOpen(false);
  }

  function ttMoveRepeatSelection(dirRow, dirCol) {
    if (!ttRepeatOptions.length) return;
    const current = ttCellFromIndex(ttRepeatSelectedCell);
    let best = ttRepeatSelectedCell; let bestScore = Infinity;
    for (const cellIndex of ttRepeatOptions) {
      if (cellIndex === ttRepeatSelectedCell) continue;
      const cell = ttCellFromIndex(cellIndex);
      const rowDelta = cell.row - current.row; const colDelta = cell.col - current.col;
      if (dirRow < 0 && rowDelta >= 0) continue;
      if (dirRow > 0 && rowDelta <= 0) continue;
      if (dirCol < 0 && colDelta >= 0) continue;
      if (dirCol > 0 && colDelta <= 0) continue;
      const score = Math.abs(rowDelta) * 100 + Math.abs(colDelta) * 8 + Math.hypot(rowDelta, colDelta);
      if (score < bestScore) { bestScore = score; best = cellIndex; }
    }
    if (best !== ttRepeatSelectedCell) ttRepeatSelectedCell = best;
  }

  function ttCollectPowerUp(powerUp) {
    if (!powerUp || powerUp.collected) return false;
    powerUp.collected = true;
    const definition = TT_POWERUP_LIBRARY[powerUp.type];
    const centerX = powerUp.x + powerUp.w / 2;
    const centerY = powerUp.y + powerUp.h / 2;
    ttSpawnCrystalParticles(centerX, centerY, true);
    ttAddFloatingText(definition.short, centerX, centerY - powerUp.h * 0.2, "#f7fbff", 1.0);
    (definition.rare ? soundPowerupRare : soundPowerup)();

    switch (powerUp.type) {
      case "fermata":
        ttFermataTime = Math.max(ttFermataTime, TT_FERMATA_DURATION);
        ttSetFeedback("FERMATA • TIMER FROZEN", true);
        break;
      case "metronome":
        ttMetronomeTime = Math.max(ttMetronomeTime, TT_METRONOME_DURATION);
        ttSetFeedback("METRONOME • SPEED UP", true);
        break;
      case "rest8": case "restQ": case "restH": case "restW":
        ttAddRoomTime(definition.timeGain || 8);
        ttSetFeedback(`${definition.short} • +${definition.timeGain || 8}S`, true);
        break;
      case "slur": {
        const shaftsAdded = ttAddSlurShafts(3);
        ttSetFeedback(`SLUR • ${shaftsAdded} NEW SHAFTS`, true);
        break;
      }
      case "accent": {
        ttSelectAccentCrystals(3);
        break;
      }
      case "trill":
        ttTriggerTrill();
        break;
      case "repeat":
        if (!ttOpenRepeatMenu()) ttAddRoomTime(8);
        break;
      case "quill":
        ttMapRevealAll = true;
        ttMapExitDiscovered = true;
        ttSetFeedback("QUILL • WHOLE MAP REVEALED", true);
        break;
      case "treble":
        ttTrebleFlyTime = Math.max(ttTrebleFlyTime, TT_TREBLE_FLY_DURATION);
        ttSetFeedback("TREBLE CLEF • FLY", true);
        break;
      case "bass":
        ttBassCharges += TT_BASS_CHARGES_PER_PICKUP;
        ttSetFeedback("BASS CLEF • 1 BREAK", true);
        break;
      case "rit":
        ttRitTime = Math.max(ttRitTime, TT_RIT_DURATION);
        ttSetFeedback("RIT. • TIMER SLOWS", true);
        break;
      case "crescendo":
        ttCrescendoArmed = true;
        ttSetFeedback("CRESC. • STREAK BONUS", true);
        break;
      case "decrescendo":
        ttDecrescendoArmed = true;
        ttSetFeedback("DECRESC. • TIME BONUS", true);
        break;
    }
    ttUpdatePowerupHudState();
    return true;
  }

  function ttTryCollectNearbyPowerUp() {
    return ttCollectPowerUp(ttFindNearestInteractivePowerUp());
  }

  function ttApplyExitBonuses() {
    const cx = ttExitDoor.x + ttExitDoor.w / 2;
    const cy = ttExitDoor.y - (TT_IS_MOBILE ? 16 : 24);
    if (ttCrescendoArmed) {
      const bonus = Math.max(1, ttCombo);
      addScore(bonus);
      ttAddFloatingText(`CRESC. +${bonus}`, cx, cy, "#bff7ff", 1.0);
      ttCrescendoArmed = false;
    }
    if (ttDecrescendoArmed) {
      const bonus = Math.max(1, Math.floor(ttRoomTimeRemaining / 12));
      addScore(bonus);
      ttAddFloatingText(`DECRESC. +${bonus}`, cx, cy + (TT_IS_MOBILE ? 11 : 16), "#e0ffc9", 1.0);
      ttDecrescendoArmed = false;
    }
    ttUpdatePowerupHudState();
  }

  function ttGetDirectionalInputVector() {
    let x = 0;
    let y = 0;
    if (ttInput.left) x -= 1;
    if (ttInput.right) x += 1;
    if (ttInput.up) y -= 1;
    if (ttInput.down) y += 1;
    if (typeof sticks !== "undefined" && sticks.left) {
      if (Math.abs(sticks.left.x) > 0.25 || Math.abs(sticks.left.y) > 0.25) {
        x = sticks.left.x;
        y = sticks.left.y;
      }
    }
    const length = Math.hypot(x, y);
    if (length > 0.001) return { x: x / length, y: y / length };
    return { x: 0, y: 0 };
  }

  function ttTryBassBreak() {
    if (ttBassCharges <= 0 || ttRoomIntroPhase !== "active") return false;
    const dir = ttGetDirectionalInputVector();
    if (Math.abs(dir.x) < 0.2 && Math.abs(dir.y) < 0.2) return false;
    const px = ttPlayer.x + ttPlayer.w / 2;
    const py = ttPlayer.y + ttPlayer.h / 2;
    let bestIndex = -1;
    let bestDistance = Infinity;
    let bestOrientation = "wall";

    for (let i = 0; i < ttSolids.length; i++) {
      const solid = ttSolids[i];
      if (!solid || solid.boundary) continue;
      if (!(solid.internalWall || solid.floor || solid.shaftWall || solid.chamberWall)) continue;
      if (ttEntranceDoor && ttIntersects(solid, ttExpandedBox(ttEntranceDoor, 6))) continue;
      if (ttExitDoor && ttIntersects(solid, ttExpandedBox(ttExitDoor, 6))) continue;

      if (Math.abs(dir.x) > Math.abs(dir.y)) {
        const overlapY = py >= solid.y - 6 && py <= solid.y + solid.h + 6;
        if (!overlapY) continue;
        if (dir.x < 0 && solid.x + solid.w <= ttPlayer.x + 2) {
          const dist = ttPlayer.x - (solid.x + solid.w);
          if (dist <= TT_BASS_BREAK_REACH && dist < bestDistance) { bestDistance = dist; bestIndex = i; bestOrientation = "wall"; }
        }
        if (dir.x > 0 && solid.x >= ttPlayer.x + ttPlayer.w - 2) {
          const dist = solid.x - (ttPlayer.x + ttPlayer.w);
          if (dist <= TT_BASS_BREAK_REACH && dist < bestDistance) { bestDistance = dist; bestIndex = i; bestOrientation = "wall"; }
        }
      } else {
        const overlapX = px >= solid.x - 6 && px <= solid.x + solid.w + 6;
        if (!overlapX) continue;
        if (dir.y < 0 && solid.y + solid.h <= ttPlayer.y + 2) {
          const dist = ttPlayer.y - (solid.y + solid.h);
          if (dist <= TT_BASS_BREAK_REACH && dist < bestDistance) { bestDistance = dist; bestIndex = i; bestOrientation = "ceiling"; }
        }
        if (dir.y > 0 && solid.y >= ttPlayer.y + ttPlayer.h - 2) {
          const dist = solid.y - (ttPlayer.y + ttPlayer.h);
          if (dist <= TT_BASS_BREAK_REACH && dist < bestDistance) { bestDistance = dist; bestIndex = i; bestOrientation = "floor"; }
        }
      }
    }

    if (bestIndex < 0) return false;
    const solid = ttSolids[bestIndex];
    const newPieces = [];
    if (bestOrientation === "wall") {
      const carveHeight = Math.min(TT_BASS_BREAK_SIZE, Math.max(TT_IS_MOBILE ? 24 : 34, solid.h - (TT_IS_MOBILE ? 12 : 18)));
      const localCenter = ttClamp(py, solid.y + carveHeight / 2 + 2, solid.y + solid.h - carveHeight / 2 - 2);
      const gapTop = localCenter - carveHeight / 2;
      const gapBottom = gapTop + carveHeight;
      if (gapTop - solid.y > 4) newPieces.push({ ...solid, h: gapTop - solid.y });
      if (solid.y + solid.h - gapBottom > 4) newPieces.push({ ...solid, y: gapBottom, h: solid.y + solid.h - gapBottom });
    } else {
      const carveWidth = Math.min(TT_BASS_BREAK_SIZE, Math.max(TT_IS_MOBILE ? 26 : 40, solid.w - (TT_IS_MOBILE ? 12 : 18)));
      const localCenter = ttClamp(px, solid.x + carveWidth / 2 + 2, solid.x + solid.w - carveWidth / 2 - 2);
      const gapLeft = localCenter - carveWidth / 2;
      const gapRight = gapLeft + carveWidth;
      if (gapLeft - solid.x > 4) newPieces.push({ ...solid, w: gapLeft - solid.x });
      if (solid.x + solid.w - gapRight > 4) newPieces.push({ ...solid, x: gapRight, w: solid.x + solid.w - gapRight });
    }
    ttSolids.splice(bestIndex, 1, ...newPieces);
    ttBassCharges = Math.max(0, ttBassCharges - 1);
    ttSpawnCrystalParticles(px, py, true);
    soundCrumble();
    ttAddCameraShake(TT_IS_MOBILE ? 2.8 : 4.2, 0.12);
    ttSetFeedback(ttBassCharges > 0 ? `BASS CLEF • ${ttBassCharges} LEFT` : "BASS CLEF • SPENT", true);
    ttUpdatePowerupHudState();
    return true;
  }

  function ttUpdatePowerups(dt) {
    ttPowerClock += dt;
    if (ttTrillEarthquakeTime > 0) {
      const before = ttTrillEarthquakeTime;
      ttTrillEarthquakeTime = Math.max(0, ttTrillEarthquakeTime - dt);
      ttAddCameraShake(TT_IS_MOBILE ? 4.8 : 7.8, Math.max(0.08, ttTrillEarthquakeTime + 0.04));
      if (before > 0 && ttTrillEarthquakeTime <= 0) ttFinishTrillEarthquake();
    }
    ttFermataTime = Math.max(0, ttFermataTime - dt);
    ttMetronomeTime = Math.max(0, ttMetronomeTime - dt);
    ttAccentTime = 0;
    ttSlurTime = Math.max(0, ttSlurTime - dt);
    ttTrebleFlyTime = Math.max(0, ttTrebleFlyTime - dt);
    ttRitTime = Math.max(0, ttRitTime - dt);
    ttUpdatePowerupHudState();
  }

  function ttCollectCrystal(crystal) {
    if (!crystal || crystal.collected || !crystal.revealed) return false;
    crystal.collected = true;
    const centerX = crystal.x + crystal.w / 2;
    const centerY = crystal.y + crystal.h / 2;
    ttCrystalBursts.push({
      x: centerX,
      y: centerY,
      timer: 0,
      duration: TT_CRYSTAL_COLLECT_DURATION,
      phase: crystal.phase,
      correct: crystal.correct
    });
    ttSpawnCrystalParticles(centerX, centerY, crystal.correct);

    if (crystal.correct) {
      addScore(1);
      ttCombo += 1;
      soundCorrect();
      ttTriggerScreenFlash("181, 242, 255", 0.10, 0.12);
      ttAddCameraShake(TT_IS_MOBILE ? 1.4 : 2.2, 0.08);
      ttAddFloatingText("+1", centerX, centerY - crystal.h * 0.15, "#f4feff", 1.12);
      if (ttCombo >= 2) {
        ttAddFloatingText(`COMBO ${ttCombo}`, centerX, centerY + crystal.h * 0.16, "#ffe892", 0.82);
      }
      ttSetFeedback(`CORRECT • COMBO ${ttCombo}`, true);
    } else {
      ttCombo = 0;
      soundWrong();
      ttTriggerScreenFlash("255, 74, 54", 0.23, 0.18);
      ttAddCameraShake(TT_IS_MOBILE ? 4.5 : 7, 0.18);
      ttAddFloatingText("WRONG", centerX, centerY - crystal.h * 0.12, "#ff9a88", 1.05);
      ttPlayer.answerStun = TT_WRONG_STUN_DURATION;
      ttPlayer.dashTimer = 0;
      ttPlayer.vx = -ttPlayer.facing * (TT_IS_MOBILE ? 115 : 180);
      ttPlayer.vy = -(TT_IS_MOBILE ? 105 : 165);
      ttSetFeedback("WRONG • COMBO LOST", false);
    }
    return true;
  }

  function ttTryCollectNearbyCrystal() {
    return ttCollectCrystal(ttFindNearestInteractiveCrystal());
  }

  function ttUpdateCrystals(dt) {
    ttCrystalClock += dt;
    ttFeedbackTimer = Math.max(0, ttFeedbackTimer - dt);
    for (const burst of ttCrystalBursts) burst.timer += dt;
    ttCrystalBursts = ttCrystalBursts.filter(burst => burst.timer < burst.duration);
  }


  function ttResetJuiceState(keepScreenFlash = false) {
    ttParticles = [];
    ttFloatingTexts = [];
    ttDashGhosts = [];
    ttDashTrailTimer = 0;
    ttCameraShakeStrength = 0;
    ttCameraShakeTime = 0;
    ttCameraShakeDuration = 0;
    if (!keepScreenFlash) {
      ttScreenFlashTime = 0;
      ttScreenFlashDuration = 0;
      ttScreenFlashAlpha = 0;
    }
    ttDoorOpenTimer = 0;
    ttDoorOpenProgress = 0;
    ttCollapseDebrisTimer = 0;
    ttRoomArrivalPulse = 0;
    ttCrumbleSoundCooldown = 0;
  }

  function ttAddCameraShake(strength, duration = 0.14) {
    ttCameraShakeStrength = Math.max(ttCameraShakeStrength, strength);
    ttCameraShakeTime = Math.max(ttCameraShakeTime, duration);
    ttCameraShakeDuration = Math.max(ttCameraShakeDuration, duration);
  }

  function ttTriggerScreenFlash(color, alpha = 0.18, duration = 0.16) {
    ttScreenFlashColor = color;
    ttScreenFlashAlpha = Math.max(ttScreenFlashAlpha, alpha);
    ttScreenFlashTime = Math.max(ttScreenFlashTime, duration);
    ttScreenFlashDuration = Math.max(ttScreenFlashDuration, duration);
  }

  function ttPushParticle(particle) {
    particle.maxLife = Math.max(0.01, particle.life || 0.4);
    particle.gravity = Number.isFinite(particle.gravity) ? particle.gravity : 0;
    particle.drag = Number.isFinite(particle.drag) ? particle.drag : 0.96;
    particle.rotation = particle.rotation || 0;
    particle.spin = particle.spin || 0;
    particle.shape = particle.shape || "circle";
    particle.size = particle.size || (TT_IS_MOBILE ? 2 : 3);
    particle.screenSpace = Boolean(particle.screenSpace);
    ttParticles.push(particle);
    if (ttParticles.length > TT_PARTICLE_LIMIT) {
      ttParticles.splice(0, ttParticles.length - TT_PARTICLE_LIMIT);
    }
  }

  function ttSpawnDust(x, y, count = 6, direction = 0, speedScale = 1) {
    const total = TT_IS_MOBILE ? Math.ceil(count * 0.72) : count;
    for (let index = 0; index < total; index++) {
      const spread = ttRand(-1, 1);
      ttPushParticle({
        x: x + ttRand(-(TT_IS_MOBILE ? 5 : 8), TT_IS_MOBILE ? 5 : 8),
        y: y + ttRand(-(TT_IS_MOBILE ? 1 : 2), TT_IS_MOBILE ? 1 : 2),
        vx: (spread * (TT_IS_MOBILE ? 45 : 75) + direction * (TT_IS_MOBILE ? 22 : 36)) * speedScale,

  function ttEmitJumpFeedback(wallJump) {
    soundJump(wallJump);
    if (wallJump) {
      const wallX = ttPlayer.lastWallDir > 0 ? ttPlayer.x + ttPlayer.w : ttPlayer.x;
      ttSpawnWallDust(wallX, ttPlayer.y + ttPlayer.h * 0.65, ttPlayer.lastWallDir);
      ttAddCameraShake(TT_IS_MOBILE ? 1.5 : 2.2, 0.08);

      ttSpawnDust(ttPlayer.x + ttPlayer.w / 2, ttPlayer.y + ttPlayer.h, TT_IS_MOBILE ? 4 : 7);
    }

  function ttEmitLandingFeedback(impactSpeed) {
    const ordinaryRatio = ttClamp(
      (impactSpeed - (TT_IS_MOBILE ? 155 : 230)) /
      Math.max(1, TT_BIG_FALL_SHAKE_SPEED - (TT_IS_MOBILE ? 155 : 230)),
      0,
      1
    );
    const bigFallRatio = ttClamp(
      (impactSpeed - TT_BIG_FALL_SHAKE_SPEED) /
      Math.max(1, TT_MAX_FALL_SPEED - TT_BIG_FALL_SHAKE_SPEED),
      0,
      1
    );

    ttSpawnDust(
      ttPlayer.x + ttPlayer.w / 2,
      ttPlayer.y + ttPlayer.h,
      (TT_IS_MOBILE ? 5 : 8) + Math.round(ordinaryRatio * (TT_IS_MOBILE ? 4 : 7)),
      0,
      0.8 + ordinaryRatio * 0.7
    );
    soundLand(0.55 + ordinaryRatio * 0.8);

    // Normal jumps never shake the screen. Only a fall exceeding roughly
    // 1.5 full-jump heights produces camera impact.
    if (impactSpeed >= TT_BIG_FALL_SHAKE_SPEED) {
      ttAddCameraShake(
        (TT_IS_MOBILE ? 2.2 : 3.4) + bigFallRatio * (TT_IS_MOBILE ? 2.4 : 4.2),
        0.11 + bigFallRatio * 0.07
      );
    }
  }

  function ttEmitCrystalFormFeedback() {

    ttRoomArrivalPulse = 0.42;
    const sample = ttShuffle(ttCrystals.slice()).slice(0, TT_IS_MOBILE ? 8 : 12);
    for (const crystal of sample) {

      });

  function ttUpdateJuice(dt) {
    ttCameraShakeTime = Math.max(0, ttCameraShakeTime - dt);
    if (ttCameraShakeTime <= 0) {
      ttCameraShakeStrength = 0;
      ttCameraShakeDuration = 0;
    }

    ttScreenFlashTime = Math.max(0, ttScreenFlashTime - dt);
    if (ttScreenFlashTime <= 0) ttScreenFlashAlpha = 0;

    ttDoorOpenTimer = Math.max(0, ttDoorOpenTimer - dt);
    if (ttDoorOpenTimer > 0) {
      ttDoorOpenProgress = ttClamp(1 - ttDoorOpenTimer / TT_DOOR_OPEN_DURATION, 0, 1);
    } else if (!ttTransitionActive) {
      ttDoorOpenProgress = 0;
    }

    ttRoomArrivalPulse = Math.max(0, ttRoomArrivalPulse - dt);
    ttCrumbleSoundCooldown = Math.max(0, ttCrumbleSoundCooldown - dt);

    if (ttPlayer.dashTimer > 0 && ttRoomIntroPhase === "active" && !ttCollapseActive) {
      ttDashTrailTimer -= dt;
      if (ttDashTrailTimer <= 0) {
        ttDashTrailTimer = TT_DASH_GHOST_INTERVAL;
        ttDashGhosts.push({
          x: ttPlayer.x,
          y: ttPlayer.y,
          facing: ttPlayer.facing,
          life: TT_DASH_GHOST_LIFE,
          maxLife: TT_DASH_GHOST_LIFE
        });
      }
    } else {
      ttDashTrailTimer = 0;
    }

    for (const ghost of ttDashGhosts) ghost.life -= dt;
    ttDashGhosts = ttDashGhosts.filter(ghost => ghost.life > 0);

    for (const particle of ttParticles) {
      particle.life -= dt;
      particle.vy += particle.gravity * dt;
      const dragFactor = Math.pow(particle.drag, dt * 60);
      particle.vx *= dragFactor;
      particle.vy *= dragFactor;
      particle.x += particle.vx * dt;
      particle.y += particle.vy * dt;
      particle.rotation += particle.spin * dt;
    }
    ttParticles = ttParticles.filter(particle => particle.life > 0);

    for (const text of ttFloatingTexts) {
      text.life -= dt;
      text.y -= (TT_IS_MOBILE ? 23 : 36) * dt;
    }
    ttFloatingTexts = ttFloatingTexts.filter(text => text.life > 0);

    if (ttCollapseActive) {
      ttCollapseDebrisTimer -= dt;
      if (ttCollapseDebrisTimer <= 0) {
        ttCollapseDebrisTimer = TT_IS_MOBILE ? 0.055 : 0.04;
        const count = TT_IS_MOBILE ? 2 : 3;
        for (let index = 0; index < count; index++) {
          ttPushParticle({
            x: ttCamera.x + ttRand(0, GAME_CANVAS_LOGICAL_WIDTH),
            y: ttCamera.y - (TT_IS_MOBILE ? 8 : 14),
            vx: ttRand(-(TT_IS_MOBILE ? 35 : 55), TT_IS_MOBILE ? 35 : 55),
            vy: ttRand(TT_IS_MOBILE ? 90 : 140, TT_IS_MOBILE ? 220 : 340),
            life: ttRand(0.45, 0.85),
            size: ttRand(TT_IS_MOBILE ? 2 : 3, TT_IS_MOBILE ? 5 : 8),
            color: ttChance(0.4) ? "#6c787d" : "#414d52",
            gravity: TT_IS_MOBILE ? 240 : 360,
            drag: 0.97,
            shape: "rect",
            rotation: ttRand(0, Math.PI * 2),
            spin: ttRand(-5, 5)
          });
        }
      }
    }
  }

  function ttCameraShakeOffset() {
    if (ttCameraShakeTime <= 0 || ttCameraShakeStrength <= 0) return { x: 0, y: 0 };
    const fade = ttCameraShakeDuration > 0 ? ttCameraShakeTime / ttCameraShakeDuration : 0;
    const strength = ttCameraShakeStrength * ttClamp(fade, 0, 1);
    return {
      x: ttRand(-strength, strength),
      y: ttRand(-strength, strength)
    };
  }

  function ttMoveToward(value, target, amount) {
    if (value < target) return Math.min(value + amount, target);
    if (value > target) return Math.max(value - amount, target);
    return target;
  }

  function ttIntersects(a, b) {
    return a.x < b.x + b.w &&
      a.x + a.w > b.x &&
      a.y < b.y + b.h &&
      a.y + a.h > b.y;
  }

  function ttCellIndex(row, col) {
    return row * TT_MAZE_COLS + col;
  }

  function ttCellFromIndex(index) {
    return {
      row: Math.floor(index / TT_MAZE_COLS),
      col: index % TT_MAZE_COLS
    };
  }

  function ttEdgeKey(a, b) {
    return a < b ? `${a}:${b}` : `${b}:${a}`;
  }

  function ttCellNeighbors(index) {
    const { row, col } = ttCellFromIndex(index);
    const neighbors = [];
    if (row > 0) neighbors.push(ttCellIndex(row - 1, col));
    if (row < TT_MAZE_ROWS - 1) neighbors.push(ttCellIndex(row + 1, col));
    if (col > 0) neighbors.push(ttCellIndex(row, col - 1));
    if (col < TT_MAZE_COLS - 1) neighbors.push(ttCellIndex(row, col + 1));
    return neighbors;
  }

  function ttMapCellAtWorldPoint(worldX, worldY) {
    const col = ttClamp(
      Math.floor((worldX - TT_ROOM_MARGIN_X) / TT_CELL_WIDTH),
      0,
      TT_MAZE_COLS - 1
    );
    const row = ttClamp(
      Math.floor((worldY - TT_ROOM_MARGIN_Y) / TT_CELL_HEIGHT),
      0,
      TT_MAZE_ROWS - 1
    );
    return ttCellIndex(row, col);
  }

  function ttResetMapDiscovery(edges, entranceCell, exitCell) {
    ttMapOpen = false;
    ttMapEdges = edges.map(edge => ({ a: edge.a, b: edge.b }));
    ttMapEntranceCell = entranceCell;
    ttMapExitCell = exitCell;
    ttMapExitDiscovered = false;
    ttMapVisited = new Set([entranceCell]);
    ttMapExplored = new Set([entranceCell]);
  }

  function ttUpdateMapDiscovery() {
    const viewLeft = ttClamp(ttCamera.x, 0, TT_WORLD_WIDTH);
    const viewTop = ttClamp(ttCamera.y, 0, TT_WORLD_HEIGHT);
    const viewRight = ttClamp(ttCamera.x + GAME_CANVAS_LOGICAL_WIDTH, 0, TT_WORLD_WIDTH);
    const viewBottom = ttClamp(ttCamera.y + GAME_CANVAS_LOGICAL_HEIGHT, 0, TT_WORLD_HEIGHT);
