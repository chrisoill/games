  function ssIsSludgeArtillery(device) {
    return !!device && String(device.typeId || "") === "minor2-6";
  }

  function ssSludgeArtillerySlowFactor(device) {
    const stack = Math.max(1, Number(device?.powerMultiplier || 1));
    return ssClamp(
      SS_SLUDGE_ARTILLERY_BASE_SLOW_FACTOR - (stack - 1) * SS_SLUDGE_ARTILLERY_STACK_SLOW_STEP,
      0.18,
      0.90
    );
  }

  function ssSpawnSludgeArtilleryShot(device, target, index = 0) {
    const yaw = ssPartialAimYaw(device);
    const forwardX = -Math.sin(yaw), forwardZ = Math.cos(yaw);
    const rightX = Math.cos(yaw), rightZ = Math.sin(yaw);
    const sideOffsets = [-0.30, -0.10, 0.10, 0.30];
    const side = sideOffsets[index] || 0;
    return ssSpawnProjectile({
      ownerId: device.placedId,
      ownerAllegiance: device.ownerAllegiance || "player",
      sourceKind: "sludge-artillery",
      x: device.x - forwardX * 0.25 + rightX * side,
      y: Number(device.y || 0) + Number(device.height || 1.0) * 0.74,
      z: device.z - forwardZ * 0.25 + rightZ * side,
      targetId: target.enemyId,
      speed: SS_SIX_NOTE_PROJECTILE_SPEED,
      damage: 0,
      splashRadius: 0,
      color: "#3f7d2b",
      radius: 0.265,
      hitRadius: 0.33,
      life: 6,
      meta: {
        kind: "sludge-artillery-shot",
        phase: index * (Math.PI * 2 / 4),
        wobbleSeed: Math.random() * Math.PI * 2
      },
      onHit: (enemy) => {
        if (!enemy?.alive) return;
        ssApplyEnemySlow(enemy, {
          sourceId: device.placedId,
          factor: ssSludgeArtillerySlowFactor(device),
          duration: SS_SLUDGE_ARTILLERY_SLOW_DURATION
        });
      }
    });
  }

  function ssFireSludgeArtillery(device) {
    device = ssEnsureDeviceCombatState(device);
    if (!device || device.health <= 0 || !ssIsSludgeArtillery(device)) return 0;
    device.targetLimit = SS_SLUDGE_ARTILLERY_TARGET_LIMIT;
    device.detectionRadius = SS_SLUDGE_ARTILLERY_DETECTION_RADIUS;
    device.actionCooldown = SS_SIX_NOTE_ACTION_COOLDOWN;
    if (device.actionTimer > 0) return 0;

    const targets = ssAcquirePrimaryTargets(device, {
      maxTargets: SS_SLUDGE_ARTILLERY_TARGET_LIMIT,
      range: SS_SLUDGE_ARTILLERY_DETECTION_RADIUS,
      targetAllegiance: "enemy"
    });
    if (!targets.length) {
      device.targetSlots = Array(SS_SLUDGE_ARTILLERY_TARGET_LIMIT).fill(null);
      return 0;
    }

    device.actionTimer = device.actionCooldown;
    device.targetSlots = targets.map(target => target.enemyId);
    while (device.targetSlots.length < SS_SLUDGE_ARTILLERY_TARGET_LIMIT) device.targetSlots.push(null);
    targets.forEach((target, index) => ssSpawnSludgeArtilleryShot(device, target, index));
    return targets.length;
  }

  function ssUpdatePartialScaleDevices(dt) {
    for (const device of ssPlacedDevices) {
      ssEnsureDeviceCombatState(device);
      if (device.health <= 0) continue;
      if (ssIsLightPinger(device)) ssFireLightPinger(device);
      else if (ssIsGooSpitter(device)) ssFireGooSpitter(device);
      else if (ssIsMendingLantern(device)) ssPulseMendingLantern(device);
      else if (ssIsShadowTurret(device)) ssFireShadowTurret(device);
      else if (ssIsSludgeTurret(device)) ssFireSludgeTurret(device);
      else if (ssIsMendingBeacon(device)) ssPulseMendingBeacon(device);
      else if (ssIsShadowCannon(device)) ssFireShadowCannon(device);
      else if (ssIsSludgeCannon(device)) ssFireSludgeCannon(device);
      else if (ssIsMendingShrine(device)) ssPulseMendingShrine(device);
      else if (ssIsShadowBattery(device)) ssFireShadowBattery(device);
      else if (ssIsSludgeArray(device)) ssFireSludgeArray(device);
      else if (ssIsMendingArtillery(device)) ssPulseMendingArtillery(device);
      else if (ssIsShadowArtillery(device)) ssFireShadowArtillery(device);
      else if (ssIsSludgeArtillery(device)) ssFireSludgeArtillery(device);
    }
  }

  function ssUpdateFullModeDevices(dt) {
    for (const device of ssPlacedDevices) {
      ssEnsureDeviceCombatState(device);
      if (device.health <= 0) continue;
      if (ssIsIonianHospital(device)) ssDeployIonianNurses(device, dt);
      else if (ssIsDorianTower(device)) ssFireDorianChant(device);
      else if (ssIsLydianTower(device)) ssFireLydianVolley(device);
      else if (ssIsPhrygianTower(device)) ssDeployPhrygianSnakes(device);
      else if (ssIsMixolydianTower(device)) ssFireMixolydianVolley(device);
      else if (ssIsAeolianTower(device)) ssFireAeolianVolley(device);
      else if (ssIsLocrianTower(device)) ssFireLocrianGhosts(device);
    }
  }

  function ssClearEnemyRetaliation(enemy) {
    if (!enemy) return;
    enemy.retaliationType = null;
    enemy.retaliationId = null;
    enemy.retaliationTimer = 0;
    enemy.objectiveRefreshTimer = 0;
  }

  function ssEnemyRetaliationObjective(enemy) {
    if (!enemy || enemy.allegiance !== "enemy" || Number(enemy.retaliationTimer || 0) <= 0) return null;
    if (enemy.retaliationType === "unit") {
      const unit = ssSpawnedUnitById(enemy.retaliationId);
      if (unit && unit.alive && unit.attackable && unit.ownerAllegiance === "player" && unit.kind !== "ionian-nurse") {
        return { type:"unit", id:unit.unitId, x:unit.x, z:unit.z, radius:unit.radius, target:unit };
      }
    } else if (enemy.retaliationType === "enemy") {
      const ally = ssEnemyById(enemy.retaliationId);
      if (ally && ally.alive && ally.allegiance === "player") {
        return { type:"enemy", id:ally.enemyId, x:ally.x, z:ally.z, radius:ally.radius, target:ally };
      }
    }
    ssClearEnemyRetaliation(enemy);
    return null;
  }

  function ssEnemyNurseConvenienceObjective(enemy) {
    if (!enemy || enemy.allegiance !== "enemy") return null;
    let best = null;
    let bestDistance = Infinity;
    for (const unit of ssSpawnedUnits) {
      if (!unit || !unit.alive || !unit.attackable || unit.ownerAllegiance !== "player" || unit.kind !== "ionian-nurse") continue;
      const distance = Math.hypot(unit.x - enemy.x, unit.z - enemy.z);
      const convenienceRange = Math.max(0.35,
        Number(enemy.radius || 0.35) + Number(unit.radius || SS_IONIAN_NURSE_RADIUS) +
        Number(enemy.attackRange || 0.5) + SS_NURSE_CONVENIENCE_EXTRA_RANGE);
      if (distance <= convenienceRange && distance < bestDistance) {
        bestDistance = distance;
        best = unit;
      }
    }
    return best ? { type:"unit", id:best.unitId, x:best.x, z:best.z, radius:best.radius, target:best } : null;
  }

  function ssSetEnemyRetaliation(enemy, attackerType, attackerId) {
    if (!enemy || !enemy.alive || enemy.allegiance !== "enemy" || !attackerType || !attackerId) return false;
    enemy.retaliationType = attackerType;
    enemy.retaliationId = attackerId;
    enemy.retaliationTimer = SS_ALLY_RETALIATION_DURATION;
    enemy.objectiveCacheType = null;
    enemy.objectiveCacheId = null;
    enemy.objectiveRefreshTimer = 0;
    return true;
  }

  function ssAggroPulseFromAlliedAttacker(struckEnemy, attackerType, attackerId) {
    if (!attackerType || !attackerId) return;
    let ax = null, az = null;
    if (attackerType === "unit") {
      const unit = ssSpawnedUnitById(attackerId);
      if (!unit || !unit.alive || unit.ownerAllegiance !== "player" || unit.kind === "ionian-nurse") return;
      ax = unit.x; az = unit.z;
    } else if (attackerType === "enemy") {
      const ally = ssEnemyById(attackerId);
      if (!ally || !ally.alive || ally.allegiance !== "player") return;
      ax = ally.x; az = ally.z;
    } else return;

    const currentlyAssigned = ssLivingEnemies("enemy").filter(e =>
      Number(e.retaliationTimer || 0) > 0 && e.retaliationType === attackerType && e.retaliationId === attackerId
    );

    // The unit actually struck always gets the right to retaliate if it survived.
    if (struckEnemy && struckEnemy.alive && struckEnemy.health > 0 && struckEnemy.allegiance === "enemy") {
      const already = currentlyAssigned.includes(struckEnemy);
      if (!already && currentlyAssigned.length >= SS_ALLY_RETALIATION_MAX_PER_ATTACKER) {
        let replace = currentlyAssigned[0];
        let farthest = -1;
        for (const e of currentlyAssigned) {
          const d = Math.hypot(e.x - ax, e.z - az);
          if (d > farthest) { farthest = d; replace = e; }
        }
        ssClearEnemyRetaliation(replace);
        currentlyAssigned.splice(currentlyAssigned.indexOf(replace), 1);
      }
      ssSetEnemyRetaliation(struckEnemy, attackerType, attackerId);
      if (!already) currentlyAssigned.push(struckEnemy);
    }

    let open = SS_ALLY_RETALIATION_MAX_PER_ATTACKER - currentlyAssigned.length;
    if (open <= 0) {
      for (const e of currentlyAssigned) e.retaliationTimer = SS_ALLY_RETALIATION_DURATION;
      return;
    }

    const cx = struckEnemy ? Number(struckEnemy.x || 0) : ax;
    const cz = struckEnemy ? Number(struckEnemy.z || 0) : az;
    const nearby = [];
    ssForEachNearbyLivingEnemy(cx, cz, SS_ALLY_RETALIATION_PULSE_RADIUS + SS_PERF_MAX_ENEMY_RADIUS, "enemy", e => {
      if (!e || e.health <= 0 || currentlyAssigned.includes(e)) return;
      if (Number(e.retaliationTimer || 0) > 0 && !(e.retaliationType === attackerType && e.retaliationId === attackerId)) return;
      const d = Math.hypot(e.x - cx, e.z - cz);
      if (d <= SS_ALLY_RETALIATION_PULSE_RADIUS + Number(e.radius || 0.35)) nearby.push({ e, d });
    });
    nearby.sort((a,b) => a.d - b.d);
    for (const candidate of nearby) {
      if (open-- <= 0) break;
      ssSetEnemyRetaliation(candidate.e, attackerType, attackerId);
      currentlyAssigned.push(candidate.e);
    }
    for (const e of currentlyAssigned) e.retaliationTimer = SS_ALLY_RETALIATION_DURATION;
  }

  function ssMaybeTriggerAlliedRetaliation(struckEnemy, source) {
    if (!struckEnemy || struckEnemy.allegiance !== "enemy" || !source) return;
    const sourceUnitId = source.sourceUnitId || null;
    if (sourceUnitId) {
      const unit = ssSpawnedUnitById(sourceUnitId);
      if (unit && unit.alive && unit.ownerAllegiance === "player" && unit.kind === "lydian-angel") {
        ssAggroPulseFromAlliedAttacker(struckEnemy, "unit", unit.unitId);
        return;
      }
    }
    const sourceEnemyId = source.enemyId || null;
    if (sourceEnemyId) {
      const ally = ssEnemyById(sourceEnemyId);
      if (ally && ally.alive && ally.allegiance === "player") {
        ssAggroPulseFromAlliedAttacker(struckEnemy, "enemy", ally.enemyId);
      }
    }
  }

  function ssEnemyObjective(enemy) {
    if (!enemy || !enemy.alive) return null;

    // Hostile enemies pursue the base by default. Allied combatants only pull
    // a small local retaliation group after attacking first. Nurses are the sole
    // convenience exception: an enemy may swat a nurse already within immediate reach.
    if (enemy.allegiance === "enemy") {
      const retaliation = ssEnemyRetaliationObjective(enemy);
      if (retaliation) return retaliation;
      const convenientNurse = ssEnemyNurseConvenienceObjective(enemy);
      if (convenientNurse) return convenientNurse;
    }

    if (enemy.allegiance === "player") {
      let best = null;
      let bestDistance = Infinity;
      for (const hostile of ssLivingEnemies("enemy").filter(ssEnemyCanBePrimaryTowerTarget)) {
        const distance = Math.hypot(hostile.x - enemy.x, hostile.z - enemy.z);
        if (distance < bestDistance) {
          bestDistance = distance;
          best = hostile;
        }
      }
      return best ? { type: "enemy", id: best.enemyId, x: best.x, z: best.z, radius: best.radius, target: best } : null;
    }

    let bestDevice = null;
    let bestDeviceDistance = Infinity;
    const deviceAggroRange = Number(enemy.deviceAggroRange || 8.5);
    for (const device of ssNearbyPlacedDevices(enemy.x, enemy.z, deviceAggroRange)) {
      ssEnsureDeviceCombatState(device);
      if (device.health <= 0) continue;
      const distance = Math.hypot(device.x - enemy.x, device.z - enemy.z);
      if (distance < deviceAggroRange && distance < bestDeviceDistance) {
        bestDeviceDistance = distance;
        bestDevice = device;
      }
    }
    if (bestDevice) {
      const halfX = Number(bestDevice.footprintHalfX || 0.6);
      const halfZ = Number(bestDevice.footprintHalfZ || 0.6);
      const radius = Math.max(halfX, halfZ);
      return { type: "device", id: bestDevice.placedId, x: bestDevice.x, z: bestDevice.z, radius, target: bestDevice };
    }
    return { type: "castle", id: "castle", x: 0, z: 0, radius: SS_CASTLE_TOWER_CENTER + SS_CASTLE_TOWER_HALF, target: ssCastleCombat };
  }

  function ssResolveCachedEnemyObjective(enemy) {
    if (!enemy || !enemy.alive) return null;
    const type = enemy.objectiveCacheType || null;
    const id = enemy.objectiveCacheId || null;
    if (!type) return null;
    if (type === "castle") {
      if (enemy.allegiance !== "enemy" || Number(ssCastleCombat.health || 0) <= 0) return null;
      return { type:"castle", id:"castle", x:0, z:0, radius:SS_CASTLE_TOWER_CENTER + SS_CASTLE_TOWER_HALF, target:ssCastleCombat };
    }
    if (type === "device") {
      const device = ssDeviceById(id);
      if (!device || Number(device.health || 0) <= 0 || enemy.allegiance === device.ownerAllegiance) return null;
      return { type:"device", id:device.placedId, x:device.x, z:device.z, radius:Math.max(Number(device.footprintHalfX || 0.6), Number(device.footprintHalfZ || 0.6)), target:device };
    }
    if (type === "unit") {
      const unit = ssSpawnedUnitById(id);
      if (!unit || !unit.alive || !unit.attackable || unit.ownerAllegiance === enemy.allegiance) return null;
      if (enemy.allegiance === "enemy") {
        if (unit.kind === "ionian-nurse") {
          const convenience = ssEnemyNurseConvenienceObjective(enemy);
          if (!convenience || convenience.id !== unit.unitId) return null;
        } else if (!(Number(enemy.retaliationTimer || 0) > 0 && enemy.retaliationType === "unit" && enemy.retaliationId === unit.unitId)) return null;
      }
      return { type:"unit", id:unit.unitId, x:unit.x, z:unit.z, radius:unit.radius, target:unit };
    }
    if (type === "enemy") {
      const target = ssEnemyById(id);
      if (!target || !target.alive || target === enemy || target.allegiance === enemy.allegiance) return null;
      if (enemy.allegiance === "enemy" && !(Number(enemy.retaliationTimer || 0) > 0 && enemy.retaliationType === "enemy" && enemy.retaliationId === target.enemyId)) return null;
      return { type:"enemy", id:target.enemyId, x:target.x, z:target.z, radius:target.radius, target };
    }
    return null;
  }

  function ssEnemyObjectiveCached(enemy, dt) {
    enemy.objectiveRefreshTimer = Math.max(0, Number(enemy.objectiveRefreshTimer || 0) - Math.max(0, Number(dt || 0)));
    const cached = ssResolveCachedEnemyObjective(enemy);
    if (cached && enemy.objectiveRefreshTimer > 0) return cached;

    const objective = ssEnemyObjective(enemy);
    enemy.objectiveCacheType = objective?.type || null;
    enemy.objectiveCacheId = objective?.id || null;
    enemy.objectiveRefreshTimer = SS_PERF_ENEMY_OBJECTIVE_REFRESH_MIN +
      Math.random() * (SS_PERF_ENEMY_OBJECTIVE_REFRESH_MAX - SS_PERF_ENEMY_OBJECTIVE_REFRESH_MIN);
    return objective;
  }

  function ssMoveEnemyToward(enemy, targetX, targetZ, dt, stopDistance = 0) {
    const dx = targetX - enemy.x;
    const dz = targetZ - enemy.z;
    const distance = Math.hypot(dx, dz);
    if (distance <= stopDistance + 0.001) return 0;
    const step = Math.min(enemy.moveSpeed * dt, Math.max(0, distance - stopDistance));
    if (step <= 0 || distance <= 0.0001) return 0;
    const nx = dx / distance;
    const nz = dz / distance;
    const moved = ssMoveCharacterWithBuildingCollision(enemy, nx * step, nz * step, Math.max(0.08, Number(enemy.radius || 0.36)));
    enemy.y = ssGroundHeight(enemy.x, enemy.z);
    enemy.facing = Math.atan2(nx, -nz);
    enemy.bob += moved * 7.5;
    return moved;
  }

  function ssComputeCombatIsEngaged() {
    return ssPlacedDevices.some(device => {
      if (Number(device.health || SS_DEVICE_BASE_HEALTH) <= 0) return false;
      return String(device.typeId || "").startsWith("mode-") || ssIsLightPinger(device) || ssIsGooSpitter(device) || ssIsMendingLantern(device) || ssIsShadowTurret(device) || ssIsSludgeTurret(device) || ssIsMendingBeacon(device) || ssIsShadowCannon(device) || ssIsSludgeCannon(device) || ssIsMendingShrine(device) || ssIsShadowBattery(device) || ssIsSludgeArray(device) || ssIsMendingArtillery(device) || ssIsShadowArtillery(device) || ssIsSludgeArtillery(device);
    });
  }

  function ssCombatIsEngaged() {
    return ssCombatEngagedCached;
  }


  function ssFireSiegeProjectile(enemy, objective) {
    if (!enemy || !objective) return null;
    const dx = Number(objective.x || 0) - Number(enemy.x || 0);
    const dz = Number(objective.z || 0) - Number(enemy.z || 0);
    const distance = Math.hypot(dx, dz) || 1;
    const nx = dx / distance;
    const nz = dz / distance;
    enemy.facing = Math.atan2(nx, -nz);

    const muzzleX = enemy.x + nx * 0.44;
    const muzzleZ = enemy.z + nz * 0.44;
    const muzzleY = enemy.y + 1.13;
    const projectile = ssSpawnProjectile({
      ownerId: enemy.enemyId,
      ownerAllegiance: enemy.allegiance,
      sourceKind: "enemy-siege",
      x: muzzleX,
      y: muzzleY,
      z: muzzleZ,
      targetId: objective.id,
      speed: Math.max(1, Number(enemy.projectileSpeed || 8.5)),
      damage: Math.max(0, Number(enemy.attackPower || 0)),
      color: enemy.allegiance === "player" ? "#8fd3ff" : "#ff9a55",
      radius: 0.18,
      hitRadius: 0.26,
      life: 4.5,
      meta: {
        kind: "enemy-siege-shot",
        enemyType: enemy.enemyType || "siege",
        targetKind: objective.type,
        structureDamageMultiplier: Math.max(0, Number(enemy.deviceDamageMultiplier || 1))
      }
    });
    return projectile;
  }



  function ssCastleApproachPoint(x, z) {
    const shapes = [
      { cx: 0, cz: 0, hx: SS_CASTLE_KEEP_HALF, hz: SS_CASTLE_KEEP_HALF },
      { cx: -SS_CASTLE_TOWER_CENTER, cz: -SS_CASTLE_TOWER_CENTER, hx: SS_CASTLE_TOWER_HALF, hz: SS_CASTLE_TOWER_HALF },
      { cx: -SS_CASTLE_TOWER_CENTER, cz: SS_CASTLE_TOWER_CENTER, hx: SS_CASTLE_TOWER_HALF, hz: SS_CASTLE_TOWER_HALF },
      { cx: SS_CASTLE_TOWER_CENTER, cz: -SS_CASTLE_TOWER_CENTER, hx: SS_CASTLE_TOWER_HALF, hz: SS_CASTLE_TOWER_HALF },
      { cx: SS_CASTLE_TOWER_CENTER, cz: SS_CASTLE_TOWER_CENTER, hx: SS_CASTLE_TOWER_HALF, hz: SS_CASTLE_TOWER_HALF }
    ];
    let best = { x: 0, z: 0 };
    let bestD2 = Infinity;
    for (const shape of shapes) {
      const px = ssClamp(Number(x || 0), shape.cx - shape.hx, shape.cx + shape.hx);
      const pz = ssClamp(Number(z || 0), shape.cz - shape.hz, shape.cz + shape.hz);
      const dx = Number(x || 0) - px;
      const dz = Number(z || 0) - pz;
      const d2 = dx * dx + dz * dz;
      if (d2 < bestD2) {
        bestD2 = d2;
        best = { x: px, z: pz };
      }
    }
    return best;
  }

  function ssUpdateTrainingEnemyAI(enemy, dt) {
    if (!enemy || !enemy.alive) return;
    if (Number(enemy.retaliationTimer || 0) > 0) {
      enemy.retaliationTimer = Math.max(0, Number(enemy.retaliationTimer || 0) - dt);
      if (enemy.retaliationTimer <= 0) ssClearEnemyRetaliation(enemy);
    }
    if (enemy.statuses?.fleeing) {
      enemy.targetType = "flee";
      enemy.targetId = null;
      enemy.attackTimer = 0;
      let dx = enemy.x;
      let dz = enemy.z;
      let distance = Math.hypot(dx, dz);
      if (distance < 0.25) {
        const a = Number(enemy.spawnAngle || 0);
        dx = Math.sin(a); dz = Math.cos(a); distance = 1;
      }
      const nx = dx / distance, nz = dz / distance;
      const oldSpeed = enemy.moveSpeed;
      enemy.moveSpeed = oldSpeed * SS_LOCRIAN_FLEE_SPEED_MULTIPLIER;
      ssMoveEnemyToward(enemy, enemy.x + nx * 12, enemy.z + nz * 12, dt, 0);
      enemy.moveSpeed = oldSpeed;
      if (Math.abs(enemy.x) >= SS_WORLD_HALF - 1.4 || Math.abs(enemy.z) >= SS_WORLD_HALF - 1.4) {
        enemy.alive = false;
        enemy.deathState = "fled";
        enemy.deathTimer = 0;
        enemy.respawnTimer = SS_TRAINING_ENEMY_RESPAWN_DELAY;
      }
      return;
    }
    if (enemy.statuses?.dancing) {
      enemy.targetType = "dance";
      enemy.targetId = null;
      enemy.attackTimer = 0;
      enemy.bob += dt * 12;
      return;
    }
    if (Number(enemy.statuses?.stunRemaining || 0) > 0) {
      enemy.targetType = "stunned";
      enemy.targetId = null;
      enemy.attackTimer = 0;
      return;
    }
    // Hostile wave enemies should always pressure the castle directly. The only
    // time they should deviate is when the existing objective logic diverts them
    // to a nearby device or retaliatory ally target.
    const engaged = true;

    const objective = ssEnemyObjectiveCached(enemy, dt);
    if (!objective) return;
    enemy.targetType = objective.type;
    enemy.targetId = objective.id;
    let inAttackRange = false;
    let stopDistance = enemy.radius + Number(objective.radius || 0) + enemy.attackRange;
    const castleApproach = objective.type === "castle" ? ssCastleApproachPoint(enemy.x, enemy.z) : null;
    const objectiveX = castleApproach ? castleApproach.x : objective.x;
    const objectiveZ = castleApproach ? castleApproach.z : objective.z;
    const distance = Math.hypot(objectiveX - enemy.x, objectiveZ - enemy.z);
    if (objective.type === "castle") {
      inAttackRange = ssCharacterGapToCastle(enemy.x, enemy.z, enemy.radius) <= enemy.attackRange + 0.06;
      stopDistance = 0;
    } else if (objective.type === "device") {
      inAttackRange = ssCharacterGapToDevice(enemy.x, enemy.z, enemy.radius, objective.target) <= enemy.attackRange + 0.02;
      stopDistance = 0;
    } else {
      inAttackRange = distance <= stopDistance;
    }
    if (!inAttackRange) {
      const moved = ssMoveEnemyToward(enemy, objectiveX, objectiveZ, dt, stopDistance);
      if (objective.type !== "castle") return;
      const castleGap = ssCharacterGapToCastle(enemy.x, enemy.z, enemy.radius);
      const touchingCastle = ssCharacterHitsCastle(enemy.x, enemy.z, Number(enemy.radius || 0.35) + Math.max(0.02, Number(enemy.attackRange || 0)));
      const blockedCastleAttackSlack = Math.max(0.32, Number(enemy.radius || 0.35) * 0.85);
      if (!(castleGap <= enemy.attackRange + 0.10 || touchingCastle || (moved <= 0.0001 && castleGap <= enemy.attackRange + blockedCastleAttackSlack))) return;
      inAttackRange = true;
    }

    enemy.attackTimer -= dt;
    if (enemy.attackTimer > 0) return;
    enemy.attackTimer = enemy.attackCooldown;
    enemy.attackVisualTimer = Math.max(0.08, Number(enemy.attackVisualDuration || 0.22));
    if (enemy.enemyType === "siege") {
      ssFireSiegeProjectile(enemy, objective);
    } else if (objective.type === "enemy") {
      ssApplyEnemyDamage(objective.target, enemy.attackPower, { enemyId: enemy.enemyId, enemyType: enemy.enemyType, sourceKind: "enemy-melee" });
    } else if (objective.type === "unit") {
      ssApplySpawnedUnitDamage(objective.target, enemy.attackPower, enemy);
    } else if (objective.type === "device") {
      const structureDamage = enemy.attackPower * Math.max(0, Number(enemy.deviceDamageMultiplier || 1));
      ssApplyDeviceDamage(objective.target, structureDamage, enemy);
    } else if (objective.type === "castle" && ssCastleCombat.health > 0) {
      ssCastleCombat.health = Math.max(0, ssCastleCombat.health - enemy.attackPower);
      ssCastleCombat.lastDamagedAt = ssCombatClock;
      ssAudioPlay("castle-hit", 0, 0, { variant: enemy.enemyType || "standard", volume:1.06, maxDistance:130 });
    }
  }

  function ssUpdateEnemies(dt) {
    for (const enemy of ssEnemies) {
      if (!enemy) continue;
      if (!enemy.alive) {
        // Real day/night enemies do not respawn in place. Keep advancing the
        // death timer only long enough for the death visual, then the normal
        // cleanup pass removes the entity.
        enemy.deathTimer = Number(enemy.deathTimer || 0) + dt;
        continue;
      }
      enemy.attackVisualTimer = Math.max(0, Number(enemy.attackVisualTimer || 0) - dt);
      ssUpdateEnemyStatuses(enemy, dt);
      if (!enemy.alive) continue;
      ssUpdateTrainingEnemyAI(enemy, dt);
    }
  }

  function ssNightSpawnRateForNight(nightNumber = ssDayNightDayNumber) {
    const night = ssDifficultyProfileNight(nightNumber);
    // Preserve the original spawn-rate curve, but evaluate it on the compressed
    // difficulty timeline. New N10 == old N15 (6.5/sec); new N11 == old N16 (7/sec).
    if (night <= 5) return 0.75 + (night - 1) * 0.25;
    if (night <= 10) return 1.75 + (night - 5) * 0.45;
    return Math.min(SS_MAX_NIGHT_SPAWN_RATE, 4.0 + (night - 10) * 0.5);
  }

    function ssDayNightPhaseDuration(phase = ssDayNightPhase) {
    if (phase === "dusk") return SS_DUSK_DURATION_SECONDS;
    if (phase === "night") return SS_NIGHT_DURATION_SECONDS;
    if (phase === "dawn") return SS_DAWN_DURATION_SECONDS;
    return SS_DAY_DURATION_SECONDS;
  }

  function ssDayNightClockLabel(seconds) {
    const whole = Math.max(0, Math.ceil(Number(seconds || 0)));
    const minutes = Math.floor(whole / 60);
    const secs = whole % 60;
    return `${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
  }

  function ssDayNightHudText() {
    const remaining = Math.max(0, ssDayNightPhaseDuration() - ssDayNightPhaseElapsed);
    const time = ssDayNightClockLabel(remaining);
    if (ssDayNightPhase === "night") return `NIGHT ${ssDayNightDayNumber}  •  ${time}`;
    if (ssDayNightPhase === "dusk") return `DUSK  •  ${time}`;
    if (ssDayNightPhase === "dawn") return `DAWN  •  ${time}`;
    return `DAY ${ssDayNightDayNumber}  •  ${time}`;
  }


  function ssDayNightCycleElapsed() {
    const day = SS_DAY_DURATION_SECONDS;
    const dusk = SS_DUSK_DURATION_SECONDS;
    const night = SS_NIGHT_DURATION_SECONDS;
    if (ssDayNightPhase === "dusk") return day + ssDayNightPhaseElapsed;
    if (ssDayNightPhase === "night") return day + dusk + ssDayNightPhaseElapsed;
    if (ssDayNightPhase === "dawn") return day + dusk + night + ssDayNightPhaseElapsed;
    return ssDayNightPhaseElapsed;
  }

  function ssDrawDayNightClock() {
    const day = SS_DAY_DURATION_SECONDS;
    const dusk = SS_DUSK_DURATION_SECONDS;
    const night = SS_NIGHT_DURATION_SECONDS;
    const dawn = SS_DAWN_DURATION_SECONDS;
    const total = day + dusk + night + dawn;
    const progress = ssClamp(ssDayNightCycleElapsed() / Math.max(0.001, total), 0, 0.999999);
    const cx = GAME_CANVAS_LOGICAL_WIDTH - 57;
    const cy = 57;
    const r = 42;
    const startAngle = -Math.PI / 2;

    ctx.save();

    ctx.fillStyle = "rgba(15,20,31,.84)";
    ctx.beginPath();
    ctx.arc(cx, cy, r + 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#f5e9a9";
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, -Math.PI / 2, Math.PI / 2, false);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#493766";
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, Math.PI / 2, Math.PI * 1.5, false);
    ctx.closePath();
    ctx.fill();

    for (let i = 0; i < 12; i += 1) {
      const a = startAngle + i * Math.PI * 2 / 12;
      const inner = r - (i % 3 === 0 ? 6 : 4);
      ctx.strokeStyle = i < 6 ? "rgba(74,55,20,.42)" : "rgba(255,255,255,.42)";
      ctx.lineWidth = i % 3 === 0 ? 1.5 : 1;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner);
      ctx.lineTo(cx + Math.cos(a) * (r - 1), cy + Math.sin(a) * (r - 1));
      ctx.stroke();
    }

    const handAngle = startAngle + progress * Math.PI * 2;
    ctx.strokeStyle = "rgba(20,24,35,.72)";
    ctx.lineWidth = 4.2;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(handAngle) * (r - 9), cy + Math.sin(handAngle) * (r - 9));
    ctx.stroke();

    ctx.strokeStyle = "#ef4444";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(handAngle) * (r - 9), cy + Math.sin(handAngle) * (r - 9));
    ctx.stroke();

    ctx.fillStyle = "#f8fafc";
    ctx.beginPath();
    ctx.arc(cx, cy, 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(15,20,31,.8)";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();
  }

  function ssDeviceUiColor(device) {
    if (!device) return "#79e2b4";
    if (device.hotbarColor) return String(device.hotbarColor);
    const typeId = String(device.typeId || "");
    const fragmentMeta = SS_FRAGMENT_ITEM_META[typeId];
    if (fragmentMeta?.hotbarColor) return fragmentMeta.hotbarColor;
    if (typeId.startsWith("mode-")) {
      const slug = typeId.slice(5).toLowerCase();
      const modeName = SS_MODE_NAMES.find(name => name.toLowerCase() === slug);
      if (modeName && SS_MODE_ITEM_META[modeName]?.hotbarColor) return SS_MODE_ITEM_META[modeName].hotbarColor;
    }
    return device.color || "#79e2b4";
  }

  function ssDrawDayBadge() {
    const w = 64;
    const h = 22;
    const x = GAME_CANVAS_LOGICAL_WIDTH - 178;
    const y = 12;

    ctx.save();
    ctx.fillStyle = "rgba(11,17,28,.92)";
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = "#26303d";
    ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
    ctx.strokeStyle = "rgba(255,255,255,.42)";
    ctx.lineWidth = 1.3;
    ctx.strokeRect(x + 0.65, y + 0.65, w - 1.3, h - 1.3);

    ctx.fillStyle = "#f6df77";
    ctx.font = "bold 10px Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(`DAY ${ssDayNightDayNumber}`, x + w * 0.5, y + h * 0.5 + 0.5);
    ctx.restore();
  }

  function ssDrawCastleHealthBar() {
    const mapRight = 110;
    const dayBadgeLeft = GAME_CANVAS_LOGICAL_WIDTH - 178;
    const iconW = 34;
    const x = mapRight + 10;
    const y = 12;
    const h = 22;
    const barX = x + iconW + 8;
    const w = Math.max(160, dayBadgeLeft - barX - 10);
    const maxHealth = Math.max(1, Number(ssCastleCombat.maxHealth || SS_CASTLE_BASE_HEALTH));
    const health = ssClamp(Number(ssCastleCombat.health || 0), 0, maxHealth);
    const pct = health / maxHealth;

    ctx.save();
    ctx.fillStyle = "rgba(11,17,28,.92)";
    ctx.fillRect(x, y, iconW, h);
    ctx.fillStyle = "#26303d";
    ctx.fillRect(x + 2, y + 2, iconW - 4, h - 4);
    ctx.fillStyle = pct > 0.35 ? "#d8c37b" : pct > 0.15 ? "#d09157" : "#d86a5f";
    ctx.fillRect(x + 6, y + 11, 6, 7);
    ctx.fillRect(x + 14, y + 8, 6, 10);
    ctx.fillRect(x + 22, y + 11, 6, 7);
    ctx.fillRect(x + 6, y + 6, 4, 3);
    ctx.fillRect(x + 15, y + 4, 4, 3);
    ctx.fillRect(x + 24, y + 6, 4, 3);
    ctx.strokeStyle = "rgba(255,255,255,.42)";
    ctx.lineWidth = 1.3;
    ctx.strokeRect(x + 0.65, y + 0.65, iconW - 1.3, h - 1.3);

    ctx.fillStyle = "rgba(11,17,28,.92)";
    ctx.fillRect(barX, y, w, h);
    ctx.fillStyle = "#2a3140";
    ctx.fillRect(barX + 3, y + 3, w - 6, h - 6);
    if (pct > 0.001) {
      const innerW = w - 6;
      const grd = ctx.createLinearGradient(barX + 3, 0, barX + w - 3, 0);
      grd.addColorStop(0, pct > 0.45 ? "#f0c44d" : pct > 0.2 ? "#e39b4f" : "#d26d58");
      grd.addColorStop(1, pct > 0.45 ? "#f6df77" : pct > 0.2 ? "#f0bf72" : "#e69a7e");
      ctx.fillStyle = grd;
      ctx.fillRect(barX + 3, y + 3, innerW * pct, h - 6);
    }
    ctx.strokeStyle = "rgba(255,255,255,.42)";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(barX + 0.75, y + 0.75, w - 1.5, h - 1.5);
    ctx.restore();
  }

  function ssDrawMiniMap() {
    const cx = 57;
    const cy = 57;
    const r = SS_MINIMAP_RADIUS;
    const innerR = r - 5;
    const scale = innerR / SS_MINIMAP_WORLD_RADIUS;
    const castleColor = "#ffd166";
    const playerColor = "#ffffff";

    ctx.save();
    ctx.fillStyle = "rgba(15,20,31,.84)";
    ctx.beginPath();
    ctx.arc(cx, cy, r + 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "rgba(218,231,239,.20)";
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,.18)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - innerR, cy); ctx.lineTo(cx + innerR, cy);
    ctx.moveTo(cx, cy - innerR); ctx.lineTo(cx, cy + innerR);
    ctx.stroke();

    ctx.font = "bold 9px Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(255,255,255,.92)";
    ctx.fillText("N", cx, cy - r + 9);

    const drawEdgeArrow = (dx, dz, color) => {
      const distance = Math.hypot(dx, dz);
      if (distance < 0.0001) return;
      const ux = dx / distance;
      const uy = dz / distance; // north is -Z, so negative Z naturally points upward
      const edge = r - 8;
      const px = cx + ux * edge;
      const py = cy + uy * edge;
      const sideX = -uy;
      const sideY = ux;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(px + ux * 5.4, py + uy * 5.4);
      ctx.lineTo(px - ux * 3.6 + sideX * 3.3, py - uy * 3.6 + sideY * 3.3);
      ctx.lineTo(px - ux * 3.6 - sideX * 3.3, py - uy * 3.6 - sideY * 3.3);
      ctx.closePath();
      ctx.fill();
    };

    const plot = (worldX, worldZ, color, kind) => {
      const dx = Number(worldX || 0) - ssPlayer.x;
      const dz = Number(worldZ || 0) - ssPlayer.z;
      const distance = Math.hypot(dx, dz);
      if (distance > SS_MINIMAP_WORLD_RADIUS) {
        drawEdgeArrow(dx, dz, color);
        return;
      }
      const px = cx + dx * scale;
      const py = cy + dz * scale;
      ctx.fillStyle = color;
      ctx.strokeStyle = "rgba(8,12,20,.78)";
      ctx.lineWidth = 1.2;
      if (kind === "castle") {
        ctx.beginPath();
        ctx.rect(px - 4.2, py - 3.5, 8.4, 7.0);
        ctx.fill(); ctx.stroke();
        ctx.fillRect(px - 5.2, py - 5.4, 2.4, 3.0);
        ctx.fillRect(px - 1.2, py - 5.4, 2.4, 3.0);
        ctx.fillRect(px + 2.8, py - 5.4, 2.4, 3.0);
      } else {
        ctx.beginPath();
        ctx.arc(px, py, 3.2, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      }
    };

    // Castle and towers are north-up world positions relative to the centered player.
    plot(0, 0, castleColor, "castle");
    for (const device of ssPlacedDevices) {
      if (!device || Number(device.health || 0) <= 0) continue;
      plot(device.x, device.z, ssDeviceUiColor(device), "tower");
    }

    // Player remains fixed in the center, but its triangular heading rotates to show facing.
    ctx.translate(cx, cy);
    ctx.rotate(Number(ssPlayer.facing || 0));
    ctx.fillStyle = playerColor;
    ctx.strokeStyle = "#2f8db3";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -7);
    ctx.lineTo(-4.6, 5);
    ctx.lineTo(0, 2.6);
    ctx.lineTo(4.6, 5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function ssClearEnemiesForDawn() {
    for (const enemy of ssEnemies) {
      if (enemy?.enemyId) ssEnemyLookup.delete(enemy.enemyId);
    }
    ssEnemies.length = 0;
    ssLivingEnemyCacheAll.length = 0;
    ssLivingEnemyCacheEnemy.length = 0;
    ssLivingEnemyCachePlayer.length = 0;
    ssEnemySpatialGrid.clear();
    for (let i = ssProjectiles.length - 1; i >= 0; i -= 1) {
      if (ssProjectiles[i]?.ownerAllegiance === "enemy") ssProjectiles.splice(i, 1);
    }
    for (const device of ssPlacedDevices) {
      if (Array.isArray(device.targetSlots)) device.targetSlots.fill(null);
    }
  }

  function ssSetDayNightPhase(nextPhase) {
    const previous = ssDayNightPhase;
    ssDayNightPhase = nextPhase;
    ssDayNightPhaseElapsed = 0;
    if (nextPhase !== previous) ssAudioPlay(`phase-${nextPhase}`, ssPlayer.x, ssPlayer.z, { spatial:false, volume:0.92, cooldown:0.1 });
    if (nextPhase === "night") {
      ssNightSpawnAccumulator = 0;
      if (typeof questionBox !== "undefined" && questionBox) questionBox.textContent = `NIGHT ${ssDayNightDayNumber} • DEFEND THE CASTLE`;
    } else if (nextPhase === "dawn") {
      // Dawn stops new spawns, but the night's surviving enemies remain active until
      // actual daytime begins.
      if (typeof questionBox !== "undefined" && questionBox) questionBox.textContent = "DAWN • HOLD UNTIL DAYLIGHT";
    } else if (nextPhase === "dusk") {
      if (typeof questionBox !== "undefined" && questionBox) questionBox.textContent = "DUSK • NIGHT APPROACHES";
    } else {
      if (previous === "dawn") {
        ssClearEnemiesForDawn();
        const nextDayNumber = ssDayNightDayNumber + 1;
        ssRespawnGatheredResourcesForNewDay(nextDayNumber);
        ssDayNightDayNumber = nextDayNumber;
      }
      if (typeof questionBox !== "undefined" && questionBox) questionBox.textContent = `DAY ${ssDayNightDayNumber} • GATHER • CRAFT • BUILD`;
    }
  }

  function ssUpdateDayNightLoop(dt) {
    ssDayNightPhaseElapsed += dt;
    if (ssDayNightPhase === "night") {
      const spawnRate = ssNightSpawnRateForNight(ssDayNightDayNumber);
      ssNightSpawnAccumulator += dt * spawnRate;
      // One spawn event at a time. If a slow frame creates backlog, preserve the
      // remainder and feed it out over subsequent frames instead of bursting a group.
      if (ssNightSpawnAccumulator >= 1) {
        ssNightSpawnAccumulator -= 1;
        ssSpawnNightEnemy(ssNightEnemySpawnIndex++);
      }
    }
    if (ssDayNightPhaseElapsed + 1e-6 < ssDayNightPhaseDuration()) return;
    if (ssDayNightPhase === "day") ssSetDayNightPhase("dusk");
    else if (ssDayNightPhase === "dusk") ssSetDayNightPhase("night");
    else if (ssDayNightPhase === "night") ssSetDayNightPhase("dawn");
    else ssSetDayNightPhase("day");
  }

  function ssCleanupDeadEnemies(dt) {
    ssDeadEnemyCleanupTimer -= dt;
    if (ssDeadEnemyCleanupTimer > 0) return;
    ssDeadEnemyCleanupTimer = 0.5;
    for (let i = ssEnemies.length - 1; i >= 0; i -= 1) {
      const enemy = ssEnemies[i];
      if (!enemy || enemy.alive || !enemy.removeAfterDeath) continue;
      if (Number(enemy.deathTimer || 0) < SS_DEAD_ENEMY_CLEANUP_DELAY) continue;
      ssEnemyLookup.delete(enemy.enemyId);
      ssEnemies.splice(i, 1);
    }
  }

  function ssUpdateProjectiles(dt) {
    for (let i = ssProjectiles.length - 1; i >= 0; i -= 1) {
      const projectile = ssProjectiles[i];
      projectile.age += dt;
      if (projectile.age >= projectile.life) {
        ssProjectiles.splice(i, 1);
        continue;
      }

      if (projectile.meta?.kind === "enemy-siege-shot") {
        const targetKind = String(projectile.meta?.targetKind || "");
        let target = null;
        let targetX = 0;
        let targetY = 0;
        let targetZ = 0;
        let targetRadius = 0.35;

        if (targetKind === "device") {
          target = ssDeviceById(projectile.targetId);
          if (target && Number(target.health || 0) > 0) {
            targetX = Number(target.x || 0);
            targetY = Number(target.y || 0) + Number(target.height || 1) * 0.58;
            targetZ = Number(target.z || 0);
            targetRadius = Math.max(0.24, Math.max(Number(target.footprintHalfX || 0.55), Number(target.footprintHalfZ || 0.55)));
          } else target = null;
        } else if (targetKind === "castle") {
          if (ssCastleCombat.health > 0) {
            target = ssCastleCombat;
            targetX = 0;
            targetY = SS_CASTLE_BASE_Y + 1.35;
            targetZ = 0;
            targetRadius = SS_CASTLE_TOWER_CENTER + SS_CASTLE_TOWER_HALF;
          }
        } else if (targetKind === "unit") {
          target = ssSpawnedUnitById(projectile.targetId);
          if (target && target.alive && target.ownerAllegiance !== projectile.ownerAllegiance) {
            targetX = Number(target.x || 0);
            targetY = Number(target.y || 0) + 0.45;
            targetZ = Number(target.z || 0);
            targetRadius = Math.max(0.20, Number(target.radius || 0.30));
          } else target = null;
        } else if (targetKind === "enemy") {
          target = ssEnemyById(projectile.targetId);
          if (target && target.alive && target.allegiance !== projectile.ownerAllegiance) {
            targetX = Number(target.x || 0);
            targetY = Number(target.y || 0) + 0.85;
            targetZ = Number(target.z || 0);
            targetRadius = Math.max(0.20, Number(target.radius || 0.35));
          } else target = null;
        }

        if (!target) {
          ssProjectiles.splice(i, 1);
          continue;
        }

        const dx = targetX - projectile.x;
        const dy = targetY - projectile.y;
        const dz = targetZ - projectile.z;
        const distance = Math.hypot(dx, dy, dz);
        const step = projectile.speed * dt;
        if (distance <= projectile.hitRadius + targetRadius || step >= distance) {
          const source = { sourceId: projectile.ownerId, enemyType: projectile.meta?.enemyType || null, sourceKind: projectile.sourceKind, projectileId: projectile.projectileId, sourceUnitId: projectile.meta?.angelUnitId || null };
          if (targetKind === "device") {
            const damage = projectile.damage * Math.max(0, Number(projectile.meta?.structureDamageMultiplier || 1));
            ssApplyDeviceDamage(target, damage, source);
          } else if (targetKind === "castle") {
            ssCastleCombat.health = Math.max(0, ssCastleCombat.health - projectile.damage);
            ssCastleCombat.lastDamagedAt = ssCombatClock;
            ssAudioPlay("castle-hit", 0, 0, { variant:"siege", volume:1.10, maxDistance:130 });
          } else if (targetKind === "unit") {
            ssApplySpawnedUnitDamage(target, projectile.damage, source);
          } else if (targetKind === "enemy") {
            ssApplyEnemyDamage(target, projectile.damage, source);
          }
          ssAudioPlay("projectile-impact", targetX, targetZ, { variant: projectile.meta?.element ? `${projectile.meta?.enemyType || projectile.sourceKind || "siege"}:${projectile.meta.element}` : (projectile.meta?.enemyType || projectile.sourceKind || "siege"), cooldownGroup: projectile.sourceKind || "siege", volume:0.96 });
          ssCombatEffects.push({
            effectId: `effect-${ssCombatSerial++}`,
            kind: "siege-impact",
            x: targetX,
            y: targetY,
            z: targetZ,
            age: 0,
            life: 0.30,
            radius: 0.48,
            color: projectile.ownerAllegiance === "player" ? "#bfe5ff" : "#ffc08d"
          });
          ssProjectiles.splice(i, 1);
          continue;
        }
        projectile.x += dx / Math.max(0.0001, distance) * step;
        projectile.y += dy / Math.max(0.0001, distance) * step;
        projectile.z += dz / Math.max(0.0001, distance) * step;
        continue;
      }

      if (projectile.meta?.targetKind === "castle" && Number(projectile.meta?.repairAmount || 0) > 0) {
        const maxHealth = Math.max(1, Number(ssCastleCombat.maxHealth || SS_CASTLE_BASE_HEALTH));
        if (Number(ssCastleCombat.health || 0) <= 0 || Number(ssCastleCombat.health || 0) >= maxHealth - 0.01) {
          ssProjectiles.splice(i, 1);
          continue;
        }
        const targetX = 0;
        const targetY = SS_CASTLE_BASE_Y + 1.35;
        const targetZ = 0;
        const dx = targetX - projectile.x;
        const dy = targetY - projectile.y;
        const dz = targetZ - projectile.z;
        const distance = Math.hypot(dx, dy, dz);
        const targetRadius = SS_CASTLE_TOWER_CENTER + SS_CASTLE_TOWER_HALF;
        const step = projectile.speed * dt;
        if (distance <= projectile.hitRadius + targetRadius || step >= distance) {
          const before = Number(ssCastleCombat.health || 0);
          ssCastleCombat.health = Math.min(maxHealth, before + Math.max(0, Number(projectile.meta?.repairAmount || 0)));
          const repaired = ssCastleCombat.health - before;
          if (repaired > 0) {
            ssAudioPlay("heal-impact", 0, 0, { variant: projectile.sourceKind || "mending", cooldownGroup: projectile.sourceKind || "mending", volume:0.66, maxDistance:80 });
            ssSpawnProjectilePolishImpact(projectile, targetX, targetY, targetZ, true);
          }
          ssProjectiles.splice(i, 1);
          continue;
        }
        projectile.x += dx / Math.max(0.0001, distance) * step;
        projectile.y += dy / Math.max(0.0001, distance) * step;
        projectile.z += dz / Math.max(0.0001, distance) * step;
        continue;
      }

      if (projectile.meta?.targetKind === "device") {
        const targetDevice = ssDeviceById(projectile.meta?.targetDeviceId || projectile.targetId);
        if (!targetDevice || Number(targetDevice.health || 0) <= 0 || Number(targetDevice.health || 0) >= Number(targetDevice.maxHealth || 0) - 0.01) {
          ssProjectiles.splice(i, 1);
          continue;
        }
        const targetY = Number(targetDevice.y || 0) + Number(targetDevice.height || 1) * 0.58;
        const dx = Number(targetDevice.x || 0) - projectile.x;
        const dy = targetY - projectile.y;
        const dz = Number(targetDevice.z || 0) - projectile.z;
        const distance = Math.hypot(dx,dy,dz);
        const targetRadius = Math.max(0.22, Math.min(
          Number(targetDevice.footprintHalfX || 0.55),
          Number(targetDevice.footprintHalfZ || 0.55)
        ));
        const step = projectile.speed * dt;
        if (distance <= projectile.hitRadius + targetRadius || step >= distance) {
          const repaired = ssRepairDevice(targetDevice, Math.max(0, Number(projectile.meta?.repairAmount || 0)));
          if (repaired > 0) {
            ssAudioPlay("heal-impact", targetDevice.x, targetDevice.z, { variant: projectile.sourceKind || "mending", cooldownGroup: projectile.sourceKind || "mending", volume:0.66 });
            ssSpawnProjectilePolishImpact(projectile, targetDevice.x, targetY, targetDevice.z, true);
          }
          ssProjectiles.splice(i,1);
          continue;
        }
        projectile.x += dx / Math.max(0.0001,distance) * step;
        projectile.y += dy / Math.max(0.0001,distance) * step;
        projectile.z += dz / Math.max(0.0001,distance) * step;
        continue;
      }

      const target = ssEnemyById(projectile.targetId);
      if (!target || !target.alive || target.allegiance === projectile.ownerAllegiance
          || (projectile.ownerAllegiance === "player" && target.killSpecialResolved)) {
        ssProjectiles.splice(i, 1);
        continue;
      }
      const targetY = target.y + 0.85;
      const dx = target.x - projectile.x;
      const dy = targetY - projectile.y;
      const dz = target.z - projectile.z;
      const distance = Math.hypot(dx, dy, dz);
      const step = projectile.speed * dt;
      if (distance <= projectile.hitRadius + target.radius || step >= distance) {
        const source = { sourceId: projectile.ownerId, enemyType: projectile.meta?.enemyType || null, sourceKind: projectile.sourceKind, projectileId: projectile.projectileId, sourceUnitId: projectile.meta?.angelUnitId || null };
        let primaryResult = { applied: 0, killed: false };
        if (projectile.splashRadius > 0) {
          const hits = ssApplyAreaDamage(target.x, target.z, projectile.splashRadius, projectile.damage, projectile.ownerAllegiance, source);
          primaryResult = hits.find(hit => hit.enemy === target) || primaryResult;
        } else {
          primaryResult = ssApplyEnemyDamage(target, projectile.damage, source);
        }
        ssAudioPlay("projectile-impact", target.x, target.z, { variant: projectile.meta?.element ? `${projectile.sourceKind || projectile.meta?.kind || "projectile"}:${projectile.meta.element}` : (projectile.sourceKind || projectile.meta?.kind || "projectile"), cooldownGroup: projectile.sourceKind || projectile.meta?.kind || "projectile", volume:0.76 });
        ssSpawnProjectilePolishImpact(projectile, target.x, targetY, target.z, false);
        if (projectile.onHit) projectile.onHit(target, projectile, primaryResult);
        if (primaryResult.killed && projectile.onKill) projectile.onKill(target, projectile);
        ssProjectiles.splice(i, 1);
        continue;
      }
      projectile.x += dx / distance * step;
      projectile.y += dy / distance * step;
      projectile.z += dz / distance * step;
    }
  }

  function ssCastleAmbientAnchors() {
    const damage = 1 - ssCastleHealthPct();
    if (damage < 0.40) return [];

    const anchors = [];
    const wallOuter = SS_CASTLE_KEEP_HALF + 0.22;
    const towerOuter = SS_CASTLE_TOWER_CENTER + SS_CASTLE_TOWER_HALF + 0.18;
    const lowY = SS_BASE_PLATFORM_HEIGHT + 0.10;
    const wallXs = [-2.20, -1.10, 0, 1.10, 2.20];
    const wallZs = [-2.20, -1.10, 0, 1.10, 2.20];

    for (const x of wallXs) {
      anchors.push({ x, y: lowY, z:  wallOuter, size: 0.46, nx:  0, nz:  1 });
      anchors.push({ x, y: lowY, z: -wallOuter, size: 0.46, nx:  0, nz: -1 });
    }
    for (const z of wallZs) {
      anchors.push({ x: -wallOuter, y: lowY, z, size: 0.46, nx: -1, nz:  0 });
      anchors.push({ x:  wallOuter, y: lowY, z, size: 0.46, nx:  1, nz:  0 });
    }

    for (const sx of [-1, 1]) {
      for (const sz of [-1, 1]) {
        const cx = sx * SS_CASTLE_TOWER_CENTER;
        const cz = sz * SS_CASTLE_TOWER_CENTER;
        anchors.push({ x: sx * towerOuter, y: lowY, z: cz - 0.42, size: 0.48, nx: sx, nz: 0 });
        anchors.push({ x: sx * towerOuter, y: lowY, z: cz + 0.42, size: 0.48, nx: sx, nz: 0 });
        anchors.push({ x: cx - 0.42, y: lowY, z: sz * towerOuter, size: 0.48, nx: 0, nz: sz });
        anchors.push({ x: cx + 0.42, y: lowY, z: sz * towerOuter, size: 0.48, nx: 0, nz: sz });
      }
    }

    if (damage >= 0.60) {
      const midY = SS_BASE_PLATFORM_HEIGHT + 0.58;
      for (const x of [-1.65, -0.55, 0.55, 1.65]) {
        anchors.push({ x, y: midY, z:  wallOuter, size: 0.52, nx: 0, nz:  1 });
        anchors.push({ x, y: midY, z: -wallOuter, size: 0.52, nx: 0, nz: -1 });
      }
      for (const z of [-1.65, -0.55, 0.55, 1.65]) {
        anchors.push({ x: -wallOuter, y: midY, z, size: 0.52, nx: -1, nz: 0 });
        anchors.push({ x:  wallOuter, y: midY, z, size: 0.52, nx:  1, nz: 0 });
      }
      for (const sx of [-1, 1]) {
        for (const sz of [-1, 1]) {
          const cx = sx * SS_CASTLE_TOWER_CENTER;
          const cz = sz * SS_CASTLE_TOWER_CENTER;
          anchors.push({ x: sx * towerOuter, y: midY, z: cz - 0.28, size: 0.54, nx: sx, nz: 0 });
          anchors.push({ x: sx * towerOuter, y: midY, z: cz + 0.28, size: 0.54, nx: sx, nz: 0 });
          anchors.push({ x: cx - 0.28, y: midY, z: sz * towerOuter, size: 0.54, nx: 0, nz: sz });
          anchors.push({ x: cx + 0.28, y: midY, z: sz * towerOuter, size: 0.54, nx: 0, nz: sz });
        }
      }
    }

    if (damage >= 0.80) {
      const groundY = SS_BASE_PLATFORM_HEIGHT + 0.05;
      for (const [x, z, nx, nz] of [
        [-4.25, -2.15, -1, 0], [-4.25, 0, -1, 0], [-4.25, 2.15, -1, 0],
        [ 4.25, -2.15,  1, 0], [ 4.25, 0,  1, 0], [ 4.25, 2.15,  1, 0],
        [-2.15, -4.25, 0, -1], [0, -4.25, 0, -1], [2.15, -4.25, 0, -1],
        [-2.15,  4.25, 0,  1], [0,  4.25, 0,  1], [2.15,  4.25, 0,  1]
      ]) anchors.push({ x, y: groundY, z, size: 0.60, nx, nz });
    }

    if (Number(ssCastleCombat.health || 0) <= 0.001) {
      const highY = SS_BASE_PLATFORM_HEIGHT + 1.02;
      for (const x of [-1.65, -0.55, 0.55, 1.65]) {
        anchors.push({ x, y: highY, z:  wallOuter, size: 0.60, nx: 0, nz:  1 });
        anchors.push({ x, y: highY, z: -wallOuter, size: 0.60, nx: 0, nz: -1 });
      }
      for (const z of [-1.65, -0.55, 0.55, 1.65]) {
        anchors.push({ x: -wallOuter, y: highY, z, size: 0.60, nx: -1, nz: 0 });
        anchors.push({ x:  wallOuter, y: highY, z, size: 0.60, nx:  1, nz: 0 });
      }
      for (const sx of [-1, 1]) {
        for (const sz of [-1, 1]) {
          const cx = sx * SS_CASTLE_TOWER_CENTER;
          const cz = sz * SS_CASTLE_TOWER_CENTER;
          anchors.push({ x: sx * towerOuter, y: highY, z: cz - 0.28, size: 0.64, nx: sx, nz: 0 });
          anchors.push({ x: sx * towerOuter, y: highY, z: cz + 0.28, size: 0.64, nx: sx, nz: 0 });
          anchors.push({ x: cx - 0.28, y: highY, z: sz * towerOuter, size: 0.64, nx: 0, nz: sz });
          anchors.push({ x: cx + 0.28, y: highY, z: sz * towerOuter, size: 0.64, nx: 0, nz: sz });
        }
      }
    }

    return anchors;
  }

    function ssCastleAmbientEffectCount(kind) {
    let count = 0;
    for (const effect of ssCombatEffects) {
      if (effect && effect.kind === kind) count += 1;
    }
    return count;
  }

  function ssSpawnCastleFireParticle(anchor, boost = 1) {
    if (!anchor) return;
    const size = Math.max(0.26, Number(anchor.size || 0.46)) * (0.92 + Math.random() * 0.34) * boost;
    const nx = Number(anchor.nx || 0);
    const nz = Number(anchor.nz || 0);
    const tx = -nz;
    const tz = nx;
    const lateral = (Math.random() - 0.5) * size * 0.86;
    const outward = 0.10 + Math.random() * 0.16;
    ssCombatEffects.push({
      effectId: `effect-${ssCombatSerial++}`,
      kind: "castle-fire-particle",
      x: Number(anchor.x || 0) + tx * lateral + nx * outward,
      y: Number(anchor.y || 0) + Math.random() * 0.05,
      z: Number(anchor.z || 0) + tz * lateral + nz * outward,
      vx: nx * (0.05 + Math.random() * 0.06) + tx * ((Math.random() - 0.5) * 0.05),
      vy: 0.70 + Math.random() * 0.28 + boost * 0.08,
      vz: nz * (0.05 + Math.random() * 0.06) + tz * ((Math.random() - 0.5) * 0.05),
      age: 0,
      duration: 0.95 + Math.random() * 0.34 + boost * 0.10,
      radius: size,
      alpha: 0.84 + Math.random() * 0.12
    });
  }

    function ssSpawnCastleSmokeParticle(anchor, boost = 1) {
    if (!anchor) return;
    const size = Math.max(0.25, Number(anchor.size || 0.46) * 0.64) * (0.94 + Math.random() * 0.32) * boost;
    const nx = Number(anchor.nx || 0);
    const nz = Number(anchor.nz || 0);
    const tx = -nz;
    const tz = nx;
    const lateral = (Math.random() - 0.5) * size * 1.00;
    const outward = 0.12 + Math.random() * 0.18;
    ssCombatEffects.push({
      effectId: `effect-${ssCombatSerial++}`,
      kind: "castle-smoke-particle",
      x: Number(anchor.x || 0) + tx * lateral + nx * outward,
      y: Number(anchor.y || 0) + Math.random() * 0.05,
      z: Number(anchor.z || 0) + tz * lateral + nz * outward,
      vx: nx * (0.04 + Math.random() * 0.05) + tx * ((Math.random() - 0.5) * 0.05),
      vy: 0.46 + Math.random() * 0.22 + boost * 0.04,
      vz: nz * (0.04 + Math.random() * 0.05) + tz * ((Math.random() - 0.5) * 0.05),
      age: 0,
      duration: 1.55 + Math.random() * 0.55 + boost * 0.16,
      radius: size,
      alpha: 0.46 + Math.random() * 0.16
    });
  }

    function ssUpdateCastleAmbientEffects(dt) {
    const damage = 1 - ssCastleHealthPct();
    if (damage < 0.40) {
      ssCastleAmbientFx.fireTimer = 0;
      ssCastleAmbientFx.smokeTimer = 0;
      ssCastleAmbientFx.burstDone = false;
      return;
    }

    const anchors = ssCastleAmbientAnchors();
    if (!anchors.length) return;
    const destroyed = Number(ssCastleCombat.health || 0) <= 0.001;
    const tier = destroyed ? 3 : damage >= 0.80 ? 2 : damage >= 0.60 ? 1 : 0;
    const fireCap = [28, 40, 56, 76][tier];
    const smokeCap = [20, 30, 42, 58][tier];
    const fireInterval = [0.038, 0.030, 0.022, 0.016][tier];
    const smokeInterval = [0.075, 0.060, 0.046, 0.032][tier];
    const fireBoost = [1.00, 1.18, 1.38, 1.62][tier];
    const smokeBoost = [1.00, 1.12, 1.28, 1.46][tier];

    ssCastleAmbientFx.fireTimer -= dt;
    ssCastleAmbientFx.smokeTimer -= dt;

    while (ssCastleAmbientFx.fireTimer <= 0 && ssCastleAmbientEffectCount("castle-fire-particle") < fireCap) {
      const anchor = anchors[ssCastleAmbientFx.anchorCursor % anchors.length];
      ssCastleAmbientFx.anchorCursor += 1;
      ssSpawnCastleFireParticle(anchor, fireBoost);
      ssCastleAmbientFx.fireTimer += fireInterval;
    }

    while (ssCastleAmbientFx.smokeTimer <= 0 && ssCastleAmbientEffectCount("castle-smoke-particle") < smokeCap) {
      const anchor = anchors[(ssCastleAmbientFx.anchorCursor + Math.floor(anchors.length / 3)) % anchors.length];
      ssCastleAmbientFx.anchorCursor += 1;
      ssSpawnCastleSmokeParticle(anchor, smokeBoost);
      ssCastleAmbientFx.smokeTimer += smokeInterval;
    }

    if (destroyed && !ssCastleAmbientFx.burstDone) {
      ssCastleAmbientFx.burstDone = true;
      const burstCount = Math.min(18, anchors.length);
      for (let i = 0; i < burstCount; i += 1) {
        const anchor = anchors[(i * 2) % anchors.length];
        ssSpawnCastleFireParticle(anchor, 1.80);
        if ((i & 1) === 0) ssSpawnCastleSmokeParticle(anchor, 1.56);
      }
    }
  }

    function ssUpdateCombatEffects(dt) {
    for (let i = ssCombatEffects.length - 1; i >= 0; i -= 1) {
      const effect = ssCombatEffects[i];
      effect.age += dt;
      if (effect.kind === "castle-fire-particle" || effect.kind === "castle-smoke-particle") {
        effect.x += Number(effect.vx || 0) * dt;
        effect.y += Number(effect.vy || 0) * dt;
        effect.z += Number(effect.vz || 0) * dt;
        if (effect.kind === "castle-fire-particle") {
          effect.vx = Number(effect.vx || 0) * 0.95;
          effect.vz = Number(effect.vz || 0) * 0.95;
          effect.vy = Number(effect.vy || 0) + dt * 0.10;
        } else {
          effect.vx = Number(effect.vx || 0) * 0.985;
          effect.vz = Number(effect.vz || 0) * 0.985;
          effect.vy = Number(effect.vy || 0) + dt * 0.04;
        }
      }
      if (effect.age >= effect.duration) ssCombatEffects.splice(i, 1);
    }
  }

  function ssUpdatePoisonTerrainPanels(dt) {
    if (!ssPoisonTerrainPanels.size) return;
    for (const enemy of ssLivingEnemies("enemy")) {
      if (!ssEnemyCanBePrimaryTowerTarget(enemy)) continue;
      const panel = ssPoisonTerrainPanelAtWorld(enemy.x, enemy.z);
      if (!panel) continue;
      ssApplyEnemyDamage(enemy, Math.max(0, Number(panel.dps || 0)) * dt, {
        sourceId: panel.ownerId,
        sourceKind: "phrygian-poison-floor"
      });
    }
  }

  function ssUpdateSpawnedUnits(dt) {
    for (let i = ssSpawnedUnits.length - 1; i >= 0; i -= 1) {
      const unit = ssSpawnedUnits[i];
      if (!unit.alive || unit.health <= 0) {
        const owner = ssDeviceById(unit.ownerId);
        if (owner && Array.isArray(owner.spawnedUnitIds)) owner.spawnedUnitIds = owner.spawnedUnitIds.filter(id => id !== unit.unitId);
        ssSpawnedUnits.splice(i, 1);
        ssSpawnedUnitLookup.delete(unit.unitId);
        if (owner && ssIsPhrygianTower(owner)) ssSyncPhrygianTargets(owner);
        if (owner && ssIsIonianHospital(owner) && unit.kind === "ionian-nurse") {
          ssSyncIonianTargets(owner);
        }
        continue;
      }
      unit.age = Number(unit.age || 0) + dt;
      if (typeof unit.update === "function") unit.update(unit, dt);
    }
  }
  function ssUpdateCombat() {
    const now = performance.now();
    const dt = ssClamp((now - ssCombatLastTimestamp) / 1000, 0, 0.05);
    ssCombatLastTimestamp = now;
    ssCombatClock += dt;
    setScore(Math.round(ssCombatClock * 1000));
    ssUpdatePlayerSword(dt);

    ssRebuildBuildingCollisionGrid();
    ssUpdateDayNightLoop(dt);
    ssCombatEngagedCached = ssComputeCombatIsEngaged();

    ssUpdateEnemies(dt);
    ssCleanupDeadEnemies(dt);
    ssRefreshCombatCaches();

    for (const device of ssPlacedDevices) {
      ssEnsureDeviceCombatState(device);
      device.actionTimer = Math.max(0, Number(device.actionTimer || 0) - dt);
      if (!ssIsIonianHospital(device)) {
        for (let i = 0; i < device.targetSlots.length; i += 1) {
          const id = device.targetSlots[i];
          if (!id) continue;
          const enemy = ssEnemyById(id);
          if (!enemy || enemy.allegiance === device.ownerAllegiance || !ssEnemyCanBePrimaryTowerTarget(enemy)) device.targetSlots[i] = null;
        }
      }
    }

    ssUpdateFullModeDevices(dt);
    ssUpdatePartialScaleDevices(dt);
    ssUpdateProjectiles(dt);
    ssUpdateSpawnedUnits(dt);
    ssUpdateCastleAmbientEffects(dt);
    ssUpdateCombatEffects(dt);
    ssUpdatePoisonTerrainPanels(dt);

    if (Number(ssCastleCombat.health || 0) <= 0) endGame("Castle Destroyed.");
  }

  function ssAddDeviceHealthBar(device, basis) {
    device = ssEnsureDeviceCombatState(device);
    if (!device || Number(device.health || 0) <= 0) return;
    const maxHealth = Math.max(1, Number(device.maxHealth || SS_DEVICE_BASE_HEALTH));
    const pct = ssClamp(Number(device.health || 0) / maxHealth, 0, 1);
    const height = Math.max(0.8, Number(device.height || 1));
    const center = { x: device.x, y: device.y + height + 0.34, z: device.z };
    const barWidth = 1.18;
    const innerWidth = 1.08;
    ssAddBillboardRect(center, basis, barWidth, 0.18, "#101827", 0);
    if (pct > 0.001) {
      const fillWidth = innerWidth * pct;
      const shift = -(innerWidth - fillWidth) * 0.5;
      const fillCenter = ssBillboardPoint(center, basis, shift, 0, 0.025);
      ssAddBillboardRect(fillCenter, basis, fillWidth, 0.105, ssDeviceUiColor(device), 0);
    }
  }

  function ssAddEliteLevelBadge(enemy, basis, healthCenter) {
    if (!enemy?.isElite || enemy.allegiance === "player") return;
    const level = Math.max(1, Math.floor(Number(enemy.eliteLevel || 1)));
    // Keep distant battlefields clean: the gold bar/ring still communicates elite status.
    if (Math.hypot(enemy.x - ssPlayer.x, enemy.z - ssPlayer.z) > 18) return;
    const digits = String(level).length;
    const radius = digits >= 3 ? 0.275 : digits === 2 ? 0.235 : 0.205;
    const badgeCenter = ssBillboardPoint(healthCenter, basis, -0.72 - Math.max(0, digits - 1) * 0.035, 0, 0.012);
    const points = [];
    for (let i = 0; i < 8; i += 1) {
      const a = Math.PI / 8 + i * Math.PI * 2 / 8;
      points.push([Math.cos(a) * radius, Math.sin(a) * radius]);
    }
    ssAddBillboardShape(badgeCenter, basis, points, "#f2c94c", 1, 0.018);
    ssAddPixelBillboardText(String(level), badgeCenter, basis, {
      showPanel: false,
      textColor: "#241b05",
      cell: digits >= 3 ? 0.032 : digits === 2 ? 0.037 : 0.043,
      charGapFactor: 0.62
    });
  }

  function ssAddEnemyHealthBar(enemy, basis) {
    if (!enemy.alive) return;
    if (enemy.allegiance === "player" && enemy.killSpecialSourceKind === "dorian-convert") return;
    const pct = ssClamp(enemy.health / Math.max(1, enemy.maxHealth), 0, 1);
    const center = { x: enemy.x, y: enemy.y + Number(enemy.healthBarHeight || 2.35), z: enemy.z };
    ssAddBillboardRect(center, basis, 1.12, 0.18, "#101827", 0);
    if (pct > 0.001) {
      const fillWidth = 1.02 * pct;
      const shift = -(1.02 - fillWidth) * 0.5;
      const fillCenter = ssBillboardPoint(center, basis, shift, 0, 0.025);
      const healthColor = enemy.allegiance === "player" ? "#60a5fa" : (enemy.isElite ? "#f2c94c" : "#ef4444");
      ssAddBillboardRect(fillCenter, basis, fillWidth, 0.105, healthColor, 0);
    }
    ssAddEliteLevelBadge(enemy, basis, center);
  }

  const SS_DEVICE_RANGE_PREVIEW_NEAR_GAP = 3.5;

  function ssDeviceRangePreviewTypeId(device) {
    if (!device) return "";
    if (device.typeId) return String(device.typeId).toLowerCase();
    if (device.item?.id) return String(device.item.id).toLowerCase();
    if (device.instance?.mode) return `mode-${String(device.instance.mode).toLowerCase()}`;

  }

      "major2-2":SS_LIGHT_PINGER_DETECTION_RADIUS, "minor2-2":SS_GOO_SPITTER_DETECTION_RADIUS,
      "major3-3":SS_MENDING_LANTERN_DETECTION_RADIUS, "minor3-3":SS_SHADOW_TURRET_DETECTION_RADIUS, "minor2-3":SS_SLUDGE_TURRET_DETECTION_RADIUS,
      "major3-4":SS_MENDING_BEACON_DETECTION_RADIUS, "minor3-4":SS_SHADOW_CANNON_DETECTION_RADIUS, "minor2-4":SS_SLUDGE_CANNON_DETECTION_RADIUS,
      "major3-5":SS_MENDING_SHRINE_DETECTION_RADIUS, "minor3-5":SS_SHADOW_BATTERY_DETECTION_RADIUS, "minor2-5":SS_SLUDGE_ARRAY_DETECTION_RADIUS,
      "major3-6":SS_MENDING_ARTILLERY_DETECTION_RADIUS, "minor3-6":SS_SHADOW_ARTILLERY_DETECTION_RADIUS, "minor2-6":SS_SLUDGE_ARTILLERY_DETECTION_RADIUS,

  function ssSetAllDeviceRangePreview(value) {
    ssShowAllDeviceRanges = !!value;
    const b = document.getElementById("buttonY");
    if (b) b.classList.toggle("rangePreviewActive", ssShowAllDeviceRanges);
  }
  function ssToggleAllDeviceRangePreview() { ssSetAllDeviceRangePreview(!ssShowAllDeviceRanges); }

  function ssNearbyRangePreviewDevice() {
    let best=null,bestGap=Infinity;
    for (const d of ssPlacedDevices) {
      if (!d || Number(d.health || SS_DEVICE_BASE_HEALTH)<=0 || !(ssDeviceRangePreviewRadius(d)>0)) continue;
      const gap=ssPlacedDeviceSurfaceGap(d);
      if (gap<=SS_DEVICE_RANGE_PREVIEW_NEAR_GAP && gap<bestGap) { best=d; bestGap=gap; }
    }
    return best;
  }

  function ssAddDeviceRangePreviewRing(device,basis,options={}) {
    const radius=ssDeviceRangePreviewRadius(device); if (!(radius>0) || !basis) return false;
    const typeId=ssDeviceRangePreviewTypeId(device);
    const color=ssDeviceUiColor({...device,typeId});
    const placement=options.placement===true, all=options.all===true;
    const alpha=placement?0.52:all?0.34:0.48, thickness=placement?0.30:0.24;
    const inner=radius-thickness*0.5, outer=radius+thickness*0.5, seg=all?44:56, lift=0.065;
    for (let n=0;n<seg;n++) {
      const a0=n/seg*Math.PI*2,a1=(n+1)/seg*Math.PI*2,c0=Math.cos(a0),s0=Math.sin(a0),c1=Math.cos(a1),s1=Math.sin(a1);
      const pts=[[c0*inner,s0*inner],[c0*outer,s0*outer],[c1*outer,s1*outer],[c1*inner,s1*inner]].map(([x,z])=>{
        const wx=device.x+x,wz=device.z+z; return {x:wx,y:ssGroundHeight(wx,wz)+lift,z:wz};
      });
      ssAddPolygon(pts,color,basis,alpha,null,"range-preview");
    }
    return true;
  }

  function ssAddHorizontalRing(cx, cy, cz, innerRadius, outerRadius, color, basis, alpha = 1, yaw = 0, segments = 18) {
    const inner = Math.max(0.01, Number(innerRadius || 0.1));
    const outer = Math.max(inner + 0.01, Number(outerRadius || inner + 0.08));
    const count = Math.max(8, Math.floor(Number(segments || 18)));
    for (let i = 0; i < count; i += 1) {
      const a0 = yaw + (i / count) * Math.PI * 2;
      const a1 = yaw + ((i + 1) / count) * Math.PI * 2;
      ssAddPolygon([
        { x: cx + Math.cos(a0) * inner, y: cy, z: cz + Math.sin(a0) * inner },
        { x: cx + Math.cos(a0) * outer, y: cy, z: cz + Math.sin(a0) * outer },
        { x: cx + Math.cos(a1) * outer, y: cy, z: cz + Math.sin(a1) * outer },
        { x: cx + Math.cos(a1) * inner, y: cy, z: cz + Math.sin(a1) * inner }
      ], color, basis, alpha, null, "world");
    }
  }

  function ssAddLydianAscension(enemy, basis) {
    const t = Math.max(0, Number(enemy.deathTimer || 0));
    if (t > SS_LYDIAN_ASCEND_DURATION) return;
    const rise = t * 1.65;
    const fade = ssClamp(1 - Math.max(0, t - 1.85) / Math.max(0.1, SS_LYDIAN_ASCEND_DURATION - 1.85), 0, 1);
    if (fade <= 0) return;

    const yaw = Number(enemy.facing || 0);
    const y = Number(enemy.y || 0) + rise;
    ssAddBox(enemy.x, y, enemy.z, 0.74, 0.92, 0.48, "#e9f3ff", basis, yaw, { alpha: fade });
    ssAddBox(enemy.x, y + 0.92, enemy.z, 0.64, 0.58, 0.58, "#fff6ea", basis, yaw, { alpha: fade });

    const c = Math.cos(yaw), s = Math.sin(yaw);
    const localPoint = (lx, ly, lz) => ({
      x: enemy.x + lx * c - lz * s,
      y: y + ly,
      z: enemy.z + lx * s + lz * c
    });
    for (const side of [-1, 1]) {
      ssAddPolygon([
        localPoint(side * 0.28, 1.25, 0.05),
        localPoint(side * 1.10, 1.58, 0.10),
        localPoint(side * 0.92, 0.76, 0.13),
        localPoint(side * 0.30, 0.94, 0.08)
      ], "#f8fbff", basis, fade * 0.94, null, "world");
      ssAddPolygon([
        localPoint(side * 0.34, 1.10, 0.10),
        localPoint(side * 0.92, 0.88, 0.15),
        localPoint(side * 0.66, 0.55, 0.17),
        localPoint(side * 0.30, 0.82, 0.11)
      ], "#dbeafe", basis, fade * 0.82, null, "world");
    }
    ssAddHorizontalRing(enemy.x, y + 1.72, enemy.z, 0.33, 0.47, "#fff1a8", basis, fade, yaw + t * 0.65, 20);
    ssAddHorizontalRing(enemy.x, y + 1.725, enemy.z, 0.39, 0.54, "#ffffff", basis, fade * 0.28, yaw + t * 0.65, 20);
  }

  function ssEnemyAttackVisualState(enemy, defaultDuration = 0.22, windupWindow = 0.20) {
    const duration = Math.max(0.08, Number(enemy?.attackVisualDuration || defaultDuration));
    const postRemaining = ssClamp(Number(enemy?.attackVisualTimer || 0), 0, duration);
    const postProgress = postRemaining > 0 ? 1 - postRemaining / duration : 0;
    const strike = postRemaining > 0 ? Math.sin(postProgress * Math.PI) : 0;
    const attackTimer = Number(enemy?.attackTimer || 0);
    let windup = 0;
    if (postRemaining <= 0 && attackTimer > 0 && attackTimer <= windupWindow) {
      const t = 1 - attackTimer / Math.max(0.001, windupWindow);
      windup = t * t * (3 - 2 * t);
    }
    return { duration, windup, strike, active: windup > 0.01 || strike > 0.01 };
  }

  function ssAddEnemyAttackTrail(enemy, basis, color, size = 1, yOffset = 0.95) {
    const duration = Math.max(0.08, Number(enemy?.attackVisualDuration || 0.22));
    const remaining = ssClamp(Number(enemy?.attackVisualTimer || 0), 0, duration);
    if (remaining <= 0) return;
    const p = 1 - remaining / duration;
    const alpha = Math.sin(p * Math.PI) * 0.78;
    if (alpha <= 0.02) return;
    const center = { x: enemy.x, y: enemy.y + yOffset, z: enemy.z };
    const s = size * (0.82 + p * 0.28);
    const pts = [
      [-0.52*s, 0.44*s], [-0.18*s, 0.66*s], [0.24*s, 0.52*s], [0.56*s, 0.12*s]
    ];
    for (let i = 0; i < pts.length - 1; i += 1) {
      ssAddBillboardSegment(center, basis, pts[i][0], pts[i][1], pts[i+1][0], pts[i+1][1], 0.075*size, color, alpha, 0.08);
    }
  }

  function ssAddEnemyImpactBurst(enemy, basis, color, size = 1) {
    const duration = Math.max(0.08, Number(enemy?.attackVisualDuration || 0.22));
    const remaining = ssClamp(Number(enemy?.attackVisualTimer || 0), 0, duration);
    if (remaining <= duration * 0.45 || remaining <= 0) return;
    const t = (remaining - duration * 0.45) / Math.max(0.001, duration * 0.55);
    const r = size * (0.24 + (1-t) * 0.18);
    const c = { x: enemy.x, y: enemy.y + 0.14, z: enemy.z };
    ssAddBillboardSegment(c, basis, -r, 0, r, 0, 0.055*size, color, t*0.55, 0.04);
    ssAddBillboardSegment(c, basis, 0, -r*0.4, 0, r*0.55, 0.045*size, color, t*0.45, 0.05);
  }

    const walkSwing=dance?0:Math.sin(walk)*0.20,bodyBob=dance?Math.sin(danceAge*9.2)*0.075:Math.abs(Math.sin(walk))*0.03;
    const yaw=(enemy.facing||0)+(dance?Math.sin(danceAge*6.9)*0.68:0),y=enemy.y+bodyBob;

    ssAddBox(handX-fwdX*0.16,y+0.36+attack.windup*0.24,handZ-fwdZ*0.16,0.08,0.62,0.08,"#5d4128",basis,yaw,{alpha:deathFade});
    ssAddBox(handX-fwdX*0.33,y+0.58+attack.windup*0.22-attack.strike*0.12,handZ-fwdZ*0.33,0.38,0.20,0.11,metal,basis,yaw,{alpha:deathFade});
    ssAddBox(handX-fwdX*0.47,y+0.58+attack.windup*0.22-attack.strike*0.12,handZ-fwdZ*0.47,0.13,0.34,0.09,accent,basis,yaw,{alpha:deathFade});
    if(attack.active)ssAddEnemyAttackTrail(enemy,basis,"#f2c15e",0.88,0.92);
    if(enemy.alive&&!enemy.statuses?.dancing?.fatalDance)ssAddEnemyHealthBar(enemy,basis);
  }

  function ssAddSiegeEnemy(enemy,basis){

    ssAddBox(tubeCenterX+fwdX*0.10,y+1.14+brace*0.08,tubeCenterZ+fwdZ*0.10,0.36,0.36,0.24,metal,basis,yaw,{alpha:deathFade});
    const muzzleX=mountX-fwdX*0.84,muzzleZ=mountZ-fwdZ*0.84;
