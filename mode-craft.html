    ssLivingEnemyCacheAll.length = 0;
    ssLivingEnemyCacheEnemy.length = 0;
    ssLivingEnemyCachePlayer.length = 0;

    for (const enemy of ssEnemies) {
      if (!enemy || !enemy.alive) continue;
      ssLivingEnemyCacheAll.push(enemy);
      if (enemy.allegiance === "enemy") ssLivingEnemyCacheEnemy.push(enemy);

  function ssLivingEnemies(allegiance = null) {

  function ssEnemyCanBePrimaryTowerTarget(enemy) {
    if (!enemy || !enemy.alive) return false;

  function ssCollisionGridKey(ix, iz) {
    return `${ix},${iz}`;

  function ssCollisionGridIndex(value) {
    return Math.floor(Number(value || 0) / SS_PERF_BUILDING_GRID_CELL);
  }

  function ssRebuildBuildingCollisionGrid(force = false) {
    if (!force && !ssBuildingCollisionGridDirty) return;
    ssBuildingCollisionGridDirty = false;
    // Reuse the Map object. Building positions are static, so this now runs only when
    // a structure is placed, removed, or destroyed instead of once per animation frame.
    ssBuildingCollisionGrid.clear();
    for (const device of ssPlacedDevices) {
      if (!device || device.collisionMode === "none" || Number(device.health || 0) <= 0) continue;
      const halfX = Number(device.footprintHalfX ?? ((device.baseWidth || device.baseSize || 1.2) * 0.5));
      const halfZ = Number(device.footprintHalfZ ?? ((device.baseDepth || device.baseSize || 1.2) * 0.5));
      const pad = Math.hypot(halfX, halfZ) + 1.1;
      const minX = ssCollisionGridIndex(device.x - pad);
      const maxX = ssCollisionGridIndex(device.x + pad);
      const minZ = ssCollisionGridIndex(device.z - pad);
      const maxZ = ssCollisionGridIndex(device.z + pad);
      for (let ix = minX; ix <= maxX; ix += 1) {
        for (let iz = minZ; iz <= maxZ; iz += 1) {
          const key = ssCollisionGridKey(ix, iz);
          let bucket = ssBuildingCollisionGrid.get(key);
          if (!bucket) {
            bucket = [];
            ssBuildingCollisionGrid.set(key, bucket);
          }
          bucket.push(device);
        }
      }
    }
  }

  function ssNearbyPlacedDevices(x, z, radius = 0) {
    const r = Math.max(0, Number(radius || 0));
    const minX = ssCollisionGridIndex(x - r);
    const maxX = ssCollisionGridIndex(x + r);
    const minZ = ssCollisionGridIndex(z - r);
    const maxZ = ssCollisionGridIndex(z + r);
    const seen = new Set();
    const result = [];
    for (let ix = minX; ix <= maxX; ix += 1) {
      for (let iz = minZ; iz <= maxZ; iz += 1) {
        const bucket = ssBuildingCollisionGrid.get(ssCollisionGridKey(ix, iz));
        if (!bucket) continue;
        for (const device of bucket) {
          if (!device?.placedId || seen.has(device.placedId)) continue;
          seen.add(device.placedId);
          result.push(device);
        }
      }
    }
    return result;
  }

  function ssEnemyGridIndex(value) {
    return Math.floor(Number(value || 0) / SS_PERF_ENEMY_GRID_CELL);

  function ssEnemyGridKey(ix, iz) {

  function ssRebuildEnemySpatialGrid() {
    // Reuse bucket arrays rather than allocating a new Map/arrays every frame.
    for (const bucket of ssEnemySpatialGrid.values()) bucket.length = 0;
    for (const enemy of ssLivingEnemyCacheAll) {
      if (!enemy || !enemy.alive) continue;
      const key = ssEnemyGridKey(ssEnemyGridIndex(enemy.x), ssEnemyGridIndex(enemy.z));
      let bucket = ssEnemySpatialGrid.get(key);
      if (!bucket) {
        bucket = [];
        ssEnemySpatialGrid.set(key, bucket);
      }
      bucket.push(enemy);
    }
  }

  function ssForEachNearbyLivingEnemy(x, z, radius, allegiance, callback) {
    const r = Math.max(0, Number(radius || 0));
    const minX = ssEnemyGridIndex(x - r);
    const maxX = ssEnemyGridIndex(x + r);
    const minZ = ssEnemyGridIndex(z - r);
    const maxZ = ssEnemyGridIndex(z + r);
    for (let ix = minX; ix <= maxX; ix += 1) {
      for (let iz = minZ; iz <= maxZ; iz += 1) {
        const bucket = ssEnemySpatialGrid.get(ssEnemyGridKey(ix, iz));
        if (!bucket || bucket.length === 0) continue;
        for (const enemy of bucket) {
          if (!enemy || !enemy.alive) continue;
          if (allegiance && enemy.allegiance !== allegiance) continue;
          callback(enemy);
        }
      }
    }
  }

  function ssNearestLivingEnemy(x, z, radius, allegiance, predicate = null) {
    const r = Math.max(0, Number(radius || 0));
    const maxDistanceSq = r * r;
    let best = null;
    let bestDistanceSq = maxDistanceSq;
    ssForEachNearbyLivingEnemy(x, z, r + SS_PERF_MAX_ENEMY_RADIUS, allegiance, enemy => {
      if (predicate && !predicate(enemy)) return;
      const dx = enemy.x - x;
      const dz = enemy.z - z;
      const distanceSq = dx * dx + dz * dz;
      if (distanceSq <= bestDistanceSq) {
        bestDistanceSq = distanceSq;
        best = enemy;
      }
    });
    return best;
  }

  function ssOpposingAllegiance(allegiance) {
    return allegiance === "player" ? "enemy" : "player";
  }

  function ssAcquirePrimaryTargets(device, options = {}) {
    device = ssEnsureDeviceCombatState(device);
    if (!device) return [];
    const targetAllegiance = options.targetAllegiance || ssOpposingAllegiance(device.ownerAllegiance || "player");
    const maxTargets = Math.max(0, Math.min(
      Number(options.maxTargets ?? device.targetLimit ?? 1),
      device.isFullMode ? SS_FULL_MODE_TARGET_LIMIT : Number(device.targetLimit || 1)
    ));
    const range = Math.max(0, Number(options.range ?? device.detectionRadius ?? SS_DEVICE_DEFAULT_DETECTION_RADIUS));
    const rangeSq = range * range;
    const selected = [];

    // Preserve still-valid current targets first, matching the original lock-on behavior.
    for (const id of device.targetSlots) {
      if (!id || selected.length >= maxTargets) continue;
      const enemy = ssEnemyById(id);
      if (!enemy || enemy.allegiance !== targetAllegiance || !ssEnemyCanBePrimaryTowerTarget(enemy)) continue;
      const dx = enemy.x - device.x;
      const dz = enemy.z - device.z;
      if (dx * dx + dz * dz > rangeSq) continue;
      if (!selected.some(existing => existing.enemyId === enemy.enemyId)) selected.push(enemy);
    }

    // Search only spatial cells touching the tower's range. Maintain a tiny sorted
    // nearest list (maximum seven entries) instead of sorting the whole enemy army.
    const bestEnemies = [];
    const bestDistances = [];
    ssForEachNearbyLivingEnemy(device.x, device.z, range + SS_PERF_MAX_ENEMY_RADIUS, targetAllegiance, enemy => {
      if (!ssEnemyCanBePrimaryTowerTarget(enemy)) return;
      if (selected.some(existing => existing.enemyId === enemy.enemyId)) return;
      const dx = enemy.x - device.x;
      const dz = enemy.z - device.z;
      const distanceSq = dx * dx + dz * dz;
      if (distanceSq > rangeSq) return;

      let insertAt = bestDistances.length;
      while (insertAt > 0 && distanceSq < bestDistances[insertAt - 1]) insertAt -= 1;
      bestDistances.splice(insertAt, 0, distanceSq);
      bestEnemies.splice(insertAt, 0, enemy);
      const keep = Math.max(0, maxTargets - selected.length);
      if (bestEnemies.length > keep) {
        bestEnemies.pop();
        bestDistances.pop();
      }
    });

    for (const enemy of bestEnemies) {
      if (selected.length >= maxTargets) break;
      selected.push(enemy);
    }

    if (device.targetSlots.length !== device.targetLimit) device.targetSlots.length = device.targetLimit;
    for (let i = 0; i < device.targetLimit; i += 1) device.targetSlots[i] = selected[i]?.enemyId || null;
    return selected;
  }

  function ssPlayerXpNeededForNextLevel(level = ssPlayerProgress.level) {
    const lvl = Math.max(1, Math.floor(Number(level || 1)));
    return 100 + (lvl - 1) * 40;
  }

  function ssAwardPlayerXp(amount) {
    let gain = Math.max(0, Math.floor(Number(amount || 0)));
    if (gain <= 0) return 0;
    ssPlayerProgress.xp = Math.max(0, Math.floor(Number(ssPlayerProgress.xp || 0))) + gain;
    ssPlayerProgress.level = Math.max(1, Math.floor(Number(ssPlayerProgress.level || 1)));
    let needed = ssPlayerXpNeededForNextLevel(ssPlayerProgress.level);
    while (ssPlayerProgress.xp >= needed) {
      ssPlayerProgress.xp -= needed;
      ssPlayerProgress.level += 1;
      needed = ssPlayerXpNeededForNextLevel(ssPlayerProgress.level);
    }
    return gain;
  }

  function ssEnemyPlayerXpValue(enemy) {
    if (!enemy) return 0;
    const type = String(enemy.enemyType || "standard");
    const base = Math.max(1, Number(SS_PLAYER_XP_ENEMY[type] || SS_PLAYER_XP_ENEMY.standard || 3));
    if (!enemy.isElite) return Math.round(base);
    const eliteLevel = Math.max(1, Math.floor(Number(enemy.eliteLevel || 1)));
    return Math.max(1, Math.round(base * (1 + eliteLevel * 0.25)));
  }

  function ssPlayerSwordDamage() {
    const level = Math.max(1, Math.floor(Number(ssPlayerProgress.level || 1)));
    return SS_PLAYER_SWORD_DAMAGE * (1 + (level - 1) * SS_PLAYER_SWORD_DAMAGE_PER_LEVEL);
  }

  function ssApplyDeviceDamage(device, amount, source = null) {
    device = ssEnsureDeviceCombatState(device);
    if (!device || amount <= 0 || device.health <= 0) return 0;
    const applied = Math.min(device.health, Math.max(0, Number(amount || 0)));
    device.health -= applied;
    if (source?.enemyId) device.lastDamageSourceId = source.enemyId;
    device.lastDamagedAt = ssCombatClock;
    ssAudioPlay("structure-hit", device.x, device.z, { variant: source?.enemyType || source?.sourceKind || "device", volume: 0.96 });

    if (device.health <= 0) {
      if (!Array.isArray(device.sourceRecipes)) {
        device.sourceRecipes = device.sourceRecipe ? [{
          ...device.sourceRecipe,
          notes: Array.isArray(device.sourceRecipe.notes) ? device.sourceRecipe.notes.slice() : []
        }] : [];
      }

      // Destroy exactly ONE stack layer per depleted health bar. Damage never spills
      // through several stacked copies in a single hit. Destroyed stacks are not refunded.
      if (device.sourceRecipes.length > 1) {
        device.sourceRecipes.pop();
        device.stackCount = device.sourceRecipes.length;
        device.powerMultiplier = ssStackPowerMultiplier(device.stackCount);
        device.sourceRecipe = device.sourceRecipes[0] || null;
        device.health = Number(device.maxHealth || SS_DEVICE_BASE_HEALTH);
        device.actionTimer = Math.max(0, Number(device.actionTimer || 0));
      } else {
        const index = ssPlacedDevices.indexOf(device);
        if (index >= 0) ssPlacedDevices.splice(index, 1);
        if (device.placedId) ssDeviceLookup.delete(device.placedId);
        device.health = 0;
      }
      ssBuildingCollisionGridDirty = true;
    }
    return applied;
  }

  function ssRepairDevice(device, amount) {
    device = ssEnsureDeviceCombatState(device);
    if (!device || amount <= 0 || device.health <= 0) return 0;
    const before = device.health;
    device.health = Math.min(device.maxHealth, device.health + Math.max(0, Number(amount || 0)));
    return device.health - before;
  }

  function ssApplyEnemyDamage(enemy, amount, source = null, options = {}) {
    if (!enemy || !enemy.alive || amount <= 0) return { applied: 0, killed: false };
    if (enemy.killSpecialResolved) {
      // Mixolydian death-dancers and Dorian converted allies have already resolved
      // their killing blow. Dorian allies are lifetime-based, so their hidden health
      // pool is not another removal condition.
      return { applied: 0, killed: false };
    }
    const applied = Math.min(enemy.health, Math.max(0, Number(amount || 0)));
    enemy.health -= applied;
    enemy.lastHitAt = ssCombatClock;
    enemy.lastDamagedAt = ssCombatClock;
    enemy.lastDamageSourceId = source?.sourceId || source?.placedId || source?.enemyId || null;
    enemy.lastDamageSourceKind = source?.sourceKind || source?.kind || null;
    if (source?.sourceKind === "enemy-melee") {
      ssAudioPlay("melee-hit", enemy.x, enemy.z, { variant: source?.enemyType || enemy.enemyType || "standard", volume: 0.84 });
    }
    ssMaybeTriggerAlliedRetaliation(enemy, source);
    if (enemy.health <= 0) {
      ssKillEnemy(enemy, source, options);
      return { applied, killed: true };
    }
    return { applied, killed: false };
  }

  function ssKillEnemy(enemy, source = null, options = {}) {
    if (!enemy || !enemy.alive) return false;
    // Any hostile enemy defeated by the player's battlefield earns progression XP.
    // This is awarded exactly once because ssKillEnemy refuses already-dead enemies.
    if (enemy.allegiance === "enemy") ssAwardPlayerXp(ssEnemyPlayerXpValue(enemy));
    if (enemy.statuses?.dancing?.secondaryDance) {
      enemy.statuses.dancing = null;
      enemy.targetType = null;
      enemy.targetId = null;
    }
    enemy.health = 0;
    enemy.alive = false;
    enemy.deathState = options.deathState || "generic";
    ssAudioPlay("enemy-death", enemy.x, enemy.z, { variant: `${enemy.enemyType || enemy.deathState || "standard"}${enemy.isElite ? ":elite" : ""}`, volume: enemy.isElite ? 1.08 : 0.86 });
    enemy.deathTimer = 0;
    enemy.respawnTimer = Number.isFinite(Number(options.respawnDelay)) ? Number(options.respawnDelay) : SS_TRAINING_ENEMY_RESPAWN_DELAY;
    enemy.killedBySourceId = source?.sourceId || source?.placedId || null;
    enemy.killedBySourceKind = source?.sourceKind || source?.kind || null;
    return true;
  }

  function ssApplyEnemyPoison(enemy, options = {}) {
    if (!enemy || !enemy.alive) return null;
    const poison = {
      effectId: `effect-${ssCombatSerial++}`,
      sourceId: options.sourceId || null,
      dps: Math.max(0, Number(options.dps || 0)),
      attackReduction: ssClamp(Number(options.attackReduction || 0), 0, 0.95),
      remaining: options.permanent ? Infinity : Math.max(0, Number(options.duration || 0)),
      permanent: !!options.permanent
    };
    enemy.statuses.poisons.push(poison);
    return poison;
  }

  function ssApplyEnemySlow(enemy, options = {}) {
    if (!enemy || !enemy.alive) return null;
    const slow = {
      effectId: `effect-${ssCombatSerial++}`,
      sourceId: options.sourceId || null,
      factor: ssClamp(Number(options.factor ?? 1), 0.05, 1),
      remaining: Math.max(0, Number(options.duration || 0))
    };
    enemy.statuses.slows.push(slow);
    return slow;
  }

  function ssAddEnemyFear(enemy, amount, sourceId = null) {
    if (!enemy || !enemy.alive) return 0;
    enemy.statuses.fear = Math.max(0, Number(enemy.statuses.fear || 0) + Math.max(0, Number(amount || 0)));
    enemy.fearSourceId = sourceId;
    if (enemy.statuses.fear >= Number(enemy.statuses.fearThreshold || 100)) {
      enemy.statuses.fleeing = true;
      enemy.targetType = "flee";
      enemy.targetId = null;
      enemy.attackTimer = 0;
    }
    return enemy.statuses.fear;
  }

  function ssConvertEnemy(enemy, sourceId = null) {
    if (!enemy || !enemy.alive) return false;
    enemy.allegiance = "player";
    enemy.statuses.conversion = 100;
    enemy.convertedBySourceId = sourceId;
    enemy.conversionLifetimeRemaining = SS_DORIAN_CONVERTED_LIFETIME;
    // Converted enemies are temporary Dorian allies. Their lifetime, not a health bar,
    // determines how long they remain on the field.
    enemy.health = enemy.maxHealth;
    enemy.targetType = null;
    enemy.targetId = null;
    ssAudioPlay("convert", enemy.x, enemy.z, { variant: enemy.enemyType || "dorian", volume: 0.88 });
    return true;
  }

  function ssSetEnemyDancing(enemy, options = {}) {
    if (!enemy || !enemy.alive) return null;
    const previousAge = Number(enemy.statuses?.dancing?.age || 0);
    if (options.fatalDance) ssMarkKillSpecialResolved(enemy, "mixolydian-dance", options.sourceId || null);
    enemy.statuses.dancing = {
      sourceId: options.sourceId || null,
      age: options.preserveAge ? previousAge : 0,
      remaining: Math.max(0, Number(options.duration || 0)),
      spreadRadius: Math.max(0, Number(options.spreadRadius || 0)),
      spreadDelay: Math.max(0, Number(options.spreadDelay || SS_MIXOLYDIAN_DANCE_SPREAD_DELAY)),
      contagious: options.contagious === true,
      hasSpread: false,
      fatalDance: !!options.fatalDance,
      secondaryDance: !!options.secondaryDance
    };
    return enemy.statuses.dancing;
  }

  function ssSpawnProjectile(options = {}) {
    const projectile = {
      projectileId: `projectile-${ssCombatSerial++}`,
      ownerId: options.ownerId || null,
      ownerAllegiance: options.ownerAllegiance || "player",
      sourceKind: options.sourceKind || "device",
      x: Number(options.x || 0),
      y: Number(options.y || 0),
      z: Number(options.z || 0),
      targetId: options.targetId || null,
      speed: Math.max(0.1, Number(options.speed || 10)),
      damage: Math.max(0, Number(options.damage || 0)),
      splashRadius: Math.max(0, Number(options.splashRadius || 0)),
      color: options.color || "#ffffff",
      radius: Math.max(0.03, Number(options.radius || 0.12)),
      life: Math.max(0.05, Number(options.life || 5)),
      age: 0,
      hitRadius: Math.max(0.05, Number(options.hitRadius || 0.32)),
      onHit: typeof options.onHit === "function" ? options.onHit : null,
      onKill: typeof options.onKill === "function" ? options.onKill : null,
      meta: options.meta || {}
    };
    ssProjectiles.push(projectile);
    ssAudioProjectileLaunch(projectile);
    const ownerDevice = ssDeviceById(projectile.ownerId);
    if (ownerDevice) {
      ssEnsureDeviceCombatState(ownerDevice);
      ownerDevice.projectileIds.push(projectile.projectileId);
    }
    return projectile;
  }

  function ssApplyAreaDamage(x, z, radius, amount, ownerAllegiance = "player", source = null, options = {}) {
    const targetAllegiance = ssOpposingAllegiance(ownerAllegiance);
    const hits = [];
    const queryRadius = Math.max(0, Number(radius || 0)) + SS_PERF_MAX_ENEMY_RADIUS;
    ssForEachNearbyLivingEnemy(x, z, queryRadius, targetAllegiance, enemy => {
      const dx = enemy.x - x;
      const dz = enemy.z - z;
      const hitDistance = Math.max(0, Number(radius || 0)) + Number(enemy.radius || 0);
      if (dx * dx + dz * dz > hitDistance * hitDistance) return;
      const result = ssApplyEnemyDamage(enemy, amount, source, options);
      hits.push({ enemy, ...result });
    });
    return hits;
  }

  function ssRegisterSpawnedUnit(options = {}) {
    const unit = {
      unitId: `unit-${ssCombatSerial++}`,
      ownerId: options.ownerId || null,
      ownerAllegiance: options.ownerAllegiance || "player",
      kind: options.kind || "generic",
      x: Number(options.x || 0),
      y: Number(options.y || 0),
      z: Number(options.z || 0),
      health: Number(options.health || 1),
      maxHealth: Number(options.maxHealth || options.health || 1),
      radius: Math.max(0.05, Number(options.radius || 0.20)),
      speed: Math.max(0, Number(options.speed || 0)),
      facing: Number(options.facing || 0),
      targetId: options.targetId || null,
      alive: true,
      attackable: options.attackable !== false,
      age: 0,
      update: typeof options.update === "function" ? options.update : null,
      meta: options.meta || {}
    };
    ssSpawnedUnits.push(unit);
    ssSpawnedUnitLookup.set(unit.unitId, unit);
    const ownerDevice = ssDeviceById(unit.ownerId);
    if (ownerDevice) {
      ssEnsureDeviceCombatState(ownerDevice);
      ownerDevice.spawnedUnitIds.push(unit.unitId);
    }
    ssAudioPlay("summon-spawn", unit.x, unit.z, { variant: unit.kind || "summon", volume: unit.kind === "ionian-nurse" ? 0.48 : 0.72 });
    return unit;
  }

  function ssSpawnedUnitById(unitId) {
    return ssSpawnedUnitLookup.get(unitId) || null;
  }

  function ssLiveOwnedUnits(device, kind) {
    if (!device || !Array.isArray(device.spawnedUnitIds)) return [];
    const result = [];
    for (const id of device.spawnedUnitIds) {
      const unit = ssSpawnedUnitById(id);
      if (unit && unit.alive && (!kind || unit.kind === kind)) result.push(unit);
    }
    return result;
  }

  function ssApplySpawnedUnitDamage(unit, amount, source = null) {
    if (!unit || !unit.alive || amount <= 0 || unit.health <= 0) return 0;
    const applied = Math.min(unit.health, Math.max(0, Number(amount || 0)));
    unit.health -= applied;
    unit.lastDamageSourceId = source?.enemyId || source?.sourceId || null;
    unit.lastDamagedAt = ssCombatClock;
    const unitDown = unit.health <= 0;
    if (unitDown) unit.alive = false;
    ssAudioPlay(unitDown ? "ally-down" : "ally-hit", unit.x, unit.z, { variant: source?.enemyType || unit.kind || "ally", volume: unitDown ? 0.92 : 0.66 });
    return applied;
  }

  function ssAddCombatEffect(options = {}) {
    const effect = {
      effectId: `world-effect-${ssCombatSerial++}`,
      ownerId: options.ownerId || null,
      kind: options.kind || "generic",
      x: Number(options.x || 0),
      y: Number(options.y || 0),
      z: Number(options.z || 0),
      radius: Math.max(0, Number(options.radius || 0)),
      duration: Math.max(0, Number(options.duration || 0)),
      age: 0,
      color: options.color || "#ffffff",
      meta: options.meta || {}
    };
    ssCombatEffects.push(effect);
    const ownerDevice = ssDeviceById(effect.ownerId);
    if (ownerDevice) {
      ssEnsureDeviceCombatState(ownerDevice);
      ownerDevice.effectIds.push(effect.effectId);
    }
    return effect;
  }

  function ssUpdateEnemyStatuses(enemy, dt) {
    if (!enemy || !enemy.alive) return;

    if (enemy.allegiance === "player" && enemy.killSpecialSourceKind === "dorian-convert") {
      enemy.conversionLifetimeRemaining = Math.max(0, Number(enemy.conversionLifetimeRemaining || 0) - dt);
      if (enemy.conversionLifetimeRemaining <= 0) {
        ssAddCombatEffect({
          ownerId: enemy.convertedBySourceId || null,
          kind: "dorian-convert-expire",
          x: enemy.x,
          y: enemy.y + 0.75,
          z: enemy.z,
          radius: 0.9,
          duration: 0.42,
          color: "#2dd4bf",
          meta: {}
        });
        ssKillEnemy(enemy, { sourceId: enemy.convertedBySourceId || null, sourceKind: "dorian-expire" }, {
          deathState: "dorian-expire",
          respawnDelay: 0.8
        });
        return;
      }
    }

    const statuses = enemy.statuses;
    let poisonDps = 0;
    let attackReduction = 0;
    for (let i = statuses.poisons.length - 1; i >= 0; i -= 1) {
      const poison = statuses.poisons[i];
      poisonDps += Math.max(0, poison.dps);
      attackReduction = 1 - (1 - attackReduction) * (1 - ssClamp(poison.attackReduction, 0, 0.95));
      if (Number.isFinite(poison.remaining)) {
        poison.remaining -= dt;
        if (poison.remaining <= 0) statuses.poisons.splice(i, 1);
      }
    }
    if (poisonDps > 0) ssApplyEnemyDamage(enemy, poisonDps * dt, { sourceId: statuses.poisons[0]?.sourceId || null, sourceKind: "poison" });
    if (!enemy.alive) return;

    let slowFactor = 1;
    for (let i = statuses.slows.length - 1; i >= 0; i -= 1) {
      const slow = statuses.slows[i];
      slowFactor = Math.min(slowFactor, ssClamp(slow.factor, 0.05, 1));
      slow.remaining -= dt;
      if (slow.remaining <= 0) statuses.slows.splice(i, 1);
    }
    enemy.moveSpeed = enemy.baseMoveSpeed * slowFactor;
    enemy.attackPower = enemy.baseAttackPower * (1 - attackReduction);
    if (Number(statuses.stunRemaining || 0) > 0) {
      statuses.stunRemaining = Math.max(0, Number(statuses.stunRemaining || 0) - dt);
      enemy.moveSpeed = 0;
      enemy.attackPower = 0;
    }

    const dance = statuses.dancing;
    if (dance) {
      dance.age = Number(dance.age || 0) + dt;
      dance.remaining = Math.max(0, Number(dance.remaining || 0) - dt);

      // Only the original kill-dancer can spread the effect, and it does so once.
      // Secondary dancers never propagate the status onward.
      if (dance.fatalDance && dance.contagious && !dance.hasSpread && dance.age >= dance.spreadDelay) {
        dance.hasSpread = true;
        ssForEachNearbyLivingEnemy(enemy.x, enemy.z, dance.spreadRadius + SS_PERF_MAX_ENEMY_RADIUS, enemy.allegiance, other => {
          if (other === enemy || other.statuses?.dancing || other.killSpecialResolved) return;
          const dx = other.x - enemy.x;
          const dz = other.z - enemy.z;
          const maxDistance = dance.spreadRadius + Number(other.radius || 0);
          if (dx * dx + dz * dz <= maxDistance * maxDistance) {
            ssSetEnemyDancing(other, {
              sourceId: dance.sourceId,
              duration: SS_MIXOLYDIAN_SECONDARY_DANCE_DURATION,
              spreadRadius: 0,
              contagious: false,
              fatalDance: false,
              secondaryDance: true
            });
          }
        });
      }

      if (dance.remaining <= 0) {
        if (dance.fatalDance) {
          // The killing-blow victim was already dead for targeting purposes. Let
          // the dance animation finish, then remove it as the one dancer that dies.
          statuses.dancing = null;
          ssKillEnemy(enemy, { sourceId: dance.sourceId, sourceKind: "mixolydian-dance" });
          return;
        }
        // Secondary dancers simply recover and resume normal movement/combat.
        statuses.dancing = null;
        enemy.targetType = null;
        enemy.targetId = null;
        enemy.attackTimer = 0;
      }
    }
  }


  // ---------------------------------------------------------------------------

  function ssFullModeReleasePoint(device, target = null, unitRadius = 0.3, index = 0, count = 1) {
    if (!device) return { x: 0, z: 0, angle: 0 };
    const radius = Math.max(0.08, Number(unitRadius || 0.3));
    const halfX = Number(device.footprintHalfX ?? ((device.baseWidth || device.baseSize || 1.64) * 0.5));
    const halfZ = Number(device.footprintHalfZ ?? ((device.baseDepth || device.baseSize || 1.64) * 0.5));
    const releaseRadius = Math.hypot(halfX, halfZ) + radius + 0.18;
    const targetDx = target ? Number(target.x || 0) - Number(device.x || 0) : 0;
    const targetDz = target ? Number(target.z || 0) - Number(device.z || 0) : 0;
    const targetAngle = target && Math.hypot(targetDx, targetDz) > 0.001
      ? Math.atan2(targetDz, targetDx)
      : Number(device.yaw || 0);
    const laneOffset = Math.max(1, Number(count || 1)) > 1
      ? (Number(index || 0) - (Math.max(1, Number(count || 1)) - 1) * 0.5) * 0.11
      : 0;
    const angleOffsets = [0, 0.16, -0.16, 0.32, -0.32, 0.52, -0.52, 0.78, -0.78, 1.08, -1.08, Math.PI];
    for (const offset of angleOffsets) {
      const angle = targetAngle + laneOffset + offset;
      const x = Number(device.x || 0) + Math.cos(angle) * releaseRadius;
      const z = Number(device.z || 0) + Math.sin(angle) * releaseRadius;
      if (ssCharacterCanOccupyBuildingSpace(x, z, radius, { ignoreDeviceId: device.placedId })) {
        return { x, z, angle };
      }
    }
    const angle = targetAngle + laneOffset;
    return {
      x: Number(device.x || 0) + Math.cos(angle) * releaseRadius,
      z: Number(device.z || 0) + Math.sin(angle) * releaseRadius,
      angle
    };
  }


  // Phase 5B — Lydian Halo Tower
  // ---------------------------------------------------------------------------
  function ssIsLydianTower(device) {
    return !!device && device.typeId === "mode-lydian";
  }

  function ssLydianPrimaryDamage(device) {
    return SS_FULL_MODE_DAMAGE * Math.max(1, Number(device?.powerMultiplier || 1));
  }

  function ssSpawnLydianAngel(device, target = null) {
    if (!device) return null;
    const release = ssFullModeReleasePoint(device, target, SS_LYDIAN_ANGEL_RADIUS, 0, 1);
    const angle = release.angle;
    const x = release.x;
    const z = release.z;
    return ssRegisterSpawnedUnit({
      ownerId: device.placedId,
      ownerAllegiance: "player",
      kind: "lydian-angel",
      x,
      y: ssGroundCreatureSupportHeight(x, z, SS_LYDIAN_ANGEL_RADIUS) + 1.85,
      z,
      health: SS_LYDIAN_ANGEL_HEALTH,
      maxHealth: SS_LYDIAN_ANGEL_HEALTH,
      radius: SS_LYDIAN_ANGEL_RADIUS,
      speed: SS_LYDIAN_ANGEL_SPEED,
      facing: angle,
      targetId: null,
      attackable: true,
      meta: {
        attackTimer: 0.15,
        homeX: x,
        homeZ: z,
        hoverPhase: ssCombatClock,
        kills: 0,
        killLimit: SS_LYDIAN_ANGEL_KILL_LIMIT
      },
      update: ssUpdateLydianAngel
    });
  }

  function ssUpdateLydianAngel(unit, dt) {
    if (!unit || !unit.alive) return;
    unit.health = Math.max(0, Number(unit.health || 0) - dt);
    if (unit.health <= 0) {
      unit.alive = false;
      return;
    }
    if (Number(unit.meta?.kills || 0) >= Number(unit.meta?.killLimit || SS_LYDIAN_ANGEL_KILL_LIMIT)) {
      unit.alive = false;
      return;
    }
    const enemies = ssLivingEnemies("enemy")
      .filter(ssEnemyCanBePrimaryTowerTarget)
      .map(enemy => ({ enemy, distance: Math.hypot(enemy.x - unit.x, enemy.z - unit.z) }))
      .sort((a,b) => a.distance - b.distance);
    const target = enemies[0]?.enemy || null;
    unit.targetId = target?.enemyId || null;
    unit.meta.attackTimer = Math.max(0, Number(unit.meta.attackTimer || 0) - dt);

    if (target) {
      const dx = target.x - unit.x;
      const dz = target.z - unit.z;
      const distance = Math.hypot(dx, dz);
      if (distance > 0.001) unit.facing = Math.atan2(dx / distance, -(dz / distance));
      if (distance > SS_LYDIAN_ANGEL_ATTACK_RANGE) {
        const step = Math.min(unit.speed * dt, Math.max(0, distance - SS_LYDIAN_ANGEL_ATTACK_RANGE * 0.82));
        if (step > 0 && distance > 0.001) {
          ssMoveCharacterWithBuildingCollision(unit, dx / distance * step, dz / distance * step, Math.max(0.08, Number(unit.radius || SS_LYDIAN_ANGEL_RADIUS)));
        }
      } else if (unit.meta.attackTimer <= 0) {
        unit.meta.attackTimer = SS_LYDIAN_ANGEL_ATTACK_COOLDOWN;
        ssSpawnProjectile({
          ownerId: unit.ownerId,
          ownerAllegiance: "player",
          sourceKind: "lydian-angel-beam",
          x: unit.x,
          y: unit.y + 1.05,
          z: unit.z,
          targetId: target.enemyId,
          speed: SS_LYDIAN_ANGEL_BEAM_SPEED,
          damage: SS_LYDIAN_ANGEL_DAMAGE,
          splashRadius: 0,
          color: "#fff8b8",
          radius: 0.11,
          hitRadius: 0.28,
          life: 3,
          meta: { kind: "lydian-angel-beam", mode: "Lydian", angelUnitId: unit.unitId },
          onKill: () => {
            if (!unit.alive) return;
            unit.meta.kills = Number(unit.meta.kills || 0) + 1;
            if (unit.meta.kills >= Number(unit.meta.killLimit || SS_LYDIAN_ANGEL_KILL_LIMIT)) {
              ssAddCombatEffect({
                ownerId: unit.ownerId,
                kind: "lydian-angel-retire",
                x: unit.x, y: unit.y + 0.5, z: unit.z,
                radius: 1.0, duration: 0.65, color: "#fff1a8", meta: {}
              });
              unit.alive = false;
            }
          }
        });
      }
    } else {
      const homeX = Number(unit.meta.homeX || 0);
      const homeZ = Number(unit.meta.homeZ || 0);
      const dx = homeX - unit.x, dz = homeZ - unit.z;
      const distance = Math.hypot(dx, dz);
      if (distance > 2.2 && distance > 0.001) {
        const step = Math.min(unit.speed * 0.55 * dt, distance - 2.0);
        ssMoveCharacterWithBuildingCollision(unit, dx / distance * Math.max(0, step), dz / distance * Math.max(0, step), Math.max(0.08, Number(unit.radius || SS_LYDIAN_ANGEL_RADIUS)));
      }
    }
    unit.y = ssGroundCreatureSupportHeight(unit.x, unit.z, SS_LYDIAN_ANGEL_RADIUS) + 1.85
      + Math.sin(unit.age * 3.2 + Number(unit.meta.hoverPhase || 0)) * 0.16;
  }

  function ssMarkLydianAscension(enemy, projectile) {
    if (!enemy) return;
    enemy.deathState = "lydian-ascend";
    enemy.deathTimer = 0;
    enemy.respawnTimer = Math.max(Number(enemy.respawnTimer || 0), SS_LYDIAN_RESPAWN_DELAY);
    enemy.ascensionSourceId = projectile?.ownerId || null;

    const owner = ssDeviceById(projectile?.ownerId);
    if (owner && ssIsLydianTower(owner)) {
      owner.lydianHaloStack = Math.min(SS_LYDIAN_HALO_KILLS_REQUIRED, Number(owner.lydianHaloStack || 0) + 1);
    }
  }

  function ssFireLydianVolley(device) {
    device = ssEnsureDeviceCombatState(device);
    if (!device || device.health <= 0 || !ssIsLydianTower(device)) return 0;

    device.detectionRadius = SS_FULL_MODE_DETECTION_RADIUS;
    device.actionCooldown = SS_FULL_MODE_ACTION_COOLDOWN;
    if (device.actionTimer > 0) return 0;

    const targets = ssAcquirePrimaryTargets(device, {
      maxTargets: SS_FULL_MODE_TARGET_LIMIT,
      range: SS_FULL_MODE_DETECTION_RADIUS,
      targetAllegiance: "enemy"
    });
    if (!targets.length) return 0;

    // Seven earned kill-halos are visibly stored above this individual tower.
    // Its next normal firing action is replaced by an Angel summon, then the
    // stored halo stack resets to zero.
    if (Number(device.lydianHaloStack || 0) >= SS_LYDIAN_HALO_KILLS_REQUIRED) {
      device.actionTimer = device.actionCooldown;
      device.lydianHaloStack = 0;
      ssSpawnLydianAngel(device, targets[0] || null);
      ssAddCombatEffect({
        ownerId: device.placedId, kind: "lydian-angel-summon",
        x: device.x, y: Number(device.y || 0) + Number(device.height || 1.6) * 1.1, z: device.z,
        radius: 1.15, duration: 0.75, color: "#fff1a8", meta: {}
      });
      return 0;
    }

    device.actionTimer = device.actionCooldown;
    const originY = Number(device.y || 0) + 0.18 + Number(device.height || 1.6) * 1.02;
    const damage = ssLydianPrimaryDamage(device);
    const spreadRadius = Math.max(0.18, Math.min(Number(device.baseWidth || 1.6), Number(device.baseDepth || 1.6)) * 0.17);

    targets.forEach((target, index) => {
      const angle = (index / Math.max(1, targets.length)) * Math.PI * 2 + Number(device.yaw || 0);
      const ox = Math.cos(angle) * spreadRadius;
      const oz = Math.sin(angle) * spreadRadius;
      ssSpawnProjectile({
        ownerId: device.placedId,
        ownerAllegiance: device.ownerAllegiance || "player",
        sourceKind: "lydian-halo",
        x: device.x + ox,
        y: originY + (index % 2) * 0.08,
        z: device.z + oz,
        targetId: target.enemyId,
        speed: SS_FULL_MODE_PROJECTILE_SPEED,
        damage,
        splashRadius: 0,
        color: "#fff6b0",
        radius: 0.28,
        hitRadius: 0.34,
        life: 5,
        meta: { kind: "lydian-halo", mode: "Lydian" },
        onKill: (victim, projectile) => ssMarkLydianAscension(victim, projectile)
      });
    });
    return targets.length;
  }

  // ---------------------------------------------------------------------------
  // Phase 5C — Phrygian Snake Tower
  // ---------------------------------------------------------------------------
  function ssIsPhrygianTower(device) {
    return !!device && device.typeId === "mode-phrygian";
  }

  function ssPhrygianPrimaryDamage(device) {
    return SS_FULL_MODE_DAMAGE * Math.max(1, Number(device?.powerMultiplier || 1));
  }

  function ssLivePhrygianSnakes(device) {
    if (!device) return [];
    return ssLiveOwnedUnits(device, "phrygian-snake");
  }

  function ssSyncPhrygianTargets(device) {
    device = ssEnsureDeviceCombatState(device);
    if (!device) return [];
    const targets = ssAcquirePrimaryTargets(device, {
      maxTargets: SS_FULL_MODE_TARGET_LIMIT,
      range: SS_FULL_MODE_DETECTION_RADIUS,
      targetAllegiance: "enemy"
    });
    return targets.map(enemy => enemy.enemyId);
  }

  function ssTerrainCellAtWorld(x, z) {
    const step = SS_TERRAIN_STEP;
    const start = -SS_WORLD_HALF;
    const cells = Math.ceil((SS_WORLD_HALF * 2) / step);
    const ix = ssClamp(Math.floor((x - start) / step), 0, cells - 1);
    const iz = ssClamp(Math.floor((z - start) / step), 0, cells - 1);
    const x0 = start + ix * step;
    const x1 = Math.min(SS_WORLD_HALF, x0 + step);
    const z0 = start + iz * step;
    const z1 = Math.min(SS_WORLD_HALF, z0 + step);
    return { ix, iz, x0, x1, z0, z1, cx: (x0 + x1) * 0.5, cz: (z0 + z1) * 0.5, key: `${ix}:${iz}` };
  }

  function ssPoisonTerrainPanelAtWorld(x, z) {
    const cell = ssTerrainCellAtWorld(x, z);
    return ssPoisonTerrainPanels.get(cell.key) || null;
  }

  function ssCreatePermanentPoisonTerrainPanel(device, enemy) {
    if (!device || !enemy) return null;
    const cell = ssTerrainCellAtWorld(enemy.x, enemy.z);
    const existing = ssPoisonTerrainPanels.get(cell.key);
    const dps = SS_PHRYGIAN_POISON_PUDDLE_DPS * Math.max(1, Number(device.powerMultiplier || 1));
    const panel = existing || {
      key: cell.key, ix: cell.ix, iz: cell.iz, x0: cell.x0, x1: cell.x1, z0: cell.z0, z1: cell.z1,
      cx: cell.cx, cz: cell.cz, ownerId: device.placedId, createdAt: ssCombatClock, dps
    };
    panel.ownerId = device.placedId;
    panel.dps = Math.max(Number(panel.dps || 0), dps);
    ssPoisonTerrainPanels.set(cell.key, panel);
    return panel;
  }

  function ssCreatePhrygianPoisonKill(device, enemy) {
    if (!device || !enemy) return;
    ssAddCombatEffect({
      ownerId: device.placedId,
      kind: "phrygian-poison-burst",
      x: enemy.x,
      y: enemy.y + 0.45,
      z: enemy.z,
      radius: SS_PHRYGIAN_POISON_PUDDLE_RADIUS,
      duration: 0.55,
      color: "#8ed05d",
      meta: {}
    });
    ssCreatePermanentPoisonTerrainPanel(device, enemy);
  }

  function ssFindPhrygianRetarget(unit) {
    const owner = ssDeviceById(unit?.ownerId);
    if (!owner || owner.health <= 0) return null;
    return ssNearestLivingEnemy(
      owner.x,
      owner.z,
      SS_FULL_MODE_DETECTION_RADIUS,
      "enemy",
      ssEnemyCanBePrimaryTowerTarget
    );
  }

  function ssUpdatePhrygianSnake(unit, dt) {
    if (!unit || !unit.alive) return;
    const owner = ssDeviceById(unit.ownerId);
    if (!owner || owner.health <= 0) { unit.alive = false; return; }

    let target = ssEnemyById(unit.targetId);
    if (!target || target.allegiance !== "enemy" || !ssEnemyCanBePrimaryTowerTarget(target)) {
      target = ssFindPhrygianRetarget(unit);
      unit.targetId = target?.enemyId || null;
      if (!target) { unit.alive = false; return; }
    }

    const dx = target.x - unit.x;
    const dz = target.z - unit.z;
    const distance = Math.hypot(dx, dz);
    const biteDistance = target.radius + unit.radius + 0.10;
    if (distance <= biteDistance) {
      ssAudioPlay("projectile-impact", target.x, target.z, { variant:"phrygian-snake", cooldownGroup:"phrygian-snake", volume:0.86 });
      const result = ssApplyEnemyDamage(target, Number(unit.meta.damage || SS_FULL_MODE_DAMAGE), {
        sourceId: owner.placedId,
        sourceKind: "phrygian-snake"
      });
      if (result.killed) ssCreatePhrygianPoisonKill(owner, target);
      unit.alive = false;
      return;
    }

    if (distance > 0.0001) {
      const step = Math.min(SS_FULL_MODE_PROJECTILE_SPEED * dt, distance);
      ssMoveCharacterWithBuildingCollision(unit, dx / distance * step, dz / distance * step, Math.max(0.24, Number(unit.radius || SS_PHRYGIAN_SNAKE_RADIUS)));
      unit.y = ssGroundCreatureSupportHeight(unit.x, unit.z, Math.max(0.24, Number(unit.radius || SS_PHRYGIAN_SNAKE_RADIUS))) + 0.03;
      unit.facing = Math.atan2(dx / distance, -(dz / distance));
      unit.meta.wiggle = Number(unit.meta.wiggle || 0) + step * 7.8;
    }
  }

  function ssDeployPhrygianSnakes(device) {
    device = ssEnsureDeviceCombatState(device);
    if (!device || device.health <= 0 || !ssIsPhrygianTower(device)) return 0;
    device.detectionRadius = SS_FULL_MODE_DETECTION_RADIUS;
    device.actionCooldown = SS_FULL_MODE_ACTION_COOLDOWN;
    if (device.actionTimer > 0) return 0;

    const targets = ssAcquirePrimaryTargets(device, {
      maxTargets: SS_FULL_MODE_TARGET_LIMIT,
      range: SS_FULL_MODE_DETECTION_RADIUS,
      targetAllegiance: "enemy"
    });
    if (!targets.length) return 0;

    device.actionTimer = device.actionCooldown;
    const damage = ssPhrygianPrimaryDamage(device);

    targets.forEach((target, index) => {
      const release = ssFullModeReleasePoint(device, target, SS_PHRYGIAN_SNAKE_RADIUS, index, targets.length);
      const angle = release.angle;
      const x = release.x;
      const z = release.z;
      ssRegisterSpawnedUnit({
        ownerId: device.placedId,
        ownerAllegiance: "player",
        kind: "phrygian-snake",
        x,
        y: ssGroundCreatureSupportHeight(x, z, SS_PHRYGIAN_SNAKE_RADIUS) + 0.03,
        z,
        health: 1,
        maxHealth: 1,
        radius: SS_PHRYGIAN_SNAKE_RADIUS,
        speed: SS_FULL_MODE_PROJECTILE_SPEED,
        facing: angle,
        targetId: target.enemyId,
        attackable: false,
        update: ssUpdatePhrygianSnake,
        meta: { mode: "Phrygian", damage, wiggle: index * 0.9 }
      });
    });
    return targets.length;
  }

  // Phase 5D — Ionian Hospital
  function ssIsIonianHospital(device) {
    return !!device && device.typeId === "mode-ionian";
  }

  function ssIonianRepairRate(device) {
    return SS_IONIAN_REPAIR_PER_SECOND * Math.max(1, Number(device?.powerMultiplier || 1));
  }

  function ssLiveIonianNurses(device) {
    if (!device) return [];
    return ssLiveOwnedUnits(device, "ionian-nurse");
  }

  function ssIonianTargetKey(kind, id = null) {
    return `${kind}:${id ?? "main"}`;
  }

  function ssIonianCastleCarePoints() {
    const e = SS_IONIAN_CASTLE_CARE_EDGE;
    const points = [];
    for (const lane of SS_IONIAN_CASTLE_CARE_LANES) {
      points.push({ x:  e, z: lane });
      points.push({ x: -e, z: lane });
      points.push({ x: lane, z:  e });
      points.push({ x: lane, z: -e });
    }
    return points;
  }

  function ssIonianChooseCastleCarePoint(nurse) {
    const points = ssIonianCastleCarePoints();
    if (!points.length) return { x: SS_IONIAN_CASTLE_CARE_EDGE, z: 0 };
    const nx = Number(nurse?.x || 0);
    const nz = Number(nurse?.z || 0);
    points.sort((a, b) => Math.hypot(a.x - nx, a.z - nz) - Math.hypot(b.x - nx, b.z - nz));
    // Spread nurses among the nearest few safe wall positions rather than stacking
    // every responder on exactly the same point.
    const spread = Math.min(3, points.length);
    const slot = Math.max(0, Number(nurse?.meta?.homeIndex || 0)) % spread;
    return points[slot];
  }

  function ssIonianTargetDescriptor(hospital, kind, id = null) {
    if (!hospital) return null;

    if (kind === "castle") {
      const health = Number(ssCastleCombat.health || 0);
      const maxHealth = Math.max(1, Number(ssCastleCombat.maxHealth || SS_CASTLE_BASE_HEALTH));
      if (health <= 0 || health >= maxHealth - 0.01) return null;
      return {
        kind: "castle",
        id: "castle",
        key: ssIonianTargetKey("castle", "castle"),
        priority: 0,
        x: 0,
        z: 0,
        radius: SS_CASTLE_TOWER_CENTER + SS_CASTLE_TOWER_HALF,
        health,
        maxHealth,
        target: ssCastleCombat
      };
    }

    if (kind === "device") {
      const device = ssDeviceById(id);
      if (!device) return null;
      ssEnsureDeviceCombatState(device);
      if (device.health <= 0 || device.health >= device.maxHealth - 0.01) return null;
      return {
        kind: "device",
        id: device.placedId,
        key: ssIonianTargetKey("device", device.placedId),
        priority: 1,
        x: device.x,
        z: device.z,
        radius: Math.max(Number(device.footprintHalfX || 0.6), Number(device.footprintHalfZ || 0.6)),
        health: Number(device.health || 0),
        maxHealth: Math.max(1, Number(device.maxHealth || 1)),
        target: device
      };
    }

    if (kind === "ally-enemy") {
      const ally = ssEnemyById(id);
      if (!ally || !ally.alive || ally.allegiance !== "player") return null;
      if (Number(ally.health || 0) <= 0 || Number(ally.health || 0) >= Number(ally.maxHealth || 1) - 0.01) return null;
      return {
        kind: "ally-enemy",
        id: ally.enemyId,
        key: ssIonianTargetKey("ally-enemy", ally.enemyId),
        priority: 2,
        x: ally.x,
        z: ally.z,
        radius: Number(ally.radius || 0.45),
        health: Number(ally.health || 0),
        maxHealth: Math.max(1, Number(ally.maxHealth || 1)),
        target: ally
      };
    }

    if (kind === "nurse") {
      const unit = ssSpawnedUnitById(id);
      if (!unit || !unit.alive || unit.ownerAllegiance !== "player" || unit.kind !== "ionian-nurse") return null;
      if (Number(unit.health || 0) <= 0 || Number(unit.health || 0) >= Number(unit.maxHealth || 1) - 0.01) return null;
      return {
        kind: "nurse",
        id: unit.unitId,
        key: ssIonianTargetKey("nurse", unit.unitId),
        priority: 3,
        x: unit.x,
        z: unit.z,
        radius: Number(unit.radius || SS_IONIAN_NURSE_RADIUS),
        health: Number(unit.health || 0),
        maxHealth: Math.max(1, Number(unit.maxHealth || SS_IONIAN_NURSE_HEALTH)),
        target: unit
      };
    }

    if (kind === "ally-unit") {
      const unit = ssSpawnedUnitById(id);
      if (!unit || !unit.alive || unit.ownerAllegiance !== "player" || unit.kind === "ionian-nurse") return null;
      if (Number(unit.health || 0) <= 0 || Number(unit.health || 0) >= Number(unit.maxHealth || 1) - 0.01) return null;
      return {
        kind: "ally-unit",
        id: unit.unitId,
        key: ssIonianTargetKey("ally-unit", unit.unitId),
        priority: 2,
        x: unit.x,
        z: unit.z,
        radius: Number(unit.radius || 0.3),
        health: Number(unit.health || 0),
        maxHealth: Math.max(1, Number(unit.maxHealth || 1)),
        target: unit
      };
    }

    return null;
  }

  function ssIonianCurrentNurseTarget(hospital, nurse) {
    if (!hospital || !nurse) return null;
    const kind = nurse.meta?.targetKind || (nurse.meta?.targetDeviceId ? "device" : null);
    const id = nurse.meta?.targetRefId || nurse.meta?.targetDeviceId || nurse.targetId || null;
    if (!kind) return null;
    return ssIonianTargetDescriptor(hospital, kind, id);
  }

  function ssIonianClearNurseTarget(nurse) {
    if (!nurse) return;
    nurse.targetId = null;
    if (!nurse.meta) nurse.meta = {};
    nurse.meta.targetKind = null;
    nurse.meta.targetRefId = null;
    nurse.meta.targetDeviceId = null;
    nurse.meta.castleCareX = null;
    nurse.meta.castleCareZ = null;
    nurse.meta.state = "return";
  }

  function ssIonianAssignNurseTarget(nurse, target, options = {}) {
    if (!nurse) return;
    if (!target) {
      ssIonianClearNurseTarget(nurse);
      return;
    }
    nurse.targetId = target.id;
    if (!nurse.meta) nurse.meta = {};
    nurse.meta.targetKind = target.kind;
    nurse.meta.targetRefId = target.id;
    nurse.meta.targetDeviceId = target.kind === "device" ? target.id : null;
    if (target.kind === "castle") {
      const care = ssIonianChooseCastleCarePoint(nurse);
      nurse.meta.castleCareX = care.x;
      nurse.meta.castleCareZ = care.z;
    } else {
      nurse.meta.castleCareX = null;
      nurse.meta.castleCareZ = null;
    }
    nurse.meta.state = "repair";
    if (!options.noCommit) {
      nurse.meta.assignmentCommitTimer = SS_IONIAN_ASSIGN_COMMIT_MIN
        + Math.random() * (SS_IONIAN_ASSIGN_COMMIT_MAX - SS_IONIAN_ASSIGN_COMMIT_MIN);
    }
  }

  function ssIonianRepairTarget(target, amount) {
    if (!target || amount <= 0) return 0;
    const value = Math.max(0, Number(amount || 0));
    if (target.kind === "castle") {
      if (Number(ssCastleCombat.health || 0) <= 0) return 0;
      const before = Number(ssCastleCombat.health || 0);
      ssCastleCombat.health = Math.min(Number(ssCastleCombat.maxHealth || SS_CASTLE_BASE_HEALTH), before + value);
      const applied = ssCastleCombat.health - before;
      if (applied > 0) ssAudioPlay("nurse-heal", 0, 0, { variant:"castle", volume:0.48, maxDistance:80 });
      return applied;
    }
    if (target.kind === "device") {
      const applied = ssRepairDevice(target.target, value);
      if (applied > 0) ssAudioPlay("nurse-heal", target.x, target.z, { variant: target.target?.typeId || "device", volume:0.46 });
      return applied;
    }
    if (target.kind === "ally-enemy") {
      const ally = target.target;
      if (!ally || !ally.alive || ally.allegiance !== "player") return 0;
      const before = Number(ally.health || 0);
      ally.health = Math.min(Number(ally.maxHealth || 1), before + value);
      const applied = ally.health - before;
      if (applied > 0) ssAudioPlay("nurse-heal", ally.x, ally.z, { variant: ally.enemyType || "ally", volume:0.46 });
      return applied;
    }
    if (target.kind === "ally-unit") {
      const unit = target.target;
      if (!unit || !unit.alive || unit.ownerAllegiance !== "player" || unit.kind === "ionian-nurse") return 0;
      const before = Number(unit.health || 0);
      unit.health = Math.min(Number(unit.maxHealth || 1), before + value);
      return unit.health - before;
    }
    if (target.kind === "nurse") {
      const unit = target.target;
      if (!unit || !unit.alive || unit.ownerAllegiance !== "player" || unit.kind !== "ionian-nurse") return 0;
      const before = Number(unit.health || 0);
      unit.health = Math.min(Number(unit.maxHealth || SS_IONIAN_NURSE_HEALTH), before + value);
      return unit.health - before;
    }
    return 0;
  }

  function ssIonianAvailableTargets(hospital) {
    const candidates = [];
    const castle = ssIonianTargetDescriptor(hospital, "castle", "castle");
    if (castle) candidates.push(castle);

    for (const device of ssPlacedDevices) {
      const descriptor = ssIonianTargetDescriptor(hospital, "device", device?.placedId);
      if (descriptor) candidates.push(descriptor);
    }

    for (const ally of ssLivingEnemies("player")) {
      const descriptor = ssIonianTargetDescriptor(hospital, "ally-enemy", ally?.enemyId);
      if (descriptor) candidates.push(descriptor);
    }

    for (const unit of ssSpawnedUnits) {
      const descriptor = ssIonianTargetDescriptor(hospital, "ally-unit", unit?.unitId);
      if (descriptor) candidates.push(descriptor);
    }

    return candidates.sort((a, b) => {
      if (a.priority !== b.priority) return a.priority - b.priority;
      const ap = Number(a.health || 0) / Math.max(1, Number(a.maxHealth || 1));
      const bp = Number(b.health || 0) / Math.max(1, Number(b.maxHealth || 1));
      if (Math.abs(ap - bp) > 0.0001) return ap - bp;
      return Math.hypot(a.x - hospital.x, a.z - hospital.z) - Math.hypot(b.x - hospital.x, b.z - hospital.z);
    });
  }

  function ssSyncIonianTargets(hospital) {
    if (!hospital) return;
    ssEnsureDeviceCombatState(hospital);
    const keys = [];
    for (const nurse of ssLiveIonianNurses(hospital)) {
      const target = ssIonianCurrentNurseTarget(hospital, nurse);
      if (!target || keys.includes(target.key)) continue;
      keys.push(target.key);
      if (keys.length >= SS_FULL_MODE_TARGET_LIMIT) break;
    }
    hospital.targetSlots = Array.from({ length: SS_FULL_MODE_TARGET_LIMIT }, (_, i) => keys[i] || null);
  }

  function ssIonianHomePoint(hospital, nurse) {
    const index = Math.max(0, Number(nurse?.meta?.homeIndex || 0));
    const angle = Number(hospital?.yaw || 0) + (index / SS_FULL_MODE_TARGET_LIMIT) * Math.PI * 2;
    const radius = Math.max(Number(hospital?.footprintHalfX || 0.82), Number(hospital?.footprintHalfZ || 0.82)) + 0.62;
    const x = hospital.x + Math.cos(angle) * radius;
    const z = hospital.z + Math.sin(angle) * radius;
    return { x, z, y: ssGroundCreatureSupportHeight(x, z, SS_IONIAN_NURSE_RADIUS) + 0.025 };
  }

  function ssMoveNurseToward(unit, targetX, targetZ, dt, stopDistance = 0, options = {}) {
    const dx = targetX - unit.x;
    const dz = targetZ - unit.z;
    const distance = Math.hypot(dx, dz);
    if (distance <= stopDistance + 0.001) {
      if (unit.meta) unit.meta.stuckTimer = 0;
      return 0;
    }
    const step = Math.min(Math.max(0, Number(unit.speed || SS_IONIAN_NURSE_SPEED)) * dt, Math.max(0, distance - stopDistance));
    if (step <= 0 || distance <= 0.0001) return 0;
    if (!unit.meta) unit.meta = {};

    const nx = dx / distance;
    const nz = dz / distance;
    let moveX = nx;
    let moveZ = nz;

    // Roaming/patrolling nurses treat the castle as a broad keep-out island. If a
    // straight route would cut through that island, curve tangentially around it.
    // Castle responders opt out because they are deliberately approaching a safe
    // wall-side care position.
    if (!options.allowCastleApproach) {
      const currentR = Math.hypot(unit.x, unit.z);
      const targetR = Math.hypot(targetX, targetZ);
      const avoidR = SS_IONIAN_CASTLE_AVOID_RADIUS;
      let shouldSkirt = false;
      if (targetR >= avoidR * 0.94) {
        if (currentR < avoidR) {
          shouldSkirt = true;
        } else {
          const vx = targetX - unit.x;
          const vz = targetZ - unit.z;
          const len2 = vx * vx + vz * vz;
          if (len2 > 0.0001) {
            const t = Math.max(0, Math.min(1, -(unit.x * vx + unit.z * vz) / len2));
            const cx = unit.x + vx * t;
            const cz = unit.z + vz * t;
            shouldSkirt = Math.hypot(cx, cz) < avoidR;
          }
        }
      }
      if (shouldSkirt) {
        const radialLen = Math.max(0.001, currentR);
        const rx = unit.x / radialLen;
        const rz = unit.z / radialLen;
        const cross = unit.x * targetZ - unit.z * targetX;
        let side = Math.abs(cross) > 0.05 ? Math.sign(cross) : Number(unit.meta.castleRouteSide || 0);
        if (!side) side = Math.random() < 0.5 ? -1 : 1;
        unit.meta.castleRouteSide = side;
        const tx = -rz * side;
        const tz =  rx * side;
        const outward = Math.max(0, Math.min(1, (avoidR + 0.45 - currentR) / 0.9));
        moveX = nx * 0.34 + tx * 0.94 + rx * outward * 0.72;
        moveZ = nz * 0.34 + tz * 0.94 + rz * outward * 0.72;
        const skirtLen = Math.hypot(moveX, moveZ) || 1;
        moveX /= skirtLen;
        moveZ /= skirtLen;
      } else {
        unit.meta.castleRouteSide = 0;
      }
    }

    // If a nurse has failed to make forward progress for a short time, back away
    // from the obstruction, then take a randomized left/right shoulder around it.
    // This is intentionally local steering rather than pathfinding: cheap, readable,
    // and sufficient for the blocky player-built obstacles nurses encounter.
    let detourTimer = Math.max(0, Number(unit.meta.detourTimer || 0));
    if (detourTimer > 0) {
      const side = Number(unit.meta.detourSide || 1) >= 0 ? 1 : -1;
      const elapsed = SS_IONIAN_DETOUR_TIME - detourTimer;
      const px = -nz * side;
      const pz = nx * side;
      if (elapsed < SS_IONIAN_DETOUR_BACKUP_TIME) {
        moveX = -nx * 0.88 + px * 0.34;
        moveZ = -nz * 0.88 + pz * 0.34;
      } else {
        moveX = nx * 0.42 + px * 0.92;
        moveZ = nz * 0.42 + pz * 0.92;
      }
      const ml = Math.hypot(moveX, moveZ) || 1;
      moveX /= ml;
      moveZ /= ml;
      unit.meta.detourTimer = Math.max(0, detourTimer - dt);
    }

    const moved = ssMoveCharacterWithBuildingCollision(
      unit,
      moveX * step,
      moveZ * step,
      Math.max(SS_IONIAN_NURSE_RADIUS, Number(unit.radius || 0.24))
    );
    unit.y = ssGroundCreatureSupportHeight(unit.x, unit.z, Math.max(SS_IONIAN_NURSE_RADIUS, Number(unit.radius || 0.24))) + 0.025;
    unit.facing = Math.atan2(moveX, -moveZ);
    unit.meta.stepPhase = Number(unit.meta.stepPhase || 0) + moved * 8.4;

    if (Number(unit.meta.detourTimer || 0) > 0) {
      if (moved > Math.max(0.008, step * 0.22)) unit.meta.stuckTimer = 0;
      return moved;
    }

    if (moved < Math.max(0.006, step * 0.16)) {
      unit.meta.stuckTimer = Number(unit.meta.stuckTimer || 0) + dt;
      if (unit.meta.stuckTimer >= SS_IONIAN_STUCK_TRIGGER) {
        unit.meta.stuckTimer = 0;
        unit.meta.detourTimer = SS_IONIAN_DETOUR_TIME;
        unit.meta.detourSide = Math.random() < 0.5 ? -1 : 1;
      }
    } else {
      unit.meta.stuckTimer = Math.max(0, Number(unit.meta.stuckTimer || 0) - dt * 2.5);
    }
    return moved;
  }

  function ssIonianPatrolDeviceIds() {
    // Every living player-built device participates in patrol routes, including the
    // nurse's own Hospital. The castle is intentionally absent because it is not a
    // normal patrol destination; castle care remains an emergency-only assignment.
    return ssPlacedDevices
      .filter(device => device && Number(device.health || 0) > 0)
      .map(device => device.placedId);
  }

  function ssIonianPatrolSignature(ids = null) {
    const source = Array.isArray(ids) ? ids.slice() : ssIonianPatrolDeviceIds();
    source.sort((a, b) => String(a).localeCompare(String(b)));
    return source.join("|");
  }

  function ssIonianShufflePatrolIds(hospital, nurse, sourceIds = null) {
    const ids = Array.isArray(sourceIds) ? sourceIds.slice() : ssIonianPatrolDeviceIds();
    // Fisher-Yates independently for every nurse. One complete queue is one patrol
    // lap: every current building appears exactly once before another reshuffle.
    for (let i = ids.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      [ids[i], ids[j]] = [ids[j], ids[i]];
    }

    // Avoid beginning a fresh lap at the exact building just visited when there is
    // another option. This prevents visible A-B-A-B repetition on small bases.
    const lastId = nurse?.meta?.patrolLastDeviceId || null;
    if (ids.length > 1 && ids[0] === lastId) {
      const swapIndex = 1 + Math.floor(Math.random() * (ids.length - 1));
      [ids[0], ids[swapIndex]] = [ids[swapIndex], ids[0]];
    }

    if (!nurse.meta) nurse.meta = {};
    nurse.meta.patrolQueue = ids;
    nurse.meta.patrolIndex = 0;
    nurse.meta.patrolSignature = ssIonianPatrolSignature(ids);
    return ids;
  }

  function ssIonianEnsurePatrolTopology(hospital, nurse) {
    if (!hospital || !nurse) return false;
    if (!nurse.meta) nurse.meta = {};
    const ids = ssIonianPatrolDeviceIds();
    const signature = ssIonianPatrolSignature(ids);
    if (nurse.meta.patrolSignature === signature) return false;

    // A building was created or destroyed. Immediately generate a completely new
    // full-base route for this nurse. Current medical work is not interrupted; the
    // new patrol is used as soon as the nurse is free again.
    nurse.meta.patrolDeviceId = null;
    ssIonianShufflePatrolIds(hospital, nurse, ids);
    return true;
  }

  function ssIonianNextPatrolTarget(hospital, nurse) {
    if (!hospital || !nurse) return null;
    if (!nurse.meta) nurse.meta = {};
    ssIonianEnsurePatrolTopology(hospital, nurse);
    let queue = Array.isArray(nurse.meta.patrolQueue) ? nurse.meta.patrolQueue : [];
    // With only the nurse's own Hospital on the map, there is no meaningful patrol
    // route; fall through to the loose roaming behavior instead of orbiting one spot.
    if (queue.length === 1 && queue[0] === hospital.placedId) return null;
    let index = Math.max(0, Math.floor(Number(nurse.meta.patrolIndex || 0)));
    let attempts = 0;
    while (attempts < Math.max(1, queue.length + 1)) {
      if (!queue.length || index >= queue.length) {
        queue = ssIonianShufflePatrolIds(hospital, nurse);
        index = 0;
        if (!queue.length) return null;
      }
      const device = ssDeviceById(queue[index]);
      nurse.meta.patrolIndex = index + 1;
      index += 1;
      attempts += 1;
      if (!device || Number(device.health || 0) <= 0) continue;
      return {
        kind: "patrol-device",
        id: device.placedId,
        x: device.x,
        z: device.z,
        radius: Math.max(Number(device.footprintHalfX || 0.6), Number(device.footprintHalfZ || 0.6)),
        target: device
      };
    }
    return null;
  }

  function ssIonianSetPatrolTarget(hospital, nurse) {
    const patrol = ssIonianNextPatrolTarget(hospital, nurse);
    if (!nurse.meta) nurse.meta = {};
    if (!patrol) {
      nurse.meta.patrolDeviceId = null;
      nurse.meta.state = "roam";
      return null;
    }
    nurse.meta.patrolDeviceId = patrol.id;
    nurse.meta.state = "patrol";
    return patrol;
  }

  function ssIonianCurrentPatrolTarget(hospital, nurse) {
    ssIonianEnsurePatrolTopology(hospital, nurse);
    const id = nurse?.meta?.patrolDeviceId;
    const device = id ? ssDeviceById(id) : null;
    if (!device || Number(device.health || 0) <= 0) return null;
    return {
      kind: "patrol-device",
      id: device.placedId,
      x: device.x,
      z: device.z,
      radius: Math.max(Number(device.footprintHalfX || 0.6), Number(device.footprintHalfZ || 0.6)),
      target: device
    };
  }

  function ssIonianWasRecentlyAttacked(target) {
    const stamp = Number(target?.lastDamagedAt);
    return Number.isFinite(stamp) && ssCombatClock - stamp <= SS_IONIAN_ATTACK_AWARE_WINDOW;
  }

  function ssIonianIncomingDpsForTarget(descriptor) {
    if (!descriptor) return 0;
    let total = 0;
    for (const enemy of ssEnemies) {
      if (!enemy || !enemy.alive || enemy.allegiance !== "enemy") continue;
      const kind = enemy.targetType || enemy.objectiveCacheType || null;
      const id = enemy.targetId || enemy.objectiveCacheId || null;
      let matches = false;
      if (descriptor.kind === "device") matches = kind === "device" && id === descriptor.id;
      else if (descriptor.kind === "ally-enemy") matches = kind === "enemy" && id === descriptor.id;
      else if (descriptor.kind === "ally-unit") matches = kind === "unit" && id === descriptor.id;
      if (!matches) continue;
      const cadence = Math.max(0.03, Number(enemy.attackCooldown || 1));
      let damage = Math.max(0, Number(enemy.attackPower || 0));
      if (descriptor.kind === "device") damage *= Math.max(0, Number(enemy.deviceDamageMultiplier || 1));
      total += damage / cadence;
    }
    return total;
  }

  function ssIonianAssignedRepairForTarget(descriptor, ignoreNurseId = null) {
    if (!descriptor) return { count: 0, repairPerSecond: 0 };
    let count = 0;
    let repairPerSecond = 0;
    for (const nurse of ssAllLiveIonianNurses()) {
      if (!nurse || nurse.unitId === ignoreNurseId) continue;
      const kind = nurse.meta?.targetKind || null;
      const id = nurse.meta?.targetRefId || nurse.targetId || null;
      if (kind !== descriptor.kind || id !== descriptor.id) continue;
      count += 1;
      const owner = ssDeviceById(nurse.ownerId);
      repairPerSecond += owner && ssIsIonianHospital(owner) ? ssIonianRepairRate(owner) : SS_IONIAN_REPAIR_PER_SECOND;
    }
    return { count, repairPerSecond };
  }

  function ssIonianLocalNeedScore(descriptor, nurse) {
    if (!descriptor || !nurse) return -Infinity;
    const assignment = ssIonianAssignedRepairForTarget(descriptor, nurse.unitId);
    const incomingDps = ssIonianIncomingDpsForTarget(descriptor);
    const healthFraction = Math.max(0, Math.min(1, Number(descriptor.health || 0) / Math.max(1, Number(descriptor.maxHealth || 1))));
    const missingFraction = 1 - healthFraction;
    const unmetDps = Math.max(0, incomingDps - assignment.repairPerSecond);
    const coverage = assignment.count === 0 ? SS_IONIAN_COVERAGE_BONUS : 0;
    const critical = healthFraction < 0.25 ? 3.0 : healthFraction < 0.5 ? 1.4 : 0;
    return coverage + unmetDps + missingFraction * SS_IONIAN_HEALTH_URGENCY_WEIGHT + critical;
  }

  function ssIonianNearbyEmergency(hospital, nurse) {
    if (!hospital || !nurse) return null;
    const candidates = [];
    const add = descriptor => {
      if (!descriptor || !ssIonianWasRecentlyAttacked(descriptor.target)) return;
      const distance = Math.hypot(Number(descriptor.x || 0) - nurse.x, Number(descriptor.z || 0) - nurse.z);
      if (distance > SS_IONIAN_AWARENESS_RADIUS) return;
      const needScore = ssIonianLocalNeedScore(descriptor, nurse);
      if (!(needScore > 0)) return;
      candidates.push({ ...descriptor, distance, needScore });
    };

    for (const device of ssPlacedDevices) {
      if (!device) continue;
      add(ssIonianTargetDescriptor(hospital, "device", device.placedId));
    }
    for (const ally of ssLivingEnemies("player")) add(ssIonianTargetDescriptor(hospital, "ally-enemy", ally?.enemyId));
    for (const unit of ssSpawnedUnits) {
      if (!unit || unit.kind === "ionian-nurse") continue;
      add(ssIonianTargetDescriptor(hospital, "ally-unit", unit?.unitId));
    }

    candidates.sort((a, b) => {
      if (Math.abs(b.needScore - a.needScore) > 0.0001) return b.needScore - a.needScore;
      const ap = Number(a.health || 0) / Math.max(1, Number(a.maxHealth || 1));
      const bp = Number(b.health || 0) / Math.max(1, Number(b.maxHealth || 1));
      if (Math.abs(ap - bp) > 0.0001) return ap - bp;
      return a.distance - b.distance;
    });
    return candidates[0] || null;
  }

  function ssIonianNearbyWoundedNurse(hospital, nurse) {
    if (!hospital || !nurse) return null;
    const candidates = [];
    for (const other of ssAllLiveIonianNurses()) {
      if (!other || other.unitId === nurse.unitId) continue;
      const descriptor = ssIonianTargetDescriptor(hospital, "nurse", other.unitId);
      if (!descriptor) continue;
      const distance = Math.hypot(other.x - nurse.x, other.z - nurse.z);
      if (distance > SS_IONIAN_AWARENESS_RADIUS) continue;
      // One caregiver is enough for this deliberately low-priority recovery task.
      // If the battlefield needs that caregiver, normal emergency logic preempts it.
      const assignment = ssIonianAssignedRepairForTarget(descriptor, nurse.unitId);
      if (assignment.count > 0) continue;
      const healthFraction = Math.max(0, Math.min(1, Number(other.health || 0) / Math.max(1, Number(other.maxHealth || SS_IONIAN_NURSE_HEALTH))));
      candidates.push({ ...descriptor, distance, needScore: (1 - healthFraction) * 4 - distance * 0.06 });
    }
    candidates.sort((a, b) => {
      if (Math.abs(b.needScore - a.needScore) > 0.0001) return b.needScore - a.needScore;
      return a.distance - b.distance;
    });
    return candidates[0] || null;
  }

  function ssIonianBeginReaction(nurse, target) {
    if (!nurse || !target) return;
    if (!nurse.meta) nurse.meta = {};
    if (nurse.meta.pendingTargetKey === target.key) return;
    nurse.meta.pendingTargetKey = target.key;
    nurse.meta.pendingTargetKind = target.kind;
    nurse.meta.pendingTargetId = target.id;
    nurse.meta.reactionTimer = SS_IONIAN_REACTION_MIN + Math.random() * (SS_IONIAN_REACTION_MAX - SS_IONIAN_REACTION_MIN);
  }

  function ssIonianClearPendingReaction(nurse) {
    if (!nurse?.meta) return;
    nurse.meta.pendingTargetKey = null;
    nurse.meta.pendingTargetKind = null;
    nurse.meta.pendingTargetId = null;
    nurse.meta.reactionTimer = 0;
  }

  function ssIonianStartHold(nurse, target) {
    if (!nurse || !target) return;
    if (!nurse.meta) nurse.meta = {};
    nurse.meta.state = "hold";
    nurse.meta.holdKind = target.kind;
    nurse.meta.holdId = target.id;
    nurse.meta.holdX = target.kind === "castle" ? Number(nurse.x || 0) : Number(target.x || nurse.x);
    nurse.meta.holdZ = target.kind === "castle" ? Number(nurse.z || 0) : Number(target.z || nurse.z);
    nurse.meta.holdTimer = SS_IONIAN_POST_HEAL_HOLD_MIN + Math.random() * (SS_IONIAN_POST_HEAL_HOLD_MAX - SS_IONIAN_POST_HEAL_HOLD_MIN);
    nurse.targetId = null;
    nurse.meta.targetKind = null;
    nurse.meta.targetRefId = null;
    nurse.meta.targetDeviceId = null;
  }

  function ssIonianCastleEmergencyActive() {
    if (Number(ssCastleCombat.health || 0) <= 0) return false;
    const maxHealth = Number(ssCastleCombat.maxHealth || SS_CASTLE_BASE_HEALTH);
    return Number(ssCastleCombat.health || 0) < maxHealth - 0.01;
  }

  function ssAllLiveIonianNurses() {
    return ssSpawnedUnits.filter(unit => unit && unit.alive && unit.kind === "ionian-nurse" && unit.ownerAllegiance === "player");
  }


  function ssIonianDispatchReservation(nurse) {
    if (!nurse?.meta) return null;
    const kind = nurse.meta.targetKind || nurse.meta.pendingTargetKind || null;
    const id = nurse.meta.targetRefId || nurse.targetId || nurse.meta.pendingTargetId || null;
    if (!kind || !id) return null;
    const hospital = ssDeviceById(nurse.ownerId);
    return hospital ? ssIonianTargetDescriptor(hospital, kind, id) : null;
  }

  function ssIonianReservedRepairMap(nurses) {
    const map = new Map();
    for (const nurse of nurses) {
      const descriptor = ssIonianDispatchReservation(nurse);
      if (!descriptor || descriptor.kind === "castle") continue;
      const owner = ssDeviceById(nurse.ownerId);
      const rate = owner && ssIsIonianHospital(owner) ? ssIonianRepairRate(owner) : SS_IONIAN_REPAIR_PER_SECOND;
      const slot = map.get(descriptor.key) || { count: 0, repairPerSecond: 0, nurses: [] };
      slot.count += 1;
      slot.repairPerSecond += rate;
      slot.nurses.push(nurse);
      map.set(descriptor.key, slot);
    }
    return map;
  }

  function ssIonianActiveLocalDispatchTargets() {
    const hospital = ssPlacedDevices.find(ssIsIonianHospital) || null;
    if (!hospital) return [];
    const targets = [];
    const add = descriptor => {
      if (!descriptor || descriptor.kind === "castle" || !ssIonianWasRecentlyAttacked(descriptor.target)) return;
      const incomingDps = ssIonianIncomingDpsForTarget(descriptor);
      if (!(incomingDps > 0)) return;
      targets.push({ ...descriptor, incomingDps });
    };
    for (const device of ssPlacedDevices) add(ssIonianTargetDescriptor(hospital, "device", device?.placedId));
    for (const ally of ssLivingEnemies("player")) add(ssIonianTargetDescriptor(hospital, "ally-enemy", ally?.enemyId));
    for (const unit of ssSpawnedUnits) {
      if (!unit || unit.kind === "ionian-nurse") continue;
      add(ssIonianTargetDescriptor(hospital, "ally-unit", unit?.unitId));
    }
    return targets;
  }

  function ssIonianDispatchScore(target, nurse, reserved) {
    const owner = ssDeviceById(nurse.ownerId);
    const healRate = owner && ssIsIonianHospital(owner) ? ssIonianRepairRate(owner) : SS_IONIAN_REPAIR_PER_SECOND;
    const speed = Math.max(0.1, Number(nurse.speed || SS_IONIAN_NURSE_SPEED));
    const distance = Math.hypot(target.x - nurse.x, target.z - nurse.z);
    const eta = distance / speed;
    const health = Math.max(0, Number(target.health || 0));
    const maxHealth = Math.max(1, Number(target.maxHealth || 1));
    const healthFraction = health / maxHealth;
    const netDpsBeforeArrival = Math.max(0, target.incomingDps - reserved.repairPerSecond);
    const projectedHealth = health - netDpsBeforeArrival * eta;
    const uncoveredDps = Math.max(0, target.incomingDps - reserved.repairPerSecond);
    const coverageBonus = reserved.count === 0 ? 12 : 0;
    const lethalBonus = projectedHealth <= 0 ? 30 : projectedHealth <= maxHealth * 0.20 ? 12 : 0;
    const criticalBonus = healthFraction < 0.25 ? 8 : healthFraction < 0.5 ? 3 : 0;
    const usefulHealing = uncoveredDps > 0.05 || healthFraction < 0.62;
    if (!usefulHealing) return -Infinity;
    return coverageBonus + lethalBonus + criticalBonus + uncoveredDps * 2.1 + (1 - healthFraction) * 5 - eta * 0.8 + Math.min(2.5, healRate * 0.08);
  }

  function ssIonianRunDispatchNetwork() {
    if (ssCombatClock < Number(ssIonianNextDispatchAt || 0)) return;
    ssIonianNextDispatchAt = ssCombatClock + SS_IONIAN_DISPATCH_REFRESH;

    const nurses = ssAllLiveIonianNurses();
    if (!nurses.length) return;
    const hospital = ssPlacedDevices.find(ssIsIonianHospital) || null;
    if (!hospital) return;

    // Castle is the only instantaneous global preemption. Keep no more than 40%
    // reserved there so the rest of the network remains available locally.
    const castleTarget = ssIonianTargetDescriptor(hospital, "castle", "castle");
    const maxCastle = Math.max(1, Math.ceil(nurses.length * SS_IONIAN_CASTLE_MAX_FRACTION));
    let castleAssigned = nurses.filter(nurse => nurse.meta?.targetKind === "castle");
    if (!ssIonianCastleEmergencyActive()) {
      // Existing responders may finish repairing a damaged castle; no new nurses are
      // dispatched unless fresh castle damage is occurring.
    } else if (castleTarget && castleAssigned.length < maxCastle) {
      const candidates = nurses
        .filter(nurse => nurse.meta?.targetKind !== "castle")
        .sort((a, b) => Math.hypot(a.x, a.z) - Math.hypot(b.x, b.z));
      let needed = maxCastle - castleAssigned.length;
      for (const nurse of candidates) {
        if (needed <= 0) break;
        ssIonianClearPendingReaction(nurse);
        ssIonianAssignNurseTarget(nurse, castleTarget, { noCommit: true });
        nurse.meta.assignmentCommitTimer = 0;
        nurse.meta.holdTimer = 0;
        needed -= 1;
      }
      castleAssigned = nurses.filter(nurse => nurse.meta?.targetKind === "castle");
    }

    const targets = ssIonianActiveLocalDispatchTargets();
    const targetByKey = new Map(targets.map(target => [target.key, target]));

    // Cancel obsolete cross-map trips after the short commitment period. A nurse who
    // is already close may finish the repair; distant nurses return to patrol when the
    // emergency has disappeared or other reserved healing already covers it.
    for (const nurse of nurses) {
      if (nurse.meta?.targetKind === "castle") continue;
      const descriptor = ssIonianDispatchReservation(nurse);
      if (!descriptor) continue;
      const active = targetByKey.get(descriptor.key) || null;
      if (Number(nurse.meta?.assignmentCommitTimer || 0) > 0) continue;
      const distance = Math.hypot(descriptor.x - nurse.x, descriptor.z - nurse.z);
      if (!active && distance > 1.25) {
        ssIonianClearPendingReaction(nurse);
        ssIonianClearNurseTarget(nurse);
      }
    }

    let reserved = ssIonianReservedRepairMap(nurses);

    // First-pass coverage: each active emergency gets a responder before surplus
    // staff reinforce a different target. Existing/pending reservations count.
    const freeNurses = () => nurses.filter(nurse => {
      if (!nurse || nurse.meta?.targetKind === "castle") return false;
      if (nurse.meta?.targetKind || nurse.meta?.pendingTargetKey) return false;
      if (Number(nurse.meta?.assignmentCommitTimer || 0) > 0) return false;
      return true;
    });

    const uncoveredTargets = targets
      .filter(target => (reserved.get(target.key)?.count || 0) === 0)
      .sort((a, b) => {
        const ah = Number(a.health || 0) / Math.max(1, Number(a.maxHealth || 1));
        const bh = Number(b.health || 0) / Math.max(1, Number(b.maxHealth || 1));
        if (Math.abs(ah - bh) > 0.001) return ah - bh;
        return b.incomingDps - a.incomingDps;
      });

    for (const target of uncoveredTargets) {
      const candidates = freeNurses()
        .map(nurse => ({ nurse, distance: Math.hypot(target.x - nurse.x, target.z - nurse.z) }))
        .filter(item => item.distance <= SS_IONIAN_AWARENESS_RADIUS)
        .sort((a, b) => a.distance - b.distance);
      if (!candidates.length) continue;
      const nurse = candidates[0].nurse;
      ssIonianBeginReaction(nurse, target);
      const owner = ssDeviceById(nurse.ownerId);
      const rate = owner && ssIsIonianHospital(owner) ? ssIonianRepairRate(owner) : SS_IONIAN_REPAIR_PER_SECOND;
      reserved.set(target.key, { count: 1, repairPerSecond: rate, nurses: [nurse] });
    }

    // Reinforcement: iteratively reserve the best available nurse/target pairing.
    // ETA and already-reserved healing are included, so a distant nurse won't start a
    // pointless trip toward a building that will be safe before they get there.
    while (true) {
      const available = freeNurses();
      if (!available.length) break;
      let best = null;
      for (const nurse of available) {
        for (const target of targets) {
          const distance = Math.hypot(target.x - nurse.x, target.z - nurse.z);
          if (distance > SS_IONIAN_AWARENESS_RADIUS) continue;
          const slot = reserved.get(target.key) || { count: 0, repairPerSecond: 0, nurses: [] };
          const score = ssIonianDispatchScore(target, nurse, slot);
          if (!best || score > best.score) best = { nurse, target, score, slot };
        }
      }
      if (!best || !(best.score > 1.0)) break;
      ssIonianBeginReaction(best.nurse, best.target);
      const owner = ssDeviceById(best.nurse.ownerId);
      const rate = owner && ssIsIonianHospital(owner) ? ssIonianRepairRate(owner) : SS_IONIAN_REPAIR_PER_SECOND;
      reserved.set(best.target.key, {
        count: best.slot.count + 1,
        repairPerSecond: best.slot.repairPerSecond + rate,
        nurses: best.slot.nurses.concat(best.nurse)
      });
    }
  }

  function ssUpdateIonianNurse(unit, dt) {
    const hospital = ssDeviceById(unit.ownerId);
    if (!hospital || !ssIsIonianHospital(hospital) || Number(hospital.health || 0) <= 0) {
      unit.alive = false;
      return;
    }
    if (!unit.meta) unit.meta = {};
    unit.meta.assignmentCommitTimer = Math.max(0, Number(unit.meta.assignmentCommitTimer || 0) - dt);

    let target = ssIonianCurrentNurseTarget(hospital, unit);
    if (!target && unit.meta.targetKind) ssIonianClearNurseTarget(unit);

    // Castle responders are the one instant global override. They use safe exterior
    // care points and remain subject to the separate 40% network cap.
    if (target?.kind === "castle") {
      unit.meta.state = "repair";
      const unitRadius = Math.max(0.08, Number(unit.radius || SS_IONIAN_NURSE_RADIUS));
      if (!Number.isFinite(Number(unit.meta.castleCareX)) || !Number.isFinite(Number(unit.meta.castleCareZ))) {
        const care = ssIonianChooseCastleCarePoint(unit);
        unit.meta.castleCareX = care.x;
        unit.meta.castleCareZ = care.z;
      }
      const careX = Number(unit.meta.castleCareX);
      const careZ = Number(unit.meta.castleCareZ);
      const inRepairRange = Math.hypot(careX - unit.x, careZ - unit.z) <= 0.20 || ssCharacterGapToCastle(unit.x, unit.z, unitRadius) <= 0.16;
      if (!inRepairRange) ssMoveNurseToward(unit, careX, careZ, dt, 0.06, { allowCastleApproach: true });
      else {
        ssIonianRepairTarget(target, ssIonianRepairRate(hospital) * dt);
        unit.facing = Math.atan2(-unit.x, unit.z);
        unit.meta.workPhase = Number(unit.meta.workPhase || 0) + dt * 8;
        const refreshed = ssIonianTargetDescriptor(hospital, "castle", "castle");
        if (!refreshed) ssIonianStartHold(unit, target);
      }
      return;
    }

    // A completed repair gets a brief guard period. A renewed hit on the same target
    // resumes care immediately, which avoids repair/leave/repair ping-pong.
    if (unit.meta.state === "hold") {
      const holdKind = unit.meta.holdKind;
      const holdId = unit.meta.holdId;
      const hurtAgain = holdKind ? ssIonianTargetDescriptor(hospital, holdKind, holdId) : null;
      if (hurtAgain && ssIonianWasRecentlyAttacked(hurtAgain.target)) {
        ssIonianAssignNurseTarget(unit, hurtAgain);
        target = hurtAgain;
      } else {
        unit.meta.holdTimer = Math.max(0, Number(unit.meta.holdTimer || 0) - dt);
        if (unit.meta.holdTimer > 0) {
          const hx = Number(unit.meta.holdX ?? unit.x);
          const hz = Number(unit.meta.holdZ ?? unit.z);
          if (Math.hypot(hx - unit.x, hz - unit.z) > 0.45) ssMoveNurseToward(unit, hx, hz, dt, 0.25);
          else unit.meta.stepPhase = Number(unit.meta.stepPhase || 0) + dt * 1.1;
          return;
        }
        unit.meta.state = "patrol";
        unit.meta.holdKind = null;
        unit.meta.holdId = null;
      }
    }

    // Predictive dispatch creates the pending reservation. Individual nurses no
    // longer independently choose the hottest nearby target, preventing herd races.
    if (unit.meta.pendingTargetKey) {
