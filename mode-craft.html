  function ssWorldObjectSurfaceGap(object) {

      if (!object) return Infinity;

      let distanceToFootprint = Infinity;

      if (object.type === "tree") {

        const half = object.size * 0.26;

        distanceToFootprint = ssDistanceToOrientedRect(

          ssPlayer.x, ssPlayer.z, object.x, object.z, half, half, object.yaw

        );

      } else {

        distanceToFootprint = ssDistanceToOrientedRect(

          ssPlayer.x, ssPlayer.z, object.x, object.z,

          object.size * 1.45 * 0.5, object.size * 1.18 * 0.5, object.yaw

        );

      }

      return Math.max(0, distanceToFootprint - SS_PLAYER_COLLISION_RADIUS);

    }


    function ssFindNearbyWorldObject() {
      let best = null;
      let bestGap = Infinity;
      for (const object of ssWorldObjects) {
        const gap = ssWorldObjectSurfaceGap(object);
        if (gap <= SS_PICKAXE_OBSTACLE_REACH && gap < bestGap) {
          best = object;
          bestGap = gap;
        }
      }
      return best;
    }

    function ssPlacedDeviceSurfaceGap(device) {
      if (!device) return Infinity;
      const halfX = Number(device.footprintHalfX ?? ((device.baseWidth || device.baseSize || 1.2) * 0.5));
      const halfZ = Number(device.footprintHalfZ ?? ((device.baseDepth || device.baseSize || 1.2) * 0.5));
      const distanceToFootprint = ssDistanceToOrientedRect(
        ssPlayer.x, ssPlayer.z, device.x, device.z, halfX, halfZ, device.yaw || 0
      );
      return Math.max(0, distanceToFootprint - SS_PLAYER_COLLISION_RADIUS);
    }

    function ssFindNearbyPlacedDevice() {
      let best = null;
      let bestGap = Infinity;
      for (const device of ssPlacedDevices) {
        const gap = ssPlacedDeviceSurfaceGap(device);
        if (gap <= SS_PICKAXE_OBSTACLE_REACH && gap < bestGap) {
          best = device;
          bestGap = gap;
        }
      }
      return best;
    }

    function ssResourceSurfaceGap(resource) {
      if (!resource || resource.collected) return Infinity;
      return Math.max(0,
        Math.hypot(resource.x - ssPlayer.x, resource.z - ssPlayer.z)
          - SS_PLAYER_COLLISION_RADIUS - resource.collisionRadius
      );
    }

    function ssTryClearWorldObject(object = ssFindNearbyWorldObject()) {
      if (!object) return false;
      const index = ssWorldObjects.indexOf(object);
      if (index < 0) return false;
      ssRegisterClearedObstacleZone(object);
      ssWorldObjects.splice(index, 1);
      ssAwardPlayerXp(SS_PLAYER_XP_OBSTACLE[String(object.type || "")] || 1);
      ssNearbyWorldObject = null;
      ssAudioPlay("obstacle-clear", object.x, object.z, { variant:object.type || "obstacle", volume:0.88 });
      return true;
    }

    function ssTryDeconstructPlacedDevice(device = ssFindNearbyPlacedDevice()) {
      if (!device) return false;
      const index = ssPlacedDevices.indexOf(device);
      if (index < 0) return false;

      if (!Array.isArray(device.sourceRecipes)) {
        device.sourceRecipes = device.sourceRecipe ? [{
          ...device.sourceRecipe,
          notes: Array.isArray(device.sourceRecipe.notes) ? device.sourceRecipe.notes.slice() : []
        }] : [];
      }

      // A stacked structure is dismantled one crafted copy at a time. Only the
      // currently exposed/top layer inherits the device's present health. Underlying
      // stack layers remain intact and therefore refund at full value later.
      const maxHealth = Math.max(1, Number(device.maxHealth || SS_DEVICE_BASE_HEALTH));
      const healthFraction = Math.max(0, Math.min(1, Number(device.health || 0) / maxHealth));
      const recipe = device.sourceRecipes.pop();
      if (!recipe) return false;
      const recipeNotes = Array.isArray(recipe.notes) ? recipe.notes.slice() : [];
      const refundCount = healthFraction >= 0.999999
        ? recipeNotes.length
        : Math.max(0, Math.min(recipeNotes.length, Math.round(recipeNotes.length * healthFraction)));
      // Randomize which pitch spellings survive dismantling so damaged structures do
      // not systematically refund (or destroy) the same scale degrees every time.
      for (let i = recipeNotes.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [recipeNotes[i], recipeNotes[j]] = [recipeNotes[j], recipeNotes[i]];
      }
      for (const note of recipeNotes.slice(0, refundCount)) {
        if (!(note in ssNoteInventory)) ssNoteInventory[note] = 0;
        ssNoteInventory[note] = Number(ssNoteInventory[note] || 0) + 1;
      }
      ssRefreshNotesMenu();

      if (device.sourceRecipes.length <= 0) {
        ssPlacedDevices.splice(index, 1);
      if (device?.placedId) ssDeviceLookup.delete(device.placedId);
      ssBuildingCollisionGridDirty = true;
      } else {
        device.stackCount = device.sourceRecipes.length;
        device.powerMultiplier = ssStackPowerMultiplier(device.stackCount);
        device.sourceRecipe = device.sourceRecipes[0];
        // Removing the damaged top layer exposes a fresh underlying stack layer.
        device.health = Number(device.maxHealth || SS_DEVICE_BASE_HEALTH);
      }

      ssAudioPlay("dismantle", device.x, device.z, { variant:device.typeId || "device", volume:0.86 });
      return true;
    }

    function ssCurrentPickaxeUseTarget() {
    const resource = ssNearbyResource || ssFindNearbyResource();
    const object = ssNearbyWorldObject || ssFindNearbyWorldObject();
    const device = ssFindNearbyPlacedDevice();
    const candidates = [];
    if (resource) candidates.push({ kind: "resource", resource, gap: ssResourceSurfaceGap(resource) });
    if (object) candidates.push({ kind: "object", object, gap: ssWorldObjectSurfaceGap(object) });
    if (device) candidates.push({ kind: "device", device, gap: ssPlacedDeviceSurfaceGap(device) });
    candidates.sort((a, b) => a.gap - b.gap);
    return candidates[0] || null;
  }

  function ssTryDismantleNearbyDevice() {
    const item = ssSelectedHotbarItem();
    if (!item || item.id !== "pickaxe" || ssMovingDeviceBundle) return false;
    ssDeactivatePlacement(true);
    const device = ssFindNearbyPlacedDevice();
    if (!device) return false;
    return ssTryDeconstructPlacedDevice(device);
  }

  function ssUpdatePlayerSword(dt) {
    ssPlayer.swordCooldown = Math.max(0, Number(ssPlayer.swordCooldown || 0) - dt);
    ssPlayer.swordSwingTimer = Math.max(0, Number(ssPlayer.swordSwingTimer || 0) - dt);
    ssPlayer.pickaxeSwingTimer = Math.max(0, Number(ssPlayer.pickaxeSwingTimer || 0) - dt);
  }

  function ssTrySwordAttack() {
    ssDeactivatePlacement(true);
    if (Number(ssPlayer.swordCooldown || 0) > 0) return false;

    ssPlayer.swordCooldown = SS_PLAYER_SWORD_COOLDOWN;
    ssPlayer.swordSwingTimer = SS_PLAYER_SWORD_SWING_DURATION;
    ssAudioPlay("sword-swing", ssPlayer.x, ssPlayer.z, { spatial:false, variant:`lv${ssPlayerProgress.level}`, volume:0.92 });

    const forwardX = Math.sin(ssPlayer.facing);
    const forwardZ = -Math.cos(ssPlayer.facing);
    const hits = [];
    ssForEachNearbyLivingEnemy(ssPlayer.x, ssPlayer.z, SS_PLAYER_SWORD_RANGE + SS_PERF_MAX_ENEMY_RADIUS, "enemy", enemy => {
      if (!ssEnemyCanBePrimaryTowerTarget(enemy)) return;
      const dx = Number(enemy.x || 0) - ssPlayer.x;
      const dz = Number(enemy.z || 0) - ssPlayer.z;
      const distance = Math.hypot(dx, dz);
      const reach = SS_PLAYER_SWORD_RANGE + Math.max(0, Number(enemy.radius || 0));
      if (distance > reach || distance < 0.0001) return;
      const dot = (dx * forwardX + dz * forwardZ) / distance;
      if (dot < SS_PLAYER_SWORD_ARC_DOT) return;
      hits.push(enemy);
    });

    let hitVisuals = 0;
    for (const enemy of hits) {
      ssApplyEnemyDamage(enemy, ssPlayerSwordDamage(), {
        sourceId: "player-sword",
        sourceKind: "player-sword"
      });
      if (hitVisuals < 6) {
        ssCombatEffects.push({
          effectId: `effect-${ssCombatSerial++}`,
          kind: "player-sword-hit",
          x: Number(enemy.x || 0),
          y: Number(enemy.y || 0) + 0.9,
          z: Number(enemy.z || 0),
          age: 0,
          duration: 0.16,
          life: 0.16,
          radius: 0.32,
          color: "#f7fbff"
        });
        hitVisuals += 1;
      }
    }

    if (hits.length > 0) {
      const firstHit = hits[0];
      ssAudioPlay("sword-hit", firstHit.x, firstHit.z, { variant:firstHit.enemyType || "enemy", volume:0.90 });
    }

    // Every swing throws a subtle curved pressure wall. The visual and hit area share
    // the same broad frontal arc, making melee forgiving without turning it omnidirectional.
    const ground = ssPlayerSupportHeight(ssPlayer.x, ssPlayer.z);
    ssCombatEffects.push({
      effectId: `effect-${ssCombatSerial++}`,
      kind: "player-sword-air",
      x: ssPlayer.x,
      y: ground + 1.0,
      z: ssPlayer.z,
      facing: ssPlayer.facing,
      age: 0,
      duration: 0.20,
      life: 0.20,
      startRadius: 0.72,
      maxRadius: SS_PLAYER_SWORD_RANGE,
      arcRadians: Math.acos(SS_PLAYER_SWORD_ARC_DOT) * 2
    });
    return true;
  }

  function ssUseSelectedHotbarItem() {
    const item = ssSelectedHotbarItem();
    if (!item) return false;
    if (item.id === "pickaxe") {
      const target = ssCurrentPickaxeUseTarget();
      if (!target) return false;
      ssPlayer.pickaxeSwingTimer = SS_PLAYER_SWORD_SWING_DURATION;
      if (target.kind === "resource") return ssTryGather(target.resource);
      if (target.kind === "device") return ssTryPickUpPlacedDevice(target.device);
      return ssTryClearWorldObject(target.object);
    }
    if (item.id === "sword") return ssTrySwordAttack();
    return ssTryPlaceSelectedDevice();
  }


    function ssResourcePlacementClear(x, z, radius) {
      // IMPORTANT: cleared-tree/rock no-spawn zones apply ONLY to future obstacles.
      // Pitch resources intentionally ignore ssObstacleNoSpawnZones, so notes can
      // still appear in areas the player has cleared for building space.
      if (Math.hypot(x, z) < 13.5) return false;
      if (Math.abs(x) > SS_WORLD_HALF - 4 || Math.abs(z) > SS_WORLD_HALF - 4) return false;

      const sample = radius + 0.25;
      const heights = [
        ssTerrainHeight(x, z),
        ssTerrainHeight(x + sample, z),
        ssTerrainHeight(x - sample, z),
        ssTerrainHeight(x, z + sample),
        ssTerrainHeight(x, z - sample)
      ];
      if (Math.max(...heights) - Math.min(...heights) > 0.9) return false;

      for (const object of ssWorldObjects) {
        const minDistance = radius + object.collisionRadius + 0.75;
        if ((x - object.x) ** 2 + (z - object.z) ** 2 < minDistance ** 2) return false;
      }

      for (const resource of ssResources) {
        const minDistance = radius + resource.collisionRadius + 1.15;
        if ((x - resource.x) ** 2 + (z - resource.z) ** 2 < minDistance ** 2) return false;
      }

      // Morning replacements must also respect structures built after the initial
      // world generation so a note can never respawn inside a tower footprint.
      for (const device of ssPlacedDevices) {
        const halfX = Number(device.footprintHalfX ?? ((device.baseWidth || device.baseSize || 1.2) * 0.5));
        const halfZ = Number(device.footprintHalfZ ?? ((device.baseDepth || device.baseSize || 1.2) * 0.5));
        if (ssCircleIntersectsObb(x, z, radius, device.x, device.z, halfX, halfZ, device.yaw || 0)) return false;
      }

      return true;
    }

    function ssRespawnGatheredResourcesForNewDay(newDayNumber) {
      const gathered = Array.isArray(ssGatheredResourcesThisCycle)
        ? ssGatheredResourcesThisCycle.slice()
        : [];

      // Remove only nodes that were actually harvested. Every untouched resource
      // remains at its exact old coordinates.
      ssResources = ssResources.filter(resource => resource && !resource.collected);

      if (!gathered.length) {
        ssGatheredResourcesThisCycle = [];
        return 0;
      }

      const daySeed = (
        (Number(ssWorldSeed) >>> 0)
        ^ Math.imul(Math.max(1, Math.floor(Number(newDayNumber) || 1)), 0x9E3779B1)
        ^ Math.imul(gathered.length, 0x85EBCA6B)
      ) >>> 0;
      const rand = ssMulberry32(daySeed);
      let placed = 0;

      for (const spelling of gathered) {
        let didPlace = false;
        for (let attempts = 0; attempts < 720; attempts += 1) {
          const x = (rand() * 2 - 1) * (SS_WORLD_HALF - 4);
          const z = (rand() * 2 - 1) * (SS_WORLD_HALF - 4);
          if (!ssResourcePlacementClear(x, z, SS_RESOURCE_COLLISION_RADIUS)) continue;

          ssResources.push({
            spelling,
            x,
            z,
            y: ssTerrainHeight(x, z),
            collisionRadius: SS_RESOURCE_COLLISION_RADIUS,
            yaw: rand() * Math.PI * 2,
            phase: rand() * Math.PI * 2,
            collected: false
          });
          placed += 1;
          didPlace = true;
          break;
        }
        if (!didPlace) ssGatheredResourcesThisCycle.push(spelling);
      }

      if (placed === gathered.length) ssGatheredResourcesThisCycle = [];
      else ssGatheredResourcesThisCycle = ssGatheredResourcesThisCycle.slice(gathered.length);
      return placed;
    }

    function ssSpawnResourceBatch(seed, countsBySpelling = SS_RESOURCE_START_COUNTS) {
      const rand = ssMulberry32((seed ^ 0x63D83595) >>> 0);

      for (const spelling of SS_RESOURCE_SPELLINGS) {
        let placed = 0;
        let attempts = 0;
        const target = Math.max(0, Math.floor(Number(countsBySpelling?.[spelling] || 0)));

        while (placed < target && attempts < Math.max(1, target) * 180) {
          attempts += 1;
          const x = (rand() * 2 - 1) * (SS_WORLD_HALF - 4);
          const z = (rand() * 2 - 1) * (SS_WORLD_HALF - 4);
          if (!ssResourcePlacementClear(x, z, SS_RESOURCE_COLLISION_RADIUS)) continue;

          ssResources.push({
            spelling,
            x,
            z,
            y: ssTerrainHeight(x, z),
            collisionRadius: SS_RESOURCE_COLLISION_RADIUS,
            yaw: rand() * Math.PI * 2,
            phase: rand() * Math.PI * 2,
            collected: false
          });
          placed += 1;
        }
      }
    }

    function ssGenerateResources(seed) {
      ssResources = [];
      ssSpawnResourceBatch(seed, SS_RESOURCE_START_COUNTS);
    }

    function ssHitsResource(x, z, resource) {
      if (!resource || resource.collected) return false;
      const combined = SS_PLAYER_COLLISION_RADIUS + resource.collisionRadius;
      const dx = x - resource.x;
      const dz = z - resource.z;
      return dx * dx + dz * dz < combined * combined - 1e-10;
    }

    function ssFindNearbyResource() {
      let best = null;
      let bestDistance = Infinity;

      for (const resource of ssResources) {
        if (resource.collected) continue;
        const distance = Math.hypot(resource.x - ssPlayer.x, resource.z - ssPlayer.z);
        const reachDistance = SS_PLAYER_COLLISION_RADIUS + resource.collisionRadius + SS_RESOURCE_REACH;
        if (distance <= reachDistance && distance < bestDistance) {
          best = resource;
          bestDistance = distance;
        }
      }

      return best;
    }

    function ssTryGather(resource = ssFindNearbyResource()) {
      
      if (!resource) {
        return false;
      }

      resource.collected = true;
      ssGatheredResourcesThisCycle.push(resource.spelling);
      ssNoteInventory[resource.spelling] = Number(ssNoteInventory[resource.spelling] || 0) + 1;
      ssNearbyResource = null;
      ssRefreshNotesMenu();
      ssAudioPlay("gather", resource.x, resource.z, { volume:0.86 });
      return true;
    }


    function ssUpdateResourceInteraction() {
    ssNearbyResource = ssFindNearbyResource();
    ssNearbyWorldObject = ssFindNearbyWorldObject();
    if (ssCraftMessageTimer > 0) ssCraftMessageTimer -= 1;

    if (typeof questionBox !== "undefined" && questionBox) {
      if (ssPlacementActive && ssPlacementPreview && !ssCraftOverlayOpen) {
        questionBox.textContent = ssPlacementPreview.valid
          ? (ssPlacementPreview.stackTarget
            ? `${ssIsMobileGame() ? "USE" : "SPACE"}: STACK ×${Number(ssPlacementPreview.stackTarget.stackCount || 1)} → ×${ssMovingPlacementStackResult(ssPlacementPreview)}`
            : (ssIsMobileGame() ? "USE: PLACE" : "SPACE: PLACE"))
          : `BLOCKED: ${ssPlacementPreview.reason}`;
        return;
      }

      const selected = ssSelectedHotbarItem();
      const pickaxeSelected = !!selected && selected.id === "pickaxe";
      const nearbyDevice = pickaxeSelected ? ssFindNearbyPlacedDevice() : null;
      const dismantleText = nearbyDevice
        ? (ssIsMobileGame() ? " • SCRAP: DISMANTLE" : " • R: DISMANTLE")
        : "";
      const target = pickaxeSelected ? ssCurrentPickaxeUseTarget() : null;

      if (target && target.kind === "resource") {
        questionBox.textContent = ssIsMobileGame()
          ? `USE: MINE ${target.resource.spelling}${dismantleText} • CRAFT: OPEN`
          : `SPACE: MINE ${target.resource.spelling}${dismantleText} • E: CRAFT`;
      } else if (target && target.kind === "object") {
        const objectName = target.object.type === "tree" ? "TREE" : "ROCK";
        questionBox.textContent = ssIsMobileGame()
          ? `USE: CLEAR ${objectName}${dismantleText} • CRAFT: OPEN`
          : `SPACE: CLEAR ${objectName}${dismantleText} • E: CRAFT`;
      } else if (target && target.kind === "device") {
        questionBox.textContent = ssIsMobileGame()
          ? "USE: MOVE • SCRAP: DISMANTLE"
          : "SPACE: MOVE • R: DISMANTLE";
      } else if (pickaxeSelected && nearbyDevice) {
        questionBox.textContent = ssIsMobileGame()
          ? "USE: MOVE • SCRAP: DISMANTLE"
          : "SPACE: MOVE • R: DISMANTLE";
      } else if (ssNearbyResource || ssNearbyWorldObject || ssFindNearbyPlacedDevice()) {
        questionBox.textContent = "EQUIP PICKAXE TO INTERACT";
      } else {
        questionBox.textContent = "EXPLORE • GATHER • CRAFT";
      }
    }
  }

  function ssCircleIntersectsAabb(cx, cz, radius, centerX, centerZ, halfX, halfZ) {
      const closestX = ssClamp(cx, centerX - halfX, centerX + halfX);
      const closestZ = ssClamp(cz, centerZ - halfZ, centerZ + halfZ);
      const dx = cx - closestX;
      const dz = cz - closestZ;

      // Strictly less-than means exact edge contact is legal; only penetration blocks.
      return dx * dx + dz * dz < radius * radius - 1e-10;
    }

    function ssCircleIntersectsObb(cx, cz, radius, centerX, centerZ, halfX, halfZ, yaw) {
      const dx = cx - centerX;
      const dz = cz - centerZ;
      const c = Math.cos(yaw);
      const s = Math.sin(yaw);

      // Rotate the player center into the object's local X/Z frame.
      const localX = dx * c + dz * s;
      const localZ = -dx * s + dz * c;
      const closestX = ssClamp(localX, -halfX, halfX);
      const closestZ = ssClamp(localZ, -halfZ, halfZ);
      const ox = localX - closestX;
      const oz = localZ - closestZ;

      return ox * ox + oz * oz < radius * radius - 1e-10;
    }

    function ssPointGapToAabb(x, z, centerX, centerZ, halfX, halfZ) {
    const dx = Math.max(Math.abs(x - centerX) - halfX, 0);
    const dz = Math.max(Math.abs(z - centerZ) - halfZ, 0);
    return Math.hypot(dx, dz);
  }

  function ssPointGapToObb(x, z, centerX, centerZ, halfX, halfZ, yaw) {
    const dx = x - centerX;
    const dz = z - centerZ;
    const c = Math.cos(yaw || 0);
    const s = Math.sin(yaw || 0);
    const localX = dx * c + dz * s;
    const localZ = -dx * s + dz * c;
    const ox = Math.max(Math.abs(localX) - halfX, 0);
    const oz = Math.max(Math.abs(localZ) - halfZ, 0);
    return Math.hypot(ox, oz);
  }

  function ssCharacterGapToCastle(x, z, radius = 0) {
    let gap = ssPointGapToAabb(x, z, 0, 0, SS_CASTLE_KEEP_HALF, SS_CASTLE_KEEP_HALF);
    for (const sx of [-1, 1]) {
      for (const sz of [-1, 1]) {
        gap = Math.min(gap, ssPointGapToAabb(x, z, sx * SS_CASTLE_TOWER_CENTER, sz * SS_CASTLE_TOWER_CENTER, SS_CASTLE_TOWER_HALF, SS_CASTLE_TOWER_HALF));
      }
    }
    return Math.max(0, gap - Math.max(0, Number(radius || 0)));
  }

  function ssCharacterGapToDevice(x, z, radius, device) {
    if (!device) return Infinity;
    const halfX = Number(device.footprintHalfX ?? ((device.baseWidth || device.baseSize || 1.2) * 0.5));
    const halfZ = Number(device.footprintHalfZ ?? ((device.baseDepth || device.baseSize || 1.2) * 0.5));
    const gap = ssPointGapToObb(x, z, device.x, device.z, halfX, halfZ, device.yaw || 0);
    return Math.max(0, gap - Math.max(0, Number(radius || 0)));
  }

  function ssCharacterHitsCastle(x, z, radius) {
    const r = Math.max(0.01, Number(radius || 0.3));
    if (ssCircleIntersectsAabb(x, z, r, 0, 0, SS_CASTLE_KEEP_HALF, SS_CASTLE_KEEP_HALF)) return true;
    for (const sx of [-1, 1]) {
      for (const sz of [-1, 1]) {
        if (ssCircleIntersectsAabb(x, z, r, sx * SS_CASTLE_TOWER_CENTER, sz * SS_CASTLE_TOWER_CENTER, SS_CASTLE_TOWER_HALF, SS_CASTLE_TOWER_HALF)) return true;
      }
    }
    return false;
  }

  function ssCharacterHitsPlacedDevice(x, z, radius, device, ignoreDeviceId = null) {
    if (!device || device.collisionMode === "none" || device.placedId === ignoreDeviceId || Number(device.health || 0) <= 0) return false;
    const halfX = Number(device.footprintHalfX ?? ((device.baseWidth || device.baseSize || 1.2) * 0.5));
    const halfZ = Number(device.footprintHalfZ ?? ((device.baseDepth || device.baseSize || 1.2) * 0.5));
    return ssCircleIntersectsObb(x, z, Math.max(0.01, Number(radius || 0.3)), device.x, device.z, halfX, halfZ, device.yaw || 0);
  }

  function ssCharacterCanOccupyBuildingSpace(x, z, radius, options = {}) {
    const r = Math.max(0.01, Number(radius || 0.3));
    if (x < -SS_WORLD_HALF + r || x > SS_WORLD_HALF - r || z < -SS_WORLD_HALF + r || z > SS_WORLD_HALF - r) return false;
    if (!options.ignoreCastle && ssCharacterHitsCastle(x, z, r)) return false;
    for (const device of ssNearbyPlacedDevices(x, z, r)) {
      if (ssCharacterHitsPlacedDevice(x, z, r, device, options.ignoreDeviceId || null)) return false;
    }
    return true;
  }

  function ssMoveCharacterWithBuildingCollision(character, deltaX, deltaZ, radius, options = {}) {
    if (!character) return 0;
    const startX = Number(character.x || 0);
    const startZ = Number(character.z || 0);
    const targetX = startX + Number(deltaX || 0);
    const targetZ = startZ + Number(deltaZ || 0);
    const can = (x, z) => ssCharacterCanOccupyBuildingSpace(x, z, radius, options);

    let nextX = startX;
    let nextZ = startZ;
    if (can(targetX, targetZ)) {
      nextX = targetX;
      nextZ = targetZ;
    } else {
      // Match the player's axis-sliding feel: when a diagonal step meets a wall,
      // keep whichever component can still move so units flow along solid edges.
      const xOkay = can(targetX, startZ);
      const zOkay = can(startX, targetZ);
      if (xOkay && zOkay) {
        if (Math.abs(deltaX) >= Math.abs(deltaZ)) nextX = targetX;
        else nextZ = targetZ;
      } else if (xOkay) nextX = targetX;
      else if (zOkay) nextZ = targetZ;
    }

    character.x = nextX;
    character.z = nextZ;
    return Math.hypot(nextX - startX, nextZ - startZ);
  }

  function ssHitsCastle(x, z) {
      const r = SS_PLAYER_COLLISION_RADIUS;

      // Main keep: collision matches the visible ground-level 7.2 x 7.2 wall exactly.
      if (ssCircleIntersectsAabb(x, z, r, 0, 0, SS_CASTLE_KEEP_HALF, SS_CASTLE_KEEP_HALF)) {
        return true;
      }

      // Four tower columns: only their visible ground-level shafts block the player.
      for (const sx of [-1, 1]) {
        for (const sz of [-1, 1]) {
          if (ssCircleIntersectsAabb(
            x, z, r,
            sx * SS_CASTLE_TOWER_CENTER,
            sz * SS_CASTLE_TOWER_CENTER,
            SS_CASTLE_TOWER_HALF,
            SS_CASTLE_TOWER_HALF
          )) return true;
        }
      }

      return false;
    }

    function ssHitsWorldObject(x, z, object) {
      if (object.type === "tree") {
        // Only the visible trunk blocks movement; foliage is overhead.
        const half = object.size * 0.26;
        return ssCircleIntersectsObb(
          x, z, SS_PLAYER_COLLISION_RADIUS,
          object.x, object.z,
          half, half,
          object.yaw
        );
      }

      // Rocks use the exact footprint of their visible ground-level rectangular body.
      return ssCircleIntersectsObb(
        x, z, SS_PLAYER_COLLISION_RADIUS,
        object.x, object.z,
        object.size * 1.45 * 0.5,
        object.size * 1.18 * 0.5,
        object.yaw
      );
    }

    function ssHitsPlacedDevice(x, z, device) {
    if (!device || device.collisionMode === "none") return false;
    const halfX = Number(device.footprintHalfX ?? ((device.baseWidth || device.baseSize || 1.2) * 0.5));
    const halfZ = Number(device.footprintHalfZ ?? ((device.baseDepth || device.baseSize || 1.2) * 0.5));
    return ssCircleIntersectsObb(x,z,SS_PLAYER_COLLISION_RADIUS, device.x,device.z,halfX,halfZ,device.yaw || 0);
  }

  function ssCanOccupy(x, z) {
    const r = SS_PLAYER_COLLISION_RADIUS;
    if (x < -SS_WORLD_HALF + r || x > SS_WORLD_HALF - r || z < -SS_WORLD_HALF + r || z > SS_WORLD_HALF - r) return false;
    if (ssHitsCastle(x, z)) return false;
    for (const object of ssWorldObjects) {
      if (ssHitsWorldObject(x, z, object)) return false;
    }
    for (const resource of ssResources) {
      if (ssHitsResource(x, z, resource)) return false;
    }
    // Player and AI now share the same nearby-building grid rather than making the
    // player scan every tower in a large defense network on every movement sample.
    for (const device of ssNearbyPlacedDevices(x, z, r)) {
      if (ssHitsPlacedDevice(x, z, device)) return false;
    }
    return true;
  }

    function ssMoveAxisToContact(axis, delta) {
      if (Math.abs(delta) < 0.0000001) return;

      const start = axis === "x" ? ssPlayer.x : ssPlayer.z;
      const fixed = axis === "x" ? ssPlayer.z : ssPlayer.x;
      const target = start + delta;
      const targetAllowed = axis === "x"
        ? ssCanOccupy(target, fixed)
        : ssCanOccupy(fixed, target);

      if (targetAllowed) {
        if (axis === "x") ssPlayer.x = target;
        else ssPlayer.z = target;
        return;
      }

      // Find the exact visible contact point instead of stopping one whole movement
      // substep early and creating an invisible gap around walls/trees/rocks.
      let low = 0;
      let high = 1;
      for (let i = 0; i < 12; i += 1) {
        const mid = (low + high) * 0.5;
        const candidate = start + delta * mid;
        const allowed = axis === "x"
          ? ssCanOccupy(candidate, fixed)
          : ssCanOccupy(fixed, candidate);
        if (allowed) low = mid;
        else high = mid;
      }

      const contact = start + delta * low;
      if (axis === "x") ssPlayer.x = contact;
      else ssPlayer.z = contact;
    }

    function ssMovePlayer(dx, dz) {
      if (Math.abs(dx) < 0.00001 && Math.abs(dz) < 0.00001) return 0;

      const startX = ssPlayer.x;
      const startZ = ssPlayer.z;

      // Substep movement prevents tunneling at high speed; each blocked substep then
      // resolves by binary search to the actual visible contact surface.
      const totalDistance = Math.hypot(dx, dz);
      const steps = Math.max(1, Math.ceil(totalDistance / 0.07));
      const stepX = dx / steps;
      const stepZ = dz / steps;

      for (let i = 0; i < steps; i += 1) {
        ssMoveAxisToContact("x", stepX);
        ssMoveAxisToContact("z", stepZ);
      }

      ssPlayer.y = ssPlayerSupportHeight(ssPlayer.x, ssPlayer.z);
      return Math.hypot(ssPlayer.x - startX, ssPlayer.z - startZ);
    }

    function ssAxis(value) {
      return Math.abs(value) >= SS_JOYSTICK_DEAD_ZONE ? value : 0;
    }

    function ssIsMobileGame() {
      return typeof sticks !== "undefined" && !!sticks.left && !!sticks.right;
    }

  function ssKeyboardMovement() {
      let x = 0;
      let forward = 0;

      if (ssKeys["a"]) x -= 1;
      if (ssKeys["d"]) x += 1;
      if (ssKeys["w"]) forward += 1;
      if (ssKeys["s"]) forward -= 1;

      const length = Math.hypot(x, forward);
      if (length > 1) {
        x /= length;
        forward /= length;
      }

      return { x, forward };
    }

    function ssUpdateControls() {
      if (ssCraftOverlayOpen) {
        ssPlayer.moving = false;
        ssPlayer.bob *= 0.82;
        ssPlayer.y = ssPlayerSupportHeight(ssPlayer.x, ssPlayer.z);
        return;
      }

      let moveX = 0;
      let moveForward = 0;
      let cameraYawInput = 0;
      let cameraPitchInput = 0;

      if (ssIsMobileGame()) {
        moveX = ssAxis(sticks.left.x);
        moveForward = -ssAxis(sticks.left.y);
        cameraYawInput = -ssAxis(sticks.right.x);
        cameraPitchInput = ssAxis(sticks.right.y);
      } else {
        const movement = ssKeyboardMovement();
        moveX = movement.x;
        moveForward = movement.forward;

        if (ssKeys["arrowleft"]) cameraYawInput += 1;
        if (ssKeys["arrowright"]) cameraYawInput -= 1;
        if (ssKeys["arrowup"]) cameraPitchInput -= 1;
        if (ssKeys["arrowdown"]) cameraPitchInput += 1;
      }

      ssCamera.yaw += cameraYawInput * SS_CAMERA_YAW_SPEED;
      ssCamera.pitch = ssClamp(
        ssCamera.pitch + cameraPitchInput * SS_CAMERA_PITCH_SPEED,
        SS_CAMERA_MIN_PITCH,
        SS_CAMERA_MAX_PITCH
      );

      const forwardX = -Math.sin(ssCamera.yaw);
      const forwardZ = -Math.cos(ssCamera.yaw);
      const rightX = Math.cos(ssCamera.yaw);
      const rightZ = -Math.sin(ssCamera.yaw);

      let worldMoveX = rightX * moveX + forwardX * moveForward;
      let worldMoveZ = rightZ * moveX + forwardZ * moveForward;
      const moveMagnitude = Math.hypot(worldMoveX, worldMoveZ);

      if (moveMagnitude > 0.001) {
        if (moveMagnitude > 1) {
          worldMoveX /= moveMagnitude;
          worldMoveZ /= moveMagnitude;
        }

        const movedDistance = ssMovePlayer(
          worldMoveX * SS_PLAYER_SPEED,
          worldMoveZ * SS_PLAYER_SPEED
        );
        ssPlayer.facing = Math.atan2(worldMoveX, -worldMoveZ);

        // Tie the gait to actual distance traveled, so doubling movement speed also
        // doubles step cadence without making the feet animate while blocked by a wall.
        ssPlayer.bob += movedDistance * SS_WALK_CYCLE_RADIANS_PER_UNIT;
        ssPlayer.moving = movedDistance > 0.0001;
        if (ssPlayer.moving) {
          ssAudioPlayerStepDistance += movedDistance;
          if (ssAudioPlayerStepDistance >= 1.12) {
            ssAudioPlayerStepDistance %= 1.12;
            ssAudioPlay("footstep", ssPlayer.x, ssPlayer.z, { spatial:false, variant:"player", volume:0.84 });
          }
        }
      } else {
        ssPlayer.moving = false;
        ssPlayer.bob *= 0.82;
      }

      // Terrain underneath the full footprint can change even when movement resolves
      // one axis at a time, so recompute the safe standing height every frame.
      ssPlayer.y = ssPlayerSupportHeight(ssPlayer.x, ssPlayer.z);
    }

    function ssVecNormalize(v) {
      const length = Math.hypot(v.x, v.y, v.z) || 1;
      return { x: v.x / length, y: v.y / length, z: v.z / length };
    }

    function ssVecCross(a, b) {
      return {
        x: a.y * b.z - a.z * b.y,
        y: a.z * b.x - a.x * b.z,
        z: a.x * b.y - a.y * b.x
      };
    }

    function ssVecDot(a, b) {
      return a.x * b.x + a.y * b.y + a.z * b.z;
    }

    function ssCameraBasis() {
      const target = {
        x: ssPlayer.x,
        y: ssPlayer.y + 1.25,
        z: ssPlayer.z
      };

      const horizontal = Math.cos(ssCamera.pitch) * ssCamera.distance;
      let cam = {
        x: target.x + Math.sin(ssCamera.yaw) * horizontal,
        y: target.y + Math.sin(ssCamera.pitch) * ssCamera.distance,
        z: target.z + Math.cos(ssCamera.yaw) * horizontal
      };

      const cameraGround = ssTerrainHeight(cam.x, cam.z);
      if (cam.y < cameraGround + 1.25) cam.y = cameraGround + 1.25;

      const forward = ssVecNormalize({
        x: target.x - cam.x,
        y: target.y - cam.y,
        z: target.z - cam.z
      });

      const right = ssVecNormalize(ssVecCross(forward, { x: 0, y: 1, z: 0 }));
      const up = ssVecCross(right, forward);

      return { cam, forward, right, up, target };
    }

    function ssProjectPoint(point, basis) {
      const relative = {
        x: point.x - basis.cam.x,
        y: point.y - basis.cam.y,
        z: point.z - basis.cam.z
      };

      const cx = ssVecDot(relative, basis.right);
      const cy = ssVecDot(relative, basis.up);
      const cz = ssVecDot(relative, basis.forward);

      if (cz <= SS_NEAR_PLANE || cz >= SS_FAR_PLANE) return null;

      const focal = (GAME_CANVAS_LOGICAL_WIDTH * 0.5) / Math.tan(SS_FOV * 0.5);
      return {
        x: GAME_CANVAS_LOGICAL_WIDTH * 0.5 + cx * focal / cz,
        y: GAME_CANVAS_LOGICAL_HEIGHT * 0.52 - cy * focal / cz,
        depth: cz
      };
    }

    function ssObjectIntersectsView(x, y, z, radius, basis, margin = SS_PERF_OBJECT_CULL_MARGIN) {
    const rx = Number(x || 0) - basis.cam.x;
    const ry = Number(y || 0) - basis.cam.y;
    const rz = Number(z || 0) - basis.cam.z;
    const r = Math.max(0.1, Number(radius || 0.1));
    const cz = rx * basis.forward.x + ry * basis.forward.y + rz * basis.forward.z;
    if (cz + r <= SS_NEAR_PLANE || cz - r >= SS_FAR_PLANE) return false;
    if (cz <= SS_NEAR_PLANE) return true;
    const cx = rx * basis.right.x + ry * basis.right.y + rz * basis.right.z;
    const cy = rx * basis.up.x + ry * basis.up.y + rz * basis.up.z;
    const sx = GAME_CANVAS_LOGICAL_WIDTH * 0.5 + cx * SS_PROJECTION_FOCAL / cz;
    const sy = GAME_CANVAS_LOGICAL_HEIGHT * 0.52 - cy * SS_PROJECTION_FOCAL / cz;
    const projectedRadius = SS_PROJECTION_FOCAL * r / Math.max(SS_NEAR_PLANE, cz - r);
    return !(
      sx + projectedRadius < -margin ||
      sx - projectedRadius > GAME_CANVAS_LOGICAL_WIDTH + margin ||
      sy + projectedRadius < -margin ||
      sy - projectedRadius > GAME_CANVAS_LOGICAL_HEIGHT + margin
    );
  }

  function ssHexToRgb(hex) {
    const key = String(hex || "#ffffff");
    const cached = ssColorUnitCache.get(`rgb255:${key}`);
    if (cached) return cached;
    const clean = key.replace("#", "");
    const value = parseInt(clean.length === 3
      ? clean.split("").map(ch => ch + ch).join("")
      : clean, 16);
    const rgb = {
      r: (value >> 16) & 255,
      g: (value >> 8) & 255,
      b: value & 255
    };
    if (ssColorUnitCache.size < 2048) ssColorUnitCache.set(`rgb255:${key}`, rgb);
    return rgb;
  }

    function ssShade(hex, factor) {
    const roundedFactor = Math.round(Number(factor || 0) * 1000) / 1000;
    const key = `${hex}|${roundedFactor}`;
    const cached = ssShadeCache.get(key);
    if (cached) return cached;
    const rgb = ssHexToRgb(hex);
    const r = ssClamp(Math.round(rgb.r * roundedFactor), 0, 255);
    const g = ssClamp(Math.round(rgb.g * roundedFactor), 0, 255);
    const b = ssClamp(Math.round(rgb.b * roundedFactor), 0, 255);
    const result = `rgb(${r},${g},${b})`;
    if (ssShadeCache.size < 4096) ssShadeCache.set(key, result);
    return result;
  }

    function ssWithRenderGroup(id, depth, callback) {
    // WebGL's depth buffer now resolves object overlap per pixel. The old painter
    // render-group bookkeeping had no effect on the WebGL result, so avoid creating
    // metadata and group IDs every frame. Keep the wrapper for fallback compatibility.
    callback();
  }

    function ssWorldPointDepth(point, basis) {
      // Rigid-object ordering should answer "which object is behind which on the map?"
      // Ignore object height here so a tall tree cannot jump in front of a castle merely
      // because the elevated camera makes its canopy center closer in camera-space Y.
      const fx = basis.forward.x;
      const fz = basis.forward.z;
      const horizontalLength = Math.hypot(fx, fz) || 1;
      return (
        (point.x - basis.cam.x) * fx +
        (point.z - basis.cam.z) * fz
      ) / horizontalLength;
    }

    function ssAddPolygon(worldPoints, color, basis, alpha = 1, stroke = null, renderLayer = "world") {
    // Reuse polygon/projected arrays across frames and project directly into flat
    // [screenX, screenY, depth] triples. This eliminates thousands of point objects.
    let poly = ssPolygonPool[ssPolygonPoolUsed];
    if (!poly) {
      poly = { projected: [] };
      ssPolygonPool[ssPolygonPoolUsed] = poly;
    }
    ssPolygonPoolUsed += 1;
    const projected = poly.projected;
    projected.length = 0;

    let depth = 0;
    let minX = Infinity;
    let maxX = -Infinity;
    let minY = Infinity;
    let maxY = -Infinity;
    const focal = SS_PROJECTION_FOCAL;
    const cam = basis.cam;
    const right = basis.right;
    const up = basis.up;
    const forward = basis.forward;

    for (const point of worldPoints) {
      const rx = point.x - cam.x;
      const ry = point.y - cam.y;
      const rz = point.z - cam.z;
      const cx = rx * right.x + ry * right.y + rz * right.z;
      const cy = rx * up.x + ry * up.y + rz * up.z;
      const cz = rx * forward.x + ry * forward.y + rz * forward.z;
      if (cz <= SS_NEAR_PLANE || cz >= SS_FAR_PLANE) return;
      const sx = GAME_CANVAS_LOGICAL_WIDTH * 0.5 + cx * focal / cz;
      const sy = GAME_CANVAS_LOGICAL_HEIGHT * 0.52 - cy * focal / cz;
      projected.push(sx, sy, cz);
      depth += cz;
      if (sx < minX) minX = sx;
      if (sx > maxX) maxX = sx;
      if (sy < minY) minY = sy;
      if (sy > maxY) maxY = sy;
    }

    const pointCount = projected.length / 3;
    if (pointCount < 3) return;
    depth /= pointCount;

    if (
      maxX < -60 ||
      minX > GAME_CANVAS_LOGICAL_WIDTH + 60 ||
      maxY < -80 ||
      minY > GAME_CANVAS_LOGICAL_HEIGHT + 80
    ) return;

    poly.depth = depth;
    poly.color = color;
    poly.alpha = alpha;
    poly.stroke = stroke;
    poly.renderLayer = renderLayer;
    ssPolygons.push(poly);
  }

    function ssRotateXZ(localX, localZ, yaw) {
      const c = Math.cos(yaw);
      const s = Math.sin(yaw);
      return {
        x: localX * c - localZ * s,
        z: localX * s + localZ * c
      };
    }

    function ssAddBox(cx, baseY, cz, sx, sy, sz, baseColor, basis, yaw = 0, options = {}) {
      const hx = sx * 0.5;
      const hz = sz * 0.5;
      const locals = [
        [-hx, 0, -hz],
        [ hx, 0, -hz],
        [ hx, 0,  hz],
        [-hx, 0,  hz],
        [-hx, sy, -hz],
        [ hx, sy, -hz],
        [ hx, sy,  hz],
        [-hx, sy,  hz]
      ];

      const v = locals.map(([lx, ly, lz]) => {
        const r = ssRotateXZ(lx, lz, yaw);
        return { x: cx + r.x, y: baseY + ly, z: cz + r.z };
      });

      const faces = [
        { ids: [0, 1, 5, 4], shade: 0.76 },
        { ids: [1, 2, 6, 5], shade: 0.88 },
        { ids: [2, 3, 7, 6], shade: 0.69 },
        { ids: [3, 0, 4, 7], shade: 0.82 },
        { ids: [4, 5, 6, 7], shade: 1.10 }
      ];

      const sideRenderLayer = options.renderLayer || "world";
      const topRenderLayer = options.topRenderLayer || sideRenderLayer;
      const boxAlpha = Number.isFinite(Number(options.alpha)) ? ssClamp(Number(options.alpha), 0, 1) : 1;

      for (const face of faces) {
        const isTopFace = face.ids[0] === 4;
        ssAddPolygon(
          face.ids.map(id => v[id]),
          ssShade(baseColor, face.shade),
          basis,
          boxAlpha,
          null,
          isTopFace ? topRenderLayer : sideRenderLayer
        );
      }
    }

    function ssAddCone(cx, baseY, cz, radius, height, baseColor, basis, sides = 6, yaw = 0, renderLayer = "world") {
      const base = [];
      for (let i = 0; i < sides; i += 1) {
        const angle = yaw + i * Math.PI * 2 / sides;
        base.push({
          x: cx + Math.cos(angle) * radius,
          y: baseY,
          z: cz + Math.sin(angle) * radius
        });
      }

      const top = { x: cx, y: baseY + height, z: cz };

      for (let i = 0; i < sides; i += 1) {
        const next = (i + 1) % sides;
        const shade = 0.72 + 0.22 * ((i % 3) / 2);
        ssAddPolygon([base[i], base[next], top], ssShade(baseColor, shade), basis, 1, null, renderLayer);
      }
    }

    // Shared cylinder primitive used by partial-scale weapon structures.
    // This was referenced by the weapon models but was missing from the renderer,
    // which could stop drawing as soon as one of those weapons was selected.
    function ssAddCylinder(cx, baseY, cz, radius, height, baseColor, basis, sides = 8, yaw = 0, renderLayer = "world", alpha = 1) {
      const count = Math.max(3, Math.floor(Number(sides || 8)));
      const bottom = [];
      const top = [];
      for (let i = 0; i < count; i += 1) {
        const angle = yaw + i * Math.PI * 2 / count;
        const x = cx + Math.cos(angle) * radius;
        const z = cz + Math.sin(angle) * radius;
        bottom.push({ x, y: baseY, z });
        top.push({ x, y: baseY + height, z });
      }
      const a = ssClamp(Number.isFinite(Number(alpha)) ? Number(alpha) : 1, 0, 1);
      for (let i = 0; i < count; i += 1) {
        const next = (i + 1) % count;
        const shade = 0.72 + 0.20 * ((i % 4) / 3);
        ssAddPolygon([bottom[i], bottom[next], top[next], top[i]], ssShade(baseColor, shade), basis, a, null, renderLayer);
      }
      // Reverse the top rim so its winding remains consistent from every camera angle.
      ssAddPolygon(top.slice().reverse(), ssShade(baseColor, 1.08), basis, a, null, renderLayer);
    }

    function ssAddRock(object, basis) {
    const y = ssTerrainHeight(object.x, object.z);
    const s = object.size;
    const base = object.variant % 2 === 0 ? "#74818d" : "#65737e";
    const light = object.variant % 3 === 0 ? "#9aa4ac" : "#88949e";
    const dark = "#515d66";
    // Multi-piece formation: still blocky, but no longer a single toy boulder.
    ssAddBox(object.x, y, object.z, s*1.42, s*0.72, s*1.18, base, basis, object.yaw);
    ssAddBox(object.x + Math.cos(object.yaw)*s*0.34, y+s*0.34, object.z + Math.sin(object.yaw)*s*0.34, s*0.76, s*0.54, s*0.70, light, basis, object.yaw+0.24);
    ssAddBox(object.x - Math.sin(object.yaw)*s*0.42, y+s*0.12, object.z + Math.cos(object.yaw)*s*0.42, s*0.58, s*0.38, s*0.62, dark, basis, object.yaw-0.31);
    ssAddCone(object.x + Math.sin(object.yaw)*s*0.13, y+s*0.60, object.z + Math.cos(object.yaw)*s*0.10, s*0.55, s*0.48, light, basis, 5, object.yaw+0.35);
    // Dark fracture and occasional moss patch add surface detail without textures.
    ssAddBox(object.x - Math.cos(object.yaw)*s*0.13, y+s*0.58, object.z - Math.sin(object.yaw)*s*0.13, s*0.08, s*0.42, s*0.10, "#414a51", basis, object.yaw+0.38);
    if (object.variant % 3 === 0) {
      ssAddBox(object.x + Math.cos(object.yaw)*s*0.22, y+s*0.69, object.z + Math.sin(object.yaw)*s*0.22, s*0.42, s*0.07, s*0.34, "#70875a", basis, object.yaw+0.18);
    }
  }
    function ssAddTree(object, basis) {
    const y = ssTerrainHeight(object.x, object.z);
    const s = object.size;
    const trunkH = 2.35*s;
    const sway = Math.sin(ssCombatClock*0.72 + object.x*0.17 + object.z*0.13) * 0.035;
    const yaw = object.yaw + sway;
    const bark = object.variant % 2 === 0 ? "#70462b" : "#805134";
    const barkDark = "#51301f";
    const green = object.variant % 3 === 0 ? "#3f8e51" : object.variant % 3 === 1 ? "#347b45" : "#4b9552";
    // Root flare + segmented trunk give the tree a planted, older silhouette.
    for (const a of [0, Math.PI*0.5, Math.PI, Math.PI*1.5]) {
      const rx=object.x+Math.cos(a+yaw)*s*0.32, rz=object.z+Math.sin(a+yaw)*s*0.32;
      ssAddBox(rx,y+0.02,rz,s*0.42,s*0.18,s*0.18,barkDark,basis,a+yaw);
    }
    ssAddBox(object.x,y,object.z,0.56*s,trunkH,0.56*s,bark,basis,yaw);
    ssAddBox(object.x+Math.cos(yaw)*s*0.08,y+s*0.25,object.z+Math.sin(yaw)*s*0.08,0.12*s,1.35*s,0.60*s,barkDark,basis,yaw);
    // Side branches support irregular clustered foliage instead of two perfect cones.
    for (const [a,h,len] of [[0.45,1.15,0.78],[2.35,1.46,0.64],[4.35,1.72,0.68]]) {
      const angle=yaw+a;
      const bx=object.x+Math.cos(angle)*s*len*0.35, bz=object.z+Math.sin(angle)*s*len*0.35;
      ssAddBox(bx,y+s*h,bz,s*0.18,s*0.18,s*len,bark,basis,angle);
    }
    const crowns = [
      [0, 1.70, 0, 1.38, 1.72, green],
      [0.55, 1.92, 0.22, 1.05, 1.38, ssShade(green,1.08)],
      [-0.62, 1.80, -0.18, 0.94, 1.28, ssShade(green,0.92)],
      [0.08, 2.42, -0.08, 0.90, 1.45, ssShade(green,1.14)]
    ];
    for (const [ox,oy,oz,r,h,color] of crowns) {
      const rotated=ssRotateXZ(ox*s,oz*s,yaw);
      ssAddCone(object.x+rotated.x,y+s*oy,object.z+rotated.z,r*s,h*s,color,basis,7,yaw+ox*0.27);
    }
    // A few leaf blocks break the cone silhouette and catch the lighting.
    for(const [ox,oy,oz] of [[0.85,1.75,0.1],[-0.75,2.05,0.25],[0.35,2.65,-0.2]]){
      const p=ssRotateXZ(ox*s,oz*s,yaw);
      ssAddBox(object.x+p.x,y+oy*s,object.z+p.z,0.46*s,0.32*s,0.42*s,ssShade(green,1.12),basis,yaw+0.2);
    }
  }
    const SS_PIXEL_FONT = {
    A: ["01110","10001","10001","11111","10001","10001","10001"],
    B: ["11110","10001","10001","11110","10001","10001","11110"],
    C: ["01111","10000","10000","10000","10000","10000","01111"],
    D: ["11110","10001","10001","10001","10001","10001","11110"],
    E: ["11111","10000","10000","11110","10000","10000","11111"],
    F: ["11111","10000","10000","11110","10000","10000","10000"],
    G: ["01111","10000","10000","10111","10001","10001","01111"],
    I: ["11111","00100","00100","00100","00100","00100","11111"],
    R: ["11110","10001","10001","11110","10100","10010","10001"],
    S: ["01111","10000","10000","01110","00001","00001","11110"],
    X: ["10001","10001","01010","00100","01010","10001","10001"],
    "0": ["01110","10001","10011","10101","11001","10001","01110"],
    "1": ["00100","01100","00100","00100","00100","00100","01110"],
    "2": ["01110","10001","00001","00010","00100","01000","11111"],
    "3": ["11110","00001","00001","01110","00001","00001","11110"],
    "4": ["00010","00110","01010","10010","11111","00010","00010"],
    "5": ["11111","10000","10000","11110","00001","00001","11110"],
    "6": ["01110","10000","10000","11110","10001","10001","01110"],
    "7": ["11111","00001","00010","00100","01000","01000","01000"],
    "8": ["01110","10001","10001","01110","10001","10001","01110"],
    "9": ["01110","10001","10001","01111","00001","00001","01110"],
    "#": ["01010","11111","01010","01010","11111","01010","01010"],
    b: ["10000","10000","10110","11001","10001","10001","11110"]
  };

  function ssBillboardPoint(center, basis, dx, dy, towardCamera = 0) {
      return {
        x: center.x + basis.right.x * dx + basis.up.x * dy - basis.forward.x * towardCamera,
        y: center.y + basis.right.y * dx + basis.up.y * dy - basis.forward.y * towardCamera,
        z: center.z + basis.right.z * dx + basis.up.z * dy - basis.forward.z * towardCamera
      };
    }

    function ssAddBillboardRect(center, basis, width, height, color, towardCamera = 0) {
      const hw = width * 0.5;
      const hh = height * 0.5;
      ssAddPolygon([
        ssBillboardPoint(center, basis, -hw, -hh, towardCamera),
        ssBillboardPoint(center, basis,  hw, -hh, towardCamera),
        ssBillboardPoint(center, basis,  hw,  hh, towardCamera),
        ssBillboardPoint(center, basis, -hw,  hh, towardCamera)
      ], color, basis, 1, null, "world");
    }

    function ssAddPitchBillboard(resource, basis, baseY) {
      const display = resource.spelling.replace("♯", "#").replace("♭", "b");
      const chars = Array.from(display);
      const cell = 0.115;
      const charGap = cell * 1.3;
      const charWidths = chars.map(ch => (SS_PIXEL_FONT[ch]?.[0]?.length || 5) * cell);
      const contentWidth = charWidths.reduce((a, b) => a + b, 0) + charGap * Math.max(0, chars.length - 1);
      const panelWidth = Math.max(1.05, contentWidth + 0.34);
      const panelHeight = 1.08;
      const center = { x: resource.x, y: baseY + 2.34, z: resource.z };

      ssAddBillboardRect(center, basis, panelWidth, panelHeight, "#172334", 0);

      let cursor = -contentWidth * 0.5;
      for (const ch of chars) {
        const pattern = SS_PIXEL_FONT[ch];
        if (!pattern) continue;
        const width = pattern[0].length * cell;
        const left = cursor;
        const top = (pattern.length * cell) * 0.5;

        for (let row = 0; row < pattern.length; row += 1) {
          for (let col = 0; col < pattern[row].length; col += 1) {
            if (pattern[row][col] !== "1") continue;
            const px = left + (col + 0.5) * cell;
            const py = top - (row + 0.5) * cell;
            const pixelCenter = ssBillboardPoint(center, basis, px, py, 0.035);
            ssAddBillboardRect(pixelCenter, basis, cell * 0.78, cell * 0.78, "#f6fbff", 0);
          }
        }
        cursor += width + charGap;
      }
    }

    function ssAddPixelBillboardText(display, center, basis, options = {}) {
      const chars = Array.from(String(display || ""));
      const cell = Number(options.cell || 0.082);
      const charGap = cell * Number(options.charGapFactor || 1.05);
      const charWidths = chars.map(ch => (SS_PIXEL_FONT[ch]?.[0]?.length || 5) * cell);
      const contentWidth = charWidths.reduce((a,b) => a + b, 0) + charGap * Math.max(0, chars.length - 1);
      const panelWidth = Math.max(Number(options.minWidth || 0.82), contentWidth + Number(options.padX || 0.26));
      const panelHeight = Number(options.panelHeight || 0.72);
      if (options.showPanel !== false) {
        ssAddBillboardRect(center, basis, panelWidth, panelHeight, options.panelColor || "#172334", 0);
      }

      let cursor = -contentWidth * 0.5;
      for (const ch of chars) {
        const pattern = SS_PIXEL_FONT[ch];
        if (!pattern) {
          cursor += 5 * cell + charGap;
          continue;
        }
        const width = pattern[0].length * cell;
        const top = (pattern.length * cell) * 0.5;
        for (let row = 0; row < pattern.length; row += 1) {
          for (let col = 0; col < pattern[row].length; col += 1) {
            if (pattern[row][col] !== "1") continue;
            const px = cursor + (col + 0.5) * cell;
            const py = top - (row + 0.5) * cell;
            const pixelCenter = ssBillboardPoint(center, basis, px, py, 0.035);
            ssAddBillboardRect(pixelCenter, basis, cell * 0.76, cell * 0.76, options.textColor || "#f6fbff", 0);
          }
        }
        cursor += width + charGap;
      }
    }

    function ssAddStackBillboard(device, basis) {
      const count = Math.max(1, Number(device?.stackCount || 1));
      if (count <= 1) return;
      const distance = Math.hypot(device.x - ssPlayer.x, device.z - ssPlayer.z);
      if (distance > 28) return;
      const center = {
        x: device.x,
        y: Number(device.y || 0) + Number(device.height || 1) + 1.18,
        z: device.z
      };
      ssAddPixelBillboardText(`X${count}`, center, basis, {
        panelColor: "#101827",
        textColor: "#ffffff",
        cell: 0.078,
        panelHeight: 0.70,
        minWidth: 0.80
      });
    }

    function ssAddResource(resource, basis) {
      const y = ssTerrainHeight(resource.x, resource.z);
      const color = ssResourceColor(resource.spelling);
      const pulse = 1 + Math.sin(resource.phase + performance.now() * 0.0024) * 0.035;

      ssAddBox(resource.x, y, resource.z, 0.82, 0.18, 0.82, "#4d5964", basis, resource.yaw);

      const ringY = y + 0.68;
      const radius = 0.43 * pulse;
      const sides = 6;
      const ring = [];
      for (let i = 0; i < sides; i += 1) {
        const angle = resource.yaw + i * Math.PI * 2 / sides;
        ring.push({
          x: resource.x + Math.cos(angle) * radius,
          y: ringY,
          z: resource.z + Math.sin(angle) * radius
        });
      }
      const bottom = { x: resource.x, y: y + 0.18, z: resource.z };
      const top = { x: resource.x, y: y + 1.56, z: resource.z };
      for (let i = 0; i < sides; i += 1) {
        const next = (i + 1) % sides;
        ssAddPolygon([bottom, ring[next], ring[i]], ssShade(color, 0.78 + (i % 3) * 0.08), basis);
        ssAddPolygon([ring[i], ring[next], top], ssShade(color, 0.96 + (i % 3) * 0.08), basis);
      }

      const distance = Math.hypot(resource.x - ssPlayer.x, resource.z - ssPlayer.z);
      if (distance <= SS_RESOURCE_LABEL_DISTANCE) ssAddPitchBillboard(resource, basis, y);
    }

    function ssTerrainColor(height, gx, gz) {
      const variation = ssHash2(gx * 3 + 5, gz * 5 - 3);

      if (height < -1.7) {
        return variation < 0.5 ? "#7c9f68" : "#769861";
      }
      if (height > 3.3) {
        return variation < 0.5 ? "#8fa06d" : "#849766";
      }
      if (height > 1.5) {
        return variation < 0.5 ? "#75a85f" : "#6fa158";
      }
      return variation < 0.5 ? "#66a855" : "#5fa14e";
    }

    function ssEnsureTerrainCellCache() {
    if (ssTerrainCellCacheSeed === ssWorldSeed && ssTerrainCellCache.length) return;
    const step = SS_TERRAIN_STEP;
    const start = -SS_WORLD_HALF;
    const cells = Math.ceil((SS_WORLD_HALF * 2) / step);
    const cache = new Array(cells * cells);
    for (let iz = 0; iz < cells; iz += 1) {
      const z0 = start + iz * step;
      const z1 = Math.min(SS_WORLD_HALF, z0 + step);
      for (let ix = 0; ix < cells; ix += 1) {
        const x0 = start + ix * step;
        const x1 = Math.min(SS_WORLD_HALF, x0 + step);
        const h00 = ssTerrainHeight(x0, z0);
        const h10 = ssTerrainHeight(x1, z0);
        const h11 = ssTerrainHeight(x1, z1);
        const h01 = ssTerrainHeight(x0, z1);
        const averageHeight = (h00 + h10 + h11 + h01) * 0.25;
        cache[iz * cells + ix] = {
          cx: (x0 + x1) * 0.5,
          cz: (z0 + z1) * 0.5,
          poisonKey: `${ix}:${iz}`,
          color: ssTerrainColor(averageHeight, ix, iz),
          points: [
            { x: x0, y: h00, z: z0 },
            { x: x1, y: h10, z: z0 },
            { x: x1, y: h11, z: z1 },
            { x: x0, y: h01, z: z1 }
          ]
        };
      }
    }
    ssTerrainCellCache = cache;
    ssTerrainCellCacheSeed = ssWorldSeed;
    ssTerrainCellCacheCount = cells;
  }

  function ssAddTerrain(basis) {
    ssEnsureTerrainCellCache();
    const step = SS_TERRAIN_STEP;
    const start = -SS_WORLD_HALF;
    const cells = ssTerrainCellCacheCount;
    const renderRadius = 68;
    const ixStart = ssClamp(Math.floor((ssPlayer.x - renderRadius - start) / step), 0, cells - 1);
    const ixEnd = ssClamp(Math.ceil((ssPlayer.x + renderRadius - start) / step), 0, cells - 1);
    const izStart = ssClamp(Math.floor((ssPlayer.z - renderRadius - start) / step), 0, cells - 1);
    const izEnd = ssClamp(Math.ceil((ssPlayer.z + renderRadius - start) / step), 0, cells - 1);
    const maxDistanceSq = 66 * 66;

    for (let iz = izStart; iz <= izEnd; iz += 1) {
      for (let ix = ixStart; ix <= ixEnd; ix += 1) {
        const cell = ssTerrainCellCache[iz * cells + ix];
        if (!cell) continue;
        const dx = cell.cx - ssPlayer.x;
        const dz = cell.cz - ssPlayer.z;
        const distanceSq = dx * dx + dz * dz;
        if (distanceSq > maxDistanceSq) continue;
        const distance = Math.sqrt(distanceSq);
        const fogAlpha = ssClamp(1 - Math.max(0, distance - 44) / 24, 0.25, 1);
        const poisonPanel = ssPoisonTerrainPanels.get(cell.poisonKey);
        const terrainColor = poisonPanel ? "#3d7f32" : cell.color;
        ssAddPolygon(cell.points, terrainColor, basis, fogAlpha, null, "terrain");

        if (poisonPanel) {
          // Keep the full poison-floor presentation even in the optimized renderer.
          // Terrain itself is cached; only these animated bubbles remain dynamic.
          const p0 = cell.points[0], p1 = cell.points[1], p3 = cell.points[3];
          const x0 = p0.x, x1 = p1.x, z0 = p0.z, z1 = p3.z;
          for (let bubbleIndex = 0; bubbleIndex < 4; bubbleIndex += 1) {
            const hx = ssHash2(ix * 19 + bubbleIndex * 7, iz * 23 - bubbleIndex * 11);
            const hz = ssHash2(ix * 31 - bubbleIndex * 13, iz * 17 + bubbleIndex * 5);
            const bx = x0 + (0.18 + hx * 0.64) * (x1 - x0);
            const bz = z0 + (0.18 + hz * 0.64) * (z1 - z0);
            const phase = ssCombatClock * (2.2 + bubbleIndex * 0.28) + hx * 6.283;
            const pulse = 0.5 + 0.5 * Math.sin(phase);
            const by = ssGroundHeight(bx, bz) + 0.045 + pulse * 0.08;
            const br = 0.075 + pulse * 0.055;
            ssAddFacetedSphere(bx, by, bz, br, basis, {
              palette: ["#91d35f", "#b7ef75", "#69a944"],
              yaw: phase * 0.18,
              alpha: 0.78,
              latSegments: 4,
              lonSegments: 8
            });
          }
        }
      }
    }
  }

    

    
  function ssAddPlacementFootprintRing(device, basis) {
    if (!device) return;
    const supportY = Number.isFinite(Number(device.y)) ? Number(device.y) : ssGroundHeight(device.x, device.z);
    const halfX = Number(device.footprintHalfX ?? ((device.baseWidth || device.baseSize || 1.2) * 0.5));
    const halfZ = Number(device.footprintHalfZ ?? ((device.baseDepth || device.baseSize || 1.2) * 0.5));
    const yaw = Number(device.yaw || 0);
    const color = device.valid ? "#39ff72" : "#ff3b3b";
    const c = Math.cos(yaw), s = Math.sin(yaw);

    function worldPoint(lx, lz, y) {
      return {
        x: device.x + lx * c - lz * s,
        y,
        z: device.z + lx * s + lz * c
      };
    }

    function addRectRing(offsetFromFootprint, thickness, y, alpha) {
      // Keep every band outside the physical footprint so the device foundation can
      // never depth-occlude the placement indicator. The inner edge of the core band
      // sits essentially on the true collision/placement boundary.
      const ix = halfX + offsetFromFootprint;
      const iz = halfZ + offsetFromFootprint;
      const ox = ix + thickness;
      const oz = iz + thickness;
      const strips = [
        [[-ox,-oz],[ ox,-oz],[ ix,-iz],[-ix,-iz]],
        [[ ox,-oz],[ ox, oz],[ ix, iz],[ ix,-iz]],
        [[ ox, oz],[-ox, oz],[-ix, iz],[ ix, iz]],
        [[-ox, oz],[-ox,-oz],[-ix,-iz],[-ix, iz]]
      ];
      for (const strip of strips) {
        ssAddPolygon(strip.map(([lx,lz]) => worldPoint(lx,lz,y)), color, basis, alpha, null, "world");
      }
    }

    // Three shallow translucent bands create the glow. The narrow bright core starts
    // only a hair outside the exact footprint; softer bands bloom farther outward.
    addRectRing(0.105, 0.105, supportY + 0.030, 0.16);
    addRectRing(0.050, 0.090, supportY + 0.035, 0.34);
    addRectRing(0.008, 0.052, supportY + 0.041, 0.98);
  }


  function ssPartialDeviceId(deviceOrItem) {
    if (!deviceOrItem) return "";
    if (typeof deviceOrItem === "string") return String(deviceOrItem);
    return String(deviceOrItem.typeId || deviceOrItem.id || deviceOrItem.item?.id || "");
  }

  function ssPartialNoteCount(deviceOrItem) {
    const id = ssPartialDeviceId(deviceOrItem);
    const match = id.match(/-(\d)$/);
    return match ? Number(match[1]) : 0;
  }

  function ssPartialFamily(deviceOrItem) {
    const id = ssPartialDeviceId(deviceOrItem);
    const dash = id.indexOf("-");
    return dash >= 0 ? id.slice(0, dash) : "";
  }

  function ssIsPartialScaleDevice(deviceOrItem) {
    return /^(major2|major3|minor2|minor3)-[2-6]$/.test(ssPartialDeviceId(deviceOrItem));
  }

  function ssPartialTheme(deviceOrItem, preview = false) {
    const family = ssPartialFamily(deviceOrItem);
    if (family === "major2" || family === "major3") {
      return {
        family,
        panel: "#2e250f",
        chassis: preview ? "#9a8544" : "#6f5a1c",
        barrel: preview ? "#b99d49" : "#93752b",
        core: "#ffd84d",
        glow: "#fff5b5",
        trim: "#d8b355",
        ring: "#fff0a0"
      };
    }
    if (family === "minor3") {
      return {
        family,
        panel: "#1d1528",
        chassis: preview ? "#71618a" : "#3a304a",
        barrel: preview ? "#8877a5" : "#5b4780",
        core: "#6d28d9",
        glow: "#e6dcff",
        trim: "#a689e1",
        ring: "#d8c5f2"
      };
    }
    if (family === "minor2") {
      return {
        family,
        panel: "#20311c",
        chassis: preview ? "#7d996f" : "#42623a",
        barrel: preview ? "#98b288" : "#5e8d4f",
        core: "#579538",
        glow: "#d9f8c8",
        trim: "#86c566",
        ring: "#bfeaa6"
      };
    }
    return null;
  }

  function ssPartialLauncherLayout(noteCount) {
    switch (noteCount) {
      case 2:
        return [{ x: -0.18, tier: 0 }, { x: 0.18, tier: 0 }];
      case 3:
        return [{ x: -0.24, tier: 0 }, { x: 0, tier: 0 }, { x: 0.24, tier: 0 }];
      case 4:
        return [{ x: -0.27, tier: 0 }, { x: -0.09, tier: 0 }, { x: 0.09, tier: 0 }, { x: 0.27, tier: 0 }];
      case 5:
        return [
          { x: -0.24, tier: 1 }, { x: 0, tier: 1 }, { x: 0.24, tier: 1 },
          { x: -0.12, tier: 0 }, { x: 0.12, tier: 0 }
        ];
      case 6:
        return [
          { x: -0.24, tier: 1 }, { x: 0, tier: 1 }, { x: 0.24, tier: 1 },
          { x: -0.24, tier: 0 }, { x: 0, tier: 0 }, { x: 0.24, tier: 0 }
        ];
      default:
        return [];
    }
  }

  function ssPartialAimYaw(device) {
    if (!device) return 0;
    const stored = Number(device.partialAimYaw);
    const fallback = Number.isFinite(stored) ? stored : Number(device.yaw || 0);
    const family = ssPartialFamily(device);
    // Only the Major-3rd branch is a friendly-device healer. The Major-2nd
    // Light Pinger is offensive and should face enemies like the minor branches.
    const wantsDevices = family === "major3";
    const slots = Array.isArray(device.targetSlots) ? device.targetSlots : [];
    let sumX = 0;
    let sumZ = 0;
    let count = 0;
    for (const id of slots) {
      if (!id) continue;
      const target = wantsDevices ? ssDeviceById(id) : ssEnemyById(id);
      if (!target) continue;
      if (wantsDevices) {
        if (!(Number(target.health || 0) > 0)) continue;
      } else if (!target.alive) {
        continue;
      }
      sumX += Number(target.x || 0);
      sumZ += Number(target.z || 0);
      count += 1;
    }
    if (!count) return fallback;
    const dx = sumX / count - Number(device.x || 0);
    const dz = sumZ / count - Number(device.z || 0);
    if (Math.abs(dx) < 0.0001 && Math.abs(dz) < 0.0001) return fallback;
    const aimedYaw = Math.atan2(-dx, dz);
    // Remember the last direction in which this turret actually had a target.
    // Losing targets must never snap the head back to the placement/base yaw.
    device.partialAimYaw = aimedYaw;
    return aimedYaw;
  }

  function ssAddPartialScaleDevice(device, basis, preview = false) {
    if (!ssIsPartialScaleDevice(device)) return false;
    const theme = ssPartialTheme(device, preview);
    if (!theme) return false;
    const noteCount = ssPartialNoteCount(device);
    const alpha = preview ? 0.78 : 1;
    const supportY = Number.isFinite(Number(device.y)) ? Number(device.y) : ssGroundHeight(device.x, device.z);
    const terrainMinY = Number.isFinite(Number(device.terrainMinY)) ? Number(device.terrainMinY) : supportY - 0.10;
    const stackPreviewScale = preview && device.stackTargetId ? 1.075 : 1;
    const width = Number(device.baseWidth || device.baseSize || 1.2) * stackPreviewScale;
    const depth = Number(device.baseDepth || device.baseSize || 1.2) * stackPreviewScale;
    const height = Number(device.height || 0.9) * (preview && device.stackTargetId ? 1.035 : 1);

    // Base yaw is permanent placement orientation. Turret yaw is independent.
    const baseYaw = Number(device.yaw || 0);
    const turretYaw = ssPartialAimYaw(device);
    const tc = Math.cos(turretYaw), ts = Math.sin(turretYaw);
    const fwdX = -ts, fwdZ = tc;
    const rightX = tc, rightZ = ts;

    if (preview) ssAddPlacementFootprintRing(device, basis);

    const foundationBottom = Math.min(terrainMinY - 0.035, supportY - 0.08);
    const deckTop = supportY + 0.18;

    // Everything below the rotating turret deck remains fixed forever.
    ssAddBox(device.x, foundationBottom, device.z, width, Math.max(0.20, deckTop - foundationBottom), depth,
      ssShade(theme.panel, 0.95), basis, baseYaw, { alpha });
    ssAddBox(device.x, deckTop, device.z, width * 0.90, height * 0.18, depth * 0.90,
      theme.panel, basis, baseYaw, { alpha });
    ssAddCylinder(device.x, deckTop + height * 0.17, device.z,
      Math.min(width, depth) * (0.18 + noteCount * 0.015), height * (0.28 + noteCount * 0.016),
      theme.chassis, basis, 10, baseYaw, "world", alpha);

    // Rotating upper deck/head. Only this section follows the target-center yaw.
    ssAddBox(device.x, deckTop + height * 0.40, device.z,
      width * 0.72, height * 0.115, depth * 0.54,
      theme.chassis, basis, turretYaw, { alpha });
    ssAddFacetedSphere(device.x, deckTop + height * 0.51, device.z,
      Math.min(width, depth) * (0.12 + noteCount * 0.012), basis, {
        palette: [theme.core, theme.glow, theme.trim, "#ffffff"],
        alpha: alpha * 0.96,
        latSegments: 5,
        lonSegments: 9,
        yaw: turretYaw
      });
    ssAddHorizontalRing(device.x, deckTop + height * 0.58, device.z,
      Math.min(width, depth) * 0.13,
      Math.min(width, depth) * (0.21 + noteCount * 0.016),
      theme.ring, basis, alpha * 0.78, turretYaw, 18);

    const mounts = ssPartialLauncherLayout(noteCount);
    const barrelLength = depth * (noteCount >= 5 ? 0.50 : 0.54);
    const barrelRadius = Math.min(width, depth) * (noteCount <= 2 ? 0.068 : noteCount <= 4 ? 0.062 : 0.056);
    mounts.forEach((mount, index) => {
      const mountX = device.x + rightX * width * mount.x;
      const mountZ = device.z + rightZ * width * mount.x;
      const barrelY = deckTop + height * (mount.tier ? 0.72 : 0.57);
      const tipX = mountX - fwdX * barrelLength * 0.56;
      const tipZ = mountZ - fwdZ * barrelLength * 0.56;
      ssAddBox((mountX + tipX) * 0.5, barrelY, (mountZ + tipZ) * 0.5,
        width * (noteCount <= 2 ? 0.105 : 0.092), height * 0.12, barrelLength,
        theme.barrel, basis, turretYaw, { alpha });
      ssAddCylinder(tipX, barrelY, tipZ, barrelRadius, height * 0.11,
        theme.core, basis, 8, turretYaw, "world", alpha);
      ssAddFacetedSphere(tipX - fwdX * 0.03, barrelY, tipZ - fwdZ * 0.03,
        barrelRadius * (noteCount <= 2 ? 0.85 : 0.72), basis, {
          palette: [theme.glow, theme.core, "#ffffff"],
