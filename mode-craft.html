  function ssAddEnemyPerformanceLOD(enemy, basis) {
    if (!enemy?.alive) return false;
    const type = String(enemy.enemyType || "standard");
    const allied = enemy.allegiance === "player";
    const palette = allied ? ["#315b9a", "#8fc3ff"]
      : type === "runner" ? ["#73343b", "#d36c73"]
      : type === "brute" ? ["#4b2926", "#a15d4b"]
      : type === "raider" ? ["#4a3430", "#c28a55"]
      : type === "siege" ? ["#3d3a3f", "#bd7548"]
      : ["#57262d", "#a6535e"];
    const scale = type === "brute" ? 1.32 : type === "runner" ? 0.82 : type === "siege" ? 1.08 : 1;
    const yaw = Number(enemy.facing || 0);
    ssAddBox(enemy.x, enemy.y + 0.18, enemy.z, 0.46*scale, 0.66*scale, 0.34*scale, palette[0], basis, yaw);
    ssAddBox(enemy.x, enemy.y + 0.73*scale, enemy.z, 0.56*scale, 0.58*scale, 0.40*scale, palette[1], basis, yaw);
    ssAddBox(enemy.x, enemy.y + 1.12*scale, enemy.z, 0.38*scale, 0.34*scale, 0.36*scale, palette[0], basis, yaw);
    ssAddEnemyHealthBar(enemy, basis);
    return true;
  }

  function ssAddEliteEnemyMarker(enemy, basis) {
    if (!enemy?.alive || !enemy.isElite) return;
    const r = Math.max(0.24, Number(enemy.radius || 0.42));
    const pulse = 0.92 + Math.sin(performance.now() * 0.0054 + Number(enemy.bob || 0)) * 0.08;
    ssAddHorizontalRing(enemy.x, enemy.y + 0.028, enemy.z, r * 1.18 * pulse, r * 1.34 * pulse, "#f2c94c", basis, 0.68, 0, 8);
  }

  function ssAddGenericEnemy(enemy, basis) {
    ssAddEliteEnemyMarker(enemy, basis);
    if (ssPerformanceVisualLOD && enemy?.alive) {
      const distance = Math.hypot(Number(enemy.x || 0) - ssPlayer.x, Number(enemy.z || 0) - ssPlayer.z);
      if (distance >= SS_PERF_ENEMY_LOD_DISTANCE && ssAddEnemyPerformanceLOD(enemy, basis)) return;
    }
    // Phase 6 dispatch point. Each enemy type owns only its presentation/stat profile;
    // the shared status, targeting and combat plumbing remains reusable.
    const type = String(enemy?.enemyType || "standard");
    if (type === "runner") {
      ssAddRunnerEnemy(enemy, basis);
      return;
    }
    if (type === "brute") {
      ssAddBruteEnemy(enemy, basis);
      return;
    }
    if (type === "raider") {
      ssAddRaiderEnemy(enemy, basis);
      return;
    }
    if (type === "siege") {
      ssAddSiegeEnemy(enemy, basis);
      return;
    }
    ssAddStandardEnemy(enemy, basis);
  }

  function ssAddFacetedSphere(cx, cy, cz, radius, basis, options = {}) {
    const r = Math.max(0.03, Number(radius || 0.2));
    const latSegments = Math.max(4, Math.floor(Number(options.latSegments || 6)));
    const lonSegments = Math.max(8, Math.floor(Number(options.lonSegments || 10)));
    const yaw = Number(options.yaw || 0);
    const alpha = Number.isFinite(Number(options.alpha)) ? ssClamp(Number(options.alpha), 0, 1) : 1;
    const palette = Array.isArray(options.palette) && options.palette.length ? options.palette : [options.color || "#d7dee9"];
    for (let lat = 0; lat < latSegments; lat += 1) {
      const t0 = -Math.PI/2 + (lat / latSegments) * Math.PI;
      const t1 = -Math.PI/2 + ((lat+1) / latSegments) * Math.PI;
      const y0 = Math.sin(t0), y1 = Math.sin(t1);
      const rr0 = Math.cos(t0), rr1 = Math.cos(t1);
      for (let lon = 0; lon < lonSegments; lon += 1) {
        const p0 = yaw + (lon / lonSegments) * Math.PI * 2;
        const p1 = yaw + ((lon+1) / lonSegments) * Math.PI * 2;
        const points = [
          { x: cx + Math.cos(p0)*rr0*r, y: cy + y0*r, z: cz + Math.sin(p0)*rr0*r },
          { x: cx + Math.cos(p1)*rr0*r, y: cy + y0*r, z: cz + Math.sin(p1)*rr0*r },
          { x: cx + Math.cos(p1)*rr1*r, y: cy + y1*r, z: cz + Math.sin(p1)*rr1*r },
          { x: cx + Math.cos(p0)*rr1*r, y: cy + y1*r, z: cz + Math.sin(p0)*rr1*r }
        ];
        const base = palette[(lat * 3 + lon) % palette.length];
        const light = 0.78 + ((y0+y1+2)*0.5)*0.14 + ((lon%3)-1)*0.035;
        ssAddPolygon(points, ssShade(base, light), basis, alpha, null, "world");
      }
    }
  }

  function ssAddBillboardShape(center, basis, points, color, alpha = 1, towardCamera = 0.02) {
    ssAddPolygon(points.map(([x,y]) => ssBillboardPoint(center, basis, x, y, towardCamera)), color, basis, alpha, null, "world");
  }

  function ssAddBillboardSegment(center, basis, x1, y1, x2, y2, width, color, alpha = 1, towardCamera = 0.02) {
    const dx = x2-x1, dy = y2-y1;
    const len = Math.hypot(dx,dy) || 1;
    const px = -dy/len * width*0.5, py = dx/len * width*0.5;
    ssAddBillboardShape(center,basis,[[x1+px,y1+py],[x2+px,y2+py],[x2-px,y2-py],[x1-px,y1-py]],color,alpha,towardCamera);
  }

  function ssAddAeolianElementProjectile(projectile, basis) {
    const r = Math.max(0.10, Number(projectile.radius || 0.12));
    const element = projectile.meta?.element || "wind";
    const center = { x: projectile.x, y: projectile.y, z: projectile.z };
    const pulse = 0.92 + Math.sin(Number(projectile.age || 0)*18)*0.08;
    if (element === "lightning") {
      const s = r*2.65*pulse;
      const pts = [[-0.18,0.92],[0.16,0.30],[-0.05,0.30],[0.22,-0.12],[-0.13,-0.12],[0.08,-0.94]];
      for (let i=0;i<pts.length-1;i++) ssAddBillboardSegment(center,basis,pts[i][0]*s,pts[i][1]*s,pts[i+1][0]*s,pts[i+1][1]*s,r*0.60,"#ffe24a",0.98,0.035);
      for (let i=0;i<pts.length-1;i++) ssAddBillboardSegment(center,basis,pts[i][0]*s,pts[i][1]*s,pts[i+1][0]*s,pts[i+1][1]*s,r*0.22,"#fffef0",1,0.055);
      return;
    }
    if (element === "fire") {
      const s = r*2.55*pulse;
      ssAddBillboardShape(center,basis,[[0,0.98*s],[-0.58*s,-0.58*s],[-0.15*s,-0.40*s],[0,-0.92*s],[0.22*s,-0.42*s],[0.57*s,-0.55*s]],"#ef5a24",0.98,0.03);
      ssAddBillboardShape(center,basis,[[0.03*s,0.55*s],[-0.29*s,-0.48*s],[0,-0.30*s],[0.11*s,-0.72*s],[0.32*s,-0.42*s]],"#ffd84d",0.98,0.055);
      return;
    }
    if (element === "ice") {
      const s = r*2.55*pulse;
      ssAddBillboardShape(center,basis,[[-0.28*s,0.72*s],[0.28*s,0.72*s],[0.10*s,-0.92*s],[-0.10*s,-0.92*s]],"#9aefff",0.98,0.03);
      ssAddBillboardShape(center,basis,[[-0.28*s,0.72*s],[0,1.02*s],[0.28*s,0.72*s]],"#e7fbff",0.98,0.05);
      ssAddBillboardShape(center,basis,[[0,0.72*s],[0.28*s,0.72*s],[0.10*s,-0.92*s]],"#55c8f0",0.82,0.06);
      return;
    }
    // Wind: three translucent curved streaks make a compact gust instead of a colored bullet.
    const s = r*2.75*pulse;
    const curves = [
      [[-0.75,0.40],[-0.15,0.62],[0.55,0.35]],
      [[-0.82,0.02],[-0.10,0.18],[0.76,-0.02]],
      [[-0.58,-0.38],[0.04,-0.48],[0.62,-0.30]]
    ];
    curves.forEach((curve, ci) => {
      for (let i=0;i<curve.length-1;i++) {
        ssAddBillboardSegment(center,basis,curve[i][0]*s,curve[i][1]*s,curve[i+1][0]*s,curve[i+1][1]*s,r*(0.38-ci*0.055),ci===1?"#ffffff":"#c9f4ff",0.72,0.03+ci*0.012);
      }
    });
  }


  function ssProjectilePolishColor(projectile) {
    const kind = String(projectile?.meta?.kind || projectile?.sourceKind || "").toLowerCase();
    if (kind.includes("mending") || kind.includes("heal") || kind.includes("ionian")) return "#a8ff96";
    if (kind.includes("shadow")) return "#a78bfa";
    if (kind.includes("sludge") || kind.includes("poison") || kind.includes("phrygian")) return "#8fd05d";
    if (kind.includes("dorian") || kind.includes("monk")) return "#76e7c6";
    if (kind.includes("lydian") || kind.includes("halo") || kind.includes("angel")) return "#ffe995";
    if (kind.includes("mixolydian") || kind.includes("disco")) return "#f0abfc";
    if (kind.includes("aeolian")) {
      const element = String(projectile?.meta?.element || "");
      if (element === "fire") return "#ff7a36";
      if (element === "ice") return "#8ee9ff";
      if (element === "lightning") return "#ffe74f";
      return "#d9f7ff";
    }
    if (kind.includes("locrian") || kind.includes("ghost")) return "#d8b4fe";
    if (kind.includes("siege")) return projectile?.ownerAllegiance === "player" ? "#a9e4ff" : "#ff9b55";
    if (kind.includes("pinger")) return "#b9f4ff";
    return String(projectile?.color || "#ffffff");
  }

  function ssProjectilePolishTarget(projectile) {
    const targetKind = String(projectile?.meta?.targetKind || "");
    if (targetKind === "castle") return { x:0, y:SS_CASTLE_BASE_Y + 1.35, z:0 };
    if (targetKind === "device") {
      const d = ssDeviceById(projectile?.meta?.targetDeviceId || projectile?.targetId);
      if (d) return { x:d.x, y:Number(d.y||0)+Number(d.height||1)*0.58, z:d.z };
    }
    if (targetKind === "unit") {
      const u = ssSpawnedUnitById(projectile?.targetId);
      if (u) return { x:u.x, y:Number(u.y||0)+0.45, z:u.z };
    }
    const e = ssEnemyById(projectile?.targetId);
    if (e) return { x:e.x, y:Number(e.y||0)+0.85, z:e.z };
    return null;
  }

  function ssAddProjectileTrailPolish(projectile, basis) {
    if (!projectile || Number(projectile.age || 0) <= 0) return;
    const target = ssProjectilePolishTarget(projectile);
    if (!target) return;
    const dx = target.x - projectile.x;
    const dy = target.y - projectile.y;
    const dz = target.z - projectile.z;
    const len = Math.hypot(dx,dy,dz) || 1;
    const ux = dx/len, uy=dy/len, uz=dz/len;
    const r = Math.max(0.055, Number(projectile.radius || 0.12));
    const color = ssProjectilePolishColor(projectile);
    const kind = String(projectile?.meta?.kind || projectile?.sourceKind || "").toLowerCase();
    const trailScale = kind.includes("artillery") ? 1.6 : kind.includes("battery") ? 1.35 : kind.includes("mode") ? 1.25 : 1;
    const count = kind.includes("aeolian") ? 2 : 3;
    for (let i=1;i<=count;i++) {
      const d = r * trailScale * (1.8 + i*1.55);
      const alpha = 0.34 * (1 - (i-1)/(count+0.4));
      ssAddFacetedSphere(projectile.x-ux*d, projectile.y-uy*d, projectile.z-uz*d, r*(0.52-i*0.07), basis, {
        palette:[color,"#ffffff"], alpha, latSegments:3, lonSegments:5, yaw:Number(projectile.age||0)*2+i
      });
    }
    if (Number(projectile.age || 0) < 0.105) {
      const flash = 1 - Number(projectile.age||0)/0.105;
      ssAddHorizontalRing(projectile.x, projectile.y, projectile.z, r*0.35, r*(1.35+flash*1.45), color, basis, 0.34+flash*0.46, Number(projectile.age||0)*9, 12);
      ssAddFacetedSphere(projectile.x, projectile.y, projectile.z, r*(0.75+flash*0.75), basis, {palette:["#ffffff",color],alpha:0.32+flash*0.45,latSegments:3,lonSegments:6});
    }
  }

  function ssSpawnProjectilePolishImpact(projectile, x, y, z, healing = false) {
    ssCombatEffects.push({
      effectId:`effect-${ssCombatSerial++}`,
      kind: healing ? "heal-polish-impact" : "projectile-polish-impact",
      x:Number(x||0), y:Number(y||0), z:Number(z||0),
      age:0, duration:healing ? 0.34 : 0.26,
      radius:Math.max(0.28, Number(projectile?.radius||0.12)*3.2),
      color:ssProjectilePolishColor(projectile),
      meta:{ sourceKind:projectile?.sourceKind || "", projectileKind:projectile?.meta?.kind || "" }
    });
  }

  function ssDevicePolishMode(typeId) {
    const id=String(typeId||"").toLowerCase();
    if (id.includes("mode-ionian")) return {color:"#b7f5d8",accent:"#ffffff",speed:0.55};
    if (id.includes("mode-dorian")) return {color:"#6ee7b7",accent:"#e7d6a0",speed:0.42};
    if (id.includes("mode-phrygian")) return {color:"#86efac",accent:"#d9ff8f",speed:0.72};
    if (id.includes("mode-lydian")) return {color:"#fde68a",accent:"#ffffff",speed:1.1};
    if (id.includes("mode-mixolydian")) return {color:"#f0abfc",accent:"#93c5fd",speed:1.55};
    if (id.includes("mode-aeolian")) return {color:"#93c5fd",accent:"#ffe169",speed:1.8};
    if (id.includes("mode-locrian")) return {color:"#c4b5fd",accent:"#f0abfc",speed:0.66};
    return null;
  }

  function ssAddDeviceCombatPolish(device, basis) {
    if (!device || Number(device.health||0)<=0) return;
    const typeId=String(device.typeId || device.item?.id || "");
    const mode=ssDevicePolishMode(typeId);
    const y=Number(device.y||0)+Math.max(0.22,Number(device.height||1)*0.12);
    const baseR=Math.max(0.30,Math.min(Number(device.footprintHalfX||0.55),Number(device.footprintHalfZ||0.55)));
    if (mode) {
      const phase=ssCombatClock*mode.speed + Number(device.x||0)*0.17 + Number(device.z||0)*0.11;
      const pulse=0.92+Math.sin(phase*2.1)*0.08;
      ssAddHorizontalRing(device.x,y,device.z,baseR*0.92,baseR*1.17*pulse,mode.color,basis,0.20,phase,18);
      ssAddHorizontalRing(device.x,y+0.09,device.z,baseR*0.54,baseR*0.72,mode.accent,basis,0.12,-phase*1.3,14);
      for(let i=0;i<2;i++){
        const a=phase*1.6+i*Math.PI;
        ssAddFacetedSphere(device.x+Math.cos(a)*baseR*0.86,y+0.25+Math.sin(a*1.3)*0.10,device.z+Math.sin(a)*baseR*0.86,0.045,basis,{palette:[mode.color,mode.accent],alpha:0.38,latSegments:3,lonSegments:5});
      }
      return;
    }
    const color=ssDeviceUiColor(device);
    const tier=Math.max(2,Math.min(6,Number((typeId.match(/-(\d)$/)||[])[1]||2)));
    if (tier>=4) {
      const phase=ssCombatClock*(0.35+tier*0.04)+Number(device.x||0)*0.13;
      ssAddHorizontalRing(device.x,y,device.z,baseR*0.84,baseR*(0.98+tier*0.025),color,basis,0.07+tier*0.012,phase,14);
    }
  }

  function ssAddCombatProjectile(projectile, basis) {

    if (ssPerformanceVisualLOD && ssProjectiles.length >= SS_PERF_PROJECTILE_LOD_THRESHOLD) {
      const r = Math.max(0.10, Number(projectile?.radius || 0.14));
      const color = String(projectile?.color || "#ffffff");
      const center = { x:Number(projectile?.x || 0), y:Number(projectile?.y || 0), z:Number(projectile?.z || 0) };
      ssAddBillboardRect(center, basis, r * 2.35, r * 2.35, color, 0.025);
      ssAddBillboardRect(center, basis, r * 1.05, r * 1.05, "#ffffff", 0.045);
      return;
    }

    ssAddProjectileTrailPolish(projectile, basis);

    if (projectile?.meta?.kind === "enemy-siege-shot") {
      const r = Math.max(0.14, Number(projectile.radius || 0.18));
      const age = Number(projectile.age || 0);
      const allied = projectile.ownerAllegiance === "player";
      const core = allied ? "#8fd3ff" : "#ff8a3d";
      const glow = allied ? "#e8f7ff" : "#ffd0a8";
      ssAddFacetedSphere(projectile.x, projectile.y, projectile.z, r, basis, {
        palette: ["#34323b", core, glow], alpha: 0.98, latSegments: 4, lonSegments: 8, yaw: age * 5.2
      });
      ssAddHorizontalRing(projectile.x, projectile.y, projectile.z, r*0.72, r*1.30, core, basis, 0.72, age*6.0, 14);
      return;
    }

    if (projectile?.meta?.kind === "sludge-array-shot") {
      const r = Math.max(0.19, Number(projectile.radius || 0.225));
      const age = Number(projectile.age || 0);
      const phase = Number(projectile.meta?.phase || 0);
      const wobble = 1 + Math.sin(age*17 + Number(projectile.meta?.wobbleSeed || 0)) * 0.12;

      for (let i=0;i<3;i++) {

      const spin = Number(projectile.age || 0) * 8.5;
      ssAddHorizontalRing(projectile.x, projectile.y, projectile.z, r * 0.56, r, "#fff1a8", basis, 0.98, spin, 16);
      ssAddHorizontalRing(projectile.x, projectile.y + 0.012, projectile.z, r * 0.72, r * 1.22, "#ffffff", basis, 0.24, -spin * 0.45, 16);
      return;
    }
    if (projectile?.meta?.kind === "lydian-angel-beam") {
      const center = { x: projectile.x, y: projectile.y, z: projectile.z };
      const pulse = 0.75 + Math.sin(Number(projectile.age || 0) * 24) * 0.15;
      ssAddBillboardRect(center, basis, 0.42, 0.16, "#fff8b8", 0.04);
      ssAddBillboardRect(center, basis, 0.20, 0.34, "#ffffff", 0.06);
      ssAddHorizontalRing(projectile.x, projectile.y, projectile.z, 0.07, 0.16 + pulse * 0.05, "#fde68a", basis, 0.55, projectile.age * 7, 12);
      return;
    }
    ssAddBox(projectile.x, projectile.y - projectile.radius, projectile.z,
      projectile.radius * 2, projectile.radius * 2, projectile.radius * 2,
      projectile.color || "#ffffff", basis, 0);
  }

  function ssAddCombatEffectVisual(effect, basis) {
    if (effect?.kind === "mending-lantern-beam") {
      const target = ssDeviceById(effect.meta?.targetDeviceId);
      const tx = target ? target.x : Number(effect.meta?.tx || effect.x);
      const ty = target ? Number(target.y || 0) + Number(target.height || 1) * 0.58 : Number(effect.meta?.ty || effect.y);
      const tz = target ? target.z : Number(effect.meta?.tz || effect.z);
      const pulse = 0.75 + 0.25*Math.sin((Number(effect.age||0)/Math.max(0.01,Number(effect.duration||0.34)))*Math.PI);
      for (let i=1;i<=7;i++) {
        const t=i/8;
        const x=effect.x+(tx-effect.x)*t;
        const y=effect.y+(ty-effect.y)*t;
        const z=effect.z+(tz-effect.z)*t;
        ssAddFacetedSphere(x,y,z,(0.034+0.008*pulse),basis,{palette:["#ffffff","#d9ffd0","#8ff083"],alpha:0.78,latSegments:3,lonSegments:5});
      }
      ssAddFacetedSphere(tx,ty,tz,0.075+0.018*pulse,basis,{palette:["#ffffff","#d9ffd0","#8ff083"],alpha:0.88,latSegments:3,lonSegments:6});
      return;
    }
    if (!effect) return;

    if (effect.kind === "projectile-polish-impact") {
      const life=ssClamp(1-Number(effect.age||0)/Math.max(0.001,Number(effect.duration||0.26)),0,1);
      const grow=1-life;
      const r=Math.max(0.18,Number(effect.radius||0.34))*(0.48+grow*1.18);
      const color=effect.color||"#ffffff";
      ssAddHorizontalRing(effect.x,effect.y,effect.z,r*0.18,r,color,basis,life*0.62,Number(effect.age||0)*7,14);
      ssAddHorizontalRing(effect.x,effect.y+0.05,effect.z,r*0.08,r*0.62,"#ffffff",basis,life*0.30,-Number(effect.age||0)*9,12);
      for(let i=0;i<4;i++){
        const a=i*Math.PI*0.5+Number(effect.age||0)*2.4;
        ssAddFacetedSphere(effect.x+Math.cos(a)*r*0.52,effect.y+0.05+Math.sin(a*1.3)*r*0.16,effect.z+Math.sin(a)*r*0.52,r*0.10,basis,{palette:[color,"#ffffff"],alpha:life*0.54,latSegments:3,lonSegments:5});
      }
      return;
    }

    if (effect.kind === "heal-polish-impact") {
      const life=ssClamp(1-Number(effect.age||0)/Math.max(0.001,Number(effect.duration||0.34)),0,1);
      const grow=1-life;
      const r=Math.max(0.18,Number(effect.radius||0.34))*(0.38+grow*0.92);
      const color=effect.color||"#a8ff96";
      ssAddHorizontalRing(effect.x,effect.y,effect.z,r*0.30,r,color,basis,life*0.46,Number(effect.age||0)*4.2,16);
      const c={x:effect.x,y:effect.y+0.16,z:effect.z};
      ssAddBillboardRect(c,basis,r*0.18,r*0.70,"#ffffff",0.04);
      ssAddBillboardRect(c,basis,r*0.70,r*0.18,color,0.05);
      for(let i=0;i<3;i++){
        const a=i*Math.PI*2/3+Number(effect.age||0)*2;
        ssAddFacetedSphere(effect.x+Math.cos(a)*r*0.48,effect.y+0.16+grow*r*0.45,effect.z+Math.sin(a)*r*0.48,r*0.09,basis,{palette:[color,"#ffffff"],alpha:life*0.58,latSegments:3,lonSegments:5});
      }
      return;
    }

    if (effect.kind === "castle-fire-particle") {
      const duration = Math.max(0.001, Number(effect.duration || 0.95));
      const life = ssClamp(1 - Number(effect.age || 0) / duration, 0, 1);
      const grow = 1 - life;
      const r = Math.max(0.14, Number(effect.radius || 0.34)) * (0.70 + grow * 0.78);
      const c = { x: effect.x, y: effect.y + grow * r * 0.22, z: effect.z };
      ssAddBillboardShape(
        c, basis,
        [[-r*0.62,-r*0.34],[-r*0.46,r*0.12],[-r*0.18,r*0.48],[r*0.08,r*0.60],[r*0.42,r*0.34],[r*0.62,-r*0.06],[r*0.30,-r*0.52],[-r*0.24,-r*0.58]],
        "#ff7a2f",
        life * Number(effect.alpha || 0.84),
        0.03
      );
      ssAddBillboardShape(
        { x: c.x, y: c.y + r*0.06, z: c.z }, basis,
        [[-r*0.34,-r*0.20],[-r*0.26,r*0.16],[-r*0.06,r*0.36],[r*0.20,r*0.32],[r*0.34,0],[r*0.12,-r*0.34],[-r*0.16,-r*0.36]],
        "#ffb347",
        life * Math.min(1, Number(effect.alpha || 0.84) + 0.06),
        0.04
      );
      ssAddBillboardShape(
        { x: c.x, y: c.y + r*0.12, z: c.z }, basis,
        [[-r*0.18,-r*0.10],[-r*0.10,r*0.16],[r*0.04,r*0.22],[r*0.18,r*0.08],[r*0.10,-r*0.16],[-r*0.08,-r*0.18]],
        "#fff2b5",
        life * 0.86,
        0.05
      );
      return;
    }

        if (effect.kind === "castle-smoke-particle") {
      const duration = Math.max(0.001, Number(effect.duration || 1.8));
      const life = ssClamp(1 - Number(effect.age || 0) / duration, 0, 1);
      const grow = 1 - life;
      const r = Math.max(0.16, Number(effect.radius || 0.26)) * (0.78 + grow * 1.10);
      const c = { x: effect.x, y: effect.y, z: effect.z };
      ssAddBillboardShape(
        c, basis,
        [[-r*0.70,-r*0.45],[-r*0.50,r*0.30],[-r*0.12,r*0.62],[r*0.36,r*0.54],[r*0.68,r*0.08],[r*0.54,-r*0.48],[0,-r*0.62]],
        "#625e66",
        life * Number(effect.alpha || 0.48),
        0.02
      );
      return;
    }

    if (effect.kind === "player-sword-air") {
      const duration = Math.max(0.001, Number(effect.duration || effect.life || 0.20));
      const progress = ssClamp(Number(effect.age || 0) / duration, 0, 1);
      const eased = 1 - Math.pow(1 - progress, 2);
      const radius = Number(effect.startRadius || 0.72) + (Number(effect.maxRadius || SS_PLAYER_SWORD_RANGE) - Number(effect.startRadius || 0.72)) * eased;
      const halfArc = Math.max(0.25, Number(effect.arcRadians || Math.PI * 0.75) * 0.5);
      const alpha = (1 - progress) * 0.28;
      const segments = 11;
      for (let i = 0; i < segments; i += 1) {
        const t = segments <= 1 ? 0.5 : i / (segments - 1);
        const angle = Number(effect.facing || 0) + (t * 2 - 1) * halfArc;
        const px = Number(effect.x || 0) + Math.sin(angle) * radius;
        const pz = Number(effect.z || 0) - Math.cos(angle) * radius;
        const lift = Math.sin(t * Math.PI) * 0.16;
        ssAddBox(px, Number(effect.y || 0) - 0.34 + lift, pz, 0.42, 0.72, 0.055, "#dff7ff", basis, angle, { alpha });
      }
      return;
    }

    if (effect.kind === "player-sword-hit") {
      const life = ssClamp(1 - Number(effect.age || 0) / Math.max(0.001, Number(effect.life || 0.18)), 0, 1);
      const radius = Math.max(0.16, Number(effect.radius || 0.34)) * (0.45 + (1-life)*0.75);
      ssAddHorizontalRing(effect.x, effect.y, effect.z, radius*0.18, radius, "#f7fbff", basis, life*0.72, 0, 12);
      return;
    }

    if (effect.kind === "siege-impact") {
      const life = ssClamp(1 - Number(effect.age || 0) / Math.max(0.001, Number(effect.life || effect.duration || 0.30)), 0, 1);
      const radius = Math.max(0.16, Number(effect.radius || 0.48)) * (0.32 + (1-life)*0.78);
      const color = effect.color || "#ffc08d";
      ssAddHorizontalRing(effect.x, effect.y, effect.z, radius*0.20, radius, color, basis, life*0.76, Number(effect.age||0)*8.0, 16);
      ssAddFacetedSphere(effect.x, effect.y, effect.z, radius*0.34, basis, {
        palette:["#ffffff",color,"#4b4547"], alpha:life*0.84, latSegments:3, lonSegments:6, yaw:Number(effect.age||0)*5.0
      });
      return;
    }

    if (effect.kind === "phrygian-poison-burst") {
      const life = ssClamp(1 - Number(effect.age || 0) / Math.max(0.001, Number(effect.duration || 0.55)), 0, 1);
      const radius = Math.max(0.2, Number(effect.radius || SS_PHRYGIAN_POISON_PUDDLE_RADIUS)) * (0.25 + (1-life)*0.72);
      ssAddHorizontalRing(effect.x,effect.y,effect.z,radius*0.20,radius,"#7dbd4e",basis,life*0.70,Number(effect.age||0)*5.5,18);
      ssAddHorizontalRing(effect.x,effect.y+0.08,effect.z,radius*0.10,radius*0.68,"#b7e879",basis,life*0.42,-Number(effect.age||0)*7.2,14);
      return;
    }

    if (effect.kind === "aeolian-kill-burst") {
      const life = ssClamp(1 - Number(effect.age || 0) / Math.max(0.001, Number(effect.duration || 0.72)), 0, 1);
      const grow = 0.18 + (1 - life) * 0.82;
      const radius = Math.max(0.18, Number(effect.radius || SS_AEOLIAN_KILL_BURST_RADIUS)) * grow;
      const element = effect.meta?.element || "wind";
      if (element === "fire") {
        ssAddHorizontalRing(effect.x,effect.y,effect.z,radius*0.18,radius,"#ef5a24",basis,life*0.72,Number(effect.age||0)*4.8,18);
        const c = {x:effect.x,y:effect.y+radius*0.18,z:effect.z};
        ssAddBillboardShape(c,basis,[[0,radius*0.72],[-radius*0.48,-radius*0.36],[0,-radius*0.12],[radius*0.42,-radius*0.40]],"#ff7a28",life*0.82,0.03);
        ssAddBillboardShape(c,basis,[[0,radius*0.42],[-radius*0.20,-radius*0.26],[radius*0.18,-radius*0.28]],"#ffe169",life*0.92,0.05);
      } else if (element === "ice") {
        ssAddHorizontalRing(effect.x,effect.y,effect.z,radius*0.30,radius,"#8ee9ff",basis,life*0.52,0,16);
        const c = {x:effect.x,y:effect.y,z:effect.z};
        for (const ox of [-0.52,0,0.52]) ssAddBillboardShape(c,basis,[[ox*radius,radius*0.56],[(ox-0.12)*radius,-radius*0.44],[(ox+0.12)*radius,-radius*0.44]],"#dff9ff",life*0.82,0.04);
      } else if (element === "lightning") {
        const c = {x:effect.x,y:effect.y,z:effect.z};
        const spokes = [[0,0.85,0.28,0.18],[0.1,0.2,-0.5,-0.72],[-0.1,0.15,0.68,-0.18],[-0.2,0.3,-0.75,-0.12]];
        spokes.forEach(([x1,y1,x2,y2]) => ssAddBillboardSegment(c,basis,x1*radius,y1*radius,x2*radius,y2*radius,radius*0.11,"#ffe94a",life*0.92,0.04));
      } else {
        ssAddHorizontalRing(effect.x,effect.y,effect.z,radius*0.44,radius,"#d9f7ff",basis,life*0.54,Number(effect.age||0)*6.5,18);
        ssAddHorizontalRing(effect.x,effect.y+0.06,effect.z,radius*0.20,radius*0.70,"#ffffff",basis,life*0.30,-Number(effect.age||0)*8.2,16);
      }
      return;
    }

    if (effect.kind === "dorian-convert-burst") {
      const life = ssClamp(1 - Number(effect.age || 0) / Math.max(0.001, Number(effect.duration || 0.65)), 0, 1);
      const radius = Number(effect.radius || 1.1) * (0.25 + (1-life)*0.9);
      ssAddHorizontalRing(effect.x,effect.y,effect.z,radius*0.50,radius,"#2dd4bf",basis,life*0.66,Number(effect.age||0)*5,18);
      return;
    }

    if (effect.kind === "locrian-mass-panic") {
      const life = ssClamp(1 - Number(effect.age || 0) / Math.max(0.001, Number(effect.duration || 0.85)), 0, 1);
      const radius = Math.max(0.18, Number(effect.radius || SS_LOCRIAN_PANIC_RADIUS)) * (0.18 + (1-life)*0.82);
      ssAddHorizontalRing(effect.x,effect.y,effect.z,radius*0.58,radius,"#d8b4fe",basis,life*0.48,Number(effect.age||0)*5.2,20);
      ssAddHorizontalRing(effect.x,effect.y+0.06,effect.z,radius*0.24,radius*0.72,"#f0abfc",basis,life*0.25,-Number(effect.age||0)*7.4,16);
    }
  }

  function ssAddPhrygianSnakeUnit(unit, basis) {
    if (!unit || !unit.alive) return;
    const yaw = Number(unit.facing || 0);
    const wiggle = Number(unit.meta?.wiggle || 0);
    const c = Math.cos(yaw), sn = Math.sin(yaw);
    const rightX = c, rightZ = sn;
    const backX = -sn, backZ = c;
    const y = Number(unit.y || 0);
    const bodyColor = "#34794d";
    const bellyColor = "#a8d46f";
    for (let i = 0; i < 7; i += 1) {
      const t = i / 6;
      const back = 0.12 + i * 0.105;
      const side = Math.sin(wiggle - i * 0.78) * (0.055 + t * 0.018);
      const x = unit.x + backX * back + rightX * side;
      const z = unit.z + backZ * back + rightZ * side;
      const w = 0.23 - t * 0.11;
      ssAddBox(x, y + 0.025, z, w, 0.10, 0.17 - t*0.055, bodyColor, basis, yaw, { alpha: 1 });
    }
    const hx = unit.x - backX * 0.015;
    const hz = unit.z - backZ * 0.015;
    ssAddBox(hx, y + 0.055, hz, 0.34, 0.18, 0.28, bodyColor, basis, yaw, { alpha: 1 });
    ssAddBox(hx - backX*0.035, y + 0.02, hz - backZ*0.035, 0.25, 0.06, 0.23, bellyColor, basis, yaw, { alpha: 1 });
    for (const side of [-1,1]) {
      const fx = hx + rightX * side * 0.082 - backX * 0.13;
      const fz = hz + rightZ * side * 0.082 - backZ * 0.13;
      ssAddBox(fx, y - 0.005, fz, 0.028, 0.105, 0.028, "#fff9df", basis, yaw, { alpha: 1 });
    }
  }


  function ssAddIonianNurseUnit(unit, basis) {
    if (!unit || !unit.alive) return;
    const yaw = Number(unit.facing || 0);
    const c = Math.cos(yaw), s = Math.sin(yaw);
    const rightX = c, rightZ = s;
    const forwardX = -s, forwardZ = c;
    const y = Number(unit.y || 0);
    const step = Math.sin(Number(unit.meta?.stepPhase || 0)) * 0.055;
    const workBob = unit.meta?.state === "repair" ? Math.sin(Number(unit.meta?.workPhase || 0)) * 0.035 : 0;
    const skin = "#e3b89d";
    const white = "#f8fafc";
    const pale = "#dceef7";
    const red = "#dc2626";

    // legs
    for (const side of [-1,1]) {
      const lx = unit.x + rightX * side * 0.10 + forwardX * step * side;
      const lz = unit.z + rightZ * side * 0.10 + forwardZ * step * side;
      ssAddBox(lx, y + 0.02, lz, 0.11, 0.34, 0.12, "#f3f4f6", basis, yaw, { alpha: 1 });
      ssAddBox(lx - forwardX*0.035, y - 0.015, lz - forwardZ*0.035, 0.13, 0.08, 0.22, "#334155", basis, yaw, { alpha: 1 });
    }

    ssAddBox(unit.x, y + 0.32 + workBob, unit.z, 0.44, 0.54, 0.28, white, basis, yaw, { alpha: 1 });
    ssAddBox(unit.x, y + 0.74 + workBob, unit.z, 0.34, 0.34, 0.32, skin, basis, yaw, { alpha: 1 });
    ssAddBox(unit.x - forwardX*0.02, y + 0.91 + workBob, unit.z - forwardZ*0.02, 0.39, 0.10, 0.35, white, basis, yaw, { alpha: 1 });
    ssAddBox(unit.x - forwardX*0.13, y + 0.88 + workBob, unit.z - forwardZ*0.13, 0.18, 0.08, 0.07, red, basis, yaw, { alpha: 1 });

    // arms, with a small reaching motion while repairing
    const reach = unit.meta?.state === "repair" ? 0.11 : 0.02;
    for (const side of [-1,1]) {
      const ax = unit.x + rightX * side * 0.27 - forwardX * reach;
      const az = unit.z + rightZ * side * 0.27 - forwardZ * reach;
      ssAddBox(ax, y + 0.40 + workBob, az, 0.11, 0.42, 0.11, pale, basis, yaw, { alpha: 1 });
    }

    // red cross on the front of the uniform
    const chestX = unit.x - forwardX * 0.155;
    const chestZ = unit.z - forwardZ * 0.155;
    ssAddBox(chestX, y + 0.53 + workBob, chestZ, 0.16, 0.045, 0.045, red, basis, yaw, { alpha: 1 });
    ssAddBox(chestX, y + 0.47 + workBob, chestZ, 0.055, 0.18, 0.045, red, basis, yaw, { alpha: 1 });

    // Small health bar makes it clear that nurses are vulnerable battlefield units.
    const pct = ssClamp(unit.health / Math.max(1, unit.maxHealth), 0, 1);
    const barCenter = { x: unit.x, y: y + 1.18 + workBob, z: unit.z };
    ssAddBillboardRect(barCenter, basis, 0.64, 0.11, "#101827", 0);
    if (pct > 0.001) {
      const fillWidth = 0.56 * pct;
      const shift = -(0.56 - fillWidth) * 0.5;
      const fillCenter = ssBillboardPoint(barCenter, basis, shift, 0, 0.025);
      ssAddBillboardRect(fillCenter, basis, fillWidth, 0.06, "#f87171", 0);
    }
  }

  function ssAddLocrianGhostUnit(unit, basis) {
    if (!unit || !unit.alive) return;
    const yaw = Number(unit.facing || 0);
    const pulse = 0.86 + Math.sin(Number(unit.age || 0)*7.8 + Number(unit.meta?.phase || 0))*0.10;
    const pale = "#c8fff0";
    const glow = "#72f1c1";
    const shadow = "#5b4b75";
    const y = Number(unit.y || 0);
    ssAddBox(unit.x,y,unit.z,0.62*pulse,0.66,0.48*pulse,pale,basis,yaw,{ alpha:0.58 });
    ssAddBox(unit.x,y+0.52,unit.z,0.52,0.46,0.46,"#e7fff8",basis,yaw,{ alpha:0.66 });
    const c = Math.cos(yaw), s = Math.sin(yaw);
    const forwardX = -s, forwardZ = c, rightX = c, rightZ = s;
    for (const side of [-1,1]) {
      const ex = unit.x - forwardX*0.245 + rightX*side*0.115;
      const ez = unit.z - forwardZ*0.245 + rightZ*side*0.115;
      ssAddBox(ex,y+0.72,ez,0.065,0.08,0.035,shadow,basis,yaw,{ alpha:0.86 });
    }
    // Three wispy tails keep the silhouette unmistakably spectral from the elevated camera.
    for (let i = 0; i < 3; i += 1) {
      const side = (i-1)*0.17;
      const tx = unit.x + forwardX*0.13 + rightX*side;
      const tz = unit.z + forwardZ*0.13 + rightZ*side;
      ssAddBox(tx,y-0.25-i*0.025,tz,0.15,0.32,0.16,glow,basis,yaw,{ alpha:0.34 });
    }
    ssAddHorizontalRing(unit.x,y+0.20,unit.z,0.26,0.46,glow,basis,0.16,Number(unit.age || 0)*1.8,12);
  }


  function ssAddLydianAngelUnit(unit, basis) {
    if (!unit || !unit.alive) return;
    const yaw = Number(unit.facing || 0);
    const y = Number(unit.y || 0);
    const c = Math.cos(yaw), s = Math.sin(yaw);
    const localPoint = (lx, ly, lz) => ({
      x: unit.x + lx*c - lz*s,
      y: y + ly,
      z: unit.z + lx*s + lz*c
    });

    ssAddBox(unit.x, y - 0.18, unit.z, 0.54, 0.72, 0.38, "#f8fafc", basis, yaw, { alpha: 0.96 });
    ssAddBox(unit.x, y + 0.47, unit.z, 0.42, 0.42, 0.40, "#fff7ed", basis, yaw, { alpha: 1 });

    for (const side of [-1,1]) {
      ssAddPolygon([
        localPoint(side*0.20, 0.42, 0.06),
        localPoint(side*0.95, 0.76, 0.14),
        localPoint(side*0.76, -0.02, 0.20),
        localPoint(side*0.20, 0.16, 0.08)
      ], "#ffffff", basis, 0.94, null, "world");
      ssAddPolygon([
        localPoint(side*0.24, 0.30, 0.10),
        localPoint(side*0.72, 0.05, 0.20),
        localPoint(side*0.48, -0.30, 0.18),
        localPoint(side*0.18, 0.04, 0.10)
      ], "#dbeafe", basis, 0.82, null, "world");
    }
    ssAddHorizontalRing(unit.x, y + 0.86, unit.z, 0.24, 0.38, "#fff1a8", basis, 0.98, unit.age * 0.9, 18);
    ssAddHorizontalRing(unit.x, y + 0.865, unit.z, 0.30, 0.46, "#ffffff", basis, 0.24, -unit.age * 0.6, 18);

    // Field-life bar: time drains continuously; enemy attacks shorten the same pool.
    const lifePct = ssClamp(unit.health / Math.max(0.001, unit.maxHealth), 0, 1);
    const lifeCenter = { x: unit.x, y: y + 1.22, z: unit.z };
    ssAddBillboardRect(lifeCenter, basis, 0.78, 0.12, "#101827", 0);
    if (lifePct > 0.001) {
      const fillWidth = 0.70 * lifePct;
      const shift = -(0.70 - fillWidth) * 0.5;
      const fillCenter = ssBillboardPoint(lifeCenter, basis, shift, 0, 0.025);
      ssAddBillboardRect(fillCenter, basis, fillWidth, 0.065, "#fde68a", 0);
    }

  }

  function ssAddSpawnedUnit(unit, basis) {
    if (!unit || !unit.alive) return;
    if (ssPerformanceVisualLOD) {
      const distance = Math.hypot(Number(unit.x || 0) - ssPlayer.x, Number(unit.z || 0) - ssPlayer.z);
      if (distance >= SS_PERF_UNIT_LOD_DISTANCE) {
        const color = unit.kind === "ionian-nurse" ? "#efffe8"

  function ssCraftedInstanceFromDeviceRecipe(typeId, recipe, moveBundleId = null) {

    return bundle.instanceIds.map(id => byId.get(id)).filter(Boolean);

  function ssMovingPlacementStackResult(preview) {

      : 1;

  function ssTryPlaceMovingDeviceBundle(preview) {
    const bundle = ssMovingDeviceBundle;

    if (!movedInstances.length) {

    const typeId = bundle.typeId;
    const target = preview.stackTargetId

    if (target) {
      const current = Math.max(1, Number(target.stackCount || 1));
      const capacity = Math.max(0, SS_MAX_DEVICE_STACKS - current);
      if (capacity <= 0) return false;

      const transferCount = Math.min(capacity, movedInstances.length);
      const transferring = movedInstances.slice(0, transferCount);
      const recipes = transferring.map(ssRecipeFromCraftedInstance);

      if (transferCount === movedInstances.length) {

    device.footprintHalfZ = preview.footprintHalfZ;

    device.baseDepth = preview.baseDepth;
    device.baseSize = preview.baseSize;
    device.height = preview.height;

    device.collisionMode = preview.collisionMode;
    device.walkableTop = preview.walkableTop;
    device.color = preview.color;
    device.sourceRecipes = remainingRecipes;
    device.sourceRecipe = remainingRecipes[0] || null;
    device.stackCount = remainingRecipes.length;
    device.powerMultiplier = ssStackPowerMultiplier(device.stackCount);

  }

  function ssAddMatchingPlacementGlow(device, basis) {
    if (!device || !ssPlacementActive || !ssPlacementPreview || ssCraftOverlayOpen) return;
    const typeId = ssPlacementPreview.item?.id || null;
    if (!typeId || device.typeId !== typeId) return;

    const stackCount = Math.max(1, Number(device.stackCount || 1));
    if (stackCount >= SS_MAX_DEVICE_STACKS) return;

    const halfX = Number(device.footprintHalfX ?? ((device.baseWidth || device.baseSize || 1.2) * 0.5));
    const halfZ = Number(device.footprintHalfZ ?? ((device.baseDepth || device.baseSize || 1.2) * 0.5));
    const radius = Math.max(0.68, Math.hypot(halfX, halfZ));
    const baseY = Number.isFinite(Number(device.y)) ? Number(device.y) : ssGroundHeight(device.x, device.z);
    const height = Math.max(0.8, Number(device.height || 1));
    const pulse = 1.00 + Math.sin(ssCombatClock * 5.4 + Number(device.x || 0) * 0.17 + Number(device.z || 0) * 0.13) * 0.16;
    const color = ssDeviceUiColor(device) || "#ffffff";

    ssAddHorizontalRing(device.x, baseY + 0.045, device.z, radius * 1.26, radius * 2.35 * pulse, "#ffffff", basis, 0.98, ssCombatClock * 0.72, 32);
    ssAddHorizontalRing(device.x, baseY + 0.070, device.z, radius * 1.04, radius * 1.92 * pulse, color, basis, 1.00, -ssCombatClock * 0.88, 30);
    ssAddHorizontalRing(device.x, baseY + 0.105, device.z, radius * 0.82, radius * 1.50 * pulse, "#ffffff", basis, 0.94, ssCombatClock * 1.18, 28);

    ssAddHorizontalRing(device.x, baseY + height * 0.55, device.z, radius * 0.76, radius * 1.30 * pulse, color, basis, 0.86, -ssCombatClock * 1.05, 26);
    ssAddHorizontalRing(device.x, baseY + height + 0.28, device.z, radius * 0.62, radius * 1.10 * pulse, "#ffffff", basis, 0.96, ssCombatClock * 1.35, 24);

    // Tall vertical beacon so matching stack targets can be spotted at distance.
    const beamBottom = baseY + height + 0.12;
    const beamHeight = 8.5 + radius * 1.5;
    const beamTop = beamBottom + beamHeight;
    const outerHalf = Math.max(0.16, radius * 0.23) * pulse;
    const innerHalf = Math.max(0.07, radius * 0.10) * pulse;

    const addBeamCross = (halfWidth, beamColor, alpha) => {
      ssAddPolygon([
        { x: device.x - halfWidth, y: beamBottom, z: device.z },
        { x: device.x + halfWidth, y: beamBottom, z: device.z },
        { x: device.x + halfWidth, y: beamTop, z: device.z },
        { x: device.x - halfWidth, y: beamTop, z: device.z }
      ], beamColor, basis, alpha, null, "world");
      ssAddPolygon([
        { x: device.x, y: beamBottom, z: device.z - halfWidth },
        { x: device.x, y: beamBottom, z: device.z + halfWidth },
        { x: device.x, y: beamTop, z: device.z + halfWidth },
        { x: device.x, y: beamTop, z: device.z - halfWidth }
      ], beamColor, basis, alpha, null, "world");
    };

    addBeamCross(outerHalf, color, 0.28);
    addBeamCross(innerHalf, "#ffffff", 0.72);
  }
  function ssFindStackTarget(x, z, meta, yaw, typeId) {
    if (!typeId) return null;
    let best = null;
    let bestDistance = Infinity;
    const previewRadius = Math.hypot(
      Math.max(0.01, Number(meta?.footprintHalfX || 0.5)),
      Math.max(0.01, Number(meta?.footprintHalfZ || 0.5))
    );

    for (const device of ssPlacedDevices) {
      if (!device || device.typeId !== typeId) continue;

      const dhx = Number(device.footprintHalfX ?? ((device.baseWidth || device.baseSize || 1.2) * 0.5));
      const dhz = Number(device.footprintHalfZ ?? ((device.baseDepth || device.baseSize || 1.2) * 0.5));
      const deviceRadius = Math.hypot(dhx, dhz);
      const distance = Math.hypot(device.x - x, device.z - z);

      // Stacking uses a generous snap radius instead of requiring the two
      // footprints to overlap almost perfectly.
      const stackSnapRadius = Math.max(2.25, previewRadius + deviceRadius + 0.65);
      if (distance > stackSnapRadius) continue;

      if (distance < bestDistance) {
        best = device;
        bestDistance = distance;
      }
    }
    return best;
  }

  function ssPhysicalTowerCount() {
    let count = 0;

    return count;
  }

  function ssEvaluatePlacement(x, z, meta, yaw = 0, typeId = null) {
    const corners = ssObbCorners2D(x,z,meta.footprintHalfX,meta.footprintHalfZ,yaw);
    if (corners.some(p => p.x < -SS_WORLD_HALF || p.x > SS_WORLD_HALF || p.z < -SS_WORLD_HALF || p.z > SS_WORLD_HALF)) {
      const h = ssGroundHeight(x,z);
      return { valid:false, reason:"WORLD EDGE", y:h, terrainMinY:h };
    }

    const stackTarget = ssFindStackTarget(x, z, meta, yaw, typeId);
    if (stackTarget) {
      const stackCount = Math.max(1, Number(stackTarget.stackCount || 1));
      if (stackCount >= SS_MAX_DEVICE_STACKS) {
        return {
          valid: false,
          reason: `STACK LIMIT ${SS_MAX_DEVICE_STACKS}`,
          y: Number(stackTarget.y),
          terrainMinY: Number(stackTarget.terrainMinY),
          stackTargetId: stackTarget.placedId,
          stackTarget
        };
      }
      return {
        valid: true,
        reason: "STACK",
        y: Number(stackTarget.y),
        terrainMinY: Number(stackTarget.terrainMinY),
        stackTargetId: stackTarget.placedId,
        stackTarget

    }

    if (ssPhysicalTowerCount() >= SS_MAX_PHYSICAL_TOWERS) {

    }

    if (ssPlacementHitsCastle(x,z,meta,yaw)) return { valid:false, reason:"CASTLE", y:supportY, terrainMinY:minH };

    for (const object of ssWorldObjects) {
      if (ssPlacementHitsWorldObject(x,z,meta,yaw,object)) {

      if (ssCircleIntersectsObb(
        resource.x, resource.z, Number(resource.collisionRadius || SS_RESOURCE_COLLISION_RADIUS),
        x,z,meta.footprintHalfX,meta.footprintHalfZ,yaw
      )) return { valid:false, reason:"NOTE RESOURCE", y:supportY, terrainMinY:minH };
    }

    for (const device of ssPlacedDevices) {
      const dhx = Number(device.footprintHalfX ?? ((device.baseWidth || device.baseSize || 1.2) * 0.5));
      const dhz = Number(device.footprintHalfZ ?? ((device.baseDepth || device.baseSize || 1.2) * 0.5));
      if (ssObbIntersectsObb(x,z,meta.footprintHalfX,meta.footprintHalfZ,yaw, device.x,device.z,dhx,dhz,device.yaw || 0)) {
        return { valid:false, reason:"DEVICE", y:supportY, terrainMinY:minH };
      }
    }

    return { valid:true, reason:"", y:supportY, terrainMinY:minH };
  }

      ssCraftCursorKey = null;
      ssCraftCursorAdvanceFromNote = null;
      ssCraftCursorLastX = null;
      ssCraftedInstances = Object.create(null);
      ssBuildCraftRecipes();
      ssSyncMobileCraftButtonLabel();
    }

    function ssSyncMobileCraftButtonLabel() {
      if (!ssIsMobileGame()) return;
      const craftButton = document.getElementById("buttonX");
      if (craftButton) craftButton.textContent = ssCraftOverlayOpen ? "Close" : "Craft";
    }

    function ssSetOverlay(name) {
      if (name !== "craft") return;
      ssCraftOverlayOpen = !ssCraftOverlayOpen;
      if (ssCraftOverlayOpen) {
        ssCraftSelection = [];
        ssCraftMessage = "";
        ssCraftMessageTimer = 0;
        ssCraftTab = "build";
        ssCraftCursorKey = null;
        ssCraftCursorAdvanceFromNote = null;
        ssCraftCursorLastX = null;
        ssCraftHitTargets = [];
      } else {
        ssCraftCursorKey = null;
        ssCraftCursorAdvanceFromNote = null;
      }
      ssSyncMobileCraftButtonLabel();
    }

    function ssToggleCraftOverlay(forceState) {
      if (typeof forceState === "boolean") {
        ssCraftOverlayOpen = forceState;
        if (forceState) {
          ssCraftSelection = [];
          ssCraftMessage = "";
          ssCraftMessageTimer = 0;
          ssCraftTab = "build";
          ssCraftCursorKey = null;
          ssCraftCursorAdvanceFromNote = null;
          ssCraftCursorLastX = null;
          ssCraftHitTargets = [];
        } else {
          ssCraftCursorKey = null;
          ssCraftCursorAdvanceFromNote = null;
        }
        ssSyncMobileCraftButtonLabel();
        return;
      }
      ssSetOverlay("craft");
    }

    function ssCraftSelectNote(note) {
      const candidates = ssCraftCandidateNotes();
      if (!candidates.has(note)) return false;
      if (ssIsMobileGame()) {
        const currentHit = ssCraftHitTargets.find(hit => hit.id === "note" && hit.data === note);
        if (currentHit) ssCraftCursorLastX = currentHit.x + currentHit.width * 0.5;
        ssCraftCursorAdvanceFromNote = note;
      }
      ssCraftSelection.push(note);
      const outcome = ssCraftOutcomeForSelection();
      if (outcome) {
        ssCraftMessage = `Ready: ${outcome.name}`;
        ssCraftMessageTimer = 120;
      } else {
        ssCraftMessage = "";
        ssCraftMessageTimer = 0;
      }
      return true;
    }

    function ssCraftUndo() {
      if (!ssCraftSelection.length) return;
      ssCraftSelection.pop();
      ssCraftMessage = "";
      ssCraftMessageTimer = 0;
    }

    function ssCraftClear() {
      ssCraftSelection = [];
      ssCraftMessage = "";
      ssCraftMessageTimer = 0;
    }

    function ssCommitCraft() {
      const outcome = ssCraftOutcomeForSelection();
      if (!outcome) {
        ssCraftMessage = "Build at least a valid 2-note fragment";
        ssCraftMessageTimer = 110;
        return false;
      }

      const needed = Object.create(null);
      for (const note of ssCraftSelection) needed[note] = Number(needed[note] || 0) + 1;
      for (const [note, count] of Object.entries(needed)) {
        if (Number(ssNoteInventory[note] || 0) < count) {
          ssCraftMessage = `Not enough ${note}`;
          ssCraftMessageTimer = 100;
          return false;
        }
      }

      for (const [note, count] of Object.entries(needed)) {
        ssNoteInventory[note] = Number(ssNoteInventory[note] || 0) - count;
      }

      const instance = {
        instanceId: `${outcome.id}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        typeId: outcome.id,
        tonic: ssCraftSelection[0],
        notes: ssCraftSelection.slice(),
        length: outcome.length,
        family: outcome.family || null,
        mode: outcome.mode || null
      };
      if (!ssCraftedInstances[outcome.id]) ssCraftedInstances[outcome.id] = [];
      ssCraftedInstances[outcome.id].push(instance);

      ssAddOrUpdateHotbarItem({
        id: outcome.id,
        name: outcome.name,
        shortLabel: outcome.shortLabel,
        icon: outcome.icon,
        hotbarColor: outcome.hotbarColor || (outcome.mode ? (SS_MODE_ITEM_META[outcome.mode]?.hotbarColor || "") : ""),
        count: ssCraftedInstances[outcome.id].length
      });
      ssPromoteHotbarItem(outcome.id);

      ssRefreshNotesMenu();
      ssCraftMessage = `Crafted ${outcome.name}`;
      ssCraftMessageTimer = 115;
      ssCraftSelection = [];
      if (ssIsMobileGame()) {
        ssCraftCursorKey = null;
        ssCraftCursorAdvanceFromNote = null;
        ssCraftCursorLastX = null;
      }

      ssAudioPlay("craft", ssPlayer.x, ssPlayer.z, { spatial:false, volume:0.92 });
      return true;
    }

    function ssCraftDeviceOnField(typeId) {
      const id = String(typeId || "");
      return ssPlacedDevices.some(device => device && Number(device.health || 0) > 0 && String(device.typeId || "") === id);
    }

    function ssCraftRelationshipGuide() {
      const fragmentRows = [
        ["2 notes • Major 2nd", "major2-2"],
        ["2 notes • Minor 2nd", "minor2-2"],
        ["3 notes • Major 3rd", "major3-3"],
        ["3 notes • Minor 3rd", "minor3-3"],
        ["3 notes • Minor 2nd", "minor2-3"],
        ["4 notes • Major 3rd", "major3-4"],
        ["4 notes • Minor 3rd", "minor3-4"],
        ["4 notes • Minor 2nd", "minor2-4"],
        ["5 notes • Major 3rd", "major3-5"],
        ["5 notes • Minor 3rd", "minor3-5"],
        ["5 notes • Minor 2nd", "minor2-5"],
        ["6 notes • Major 3rd", "major3-6"],
        ["6 notes • Minor 3rd", "minor3-6"],
        ["6 notes • Minor 2nd", "minor2-6"]
      ].map(([scaleType, id]) => ({ scaleType, id, deviceName: SS_FRAGMENT_ITEM_META[id]?.deviceName || id }));
      const modeRows = SS_MODE_NAMES.map(mode => ({
        scaleType: `${mode} Mode`,
        id: `mode-${String(mode).toLowerCase()}`,
        deviceName: SS_MODE_ITEM_META[mode]?.deviceName || `${mode} Device`
      }));
      return { fragmentRows, modeRows };
    }

    function ssDrawCraftRelationshipGuide(m) {
      const guide = ssCraftRelationshipGuide();
      const leftX = m.x + 24;
      const leftW = 354;
      const rightX = m.x + 394;
      const rightW = 202;
      const topY = m.y + 78;
      ctx.textBaseline = "middle";
      ctx.textAlign = "left";
      ctx.font = "bold 11px Arial, sans-serif";
      ctx.fillStyle = "#cbd5e1";
      ctx.fillText("PARTIAL SCALES", leftX, topY - 16);
      ctx.fillText("FULL MODES", rightX, topY - 16);
  
      const drawRow = (row, x, y, w, h, compact = false) => {
        const onField = ssCraftDeviceOnField(row.id);
        ctx.fillStyle = onField ? "rgba(134,239,172,.16)" : "rgba(255,255,255,.035)";
        ctx.fillRect(x, y, w, h - 2);
        ctx.strokeStyle = onField ? "rgba(134,239,172,.78)" : "rgba(255,255,255,.08)";
        ctx.lineWidth = onField ? 1.5 : 1;
        ctx.strokeRect(x, y, w, h - 2);
        ctx.textAlign = "left";
        if (compact) {
          ctx.fillStyle = onField ? "#bbf7d0" : "#cbd5e1";
          ctx.font = "bold 9px Arial, sans-serif";
          ctx.fillText(row.scaleType, x + 7, y + 9);
          ctx.fillStyle = onField ? "#ffffff" : "#94a3b8";
          ctx.font = "9px Arial, sans-serif";
          ctx.fillText(row.deviceName, x + 7, y + 20);
        } else {
          ctx.fillStyle = onField ? "#bbf7d0" : "#cbd5e1";
          ctx.font = "bold 10px Arial, sans-serif";
          ctx.fillText(row.scaleType, x + 7, y + (h - 2) * 0.5);
          ctx.textAlign = "right";
          ctx.fillStyle = onField ? "#ffffff" : "#94a3b8";
          ctx.font = "10px Arial, sans-serif";
          ctx.fillText(row.deviceName, x + w - 7, y + (h - 2) * 0.5);
        }
      };

      guide.fragmentRows.forEach((row, index) => drawRow(row, leftX, topY + index * 21, leftW, 20, false));
      guide.modeRows.forEach((row, index) => drawRow(row, rightX, topY + index * 43, rightW, 40, true));
    }

    function ssCraftPanelMetrics() {
      const panelW = 620;
      const panelH = 400;
      return {
        x: (GAME_CANVAS_LOGICAL_WIDTH - panelW) * 0.5,
        y: 15,
        width: panelW,
        height: panelH
      };
    }

    function ssCraftAddHitTarget(id, x, y, width, height, data = null) {
      ssCraftHitTargets.push({ id, x, y, width, height, data });
    }

    function ssCraftHitAt(x, y) {
      for (let i = ssCraftHitTargets.length - 1; i >= 0; i -= 1) {
        const hit = ssCraftHitTargets[i];
        if (x >= hit.x && x <= hit.x + hit.width && y >= hit.y && y <= hit.y + hit.height) return hit;
      }
      return null;
    }

    function ssCraftTargetKey(hit) {
      if (!hit) return null;
      return hit.id === "note" ? `note:${hit.data}` : String(hit.id || "");
    }

    function ssCraftTargetCenter(hit) {
      return {
        x: hit.x + hit.width * 0.5,
        y: hit.y + hit.height * 0.5
      };
    }

    function ssCraftNavigationTargets() {
      const allowed = new Set(["tab-build", "tab-guide", "note", "undo", "clear", "craft", "close"]);
      return ssCraftHitTargets.filter(hit => {
        if (!hit || !allowed.has(hit.id)) return false;
        if (hit.id === "note") return Number(ssNoteInventory[hit.data] || 0) > 0;
        return true;
      });
    }

    function ssCraftNoteBaseLetter(note) {
      const letter = String(note || "").charAt(0);
      return SS_SCALE_LETTERS.includes(letter) ? letter : "";
    }

    function ssCraftInitialNoteTarget(targets) {
      const notes = targets.filter(hit => hit.id === "note");
      if (!notes.length) return null;
      const accidentalRank = note => String(note || "").includes("♭") ? 1 : String(note || "").includes("♯") ? 2 : 0;
      notes.sort((a, b) => {
        const ai = SS_SCALE_LETTERS.indexOf(ssCraftNoteBaseLetter(a.data));
        const bi = SS_SCALE_LETTERS.indexOf(ssCraftNoteBaseLetter(b.data));
        if (ai !== bi) return ai - bi;
        return accidentalRank(a.data) - accidentalRank(b.data);
      });
      return notes[0];
    }

    function ssCraftAdvanceTargetAfterNote(targets, previousNote) {
      const noteTargets = targets.filter(hit => hit.id === "note");
      if (!noteTargets.length) return null;
      const previousLetter = ssCraftNoteBaseLetter(previousNote);
      const startIndex = Math.max(0, SS_SCALE_LETTERS.indexOf(previousLetter));

      // Musical spelling advances C-D-E-F-G-A-B, then wraps B -> C.
      for (let offset = 1; offset <= SS_SCALE_LETTERS.length; offset += 1) {
        const nextLetter = SS_SCALE_LETTERS[(startIndex + offset) % SS_SCALE_LETTERS.length];
        const rowTargets = noteTargets.filter(hit => ssCraftNoteBaseLetter(hit.data) === nextLetter);
        if (!rowTargets.length) continue;
        if (!Number.isFinite(ssCraftCursorLastX)) return rowTargets[0];
        rowTargets.sort((a, b) => {
          const ax = ssCraftTargetCenter(a).x;
          const bx = ssCraftTargetCenter(b).x;
          return Math.abs(ax - ssCraftCursorLastX) - Math.abs(bx - ssCraftCursorLastX);
        });
        return rowTargets[0];
      }
      return null;
    }

    function ssCraftEnsureCursor() {
      const targets = ssCraftNavigationTargets();
      if (!targets.length) {
        ssCraftCursorKey = null;
        return null;
      }

      if (ssCraftCursorAdvanceFromNote) {
        const previousNote = ssCraftCursorAdvanceFromNote;
        ssCraftCursorAdvanceFromNote = null;
        const nextNote = ssCraftAdvanceTargetAfterNote(targets, previousNote);
        if (nextNote) {
          ssCraftCursorKey = ssCraftTargetKey(nextNote);
          return nextNote;
        }
        const craftTarget = targets.find(hit => hit.id === "craft");
        if (craftTarget) {
          ssCraftCursorKey = ssCraftTargetKey(craftTarget);
          return craftTarget;
        }
      }

      const current = targets.find(hit => ssCraftTargetKey(hit) === ssCraftCursorKey);
      if (current) return current;

      const initialNote = ssCraftInitialNoteTarget(targets);
      const fallback = initialNote
        || targets.find(hit => hit.id === "craft")
        || targets.find(hit => hit.id === "undo")
        || targets.find(hit => hit.id === "clear")
        || targets.find(hit => hit.id === `tab-${ssCraftTab}`)
        || targets[0];
      ssCraftCursorKey = ssCraftTargetKey(fallback);
      return fallback;
    }

    function ssCraftNoteColumn(note) {
      const spelling = String(note || "");
      if (spelling.includes("♭")) return 0;
      if (spelling.includes("♯")) return 2;
      return 1;
    }

    function ssCraftAdjacentNoteColumnTarget(current, targets, direction) {
      if (!current || current.id !== "note") return null;
      if (direction !== "left" && direction !== "right") return null;

      const currentColumn = ssCraftNoteColumn(current.data);
      const targetColumn = currentColumn + (direction === "right" ? 1 : -1);
      if (targetColumn < 0 || targetColumn > 2) return null;

      const columnTargets = targets.filter(hit => {
        return hit.id === "note" && ssCraftNoteColumn(hit.data) === targetColumn;
      });
      if (!columnTargets.length) return null;

      const origin = ssCraftTargetCenter(current);
      columnTargets.sort((a, b) => {
        const ac = ssCraftTargetCenter(a);
        const bc = ssCraftTargetCenter(b);
        const aVertical = Math.abs(ac.y - origin.y);
        const bVertical = Math.abs(bc.y - origin.y);
        if (Math.abs(aVertical - bVertical) > 0.0001) return aVertical - bVertical;
        return Math.hypot(ac.x - origin.x, ac.y - origin.y) - Math.hypot(bc.x - origin.x, bc.y - origin.y);
      });
      return columnTargets[0] || null;
    }

    function ssCraftMoveCursor(direction) {
      if (!ssCraftOverlayOpen) return false;
      const targets = ssCraftNavigationTargets();
      if (!targets.length) return false;
      const current = ssCraftEnsureCursor();
      if (!current) return false;

      // Hard note-grid rule: while on a note, horizontal movement stays inside
      // the note grid whenever the immediately adjacent accidental column has
      // at least one available note. Tabs/buttons are not candidates in that case.
      const adjacentNote = ssCraftAdjacentNoteColumnTarget(current, targets, direction);
      if (adjacentNote) {
        ssCraftCursorKey = ssCraftTargetKey(adjacentNote);
        return true;
      }

      const origin = ssCraftTargetCenter(current);
      const vectors = {
        up: [0, -1],
        down: [0, 1],
        left: [-1, 0],
        right: [1, 0]
      };
      const vector = vectors[direction];
      if (!vector) return false;
      const [vx, vy] = vector;

      let best = null;
      let bestAngle = Infinity;
      let bestDistance = Infinity;
      for (const hit of targets) {
        if (hit === current) continue;
        const center = ssCraftTargetCenter(hit);
        const dx = center.x - origin.x;
        const dy = center.y - origin.y;
        const forward = dx * vx + dy * vy;
        if (forward <= 2) continue;
        const sideways = Math.abs(dx * vy - dy * vx);
        const distance = Math.hypot(dx, dy);
        const angleRatio = sideways / Math.max(1, forward);

        // Direction is primary: choose the target closest to the requested ray.
        // Distance only breaks ties between similarly aligned targets.
        if (
          angleRatio < bestAngle - 0.0001 ||
          (Math.abs(angleRatio - bestAngle) <= 0.0001 && distance < bestDistance)
        ) {
          bestAngle = angleRatio;
          bestDistance = distance;
          best = hit;
        }
      }

      if (!best) return false;
      ssCraftCursorKey = ssCraftTargetKey(best);
      return true;
    }

    function ssCraftActivateCursor() {
      if (!ssCraftOverlayOpen) return false;
      const hit = ssCraftEnsureCursor();
      if (!hit) return false;

      if (hit.id === "tab-build") ssCraftTab = "build";
      if (hit.id === "tab-guide") ssCraftTab = "guide";
      if (hit.id === "note") return ssCraftSelectNote(hit.data);
      if (hit.id === "undo") ssCraftUndo();
      if (hit.id === "clear") ssCraftClear();
      if (hit.id === "craft") return ssCommitCraft();
      if (hit.id === "close") {
        ssToggleCraftOverlay(false);
        return true;
      }
      return true;
    }

    function ssDrawCraftCursor() {
      if (!ssIsMobileGame() || !ssCraftOverlayOpen) return;
      const hit = ssCraftEnsureCursor();
      if (!hit) return;
      ctx.save();
      ctx.strokeStyle = "#ff82ad";
      ctx.lineWidth = 4;
      ctx.shadowColor = "rgba(255,130,173,.85)";
      ctx.shadowBlur = 8;
      ctx.strokeRect(hit.x - 3, hit.y - 3, hit.width + 6, hit.height + 6);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(255,255,255,.92)";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(hit.x - 1, hit.y - 1, hit.width + 2, hit.height + 2);
      ctx.restore();
    }

    function ssHandleCraftPointer(x, y) {
      if (!ssCraftOverlayOpen) return false;
      const m = ssCraftPanelMetrics();
      if (x < m.x || x > m.x + m.width || y < m.y || y > m.y + m.height) return false;
      const hit = ssCraftHitAt(x, y);
      if (!hit) return true;
      if (["tab-build", "tab-guide", "note", "undo", "clear", "craft", "close"].includes(hit.id)) {
        ssCraftCursorKey = ssCraftTargetKey(hit);
      }
            if (hit.id === "tab-build") ssCraftTab = "build";
            if (hit.id === "tab-guide") ssCraftTab = "guide";
            if (hit.id === "note") ssCraftSelectNote(hit.data);
      if (hit.id === "undo") ssCraftUndo();
      if (hit.id === "clear") ssCraftClear();
      if (hit.id === "craft") ssCommitCraft();
      if (hit.id === "close") ssToggleCraftOverlay(false);
      return true;
    }

    function ssDrawCraftOverlay() {
      if (!ssCraftOverlayOpen) return;
      const m = ssCraftPanelMetrics();
      ssCraftHitTargets = [];
      const candidates = ssCraftCandidateNotes();
      const outcome = ssCraftOutcomeForSelection();

      ctx.save();
      ctx.fillStyle = "rgba(4,9,18,.76)";
      ctx.fillRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);
      ctx.fillStyle = "rgba(16,24,39,.985)";
      ctx.fillRect(m.x, m.y, m.width, m.height);
      ctx.strokeStyle = outcome && ssCraftTab === "build" ? "#86efac" : "#ffffff";
      ctx.lineWidth = outcome && ssCraftTab === "build" ? 5 : 3;
      ctx.strokeRect(m.x, m.y, m.width, m.height);

      ctx.textBaseline = "middle";
      ctx.textAlign = "left";
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 22px Arial, sans-serif";
      ctx.fillText("CRAFT", m.x + 18, m.y + 25);

      // The full visible close box plus a small forgiveness margin is clickable.
      const closeSize = 36;
      const closeX = m.x + m.width - 46;
      const closeY = m.y + 6;
      ctx.fillStyle = "rgba(255,255,255,.12)";
      ctx.fillRect(closeX, closeY, closeSize, closeSize);
      ctx.strokeStyle = "rgba(255,255,255,.28)";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(closeX, closeY, closeSize, closeSize);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 23px Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("×", closeX + closeSize * 0.5, closeY + closeSize * 0.5);
      ssCraftAddHitTarget("close", closeX - 5, closeY - 5, closeSize + 10, closeSize + 10);

      const tabY = m.y + 9;
      const tabGap = 10;
      const buildTabW = 142;
      const guideTabW = 152;
      const tabGroupW = buildTabW + tabGap + guideTabW;
      const tabStartX = m.x + (m.width - tabGroupW) * 0.5;
      const tabs = [
        { id:"tab-build", key:"build", label:"BUILD SCALE", x:tabStartX, w:buildTabW },
        { id:"tab-guide", key:"guide", label:"DEVICE GUIDE", x:tabStartX + buildTabW + tabGap, w:guideTabW }
      ];
      for (const tab of tabs) {
        const active = ssCraftTab === tab.key;
        ctx.fillStyle = active ? "rgba(125,211,252,.20)" : "rgba(255,255,255,.045)";
        ctx.fillRect(tab.x, tabY, tab.w, 29);
        ctx.strokeStyle = active ? "#7dd3fc" : "rgba(255,255,255,.16)";
        ctx.lineWidth = active ? 2 : 1;
        ctx.strokeRect(tab.x, tabY, tab.w, 29);
        ctx.fillStyle = active ? "#e0f2fe" : "#94a3b8";
        ctx.font = "bold 10px Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(tab.label, tab.x + tab.w * 0.5, tabY + 14.5);
        ssCraftAddHitTarget(tab.id, tab.x - 4, tabY - 4, tab.w + 8, 37);
      }

      if (ssCraftTab === "guide") {
        ssDrawCraftRelationshipGuide(m);
        ssDrawCraftCursor();
        ctx.restore();
        return;
      }

      const typeDisplay = ssCraftTypeDisplay(outcome);
      const selectedSlotW = 70;
      const selectedGap = 7;
      const selectedTotal = 7 * selectedSlotW + 6 * selectedGap;
      const selectedX = m.x + (m.width - selectedTotal) * 0.5;
      const typeW = selectedTotal;
      const typeH = 30;
      const typeX = m.x + (m.width - typeW) * 0.5;
      const typeY = m.y + 57;
      ctx.save();
      if (typeDisplay.active) {
        ctx.shadowColor = typeDisplay.color;
        ctx.shadowBlur = 10;
        ctx.fillStyle = typeDisplay.color + "33";
        ctx.strokeStyle = typeDisplay.color;
        ctx.lineWidth = 2.5;
      } else {
        ctx.fillStyle = "rgba(100,116,139,.18)";
        ctx.strokeStyle = "#64748b";
        ctx.lineWidth = 2;
      }
      ctx.fillRect(typeX, typeY, typeW, typeH);
      ctx.strokeRect(typeX, typeY, typeW, typeH);
      ctx.shadowBlur = 0;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = typeDisplay.active ? typeDisplay.color : "#94a3b8";
      const readyDeviceName = outcome?.name ? String(outcome.name).toUpperCase() : "";
      const infoText = readyDeviceName
        ? `${typeDisplay.label}  •  ${readyDeviceName}`
        : typeDisplay.label;
      ctx.font = `bold ${infoText.length > 72 ? 9 : infoText.length > 58 ? 10 : 11}px Arial, sans-serif`;
      ctx.fillText(infoText, typeX + typeW * 0.5, typeY + typeH * 0.5);
      ctx.restore();

      const selectedY = m.y + 112;
      const selectedSlotH = 36;
      for (let i = 0; i < 7; i += 1) {
        const x = selectedX + i * (selectedSlotW + selectedGap);
        const note = ssCraftSelection[i];
        ctx.fillStyle = note ? "rgba(134,239,172,.18)" : "rgba(255,255,255,.055)";
        ctx.fillRect(x, selectedY - selectedSlotH * 0.5, selectedSlotW, selectedSlotH);
        ctx.strokeStyle = note ? "#86efac" : "rgba(255,255,255,.20)";
        ctx.lineWidth = 2;
        ctx.strokeRect(x, selectedY - selectedSlotH * 0.5, selectedSlotW, selectedSlotH);
        ctx.fillStyle = note ? ssResourceColor(note) : "#64748b";
        ctx.font = note ? "bold 18px Arial, sans-serif" : "12px Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(note || String(i + 1), x + selectedSlotW * 0.5, selectedY);
      }

      const gridTop = m.y + 151;
      const rowH = 26;
      const colW = 166;
      const colGap = 12;
      const gridW = colW * 3 + colGap * 2;
      const gridX = m.x + (m.width - gridW) * 0.5;
      const headers = ["FLAT", "NATURAL", "SHARP"];
      ctx.font = "bold 11px Arial, sans-serif";
      ctx.fillStyle = "#94a3b8";
      ctx.textAlign = "center";
      headers.forEach((header, col) => ctx.fillText(header, gridX + col * (colW + colGap) + colW * 0.5, gridTop - 9));

      const letters = SS_SCALE_LETTERS;
      for (let row = 0; row < letters.length; row += 1) {
        const letter = letters[row];
        const spellings = [`${letter}♭`, letter, `${letter}♯`];
        for (let col = 0; col < 3; col += 1) {
          const note = spellings[col];
          const x = gridX + col * (colW + colGap);
          const y = gridTop + row * rowH;
          const owned = Number(ssNoteInventory[note] || 0);
          const eligible = candidates.has(note);
          ctx.fillStyle = eligible ? "rgba(59,130,246,.25)" : "rgba(255,255,255,.035)";
          ctx.fillRect(x, y, colW, rowH - 4);
          if (eligible) {
            ctx.shadowColor = "rgba(125,211,252,.9)";
            ctx.shadowBlur = 9;
            ctx.strokeStyle = "#7dd3fc";
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, colW, rowH - 4);
            ctx.shadowBlur = 0;
            ssCraftAddHitTarget("note", x, y, colW, rowH - 4, note);
          } else {
            ctx.strokeStyle = "rgba(255,255,255,.08)";
            ctx.lineWidth = 1;
            ctx.strokeRect(x, y, colW, rowH - 4);
          }
          ctx.textAlign = "left";
          ctx.fillStyle = owned > 0 ? ssResourceColor(note) : "#596579";
          ctx.font = "bold 15px Arial, sans-serif";
          ctx.fillText(note, x + 10, y + (rowH - 4) * 0.5);
          ctx.textAlign = "right";
          ctx.fillStyle = owned > 0 ? "#ffffff" : "#596579";
          ctx.font = "bold 13px Arial, sans-serif";
          ctx.fillText(`×${owned}`, x + colW - 10, y + (rowH - 4) * 0.5);
        }
      }

      const buttonY = m.y + m.height - 39;
      const buttons = [
        { id: "undo", label: "UNDO", x: m.x + 70, w: 112, enabled: ssCraftSelection.length > 0 },
        { id: "clear", label: "CLEAR", x: m.x + 202, w: 112, enabled: ssCraftSelection.length > 0 },
        { id: "craft", label: outcome ? "CRAFT" : "NOT READY", x: m.x + 334, w: 216, enabled: !!outcome }
      ];
      for (const button of buttons) {
        ctx.fillStyle = button.enabled ? (button.id === "craft" ? "#86efac" : "#e2e8f0") : "#475569";
        ctx.fillRect(button.x, buttonY, button.w, 31);
        ctx.strokeStyle = button.enabled ? "#ffffff" : "#64748b";
        ctx.lineWidth = 2;
        ctx.strokeRect(button.x, buttonY, button.w, 31);
        ctx.fillStyle = button.enabled ? "#111827" : "#94a3b8";
        ctx.font = "bold 12px Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(button.label, button.x + button.w * 0.5, buttonY + 15.5);
        if (button.enabled) ssCraftAddHitTarget(button.id, button.x, buttonY, button.w, 31);
      }
      ssDrawCraftCursor();
      ctx.restore();
    }

    function ssDistanceToOrientedRect(x, z, centerX, centerZ, halfX, halfZ, yaw) {

      const dx = x - centerX;

      const dz = z - centerZ;

      const c = Math.cos(yaw);

      const sn = Math.sin(yaw);

      const localX = dx * c + dz * sn;

      const localZ = -dx * sn + dz * c;

      const ox = Math.max(Math.abs(localX) - halfX, 0);

      const oz = Math.max(Math.abs(localZ) - halfZ, 0);

      return Math.hypot(ox, oz);

    }
