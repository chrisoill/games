        addRubblePiece(3.50, 4.42, 0.78, 0.22, 0.56, "#8e8178", 0.10);
        addRubblePiece(-3.18, -4.92, 1.10, 0.28, 0.84, "#6f6660", 0.22);
        addWoodBeam(2.16, 5.22, 1.18, 1.05);
        addWoodBeam(3.38, 4.18, 0.96, -0.48);
        addGlassShard(2.36, 5.35, 0.40, 0.24);
        addGlassShard(2.66, 4.82, 0.34, -0.20);
        addGlassShard(-3.34, -4.28, 0.36, 0.12);
        ssAddCastleSmokePuff(-2.1, 6.65 + damage * 0.5, 1.7, 0.34 + damage * 0.14, basis, "#616874");
        ssAddCastleSmokePuff(1.7, 5.5 + damage * 0.35, -1.4, 0.28 + damage * 0.1, basis, "#706978");
      }

      if (damage >= 0.60) {
        addFlame(0, 6.18, 0.28, 0.90);
        addFlame(-0.45, 6.00, -0.10, 0.60);
        addFlame(0.40, 6.02, -0.08, 0.56);
        ssAddCastleSmokePuff(0.15, 7.35, 0.25, 0.52, basis, "#706672");
        ssAddCastleSmokePuff(-0.38, 7.05, -0.22, 0.34, basis, "#67606b");
      }

      if (damage >= 0.80) {
        addRubblePiece(-1.75, 3.58, 1.46, 0.30, 0.46, "#5f5656", 0.06);
        addRubblePiece( 1.95, 3.62, 1.62, 0.30, 0.48, "#645a59", -0.04);
        addRubblePiece(-3.72, 1.28, 0.48, 0.30, 1.54, "#655c5b", 0.12);
        addRubblePiece( 3.72,-1.35, 0.48, 0.30, 1.56, "#615757", -0.12);
        for (const [fx, fz, size] of [
          [-4.25, 0.00, 0.62], [4.20, 0.00, 0.62],
          [0.00, 4.22, 0.66], [0.00,-4.18, 0.66],
          [-3.10, 3.10, 0.56], [3.10, 3.10, 0.56],
          [-3.10,-3.10, 0.56], [3.10,-3.10, 0.56]
        ]) addFlame(fx, SS_BASE_PLATFORM_HEIGHT + 0.05, fz, size);
        ssAddCastleSmokePuff(0, 7.85, 0.2, 0.54, basis, "#7d6258");
      }

      if (destroyed) {
        addRubblePiece(-0.10, 3.78, 2.76, 0.34, 0.58, "#5d5356", 0.04);
        addRubblePiece(0.22, -3.82, 2.64, 0.34, 0.58, "#5f5659", -0.05);
        addRubblePiece(-3.05, -0.16, 0.62, 0.32, 2.44, "#5b5256", 0.14);
        addRubblePiece(3.10, 0.18, 0.62, 0.32, 2.52, "#594f53", -0.14);
        addWoodBeam(-0.98, -0.48, 1.62, 1.05);
        addWoodBeam(1.18, 0.62, 1.36, -0.94);
        ssAddCastleSmokePuff(0.12, 6.58, 0.08, 0.76, basis, "#6d5d61");
        ssAddCastleSmokePuff(-0.72, 6.06, -0.28, 0.54, basis, "#666068");
        ssAddCastleSmokePuff(0.84, 5.92, 0.34, 0.50, basis, "#625960");
      }
    });
  }

  function ssAddPlayer(basis) {
    const ground = ssPlayerSupportHeight(ssPlayer.x, ssPlayer.z);
    const bob = ssPlayer.moving ? Math.abs(Math.sin(ssPlayer.bob)) * 0.05 : 0;
    const baseY = ground + bob;
    const yaw = ssPlayer.facing;
    const legSwing = ssPlayer.moving ? Math.sin(ssPlayer.bob) * 0.12 : 0;
    const forwardX = Math.sin(yaw), forwardZ = -Math.cos(yaw), right = ssRotateXZ(1, 0, yaw);

    const tunic = "#2f5d7a";
    const tunicDark = "#23465c";
    const pants = "#314257";
    const boot = "#1d2430";
    const skin = "#efc5a0";
    const hair = "#3a2d23";
    const eyeWhite = "#f7fbff";
    const pupil = "#2c211b";
    const mouth = "#9f6d62";

    function addRod(ax, ay, az, bx, by, bz, segments, sx, sy, sz, color) {
      const count = Math.max(1, Math.floor(Number(segments || 1)));
      for (let i = 0; i < count; i += 1) {
        const t = (i + 0.5) / count;
        const x = ax + (bx - ax) * t;
        const y = ay + (by - ay) * t;
        const z = az + (bz - az) * t;
        ssAddBox(x, y - sy * 0.5, z, sx, sy, sz, color, basis, yaw);
      }
    }

    const leftLegOffset = ssRotateXZ(-0.18, legSwing, yaw);
    const rightLegOffset = ssRotateXZ(0.18, -legSwing, yaw);
    for (const off of [leftLegOffset, rightLegOffset]) {
      ssAddBox(ssPlayer.x + off.x, baseY, ssPlayer.z + off.z, 0.24, 0.70, 0.26, pants, basis, yaw);
      ssAddBox(
        ssPlayer.x + off.x + forwardX * 0.08,
        baseY - 0.11,
        ssPlayer.z + off.z + forwardZ * 0.08,
        0.29, 0.20, 0.36,
        boot, basis, yaw
      );
    }

    ssAddBox(ssPlayer.x, baseY + 0.66, ssPlayer.z, 0.72, 0.92, 0.42, tunic, basis, yaw);

    const shoulderY = baseY + 1.18;
    const leftShoulderX = ssPlayer.x - right.x * 0.36;
    const leftShoulderZ = ssPlayer.z - right.z * 0.36;
    const rightShoulderX = ssPlayer.x + right.x * 0.36;
    const rightShoulderZ = ssPlayer.z + right.z * 0.36;

    addRod(leftShoulderX, shoulderY, leftShoulderZ, leftShoulderX, baseY + 0.56, leftShoulderZ, 4, 0.18, 0.18, 0.18, tunicDark);
    ssAddBox(leftShoulderX, baseY + 0.39, leftShoulderZ, 0.22, 0.18, 0.22, skin, basis, yaw);

    const selectedToolId = ssSelectedHotbarItem()?.id || null;
    const swordSelected = selectedToolId === "sword";
    const pickaxeSelected = selectedToolId === "pickaxe";
    const heldToolSelected = swordSelected || pickaxeSelected;
    const swingTimer = swordSelected
      ? Number(ssPlayer.swordSwingTimer || 0)
      : pickaxeSelected
        ? Number(ssPlayer.pickaxeSwingTimer || 0)
        : 0;
    const swingActive = heldToolSelected && swingTimer > 0;
    const swingProgress = swingActive
      ? 1 - ssClamp(swingTimer / SS_PLAYER_SWORD_SWING_DURATION, 0, 1)
      : 0;

    // Both hand tools share the same shoulder-anchored forward hold and downward swing.
    const armTheta = heldToolSelected ? (-0.98 * Math.sin(swingProgress * Math.PI)) : -Math.PI * 0.5;
    const armLength = heldToolSelected ? 0.72 : 0.62;
    const handX = rightShoulderX + forwardX * (Math.cos(armTheta) * armLength);
    const handY = shoulderY + Math.sin(armTheta) * armLength;
    const handZ = rightShoulderZ + forwardZ * (Math.cos(armTheta) * armLength);

    addRod(
      rightShoulderX, shoulderY, rightShoulderZ,
      handX, handY, handZ,
      heldToolSelected ? 5 : 4,
      0.18, 0.18, 0.18,
      tunicDark
    );
    ssAddBox(handX, handY - 0.11, handZ, 0.22, 0.22, 0.22, skin, basis, yaw);

    if (swordSelected) {
      const swordTheta = armTheta + Math.PI * 0.25;
      const hiltX = handX;
      const hiltY = handY - 0.02;
      const hiltZ = handZ;
      const bladeTipX = hiltX + forwardX * (Math.cos(swordTheta) * 1.08);
      const bladeTipY = hiltY + Math.sin(swordTheta) * 1.08;
      const bladeTipZ = hiltZ + forwardZ * (Math.cos(swordTheta) * 1.08);

      addRod(hiltX, hiltY, hiltZ, bladeTipX, bladeTipY, bladeTipZ, 6, 0.11, 0.16, 0.12, "#e9f1f8");
      ssAddBox(hiltX, hiltY - 0.14, hiltZ, 0.12, 0.30, 0.12, "#6f4a2b", basis, yaw);
      ssAddBox(hiltX, hiltY - 0.02, hiltZ, 0.36, 0.08, 0.10, "#c8d1d9", basis, yaw);
    }

    if (pickaxeSelected) {
      const pickTheta = armTheta + Math.PI * 0.25;
      const gripX = handX;
      const gripY = handY - 0.02;
      const gripZ = handZ;

      const shaftTopX = gripX + forwardX * (Math.cos(pickTheta) * 0.92);
      const shaftTopY = gripY + Math.sin(pickTheta) * 0.92;
      const shaftTopZ = gripZ + forwardZ * (Math.cos(pickTheta) * 0.92);

      const shaftButtX = gripX - forwardX * (Math.cos(pickTheta) * 0.30);
      const shaftButtY = gripY - Math.sin(pickTheta) * 0.30;
      const shaftButtZ = gripZ - forwardZ * (Math.cos(pickTheta) * 0.30);

      addRod(shaftButtX, shaftButtY, shaftButtZ, shaftTopX, shaftTopY, shaftTopZ, 9, 0.12, 0.15, 0.12, "#765035");
      ssAddBox(shaftButtX, shaftButtY - 0.07, shaftButtZ, 0.15, 0.17, 0.15, "#5d3d29", basis, yaw);

      ssAddBox(shaftTopX, shaftTopY - 0.09, shaftTopZ, 0.21, 0.18, 0.21, "#6f7880", basis, yaw);
      ssAddBox(shaftTopX, shaftTopY - 0.055, shaftTopZ, 0.32, 0.11, 0.15, "#aeb7bd", basis, yaw);

      // Pick head lies in the same forward/vertical plane as the handle.
      // At the default pose the handle is +45 degrees; the pick head is -45 degrees,
      // making the two axes perpendicular.
      const headTheta = pickTheta - Math.PI * 0.5;
      const headDirX = forwardX * Math.cos(headTheta);
      const headDirY = Math.sin(headTheta);
      const headDirZ = forwardZ * Math.cos(headTheta);

      const point1X = shaftTopX + headDirX * 0.18;
      const point1Y = shaftTopY + headDirY * 0.18;
      const point1Z = shaftTopZ + headDirZ * 0.18;
      const point2X = shaftTopX + headDirX * 0.32;
      const point2Y = shaftTopY + headDirY * 0.32;
      const point2Z = shaftTopZ + headDirZ * 0.32;
      const point3X = shaftTopX + headDirX * 0.43;
      const point3Y = shaftTopY + headDirY * 0.43;
      const point3Z = shaftTopZ + headDirZ * 0.43;
      const point4X = shaftTopX + headDirX * 0.52;
      const point4Y = shaftTopY + headDirY * 0.52;
      const point4Z = shaftTopZ + headDirZ * 0.52;

      addRod(shaftTopX, shaftTopY, shaftTopZ, point1X, point1Y, point1Z, 2, 0.14, 0.12, 0.14, "#9ba5ad");
      addRod(point1X, point1Y, point1Z, point2X, point2Y, point2Z, 2, 0.12, 0.10, 0.12, "#aab3ba");
      addRod(point2X, point2Y, point2Z, point3X, point3Y, point3Z, 2, 0.09, 0.08, 0.09, "#bcc4c9");
      addRod(point3X, point3Y, point3Z, point4X, point4Y, point4Z, 2, 0.06, 0.05, 0.06, "#d2d8dc");

      const blade1X = shaftTopX - headDirX * 0.18;
      const blade1Y = shaftTopY - headDirY * 0.18;
      const blade1Z = shaftTopZ - headDirZ * 0.18;
      const blade2X = shaftTopX - headDirX * 0.33;
      const blade2Y = shaftTopY - headDirY * 0.33;
      const blade2Z = shaftTopZ - headDirZ * 0.33;
      const blade3X = shaftTopX - headDirX * 0.45;
      const blade3Y = shaftTopY - headDirY * 0.45;
      const blade3Z = shaftTopZ - headDirZ * 0.45;

      addRod(shaftTopX, shaftTopY, shaftTopZ, blade1X, blade1Y, blade1Z, 2, 0.15, 0.14, 0.15, "#939da5");
      addRod(blade1X, blade1Y, blade1Z, blade2X, blade2Y, blade2Z, 2, 0.17, 0.15, 0.17, "#858f98");
      addRod(blade2X, blade2Y, blade2Z, blade3X, blade3Y, blade3Z, 2, 0.22, 0.18, 0.22, "#76818a");
    }

    const headBase = baseY + 1.58;
    const headHeight = 0.44;
    ssAddBox(ssPlayer.x, headBase, ssPlayer.z, 0.63, headHeight, 0.59, skin, basis, yaw);

    // Keep the hair close to the head footprint rather than puffing outward.
    // The top cap matches the head's width/depth so it reads as short hair, not an afro.
    ssAddBox(ssPlayer.x, headBase + 0.44, ssPlayer.z, 0.63, 0.16, 0.59, hair, basis, yaw);
    ssAddBox(ssPlayer.x - forwardX * 0.12, headBase + 0.28, ssPlayer.z - forwardZ * 0.12, 0.59, 0.12, 0.16, hair, basis, yaw);
    for (const side of [-1, 1]) {
      ssAddBox(
        ssPlayer.x + right.x * side * 0.25,
        headBase + 0.22,
        ssPlayer.z + right.z * side * 0.25,
        0.08, 0.20, 0.16,
        hair, basis, yaw
      );
    }

    const faceX = ssPlayer.x + forwardX * 0.31;
    const faceZ = ssPlayer.z + forwardZ * 0.31;
    const eyeY = headBase + 0.24;
    for (const side of [-1, 1]) {
      const eyeX = faceX + right.x * side * 0.12;
      const eyeZ = faceZ + right.z * side * 0.12;
      ssAddBox(eyeX, eyeY, eyeZ, 0.10, 0.08, 0.04, eyeWhite, basis, yaw);
      ssAddBox(eyeX + forwardX * 0.01, eyeY + 0.005, eyeZ + forwardZ * 0.01, 0.04, 0.05, 0.045, pupil, basis, yaw);
    }
    ssAddBox(ssPlayer.x + forwardX * 0.31, headBase + 0.15, ssPlayer.z + forwardZ * 0.31, 0.05, 0.10, 0.03, "#d8a98d", basis, yaw);
    ssAddBox(ssPlayer.x + forwardX * 0.30, headBase + 0.08, ssPlayer.z + forwardZ * 0.30, 0.16, 0.04, 0.03, mouth, basis, yaw);
  }



  function ssLerp(a, b, t) {
    return a + (b - a) * t;
  }

  function ssSmoothStep01(t) {
    const n = ssClamp(Number(t || 0), 0, 1);
    return n * n * (3 - 2 * n);
  }

  function ssMixHex(a, b, t) {
    const c1 = ssHexToRgb(a);
    const c2 = ssHexToRgb(b);
    const n = ssClamp(Number(t || 0), 0, 1);
    const r = Math.round(ssLerp(c1.r, c2.r, n));
    const g = Math.round(ssLerp(c1.g, c2.g, n));
    const b2 = Math.round(ssLerp(c1.b, c2.b, n));
    return `rgb(${r},${g},${b2})`;
  }

  function ssCurrentSkyState() {
    const day = SS_DAY_DURATION_SECONDS;
    const dusk = SS_DUSK_DURATION_SECONDS;
    const night = SS_NIGHT_DURATION_SECONDS;
    const dawn = SS_DAWN_DURATION_SECONDS;
    const total = day + dusk + night + dawn;
    const elapsed = ((ssDayNightCycleElapsed() % total) + total) % total;

    const morning = { top: "#76b7e1", mid: "#cde7f4", bottom: "#edf4db" };
    const afternoon = { top: "#88c8f1", mid: "#dceef7", bottom: "#eef5dd" };
    const sunset = { top: "#8a6480", mid: "#df8f68", bottom: "#efc285" };
    const nightA = { top: "#0d1735", mid: "#24385d", bottom: "#4b6172" };
    const nightB = { top: "#121b3c", mid: "#2d4167", bottom: "#53677c" };
    const sunrise = { top: "#5f71a7", mid: "#cf9e82", bottom: "#e8d3aa" };

    let from = morning;
    let to = afternoon;
    let t = 0;
    let dayness = 1;
    let nightness = 0;
    let duskness = 0;
    let dawnness = 0;

    if (elapsed < day) {
      t = ssSmoothStep01(elapsed / Math.max(0.001, day));
      from = morning;
      to = sunset;
      dayness = 1;
    } else if (elapsed < day + dusk) {
      t = ssSmoothStep01((elapsed - day) / Math.max(0.001, dusk));
      from = sunset;
      to = nightA;
      dayness = 1 - t;
      duskness = 1;
      nightness = t;
    } else if (elapsed < day + dusk + night) {
      t = ssSmoothStep01((elapsed - day - dusk) / Math.max(0.001, night));
      from = nightA;
      to = nightB;
      nightness = 1;
    } else {
      t = ssSmoothStep01((elapsed - day - dusk - night) / Math.max(0.001, dawn));
      from = sunrise;
      to = morning;
      dawnness = 1;
      dayness = t;
      nightness = 1 - t;
    }

    return {
      elapsed,
      total,
      progress: elapsed / total,
      top: ssMixHex(from.top, to.top, t),
      mid: ssMixHex(from.mid, to.mid, t),
      bottom: ssMixHex(from.bottom, to.bottom, t),
      dayness,
      nightness,
      duskness,
      dawnness
    };
  }

  function ssDrawSky() {
    const sky = ssCurrentSkyState();
    const gradient = ctx.createLinearGradient(0, 0, 0, GAME_CANVAS_LOGICAL_HEIGHT);
    gradient.addColorStop(0, sky.top);
    gradient.addColorStop(0.58, sky.mid);
    gradient.addColorStop(1, sky.bottom);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);

    const orbitCenterX = GAME_CANVAS_LOGICAL_WIDTH * 0.5;
    const orbitCenterY = GAME_CANVAS_LOGICAL_HEIGHT + 86;
    const orbitRadius = GAME_CANVAS_LOGICAL_HEIGHT * 0.78;
    const orbitAngle = -Math.PI * 0.74 + sky.progress * Math.PI * 2;

    const sunX = orbitCenterX + Math.cos(orbitAngle) * orbitRadius;
    const sunY = orbitCenterY + Math.sin(orbitAngle) * orbitRadius;
    const moonX = orbitCenterX + Math.cos(orbitAngle + Math.PI) * orbitRadius;
    const moonY = orbitCenterY + Math.sin(orbitAngle + Math.PI) * orbitRadius;

    const sunAlpha = ssClamp(0.18 + sky.dayness * 0.6 + sky.duskness * 0.22, 0, 0.9);
    const moonAlpha = ssClamp(0.15 + sky.nightness * 0.74 + sky.dawnness * 0.24, 0, 0.92);

    ctx.save();
    ctx.globalAlpha = sunAlpha;
    ctx.fillStyle = "rgba(255,248,214,0.85)";
    ctx.beginPath(); ctx.arc(sunX, sunY, 33 + sky.duskness * 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.22)";
    ctx.beginPath(); ctx.arc(sunX, sunY, 50 + sky.dayness * 8, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = moonAlpha;
    ctx.fillStyle = "rgba(241,246,255,0.92)";
    ctx.beginPath(); ctx.arc(moonX, moonY, 23, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(16,25,55,0.95)";
    ctx.beginPath(); ctx.arc(moonX + 9, moonY - 6, 21, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    if (sky.nightness > 0.08) {
      ctx.save();
      const baseAlpha = 0.12 + sky.nightness * 0.7;
      const starBandHeight = Math.floor(GAME_CANVAS_LOGICAL_HEIGHT * 0.34);
      for (let i = 0; i < 42; i += 1) {
        const x = 14 + ((i * 137 + i * i * 19 + 31) % Math.max(1, GAME_CANVAS_LOGICAL_WIDTH - 28));
        const y = 18 + ((i * 67 + i * i * 11 + 23) % Math.max(1, starBandHeight - 18));
        const twinkle = 0.78 + 0.22 * Math.sin(ssCombatClock * (0.8 + (i % 5) * 0.11) + i * 1.73);
        const starR = 0.8 + (i % 4) * 0.38;
        ctx.globalAlpha = baseAlpha * twinkle;
        ctx.fillStyle = i % 5 === 0 ? "rgba(183,214,255,0.95)" : "rgba(255,255,255,0.95)";
        ctx.beginPath();
        ctx.arc(x, y, starR, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    const cloudAlpha = ssClamp(0.12 + sky.dayness * 0.22 + sky.dawnness * 0.08, 0.08, 0.34);
    ctx.save();
    ctx.fillStyle = `rgba(255,255,255,${cloudAlpha})`;
    for (let i = 0; i < 4; i += 1) {
      const phase = sky.progress * Math.PI * 2 * 0.7 + i * 1.49;
      const x = orbitCenterX + Math.cos(phase) * (250 + i * 26);
      const y = 92 + Math.sin(phase * 0.9 + i) * 26 + i * 18;
      ctx.beginPath();
      ctx.ellipse(x, y, 46 + i * 9, 12 + (i % 2) * 3, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 38, y - 8, 34, 10, 0, 0, Math.PI * 2);
      ctx.ellipse(x - 28, y + 4, 32, 9, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    const flockAlpha = sky.dayness > 0.28 ? 0.36 : sky.nightness > 0.25 ? 0.28 : 0.16;
    ctx.save();
    ctx.globalAlpha = flockAlpha;
    const isNightFlock = sky.nightness > sky.dayness;
    ctx.strokeStyle = isNightFlock ? "rgba(58,43,72,0.9)" : "rgba(79,86,96,0.9)";
    ctx.lineWidth = isNightFlock ? 1.7 : 1.4;
    const flockBaseX = orbitCenterX + Math.cos(sky.progress * Math.PI * 2 * 0.83 + (isNightFlock ? 1.7 : 0.6)) * 230;
    const flockBaseY = 128 + Math.sin(sky.progress * Math.PI * 2 * 0.91) * 26;
    for (let i = 0; i < 5; i += 1) {
      const x = flockBaseX + i * 19;
      const y = flockBaseY + (i % 2 ? -6 : 6);
      const wing = 5 + (i % 3);
      ctx.beginPath();
      ctx.moveTo(x - wing, y + 2);
      ctx.quadraticCurveTo(x, y - wing, x + wing, y + 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function ssDrawDayNightWorldTint() {
    const sky = ssCurrentSkyState();
    ctx.save();

    if (sky.nightness > 0.04) {
      ctx.globalCompositeOperation = "color";
      ctx.fillStyle = `rgba(76,96,154,${ssClamp(0.12 + sky.nightness * 0.30, 0, 0.42).toFixed(3)})`;
      ctx.fillRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);
    } else if (sky.duskness > 0.05) {
      ctx.fillStyle = `rgba(91,40,45,${(0.03 + sky.duskness * 0.07).toFixed(3)})`;
      ctx.fillRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);
    } else if (sky.dawnness > 0.05) {
      ctx.fillStyle = `rgba(94,64,86,${(0.02 + sky.dawnness * 0.05).toFixed(3)})`;
      ctx.fillRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);
    }

    ctx.restore();
  }

  function ssDrawAmbientLifeOverlay() {
    const sky = ssCurrentSkyState();
    const t = ssCombatClock * 0.32 + sky.progress * 12;
    ctx.save();
    for (let i = 0; i < 14; i += 1) {
      const px = ((i * 57 + t * (12 + i)) % (GAME_CANVAS_LOGICAL_WIDTH + 80)) - 40;
      const py = GAME_CANVAS_LOGICAL_HEIGHT * 0.58 + (i % 6) * 18 + Math.sin(t * 1.1 + i * 0.9) * 8;
      const alpha = 0.04 + (i % 4) * 0.015 + sky.dayness * 0.025;
      if (sky.dayness + sky.duskness > 0.2) {
        ctx.fillStyle = `rgba(179,142,88,${alpha.toFixed(3)})`;
        ctx.beginPath();
        ctx.ellipse(px, py, 4.6, 1.8, Math.sin(t + i) * 0.8, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = `rgba(230,222,197,${(alpha * 0.7).toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(px + 12, py + 9 + Math.sin(t * 0.8 + i) * 4, 1.6 + (i % 3) * 0.3, 0, Math.PI * 2);

    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // DEPTH-BUFFERED WORLD RENDERER
    //
    // Earlier Phase 1 builds used painter-style sorting. That can never be fully
    // correct when two 3D solids overlap/intersect (for example a castle wall that
    // extends into a tower column): one polygon can be partly in front and partly
    // behind another polygon at the same time. The renderer below sends every face
    // through an offscreen WebGL depth buffer, so visibility is resolved per pixel.
    // The visible arcade canvas stays 2D so the existing shell/HUD code remains intact.
    // ---------------------------------------------------------------------------

    let ssDepthCanvas = null;
    let ssDepthGl = null;
    let ssDepthProgram = null;
    let ssDepthPositionBuffer = null;
    let ssDepthColorBuffer = null;
    let ssDepthPositionLocation = -1;
    let ssDepthColorLocation = -1;
    let ssDepthRendererFailed = false;

  let ssDepthPositionData = new Float32Array(65536);
  let ssDepthColorData = new Float32Array(65536);
  let ssDepthGpuFloatCapacity = 0;

  function ssEnsureDepthCpuCapacity(floatCount) {
    if (floatCount <= ssDepthPositionData.length) return;
    let next = ssDepthPositionData.length;
    while (next < floatCount) next *= 2;
    ssDepthPositionData = new Float32Array(next);
    ssDepthColorData = new Float32Array(next);
    ssDepthGpuFloatCapacity = 0;
  }

  function ssEnsureDepthGpuCapacity(floatCount) {
    if (ssDepthGpuFloatCapacity >= floatCount) return;
    let next = Math.max(65536, ssDepthGpuFloatCapacity || 65536);
    while (next < floatCount) next *= 2;
    const gl = ssDepthGl;
    gl.bindBuffer(gl.ARRAY_BUFFER, ssDepthPositionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, next * 4, gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, ssDepthColorBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, next * 4, gl.DYNAMIC_DRAW);
    ssDepthGpuFloatCapacity = next;
  }


    function ssCompileDepthShader(gl, type, source) {
      const shader = gl.createShader(type);
      if (!shader) return null;
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        try { console.warn('Scale Survival depth shader:', gl.getShaderInfoLog(shader)); } catch (err) {}
        gl.deleteShader(shader);
        return null;
      }
      return shader;
    }

    function ssEnsureDepthRenderer() {
      if (ssDepthRendererFailed) return false;
      if (ssDepthGl && ssDepthProgram && ssDepthCanvas) return true;

      try {
        ssDepthCanvas = document.createElement('canvas');
        ssDepthCanvas.width = GAME_CANVAS_LOGICAL_WIDTH;
        ssDepthCanvas.height = GAME_CANVAS_LOGICAL_HEIGHT;

        const gl = ssDepthCanvas.getContext('webgl', {
          alpha: true,
          antialias: true,
          depth: true,
          premultipliedAlpha: false,
          preserveDrawingBuffer: true
        });
        if (!gl) throw new Error('WebGL unavailable');

        const vertexShader = ssCompileDepthShader(gl, gl.VERTEX_SHADER, `
          attribute vec4 a_position;
          attribute vec4 a_color;
          varying vec4 v_color;
          void main() {
            gl_Position = a_position;
            v_color = a_color;
          }
        `);

        const fragmentShader = ssCompileDepthShader(gl, gl.FRAGMENT_SHADER, `
          precision mediump float;
          varying vec4 v_color;
          void main() {
            gl_FragColor = v_color;
          }
        `);

        if (!vertexShader || !fragmentShader) throw new Error('Depth shader compilation failed');

        const program = gl.createProgram();
        if (!program) throw new Error('Could not create depth program');
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        gl.deleteShader(vertexShader);
        gl.deleteShader(fragmentShader);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          const info = gl.getProgramInfoLog(program);
          gl.deleteProgram(program);
          throw new Error(info || 'Depth program link failed');
        }

        ssDepthGl = gl;
        ssDepthProgram = program;
        ssDepthPositionBuffer = gl.createBuffer();
        ssDepthColorBuffer = gl.createBuffer();
        ssDepthPositionLocation = gl.getAttribLocation(program, 'a_position');
        ssDepthColorLocation = gl.getAttribLocation(program, 'a_color');

        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.disable(gl.CULL_FACE);
        return true;
      } catch (err) {
        ssDepthRendererFailed = true;
        try { console.warn('Scale Survival: falling back to painter renderer.', err); } catch (ignore) {}
        return false;
      }
    }

    function ssColorToRgbUnit(color) {
    const text = String(color || "#ffffff").trim();
    let cached = ssColorUnitCache.get(`unit:${text}`);
    if (cached) return cached;
    let r = 255, g = 255, b = 255;
    if (text[0] === "#") {
      const clean = text.slice(1);
      if (clean.length === 3) {
        r = parseInt(clean[0] + clean[0], 16);
        g = parseInt(clean[1] + clean[1], 16);
        b = parseInt(clean[2] + clean[2], 16);
      } else if (clean.length >= 6) {
        r = parseInt(clean.slice(0, 2), 16);
        g = parseInt(clean.slice(2, 4), 16);
        b = parseInt(clean.slice(4, 6), 16);
      }
    } else {
      const match = text.match(/rgba?\s*\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/i);
      if (match) { r = Number(match[1]); g = Number(match[2]); b = Number(match[3]); }
    }
    cached = [ssClamp(r / 255, 0, 1), ssClamp(g / 255, 0, 1), ssClamp(b / 255, 0, 1)];
    if (ssColorUnitCache.size < 4096) ssColorUnitCache.set(`unit:${text}`, cached);
    return cached;
  }

  function ssColorToRgba(color, alpha = 1) {
    const text = String(color || "#ffffff").trim();
    let cached = ssColorUnitCache.get(`unit:${text}`);
    if (!cached) {
      let r = 255, g = 255, b = 255;
      if (text[0] === "#") {
        const clean = text.slice(1);
        if (clean.length === 3) {
          r = parseInt(clean[0] + clean[0], 16);
          g = parseInt(clean[1] + clean[1], 16);
          b = parseInt(clean[2] + clean[2], 16);
        } else if (clean.length >= 6) {
          r = parseInt(clean.slice(0, 2), 16);
          g = parseInt(clean.slice(2, 4), 16);
          b = parseInt(clean.slice(4, 6), 16);
        }
      } else {
        const match = text.match(/rgba?\s*\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/i);
        if (match) {
          r = Number(match[1]); g = Number(match[2]); b = Number(match[3]);
        }
      }
      cached = [ssClamp(r / 255, 0, 1), ssClamp(g / 255, 0, 1), ssClamp(b / 255, 0, 1)];
      if (ssColorUnitCache.size < 4096) ssColorUnitCache.set(`unit:${text}`, cached);
    }

  }

    function ssDepthClipVertex(projectedPoint) {
      const depth = ssClamp(projectedPoint.depth, SS_NEAR_PLANE, SS_FAR_PLANE);
      const ndcX = projectedPoint.x / GAME_CANVAS_LOGICAL_WIDTH * 2 - 1;
      const ndcY = 1 - projectedPoint.y / GAME_CANVAS_LOGICAL_HEIGHT * 2;
      // Standard perspective depth mapping for a camera whose forward distance is
      // positive. Keeping W equal to camera depth gives correct perspective-aware
      // interpolation when two faces cross each other on screen.
      const depthA = (SS_FAR_PLANE + SS_NEAR_PLANE) / (SS_FAR_PLANE - SS_NEAR_PLANE);
      const depthB = (-2 * SS_FAR_PLANE * SS_NEAR_PLANE) / (SS_FAR_PLANE - SS_NEAR_PLANE);
      const clipZ = depthA * depth + depthB;

      return [ndcX * depth, ndcY * depth, clipZ, depth];
    }

    function ssRenderPolygonsWithDepthBuffer(polygons) {
    if (!ssEnsureDepthRenderer()) return false;

    const gl = ssDepthGl;
    let vertexCount = 0;
    for (const poly of polygons) {
      const pts = poly.projected;
      const count = pts ? pts.length / 3 : 0;
      if (count >= 3) vertexCount += (count - 2) * 3;
    }

    gl.viewport(0, 0, ssDepthCanvas.width, ssDepthCanvas.height);
    gl.clearColor(0, 0, 0, 0);
    gl.clearDepth(1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    if (!vertexCount) return true;

    const floatCount = vertexCount * 4;
    ssEnsureDepthCpuCapacity(floatCount);
    const positions = ssDepthPositionData;
    const colors = ssDepthColorData;
    let cursor = 0;
    const depthA = (SS_FAR_PLANE + SS_NEAR_PLANE) / (SS_FAR_PLANE - SS_NEAR_PLANE);
    const depthB = (-2 * SS_FAR_PLANE * SS_NEAR_PLANE) / (SS_FAR_PLANE - SS_NEAR_PLANE);
    const w = GAME_CANVAS_LOGICAL_WIDTH;
    const h = GAME_CANVAS_LOGICAL_HEIGHT;

    for (const poly of polygons) {
      const pts = poly.projected;
      const count = pts ? pts.length / 3 : 0;
      if (count < 3) continue;
      const rgb = ssColorToRgbUnit(poly.color);
      const alpha = ssClamp(Number(poly.alpha), 0, 1);
      for (let i = 1; i < count - 1; i += 1) {
        for (let k = 0; k < 3; k += 1) {
          const offset = (k === 0 ? 0 : (k === 1 ? i : i + 1)) * 3;
          const sx = pts[offset];
          const sy = pts[offset + 1];
          const depth = ssClamp(pts[offset + 2], SS_NEAR_PLANE, SS_FAR_PLANE);
          const ndcX = sx / w * 2 - 1;
          const ndcY = 1 - sy / h * 2;
          positions[cursor] = ndcX * depth;
          colors[cursor++] = rgb[0];
          positions[cursor] = ndcY * depth;
          colors[cursor++] = rgb[1];
          positions[cursor] = depthA * depth + depthB;
          colors[cursor++] = rgb[2];
          positions[cursor] = depth;
          colors[cursor++] = alpha;
        }
      }
    }

    gl.useProgram(ssDepthProgram);
    ssEnsureDepthGpuCapacity(floatCount);

    gl.bindBuffer(gl.ARRAY_BUFFER, ssDepthPositionBuffer);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, positions.subarray(0, floatCount));
    gl.enableVertexAttribArray(ssDepthPositionLocation);
    gl.vertexAttribPointer(ssDepthPositionLocation, 4, gl.FLOAT, false, 0, 0);

    gl.bindBuffer(gl.ARRAY_BUFFER, ssDepthColorBuffer);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, colors.subarray(0, floatCount));
    gl.enableVertexAttribArray(ssDepthColorLocation);
    gl.vertexAttribPointer(ssDepthColorLocation, 4, gl.FLOAT, false, 0, 0);

    // Clear any stale GL error before this frame's final draw so the safety check
    // below reflects this compositor pass rather than an old initialization warning.
    while (gl.getError() !== gl.NO_ERROR) {}
    gl.drawArrays(gl.TRIANGLES, 0, vertexCount);

    // The visible scene is a 2D canvas with the 3D world composited from this
    // offscreen WebGL canvas. finish() makes that cross-canvas handoff synchronous.
    gl.finish();

    // Never report success with an empty/invalid GPU frame. If the context is lost or
    // this draw produced a WebGL error, return false so ssDrawPolygons() immediately
    // uses the existing CPU painter renderer for this frame instead of exposing sky.
    if (gl.isContextLost() || gl.getError() !== gl.NO_ERROR) return false;
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.drawImage(
      ssDepthCanvas,
      0, 0, ssDepthCanvas.width, ssDepthCanvas.height,
      0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT
    );
    ctx.restore();
    return true;
  }

    function ssDrawPolygonListPainter(polygons) {
    polygons.sort((a, b) => b.depth - a.depth);
    for (const poly of polygons) {
      const pts = poly.projected;
      if (!pts || pts.length < 9) continue;
      ctx.globalAlpha = poly.alpha;
      ctx.fillStyle = poly.color;
      ctx.beginPath();
      ctx.moveTo(pts[0], pts[1]);
      for (let i = 3; i < pts.length; i += 3) ctx.lineTo(pts[i], pts[i + 1]);

      ctx.fill();
    }

    function ssDrawPolygonsPainterFallback() {
      // This is retained only for devices where WebGL is unavailable. It deliberately
      // uses one global face list rather than the older object-group exceptions.
      const all = ssPolygons.slice();
      ssDrawPolygonListPainter(all);
      ctx.globalAlpha = 1;
    }

    function ssDrawPolygons() {
      // One universal visibility rule for every face of every object. The GPU depth
      // buffer—not object type, drawing order, or special-case layers—decides which
      // surface is closest to the camera at each pixel.
      if (!ssRenderPolygonsWithDepthBuffer(ssPolygons)) {
        ssDrawPolygonsPainterFallback();
      }
      ctx.globalAlpha = 1;
    }

    function ssHotbarMetrics() {
    const slot = SS_HOTBAR_SLOT_SIZE;
    const gap = SS_HOTBAR_SLOT_GAP;
    const visible = SS_HOTBAR_VISIBLE_SLOTS;
    const contentWidth = visible * slot + (visible - 1) * gap;
    const width = contentWidth + 20;
    const height = slot + 12;
    return {
      x: (GAME_CANVAS_LOGICAL_WIDTH - width) * 0.5,
      y: GAME_CANVAS_LOGICAL_HEIGHT - SS_HOTBAR_BOTTOM - height,
      width,
      height,
      slot,
      gap,
      contentWidth,
      innerX: (GAME_CANVAS_LOGICAL_WIDTH - width) * 0.5 + 10,
      innerY: GAME_CANVAS_LOGICAL_HEIGHT - SS_HOTBAR_BOTTOM - height + 6
    };
  }

  function ssHotbarRowCount() {
    return Math.max(1, Math.ceil(ssHotbarItems.length / SS_HOTBAR_VISIBLE_SLOTS));
  }

  function ssHotbarCurrentRow() {
    return ssClamp(Math.floor(Number(ssHotbarScroll || 0) / SS_HOTBAR_VISIBLE_SLOTS), 0, ssHotbarRowCount() - 1);
  }

  function ssSetHotbarRow(row) {
    const nextRow = ssClamp(Math.floor(Number(row || 0)), 0, ssHotbarRowCount() - 1);
    ssHotbarScroll = nextRow * SS_HOTBAR_VISIBLE_SLOTS;
  }

  function ssFlipHotbarRow(direction) {
    const dir = direction < 0 ? -1 : 1;
    ssSetHotbarRow(ssHotbarCurrentRow() + dir);
  }

  function ssHotbarRowButtonMetrics() {
    const m = ssHotbarMetrics();
    const width = 34;
    const height = 30;
    const gap = 4;
    const x = m.x + m.width + 8;
    const totalH = height * 2 + gap;
    const y = m.y + (m.height - totalH) * 0.5;
    return {
      up: { x, y, width, height },
      down: { x, y: y + height + gap, width, height },
      row: ssHotbarCurrentRow(),
      rowCount: ssHotbarRowCount()
    };
  }

  function ssHotbarRowControlAtPoint(x, y) {
    const ui = ssHotbarRowButtonMetrics();
    if (ui.rowCount <= 1) return null;

    // Treat the two row controls as two large contiguous hit regions rather than
    // separate triangle/border/background pieces. Everything visible plus a generous
    // margin around it is clickable, and the midpoint between the buttons decides
    // whether the press means UP or DOWN. This removes tiny dead zones entirely.
    const outerPadX = ssIsMobileGame() ? 6 : 14;
    const outerPadY = ssIsMobileGame() ? 5 : 11;
    const left = Math.min(ui.up.x, ui.down.x) - outerPadX;
    const right = Math.max(ui.up.x + ui.up.width, ui.down.x + ui.down.width) + outerPadX;
    const top = ui.up.y - outerPadY;
    const bottom = ui.down.y + ui.down.height + outerPadY;
    if (x < left || x > right || y < top || y > bottom) return null;

    const splitY = (ui.up.y + ui.up.height + ui.down.y) * 0.5;
    if (y <= splitY) return { type: "up", enabled: ui.row > 0 };
    return { type: "down", enabled: ui.row < ui.rowCount - 1 };
  }


  function ssHotbarIndexAtPoint(x, y) {
      const m = ssHotbarMetrics();
      if (x < m.x || x > m.x + m.width || y < m.y || y > m.y + m.height) return -1;
      const local = x - m.innerX;
      if (local < 0) return -1;
      const stride = m.slot + m.gap;
      const visibleIndex = Math.floor(local / stride);
      if (visibleIndex < 0 || visibleIndex >= SS_HOTBAR_VISIBLE_SLOTS) return -1;
      const within = local - visibleIndex * stride;
      if (within > m.slot) return -1;
      const itemIndex = ssHotbarScroll + visibleIndex;
      return itemIndex < ssHotbarItems.length ? itemIndex : -1;

    function ssDrawPickaxeIcon(cx, cy, scale = 1) {
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#8b5a2b";
      ctx.lineWidth = 5 * scale;
      ctx.beginPath();
      ctx.moveTo(cx - 8 * scale, cy + 12 * scale);
      ctx.lineTo(cx + 8 * scale, cy - 13 * scale);
      ctx.stroke();
      ctx.strokeStyle = "#d7e0e8";
      ctx.lineWidth = 4 * scale;

        ctx.strokeStyle = "#ef4444";
        ctx.lineWidth = 1.4*s;

        ctx.strokeStyle = "#f59e0b";
        ctx.lineWidth = 5.0*s;
        ctx.beginPath();
        ctx.ellipse(cx, cy, 16*s, 8*s, -0.18, 0, Math.PI*2);
        ctx.stroke();
        ctx.strokeStyle = "#fff7c2";
        ctx.lineWidth = 2.1*s;
        ctx.beginPath();
        ctx.ellipse(cx, cy - 1*s, 13*s, 6*s, -0.18, 0, Math.PI*2);
        ctx.stroke();

        ctx.quadraticCurveTo(cx - 7*s, cy - 5*s, cx - 3*s, cy - 16*s);

        ctx.moveTo(cx + 11*s, cy - 10*s);
        ctx.lineTo(cx + 16*s, cy + 7*s);
        ctx.lineTo(cx + 7*s, cy + 3*s);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#fde047";
        ctx.beginPath();
        ctx.moveTo(cx - 15*s, cy - 4*s);
        ctx.lineTo(cx - 6*s, cy - 4*s);
        ctx.lineTo(cx - 11*s, cy + 4*s);
        ctx.lineTo(cx - 3*s, cy + 4*s);
        ctx.lineTo(cx - 14*s, cy + 16*s);
        ctx.lineTo(cx - 10*s, cy + 7*s);
        ctx.lineTo(cx - 18*s, cy + 7*s);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2.2*s;
        ctx.beginPath();
        ctx.arc(cx + 3*s, cy + 9*s, 9*s, -0.25, 2.3);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx + 10*s, cy + 7*s);
        ctx.lineTo(cx + 15*s, cy + 4*s);
        ctx.stroke();
        ctx.restore();
        return true;
      }

      if (id === "mode-locrian") {
        // Ghost projectile.
        ctx.fillStyle = "rgba(255,255,255,.90)";
        ctx.beginPath();
        ctx.moveTo(cx - 13*s, cy + 14*s);
        ctx.lineTo(cx - 13*s, cy - 2*s);
        ctx.arc(cx, cy - 3*s, 13*s, Math.PI, 0);
        ctx.lineTo(cx + 13*s, cy + 14*s);
        ctx.lineTo(cx + 7*s, cy + 9*s);
        ctx.lineTo(cx + 2*s, cy + 14*s);
        ctx.lineTo(cx - 4*s, cy + 9*s);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#6d28d9";
        ctx.beginPath();
        ctx.arc(cx - 5*s, cy - 5*s, 2.2*s, 0, Math.PI*2);
        ctx.arc(cx + 5*s, cy - 5*s, 2.2*s, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
        return true;
      }

      ctx.restore();
      return false;
    }

    function ssDrawPartialScaleHotbarIcon(item, cx, cy, scale = 1) {
    const id = String(item?.id || "");
    if (!ssIsPartialScaleDevice(id)) return false;
    const noteCount = ssPartialNoteCount(id);
    const theme = ssPartialTheme(id, false);
    if (!theme || !noteCount) return false;

    const s = scale;
    const mounts = ssPartialLauncherLayout(noteCount);
    const hullW = 30 * s;
    const hullH = 8 * s;
    const hullY = cy + 11 * s;

    ctx.save();
    ctx.fillStyle = theme.panel;
    ctx.fillRect(cx - hullW * 0.5, hullY - hullH * 0.5, hullW, hullH);
    ctx.fillStyle = theme.chassis;
    ctx.fillRect(cx - 10 * s, cy + 1 * s, 20 * s, 10 * s);
    ctx.beginPath();
    ctx.arc(cx, cy - 1 * s, 8.2 * s, 0, Math.PI * 2);
    ctx.fillStyle = theme.core;
    ctx.fill();
    ctx.strokeStyle = theme.ring;
    ctx.lineWidth = 1.3 * s;
    ctx.beginPath();
    ctx.arc(cx, cy - 1 * s, 11.4 * s, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.92)";
    ctx.beginPath();
    ctx.arc(cx - 2.5 * s, cy - 4 * s, 2.2 * s, 0, Math.PI * 2);
    ctx.fill();

    mounts.forEach((mount, index) => {
      const gunX = cx + mount.x * 30 * s;
      const gunY = cy + (mount.tier ? -8 : 0) * s;
      ctx.fillStyle = theme.barrel;
      ctx.fillRect(gunX - 1.7 * s, gunY - 1.5 * s, 3.4 * s, 12 * s);
      ctx.beginPath();
      ctx.arc(gunX, gunY - 3.2 * s, 3.1 * s, 0, Math.PI * 2);
      ctx.fillStyle = theme.core;
      ctx.fill();
      ctx.strokeStyle = theme.glow;
      ctx.lineWidth = 0.95 * s;
      ctx.beginPath();
      ctx.arc(gunX, gunY - 3.2 * s, 4.9 * s, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.9)";
      ctx.beginPath();
      ctx.arc(gunX - 1.1 * s, gunY - 4.4 * s, 0.9 * s, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.restore();
    return true;
  }

    }

    const drawRowButton = (rect, arrow, enabled) => {
      ctx.globalAlpha = enabled ? 1 : 0.32;
      ctx.fillStyle = "rgba(16,24,39,.94)";
      ctx.fillRect(rect.x, rect.y, rect.width, rect.height);
      ctx.strokeStyle = enabled ? "#ffffff" : "rgba(255,255,255,.42)";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(rect.x + 0.75, rect.y + 0.75, rect.width - 1.5, rect.height - 1.5);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 16px Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(arrow, rect.x + rect.width * 0.5, rect.y + rect.height * 0.5 + (arrow === "▲" ? 1 : -1));
      ctx.globalAlpha = 1;
    };
    drawRowButton(rowUi.up, "▲", rowUi.row > 0);
    drawRowButton(rowUi.down, "▼", rowUi.row < rowUi.rowCount - 1);

    ctx.fillStyle = "rgba(16,24,39,.86)";
    ctx.font = "bold 9px Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    ctx.fillText(`${rowUi.row + 1}/${rowUi.rowCount}`, rowUi.up.x + rowUi.up.width * 0.5, rowUi.up.y - 2);

    const selected = ssSelectedHotbarItem();
    if (selected) {
      ctx.fillStyle = "rgba(16,24,39,.86)";
      ctx.font = "bold 12px Arial, sans-serif";
      const label = selected.name.toUpperCase();

    function ssDrawWorld() {
    ssDrawSky();
    ssPolygons.length = 0;
    ssPolygonPoolUsed = 0;
    const basis = ssCameraBasis();

    ssPerformanceVisualLOD = false;
    ssAddTerrain(basis);
    ssAddBase(basis);

    for (const resource of ssResources) {
      if (resource.collected) continue;
      const dx = resource.x - ssPlayer.x;
      const dz = resource.z - ssPlayer.z;
      if (dx * dx + dz * dz > SS_RESOURCE_RENDER_DISTANCE * SS_RESOURCE_RENDER_DISTANCE) continue;
      if (!ssObjectIntersectsView(resource.x, resource.y + 0.9, resource.z, 1.35, basis)) continue;
      ssAddResource(resource, basis);
    }

    for (const object of ssWorldObjects) {
      const dx = object.x - ssPlayer.x;
      const dz = object.z - ssPlayer.z;
      if (dx * dx + dz * dz > 43 * 43) continue;
      const objectY = Number(object.y ?? ssTerrainHeight(object.x, object.z));
      const visibleRadius = object.type === "tree" ? object.size * 2.7 : object.size * 1.8;
      if (!ssObjectIntersectsView(object.x, objectY + visibleRadius * 0.55, object.z, visibleRadius, basis)) continue;
      if (object.type === "tree") ssAddTree(object, basis);
      else ssAddRock(object, basis);
    }

    for (const enemy of ssEnemies) {
      if (!enemy || !enemy.alive) continue;
      const dx = enemy.x - ssPlayer.x;
      const dz = enemy.z - ssPlayer.z;
      if (dx * dx + dz * dz > 58 * 58) continue;
      const bodyRadius = Math.max(2.0, Number(enemy.healthBarHeight || 2.35) + 0.7);
      if (!ssObjectIntersectsView(enemy.x, enemy.y + bodyRadius * 0.45, enemy.z, bodyRadius, basis)) continue;
      ssAddGenericEnemy(enemy, basis);
    }

    for (const unit of ssSpawnedUnits) {
      if (!unit || !unit.alive) continue;
      const dx = unit.x - ssPlayer.x;
      const dz = unit.z - ssPlayer.z;
      if (dx * dx + dz * dz > 58 * 58) continue;
      if (!ssObjectIntersectsView(unit.x, unit.y + 0.8, unit.z, 2.2, basis)) continue;
      ssAddSpawnedUnit(unit, basis);
    }

    for (const projectile of ssProjectiles) {
      const dx = projectile.x - ssPlayer.x;
      const dz = projectile.z - ssPlayer.z;
      if (dx * dx + dz * dz > 60 * 60) continue;
      if (!ssObjectIntersectsView(projectile.x, projectile.y, projectile.z, Math.max(0.8, Number(projectile.radius || 0.12) * 5), basis, 45)) continue;
      ssAddCombatProjectile(projectile, basis);
    }

    for (const effect of ssCombatEffects) {
      const dx = effect.x - ssPlayer.x;
      const dz = effect.z - ssPlayer.z;
      if (dx * dx + dz * dz > 60 * 60) continue;
      if (!ssObjectIntersectsView(effect.x, effect.y, effect.z, Math.max(1.0, Number(effect.radius || 1) + 0.8), basis, 55)) continue;
      ssAddCombatEffectVisual(effect, basis);
    }

    // Contextual targeting-range previews.
    if (!ssCraftOverlayOpen) {
      if (ssShowAllDeviceRanges) {
        for (const d of ssPlacedDevices) {
          if (!d || Number(d.health || SS_DEVICE_BASE_HEALTH)<=0) continue;
          const r=ssDeviceRangePreviewRadius(d); if (!(r>0)) continue;
          if (ssObjectIntersectsView(d.x,ssGroundHeight(d.x,d.z)+0.1,d.z,r+1,basis,75)) ssAddDeviceRangePreviewRing(d,basis,{all:true});
        }
      } else if (!ssPlacementActive) {
        const d=ssNearbyRangePreviewDevice(); if (d) ssAddDeviceRangePreviewRing(d,basis);
      }
    }

    for (const device of ssPlacedDevices) {
      const dx = device.x - ssPlayer.x;
      const dz = device.z - ssPlayer.z;
      if (dx * dx + dz * dz > 48 * 48) continue;
      const footprint = Math.hypot(Number(device.footprintHalfX || 0.7), Number(device.footprintHalfZ || 0.7));
      const height = Math.max(0.8, Number(device.height || 1));
      if (!ssObjectIntersectsView(device.x, device.y + height * 0.5, device.z, footprint + height, basis)) continue;
      ssAddDeviceStructure(device, basis, false);
      ssAddDeviceCombatPolish(device, basis);
      ssAddMatchingPlacementGlow(device, basis);
      ssAddStackBillboard(device, basis);
      ssAddDeviceHealthBar(device, basis);
    }

    if (ssPlacementActive && ssPlacementPreview && !ssCraftOverlayOpen) {
      const preview = ssPlacementPreview;
      ssAddDeviceRangePreviewRing(preview, basis, { placement:true });
      ssAddDeviceStructure(preview, basis, true);
    }

    ssAddPlayer(basis);
    ssDrawPolygons();
    ssDrawDayNightWorldTint();
    ssDrawAmbientLifeOverlay();
    ssDrawHud();
  }

    function gameUpdate() {
      const perfStart = performance.now();
      if (ssGameEnded) {
        ssPlayer.moving = false;
        ssPlayer.y = ssPlayerSupportHeight(ssPlayer.x, ssPlayer.z);
        const now = performance.now();
        const dt = ssClamp((now - ssCombatLastTimestamp) / 1000, 0, 0.05);
        ssCombatLastTimestamp = now;
        ssUpdatePlayerSword(dt);
        ssUpdateCastleAmbientEffects(dt);
        ssUpdateCombatEffects(dt);
        ssPerformanceStats.updateMs = performance.now() - perfStart;
        return;
      }
      if (ssCraftOverlayOpen) {
        // Craft is a true pause: freeze the phase clock and the whole battle simulation.
        ssPlayer.moving = false;
        ssPlayer.y = ssPlayerSupportHeight(ssPlayer.x, ssPlayer.z);
        if (ssCraftMessageTimer > 0) ssCraftMessageTimer -= 1;
        ssCombatLastTimestamp = performance.now();
        ssPerformanceStats.updateMs = performance.now() - perfStart;
        return;
      }
      ssUpdateControls();
      ssUpdatePlacementPreview();
      ssUpdateResourceInteraction();
      ssUpdateCombat();
      ssPerformanceStats.updateMs = performance.now() - perfStart;
    }

    function gameInput(action) {
      if (ssGameEnded) return;

      if (ssCraftOverlayOpen) {
        if (["up", "down", "left", "right"].includes(action)) {
          ssCraftMoveCursor(action);
          return;
        }
        if (action === "a") {
          ssCraftActivateCursor();
          return;
        }
        if (action === "x") {
          ssToggleCraftOverlay(false);
          return;
        }
        if (action === "start") return;
        return;
      }

      if (action === "a") ssUseSelectedHotbarItem();
      if (action === "b" && ssIsMobileGame()) ssTryDismantleNearbyDevice();
      if (action === "x") ssToggleCraftOverlay(true);
      if (action === "y") ssToggleAllDeviceRangePreview();
      if (action === "left") ssCycleHotbar(-1);
      if (action === "right") ssCycleHotbar(1);
      if (action === "start") return;
    }

    function gamePointer(point) {
    if (!point || ssGameEnded) return;

    const rowControl = ssHotbarRowControlAtPoint(point.x, point.y);
    if (rowControl) {
      // Desktop changes rows immediately on pointerdown. Ignore its follow-up click
      // so one press can never jump two rows. Touch/mobile still changes here.
      if (performance.now() >= Number(ssHotbarRowPointerBlockUntil || 0) && rowControl.enabled) {
        ssFlipHotbarRow(rowControl.type === "up" ? -1 : 1);
      }
      return;
    }

    if (ssCraftOverlayOpen) {
      if (ssHandleCraftPointer(point.x, point.y)) return;
      const craftHotbarIndex = ssHotbarIndexAtPoint(point.x, point.y);
      if (craftHotbarIndex >= 0 && !ssIsMobileGame()) ssSelectHotbarIndex(craftHotbarIndex);
      return;
    }

    const index = ssHotbarIndexAtPoint(point.x, point.y);
    if (index >= 0 && !ssIsMobileGame()) ssSelectHotbarIndex(index);
  }

    function ssStopMobileHotbarRepeat() {
      if (ssMobileHotbarRepeatTimeout) clearTimeout(ssMobileHotbarRepeatTimeout);
      if (ssMobileHotbarRepeatInterval) clearInterval(ssMobileHotbarRepeatInterval);
      ssMobileHotbarRepeatTimeout = null;
      ssMobileHotbarRepeatInterval = null;
    }

    function ssBindMobileHotbarRepeat() {
      const left = document.getElementById("dpadLeft");
      const right = document.getElementById("dpadRight");
      if (!left || !right) return;

      const bind = (button, direction) => {
        if (button.dataset.ssHotbarRepeatBound === "yes") return;
        button.dataset.ssHotbarRepeatBound = "yes";
        button.addEventListener("pointerdown", () => {
          ssStopMobileHotbarRepeat();
          ssMobileHotbarRepeatTimeout = setTimeout(() => {
            ssMobileHotbarRepeatInterval = setInterval(() => { if (!ssCraftOverlayOpen) ssCycleHotbar(direction); }, SS_HOTBAR_REPEAT_INTERVAL_MS);
          }, SS_HOTBAR_REPEAT_DELAY_MS);
        });
        ["pointerup", "pointercancel", "pointerleave"].forEach(type => {
          button.addEventListener(type, ssStopMobileHotbarRepeat);
        });
      };

      bind(left, -1);
      bind(right, 1);
    }

            ssCraftOverlayOpen = false;
      ssCraftSelection = [];
      ssCraftCursorKey = null;
      ssCraftCursorAdvanceFromNote = null;

      ssDeactivatePlacement(true);

    document.addEventListener("keydown", event => {
      if (!running) return;
      if (event.target && ["INPUT", "TEXTAREA", "SELECT"].includes(event.target.tagName)) return;
      if (shellMenu && (shellMenu.classList.contains("is-open") || shellMenu.classList.contains("open"))) return;

      const key = event.key.toLowerCase();
      if (key === "e" && !event.repeat && !ssIsMobileGame()) {
        ssToggleCraftOverlay();
        event.preventDefault();
        return;
      }
      if (key === "r" && !event.repeat && !ssIsMobileGame() && !ssCraftOverlayOpen) {
        ssTryDismantleNearbyDevice();
        event.preventDefault();
        return;
      }
      if (
        key === "w" || key === "a" || key === "s" || key === "d" ||
        key === "arrowleft" || key === "arrowright" || key === "arrowup" || key === "arrowdown"
      ) {
        ssKeys[key] = true;
        event.preventDefault();
      }
    });

    document.addEventListener("keyup", event => {
      const key = event.key.toLowerCase();
      if (key in ssKeys) {
        delete ssKeys[key];
        event.preventDefault();
      }
    });

    window.addEventListener("blur", () => {
      ssStopMobileHotbarRepeat();
      for (const key of Object.keys(ssKeys)) delete ssKeys[key];
      ssCameraDragActive = false;
      ssCameraDragPointerId = null;
    });

    canvas.addEventListener("pointerdown", event => {
      if (!running || ssGameEnded || event.pointerType !== "mouse") return;
      if (shellMenu && (shellMenu.classList.contains("is-open") || shellMenu.classList.contains("open"))) return;

      const rect = canvas.getBoundingClientRect();
      const logicalX = (event.clientX - rect.left) * (GAME_CANVAS_LOGICAL_WIDTH / rect.width);
      const logicalY = (event.clientY - rect.top) * (GAME_CANVAS_LOGICAL_HEIGHT / rect.height);
      const rowControl = ssHotbarRowControlAtPoint(logicalX, logicalY);
      if (rowControl) {
        if (rowControl.enabled) ssFlipHotbarRow(rowControl.type === "up" ? -1 : 1);
        ssHotbarRowPointerBlockUntil = performance.now() + 500;
        event.preventDefault();
        return;
      }
      if (ssCraftOverlayOpen) return;
      if (ssHotbarIndexAtPoint(logicalX, logicalY) >= 0) return;

      ssCameraDragActive = true;
      ssCameraDragPointerId = event.pointerId;
      ssCameraDragLastX = event.clientX;
      ssCameraDragLastY = event.clientY;

      try { canvas.setPointerCapture(event.pointerId); } catch (err) {}
      event.preventDefault();
    });

    canvas.addEventListener("pointermove", event => {
      if (
        !ssCameraDragActive ||
        event.pointerType !== "mouse" ||
        event.pointerId !== ssCameraDragPointerId
      ) return;

      const dx = event.clientX - ssCameraDragLastX;
      const dy = event.clientY - ssCameraDragLastY;
      ssCameraDragLastX = event.clientX;
      ssCameraDragLastY = event.clientY;

      ssCamera.yaw -= dx * 0.0065;
      ssCamera.pitch = ssClamp(
        ssCamera.pitch + dy * 0.0048,
        SS_CAMERA_MIN_PITCH,
        SS_CAMERA_MAX_PITCH
      );

      event.preventDefault();
    });

    function ssFinishCameraDrag(event) {
      if (!ssCameraDragActive || event.pointerId !== ssCameraDragPointerId) return;

      try {
        if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      } catch (err) {}

      ssCameraDragActive = false;
      ssCameraDragPointerId = null;
    }

    canvas.addEventListener("pointerup", ssFinishCameraDrag);
    canvas.addEventListener("pointercancel", ssFinishCameraDrag);
    window.ScaleSurvivalPhase5H = {
      getHotbarItems: () => ssHotbarItems.map(item => ({ ...item })),
      getNoteInventory: () => ({ ...ssNoteInventory }),
      getSelectedHotbarItem: () => ({ ...(ssSelectedHotbarItem() || {}) }),
      getPlacedDevices: () => ssPlacedDevices.map(device => ({
        ...device,
        targetSlots: Array.isArray(device.targetSlots) ? device.targetSlots.slice() : [],
        sourceRecipe: device.sourceRecipe ? { ...device.sourceRecipe, notes: (device.sourceRecipe.notes || []).slice() } : null,
        sourceRecipes: Array.isArray(device.sourceRecipes)
          ? device.sourceRecipes.map(recipe => ({ ...recipe, notes: (recipe.notes || []).slice() }))
          : []
      })),
      getEnemies: () => ssEnemies.map(enemy => ({
        ...enemy,
        statuses: {
          ...enemy.statuses,
          poisons: (enemy.statuses?.poisons || []).map(effect => ({ ...effect })),
          slows: (enemy.statuses?.slows || []).map(effect => ({ ...effect })),
          dancing: enemy.statuses?.dancing ? { ...enemy.statuses.dancing } : null
        }
      })),
      getProjectiles: () => ssProjectiles.map(projectile => ({ ...projectile, onHit: undefined, onKill: undefined })),
    getPerformanceStats: () => ({ ...ssPerformanceStats }),
    getDayNightState: () => ({ phase: ssDayNightPhase, day: ssDayNightDayNumber, elapsed: ssDayNightPhaseElapsed, duration: ssDayNightPhaseDuration(), nightSpawnRate: ssNightSpawnRateForNight(ssDayNightDayNumber) }),
      getSpawnedUnits: () => ssSpawnedUnits.map(unit => ({ ...unit, update: undefined, meta: { ...(unit.meta || {}) } })),
      getCastleCombat: () => ({ ...ssCastleCombat }),
      getCombatConstants: () => ({ fullModeTargetLimit: SS_FULL_MODE_TARGET_LIMIT, deviceBaseHealth: SS_DEVICE_BASE_HEALTH }),
    getPoisonTerrainPanels: () => Array.from(ssPoisonTerrainPanels.values()).map(panel => ({ ...panel })),
      acquirePrimaryTargets: (placedId, options = {}) => {
        const device = ssDeviceById(placedId);
        return ssAcquirePrimaryTargets(device, options).map(enemy => enemy.enemyId);
      },
      applyEnemyDamage: (enemyId, amount) => ssApplyEnemyDamage(ssEnemyById(enemyId), amount, { sourceId: "debug", sourceKind: "debug" }),
      applyEnemyPoison: (enemyId, options = {}) => ssApplyEnemyPoison(ssEnemyById(enemyId), options),
      applyEnemySlow: (enemyId, options = {}) => ssApplyEnemySlow(ssEnemyById(enemyId), options),
      addEnemyFear: (enemyId, amount) => ssAddEnemyFear(ssEnemyById(enemyId), amount, "debug"),
      convertEnemy: enemyId => ssConvertEnemy(ssEnemyById(enemyId), "debug"),
      setEnemyDancing: (enemyId, options = {}) => ssSetEnemyDancing(ssEnemyById(enemyId), options),
      spawnProjectile: ssSpawnProjectile,
      applyAreaDamage: ssApplyAreaDamage,
      repairDevice: (placedId, amount) => ssRepairDevice(ssDeviceById(placedId), amount),
      addOrUpdateHotbarItem: ssAddOrUpdateHotbarItem,
      toggleCraft: ssToggleCraftOverlay,
      getLydianConfig: () => ({ damage: SS_FULL_MODE_DAMAGE, cooldown: SS_FULL_MODE_ACTION_COOLDOWN, range: SS_FULL_MODE_DETECTION_RADIUS, projectileSpeed: SS_FULL_MODE_PROJECTILE_SPEED, haloKillsRequired: SS_LYDIAN_HALO_KILLS_REQUIRED, angelHealth: SS_LYDIAN_ANGEL_HEALTH, angelFieldLifespan: SS_LYDIAN_ANGEL_FIELD_LIFESPAN, angelKillLimit: SS_LYDIAN_ANGEL_KILL_LIMIT, angelAggroRange: SS_LYDIAN_ANGEL_AGGRO_RANGE, targetLimit: SS_FULL_MODE_TARGET_LIMIT }),
    getLydianHaloStacks: () => ssPlacedDevices.filter(ssIsLydianTower).map(device => ({ placedId: device.placedId, halos: Number(device.lydianHaloStack || 0) })),
      fireLydianVolley: placedId => ssFireLydianVolley(ssDeviceById(placedId)),
      getIonianConfig: () => ({ repairPerSecond: SS_IONIAN_REPAIR_PER_SECOND, nurseHealth: SS_IONIAN_NURSE_HEALTH, nurseSpeed: SS_IONIAN_NURSE_SPEED, nurseLifespan: SS_IONIAN_NURSE_LIFESPAN, replacementDelay: SS_IONIAN_NURSE_REPLACEMENT_DELAY, targetLimit: SS_FULL_MODE_TARGET_LIMIT }),
    getDorianConfig: () => ({ damage: SS_FULL_MODE_DAMAGE, cooldown: SS_FULL_MODE_ACTION_COOLDOWN, range: SS_FULL_MODE_DETECTION_RADIUS, projectileSpeed: SS_FULL_MODE_PROJECTILE_SPEED, letters: SS_DORIAN_LETTERS.slice(), convertedHealthFraction: SS_DORIAN_CONVERTED_HEALTH_FRACTION, targetLimit: SS_FULL_MODE_TARGET_LIMIT }),
    fireDorianChant: placedId => ssFireDorianChant(ssDeviceById(placedId)),
    getPhrygianConfig: () => ({ damage: SS_FULL_MODE_DAMAGE, cooldown: SS_FULL_MODE_ACTION_COOLDOWN, range: SS_FULL_MODE_DETECTION_RADIUS, projectileSpeed: SS_FULL_MODE_PROJECTILE_SPEED, puddleDps: SS_PHRYGIAN_POISON_PUDDLE_DPS, puddleRadius: SS_TERRAIN_STEP * 0.5, puddleDuration: Infinity, permanentTerrainPanel: true, targetLimit: SS_FULL_MODE_TARGET_LIMIT }),
      deployPhrygianSnakes: placedId => ssDeployPhrygianSnakes(ssDeviceById(placedId)),
      getMixolydianConfig: () => ({ damage: SS_FULL_MODE_DAMAGE, cooldown: SS_FULL_MODE_ACTION_COOLDOWN, range: SS_FULL_MODE_DETECTION_RADIUS, projectileSpeed: SS_FULL_MODE_PROJECTILE_SPEED, primaryDanceDuration: SS_MIXOLYDIAN_PRIMARY_DANCE_DURATION, secondaryDanceDuration: SS_MIXOLYDIAN_SECONDARY_DANCE_DURATION, spreadRadius: SS_MIXOLYDIAN_DANCE_SPREAD_RADIUS, targetLimit: SS_FULL_MODE_TARGET_LIMIT }),
      fireMixolydianVolley: placedId => ssFireMixolydianVolley(ssDeviceById(placedId)),
      getAeolianConfig: () => ({ damage: SS_FULL_MODE_DAMAGE, cooldown: SS_FULL_MODE_ACTION_COOLDOWN, range: SS_FULL_MODE_DETECTION_RADIUS, projectileSpeed: SS_FULL_MODE_PROJECTILE_SPEED, burstRadius: SS_AEOLIAN_KILL_BURST_RADIUS, elements: SS_AEOLIAN_ELEMENTS.map(entry => ({ ...entry })), targetLimit: SS_FULL_MODE_TARGET_LIMIT }),
      fireAeolianVolley: placedId => ssFireAeolianVolley(ssDeviceById(placedId)),
      getLocrianConfig: () => ({ damage: SS_FULL_MODE_DAMAGE, cooldown: SS_FULL_MODE_ACTION_COOLDOWN, range: SS_FULL_MODE_DETECTION_RADIUS, projectileSpeed: SS_FULL_MODE_PROJECTILE_SPEED, panicRadius: SS_LOCRIAN_PANIC_RADIUS, maxSecondaryPanic: SS_LOCRIAN_MASS_PANIC_MAX_SECONDARY, targetLimit: SS_FULL_MODE_TARGET_LIMIT }),
      fireLocrianGhosts: placedId => ssFireLocrianGhosts(ssDeviceById(placedId)),
      damageSpawnedUnit: (unitId, amount) => ssApplySpawnedUnitDamage(ssSpawnedUnitById(unitId), amount, { sourceId: "debug" })
    };
    window.ScaleSurvivalPhase5G = window.ScaleSurvivalPhase5H;
  window.ScaleSurvivalPhase5F = window.ScaleSurvivalPhase5H;
    window.ScaleSurvivalPhase5E = window.ScaleSurvivalPhase5H;
  window.ScaleSurvivalPhase5D = window.ScaleSurvivalPhase5H;
    window.ScaleSurvivalPhase5C = window.ScaleSurvivalPhase5H;
    window.ScaleSurvivalPhase5B = window.ScaleSurvivalPhase5H;
    window.ScaleSurvivalPhase5A = window.ScaleSurvivalPhase5H;
    window.ScaleSurvivalPhase4D = window.ScaleSurvivalPhase5H;
    window.ScaleSurvivalPhase4C = window.ScaleSurvivalPhase5H;
    window.ScaleSurvivalPhase4B = window.ScaleSurvivalPhase5H;
    window.ScaleSurvivalPhase2 = window.ScaleSurvivalPhase5H;

    let resizeObserver = null;

    if ("ResizeObserver" in window) {
      resizeObserver = new ResizeObserver(() => {
        scaleAppToFrame();
        // Resize/layout notifications are not finger-up events.
        if (!sticks.left.active) resetJoystick(sticks.left);
        if (!sticks.right.active) resetJoystick(sticks.right);

        if (!running) {
          resetGameCanvasTransform();
          gameDraw();
        }
      });

      resizeObserver.observe(appFrame);
    }

    window.addEventListener("orientationchange", () => {
      setTimeout(() => {
        scaleAppToFrame();
        if (!sticks.left.active) resetJoystick(sticks.left);
        if (!sticks.right.active) resetJoystick(sticks.right);

        if (!running) {
          resetGameCanvasTransform();
          gameDraw();
        }
      }, 250);
    });

    function shutDownMobileArcade() {
      try {
        stopGame();
      } catch (err) {}

      if (audioCtx && audioCtx.state !== "closed") {
        audioCtx.close().catch(() => {});
      }

      audioCtx = null;
    }

    window.addEventListener("pagehide", shutDownMobileArcade);

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "hidden") return;
      resetJoystick(sticks.left);
      resetJoystick(sticks.right);
    });


    scaleAppToFrame();
    loadPlayers();
    resetJoystick(sticks.left);
    resetJoystick(sticks.right);
    configureMobileControls({
      faceButtons: ["a", "b", "x", "y"],
      systemButtons: ["start"],
      labels: { a: "Use", b: "Scrap", x: "Craft", y: "Range", start: "Menu" }
    });
    gameInit();
    resetGameCanvasTransform();
    gameDraw();
  
</script>
</body>
</html>
