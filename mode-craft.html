      unit.meta.reactionTimer = Math.max(0, Number(unit.meta.reactionTimer || 0) - dt);
      if (unit.meta.reactionTimer <= 0) {
        const pending = ssIonianTargetDescriptor(hospital, unit.meta.pendingTargetKind, unit.meta.pendingTargetId);
        if (pending && ssIonianWasRecentlyAttacked(pending.target)
            && Math.hypot(pending.x - unit.x, pending.z - unit.z) <= SS_IONIAN_AWARENESS_RADIUS) {
          ssIonianAssignNurseTarget(unit, pending);
          target = pending;
        }
        ssIonianClearPendingReaction(unit);
      }
    }

    target = ssIonianCurrentNurseTarget(hospital, unit);
    if (target) {
      unit.meta.state = "repair";
      const unitRadius = Math.max(0.08, Number(unit.radius || SS_IONIAN_NURSE_RADIUS));
      let inRepairRange = false;
      let stopDistance = Number(target.radius || 0.5) + unitRadius + 0.12;
      if (target.kind === "device") {
        inRepairRange = ssCharacterGapToDevice(unit.x, unit.z, unitRadius, target.target) <= 0.16;
        stopDistance = 0;
      } else {
        inRepairRange = Math.hypot(target.x - unit.x, target.z - unit.z) <= stopDistance + 0.02;
      }
      if (!inRepairRange) ssMoveNurseToward(unit, target.x, target.z, dt, stopDistance);
      else {
        ssIonianRepairTarget(target, ssIonianRepairRate(hospital) * dt);
        unit.facing = Math.atan2(target.x - unit.x, -(target.z - unit.z));
        unit.meta.workPhase = Number(unit.meta.workPhase || 0) + dt * 8;
        const refreshed = ssIonianTargetDescriptor(hospital, target.kind, target.id);
        if (!refreshed) ssIonianStartHold(unit, target);
      }
      return;
    }

    // Nurses never heal one another. If a nurse is hurt during a quiet moment, they
    // return to their own Hospital, recover there, then resume their existing patrol.
    if (Number(unit.health || 0) < Number(unit.maxHealth || SS_IONIAN_NURSE_HEALTH) - 0.01
        && !unit.meta.pendingTargetKey) {
      const home = ssIonianHomePoint(hospital, unit);
      const atHome = Math.hypot(home.x - unit.x, home.z - unit.z) <= 0.28;
      unit.meta.state = "recover";
      if (!atHome) {
        ssMoveNurseToward(unit, home.x, home.z, dt, 0.16);
      } else {
        unit.health = Math.min(Number(unit.maxHealth || SS_IONIAN_NURSE_HEALTH), Number(unit.health || 0) + ssIonianRepairRate(hospital) * dt);
        unit.facing = Number(hospital.yaw || 0) + Math.PI;
        unit.meta.workPhase = Number(unit.meta.workPhase || 0) + dt * 5;
        if (Number(unit.health || 0) >= Number(unit.maxHealth || SS_IONIAN_NURSE_HEALTH) - 0.01) unit.meta.state = "patrol";
      }
      return;
    }

    // No emergency: continue this nurse's independent full-base shuffled route.
    let patrol = ssIonianCurrentPatrolTarget(hospital, unit);
    if (!patrol) patrol = ssIonianSetPatrolTarget(hospital, unit);
    if (patrol) {
      const device = patrol.target;
      const unitRadius = Math.max(0.08, Number(unit.radius || SS_IONIAN_NURSE_RADIUS));
      const arrived = ssCharacterGapToDevice(unit.x, unit.z, unitRadius, device) <= 0.24;
      if (!arrived) {
        unit.meta.state = "patrol";
        ssMoveNurseToward(unit, device.x, device.z, dt, 0);
      } else if (Number(device.health || 0) < Number(device.maxHealth || 1) - 0.01) {
        unit.meta.patrolLastDeviceId = device.placedId;
        const repairTarget = ssIonianTargetDescriptor(hospital, "device", device.placedId);
        if (repairTarget) {
          ssIonianAssignNurseTarget(unit, repairTarget);
          ssIonianRepairTarget(repairTarget, ssIonianRepairRate(hospital) * dt);
          unit.meta.workPhase = Number(unit.meta.workPhase || 0) + dt * 8;
        }
      } else {
        unit.meta.patrolLastDeviceId = device.placedId;
        unit.meta.patrolDeviceId = null;
        ssIonianSetPatrolTarget(hospital, unit);
      }
      return;
    }

    // With only this Hospital on the map, roam a loose circle rather than idling.
    unit.meta.roamAngle = Number(unit.meta.roamAngle || (unit.meta.homeIndex || 0) * 0.9) + dt * 0.34;
    const roamRadius = 3.4 + (Number(unit.meta.homeIndex || 0) % 3) * 0.7;
    const rx = hospital.x + Math.cos(unit.meta.roamAngle) * roamRadius;
    const rz = hospital.z + Math.sin(unit.meta.roamAngle) * roamRadius;
    unit.meta.state = "roam";
    ssMoveNurseToward(unit, rx, rz, dt, 0.18);
  }

  function ssDeployIonianNurses(hospital, dt = 0) {
    hospital = ssEnsureDeviceCombatState(hospital);
    if (!hospital || hospital.health <= 0 || !ssIsIonianHospital(hospital)) return 0;

    let liveNurses = ssLiveIonianNurses(hospital);
    if (liveNurses.length > SS_FULL_MODE_TARGET_LIMIT) {
      liveNurses.slice(SS_FULL_MODE_TARGET_LIMIT).forEach(nurse => { nurse.alive = false; });
      liveNurses = liveNurses.slice(0, SS_FULL_MODE_TARGET_LIMIT);
    }

    // One network-wide dispatcher manages all Hospitals. It reserves nurses while
    // they are still reacting/travelling, predicts whether their healing will be
    // useful on arrival, and keeps castle response within the global 40% ceiling.
    ssIonianRunDispatchNetwork();

    // Rebuild killed staff one nurse at a time. Seven nurses per Hospital remains a
    // core identity; balance comes from healing strength and intelligent coverage.
    hospital.nurseSpawnTimer = Math.max(0, Number(hospital.nurseSpawnTimer || 0) - Math.max(0, Number(dt || 0)));
    let spawned = 0;
    if (liveNurses.length < SS_FULL_MODE_TARGET_LIMIT && hospital.nurseSpawnTimer <= 0) {
      const usedHomeIndices = new Set(liveNurses.map(nurse => Math.max(0, Math.min(SS_FULL_MODE_TARGET_LIMIT - 1, Number(nurse.meta?.homeIndex || 0)))));
      let homeIndex = 0;
      while (homeIndex < SS_FULL_MODE_TARGET_LIMIT && usedHomeIndices.has(homeIndex)) homeIndex += 1;
      if (homeIndex < SS_FULL_MODE_TARGET_LIMIT) {
        const home = ssIonianHomePoint(hospital, { meta: { homeIndex } });
        const unit = ssRegisterSpawnedUnit({
          ownerId: hospital.placedId,
          ownerAllegiance: "player",
          kind: "ionian-nurse",
          x: home.x, y: home.y, z: home.z,
          health: SS_IONIAN_NURSE_HEALTH,
          maxHealth: SS_IONIAN_NURSE_HEALTH,
          radius: SS_IONIAN_NURSE_RADIUS,
          speed: SS_IONIAN_NURSE_SPEED,
          facing: Number(hospital.yaw || 0) + Math.PI,
          targetId: null,
          attackable: true,
          update: ssUpdateIonianNurse,
          meta: {
            mode: "Ionian",
            targetKind: null,
            targetRefId: null,
            targetDeviceId: null,
            homeIndex,
            state: "patrol",
            stepPhase: homeIndex * 0.7,
            workPhase: 0,
            patrolQueue: [],
            patrolIndex: 0,
            patrolDeviceId: null,
            patrolLastDeviceId: null,
            patrolSignature: null,
            reactionTimer: 0,
            pendingTargetKey: null,
            pendingTargetKind: null,
            pendingTargetId: null,
            assignmentCommitTimer: 0,
            holdTimer: 0,
            castleCareX: null,
            castleCareZ: null,
            castleRouteSide: 0,
            roamAngle: homeIndex * 0.9
          }
        });
        ssIonianSetPatrolTarget(hospital, unit);
        hospital.nurseSpawnTimer = SS_IONIAN_NURSE_REPLACEMENT_DELAY;
        spawned = 1;
      }
    }

    if (spawned) ssSyncIonianTargets(hospital);
    return spawned;
  }


  // Phase 5E — Dorian Gregorian Monk Tower
  function ssIsDorianTower(device) {
    return !!device && device.typeId === "mode-dorian";
  }

  function ssDorianPrimaryDamage(device) {
    return SS_FULL_MODE_DAMAGE * Math.max(1, Number(device?.powerMultiplier || 1));
  }

  function ssConvertEnemyOnDorianKill(enemy, projectile) {
    if (!enemy) return;
    const owner = ssDeviceById(projectile?.ownerId);
    enemy.alive = true;
    enemy.deathState = null;
    enemy.deathTimer = 0;
    enemy.respawnTimer = 0;
    enemy.health = enemy.maxHealth;
    ssResetEnemyStatuses(enemy);
    ssConvertEnemy(enemy, projectile?.ownerId || null);
    ssMarkKillSpecialResolved(enemy, "dorian-convert", projectile?.ownerId || null);
    ssAddCombatEffect({
      ownerId: projectile?.ownerId || null,
      kind: "dorian-convert-burst",
      x: enemy.x,
      y: enemy.y + 0.75,
      z: enemy.z,
      radius: 1.1,
      duration: 0.65,
      color: "#2dd4bf",
      meta: {}
    });
    if (owner) owner.lastConvertedEnemyId = enemy.enemyId;
  }

  function ssFireDorianChant(device) {
    device = ssEnsureDeviceCombatState(device);
    if (!device || device.health <= 0 || !ssIsDorianTower(device)) return 0;

    device.detectionRadius = SS_FULL_MODE_DETECTION_RADIUS;
    device.actionCooldown = SS_FULL_MODE_ACTION_COOLDOWN;
    if (device.actionTimer > 0) return 0;

    const targets = ssAcquirePrimaryTargets(device, {
      maxTargets: SS_FULL_MODE_TARGET_LIMIT,
      range: SS_FULL_MODE_DETECTION_RADIUS,
      targetAllegiance: "enemy"
    });
    if (!targets.length) return 0;

    const letterIndex = Math.max(0, Number(device.dorianLetterIndex || 0)) % SS_DORIAN_LETTERS.length;
    const letter = SS_DORIAN_LETTERS[letterIndex];
    device.dorianLetterIndex = (letterIndex + 1) % SS_DORIAN_LETTERS.length;
    device.actionTimer = device.actionCooldown;

    const damage = ssDorianPrimaryDamage(device);
    const originY = Number(device.y || 0) + 0.22 + Number(device.height || 1.6) * 0.88;
    const spread = Math.max(0.18, Math.min(Number(device.baseWidth || 1.6), Number(device.baseDepth || 1.6)) * 0.17);

    targets.forEach((target, index) => {
      const angle = Number(device.yaw || 0) + (index / Math.max(1, targets.length)) * Math.PI * 2;
      ssSpawnProjectile({
        ownerId: device.placedId,
        ownerAllegiance: device.ownerAllegiance || "player",
        sourceKind: "dorian-letter",
        x: device.x + Math.cos(angle) * spread,
        y: originY + (index % 2) * 0.06,
        z: device.z + Math.sin(angle) * spread,
        targetId: target.enemyId,
        speed: SS_FULL_MODE_PROJECTILE_SPEED,
        damage,
        splashRadius: 0,
        color: "#f5e8a7",
        radius: 0.18,
        hitRadius: 0.30,
        life: 5,
        meta: { kind: "dorian-letter", mode: "Dorian", letter, letterIndex },
        onKill: (victim, projectile) => ssConvertEnemyOnDorianKill(victim, projectile)
      });
    });
    return targets.length;
  }


  // Phase 5F — Mixolydian Disco Tower
  function ssIsMixolydianTower(device) {
    return !!device && device.typeId === "mode-mixolydian";
  }

  function ssMixolydianPrimaryDamage(device) {
    return SS_FULL_MODE_DAMAGE * Math.max(1, Number(device?.powerMultiplier || 1));
  }

  function ssAcquireMixolydianTargets(device) {
    // The original fatal dancer is already excluded by the universal target
    // predicate. Secondary dancers remain valid targets while temporarily dancing.
    return ssAcquirePrimaryTargets(device, {
      maxTargets: SS_FULL_MODE_TARGET_LIMIT,
      range: SS_FULL_MODE_DETECTION_RADIUS,
      targetAllegiance: "enemy"
    });
  }

  function ssBeginMixolydianDeathDance(enemy, projectile) {
    if (!enemy) return;
    ssAudioPlay("mixolydian-dance", enemy.x, enemy.z, { variant:"mixolydian-disco", volume:0.88, maxDistance:58 });
    enemy.alive = true;
    enemy.deathState = null;
    enemy.deathTimer = 0;
    enemy.respawnTimer = 0;
    // Keep a token health value only so the actor can remain in the world for its
    // death-dance animation. It is already resolved/untargetable at this point.
    enemy.health = 1;
    enemy.targetType = "dance";
    enemy.targetId = null;
    enemy.attackTimer = 0;
    ssSetEnemyDancing(enemy, {
      sourceId: projectile?.ownerId || null,
      duration: SS_MIXOLYDIAN_PRIMARY_DANCE_DURATION,
      spreadRadius: SS_MIXOLYDIAN_DANCE_SPREAD_RADIUS,
      spreadDelay: SS_MIXOLYDIAN_DANCE_SPREAD_DELAY,
      contagious: true,
      fatalDance: true,
      secondaryDance: false
    });
  }

  function ssFireMixolydianVolley(device) {
    device = ssEnsureDeviceCombatState(device);
    if (!device || device.health <= 0 || !ssIsMixolydianTower(device)) return 0;

    device.detectionRadius = SS_FULL_MODE_DETECTION_RADIUS;
    device.actionCooldown = SS_FULL_MODE_ACTION_COOLDOWN;
    if (device.actionTimer > 0) return 0;

    const targets = ssAcquireMixolydianTargets(device);
    if (!targets.length) return 0;

    device.actionTimer = device.actionCooldown;
    const damage = ssMixolydianPrimaryDamage(device);
    const originY = Number(device.y || 0) + 0.22 + Number(device.height || 1.6) * 0.90;
    const spreadRadius = Math.max(0.18, Math.min(Number(device.baseWidth || 1.6), Number(device.baseDepth || 1.6)) * 0.19);

    targets.forEach((target, index) => {
      const angle = Number(device.yaw || 0) + (index / Math.max(1, targets.length)) * Math.PI * 2;
      ssSpawnProjectile({
        ownerId: device.placedId,
        ownerAllegiance: device.ownerAllegiance || "player",
        sourceKind: "mixolydian-disco",
        x: device.x + Math.cos(angle) * spreadRadius,
        y: originY + (index % 2) * 0.07,
        z: device.z + Math.sin(angle) * spreadRadius,
        targetId: target.enemyId,
        speed: SS_FULL_MODE_PROJECTILE_SPEED,
        damage,
        splashRadius: 0,
        color: "#f5d0fe",
        radius: 0.30,
        hitRadius: 0.34,
        life: 5,
        meta: { kind: "mixolydian-disco", mode: "Mixolydian" },
        onKill: (victim, projectile) => ssBeginMixolydianDeathDance(victim, projectile)
      });
    });
    return targets.length;
  }


  // Phase 5G — Aeolian Bullet Hell Tower
  function ssIsAeolianTower(device) {
    return !!device && device.typeId === "mode-aeolian";
  }

  function ssAeolianPrimaryDamage(device) {
    return SS_FULL_MODE_DAMAGE * Math.max(1, Number(device?.powerMultiplier || 1));
  }

  function ssAeolianElementForShot(device, shotIndex = 0) {
    const base = Math.max(0, Number(device?.aeolianElementIndex || 0));
    return SS_AEOLIAN_ELEMENTS[(base + shotIndex) % SS_AEOLIAN_ELEMENTS.length];
  }

  function ssTriggerAeolianKillBurst(enemy, projectile) {
    if (!enemy || !projectile) return;
    const element = projectile.meta?.element || "wind";
    const spec = SS_AEOLIAN_ELEMENTS.find(entry => entry.name === element) || SS_AEOLIAN_ELEMENTS[3];
    const x = enemy.x, z = enemy.z;
    ssAudioPlay("aeolian-burst", x, z, { variant:`aeolian:${element}`, volume:0.92, maxDistance:62 });
    ssAddCombatEffect({
      ownerId: projectile.ownerId,
      kind: "aeolian-kill-burst",
      x,
      y: enemy.y + 0.52,
      z,
      radius: SS_AEOLIAN_KILL_BURST_RADIUS,
      duration: 0.72,
      color: spec.color,
      meta: { element }
    });

    ssForEachNearbyLivingEnemy(x, z, SS_AEOLIAN_KILL_BURST_RADIUS + SS_PERF_MAX_ENEMY_RADIUS, "enemy", other => {
      if (other === enemy) return;
      const dx0 = other.x - x;
      const dz0 = other.z - z;
      const maxDistance = SS_AEOLIAN_KILL_BURST_RADIUS + Number(other.radius || 0);
      const distanceSq = dx0 * dx0 + dz0 * dz0;
      if (distanceSq > maxDistance * maxDistance) return;
      const distance = Math.sqrt(distanceSq);
      if (element === "fire") {
        ssApplyEnemyPoison(other, {
          sourceId: projectile.ownerId,
          dps: SS_AEOLIAN_FIRE_DPS,
          attackReduction: 0,
          duration: SS_AEOLIAN_FIRE_DURATION
        });
      } else if (element === "ice") {
        ssApplyEnemySlow(other, {
          sourceId: projectile.ownerId,
          factor: SS_AEOLIAN_ICE_SLOW_FACTOR,
          duration: SS_AEOLIAN_ICE_DURATION
        });
      } else if (element === "lightning") {
        other.statuses.stunRemaining = Math.max(
          Number(other.statuses.stunRemaining || 0),
          SS_AEOLIAN_LIGHTNING_STUN_DURATION
        );
      } else {
        let dx = dx0, dz = dz0, d = distance;
        if (d < 0.05) {
          const a = ((other.enemyId?.length || 1) * 1.73 + ssCombatClock) % (Math.PI * 2);
          dx = Math.sin(a); dz = Math.cos(a); d = 1;
        }
        const push = SS_AEOLIAN_WIND_KNOCKBACK * (1 - ssClamp(distance / SS_AEOLIAN_KILL_BURST_RADIUS, 0, 0.85));
        other.x = ssClamp(other.x + dx / d * push, -SS_WORLD_HALF + 1, SS_WORLD_HALF - 1);
        other.z = ssClamp(other.z + dz / d * push, -SS_WORLD_HALF + 1, SS_WORLD_HALF - 1);
        other.y = ssGroundHeight(other.x, other.z);
      }
    });
  }

  function ssFireAeolianVolley(device) {
    device = ssEnsureDeviceCombatState(device);
    if (!device || device.health <= 0 || !ssIsAeolianTower(device)) return 0;

    device.detectionRadius = SS_FULL_MODE_DETECTION_RADIUS;
    device.actionCooldown = SS_FULL_MODE_ACTION_COOLDOWN;
    if (device.actionTimer > 0) return 0;

    const targets = ssAcquirePrimaryTargets(device, {
      maxTargets: SS_FULL_MODE_TARGET_LIMIT,
      range: SS_FULL_MODE_DETECTION_RADIUS,
      targetAllegiance: "enemy"
    });
    if (!targets.length) return 0;

    device.actionTimer = device.actionCooldown;
    const damage = ssAeolianPrimaryDamage(device);
    const originY = Number(device.y || 0) + 0.24 + Number(device.height || 1.6) * 0.78;
    const muzzleRadius = Math.max(0.34, Math.min(Number(device.baseWidth || 1.6), Number(device.baseDepth || 1.6)) * 0.31);

    targets.forEach((target, index) => {

  function ssTriggerLocrianPanicKill(enemy, unit, device) {
    if (!enemy || !device) return;
    ssAudioPlay("locrian-panic", enemy.x, enemy.z, { variant:"locrian-panic", volume:0.94, maxDistance:64 });
    enemy.alive = true;
    enemy.deathState = null;
    enemy.deathTimer = 0;
    enemy.respawnTimer = 0;
    enemy.health = Math.max(1, enemy.maxHealth * SS_LOCRIAN_PANIC_SURVIVAL_HEALTH_FRACTION);
    enemy.statuses.fleeing = true;
    enemy.targetType = "flee";
    enemy.targetId = null;
    enemy.attackTimer = 0;
    ssMarkKillSpecialResolved(enemy, "locrian-panic", device.placedId);

    const panicSecondaries = [];
    const panicDistances = [];
    ssForEachNearbyLivingEnemy(enemy.x, enemy.z, SS_LOCRIAN_PANIC_RADIUS + SS_PERF_MAX_ENEMY_RADIUS, "enemy", other => {
      if (other === enemy || other.statuses?.fleeing || other.killSpecialResolved) return;
      const dx = other.x - enemy.x;
      const dz = other.z - enemy.z;
      const distanceSq = dx * dx + dz * dz;
      const maxDistance = SS_LOCRIAN_PANIC_RADIUS + Number(other.radius || 0);
      if (distanceSq > maxDistance * maxDistance) return;
      let insertAt = panicDistances.length;
      while (insertAt > 0 && distanceSq < panicDistances[insertAt - 1]) insertAt -= 1;
      panicDistances.splice(insertAt, 0, distanceSq);
      panicSecondaries.splice(insertAt, 0, other);
      if (panicSecondaries.length > SS_LOCRIAN_MASS_PANIC_MAX_SECONDARY) {
        panicSecondaries.pop();
        panicDistances.pop();
      }
    });
    for (const other of panicSecondaries) {
      other.statuses.fleeing = true;
      other.targetType = "flee";
      other.targetId = null;
      other.attackTimer = 0;
      ssMarkKillSpecialResolved(other, "locrian-mass-panic", device.placedId);
    }

    ssAddCombatEffect({
      ownerId: device.placedId,
      kind: "locrian-mass-panic",
      x: enemy.x,
      y: enemy.y + 0.72,
      z: enemy.z,
      radius: SS_LOCRIAN_PANIC_RADIUS,
      duration: 0.85,
      color: "#d8b4fe",
      meta: {}
    });
  }

  function ssFindLocrianRetarget(unit) {
    const owner = ssDeviceById(unit?.ownerId);
    if (!owner || owner.health <= 0) return null;
    return ssNearestLivingEnemy(

      "enemy",

  function ssUpdateLocrianGhost(unit, dt) {
    if (!unit || !unit.alive) return;
    const device = ssDeviceById(unit.ownerId);
    if (!device || device.health <= 0) { unit.alive = false; return; }

    let target = ssEnemyById(unit.targetId);
    if (!target || target.allegiance !== "enemy" || !ssEnemyCanBePrimaryTowerTarget(target)) {
      target = ssFindLocrianRetarget(unit);
      unit.targetId = target?.enemyId || null;
      if (!target) { unit.alive = false; return; }
    }

    const dx = target.x - unit.x;
    const dz = target.z - unit.z;
    const distance = Math.hypot(dx, dz);
    if (distance <= SS_LOCRIAN_GHOST_HIT_RADIUS + target.radius) {
      ssAudioPlay("projectile-impact", target.x, target.z, { variant:"locrian-ghost", cooldownGroup:"locrian-ghost", volume:0.82 });
      const result = ssApplyEnemyDamage(target, Number(unit.meta.damage || SS_FULL_MODE_DAMAGE), {
        sourceId: device.placedId,
        sourceKind: "locrian-ghost"
      });
      if (result.killed) ssTriggerLocrianPanicKill(target, unit, device);
      unit.alive = false;
      return;
    }

    if (distance > 0.001) {
      const step = Math.min(SS_FULL_MODE_PROJECTILE_SPEED * dt, distance);
      ssMoveCharacterWithBuildingCollision(unit, dx / distance * step, dz / distance * step, Math.max(0.08, Number(unit.radius || 0.34)));
      unit.facing = Math.atan2(dx / distance, -(dz / distance));
    }
    unit.y = ssGroundCreatureSupportHeight(unit.x, unit.z, Math.max(0.34, Number(unit.radius || 0.34))) + 0.72
      + Math.sin(unit.age * 8.0 + Number(unit.meta.phase || 0)) * 0.12;
  }

    const z = release.z;
    const dx = target.x - x;
    const dz = target.z - z;
    const distance = Math.hypot(dx, dz) || 1;
    return ssRegisterSpawnedUnit({
      ownerId: device.placedId,
      ownerAllegiance: device.ownerAllegiance || "player",
      kind: "locrian-ghost",
      x,
      y: ssGroundCreatureSupportHeight(x, z, 0.34) + 0.82,
      z,
      health: 1,
      maxHealth: 1,
      radius: 0.34,
      speed: SS_FULL_MODE_PROJECTILE_SPEED,
      facing: Math.atan2(dx / distance, -(dz / distance)),
      targetId: target.enemyId,
      attackable: false,
      meta: {
        phase: index * 0.77 + ssCombatClock,
        damage: ssLocrianPrimaryDamage(device)

      update: ssUpdateLocrianGhost

    return SS_MENDING_LANTERN_REPAIR_PER_PULSE * Math.max(1, Number(device?.powerMultiplier || 1));
  }

  function ssMendingCastleCandidate(device, range) {
    if (!device) return null;
    const health = Number(ssCastleCombat.health || 0);
    const maxHealth = Math.max(1, Number(ssCastleCombat.maxHealth || SS_CASTLE_BASE_HEALTH));
    if (health <= 0 || health >= maxHealth - 0.01) return null;
    const gap = ssCharacterGapToCastle(Number(device.x || 0), Number(device.z || 0), 0);
    if (gap > range) return null;
    return { target: { placedId: "castle", x: 0, z: 0, isCastleTarget: true }, d2: gap * gap };
  }

  function ssMendingLanternTargets(device) {
    if (!device) return [];
    const range2 = SS_MENDING_LANTERN_DETECTION_RADIUS * SS_MENDING_LANTERN_DETECTION_RADIUS;
    const candidates = [];
    const castleCandidate = ssMendingCastleCandidate(device, SS_MENDING_LANTERN_DETECTION_RADIUS);
    if (castleCandidate) candidates.push(castleCandidate);
    for (const target of ssPlacedDevices) {
      if (!target || target === device) continue;
      ssEnsureDeviceCombatState(target);
      if (target.health <= 0 || !(Number(target.health) < Number(target.maxHealth))) continue;
      const dx = Number(target.x || 0) - Number(device.x || 0);
      const dz = Number(target.z || 0) - Number(device.z || 0);
      const d2 = dx*dx + dz*dz;
      if (d2 > range2) continue;
      candidates.push({ target, d2 });
    }
    candidates.sort((a,b) => a.d2 - b.d2);
    return candidates.slice(0, SS_MENDING_LANTERN_TARGET_LIMIT).map(entry => entry.target);
  }
