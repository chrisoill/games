<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Grand Slam - Piano Arcade</title>

  <style>
  @font-face {
    font-family: "Bravura";
    src: url("https://cdn.jsdelivr.net/gh/steinbergmedia/bravura@master/redist/woff/Bravura.woff2") format("woff2");
    font-style: normal;
    font-weight: normal;
    font-display: swap;
  }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      font-family: Arial, sans-serif;
      touch-action: pan-y;
      overscroll-behavior-y: auto;
    }

    #appFrame {
      width: 100%;
      aspect-ratio: 390 / 670;
      position: relative;
      overflow: hidden;
      background: #202020;
    }

    #appStage {
      width: 390px;
      height: 670px;
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: top left;
      transform: scale(var(--app-scale, 1));
      overflow: hidden;
      background: linear-gradient(180deg, #2f2f2f, #191919);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: pan-y;
      overscroll-behavior-y: auto;
      color: white;
    }

    #appStage *:not(input):not(textarea) {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
    }

    button {
      font-family: Arial, sans-serif;
      touch-action: none;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #appFrame,
    #menuScreen,
    #screen,
    #controls {
      touch-action: pan-y;
      overscroll-behavior-y: auto;
    }

    button,
    .joystickPad {
      touch-action: none;
    }

    input,
    select {
      font-size: 16px;
      padding: 8px;
      border-radius: 10px;
      border: 2px solid #111;
      box-sizing: border-box;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       PLAYER MENU
       ========================= */

    #menuScreen {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #2f2f2f, #191919);
      padding: 13px 16px 14px;
      overflow: visible;
      text-align: center;
      z-index: 20;
      touch-action: pan-y;
    }

    #menuScreen h1 {
      margin: 4px 0 9px;
      font-size: 28px;
    }

    #leaderboardBox {
      margin: 0 auto 9px;
      padding: 9px;
      background: rgba(255,255,255,0.1);
      border-radius: 14px;
      max-width: 350px;
    }

    #leaderboardBox h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    #leaderboardList {
      text-align: left;
      max-width: 230px;
      margin: 0 auto;
      font-size: 15px;
    }

    #playerPickerBox {
      margin: 0 auto 9px;
      padding: 9px;
      background: rgba(255,255,255,0.08);
      border-radius: 14px;
      max-width: 350px;
    }

    #playerSearchInput {
      width: 100%;
      margin-bottom: 8px;
    }

    #playerSelect {
      width: 100%;
      height: 120px;
      background: #f8fbff;
      color: #111827;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border: 2px solid #111;
      border-radius: 10px;
      text-align: left;
    }

    .playerOption {
      padding: 10px;
      border-bottom: 1px solid rgba(17,24,39,0.12);
      font-size: 16px;
      line-height: 1.2;
      background: #f8fbff;
      color: #111827;
    }

    .playerOption:last-child {
      border-bottom: 0;
    }

    .playerOption.selected {
      background: #ffe08a;
      font-weight: bold;
    }

    .playerOption.disabled {
      color: rgba(17,24,39,0.55);
      text-align: center;
      font-style: italic;
    }

    #selectedPlayerActions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 7px;
    }

    #selectedPlayerActions button,
    #addPlayerBtn,
    #startGameBtn,
    #exitPageBtn {
      min-height: 38px;
      border-radius: 12px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
    }

    #resetSelectedPlayerBtn {
      background: #fff3bf;
    }

    #removeSelectedPlayerBtn {
      background: #ffd6d6;
    }

    #addPlayerRow {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
      margin: 0 auto 8px;
      max-width: 350px;
    }

    #newPlayerName {
      width: 100%;
    }

    #selectedPlayerText {
      margin: 7px 0;
      font-size: 15px;
      opacity: 0.9;
    }

    #startGameBtn {
      background: #dff3ff;
      min-width: 150px;
    }

    #exitPageBtn {
      min-width: 110px;
    }

    /* =========================
       GAME / EMULATOR
       ========================= */

    #gameScreen {
      position: absolute;
      inset: 0;
      display: none;
      background: linear-gradient(180deg, #2f2f2f, #191919);
      z-index: 10;
      touch-action: pan-y;
      overscroll-behavior-y: auto;
    }

    #screen {
      position: absolute;
      left: 0;
      top: 0;
      width: 390px;
      height: 281.667px;
      overflow: hidden;
      background: #0b1420;
      border: 1px solid #2b2b2b;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.05),
        0 1px 3px rgba(0,0,0,0.45);
    }

    #gameCanvas {
      width: 390px;
      height: 281.667px;
      display: block;
      touch-action: pan-y;
      overscroll-behavior-y: auto;
      background: #071426;
      image-rendering: auto;
    }

    #gameOverBox {
      display: none;
      position: absolute;
      left: 34px;
      right: 34px;
      top: 50%;
      transform: translateY(-50%);
      padding: 18px 12px;
      background: rgba(6, 20, 38, 0.96);
      border: 3px solid #d7ad4a;
      border-radius: 16px;
      color: white;
      text-align: center;
      z-index: 8;
    }

    #gameOverBox h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    #gameOverScore {
      margin: 0 0 10px;
      font-size: 15px;
    }

    #gameOverBox button {
      border: 2px solid #111;
      border-radius: 12px;
      background: white;
      color: #111827;
      padding: 8px 12px;
      margin: 3px;
      font-size: 12px;
      font-weight: bold;
    }

    #lcd {
      position: absolute;
      left: 0;
      top: 281.667px;
      width: 390px;
      height: 48px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02)),
        #17251c;
      border-top: 3px solid #0c0c0c;
      border-bottom: 3px solid #0c0c0c;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.04),
        inset 0 0 14px rgba(0,0,0,0.35);
      color: #b7ff9e;
      font-family: "Courier New", monospace;
      text-shadow: 0 0 7px rgba(183,255,158,0.35);
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: 1fr 1fr;
      align-items: center;
      padding: 5px 16px;
      pointer-events: none;
    }

    #lcdMessage {
      grid-column: 1 / 3;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #lcdScore {
      font-size: 12px;
    }

    #lcdBest {
      font-size: 13px;
      text-align: right;
    }

    #controls {
      position: absolute;
      left: 0;
      top: 329.667px;
      width: 390px;
      height: 340.333px;
      background: #242424;
      touch-action: pan-y;
      overscroll-behavior-y: auto;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    #controls *,
    #screen,
    #gameCanvas {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* D-PAD */

    #dpad {
      position: absolute;
      left: 17px;
      top: 19px;
      width: 150px;
      height: 150px;
      touch-action: manipulation;
    }

    .dpadBtn {
      position: absolute;
      width: 50px;
      height: 50px;
      border: none;
      background: #111;
      color: rgba(255,255,255,0.86);
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 22px;
      line-height: 50px;
      text-align: center;
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.08),
        0 7px 13px rgba(0,0,0,0.45);
    }

    .dpadBtn.pressed,
    .dpadBtn:active {
      filter: brightness(1.35);
      transform: scale(0.94);
    }

    #dpadUp { left: 50px; top: 0; border-radius: 10px 10px 3px 3px; }
    #dpadLeft { left: 0; top: 50px; border-radius: 10px 3px 3px 10px; }
    #dpadCenter { left: 50px; top: 50px; border-radius: 4px; pointer-events: none; }
    #dpadRight { left: 100px; top: 50px; border-radius: 3px 10px 10px 3px; }
    #dpadDown { left: 50px; top: 100px; border-radius: 3px 3px 10px 10px; }

    /* FACE BUTTONS */

    #faceButtons {
      position: absolute;
      right: 18px;
      top: 20px;
      width: 150px;
      height: 150px;
    }

    .faceBtn {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 20px;
      font-weight: bold;
      background: radial-gradient(circle at 30% 30%, #ff82ad, #9d003d);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.15),
        0 10px 18px rgba(0,0,0,0.45);
    }

    .faceBtn.pressed,
    .faceBtn:active {
      transform: scale(0.92);
      filter: brightness(1.2);
    }

    #buttonX { left: 46px; top: 0; }
    #buttonY { left: 0; top: 46px; }
    #buttonA { left: 92px; top: 46px; }
    #buttonB { left: 46px; top: 92px; }

    /* JOYSTICKS */

    .joystickPad {
      position: absolute;
      width: 112px;
      height: 112px;
      border-radius: 18px;
      background: rgba(255,255,255,0.035);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.07);
      touch-action: none;
    }

    #leftJoystickPad {
      left: 36px;
      top: 188px;
    }

    #rightJoystickPad {
      right: 37px;
      top: 188px;
    }

    .joystickBase {
      position: absolute;
      left: 11px;
      top: 11px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, #3f3f3f, #161616);
      box-shadow:
        inset 0 0 0 3px rgba(255,255,255,0.08),
        0 9px 18px rgba(0,0,0,0.45);
      pointer-events: none;
    }

    .joystickKnob {
      position: absolute;
      left: 56px;
      top: 56px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #777, #202020);
      transform: translate(-50%, -50%);
      box-shadow: 0 8px 18px rgba(0,0,0,0.55);
      pointer-events: none;
    }



    /* A-G LETTER CONTROLS — SHARED */

    #letterButtons {
      position: absolute;
      left: 22px;
      right: 22px;
      top: 40px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(2, 86px);
      gap: 16px 8px;
      align-items: stretch;
    }

    .letterBtn {
      grid-column: span 2;
      border: none;
      border-radius: 18px;
      background: linear-gradient(180deg, #f8fbff, #dce9f6);
      color: #111827;
      font-size: 31px;
      font-weight: bold;
      box-shadow:
        inset 0 0 0 3px rgba(17,24,39,0.16),
        0 8px 14px rgba(0,0,0,0.38);
    }

    #letterE { grid-column: 2 / span 2; }
    #letterF { grid-column: 4 / span 2; }
    #letterG { grid-column: 6 / span 2; }

    .letterBtn.pressed,
    .letterBtn:active {
      transform: translateY(3px) scale(0.97);
      filter: brightness(0.92);
      box-shadow:
        inset 0 0 0 3px rgba(17,24,39,0.22),
        0 3px 7px rgba(0,0,0,0.32);
    }

    #controls.letterControlMode #systemButtons {
      top: 268px;
    }

    /* START / SELECT */

    #systemButtons {
      position: absolute;
      left: 50%;
      top: 326px;
      width: 164px;
      height: 34px;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .systemBtn {
      width: 76px;
      height: 32px;
      border-radius: 999px;
      border: none;
      background: #101010;
      color: rgba(255,255,255,0.78);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.12);
    }

    .systemBtn.pressed,
    .systemBtn:active {
      transform: scale(0.96);
      filter: brightness(1.2);
    }

    #faceButtons.singleFace .faceBtn.singleAction {
      width: 76px;
      height: 76px;
      left: 37px !important;
      top: 37px !important;
      border-radius: 22px;
      padding: 0 8px;
      font-size: 14px;
      line-height: 1.05;
      white-space: normal;
    }

    #systemButtons,
    #systemButtons.singleSystem {
      width: 92px;
    }

    #systemButtons.singleSystem .systemBtn {
      width: 92px;
    }

    /* =========================
       EXPANDABLE SHELL MENU
       ========================= */

    #shellMenu {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 60;
      background: rgba(0,0,0,0.62);
      padding: 22px 14px;
      color: white;
    }

    #shellMenu.open {
      display: block;
    }

    #shellMenuPanel {
      width: 100%;
      max-height: 100%;
      overflow: hidden;
      background: #101827;
      border: 3px solid white;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.45);
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    #shellMenuHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 12px 7px;
    }

    #shellMenuHeader h2 {
      margin: 0;
      font-size: 22px;
    }

    #shellMenuCloseBtn {
      width: 40px;
      height: 36px;
      padding: 0;
      border-radius: 12px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 26px;
      font-weight: bold;
      line-height: 1;
    }

    #shellMenuTabs {
      display: flex;
      gap: 7px;
      padding: 0 12px 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .shellMenuTab {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 7px 11px;
      border-radius: 999px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
    }

    .shellMenuTab.active {
      background: #ffe08a;
    }

    #shellMenuBody {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 14px 14px;
      text-align: left;
      font-size: 15px;
      line-height: 1.38;
      touch-action: pan-y;
    }

    .pauseMenuActions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
      margin-top: 12px;
    }

    .pauseActionBtn {
      min-height: 42px;
      border-radius: 12px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
    }

    .pauseActionBtn.saveExit {
      background: #dff3ff;
    }

    .pauseActionBtn.noSaveExit {
      background: #ffd6d6;
    }

    .pauseActionBtn.resumeGame {
      background: #fff3bf;
    }

    #shellMenuBody h3 {
      margin: 4px 0 8px;
      font-size: 20px;
    }

    #shellMenuBody ul {
      margin-top: 8px;
      padding-left: 21px;
    }

    #shellMenuBody code {
      background: rgba(255,255,255,0.12);
      padding: 2px 5px;
      border-radius: 6px;
    }

  </style>
</head>

<body>
  <main id="appFrame">
    <section id="appStage">
      <div id="menuScreen">
        <h1>Grand Slam</h1>

        <div id="leaderboardBox">
          <h2>Leaderboard</h2>
          <ol id="leaderboardList"></ol>
        </div>

        <div id="playerPickerBox">
          <input id="playerSearchInput" placeholder="Search players..." autocomplete="off" />
          <div id="playerSelect" role="listbox" aria-label="Choose player"></div>

          <div id="selectedPlayerActions">
            <button id="resetSelectedPlayerBtn">Reset</button>
            <button id="removeSelectedPlayerBtn">Remove</button>
          </div>
        </div>

        <div id="addPlayerRow">
          <input id="newPlayerName" placeholder="New player name" />
          <button id="addPlayerBtn">Add Player</button>
        </div>

        <p id="selectedPlayerText">No player selected</p>
        <button id="startGameBtn">Start Game</button>
      </div>

      <div id="gameScreen">
        <div id="screen">
          <canvas id="gameCanvas" width="720" height="520"></canvas>

          <div id="gameOverBox">
            <h1>Game Over</h1>
            <p id="gameOverScore"></p>
            <button id="playAgainBtn">Play Again</button>
            <button id="backToMenuBtn">Player Menu</button>
          </div>
        </div>

        <div id="lcd">
          <div id="lcdMessage">SWING</div>
          <div id="lcdScore">SCORE: <span id="score">0</span></div>
          <div id="lcdBest">BEST: <span id="bestScore">0</span></div>
        </div>

        <div id="controls" class="letterControlMode">


          <div id="letterButtons" aria-label="Letter controls">
            <button id="letterA" class="letterBtn" data-action="a" aria-label="A">A</button>
            <button id="letterB" class="letterBtn" data-action="b" aria-label="B">B</button>
            <button id="letterC" class="letterBtn" data-action="c" aria-label="C">C</button>
            <button id="letterD" class="letterBtn" data-action="d" aria-label="D">D</button>
            <button id="letterE" class="letterBtn" data-action="e" aria-label="E">E</button>
            <button id="letterF" class="letterBtn" data-action="f" aria-label="F">F</button>
            <button id="letterG" class="letterBtn" data-action="g" aria-label="G">G</button>
          </div>

          <div id="dpad">
            <button id="dpadUp" class="dpadBtn" data-action="up">▲</button>
            <button id="dpadLeft" class="dpadBtn" data-action="left">◄</button>
            <button id="dpadCenter" class="dpadBtn"></button>
            <button id="dpadRight" class="dpadBtn" data-action="right">►</button>
            <button id="dpadDown" class="dpadBtn" data-action="down">▼</button>
          </div>

          <div id="faceButtons">
            <button id="buttonX" class="faceBtn" data-action="x">X</button>
            <button id="buttonY" class="faceBtn" data-action="y">Y</button>
            <button id="buttonA" class="faceBtn" data-action="a">A</button>
            <button id="buttonB" class="faceBtn" data-action="b">B</button>
          </div>

          <div id="leftJoystickPad" class="joystickPad" data-stick="left">
            <div class="joystickBase"></div>
            <div id="leftJoystickKnob" class="joystickKnob"></div>
          </div>

          <div id="rightJoystickPad" class="joystickPad" data-stick="right">
            <div class="joystickBase"></div>
            <div id="rightJoystickKnob" class="joystickKnob"></div>
          </div>

          <div id="systemButtons">
            <button id="selectButton" class="systemBtn" data-action="select">SELECT</button>
            <button id="startButton" class="systemBtn" data-action="start">START</button>
          </div>
        </div>
      </div>

      <div id="shellMenu" aria-hidden="true">
        <div id="shellMenuPanel" role="dialog" aria-modal="true" aria-label="Pause panel">
          <div id="shellMenuHeader">
            <h2>Pause</h2>
            <button id="shellMenuCloseBtn" type="button" aria-label="Close panel">×</button>
          </div>
          <div id="shellMenuTabs" role="tablist" aria-label="Pause panel tabs"></div>
          <div id="shellMenuBody"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const DESIGN_WIDTH = 390;
    const DESIGN_HEIGHT = 670;
    const GAME_CANVAS_LOGICAL_WIDTH = 720;
    const GAME_CANVAS_LOGICAL_HEIGHT = 520;
    const GAME_CANVAS_DISPLAY_WIDTH = 390;
    const GAME_CANVAS_DISPLAY_HEIGHT =
      GAME_CANVAS_DISPLAY_WIDTH * GAME_CANVAS_LOGICAL_HEIGHT / GAME_CANVAS_LOGICAL_WIDTH;
    const MAX_GAME_CANVAS_PIXEL_SCALE = 4;

    /*
      Change STORAGE_KEY for each separate arcade game if you want each game
      to keep its own local player list/leaderboard.
      Example: "meloMemoPlayers_v1", "staffSurvivorPlayers_v1", etc.
    */
    const STORAGE_KEY = "grandSlamPlayers_v1";
    const STORAGE_MESSAGE_SOURCE = "PianoArcadeShell";
    const WIX_STORAGE_MESSAGE_SOURCE = "PianoArcadeWixStorage";
    const SCORE_LABEL = "Score";
    const FIRST_TIME_HELP_DEFAULT_VERSION = "grandSlamStep1Rules_v1";
    let firstTimeHelpVersion = FIRST_TIME_HELP_DEFAULT_VERSION;

    const appFrame = document.getElementById("appFrame");
    const appStage = document.getElementById("appStage");

    const menuScreen = document.getElementById("menuScreen");
    const gameScreen = document.getElementById("gameScreen");

    const leaderboardList = document.getElementById("leaderboardList");
    const playerSearchInput = document.getElementById("playerSearchInput");
    const playerSelect = document.getElementById("playerSelect");
    playerSelect.addEventListener("touchmove", event => event.stopPropagation(), { passive: true });
    const resetSelectedPlayerBtn = document.getElementById("resetSelectedPlayerBtn");
    const removeSelectedPlayerBtn = document.getElementById("removeSelectedPlayerBtn");
    const newPlayerName = document.getElementById("newPlayerName");

    function scaleGameCanvasBackingStore() {
      canvas.style.width = GAME_CANVAS_DISPLAY_WIDTH + "px";
      canvas.style.height = GAME_CANVAS_DISPLAY_HEIGHT + "px";

      const rect = canvas.getBoundingClientRect();
      const cssWidth = Math.max(1, rect.width || GAME_CANVAS_DISPLAY_WIDTH * appScale);
      const cssHeight = Math.max(1, rect.height || GAME_CANVAS_DISPLAY_HEIGHT * appScale);
      const dpr = Math.max(1, window.devicePixelRatio || 1);

      const scaleX = (cssWidth / GAME_CANVAS_LOGICAL_WIDTH) * dpr;
      const scaleY = (cssHeight / GAME_CANVAS_LOGICAL_HEIGHT) * dpr;
      const targetScale = Math.min(
        MAX_GAME_CANVAS_PIXEL_SCALE,
        Math.max(1, scaleX, scaleY)
      );

      const targetWidth = Math.max(1, Math.round(GAME_CANVAS_LOGICAL_WIDTH * targetScale));
      const targetHeight = Math.max(1, Math.round(GAME_CANVAS_LOGICAL_HEIGHT * targetScale));

      if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
        canvas.width = targetWidth;
        canvas.height = targetHeight;
      }

      gameCanvasPixelScale = targetWidth / GAME_CANVAS_LOGICAL_WIDTH;
      ctx.setTransform(gameCanvasPixelScale, 0, 0, gameCanvasPixelScale, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.webkitImageSmoothingEnabled = true;
      ctx.mozImageSmoothingEnabled = true;
      ctx.msImageSmoothingEnabled = true;
    }

    function resetGameCanvasTransform() {
      ctx.setTransform(gameCanvasPixelScale, 0, 0, gameCanvasPixelScale, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.webkitImageSmoothingEnabled = true;
      ctx.mozImageSmoothingEnabled = true;
      ctx.msImageSmoothingEnabled = true;
    }

    function getGameCanvasSize() {
      return {
        width: GAME_CANVAS_LOGICAL_WIDTH,
        height: GAME_CANVAS_LOGICAL_HEIGHT,
        pixelScale: gameCanvasPixelScale
      };
    }

    let activeShellMenuTab = "pause";

    function isEditableArcadeTarget(target) {
      return target instanceof Element && !!target.closest(
        'input, textarea, select, [contenteditable=""], [contenteditable="true"]'
      );
    }

    function preventBrowserHoldGesture(event) {
      if (isEditableArcadeTarget(event.target)) return;
      event.preventDefault();
    }

    appStage.addEventListener("contextmenu", preventBrowserHoldGesture);
    appStage.addEventListener("selectstart", preventBrowserHoldGesture);
    appStage.addEventListener("dragstart", preventBrowserHoldGesture);

    function isLiveArcadeControlTarget(target) {
      return target instanceof Element && !!target.closest(
        '#controls button[data-action], #controls .joystickPad, [data-arcade-touch-control="true"]'
      );

    /*
      iOS/WebKit workaround for the tap -> second-tap-and-hold loupe.
      Cancel touchstart only on actual live controls so rapid A-G / MENU input
      belongs to the game, while canvas/LCD/controller-background drags remain
      available for normal vertical page scrolling.
    */
    gameScreen.addEventListener("touchstart", event => {
      if (!running) return;
      if (isEditableArcadeTarget(event.target)) return;
      if (!isLiveArcadeControlTarget(event.target)) return;
      event.preventDefault();
    }, { passive: false, capture: true });

    gameScreen.addEventListener("dblclick", event => {
      if (!running) return;

    function renderShellMenuTabs(activeId = activeShellMenuTab) {
      const fallbackTab = shellMenuTabs[0]?.id || "";
      activeShellMenuTab = shellMenuTabs.some(tab => tab.id === activeId) ? activeId : fallbackTab;

      shellMenuTabsEl.innerHTML = "";
      shellMenuBody.innerHTML = "";

      shellMenuTabs.forEach(tab => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "shellMenuTab" + (tab.id === activeShellMenuTab ? " active" : "");
        btn.textContent = tab.label;
        btn.setAttribute("role", "tab");
        btn.setAttribute("aria-selected", tab.id === activeShellMenuTab ? "true" : "false");
        btn.addEventListener("click", () => renderShellMenuTabs(tab.id));
        shellMenuTabsEl.appendChild(btn);
      });

      const activeTab = shellMenuTabs.find(tab => tab.id === activeShellMenuTab);
      if (activeTab) shellMenuBody.innerHTML = activeTab.html;
    }

    function registerShellMenuTab(id, label, htmlContent) {
      const tabId = String(id || "").trim();
      if (!tabId) return;

      const existing = shellMenuTabs.find(tab => tab.id === tabId);
      const tabData = {
        id: tabId,
        label: String(label || tabId),
        html: String(htmlContent || "")
      };

      if (existing) {
        existing.label = tabData.label;
        existing.html = tabData.html;
      } else {
        shellMenuTabs.push(tabData);
      }

      renderShellMenuTabs(activeShellMenuTab);
    }

    function updateShellMenuTab(id, htmlContent) {
      const existing = shellMenuTabs.find(tab => tab.id === id);
      if (!existing) return;
      existing.html = String(htmlContent || "");
      renderShellMenuTabs(activeShellMenuTab);
    }

    function openShellMenu(tabId = "controls") {
      shellMenuWasRunning = running;

      if (running) {
        running = false;
        if (loopId) {
          cancelAnimationFrame(loopId);
          loopId = null;
        }
      }

      renderShellMenuTabs(tabId);
      shellMenu.classList.add("open");
      shellMenu.setAttribute("aria-hidden", "false");
    }

    function closeShellMenu(options = {}) {
      const shouldResume = options.resume !== false;
      shellMenu.classList.remove("open");
      shellMenu.setAttribute("aria-hidden", "true");

      if (
        shouldResume &&
        shellMenuWasRunning &&
        gameScreen.style.display === "block" &&
        gameOverBox.style.display !== "block"
      ) {
        running = true;
        loop();
      }

      shellMenuWasRunning = false;
    }

    function setFirstTimeHelpVersion(version) {
      const cleanVersion = String(version || "").trim();
      if (cleanVersion) firstTimeHelpVersion = cleanVersion;

    function ensureSelectedPlayerRecord() {
      if (!selectedPlayer) return null;

      if (!players[selectedPlayer] || typeof players[selectedPlayer] !== "object") {
        players[selectedPlayer] = { best: 0 };
      }

      if (!Number.isFinite(Number(players[selectedPlayer].best))) {
        players[selectedPlayer].best = 0;
      }

      return players[selectedPlayer];
    }

    function isGuestPlayerName(name = selectedPlayer) {
      return String(name || "").trim().toLowerCase() === "guest";
    }

    function shouldShowFirstTimeHelp() {
      // Guest is a shared/new-visitor account, so it should open How to Play every time.
      if (isGuestPlayerName()) return true;

      const playerData = ensureSelectedPlayerRecord();
      if (!playerData) return false;
      return playerData.helpSeenVersion !== firstTimeHelpVersion;
    }

    function markFirstTimeHelpSeen() {
      // Do not mark Guest as done. The next Guest player should still see How to Play.
      if (isGuestPlayerName()) return;

      const playerData = ensureSelectedPlayerRecord();
      if (!playerData) return;
      playerData.helpSeenVersion = firstTimeHelpVersion;
      savePlayers();
    }

    function maybeOpenFirstTimeHelp() {
      if (!shouldShowFirstTimeHelp()) return;
      markFirstTimeHelpSeen();
      openShellMenu("instructions");
    }

    /*
      DEFAULT MOBILE EMULATOR CONTROLS
      Keep the template's full controller visible by default. Some games may only
      need one joystick/button, but do that inside the individual game module with
      MobileArcadeShell.configureControls({...}) instead of changing the template.

      Example future game-specific override:
      MobileArcadeShell.configureControls({
        showDpad: false,
        showLeftJoystick: true,
        showRightJoystick: false,
        faceButtons: ["a"],
        systemButtons: ["start"],
        labels: { a: "REEL", start: "MENU" }
      });
    */
    const defaultMobileControlConfig = {
      showDpad: true,
      showLeftJoystick: true,
      showRightJoystick: true,
      faceButtons: ["a", "b", "x", "y"],
      systemButtons: ["select", "start"],
      labels: {
        a: "A",
        b: "B",
        x: "X",
        y: "Y",
        select: "SELECT",
        start: "START"
      }
    };

    function setVisible(element, visible) {
      if (!element) return;
      element.classList.toggle("hidden", !visible);
    }

    function configureMobileControls(options = {}) {
      const config = {
        ...defaultMobileControlConfig,
        ...options,
        labels: {
          ...defaultMobileControlConfig.labels,
          ...(options.labels || {})
        }
      };

      const visibleFaceButtons = new Set((config.faceButtons || []).map(action => String(action).toLowerCase()));
      const visibleSystemButtons = new Set((config.systemButtons || []).map(action => String(action).toLowerCase()));

      setVisible(dpad, config.showDpad !== false);
      setVisible(leftJoystickPad, config.showLeftJoystick !== false);
      setVisible(rightJoystickPad, config.showRightJoystick === true);

      const faceButtonMap = {
        a: document.getElementById("buttonA"),
        b: document.getElementById("buttonB"),
        x: document.getElementById("buttonX"),
        y: document.getElementById("buttonY")
      };

      Object.entries(faceButtonMap).forEach(([action, button]) => {
        if (!button) return;
        const isVisible = visibleFaceButtons.has(action);
        setVisible(button, isVisible);
        button.textContent = config.labels[action] || action.toUpperCase();
        button.classList.toggle("singleAction", isVisible && visibleFaceButtons.size === 1);
      });

      if (faceButtons) {
        setVisible(faceButtons, visibleFaceButtons.size > 0);
        faceButtons.classList.toggle("singleFace", visibleFaceButtons.size === 1);
      }

      const systemButtonMap = {
        select: document.getElementById("selectButton"),
        start: document.getElementById("startButton")
      };

      Object.entries(systemButtonMap).forEach(([action, button]) => {
        if (!button) return;
        const isVisible = visibleSystemButtons.has(action);
        setVisible(button, isVisible);
        button.textContent = config.labels[action] || action.toUpperCase();
      });

      if (systemButtons) {
        systemButtons.classList.toggle("singleSystem", visibleSystemButtons.size === 1);
      }

      resetJoystick(sticks.left);
      resetJoystick(sticks.right);
    }

    function saveCurrentScoreForSelectedPlayer() {
      if (!selectedPlayer) return;

      if (!players[selectedPlayer]) {
        players[selectedPlayer] = { best: 0 };
      }

      if (score > (players[selectedPlayer].best || 0)) {
        players[selectedPlayer].best = score;
      }

      savePlayers();
      renderLeaderboard();
      bestScoreEl.textContent = players[selectedPlayer].best || 0;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function scaleAppToFrame() {
      const frameWidth = Math.max(1, appFrame.clientWidth || window.innerWidth || DESIGN_WIDTH);
      appScale = frameWidth / DESIGN_WIDTH;
      document.documentElement.style.setProperty("--app-scale", appScale);
      scaleGameCanvasBackingStore();

    function setMessage(text) {

    function getSavePayload() {
      return {
        v: 1,
        selectedPlayer,
        players
      };
    }

    function cleanPlayers(rawPlayers) {
      const cleaned = {};

      Object.entries(rawPlayers || {}).forEach(([name, data]) => {
        const cleanName = String(name || "").trim();
        if (!cleanName) return;

        const isObjectData = data && typeof data === "object" && !Array.isArray(data);
        const best = isObjectData
          ? Number(data.best || 0)
          : Number(data || 0);

        cleaned[cleanName] = {
          ...(isObjectData ? data : {}),
          best: Math.max(0, Math.floor(best || 0))
        };
      });

      return cleaned;
    }

    function normalizeSavedData(savedData) {
      /*
        Supports both:
        1. New format: { v: 1, selectedPlayer: "Chris", players: { ... } }
        2. Old format: { "Chris": { best: 100, lastScore: 80 }, ... }
        Either way, this template stores only each player's best score.
      */
      if (!savedData || typeof savedData !== "object") {
        return { players: {}, selectedPlayer: null };
      }

      if (
        savedData.players &&
        typeof savedData.players === "object" &&
        !Array.isArray(savedData.players)
      ) {
        return {
          players: cleanPlayers(savedData.players),
          selectedPlayer: savedData.selectedPlayer || null
        };
      }

      return {
        players: cleanPlayers(savedData),
        selectedPlayer: null
      };
    }

    function applySavedData(savedData) {
      const normalized = normalizeSavedData(savedData);

      players = normalized.players || {};
      selectedPlayer = normalized.selectedPlayer || selectedPlayer || null;

      if (selectedPlayer && !players[selectedPlayer]) {
        selectedPlayer = null;
      }

      renderPlayers();
      renderLeaderboard();
    }

    function loadPlayersFromLocalStorage() {
      try {
        const savedText = localStorage.getItem(STORAGE_KEY);
        const savedData = savedText ? JSON.parse(savedText) : {};
        applySavedData(savedData);
      } catch (err) {
        players = {};
        selectedPlayer = null;
        renderPlayers();
        renderLeaderboard();
      }
    }

    function sendStorageMessageToWix(type, payload = {}) {
      if (!window.parent || window.parent === window) {
        return false;
      }

      window.parent.postMessage({
        source: STORAGE_MESSAGE_SOURCE,
        type,
        storageKey: STORAGE_KEY,
        ...payload
      }, "*");

      return true;
    }

    function loadPlayers() {
      wixStorageAnswered = false;
      const askedWixParent = sendStorageMessageToWix("ARCADE_STORAGE_LOAD");

      /*
        In Wix on iPhone Safari, the parent page should answer and provide
        Wix/Velo local storage. Outside Wix, or if the Velo bridge is not added,
        this fallback keeps the old desktop/localStorage behavior working.
      */
      if (askedWixParent) {
        setTimeout(() => {
          if (!wixStorageAnswered) {
            loadPlayersFromLocalStorage();
          }
        }, 600);
      } else {
        loadPlayersFromLocalStorage();
      }
    }

    function savePlayers() {
      const payload = getSavePayload();

      /*
        Keep the original browser localStorage path for desktop/non-Wix tests.
        On iPhone Safari inside Wix, this may not persist, so we also send
        the same payload to the Wix parent page.
      */
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (err) {}

      sendStorageMessageToWix("ARCADE_STORAGE_SAVE", { payload });
    }

    window.addEventListener("message", event => {
      const data = event.data;

      if (!data || typeof data !== "object") return;
      if (data.source !== WIX_STORAGE_MESSAGE_SOURCE) return;
      if (data.storageKey !== STORAGE_KEY) return;

      if (data.type === "ARCADE_STORAGE_DATA") {
        wixStorageAnswered = true;
        applySavedData(data.payload || {});
      }
    });

    function renderLeaderboard() {
      leaderboardList.innerHTML = "";

      const ranked = Object.entries(players)
        .sort((a, b) => (b[1].best || 0) - (a[1].best || 0))
        .slice(0, 5);

      if (ranked.length === 0) {
        leaderboardList.innerHTML = "<li>No scores yet</li>";
        return;
      }

      ranked.forEach(([name, data]) => {
        const li = document.createElement("li");
        li.textContent = `${name}: ${data.best || 0}`;
        leaderboardList.appendChild(li);
      });
    }

    function resetRemoveConfirmButton() {
      removeSelectedPlayerBtn.dataset.confirming = "no";
      removeSelectedPlayerBtn.textContent = "Remove";
      removeSelectedPlayerBtn.style.background = "";
    }

    function updateSelectedPlayerUI() {
      const hasSelection = selectedPlayer && players[selectedPlayer];

      selectedPlayerText.textContent = hasSelection
        ? `Selected: ${selectedPlayer} — Best: ${players[selectedPlayer].best || 0}`
        : "No player selected";

      resetSelectedPlayerBtn.disabled = !hasSelection;
      removeSelectedPlayerBtn.disabled = !hasSelection;
    }

    function renderPlayers() {
      playerSelect.innerHTML = "";

      const filter = playerSearchInput.value.trim().toLowerCase();

      const names = Object.keys(players).sort((a, b) => {
        return a.localeCompare(b, undefined, { sensitivity: "base" });
      });

      const filteredNames = names.filter(name => name.toLowerCase().includes(filter));

      if (filteredNames.length === 0) {
        const emptyRow = document.createElement("div");
        emptyRow.className = "playerOption disabled";
        emptyRow.textContent = names.length === 0 ? "No saved players yet" : "No matching players";
        playerSelect.appendChild(emptyRow);
      } else {
        filteredNames.forEach(name => {
          const row = document.createElement("div");
          row.className = "playerOption" + (name === selectedPlayer ? " selected" : "");
          row.dataset.playerName = name;
          row.setAttribute("role", "option");
          row.setAttribute("aria-selected", name === selectedPlayer ? "true" : "false");
          row.textContent = `${name} — Best: ${players[name].best || 0}`;

          row.addEventListener("click", () => {
            selectedPlayer = name;
            resetRemoveConfirmButton();
            savePlayers();
            renderPlayers();
          });

          row.addEventListener("touchend", event => {
            event.preventDefault();
            selectedPlayer = name;
            resetRemoveConfirmButton();
            savePlayers();
            renderPlayers();
          }, { passive: false });

          playerSelect.appendChild(row);
        });
      }

      updateSelectedPlayerUI();
    }

    playerSearchInput.addEventListener("input", () => {
      resetRemoveConfirmButton();
      renderPlayers();
    });

    // Player rows are handled directly inside renderPlayers().

    resetSelectedPlayerBtn.onclick = () => {
      if (!selectedPlayer || !players[selectedPlayer]) return;

      players[selectedPlayer].best = 0;

      savePlayers();
      resetRemoveConfirmButton();
      renderPlayers();
      renderLeaderboard();
    };

    removeSelectedPlayerBtn.onclick = () => {
      if (!selectedPlayer || !players[selectedPlayer]) return;

      const nameToRemove = selectedPlayer;

      if (removeSelectedPlayerBtn.dataset.confirming !== "yes") {
        removeSelectedPlayerBtn.dataset.confirming = "yes";
        removeSelectedPlayerBtn.textContent = "Confirm";
        removeSelectedPlayerBtn.style.background = "#ff9f9f";

        setTimeout(() => {
          if (
            removeSelectedPlayerBtn.dataset.confirming === "yes" &&
            selectedPlayer === nameToRemove
          ) {
            resetRemoveConfirmButton();
          }
        }, 2500);

        return;
      }

      delete players[nameToRemove];
      selectedPlayer = null;

      savePlayers();
      resetRemoveConfirmButton();
      renderPlayers();
      renderLeaderboard();
    };

    addPlayerBtn.onclick = () => {
      const name = newPlayerName.value.trim();
      if (!name) return;

      if (!players[name]) {
        players[name] = { best: 0 };
      }

      selectedPlayer = name;
      newPlayerName.value = "";
      playerSearchInput.value = "";

      savePlayers();
      resetRemoveConfirmButton();
      renderPlayers();
      renderLeaderboard();
      soundWin();

    newPlayerName.addEventListener("keydown", e => {
      if (e.key === "Enter") {

    startGameBtn.onclick = () => {
      closeShellMenu({ resume: false });

      if (!selectedPlayer) {

      menuScreen.style.display = "none";
      gameScreen.style.display = "block";

    playAgainBtn.onclick = () => {

    backToMenuBtn.onclick = () => {

      gameScreen.style.display = "none";
      menuScreen.style.display = "block";
      resetRemoveConfirmButton();
      renderPlayers();
      renderLeaderboard();
    };

    function joystickPointFromClient(clientX, clientY, stick) {
      const rect = stick.pad.getBoundingClientRect();

      return {
        x: (clientX - rect.left) / appScale,
        y: (clientY - rect.top) / appScale

      const dy = limitedY - centerY;

      stick.x = dx / stick.maxDistance;
      stick.y = dy / stick.maxDistance;

      stick.knob.style.left = `${centerX + dx}px`;
      stick.knob.style.top = `${centerY + dy}px`;

        if (event.pointerType === "touch") return;

  function crowdMotionAt(x, y) {
    const compact = GAME_CANVAS_LOGICAL_WIDTH <= 400;
    const width = GAME_CANVAS_LOGICAL_WIDTH;

    let offsetY = 0;
    let cheer = 0;

        const section = Math.max(0, Math.min(5, Math.floor((x / Math.max(1, width)) * 6)));
        const delay = section * 0.055;
        const local = (event.elapsed - delay) / Math.max(0.01, event.duration - delay);
        if (local >= 0 && local <= 1) {
          const pulse = Math.abs(Math.sin(local * Math.PI * 2.15)) * (1 - local * 0.58);
          offsetY -= pulse * (compact ? 2.2 : 4.4);

        const distance = Math.abs(x - event.originX) / Math.max(1, width);

        const local = (event.elapsed - delay) / Math.max(0.01, event.duration - delay);

        const p = clamp01(event.elapsed / event.duration);
        const remaining = 1 - p;
        const phase = x * 0.11 + y * 0.07;
        offsetX += Math.sin(event.elapsed * 25 + phase) * remaining * (compact ? 0.75 : 1.45);
        offsetY += Math.abs(Math.sin(event.elapsed * 15 + phase * 0.7)) * remaining * (compact ? 1.0 : 2.0);
        recoil = Math.max(recoil, remaining * 0.75);
      }
    }

    return { x: offsetX, y: offsetY, cheer, recoil };

function lerpValue(start, end, amount) {

  function quadraticPoint(start, control, end, amount) {
    const t = clamp01(amount);

    return {

      y: inverse * inverse * start.y + 2 * inverse * t * control.y + t * t * end.y

  function quadraticArcLength(start, control, end, segments = 48) {
    let length = 0;
    let previous = start;
    for (let index = 1; index <= segments; index++) {
      const point = quadraticPoint(start, control, end, index / segments);
      length += Math.hypot(point.x - previous.x, point.y - previous.y);
      previous = point;
    }

  function quadraticPointAtArcProgress(start, control, end, progress, segments = 48) {
    const targetProgress = clamp01(progress);
    if (targetProgress <= 0) return { x: start.x, y: start.y };
    if (targetProgress >= 1) return { x: end.x, y: end.y };

    const totalLength = quadraticArcLength(start, control, end, segments);
    const targetDistance = totalLength * targetProgress;
    let travelled = 0;
    let previous = start;

    for (let index = 1; index <= segments; index++) {
      const point = quadraticPoint(start, control, end, index / segments);
      const segmentLength = Math.hypot(point.x - previous.x, point.y - previous.y);
      if (travelled + segmentLength >= targetDistance) {
        const remaining = targetDistance - travelled;
        const amount = segmentLength > 0 ? remaining / segmentLength : 0;
        return {
          x: lerpValue(previous.x, point.x, amount),
          y: lerpValue(previous.y, point.y, amount)
        };
      }
      travelled += segmentLength;
      previous = point;
    }

    return { x: end.x, y: end.y };

  function chooseSafeFallLanding(target, standTop, standBottom) {
    const compact = GAME_CANVAS_LOGICAL_WIDTH <= 400;
    const maxAttempts = 40;
    const width = GAME_CANVAS_LOGICAL_WIDTH;
    const panelTop = TREBLE_STAFF_TOP - STAFF_GAP * (compact ? 1.55 : 1.8);
    const yMin = standTop + target.h * 0.62;
    const yMax = Math.min(standBottom - target.h * 0.5, panelTop - target.h * 0.65);
    const fifteenDegrees = Math.PI / 12;

    const landingMinY = Math.min(yMin, yMax);
    const landingRange = Math.max(0, yMax - landingMinY);
    let best = { x: target.x, y: yMax };
    let bestClearance = -Infinity;
    for (let attempt = 0; attempt < maxAttempts; attempt++) {
      const y = landingMinY + Math.random() * landingRange;
      const verticalDrop = Math.max(1, y - target.y);
      const maxHorizontal = Math.max(1.5, Math.tan(fifteenDegrees) * verticalDrop);
      const candidate = {
        x: Math.max(
          target.w * 0.7,
          Math.min(width - target.w * 0.7, target.x + (Math.random() - 0.5) * maxHorizontal * 2)
        ),
        y
      };

      let blocked = false;
      let clearance = Infinity;
      for (const other of stadiumTargets) {
        if (other.id === target.id || other.damaged) continue;
        const padX = other.w * 0.7 + target.w * 0.62;
        const padY = other.h * 0.7 + target.h * 0.62;
        const nx = Math.abs(candidate.x - other.x) / Math.max(1, padX);
        const ny = Math.abs(candidate.y - other.y) / Math.max(1, padY);
        clearance = Math.min(clearance, Math.max(nx, ny));
        if (nx < 1 && ny < 1) {
          blocked = true;
          break;
        }
      }
      if (!blocked) return candidate;
      if (clearance > bestClearance) {
        bestClearance = clearance;
        best = candidate;
      }
    }
    return best;
  }

      + 3 * inverse * t * t * p2

    const maxAngle = Math.PI / 12;

    for (let i = 0; i < count; i++) {
      const x0 = i * sliceWidth;
      const x1 = (i + 1) * sliceWidth;
      const xm = (x0 + x1) * 0.5;
      const top0 = collapseDomeTopY(x0);
      const top1 = collapseDomeTopY(x1);
      const topMid = collapseDomeTopY(xm) + (Math.random() - 0.5) * (compact ? 2.4 : 4.2);
      const centerX = xm;
      const centerY = (standTop + Math.min(top0, top1, topMid)) * 0.5;
      const targetY = Math.min(
        panelTop - (compact ? 5 : 8),
        standTop + (compact ? 21 : 35) + Math.random() * (compact ? 6 : 10)
      );
      const verticalDrop = Math.max(1, targetY - centerY);
      const maxDx = Math.tan(maxAngle) * verticalDrop;
      const localPoints = [
        { x: x0 - centerX, y: standTop - centerY },
        { x: x0 - centerX, y: top0 - centerY },
        { x: xm - centerX, y: topMid - centerY },
        { x: x1 - centerX, y: top1 - centerY },
        { x: x1 - centerX, y: standTop - centerY }
      ];
      const crackCount = compact ? 2 : 3;
      const cracks = [];
      for (let c = 0; c < crackCount; c++) {
        const startX = (Math.random() - 0.5) * sliceWidth * 0.55;
        const startY = -Math.abs(standTop - centerY) * (0.28 + Math.random() * 0.35);
        cracks.push([
          { x: startX, y: startY },
          { x: startX + (Math.random() - 0.5) * sliceWidth * 0.18, y: startY + (compact ? 8 : 13) },
          { x: startX + (Math.random() - 0.5) * sliceWidth * 0.28, y: startY + (compact ? 17 : 28) }
        ]);
      }
      pieces.push({
        centerX,
        centerY,
        targetX: centerX + (Math.random() - 0.5) * maxDx * 2,
        targetY,
        localPoints,
        cracks,
        delay: 0.20 + (i % 3) * 0.055 + Math.random() * 0.08,
        fallDuration: 0.92 + Math.random() * 0.30,
        rotation: 0,
        finalRotation: (Math.random() - 0.5) * 0.48,
        shade: Math.random()
      });
    }
    return pieces;
  }

  function buildCollapseDustClouds() {
    const compact = GAME_CANVAS_LOGICAL_WIDTH <= 400;
    const width = GAME_CANVAS_LOGICAL_WIDTH;
    const height = GAME_CANVAS_LOGICAL_HEIGHT;
    const standTop = compact ? height * 0.27 : height * 0.255;
    const count = compact ? 9 : 15;
    const clouds = [];
    for (let i = 0; i < count; i++) {
      clouds.push({
        x: width * (0.06 + Math.random() * 0.88),
        y: standTop - (compact ? 2 : 4) + (Math.random() - 0.5) * (compact ? 7 : 12),
        delay: 0.24 + Math.random() * 0.58,
        duration: 0.78 + Math.random() * 0.58,
        radius: (compact ? 9 : 16) * (0.7 + Math.random() * 1.1),
        driftX: (Math.random() - 0.5) * (compact ? 16 : 28),
        lift: compact ? 8 + Math.random() * 8 : 13 + Math.random() * 15
      });
    }
    return clouds;
  }

  function rotateOffset(x, y, angle) {
    const cosine = Math.cos(angle);
    const sine = Math.sin(angle);
    return {
      x: x * cosine - y * sine,
      y: x * sine + y * cosine
    };
  }

  function getCurrentStadiumTargetPose(target) {
    const age = target.impactAge;
    if (!target.damaged) return { x: target.x, y: target.y, rotation: 0 };

    if (target.damageMode === "dangling") {
      const geom = getTargetSupportGeometry(target);
      const settleDuration = target.kind === "billboard" ? 0.72 : 0.24;
      const settle = smoothStep(clamp01(age / settleDuration));
      const oscillation = Math.sin(age * 2.65 + target.swingPhase) * target.swingAmplitude * settle;

      if (geom.type === "pole") {
        const angle = target.side * 0.08 * settle + oscillation;
        const drop = target.h * 0.12 * settle;
        const offset = rotateOffset(0, target.h * 0.56 + drop, angle);
        return { x: geom.x + offset.x, y: geom.topY + offset.y, rotation: angle };
      }

      if (geom.type === "double-string") {
        const keepSide = target.swingKeepSide || 1;
        const keptX = keepSide < 0 ? geom.leftX : geom.rightX;
        const angle = -keepSide * 1.36 * settle + oscillation * 0.32;
        const offset = rotateOffset(-keepSide * target.w * 0.32, target.h * 0.52, angle);
        return { x: keptX + offset.x, y: geom.topY + offset.y, rotation: angle };
      }

      if (geom.type === "single-string") {
        const angle = target.side * 0.10 * settle + oscillation;
        const offset = rotateOffset(0, target.h * 0.52, angle);
        return { x: geom.x + offset.x, y: geom.topY + offset.y, rotation: angle };
      }
    }

    if (target.damageMode === "fallen") {
      const raw = clamp01(age / Math.max(0.01, target.fallDuration));
      if (target.kind === "banner") {
        const p = smoothStep(raw);
        const x = lerpValue(target.x, target.fallX, p)
          + Math.sin(Math.PI * p) * target.side * target.w * 0.025;
        const y = lerpValue(target.y, target.fallY, p)
          - Math.sin(Math.PI * p) * target.h * 0.22;
        return { x, y, rotation: target.fallRotation * p };
      }
      const fallP = raw * raw;
      return {
        x: lerpValue(target.x, target.fallX, fallP),
        y: lerpValue(target.y, target.fallY, fallP),
        rotation: target.fallRotation * raw
      };
    }

    const jolt = age < 0.45
      ? Math.sin(age * 72) * Math.exp(-age * 8) * (GAME_CANVAS_LOGICAL_WIDTH <= 400 ? 3 : 6)
      : 0;
    return { x: target.x + jolt * target.side, y: target.y, rotation: 0 };
  }

  function buildCollapseFallingObjects() {
    const compact = GAME_CANVAS_LOGICAL_WIDTH <= 400;
    const width = GAME_CANVAS_LOGICAL_WIDTH;
    const height = GAME_CANVAS_LOGICAL_HEIGHT;
    const standTop = compact ? height * 0.27 : height * 0.255;
    const panelTop = TREBLE_STAFF_TOP - STAFF_GAP * (compact ? 1.55 : 1.8);
    const landingYBase = Math.min(panelTop - 10, standTop + (compact ? 26 : 42));
    const fifteenDegrees = Math.PI / 12;
    const objects = [];

    function addFallingObject(object) {
      const targetY = Math.min(
        panelTop - object.h * 0.55,
        Math.max(object.y + (compact ? 10 : 16), object.targetY)
      );
      const verticalDrop = Math.max(1, targetY - object.y);
      const maxHorizontal = Math.tan(fifteenDegrees) * verticalDrop;
      objects.push({
        ...object,
        targetX: Math.max(
          object.w * 0.6,
          Math.min(width - object.w * 0.6, object.x + (Math.random() - 0.5) * maxHorizontal * 2)
        ),
        targetY
      });
    }

    function addSupport(x, y, length, thickness, rotation = 0, supportType = 'metal') {
      if (length <= 1) return;
      addFallingObject({
        kind: 'support',
        supportType,
        x,
        y,
        w: Math.max(1, thickness),
        h: length,
        targetY: landingYBase + (Math.random() - 0.5) * (compact ? 5 : 8),
        rot: rotation,
        finalRot: rotation + (Math.random() - 0.5) * 0.55
      });
    }

    const scoreboardW = compact ? 78 : 136;
    const scoreboardH = compact ? 18 : 34;
    const scoreboardStart = { x: width * 0.5, y: 42 + scoreboardH * 0.5, rotation: 0 };
    addFallingObject({
      kind: 'scoreboard',
      x: scoreboardStart.x,
      y: scoreboardStart.y,
      w: scoreboardW,
      h: scoreboardH,
      targetY: landingYBase,
      rot: scoreboardStart.rotation,
      finalRot: scoreboardStart.rotation + (Math.random() - 0.5) * 0.55
    });
    const scoreAnchorY = stadiumSupportAnchorY(width * 0.5);
    const scoreTopY = 42;
    const scoreCableLength = Math.abs(scoreTopY - scoreAnchorY);
    addSupport(width * 0.5 - scoreboardW * 0.32, (scoreTopY + scoreAnchorY) * 0.5, scoreCableLength, compact ? 1 : 1.5, 0, 'cable');
    addSupport(width * 0.5 + scoreboardW * 0.32, (scoreTopY + scoreAnchorY) * 0.5, scoreCableLength, compact ? 1 : 1.5, 0, 'cable');

    for (const target of stadiumTargets) {
      const pose = getCurrentStadiumTargetPose(target);
      addFallingObject({
        ...target,
        x: pose.x,
        y: pose.y,
        targetY: landingYBase + (Math.random() - 0.5) * (compact ? 5 : 8),
        rot: pose.rotation,
        finalRot: pose.rotation + (target.kind === 'banner'
          ? (Math.random() - 0.5) * 0.75
          : (Math.random() - 0.5) * 0.48)
      });

      const geom = getTargetSupportGeometry(target);
      if (geom.type === 'double-string') {
        const length = Math.abs(geom.topY - geom.anchorY);
        addSupport(geom.leftX, (geom.topY + geom.anchorY) * 0.5, length, compact ? 1 : 1.5, 0, 'cable');
        addSupport(geom.rightX, (geom.topY + geom.anchorY) * 0.5, length, compact ? 1 : 1.5, 0, 'cable');
      } else if (geom.type === 'single-string') {
        const length = Math.abs(geom.topY - geom.anchorY);
        addSupport(geom.x, (geom.topY + geom.anchorY) * 0.5, length, compact ? 1 : 1.5, 0, 'cable');
      } else if (geom.type === 'pole') {
        const length = Math.abs(geom.bottomY - geom.topY);
        addSupport(geom.x, (geom.bottomY + geom.topY) * 0.5, length, compact ? 2 : 3.2, 0, 'metal');
      }
    }
    return objects;
  }

  function startCollapseSequence() {
    if (collapseState.active || collapseState.ruined) return;
    collapseState = {
      active: true,
      ruined: false,
      elapsed: 0,
      duration: 2.45,
      debris: buildCollapseDebris(),
      fallingObjects: buildCollapseFallingObjects(),
      domePieces: buildCollapseDomePieces(),
      dustClouds: buildCollapseDustClouds()
    };
    activeNotes = [];
    animationState.pitcher.active = false;
    triggerCollapseVisualReaction();
    sfxDomeCrumble();
    setGameFeedback("CRASH!", "damage", 1800);
  }

  function updateCollapseState(deltaSeconds) {
    if (!collapseState.active) return;
    collapseState.elapsed += deltaSeconds;
    if (collapseState.elapsed >= collapseState.duration) {
      collapseState.elapsed = collapseState.duration;
      collapseState.active = false;
      collapseState.ruined = true;
      endGame("Stadium destroyed!", { preserveScene: true });
    }
  }

  function collapseShakeOffset() {
    if (!collapseState.active) return { x: 0, y: 0 };
    const p = clamp01(collapseState.elapsed / collapseState.duration);
    const strength = (GAME_CANVAS_LOGICAL_WIDTH <= 400 ? 2.2 : 5.2) * (1 - p * 0.55);
    return {
      x: Math.sin(collapseState.elapsed * 74) * strength,
      y: Math.sin(collapseState.elapsed * 101 + 0.8) * strength * 0.62
    };
  }

  function drawBillboardGlitchLocal(target) {
    const age = target.impactAge;
    const tick = Math.floor(age * 18);
    const pulse = Math.sin(age * 37 + target.damageSeed) * 0.5 + 0.5;
    const hardGlitch = ((tick + Math.floor(target.damageSeed)) % 7) < 3;
    const w = target.w;
    const h = target.h;

    ctx.save();
    ctx.globalAlpha = 0.30 + pulse * 0.46;
    if (hardGlitch) {
      const offset = Math.sin((tick + 1) * 12.9898 + target.damageSeed) * w * 0.055;
      ctx.fillStyle = target.side < 0 ? "rgba(84,220,255,0.68)" : "rgba(255,96,83,0.68)";
      ctx.fillRect(-w * 0.46 + offset, -h * 0.25, w * 0.74, Math.max(1.5, h * 0.16));
      ctx.fillStyle = "rgba(240,248,255,0.66)";
      ctx.fillRect(-w * 0.28 - offset * 0.7, h * 0.02, w * 0.62, Math.max(1, h * 0.10));
      ctx.fillStyle = "rgba(6,10,16,0.92)";
      ctx.fillRect(-w * 0.12 + offset * 0.35, h * 0.22, w * 0.46, Math.max(1, h * 0.12));
    }
    if (((tick + 2) % 11) < 2) {
      ctx.globalAlpha = 0.64;
      ctx.fillStyle = "rgba(2,5,9,0.92)";
      ctx.fillRect(-w * 0.48, -h * 0.42, w * 0.96, h * 0.84);
    }
    ctx.restore();
  }

  function drawDetachedTargetBody(target) {
    const w = target.w;
    const h = target.h;
    const accent = target.side < 0 ? "#65c7ef" : "#f47b63";
    ctx.save();
    ctx.lineJoin = "round";
    ctx.lineCap = "round";

    if (target.kind === "billboard") {
      roundedRectPath(-w * 0.5, -h * 0.5, w, h, Math.max(2, h * 0.18));
      ctx.fillStyle = "rgba(7,18,30,0.98)";
      ctx.fill();
      ctx.strokeStyle = accent;
      ctx.lineWidth = Math.max(1, h * 0.07);
      ctx.stroke();
      ctx.fillStyle = accent;
      ctx.globalAlpha = 0.62;
      ctx.fillRect(-w * 0.38, -h * 0.18, w * 0.72, h * 0.14);
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#e9f5fb";
      ctx.font = `900 ${Math.max(4, h * 0.27)}px Arial, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(target.side < 0 ? "FRANK'S" : "GUS'S", 0, h * 0.12);
      drawBillboardGlitchLocal(target);
    } else if (target.kind === "speaker") {
      roundedRectPath(-w * 0.5, -h * 0.5, w, h, Math.max(2, w * 0.14));
      ctx.fillStyle = "#101923";
      ctx.fill();
      ctx.strokeStyle = "#82a8c7";
      ctx.lineWidth = Math.max(1, w * 0.07);
      ctx.stroke();
      ctx.fillStyle = "#05080c";
      ctx.beginPath();
      ctx.arc(0, -h * 0.16, w * 0.16, 0, Math.PI * 2);
      ctx.arc(0, h * 0.20, w * 0.30, 0, Math.PI * 2);
      ctx.fill();
    } else if (target.kind === "floodlight") {
      roundedRectPath(-w * 0.5, -h * 0.5, w, h, Math.max(2, w * 0.10));
      ctx.fillStyle = "#465667";
      ctx.fill();
      ctx.strokeStyle = "#7f97ad";
      ctx.lineWidth = Math.max(1, w * 0.06);
      ctx.stroke();
      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 2; col++) {
          const lx = (col - 0.5) * w * 0.42;
          const ly = (row - 1) * h * 0.27;
          ctx.fillStyle = (row + col) % 3 === 0 ? "#181d24" : "#ffe4a0";
          ctx.fillRect(lx - w * 0.13, ly - h * 0.09, w * 0.26, h * 0.18);
        }
      }
    } else if (target.kind === "banner") {
      ctx.beginPath();
      ctx.moveTo(-w * 0.5, -h * 0.5);
      ctx.lineTo(w * 0.5, -h * 0.5);
      ctx.lineTo(w * 0.34, h * 0.16);
      ctx.lineTo(w * 0.06, h * 0.5);
      ctx.lineTo(-w * 0.12, h * 0.16);
      ctx.lineTo(-w * 0.42, h * 0.42);
      ctx.closePath();
      ctx.fillStyle = target.side < 0 ? "#356fa5" : "#3f8b60";
      ctx.fill();
      ctx.strokeStyle = "rgba(238,245,250,0.75)";
      ctx.lineWidth = Math.max(0.8, w * 0.07);
      ctx.stroke();
      ctx.fillStyle = target.side < 0 ? "#f4eee2" : "#f2cc58";
      ctx.fillRect(-w * 0.48, -h * 0.10, w * 0.82, h * 0.22);
    } else if (target.kind === "cart") {
      ctx.fillStyle = accent;
      ctx.fillRect(-w * 0.48, -h * 0.20, w * 0.96, h * 0.46);
      ctx.fillStyle = "#f4e3bb";
      ctx.fillRect(-w * 0.42, -h * 0.46, w * 0.84, h * 0.18);
      ctx.strokeStyle = "#4d2d1c";
      ctx.lineWidth = Math.max(1, h * 0.08);
      ctx.beginPath();
      ctx.moveTo(-w * 0.38, -h * 0.22);
      ctx.lineTo(w * 0.30, h * 0.20);
      ctx.stroke();
      ctx.fillStyle = "#15191e";
      ctx.beginPath();
      ctx.arc(-w * 0.30, h * 0.42, h * 0.16, 0, Math.PI * 2);
      ctx.arc(w * 0.34, h * 0.42, h * 0.16, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.strokeStyle = "rgba(12,16,22,0.94)";
    ctx.lineWidth = Math.max(1, Math.min(w, h) * 0.07);
    ctx.beginPath();
    ctx.moveTo(-w * 0.30, -h * 0.32);
    ctx.lineTo(-w * 0.06, -h * 0.03);
    ctx.lineTo(-w * 0.20, h * 0.31);
    ctx.moveTo(-w * 0.06, -h * 0.03);
    ctx.lineTo(w * 0.24, h * 0.12);
    ctx.stroke();
    ctx.restore();
  }

  function stadiumSupportAnchorY(x) {
    const compact = GAME_CANVAS_LOGICAL_WIDTH <= 400;
    const domePeakY = compact ? 8 : 10;
    const width = GAME_CANVAS_LOGICAL_WIDTH;
    const norm = Math.abs(x - width * 0.5) / (width * 0.5);
    return domePeakY + (compact ? 14 : 18) + norm * (compact ? 6 : 10);
  }

  function getTargetSupportGeometry(target) {
    const compact = GAME_CANVAS_LOGICAL_WIDTH <= 400;
    const standTop = GAME_CANVAS_LOGICAL_HEIGHT * (compact ? 0.325 : 0.255);
    if (target.kind === "billboard") {
      const topY = target.y - target.h * 0.52;
      return {
        type: "double-string",
        topY,
        leftX: target.x - target.w * 0.32,
        rightX: target.x + target.w * 0.32,
        anchorY: stadiumSupportAnchorY(target.x)
      };
    }
    if (target.kind === "banner") {
      const topY = target.y - target.h * 0.52;
      return {
        type: "single-string",
        topY,
        x: target.x,
        anchorY: stadiumSupportAnchorY(target.x) - (compact ? 2 : 4)
      };
    }
    if (target.kind === "speaker") {
      return {
        type: "pole",
        x: target.x,
        topY: target.y - target.h * 0.52,
        bottomY: standTop
      };
    }
    if (target.kind === "floodlight") {
      return {
        type: "pole",
        x: target.x,
        topY: target.y - target.h * 0.48,
        bottomY: standTop
      };
    }
    return { type: "none" };
  }

  function drawSupportRemnant(target, geom) {
    ctx.save();
    ctx.strokeStyle = "rgba(185,199,211,0.84)";
    ctx.lineWidth = geom.type === "double-string" || geom.type === "single-string"
      ? Math.max(0.85, target.h * 0.038)
      : Math.max(1, target.w * 0.045);
    ctx.lineCap = "round";
    if (geom.type === "double-string") {
      ctx.beginPath();
      ctx.moveTo(geom.leftX, geom.anchorY);
      ctx.lineTo(geom.leftX, geom.topY);
      ctx.moveTo(geom.rightX, geom.anchorY);
      ctx.lineTo(geom.rightX, geom.topY);
      ctx.stroke();
    } else if (geom.type === "single-string") {
      ctx.beginPath();
      ctx.moveTo(geom.x, geom.anchorY);
      ctx.lineTo(geom.x, geom.topY);
      ctx.stroke();
    } else if (geom.type === "pole") {
      ctx.beginPath();
      ctx.moveTo(geom.x, geom.topY + target.h * 0.05);
      ctx.lineTo(geom.x, geom.bottomY);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawDetachedDamagedTarget(target) {
    const age = target.impactAge;
    const geom = getTargetSupportGeometry(target);
    if (target.damageMode === "dangling") {
      const settleDuration = target.kind === "billboard" ? 0.72 : 0.24;
      const settle = smoothStep(clamp01(age / settleDuration));
      const oscillation = Math.sin(age * 2.65 + target.swingPhase) * target.swingAmplitude * settle;
      ctx.save();
      ctx.strokeStyle = "rgba(185,199,211,0.84)";
      ctx.lineWidth = geom.type === "double-string" || geom.type === "single-string"
        ? Math.max(0.85, target.h * 0.038)
        : Math.max(1, target.w * 0.045);
      ctx.lineCap = "round";

      if (geom.type === "pole") {
        const anchorX = geom.x;
        const anchorY = geom.topY;
        const localAttach = { x: 0, y: -target.h * 0.56 };
        const baseLean = target.side * 0.08;
        const angle = baseLean * settle + oscillation;
        const drop = target.h * 0.12 * settle;
        ctx.beginPath();
        ctx.moveTo(geom.x, geom.bottomY);
        ctx.lineTo(anchorX, anchorY);
        ctx.stroke();
        ctx.translate(anchorX, anchorY);
        ctx.rotate(angle);
        ctx.translate(-localAttach.x, -localAttach.y + drop);
        drawDetachedTargetBody(target);
        ctx.restore();
        return;
      }

      if (geom.type === "double-string") {
        const keepSide = target.swingKeepSide || 1;
        const keptX = keepSide < 0 ? geom.leftX : geom.rightX;
        const lostX = keepSide < 0 ? geom.rightX : geom.leftX;
        const pivotY = geom.topY;
        const localAttach = { x: keepSide * target.w * 0.32, y: -target.h * 0.52 };
        const baseLean = -keepSide * 1.36;
        const angle = baseLean * settle + oscillation * 0.32;
        ctx.beginPath();
        ctx.moveTo(keptX, geom.anchorY);
        ctx.lineTo(keptX, pivotY);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(lostX, geom.anchorY);
        ctx.lineTo(lostX + keepSide * target.w * 0.02 * settle, geom.anchorY + target.h * (0.18 + 0.58 * settle));
        ctx.stroke();
        ctx.translate(keptX, pivotY);
        ctx.rotate(angle);
        ctx.translate(-localAttach.x, -localAttach.y);
        drawDetachedTargetBody(target);
        ctx.restore();
        return;
      }

      if (geom.type === "single-string") {
        const anchorX = geom.x;
        const anchorY = geom.topY;
        const localAttach = { x: 0, y: -target.h * 0.52 };
        const baseLean = target.side * 0.10;
        const angle = baseLean * settle + oscillation;
        ctx.beginPath();
        ctx.moveTo(geom.x, geom.anchorY);
        ctx.lineTo(anchorX, anchorY);
        ctx.stroke();
        ctx.translate(anchorX, anchorY);
        ctx.rotate(angle);
        ctx.translate(-localAttach.x, -localAttach.y);
        drawDetachedTargetBody(target);
        ctx.restore();
        return;
      }

      const centerX = target.x;
      const centerY = target.y;
      const angle = oscillation;
      ctx.translate(centerX, centerY);
      ctx.rotate(angle);
      drawDetachedTargetBody(target);
      ctx.restore();
      return;
    }

    drawSupportRemnant(target, geom);
    const raw = clamp01(age / Math.max(0.01, target.fallDuration));
    let x;
    let y;
    let rotation;
    if (target.kind === "banner") {
      const bannerP = smoothStep(raw);
      x = lerpValue(target.x, target.fallX, bannerP)
        + Math.sin(Math.PI * bannerP) * target.side * target.w * 0.025;
      y = lerpValue(target.y, target.fallY, bannerP)
        - Math.sin(Math.PI * bannerP) * target.h * 0.22;
      rotation = target.fallRotation * bannerP;
    } else {
      const fallP = raw * raw;
      x = lerpValue(target.x, target.fallX, fallP);
      y = lerpValue(target.y, target.fallY, fallP);
      rotation = target.fallRotation * raw;
    }
    const p = raw;
    ctx.save();
    if (p >= 0.98) {
      ctx.globalAlpha = 0.24;
      ctx.fillStyle = "#020508";
      ctx.beginPath();
      ctx.ellipse(x, y + target.h * 0.52, target.w * 0.55, Math.max(1.5, target.h * 0.12), 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.translate(x, y);
    ctx.rotate(rotation);
    drawDetachedTargetBody(target);
    ctx.restore();
  }

  function drawBrokenBillboard(target, jolt) {
    const w = target.w;
    const h = target.h;
    ctx.save();
    ctx.translate(target.x + jolt * target.side, target.y);
    ctx.strokeStyle = "rgba(14, 18, 25, 0.96)";
    ctx.lineWidth = Math.max(1, h * 0.10);
    ctx.beginPath();
    ctx.moveTo(-w * 0.30, -h * 0.38);
    ctx.lineTo(-w * 0.08, -h * 0.05);
    ctx.lineTo(-w * 0.20, h * 0.32);
    ctx.moveTo(-w * 0.08, -h * 0.05);
    ctx.lineTo(w * 0.16, h * 0.08);
    ctx.lineTo(w * 0.31, -h * 0.25);
    ctx.stroke();
    ctx.fillStyle = "rgba(5, 8, 12, 0.78)";
    ctx.beginPath();
    ctx.moveTo(w * 0.22, h * 0.14);
    ctx.lineTo(w * 0.48, h * 0.02);
    ctx.lineTo(w * 0.43, h * 0.48);
    ctx.lineTo(w * 0.12, h * 0.40);
    ctx.closePath();
    ctx.fill();
    drawBillboardGlitchLocal(target);
    ctx.restore();
  }

  function drawBrokenSpeaker(target, jolt) {
    ctx.save();
    ctx.translate(target.x + jolt * target.side, target.y);
    const r = Math.max(2, target.w * 0.28);
    ctx.fillStyle = "rgba(4, 7, 11, 0.95)";
    ctx.beginPath();
    ctx.arc(0, target.h * 0.16, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#8d332f";
    ctx.lineWidth = Math.max(1, target.w * 0.08);
    ctx.beginPath();
    ctx.moveTo(-target.w * 0.36, -target.h * 0.33);
    ctx.lineTo(target.w * 0.10, -target.h * 0.05);
    ctx.lineTo(-target.w * 0.18, target.h * 0.34);
    ctx.stroke();
    ctx.strokeStyle = "rgba(24, 28, 32, 0.95)";
    ctx.beginPath();
    ctx.moveTo(target.w * 0.24, target.h * 0.40);
    ctx.bezierCurveTo(target.w * 0.65, target.h * 0.72, target.w * 0.22, target.h * 1.1, target.w * 0.58, target.h * 1.34);
    ctx.stroke();
    ctx.restore();
  }

  function drawBrokenBanner(target, jolt) {
    ctx.save();

  function drawBrokenCart(target, jolt) {
    ctx.save();
    ctx.translate(target.x + jolt * target.side, target.y);
