  function drawPersistentStadiumDamage() {
    if (collapseState.active || collapseState.ruined) return;
    for (const target of stadiumTargets) {
      if (!target.damaged) continue;
      const age = target.impactAge;
      const jolt = age < 0.45
        ? Math.sin(age * 72) * Math.exp(-age * 8) * (GAME_CANVAS_LOGICAL_WIDTH <= 400 ? 3 : 6)
        : 0;

      if (target.damageMode === "dangling" || target.damageMode === "fallen") {
        drawDetachedDamagedTarget(target);
      } else if (target.kind === "billboard") drawBrokenBillboard(target, jolt);
      else if (target.kind === "speaker") drawBrokenSpeaker(target, jolt);
      else if (target.kind === "floodlight") drawBrokenFloodlight(target, jolt);
      else if (target.kind === "banner") drawBrokenBanner(target, jolt);
      else if (target.kind === "cart") drawBrokenCart(target, jolt);

      if (age < 0.24) {
        drawContactFlash(target.x, target.y, age / 0.24, "#ff9a73");
      }
    }
  }

  function drawCollapseDomePieces() {
    if (!collapseState.active && !collapseState.ruined) return;
    const elapsed = collapseState.ruined ? collapseState.duration : collapseState.elapsed;
    const crackProgress = smoothStep(clamp01(elapsed / 0.42));
    ctx.save();
    ctx.lineJoin = 'round';
    for (const piece of collapseState.domePieces || []) {
      const rawFall = collapseState.ruined
        ? 1
        : clamp01((elapsed - piece.delay) / Math.max(0.01, piece.fallDuration));
      const fallP = rawFall * rawFall;
      const x = lerpValue(piece.centerX, piece.targetX, fallP);
      const y = lerpValue(piece.centerY, piece.targetY, fallP);
      const rotation = lerpValue(piece.rotation, piece.finalRotation, fallP);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.beginPath();
      piece.localPoints.forEach((point, index) => {
        if (index === 0) ctx.moveTo(point.x, point.y);
        else ctx.lineTo(point.x, point.y);
      });
      ctx.closePath();
      const minY = Math.min(...piece.localPoints.map(point => point.y));
      const maxY = Math.max(...piece.localPoints.map(point => point.y));
      const panelGradient = ctx.createLinearGradient(0, minY, 0, maxY);
      panelGradient.addColorStop(0, piece.shade < 0.5 ? '#243a4d' : '#2c4357');
      panelGradient.addColorStop(0.58, '#172a3b');
      panelGradient.addColorStop(1, '#0c1825');
      ctx.fillStyle = panelGradient;
      ctx.fill();
      ctx.strokeStyle = 'rgba(164,190,210,0.72)';
      ctx.lineWidth = GAME_CANVAS_LOGICAL_WIDTH <= 400 ? 0.9 : 1.6;
      ctx.stroke();

      ctx.globalAlpha = 0.34;
      ctx.strokeStyle = 'rgba(226,239,248,0.62)';
      ctx.beginPath();
      ctx.moveTo(piece.localPoints[1].x, piece.localPoints[1].y + (GAME_CANVAS_LOGICAL_WIDTH <= 400 ? 4 : 7));
      ctx.lineTo(piece.localPoints[3].x, piece.localPoints[3].y + (GAME_CANVAS_LOGICAL_WIDTH <= 400 ? 4 : 7));
      ctx.stroke();
      ctx.globalAlpha = 1;

      if (crackProgress > 0.02) {
        ctx.strokeStyle = `rgba(3,8,13,${0.40 + crackProgress * 0.55})`;
        ctx.lineWidth = GAME_CANVAS_LOGICAL_WIDTH <= 400 ? 1 : 2;
        for (const crack of piece.cracks) {
          ctx.beginPath();
          const visibleSegments = Math.max(2, Math.ceil(crack.length * crackProgress));
          for (let i = 0; i < visibleSegments; i++) {
            const point = crack[Math.min(crack.length - 1, i)];
            if (i === 0) ctx.moveTo(point.x, point.y);
            else ctx.lineTo(point.x, point.y);
          }
          ctx.stroke();
        }
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function drawCollapseDust() {
    if (!collapseState.active) return;
    const elapsed = collapseState.elapsed;
    ctx.save();
    for (const cloud of collapseState.dustClouds || []) {
      const p = clamp01((elapsed - cloud.delay) / Math.max(0.01, cloud.duration));
      if (p <= 0 || p >= 1) continue;
      const eased = smoothStep(p);
      const alpha = Math.sin(Math.PI * p) * 0.22;
      const x = cloud.x + cloud.driftX * eased;
      const y = cloud.y - cloud.lift * eased;
      const radius = cloud.radius * (0.45 + eased * 1.25);
      const dust = ctx.createRadialGradient(x, y, 0, x, y, radius);
      dust.addColorStop(0, `rgba(184,178,163,${alpha})`);
      dust.addColorStop(0.5, `rgba(138,137,132,${alpha * 0.62})`);
      dust.addColorStop(1, 'rgba(104,111,116,0)');
      ctx.fillStyle = dust;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawAftermathMeteor() {
    if (!collapseState.ruined) return;
    const compact = GAME_CANVAS_LOGICAL_WIDTH <= 400;
    const cycle = 12500;
    const activeWindow = 1050;
    const time = (performance.now() + aftermathMeteorOffset) % cycle;
    if (time > activeWindow) return;
    const p = smoothStep(time / activeWindow);
    const startX = GAME_CANVAS_LOGICAL_WIDTH * 0.18;
    const startY = compact ? 20 : 28;
    const endX = GAME_CANVAS_LOGICAL_WIDTH * 0.48;
    const endY = compact ? 48 : 66;
    const x = lerpValue(startX, endX, p);
    const y = lerpValue(startY, endY, p);
    const tail = compact ? 20 : 34;
    ctx.save();
    const gradient = ctx.createLinearGradient(x - tail, y - tail * 0.42, x, y);
    gradient.addColorStop(0, 'rgba(255,255,230,0)');
    gradient.addColorStop(1, 'rgba(255,248,202,0.82)');
    ctx.strokeStyle = gradient;
    ctx.lineWidth = compact ? 1.1 : 1.8;
    ctx.beginPath();
    ctx.moveTo(x - tail, y - tail * 0.42);
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,250,219,0.9)';
    ctx.beginPath();
    ctx.arc(x, y, compact ? 1.1 : 1.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function stopRuinAftermathLoop() {
    if (ruinAftermathFrame !== null) {
      cancelAnimationFrame(ruinAftermathFrame);
      ruinAftermathFrame = null;
    }
  }

  function startRuinAftermathLoop() {
    stopRuinAftermathLoop();
    const tick = () => {
      if (!collapseState.ruined || gameScreen.style.display !== 'grid') {
        ruinAftermathFrame = null;
        return;
      }
      scaleGameCanvasBackingStore();
      resetGameCanvasTransform();
      gameDraw();
      ruinAftermathFrame = requestAnimationFrame(tick);
    };
    ruinAftermathFrame = requestAnimationFrame(tick);
  }

  function drawCollapseFallingObjects() {
    if (!collapseState.active && !collapseState.ruined) return;
    const duration = Math.max(0.01, collapseState.duration);
    const p = collapseState.ruined ? 1 : clamp01(collapseState.elapsed / duration);
    const fallP = p * p;
    for (const obj of collapseState.fallingObjects || []) {
      const x = lerpValue(obj.x, obj.targetX, fallP);
      const y = lerpValue(obj.y, obj.targetY, fallP);
      const rotation = lerpValue(obj.rot || 0, obj.finalRot || 0, fallP);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      if (obj.kind === 'scoreboard') {
        roundedRectPath(-obj.w / 2, -obj.h / 2, obj.w, obj.h, GAME_CANVAS_LOGICAL_WIDTH <= 400 ? 4 : 8);
        ctx.fillStyle = 'rgba(7, 18, 30, 0.96)';
        ctx.fill();
        ctx.strokeStyle = '#f0c25e';
        ctx.lineWidth = GAME_CANVAS_LOGICAL_WIDTH <= 400 ? 1 : 2;
        ctx.stroke();
        ctx.fillStyle = '#eef7ff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `bold ${GAME_CANVAS_LOGICAL_WIDTH <= 400 ? 6.0 : 11.5}px Arial, sans-serif`;
        ctx.fillText('RUNS ' + score, 0, 0);
      } else if (obj.kind === 'support') {
        const supportGradient = ctx.createLinearGradient(-obj.w, 0, obj.w, 0);
        if (obj.supportType === 'cable') {
          supportGradient.addColorStop(0, '#707b84');
          supportGradient.addColorStop(0.5, '#d3dce2');
          supportGradient.addColorStop(1, '#5d6972');
        } else {
          supportGradient.addColorStop(0, '#536575');
          supportGradient.addColorStop(0.5, '#a9bbc8');
          supportGradient.addColorStop(1, '#3d4d5b');
        }
        roundedRectPath(-obj.w / 2, -obj.h / 2, obj.w, obj.h, obj.w * 0.5);
        ctx.fillStyle = supportGradient;
        ctx.fill();
      } else {
        drawDetachedTargetBody(obj);
      }
      ctx.restore();
    }
  }

  function drawCollapseDebris() {
    if (!collapseState.active) return;
    const t = collapseState.elapsed;
    const compact = GAME_CANVAS_LOGICAL_WIDTH <= 400;
    const gravity = compact ? 92 : 172;
    const debrisBottom = TREBLE_STAFF_TOP - STAFF_GAP * (compact ? 1.55 : 1.8) - 2;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, debrisBottom);
    ctx.clip();
    for (const piece of collapseState.debris) {
      const x = piece.x + piece.vx * t;
      const y = piece.y + piece.vy * t + gravity * t * t * 0.5;
      if (y > GAME_CANVAS_LOGICAL_HEIGHT + 30) continue;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(piece.rotation + piece.spin * t);
      ctx.fillStyle = piece.shape === 0 ? "#697887" : piece.shape === 1 ? "#d4a457" : "#2a3540";
      if (piece.shape === 2) {
        ctx.beginPath();
        ctx.moveTo(-piece.size, piece.size);
        ctx.lineTo(0, -piece.size);
        ctx.lineTo(piece.size, piece.size);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillRect(-piece.size, -piece.size * 0.55, piece.size * 2, piece.size * 1.1);
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function drawCollapseOverlay() {
    /* No giant collapse text; the game-over box handles messaging. */
  }

  function getHomeRunLandingPoint() {
    const compact = GAME_CANVAS_LOGICAL_WIDTH <= 400;
    const standTop = GAME_CANVAS_LOGICAL_HEIGHT * (compact ? 0.325 : 0.255);
    const standBottom = GAME_CANVAS_LOGICAL_HEIGHT * (compact ? 0.505 : 0.67);
    const minX = GAME_CANVAS_LOGICAL_WIDTH * (compact ? 0.23 : 0.20);
    const maxX = GAME_CANVAS_LOGICAL_WIDTH * (compact ? 0.77 : 0.80);
    const crowdDepth = 0.18 + Math.random() * 0.20;
    return {
      x: minX + Math.random() * (maxX - minX),
      y: standTop + (standBottom - standTop) * crowdDepth
    };
  }

  function beginResultAnimation(type, note) {
    if (!note) return false;

    const fullRadius = STAFF_GAP * (GAME_CANVAS_LOGICAL_WIDTH <= 400 ? 0.54 : 0.63);
    let startX = note.x;
    let startY = note.y;
    let startScale = 1;

    if (note.heldByPitcher) {
      const hand = getPitcherHandPosition(note);
      startX = hand.x;
      startY = hand.y;
      startScale = Math.min(1, Math.max(1.6, fullRadius * 0.24) / Math.max(0.01, fullRadius));
    } else {
      startScale = renderedNoteScale(note);
      startY = renderedNoteY(note);
    }

    if (type === "miss") {
      startX = catcherMittX();
      startScale = 0.24;
    }

    const damageTarget = type === "correct" ? null : reserveRandomStadiumTarget();
    const impact = type === "correct"
      ? getHomeRunLandingPoint()
      : damageTarget || { x: GAME_CANVAS_LOGICAL_WIDTH * 0.78, y: Math.min(TREBLE_STAFF_TOP - STAFF_GAP * 2.5, GAME_CANVAS_LOGICAL_HEIGHT * 0.38) };
    const result = {
      active: true,
      type,
      elapsed: 0,
      duration: type === "miss" ? 0.98 : resultContactDelay(type) + fixedResultFlightDuration(type),
      startX,
      startY,
      startScale,
      rotation: note.rotation || 0,
      currentX: startX,
      currentY: startY,
      currentRotation: note.rotation || 0,
      contactX: startX,
      contactY: startY,
      contactRotation: note.rotation || 0,
      contactCaptured: false,
      contactElapsed: 0,
      flightDuration: 0,
      flightArcLength: 0,
      targetX: impact.x,
      targetY: impact.y,
      noteY: note.y,
      ledgerYs: Array.isArray(note.ledgerYs) ? [...note.ledgerYs] : [],
      noteId: note.id,
      targetId: damageTarget ? damageTarget.id : null,
      impactCommitted: false,
      bounceDuration: type === "wrong" ? 0.68 : 0,
      bounceX: impact.x,
      bounceY: impact.y,
      bounceControlX: impact.x,
      bounceControlY: impact.y,
      pendingGameOver: false,
      whistleStarted: false
    };
    if (type === "wrong") {
      const bounceLanding = nearbyBleacherBallLanding(damageTarget);
      result.bounceX = bounceLanding.x;
      result.bounceY = bounceLanding.y;
      result.bounceControlX = impact.x + (bounceLanding.x - impact.x) * 0.42;
      result.bounceControlY = Math.min(impact.y, bounceLanding.y) - STAFF_GAP * 3.4;
    }
    animationState.results.push(result);
    animationState.result = result;
    if (type === "miss") {
      triggerMissVisualReaction();
      sfxMittCatch();
      sfxBatThrow();
      sfxFlightWhistle({ duration: 0.82, baseFrequency: 500 + Math.random() * 55 });
      result.whistleStarted = true;
    } else {
      sfxBatSwing();
    }
    return result;
  }

  function finishResultAnimation(result) {
    const shouldEndGame = !!result.pendingGameOver;
    if (result.type === "miss") commitStadiumImpact(result);
    const idx = animationState.results.indexOf(result);
    if (idx >= 0) animationState.results.splice(idx, 1);

    if (animationState.results.length > 0) {
      animationState.result = animationState.results[animationState.results.length - 1];
    } else {
      animationState.result.active = false;
      animationState.result.type = "";
      animationState.result.elapsed = 0;
      animationState.result.duration = 0;
      animationState.result.ledgerYs = [];
      animationState.result.pendingGameOver = false;
    }

    if (!running) return;
    if (shouldEndGame) {
      startCollapseSequence();
      return;
    }

    maintainNoteStream();
    maybeStartPitcherAnimation(currentNoteSpeed());
  }

  function pitcherCycleDurationForSpeed(speed) {
    const secondsBetweenPitches = NOTE_SPACING_X / Math.max(1, speed);
    return Math.max(0.28, Math.min(0.68, secondsBetweenPitches * 0.55));
  }

  function startPitcherAnimation(note, speed) {
    if (!note) return;
    animationState.pitcher.active = true;
    animationState.pitcher.noteId = note.id;
    animationState.pitcher.elapsed = 0;
    animationState.pitcher.duration = pitcherCycleDurationForSpeed(speed);
    animationState.pitcher.released = false;
    animationState.pitcher.delivery = note.staff === "bass" ? "underhand" : "overhand";
    animationState.pitcher.startY = animationState.pitcher.currentY;
    animationState.pitcher.targetY = note.y;
    note.pitchTriggered = true;
  }

  function maybeStartPitcherAnimation(speed) {
    if (animationState.pitcher.active) return;
    const note = activeNotes.find(candidate => candidate.heldByPitcher && !candidate.pitchTriggered);
    if (!note) return;
    startPitcherAnimation(note, speed);
  }

  function resultContactDelay(type) {
    return type === "miss" ? 0.25 : 0.24;
  }

  function renderedNoteY(note) {
    if (!note) return NOTE_VANISH_Y;
    if (note.heldByPitcher) return note.y;
    const releaseX = Number.isFinite(note.releaseX) ? note.releaseX : NOTE_ZOOM_START_X;
    const zoomEndX = Number.isFinite(note.zoomEndX) ? note.zoomEndX : NOTE_LANDING_X;
    const zoomDistance = Math.max(1, releaseX - zoomEndX);
    const zoomProgress = smoothStep((releaseX - note.x) / zoomDistance);
    return Number.isFinite(note.releaseY)
      ? note.releaseY + (note.y - note.releaseY) * zoomProgress
      : note.y;
  }

  function catcherMittX() {
    return TARGET_BARLINE_X - STAFF_GAP * 1.35;
  }

  function renderedNoteScale(note) {
    if (!note || note.heldByPitcher) return 1;
    const releaseX = Number.isFinite(note.releaseX) ? note.releaseX : NOTE_ZOOM_START_X;
    const zoomEndX = Number.isFinite(note.zoomEndX) ? note.zoomEndX : NOTE_LANDING_X;
    const zoomDistance = Math.max(1, releaseX - zoomEndX);
    const zoomProgress = smoothStep((releaseX - note.x) / zoomDistance);
    const startScale = Number.isFinite(note.spawnScale) ? note.spawnScale : NOTE_MIN_SCALE;
    const grownScale = startScale + (1 - startScale) * zoomProgress;
    const mittX = catcherMittX();
    const shrinkStartX = mittX + STAFF_GAP * 2.4;
    const shrinkProgress = smoothStep((shrinkStartX - note.x) / Math.max(1, shrinkStartX - mittX));
    return lerpValue(grownScale, 0.24, shrinkProgress);
  }

  function updateSingleResultAnimation(result, deltaSeconds) {
    const contactDelay = resultContactDelay(result.type);
    const staffSpeed = currentNoteSpeed();
    const staffDistance = staffSpeed * deltaSeconds;
    const rotationDistance = Math.max(1, STAFF_GAP * 0.78);

    result.elapsed += deltaSeconds;

    if (result.type === "miss") {
      const mittX = catcherMittX();
      if (result.currentX > mittX) {
        const travelDistance = Math.min(staffDistance, result.currentX - mittX);
        result.currentX -= travelDistance;
        result.currentRotation = (result.currentRotation + travelDistance / rotationDistance) % (Math.PI * 2);
      } else {
        result.currentX = mittX;
      }

      if (result.elapsed >= result.duration) finishResultAnimation(result);
      return;
    }

    if (!result.contactCaptured) {
      result.currentX -= staffDistance;
      result.currentRotation = (result.currentRotation + staffDistance / rotationDistance) % (Math.PI * 2);

      if (result.elapsed >= contactDelay) {
        result.contactCaptured = true;
        result.contactElapsed = result.elapsed;
        triggerAnswerVisualReaction(result.type, result.currentX);
        sfxBatContact(result.type);
        if (!result.whistleStarted) {
          sfxFlightWhistle({
            duration: result.type === "wrong" ? 0.84 : 0.90,
            baseFrequency: result.type === "wrong" ? 510 + Math.random() * 60 : 570 + Math.random() * 70
          });
          result.whistleStarted = true;
        }
        result.contactX = result.currentX;
        result.contactY = result.currentY;
        result.contactRotation = result.currentRotation;

        const start = { x: result.contactX, y: result.contactY };
        const end = { x: result.targetX, y: result.targetY };
        const control = resultFlightControl(result.type, start, end);
        result.flightArcLength = quadraticArcLength(start, control, end);
        result.flightDuration = fixedResultFlightDuration(result.type);
        const reboundDuration = result.type === "wrong" ? result.bounceDuration : 0;
        result.duration = result.contactElapsed + fixedResultFlightDuration(result.type) + reboundDuration;
      }
      return;
    }

    const flightElapsed = result.elapsed - result.contactElapsed;
    const flightTimeNorm = clamp01(flightElapsed / Math.max(0.01, result.flightDuration));
    const flightArcProgress = resultFlightTimeToArcProgress(flightTimeNorm);
    const start = { x: result.contactX, y: result.contactY };
    const end = { x: result.targetX, y: result.targetY };
    const control = resultFlightControl(result.type, start, end);
    const currentPoint = quadraticPointAtArcProgress(start, control, end, flightArcProgress);
    result.currentX = currentPoint.x;
    result.currentY = currentPoint.y;

    if (flightTimeNorm < 1) {
      result.currentRotation = (result.currentRotation + resultFlightSpinRate() * deltaSeconds) % (Math.PI * 2);
    } else if (result.type === "wrong") {
      commitStadiumImpact(result);
      const bounceElapsed = Math.max(0, flightElapsed - result.flightDuration);
      const bounceTime = clamp01(bounceElapsed / Math.max(0.01, result.bounceDuration));
      const bounceStart = { x: result.targetX, y: result.targetY };
      const bounceControl = { x: result.bounceControlX, y: result.bounceControlY };
      const bounceEnd = { x: result.bounceX, y: result.bounceY };
      const bouncePoint = quadraticPoint(bounceStart, bounceControl, bounceEnd, bounceTime);
      result.currentX = bouncePoint.x;
      result.currentY = bouncePoint.y;
    }

    const reboundDuration = result.type === "wrong" ? result.bounceDuration : 0;
    if (flightElapsed >= result.flightDuration + reboundDuration) {
      finishResultAnimation(result);
    }
  }

  function updateAnimationState(deltaSeconds) {
    if (animationState.pitcher.active) {
      animationState.pitcher.elapsed += deltaSeconds;
      const duration = Math.max(0.01, animationState.pitcher.duration);
      const t = clamp01(animationState.pitcher.elapsed / duration);
      const alignmentProgress = smoothStep(Math.min(1, t / 0.42));
      animationState.pitcher.currentY = animationState.pitcher.startY
        + (animationState.pitcher.targetY - animationState.pitcher.startY) * alignmentProgress;

      if (animationState.pitcher.elapsed >= animationState.pitcher.duration) {
        const note = activeNotes.find(candidate => candidate.id === animationState.pitcher.noteId);
        if (note && !animationState.pitcher.released) {
          const releaseHand = getPitcherHandPosition(note);
          const fullRadius = STAFF_GAP * (GAME_CANVAS_LOGICAL_WIDTH <= 400 ? 0.54 : 0.63);
          const propRadius = Math.max(1.6, fullRadius * 0.24);
          note.heldByPitcher = false;
          note.x = releaseHand.x;
          note.y = animationState.pitcher.targetY;
          note.releaseX = releaseHand.x;
          note.releaseY = releaseHand.y;
          note.spawnScale = Math.min(1, propRadius / Math.max(0.01, fullRadius));
          note.zoomEndX = releaseHand.x - STAFF_GAP * 2.4;
          note.rotation = note.rotation || 0;
          sfxPitcherThrow();
        }
        animationState.pitcher.released = true;
        animationState.pitcher.active = false;
        animationState.pitcher.noteId = null;
        animationState.pitcher.elapsed = 0;
        animationState.pitcher.currentY = animationState.pitcher.targetY;
      }
    }

    let catcherTargetY = NOTE_VANISH_Y;
    const latestMiss = [...animationState.results].reverse().find(result => result.type === "miss");
    if (latestMiss) {
      catcherTargetY = latestMiss.currentY;
    } else {
      const frontNote = activeNotes.find(note => !note.heldByPitcher) || activeNotes[0];
      if (frontNote) catcherTargetY = renderedNoteY(frontNote);
    }
    animationState.catcher.targetY = catcherTargetY;
    const catcherFollow = 1 - Math.exp(-deltaSeconds * 12);
    animationState.catcher.currentY += (catcherTargetY - animationState.catcher.currentY) * catcherFollow;

    for (const result of [...animationState.results]) {
      updateSingleResultAnimation(result, deltaSeconds);
    }
  }

  function getPitcherPose() {
    const pose = {
      handX: 0,
      handY: 0,
      bodyX: 0,
      bodyY: 0,
      bodyRotation: 0,
      anchorY: animationState.pitcher.currentY,
      delivery: animationState.pitcher.delivery
    };
    if (!animationState.pitcher.active) return pose;

    const duration = Math.max(0.01, animationState.pitcher.duration);
    const t = clamp01(animationState.pitcher.elapsed / duration);
    const overhand = animationState.pitcher.delivery !== "underhand";
    pose.anchorY = animationState.pitcher.currentY;

    if (overhand) {
      if (t < 0.44) {
        const p = smoothStep(t / 0.44);
        pose.handX = 20 * p;
        pose.handY = -30 * p;
        pose.bodyX = 5 * p;
        pose.bodyY = -5 * p;
        pose.bodyRotation = 0.14 * p;
      } else if (t < 0.74) {
        const p = smoothStep((t - 0.44) / 0.30);
        pose.handX = 20 - 25 * p;
        pose.handY = -30 + 30 * p;
        pose.bodyX = 5 - 12 * p;
        pose.bodyY = -5 + 5 * p;
        pose.bodyRotation = 0.14 - 0.27 * p;
      } else {
        const p = clamp01((t - 0.74) / 0.26);
        const follow = Math.sin(Math.PI * p);
        pose.handX = -5 - 13 * follow;
        pose.handY = 10 * follow;
        pose.bodyX = -7 * (1 - p) - 3 * follow;
        pose.bodyY = 2 * follow;
        pose.bodyRotation = -0.13 * (1 - p) - 0.05 * follow;
      }
    } else {
      // True underhand delivery: the throwing hand drops below the waist,
      // then swings forward and returns to waist height at release.
      if (t < 0.46) {
        const p = smoothStep(t / 0.46);
        pose.handX = 18 * p;
        pose.handY = 34 * p;
        pose.bodyX = 4 * p;
        pose.bodyY = 3 * p;
        pose.bodyRotation = -0.10 * p;
      } else if (t < 0.74) {
        const p = smoothStep((t - 0.46) / 0.28);
        pose.handX = 18 - 24 * p;
        pose.handY = 34 - 34 * p;
        pose.bodyX = 4 - 11 * p;
        pose.bodyY = 3 - 3 * p;
        pose.bodyRotation = -0.10 + 0.20 * p;
      } else {
        const p = clamp01((t - 0.74) / 0.26);
        const follow = Math.sin(Math.PI * p);
        pose.handX = -6 - 14 * follow;
        pose.handY = -7 * follow;
        pose.bodyX = -7 * (1 - p) - 3 * follow;
        pose.bodyY = -1 * follow;
        pose.bodyRotation = 0.10 * (1 - p) + 0.04 * follow;
      }
    }

    return pose;
  }

  function getHeldBallScale(note) {
    const matchingActivePitch = note
      && animationState.pitcher.active
      && animationState.pitcher.noteId === note.id;
    if (!matchingActivePitch) return 0.16;

    const duration = Math.max(0.01, animationState.pitcher.duration);
    const t = clamp01(animationState.pitcher.elapsed / duration);
    if (t < 0.42) {
      return 0.16 + 0.06 * smoothStep(t / 0.42);
    }
    return 0.22 + 0.78 * smoothStep((t - 0.42) / 0.26);
  }

  function getPitcherHandPosition(note = null) {
    const s = STAFF_GAP / 36;
    const pose = getPitcherPose();
    const matchingActivePitch = note
      && animationState.pitcher.active
      && animationState.pitcher.noteId === note.id;
    const anchorY = matchingActivePitch ? pose.anchorY : (note ? note.y : pose.anchorY);
    return {
      x: STAFF_RIGHT + 1 * s + (matchingActivePitch ? pose.handX * s : 0),
      y: anchorY + (matchingActivePitch ? pose.handY * s : 0)
    };
  }


  function requestBravuraFont() {
    if (!document.fonts?.load) return;
    document.fonts
      .load(`${STAFF_GAP * 4}px "Bravura"`, SMUFL_BRACE + SMUFL_G_CLEF + SMUFL_F_CLEF)
      .then(loadedFonts => {
        bravuraReady = loadedFonts.length > 0;
        if (!running && gameScreen.style.display === "grid") gameDraw();
      })
      .catch(() => {});
  }
  function roundedRectPath(x, y, width, height, radius) {
    const r = Math.max(0, Math.min(radius, width / 2, height / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + width - r, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + r);
    ctx.lineTo(x + width, y + height - r);
    ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
    ctx.lineTo(x + r, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawBaseball(x, y, radius, rotation = 0, options = {}) {
    const muted = options.muted === true;
    const damaged = options.damaged === true;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);
    ctx.shadowColor = muted ? "transparent" : "rgba(2, 8, 23, 0.24)";
    ctx.shadowBlur = muted ? 0 : radius * 0.45;
    ctx.shadowOffsetY = muted ? 0 : radius * 0.18;

    const ballFill = damaged ? "#d95545" : muted ? "rgba(226,232,240,0.8)" : "#fffdf5";
    const ballStroke = damaged ? "#7f1d1d" : muted ? "#64748b" : "#172033";
    if (!damaged && !muted) {
      const leather = ctx.createRadialGradient(-radius * 0.34, -radius * 0.42, radius * 0.04, radius * 0.08, radius * 0.12, radius * 1.22);
      leather.addColorStop(0, "#ffffff");
      leather.addColorStop(0.42, "#fffdf3");
      leather.addColorStop(0.78, "#f1eadb");
      leather.addColorStop(1, "#c9c0ae");
      ctx.fillStyle = leather;
    } else {
      ctx.fillStyle = ballFill;
    }
    ctx.strokeStyle = ballStroke;
    ctx.lineWidth = Math.max(1, radius * 0.14);
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.shadowColor = "transparent";
    if (!damaged) {
      const shine = ctx.createRadialGradient(-radius * 0.35, -radius * 0.4, 0, -radius * 0.3, -radius * 0.35, radius * 0.85);
      shine.addColorStop(0, "rgba(255,255,255,0.85)");
      shine.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = shine;
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.84, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "rgba(96, 78, 55, 0.08)";
      ctx.beginPath();
      ctx.ellipse(radius * 0.10, radius * 0.48, radius * 0.62, radius * 0.22, 0.18, 0, Math.PI * 2);
      ctx.fill();
    }

    const seamColor = damaged ? "rgba(255,245,235,0.92)" : muted ? "rgba(100,116,139,0.78)" : "#c83b38";
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, Math.max(0.1, radius - Math.max(0.5, radius * 0.05)), 0, Math.PI * 2);
      ctx.clip();
      ctx.strokeStyle = seamColor;
      ctx.lineWidth = Math.max(0.75, radius * 0.11);
      ctx.lineCap = "round";

      ctx.beginPath();
      ctx.moveTo(-radius * 0.66, -radius * 0.92);
      ctx.bezierCurveTo(-radius * 0.34, -radius * 0.62, -radius * 0.34, radius * 0.62, -radius * 0.66, radius * 0.92);
      ctx.moveTo(radius * 0.66, -radius * 0.92);
      ctx.bezierCurveTo(radius * 0.34, -radius * 0.62, radius * 0.34, radius * 0.62, radius * 0.66, radius * 0.92);
      ctx.stroke();
      ctx.restore();

    if (damaged) {
      ctx.strokeStyle = "rgba(74, 20, 20, 0.82)";
      ctx.lineWidth = Math.max(1, radius * 0.12);
      ctx.beginPath();
      ctx.moveTo(-radius * 0.55, -radius * 0.18);
      ctx.lineTo(-radius * 0.08, radius * 0.02);
      ctx.lineTo(radius * 0.1, radius * 0.5);
      ctx.lineTo(radius * 0.56, radius * 0.72);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawStadiumEnvironment() {
      const width = GAME_CANVAS_LOGICAL_WIDTH;
      const height = GAME_CANVAS_LOGICAL_HEIGHT;
      const compact = width <= 400;
      const standTop = compact ? height * 0.27 : height * 0.255;
      const standBottom = compact ? height * 0.66 : height * 0.67;
      const domePeakY = compact ? 8 : 10;
      const domeShoulderY = compact ? 20 : 24;
      const domeSideY = compact ? 38 : 44;
      const healthBottomY = compact ? 24 : 78;
      const aisleCenters = [width * 0.11, width * 0.89];
      const aisleHalfWidth = compact ? 12 : 18;
      const upperCollapsed = collapseState.active || collapseState.ruined;

      const sky = ctx.createLinearGradient(0, 0, 0, height);
      sky.addColorStop(0, "#07121f");
      sky.addColorStop(0.3, "#102338");
      sky.addColorStop(0.62, "#26445d");
      sky.addColorStop(1, "#184d31");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      const starTime = performance.now() / 1000;
      for (const star of starField) {
        const twinkle = collapseState.active || collapseState.ruined
          ? 0.78 + Math.sin(starTime * star.speed + star.phase) * 0.22
          : 1;
        const alpha = Math.max(0.18, star.alpha * twinkle);
        ctx.fillStyle = `rgba(255, 247, 210, ${alpha.toFixed(3)})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r * (0.92 + twinkle * 0.08), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
      drawAftermathMeteor();

      function traceDomePath() {
        ctx.beginPath();
        ctx.moveTo(0, standTop);
        ctx.lineTo(0, domeSideY);
        ctx.bezierCurveTo(width * 0.14, domeShoulderY, width * 0.31, domePeakY + 1, width * 0.5, domePeakY);
        ctx.bezierCurveTo(width * 0.69, domePeakY + 1, width * 0.86, domeShoulderY, width, domeSideY);
        ctx.lineTo(width, standTop);
        ctx.closePath();
      }

      function boardAnchorYForX(x) {
        const norm = Math.abs(x - width * 0.5) / (width * 0.5);
        return domePeakY + (compact ? 14 : 18) + norm * (compact ? 6 : 10);
      }

      if (!upperCollapsed) {
        ctx.save();
        traceDomePath();
        ctx.clip();
        ctx.fillStyle = "rgba(10, 23, 36, 0.98)";
        ctx.fillRect(0, 0, width, standTop + 1);

        const domeGlow = ctx.createRadialGradient(width * 0.5, height + (compact ? 96 : 132), compact ? 10 : 16, width * 0.5, height + (compact ? 96 : 132), width * 1.18);
        domeGlow.addColorStop(0, "rgba(255, 255, 255, 1)");
        domeGlow.addColorStop(0.1, "rgba(255, 255, 250, 1)");
        domeGlow.addColorStop(0.22, "rgba(255, 250, 232, 0.98)");
        domeGlow.addColorStop(0.34, "rgba(246, 244, 232, 0.8)");
        domeGlow.addColorStop(0.46, "rgba(203, 212, 214, 0.48)");
        domeGlow.addColorStop(0.58, "rgba(114, 139, 160, 0.24)");
        domeGlow.addColorStop(0.75, "rgba(24, 39, 55, 0.38)");
        domeGlow.addColorStop(1, "rgba(0, 2, 8, 0.96)");
        ctx.fillStyle = domeGlow;
        ctx.fillRect(0, 0, width, standTop + 1);

        const topShade = ctx.createLinearGradient(0, 0, 0, standTop);
        topShade.addColorStop(0, "rgba(0, 4, 10, 0.24)");
        topShade.addColorStop(0.42, "rgba(0, 6, 14, 0.10)");
        topShade.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = topShade;
        ctx.fillRect(0, 0, width, standTop + 1);
        ctx.restore();

        ctx.save();
        ctx.strokeStyle = "rgba(171, 192, 210, 0.52)";
        ctx.lineWidth = compact ? 1.2 : 2.2;
        traceDomePath();
        ctx.stroke();
        ctx.restore();
      }

      function drawBoard(centerX, topY, w, h, accent, title, subtitle = "", options = {}) {

          const palette = ["#e0a44f", "#d65f58", "#80a9cf", "#f0e3bd", "#8fc27b"];

      const wallY = standBottom;

      ctx.save();
      ctx.globalAlpha = 0.13;
      ctx.fillStyle = "#d9f5cb";
      const stripeWidth = compact ? 36 : 68;
      for (let x = -stripeWidth; x < width + stripeWidth; x += stripeWidth * 2) {
        ctx.beginPath();
        ctx.moveTo(x, fieldY);
        ctx.lineTo(x + stripeWidth, fieldY);
        ctx.lineTo(x + stripeWidth * 2.2, height);

      const diamondCenterX = width * 0.5;

  function drawPitcher() {
  const s = STAFF_GAP / 36;
  const pose = getPitcherPose();
  const underhand = pose.delivery === "underhand";
  const baseHandX = STAFF_RIGHT + 1 * s;
  const baseHandY = pose.anchorY;
  const baseBodyX = baseHandX - 35 * s;
  const baseBodyY = underhand ? baseHandY - 4 * s : baseHandY + 34 * s;
  const handX = baseHandX + pose.handX * s;
  const handY = baseHandY + pose.handY * s;
  const bodyX = baseBodyX + pose.bodyX * s;
  const bodyY = baseBodyY + pose.bodyY * s;
  const reaction = visualAnimationState.pitcherReaction;
  const reactionAmount = visualReactionAmount(reaction);
  const idleBreath = animationState.pitcher.active ? 0 : Math.sin(visualAnimationState.time * 2.15) * 0.75 * s;
  let reactionX = 0;
  let reactionY = 0;
  let reactionRotation = 0;
  if (reaction.type === "celebrate") {
    reactionY = -2.0 * s * reactionAmount;
    reactionRotation = -0.055 * reactionAmount;
  } else if (reaction.type === "wince") {
    reactionX = 2.2 * s * reactionAmount;
    reactionY = 1.5 * s * reactionAmount;
    reactionRotation = 0.065 * reactionAmount;
  } else if (reaction.type === "collapse") {
    reactionX = Math.sin(reaction.elapsed * 31) * 1.6 * s * reactionAmount;
    reactionY = 2.8 * s * reactionAmount;
    reactionRotation = 0.09 * reactionAmount;
  }

  ctx.save();
  ctx.globalAlpha = GAME_CANVAS_LOGICAL_WIDTH <= 400 ? 0.78 : 0.86;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.translate(reactionX, idleBreath + reactionY);
  ctx.translate(bodyX, bodyY);
  ctx.rotate(pose.bodyRotation + reactionRotation);
  ctx.translate(-bodyX, -bodyY);

  ctx.strokeStyle = "#dfe9ef";
  ctx.lineWidth = 13 * s;
  ctx.beginPath();
  ctx.moveTo(bodyX - 2 * s, bodyY + 14 * s);
  ctx.lineTo(bodyX - 17 * s, bodyY + 54 * s);
  ctx.moveTo(bodyX + 5 * s, bodyY + 14 * s);
  ctx.lineTo(bodyX + 22 * s, bodyY + 50 * s);
  ctx.stroke();

  ctx.strokeStyle = "#1f3655";
  ctx.lineWidth = 7 * s;
  ctx.beginPath();
  ctx.moveTo(bodyX - 18 * s, bodyY + 54 * s);
  ctx.lineTo(bodyX - 28 * s, bodyY + 58 * s);
  ctx.moveTo(bodyX + 22 * s, bodyY + 50 * s);
  ctx.lineTo(bodyX + 34 * s, bodyY + 51 * s);
  ctx.stroke();

  const gloveLift = reaction.type === "celebrate" ? reactionAmount : 0;
  ctx.strokeStyle = "#f3ead6";
  ctx.lineWidth = 10 * s;
  ctx.beginPath();
  ctx.moveTo(bodyX - 15 * s, bodyY - 8 * s);
  ctx.lineTo(bodyX - (25 + gloveLift * 4) * s, bodyY + (4 - gloveLift * 17) * s);
  ctx.stroke();
  ctx.fillStyle = "#80502b";
  ctx.strokeStyle = "#4f2f1a";
  ctx.lineWidth = 1.8 * s;
  ctx.beginPath();
  ctx.ellipse(bodyX - (28 + gloveLift * 4) * s, bodyY + (5 - gloveLift * 18) * s, 8 * s, 10 * s, -0.42, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#dfe9ef";
  ctx.strokeStyle = "#13263e";
  ctx.lineWidth = 2.2 * s;
  roundedRectPath(bodyX - 20 * s, bodyY - 22 * s, 42 * s, 50 * s, 12 * s);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#b23b3b";
  ctx.fillRect(bodyX - 19 * s, bodyY - 2 * s, 40 * s, 6 * s);
  ctx.fillStyle = "#1f3655";
  ctx.font = `bold ${14 * s}px Arial, sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("G", bodyX + 1 * s, bodyY - 10 * s);

  const armOriginX = bodyX + 15 * s;
  const armOriginY = underhand ? bodyY + 3 * s : bodyY - 12 * s;
  ctx.strokeStyle = "#f3ead6";
  ctx.lineWidth = 10 * s;
  ctx.beginPath();
  ctx.moveTo(armOriginX, armOriginY);
  ctx.lineTo(handX - 4 * s, handY);
  ctx.stroke();

  ctx.fillStyle = "#d49a71";
  ctx.beginPath();
  ctx.arc(handX, handY, 6.5 * s, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#d49a71";
  ctx.strokeStyle = "#13263e";
  ctx.lineWidth = 2 * s;
  ctx.beginPath();
  ctx.arc(bodyX, bodyY - 34 * s, 13 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#1f3655";
  ctx.beginPath();
  ctx.arc(bodyX - 1 * s, bodyY - 38 * s, 14 * s, Math.PI, Math.PI * 2);
  ctx.lineTo(bodyX + 17 * s, bodyY - 38 * s);
  ctx.lineTo(bodyX + 5 * s, bodyY - 33 * s);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}
  function drawCatcher() {
    const s = STAFF_GAP / 36;
    const mittX = catcherMittX();
    const mittY = Number.isFinite(animationState.catcher.currentY)
      ? animationState.catcher.currentY
      : NOTE_VANISH_Y;
    const centerY = mittY + 4 * s;
    const bodyX = mittX - 38 * s;
    const reaction = visualAnimationState.catcherReaction;
    const reactionAmount = visualReactionAmount(reaction);
    const idleBob = Math.sin(visualAnimationState.time * 2.35 + 0.8) * 0.62 * s;
    let reactionX = 0;
    let reactionY = 0;
    let reactionRotation = 0;
    if (reaction.type === "celebrate") {
      reactionY = -1.8 * s * reactionAmount;
      reactionRotation = -0.045 * reactionAmount;
    } else if (reaction.type === "catch") {
      reactionX = -2.2 * s * reactionAmount;
      reactionY = 1.2 * s * reactionAmount;
      reactionRotation = -0.05 * reactionAmount;
    } else if (reaction.type === "wince") {
      reactionX = -2.5 * s * reactionAmount;
      reactionY = 2.2 * s * reactionAmount;
      reactionRotation = -0.07 * reactionAmount;
    } else if (reaction.type === "collapse") {
      reactionX = Math.sin(reaction.elapsed * 29 + 0.7) * 1.5 * s * reactionAmount;
      reactionY = 3.0 * s * reactionAmount;
      reactionRotation = -0.085 * reactionAmount;
    }

    ctx.save();
    ctx.globalAlpha = GAME_CANVAS_LOGICAL_WIDTH <= 400 ? 0.8 : 0.88;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.translate(reactionX, idleBob + reactionY);
    ctx.translate(bodyX, centerY);
    ctx.rotate(reactionRotation);
    ctx.translate(-bodyX, -centerY);

    ctx.strokeStyle = "#192b45";
    ctx.lineWidth = 12 * s;
    ctx.beginPath();
    ctx.moveTo(bodyX - 8 * s, centerY + 22 * s);
    ctx.lineTo(bodyX - 31 * s, centerY + 49 * s);
    ctx.moveTo(bodyX + 8 * s, centerY + 22 * s);
    ctx.lineTo(bodyX + 28 * s, centerY + 50 * s);
    ctx.stroke();

    const fistLift = reaction.type === "celebrate" ? reactionAmount : 0;
    ctx.strokeStyle = "#9f2f35";
    ctx.lineWidth = 9 * s;
    ctx.beginPath();
    ctx.moveTo(bodyX - 14 * s, centerY - 2 * s);
    ctx.lineTo(bodyX - (24 + fistLift * 4) * s, centerY + (11 - fistLift * 30) * s);
    ctx.stroke();
    ctx.fillStyle = "#d9a176";
    ctx.beginPath();
    ctx.arc(bodyX - (27 + fistLift * 4) * s, centerY + (12 - fistLift * 31) * s, 5.2 * s, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#9f2f35";
    ctx.strokeStyle = "#111f34";
    ctx.lineWidth = 2.4 * s;
    roundedRectPath(bodyX - 20 * s, centerY - 17 * s, 40 * s, 48 * s, 11 * s);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#d9a176";
    ctx.beginPath();
    ctx.arc(bodyX, centerY - 34 * s, 13 * s, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#15263d";
    ctx.lineWidth = 4 * s;
    ctx.beginPath();
    ctx.arc(bodyX, centerY - 34 * s, 15 * s, Math.PI * 0.88, Math.PI * 2.12);
    ctx.stroke();
    ctx.lineWidth = 1.7 * s;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(bodyX + i * 5 * s, centerY - 45 * s);
      ctx.lineTo(bodyX + i * 4 * s, centerY - 23 * s);
      ctx.stroke();
    }

    ctx.strokeStyle = "#9f2f35";
    ctx.lineWidth = 9 * s;
    ctx.beginPath();
    ctx.moveTo(bodyX + 15 * s, centerY - 4 * s);
    ctx.lineTo(mittX - 7 * s, mittY);
    ctx.stroke();

    const mittCompression = reaction.type === "catch" ? reactionAmount : 0;
    ctx.fillStyle = "#a96f36";
    ctx.strokeStyle = "#5f3a1e";
    ctx.lineWidth = 2.2 * s;
    ctx.beginPath();
    ctx.ellipse(
      mittX,
      mittY,
      11 * s * (1 + mittCompression * 0.08),
      15 * s * (1 - mittCompression * 0.14),
      -0.3,
      0,
      Math.PI * 2
    );
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(mittX + 1 * s, mittY + 1 * s, 6 * s, -1.15, 1.4);
    ctx.stroke();

    ctx.restore();
  }


  function drawStaffGlassPanel() {
    const compact = GAME_CANVAS_LOGICAL_WIDTH <= 400;

    const bottom = BASS_STAFF_TOP + STAFF_GAP * (compact ? 5.2 : 5.35);

    ctx.shadowColor = "rgba(0, 0, 0, 0.28)";

    ctx.fillStyle = compact ? "rgba(247,251,255,0.78)" : "rgba(247,251,255,0.82)";

          );
      const batEndTime = (result.contactCaptured ? result.contactElapsed : contactDelay) + followDuration + 0.10;
      const batFadeStart = batEndTime - 0.10;
      const batVisible = result.elapsed < batEndTime;
      const batFade = batVisible
        ? 1 - Math.max(0, result.elapsed - batFadeStart) / 0.10
        : 0;

      if (!result.contactCaptured) {
        const resizeWindow = Math.min(contactDelay, 0.12);
        const resizeProgress = smoothStep(result.elapsed / Math.max(0.01, resizeWindow));
        const contactScale = lerpValue(result.startScale, 1, resizeProgress);
        drawResultLedgerLines(result, result.currentX, result.currentY, contactScale);
        drawBaseball(result.currentX, result.currentY, fullRadius * contactScale, result.currentRotation);
      } else {
        const flightElapsed = result.elapsed - result.contactElapsed;
        const flightTime = clamp01(
          flightElapsed / Math.max(0.01, result.flightDuration)
        );
        const flight = resultFlightTimeToArcProgress(flightTime);
        const start = { x: result.contactX, y: result.contactY };
        const end = target;
        const control = resultFlightControl(result.type, start, end);
        const point = quadraticPointAtArcProgress(start, control, end, flight);

        let drawPoint = point;
        let ballScale = result.type === "correct"
          ? Math.max(0, 1 - smoothStep((flightTime - 0.52) / 0.48))
          : lerpValue(1, 0.56, smoothStep((flightTime - 0.22) / 0.78));
        let ballAlpha = 1;

        if (result.type === "wrong" && flightElapsed >= result.flightDuration) {
          const bounceElapsed = flightElapsed - result.flightDuration;
          const bounceTime = clamp01(bounceElapsed / Math.max(0.01, result.bounceDuration));
          const bounceStart = { x: result.targetX, y: result.targetY };
          const bounceControl = { x: result.bounceControlX, y: result.bounceControlY };
          const bounceEnd = { x: result.bounceX, y: result.bounceY };
          drawPoint = quadraticPoint(bounceStart, bounceControl, bounceEnd, bounceTime);
          ballScale = lerpValue(0.56, 0.25, smoothStep(bounceTime));
          ballAlpha = 1 - smoothStep((bounceTime - 0.78) / 0.22);
          if (bounceElapsed < 0.30) {
            drawMaterialImpactBurst(result, bounceElapsed / 0.30);
          }
          if (bounceElapsed < 0.22) {
            drawContactShockwave(target.x, target.y, bounceElapsed / 0.22, "wrong");
          }
          if (bounceElapsed < 0.18) {
            drawContactFlash(target.x, target.y, bounceElapsed / 0.18, "#ff9a73");
          }
        }

        if (ballScale > 0.015 && ballAlpha > 0.01) {
          ctx.save();
          ctx.globalAlpha = ballAlpha;
          drawBaseball(drawPoint.x, drawPoint.y, fullRadius * ballScale, result.currentRotation);
          ctx.restore();
        }
        const timeSinceContact = result.elapsed - result.contactElapsed;
        if (timeSinceContact < 0.22) {
          drawContactShockwave(start.x, start.y, timeSinceContact / 0.22, result.type);
        }
        if (timeSinceContact < 0.18) {
          drawContactFlash(start.x, start.y, timeSinceContact / 0.18);
        }
      }

      if (batVisible) {
        drawBatSwingTrail(handle.x, handle.y, batLength, batAngle, batFade);
        drawMiniBatAtHandle(handle.x, handle.y, batLength, batAngle, batFade);
      }
      return;
    }

    const mittX = catcherMittX();
    const missTravelDistance = Math.max(1, result.startX - mittX);
    const missTravelProgress = clamp01((result.startX - result.currentX) / missTravelDistance);
    const shrinkProgress = smoothStep((missTravelProgress - 0.62) / 0.38);
    const missScale = lerpValue(result.startScale, 0.24, shrinkProgress);
    drawBaseball(result.currentX, result.currentY, fullRadius * missScale, result.currentRotation);

    const missPoint = { x: result.startX, y: result.startY };
    const missHandle = {
      x: missPoint.x - batLength * 0.82,
      y: missPoint.y + STAFF_GAP * 1.35
    };
    const missContactAngle = Math.atan2(missPoint.y - missHandle.y, missPoint.x - missHandle.x);
    const missReadyAngle = missContactAngle + 1.30;
    const missFollowAngle = missContactAngle - 1.15;
    const lateSwingEnd = 0.26;
    const throwStart = 0.13;

    if (t < throwStart) {
      const lateSwing = clamp01(t / lateSwingEnd);
      const lateAngle = lerpValue(missReadyAngle, missFollowAngle, lateSwing);
      drawMiniBatAtHandle(missHandle.x, missHandle.y, batLength, lateAngle, 1);
    } else {
      const launchSwing = smoothStep(throwStart / lateSwingEnd);
      const launchAngle = lerpValue(missReadyAngle, missFollowAngle, launchSwing);
      const throwTime = clamp01((t - throwStart) / (1 - throwStart));
      const throwProgress = resultFlightTimeToArcProgress(throwTime);
      const batStartCenter = {
        x: missHandle.x + Math.cos(launchAngle) * batLength * 0.5,
        y: missHandle.y + Math.sin(launchAngle) * batLength * 0.5
      };
      const batControl = resultFlightControl("wrong", batStartCenter, target);
      const center = quadraticPointAtArcProgress(batStartCenter, batControl, target, throwProgress);
      const angle = launchAngle - throwTime * thrownBatSpinRate();
      const thrownBatScale = lerpValue(1, 0.58, smoothStep((throwTime - 0.10) / 0.90));
      const thrownBatLength = batLength * thrownBatScale;
      const thrownHandleX = center.x - Math.cos(angle) * thrownBatLength * 0.5;
      const thrownHandleY = center.y - Math.sin(angle) * thrownBatLength * 0.5;
      drawMiniBatAtHandle(thrownHandleX, thrownHandleY, thrownBatLength, angle);
      if (throwTime >= 1) {
        drawContactFlash(target.x, target.y, 1, "#ff9a73");
      } else if (throwTime > 0.82) {
        const impactProgress = (throwTime - 0.82) / 0.18;
        drawMaterialImpactBurst(result, impactProgress);
        drawContactShockwave(target.x, target.y, impactProgress, "wrong");
        drawContactFlash(target.x, target.y, Math.max(0, (throwTime - 0.86) / 0.14), "#ff9a73");
      }
    }
  }

  function drawResultAnimation() {
    for (const result of animationState.results) {
      drawSingleResultAnimation(result);
    }
  }

  function createStarField() {
    const compact = GAME_CANVAS_LOGICAL_WIDTH <= 400;
    const width = GAME_CANVAS_LOGICAL_WIDTH;
    const height = GAME_CANVAS_LOGICAL_HEIGHT;
    const standTop = (compact ? height * 0.27 : height * 0.255) - (compact ? 8 : 10);
    const count = compact ? 42 : 74;
    const stars = [];
    for (let i = 0; i < count; i++) {
      stars.push({
        x: 10 + Math.random() * (width - 20),
        y: 6 + Math.random() * Math.max(12, standTop - 12),
        r: compact ? (0.65 + Math.random() * 0.9) : (0.75 + Math.random() * 1.1),
        alpha: 0.45 + Math.random() * 0.45,
        phase: Math.random() * Math.PI * 2,
        speed: 0.55 + Math.random() * 1.15
      });
    }
    return stars;
  }

  function gameInit() {
  activeNotes = [];
  correctNotes = 0;
  stadiumDamage = 0;
  stadiumTargets = createStadiumTargets();
  collapseState = { active: false, ruined: false, elapsed: 0, duration: 2.45, debris: [], fallingObjects: [], domePieces: [], dustClouds: [] };
  starField = createStarField();
  aftermathMeteorOffset = Math.random() * 10000;
  feedbackText = "";
  feedbackKind = "neutral";
  feedbackUntil = 0;
  lastPitchIndex = -1;
  nextNoteId = 1;
  lastUpdateTime = performance.now();
  resetAnimationState();
  resetVisualAnimationState();
  requestBravuraFont();
  spawnNoteAt(NOTE_SPAWN_X);
}
  function gameUpdate() {
    const now = performance.now();
    const deltaSeconds = Math.min(0.05, Math.max(0, (now - lastUpdateTime) / 1000));
    lastUpdateTime = now;

    if (feedbackText && now > feedbackUntil) {
      feedbackText = "";
      feedbackKind = "neutral";
      feedbackUntil = 0;
      if (typeof setMessage === "function") setMessage("READ THE FRONT BASEBALL");
    }

    updatePersistentDamage(deltaSeconds);
    updateAnimationState(deltaSeconds);
    updateVisualAnimationState(deltaSeconds);
    if (!running) return;
    if (collapseState.active) {
      updateCollapseState(deltaSeconds);
      return;
    }

    const speed = currentNoteSpeed();
    const distance = speed * deltaSeconds;
    const rotationDistance = Math.max(1, STAFF_GAP * 0.78);
    for (const note of activeNotes) {
      if (note.heldByPitcher) continue;
      note.x -= distance;
      note.rotation = (note.rotation + distance / rotationDistance) % (Math.PI * 2);
    }

    maintainNoteStream();
    maybeStartPitcherAnimation(speed);

    while (running && stadiumDamage < MAX_STADIUM_DAMAGE && activeNotes.length > 0 && activeNotes[0].x <= catcherMittX()) {
      resolveFrontNote("miss");
    }
  }

  function gameDraw() {
    updateActionTextDisplay();
    ctx.clearRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);

    const shake = collapseShakeOffset();
    ctx.save();
    ctx.translate(shake.x, shake.y);
    drawStadiumEnvironment();
    drawBeautificationAtmosphere();
    drawPersistentStadiumDamage();
    drawCollapseFallingObjects();
    drawStaffGlassPanel();
    drawFiveLineStaff(TREBLE_STAFF_TOP, STAFF_GAP, STAFF_LEFT, STAFF_RIGHT);
    drawFiveLineStaff(BASS_STAFF_TOP, STAFF_GAP, STAFF_LEFT, STAFF_RIGHT);
    drawGrandStaffConnector();
    drawClef("treble", CLEF_X, TREBLE_STAFF_TOP, STAFF_GAP);
    drawClef("bass", CLEF_X, BASS_STAFF_TOP, STAFF_GAP);
    drawCatcherThreshold();
    drawPitcher();
    drawCatcher();
    for (let i = activeNotes.length - 1; i >= 0; i--) drawStreamingNote(activeNotes[i]);
    drawResultAnimation();
    drawCollapseDebris();
    ctx.restore();
    drawStadiumDamageHud();
    drawCollapseOverlay();
  }

  function gameInput(action) {
    if (!running || collapseState.active || stadiumDamage >= MAX_STADIUM_DAMAGE || activeNotes.length === 0 || activeNotes[0].heldByPitcher) return;
    const letter = String(action || "").toUpperCase();
    if (!/^[A-G]$/.test(letter)) return;
    resolveFrontNote(letter === activeNotes[0].letter ? "correct" : "wrong");
  }

  function gamePointer() {
    /* Pointer input remains intentionally unused in Step 2. */
  }

  function gameStop() {
    stopRuinAftermathLoop();
    activeNotes = [];
    stadiumTargets = [];
    collapseState = { active: false, ruined: false, elapsed: 0, duration: 2.45, debris: [], fallingObjects: [], domePieces: [], dustClouds: [] };
    starField = [];
    lastUpdateTime = 0;
    resetAnimationState();
    resetVisualAnimationState();
    resetJoystick(sticks.left);
    resetJoystick(sticks.right);
  }

    const resizeObserver = new ResizeObserver(() => {
      scaleAppToFrame();
      if (!sticks.left.active) resetJoystick(sticks.left);
      if (!sticks.right.active) resetJoystick(sticks.right);
      if (!running) gameDraw();
    });

    resizeObserver.observe(appFrame);

    window.addEventListener("orientationchange", () => {
      setTimeout(() => {
        scaleAppToFrame();
        if (!sticks.left.active) resetJoystick(sticks.left);
        if (!sticks.right.active) resetJoystick(sticks.right);
        if (!running) gameDraw();
      }, 250);
    });

    window.MobileArcadeShell = {
      canvas,
      ctx,
      gameWidth: GAME_CANVAS_LOGICAL_WIDTH,
      gameHeight: GAME_CANVAS_LOGICAL_HEIGHT,
      getCanvasSize: getGameCanvasSize,
      scaleGameCanvasBackingStore,
      resetGameCanvasTransform,
      sticks,
      setScore,
      addScore,
      setMessage,
      endGame,
      soundCorrect,
      soundWin,
      soundLose,
      getAudio,
      savePlayers,
      loadPlayers,
      openMenu: openShellMenu,
      closeMenu: closeShellMenu,
      exitToPlayerMenu,
      saveCurrentScoreForSelectedPlayer,
      registerMenuTab: registerShellMenuTab,
      updateMenuTab: updateShellMenuTab,
      configureControls: configureMobileControls,
      setFirstTimeHelpVersion
    };

    scaleAppToFrame();
    loadPlayers();
    resetJoystick(sticks.left);
    resetJoystick(sticks.right);
    configureMobileControls({
      showDpad: false,
      showLeftJoystick: false,
      showRightJoystick: false,
      faceButtons: [],
      systemButtons: ["start"],
      labels: { start: "MENU" }
    });
    gameInit();
    gameDraw();
  </script>
</body>
