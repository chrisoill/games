<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chord Defender Mobile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #appFrame {
      width: 100%;
      aspect-ratio: 390 / 670;
      position: relative;
      overflow: hidden;
      background: #202020;
    }

    #appStage {
      width: 390px;
      height: 670px;
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: top left;
      transform: scale(var(--app-scale, 1));
      overflow: hidden;
      background: linear-gradient(180deg, #2f2f2f, #191919);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: auto;
      color: white;
    }

    #appStage *:not(input):not(textarea) {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    button {
      font-family: Arial, sans-serif;
      touch-action: none;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input,
    select {
      font-size: 16px;
      padding: 8px;
      border-radius: 10px;
      border: 2px solid #111;
      box-sizing: border-box;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       PLAYER MENU
       ========================= */

    #menuScreen {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #2f2f2f, #191919);
      padding: 13px 16px 14px;
      overflow: visible;
      text-align: center;
      z-index: 20;
      touch-action: pan-y;
    }

    #menuScreen h1 {
      margin: 4px 0 9px;
      font-size: 28px;
    }

    #leaderboardBox {
      margin: 0 auto 9px;
      padding: 9px;
      background: rgba(255,255,255,0.1);
      border-radius: 14px;
      max-width: 350px;
    }

    #leaderboardBox h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    #leaderboardList {
      text-align: left;
      max-width: 230px;
      margin: 0 auto;
      font-size: 15px;
    }

    #playerPickerBox {
      margin: 0 auto 9px;
      padding: 9px;
      background: rgba(255,255,255,0.08);
      border-radius: 14px;
      max-width: 350px;
    }

    #playerSearchInput {
      width: 100%;
      margin-bottom: 8px;
    }

    #playerSelect {
      width: 100%;
      height: 120px;
      background: #f8fbff;
      color: #111827;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border: 2px solid #111;
      border-radius: 10px;
      text-align: left;
    }

    .playerOption {
      padding: 10px;
      border-bottom: 1px solid rgba(17,24,39,0.12);
      font-size: 16px;
      line-height: 1.2;
      background: #f8fbff;
      color: #111827;
    }

    .playerOption:last-child {
      border-bottom: 0;
    }

    .playerOption.selected {
      background: #ffe08a;
      font-weight: bold;
    }

    .playerOption.disabled {
      color: rgba(17,24,39,0.55);
      text-align: center;
      font-style: italic;
    }

    #selectedPlayerActions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 7px;
    }

    #selectedPlayerActions button,
    #addPlayerBtn,
    #startGameBtn,
    #exitPageBtn {
      min-height: 38px;
      border-radius: 12px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
    }

    #resetSelectedPlayerBtn {
      background: #fff3bf;
    }

    #removeSelectedPlayerBtn {
      background: #ffd6d6;
    }

    #addPlayerRow {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
      margin: 0 auto 8px;
      max-width: 350px;
    }

    #newPlayerName {
      width: 100%;
    }

    #selectedPlayerText {
      margin: 7px 0;
      font-size: 15px;
      opacity: 0.9;
    }

    #startGameBtn {
      background: #dff3ff;
      min-width: 150px;
    }

    #exitPageBtn {
      min-width: 110px;
    }

    /* =========================
       GAME / EMULATOR
       ========================= */

    #gameScreen {
      position: absolute;
      inset: 0;
      display: none;
      background: linear-gradient(180deg, #2f2f2f, #191919);
      z-index: 10;
      touch-action: auto;
    }

    #screen {
      position: absolute;
      left: 0;
      top: 0;
      width: 390px;
      height: 219px;
      overflow: hidden;
      background: #0b1420;
      border: 1px solid #2b2b2b;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.05),
        0 1px 3px rgba(0,0,0,0.45);
    }

    #gameCanvas {
      width: 390px;
      height: 219px;
      display: block;
      background: #f7fbff;
      image-rendering: pixelated;
    }

    #gameOverBox {
      display: none;
      position: absolute;
      left: 34px;
      right: 34px;
      top: 50%;
      transform: translateY(-50%);
      padding: 18px 12px;
      background: rgba(16, 24, 39, 0.93);
      border: 3px solid white;
      border-radius: 16px;
      color: white;
      text-align: center;
      z-index: 8;
    }

    #gameOverBox h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    #gameOverScore {
      margin: 0 0 10px;
      font-size: 15px;
    }

    #gameOverBox button {
      border: 2px solid #111;
      border-radius: 12px;
      background: white;
      color: #111827;
      padding: 8px 12px;
      margin: 3px;
      font-size: 12px;
      font-weight: bold;
    }

    #lcd {
      position: absolute;
      left: 0;
      top: 219px;
      width: 390px;
      height: 48px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02)),
        #17251c;
      border-top: 3px solid #0c0c0c;
      border-bottom: 3px solid #0c0c0c;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.04),
        inset 0 0 14px rgba(0,0,0,0.35);
      color: #b7ff9e;
      font-family: "Courier New", monospace;
      text-shadow: 0 0 7px rgba(183,255,158,0.35);
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: 1fr 1fr;
      align-items: center;
      padding: 5px 16px;
      pointer-events: none;
    }

    #lcdMessage {
      grid-column: 1 / 3;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #lcdScore {
      font-size: 12px;
    }

    #lcdBest {
      font-size: 13px;
      text-align: right;
    }

    #controls {
      position: absolute;
      left: 0;
      top: 267px;
      width: 390px;
      height: 400px;
      background: linear-gradient(180deg, #303030, #181818);
      touch-action: auto;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    #pianoControls {
      position: absolute;
      left: 0;
      top: 12px;
      width: 390px;
      height: 292px;
      padding: 0 14px;
      touch-action: none;
      z-index: 4;
    }

    #pianoHint {
      height: 24px;
      line-height: 24px;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.3px;
      color: rgba(255,255,255,0.78);
      text-align: center;
    }

    .pianoGroup {
      position: relative;
      height: 112px;
      margin: 0 auto 18px;
      touch-action: none;
    }

    .pianoGroupTop {
      width: 258px;
    }

    .pianoGroupBottom {
      width: 328px;
    }

    .whiteKeys {
      display: grid;
      grid-template-columns: repeat(var(--white-count), 1fr);
      height: 100%;
      position: relative;
      z-index: 1;
    }

    .pianoKey {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      font-weight: 900;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    .whiteKey {
      height: 112px;
      border: 2px solid #101827;
      border-radius: 0 0 14px 14px;
      background: linear-gradient(180deg, #ffffff, #e7edf8);
      color: transparent;
      font-size: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 0;
      box-shadow: 0 8px 14px rgba(0,0,0,0.38);
    }

    .blackKey {
      position: absolute;
      left: calc((var(--pos) * 100% / var(--white-count)) - 26px);
      top: 0;
      width: 52px;
      height: 72px;
      z-index: 3;
      border: 2px solid #05070b;
      border-radius: 0 0 11px 11px;
      background: linear-gradient(180deg, #343946, #05070b);
      color: transparent;
      font-size: 0;
      box-shadow: 0 8px 14px rgba(0,0,0,0.45);
    }

    .pianoKey.pressed,
    .pianoKey:active {
      transform: translateY(2px);
      filter: brightness(1.18);
    }

    .whiteKey.pressed,
    .whiteKey:active {
      background: linear-gradient(180deg, #fff3bf, #ffd45c);
    }

    .blackKey.pressed,
    .blackKey:active {
      background: linear-gradient(180deg, #555d70, #151923);
    }

    #controls *,
    #screen,
    #gameCanvas {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* D-PAD */

    #dpad {
      position: absolute;
      left: 17px;
      top: 19px;
      width: 150px;
      height: 150px;
      touch-action: manipulation;
    }

    .dpadBtn {
      position: absolute;
      width: 50px;
      height: 50px;
      border: none;
      background: #111;
      color: rgba(255,255,255,0.86);
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 22px;
      line-height: 50px;
      text-align: center;
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.08),
        0 7px 13px rgba(0,0,0,0.45);
    }

    .dpadBtn.pressed,
    .dpadBtn:active {
      filter: brightness(1.35);
      transform: scale(0.94);
    }

    #dpadUp { left: 50px; top: 0; border-radius: 10px 10px 3px 3px; }
    #dpadLeft { left: 0; top: 50px; border-radius: 10px 3px 3px 10px; }
    #dpadCenter { left: 50px; top: 50px; border-radius: 4px; pointer-events: none; }
    #dpadRight { left: 100px; top: 50px; border-radius: 3px 10px 10px 3px; }
    #dpadDown { left: 50px; top: 100px; border-radius: 3px 3px 10px 10px; }

    /* FACE BUTTONS */

    #faceButtons {
      position: absolute;
      right: 18px;
      top: 20px;
      width: 150px;
      height: 150px;
    }

    .faceBtn {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 20px;
      font-weight: bold;
      background: radial-gradient(circle at 30% 30%, #ff82ad, #9d003d);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.15),
        0 10px 18px rgba(0,0,0,0.45);
    }

    .faceBtn.pressed,
    .faceBtn:active {
      transform: scale(0.92);
      filter: brightness(1.2);
    }

    #buttonX { left: 46px; top: 0; }
    #buttonY { left: 0; top: 46px; }
    #buttonA { left: 92px; top: 46px; }
    #buttonB { left: 46px; top: 92px; }

    /* JOYSTICKS */

    .joystickPad {
      position: absolute;
      width: 112px;
      height: 112px;
      border-radius: 18px;
      background: rgba(255,255,255,0.035);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.07);
      touch-action: none;
    }

    #leftJoystickPad {
      left: 36px;
      top: 188px;
    }

    #rightJoystickPad {
      right: 37px;
      top: 188px;
    }

    .joystickBase {
      position: absolute;
      left: 11px;
      top: 11px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, #3f3f3f, #161616);
      box-shadow:
        inset 0 0 0 3px rgba(255,255,255,0.08),
        0 9px 18px rgba(0,0,0,0.45);
      pointer-events: none;
    }

    .joystickKnob {
      position: absolute;
      left: 56px;
      top: 56px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #777, #202020);
      transform: translate(-50%, -50%);
      box-shadow: 0 8px 18px rgba(0,0,0,0.55);
      pointer-events: none;
    }

    /* START / SELECT */

    #systemButtons {
      position: absolute;
      left: 50%;
      top: 326px;
      width: 164px;
      height: 34px;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .systemBtn {
      width: 76px;
      height: 32px;
      border-radius: 999px;
      border: none;
      background: #101010;
      color: rgba(255,255,255,0.78);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.12);
    }

    .systemBtn.pressed,
    .systemBtn:active {
      transform: scale(0.96);
      filter: brightness(1.2);
    }

    #faceButtons.singleFace .faceBtn.singleAction {
      width: 76px;
      height: 76px;
      left: 37px !important;
      top: 37px !important;
      border-radius: 22px;
      padding: 0 8px;
      font-size: 14px;
      line-height: 1.05;
      white-space: normal;
    }

    #systemButtons.singleSystem {
      width: 92px;
    }

    #systemButtons.singleSystem .systemBtn {
      width: 92px;
    }

    /* =========================
       EXPANDABLE SHELL MENU
       ========================= */

    #shellMenu {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 60;
      background: rgba(0,0,0,0.62);
      padding: 22px 14px;
      color: white;
    }

    #shellMenu.open {
      display: block;
    }

    #shellMenuPanel {
      width: 100%;
      max-height: 100%;
      overflow: hidden;
      background: #101827;
      border: 3px solid white;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.45);
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    #shellMenuHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 12px 7px;
    }

    #shellMenuHeader h2 {
      margin: 0;
      font-size: 22px;
    }

    #shellMenuCloseBtn {
      width: 40px;
      height: 36px;
      padding: 0;
      border-radius: 12px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 26px;
      font-weight: bold;
      line-height: 1;
    }

    #shellMenuTabs {
      display: flex;
      gap: 7px;
      padding: 0 12px 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .shellMenuTab {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 7px 11px;
      border-radius: 999px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
    }

    .shellMenuTab.active {
      background: #ffe08a;
    }

    #shellMenuBody {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 14px 14px;
      text-align: left;
      font-size: 15px;
      line-height: 1.38;
      touch-action: pan-y;
    }

    .pauseMenuActions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
      margin-top: 12px;
    }

    .pauseActionBtn {
      min-height: 42px;
      border-radius: 12px;
      border: 2px solid #111;
      background: white;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
    }

    .pauseActionBtn.saveExit {
      background: #dff3ff;
    }

    .pauseActionBtn.noSaveExit {
      background: #ffd6d6;
    }

    .pauseActionBtn.resumeGame {
      background: #fff3bf;
    }

    #shellMenuBody h3 {
      margin: 4px 0 8px;
      font-size: 20px;
    }

    #shellMenuBody ul {
      margin-top: 8px;
      padding-left: 21px;
    }

    #shellMenuBody code {
      background: rgba(255,255,255,0.12);
      padding: 2px 5px;
      border-radius: 6px;
    }

  
    /* Key Defender rebuilt mobile layout: locked-ratio shell, desktop game world,
       split touch piano, and a flat neutral controller deck. */
    #screen {
      height: 303.333333px;
      touch-action: pan-y;
    }

    #gameCanvas {
      width: 390px;
      height: 303.333333px;
      image-rendering: auto;
      touch-action: pan-y;
    }

    #lcd {
      top: 303.333333px;
    }

    #controls {
      top: 351.333333px;
      height: 318.666667px;
      background: #242424;
      touch-action: pan-y;
    }

    #pianoControls {
      top: 23px;
      height: 200px;
      padding: 0 14px;
    }

    #cancelChordBtn {
      position: absolute;
      right: 4px;
      top: 35px;
      width: 72px;
      height: 24px;
      margin: 0;
      padding: 0;
      border: 2px solid #111;
      border-radius: 999px;
      background: #fff3bf;
      color: #111827;
      font-size: 11px;
      font-weight: 900;
      z-index: 8;
      touch-action: none;
    }

    #cancelChordBtn:active,
    #cancelChordBtn.pressed {
      transform: scale(0.96);
      filter: brightness(1.12);
    }

    .pianoGroup {
      height: 94px;
      margin-bottom: 12px;
    }

    .pianoGroupTop {
      width: 228px;
    }

    .pianoGroupBottom {
      width: 300px;
    }

    .whiteKey {
      height: 94px;
      border-radius: 0 0 12px 12px;
    }

    .blackKey {
      left: calc((var(--pos) * 100% / var(--white-count)) - 23px);
      width: 46px;
      height: 60px;
      border-radius: 0 0 10px 10px;
    }

    #dpad,
    #faceButtons,
    #leftJoystickPad,
    #rightJoystickPad,
    #selectButton {
      display: none !important;
    }

    #systemButtons {
      top: 246px;
      width: 92px;
      height: 32px;
      gap: 0;
    }

    #startButton {
      width: 92px;
    }

  </style>
</head>

<body>
  <main id="appFrame">
    <section id="appStage">
      <div id="menuScreen">
        <h1>Choose Player</h1>

        <div id="leaderboardBox">
          <h2>Leaderboard</h2>
          <ol id="leaderboardList"></ol>
        </div>

        <div id="playerPickerBox">
          <input id="playerSearchInput" placeholder="Search players..." autocomplete="off" />
          <div id="playerSelect" role="listbox" aria-label="Choose player"></div>

          <div id="selectedPlayerActions">
            <button id="resetSelectedPlayerBtn">Reset</button>
            <button id="removeSelectedPlayerBtn">Remove</button>
          </div>
        </div>

        <div id="addPlayerRow">
          <input id="newPlayerName" placeholder="New player name" />
          <button id="addPlayerBtn">Add Player</button>
        </div>

        <p id="selectedPlayerText">No player selected</p>
        <button id="startGameBtn">Start Game</button>
      </div>

      <div id="gameScreen">
        <div id="screen">
          <canvas id="gameCanvas" width="720" height="560"></canvas>

          <div id="gameOverBox">
            <h1>Game Over</h1>
            <p id="gameOverScore"></p>
            <button id="playAgainBtn">Play Again</button>
            <button id="backToMenuBtn">Player Menu</button>
          </div>
        </div>

        <div id="lcd">
          <div id="lcdMessage">READY</div>
          <div id="lcdScore">SCORE: <span id="score">0</span></div>
          <div id="lcdBest">BEST: <span id="bestScore">0</span></div>
        </div>

        <div id="controls">
          <div id="pianoControls" aria-label="Split piano keyboard controls">
            <button id="cancelChordBtn" type="button">CANCEL</button>
            <div class="pianoGroup pianoGroupTop" style="--white-count: 3;" aria-label="C through E piano keys">
              <div class="whiteKeys">
                <button class="pianoKey whiteKey" type="button" data-note="C" aria-label="C"></button>
                <button class="pianoKey whiteKey" type="button" data-note="D" aria-label="D"></button>
                <button class="pianoKey whiteKey" type="button" data-note="E" aria-label="E"></button>
              </div>
              <button class="pianoKey blackKey" type="button" data-note="C#" aria-label="C sharp or D flat" style="--pos: 1;"></button>
              <button class="pianoKey blackKey" type="button" data-note="D#" aria-label="D sharp or E flat" style="--pos: 2;"></button>
            </div>

            <div class="pianoGroup pianoGroupBottom" style="--white-count: 4;" aria-label="F through B piano keys">
              <div class="whiteKeys">
                <button class="pianoKey whiteKey" type="button" data-note="F" aria-label="F"></button>
                <button class="pianoKey whiteKey" type="button" data-note="G" aria-label="G"></button>
                <button class="pianoKey whiteKey" type="button" data-note="A" aria-label="A"></button>
                <button class="pianoKey whiteKey" type="button" data-note="B" aria-label="B"></button>
              </div>
              <button class="pianoKey blackKey" type="button" data-note="F#" aria-label="F sharp or G flat" style="--pos: 1;"></button>
              <button class="pianoKey blackKey" type="button" data-note="G#" aria-label="G sharp or A flat" style="--pos: 2;"></button>
              <button class="pianoKey blackKey" type="button" data-note="A#" aria-label="A sharp or B flat" style="--pos: 3;"></button>
            </div>
          </div>

          <div id="dpad">
            <button id="dpadUp" class="dpadBtn" data-action="up">▲</button>
            <button id="dpadLeft" class="dpadBtn" data-action="left">◄</button>
            <button id="dpadCenter" class="dpadBtn"></button>
            <button id="dpadRight" class="dpadBtn" data-action="right">►</button>
            <button id="dpadDown" class="dpadBtn" data-action="down">▼</button>
          </div>

          <div id="faceButtons">
            <button id="buttonX" class="faceBtn" data-action="x">X</button>
            <button id="buttonY" class="faceBtn" data-action="y">Y</button>
            <button id="buttonA" class="faceBtn" data-action="a">A</button>
            <button id="buttonB" class="faceBtn" data-action="b">B</button>
          </div>

          <div id="leftJoystickPad" class="joystickPad" data-stick="left">
            <div class="joystickBase"></div>
            <div id="leftJoystickKnob" class="joystickKnob"></div>
          </div>

          <div id="rightJoystickPad" class="joystickPad" data-stick="right">
            <div class="joystickBase"></div>
            <div id="rightJoystickKnob" class="joystickKnob"></div>
          </div>

          <div id="systemButtons">
            <button id="selectButton" class="systemBtn" data-action="select">SELECT</button>
            <button id="startButton" class="systemBtn" data-action="start">START</button>
          </div>
        </div>
      </div>

      <div id="shellMenu" aria-hidden="true">
        <div id="shellMenuPanel" role="dialog" aria-modal="true" aria-label="Pause panel">
          <div id="shellMenuHeader">
            <h2>Pause</h2>
            <button id="shellMenuCloseBtn" type="button" aria-label="Close panel">×</button>
          </div>
          <div id="shellMenuTabs" role="tablist" aria-label="Pause panel tabs"></div>
          <div id="shellMenuBody"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const DESIGN_WIDTH = 390;
    const DESIGN_HEIGHT = 670;

    const GAME_CANVAS_LOGICAL_WIDTH = 720;
    const GAME_CANVAS_LOGICAL_HEIGHT = 560;
    const GAME_CANVAS_DISPLAY_WIDTH = 390;
    const GAME_CANVAS_DISPLAY_HEIGHT =
      GAME_CANVAS_DISPLAY_WIDTH * GAME_CANVAS_LOGICAL_HEIGHT / GAME_CANVAS_LOGICAL_WIDTH;
    const MAX_GAME_CANVAS_PIXEL_SCALE = 4;
    const FIXED_GAME_STEP_MS = 1000 / 60;

    /*
      Change STORAGE_KEY for each separate arcade game if you want each game
      to keep its own local player list/leaderboard.
      Example: "meloMemoPlayers_v1", "staffSurvivorPlayers_v1", etc.
    */
    const STORAGE_KEY = "chordDefenderPlayers_v1";
    const STORAGE_MESSAGE_SOURCE = "PianoArcadeShell";
    const WIX_STORAGE_MESSAGE_SOURCE = "PianoArcadeWixStorage";
    const SCORE_LABEL = "Score";
    const FIRST_TIME_HELP_DEFAULT_VERSION = "chordDefender_howToPlay_v2";
    let firstTimeHelpVersion = FIRST_TIME_HELP_DEFAULT_VERSION;

    const appFrame = document.getElementById("appFrame");
    const appStage = document.getElementById("appStage");

    const menuScreen = document.getElementById("menuScreen");
    const gameScreen = document.getElementById("gameScreen");

    const leaderboardList = document.getElementById("leaderboardList");
    const playerSearchInput = document.getElementById("playerSearchInput");
    const playerSelect = document.getElementById("playerSelect");
    playerSelect.addEventListener("touchmove", event => event.stopPropagation(), { passive: true });
    const resetSelectedPlayerBtn = document.getElementById("resetSelectedPlayerBtn");
    const removeSelectedPlayerBtn = document.getElementById("removeSelectedPlayerBtn");
    const newPlayerName = document.getElementById("newPlayerName");
    const addPlayerBtn = document.getElementById("addPlayerBtn");
    const startGameBtn = document.getElementById("startGameBtn");
    const selectedPlayerText = document.getElementById("selectedPlayerText");

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    let gameCanvasPixelScale = 1;

    function resetGameCanvasTransform() {
      ctx.setTransform(gameCanvasPixelScale, 0, 0, gameCanvasPixelScale, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.webkitImageSmoothingEnabled = true;
      ctx.mozImageSmoothingEnabled = true;
      ctx.msImageSmoothingEnabled = true;
    }

    function scaleGameCanvasBackingStore() {
      canvas.style.width = GAME_CANVAS_DISPLAY_WIDTH + "px";
      canvas.style.height = GAME_CANVAS_DISPLAY_HEIGHT + "px";

      const rect = canvas.getBoundingClientRect();
      const cssWidth = Math.max(1, rect.width || GAME_CANVAS_DISPLAY_WIDTH * appScale);
      const cssHeight = Math.max(1, rect.height || GAME_CANVAS_DISPLAY_HEIGHT * appScale);
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const scaleX = (cssWidth / GAME_CANVAS_LOGICAL_WIDTH) * dpr;
      const scaleY = (cssHeight / GAME_CANVAS_LOGICAL_HEIGHT) * dpr;
      const targetScale = Math.min(
        MAX_GAME_CANVAS_PIXEL_SCALE,
        Math.max(1, scaleX, scaleY)
      );
      const targetWidth = Math.max(
        1,
        Math.round(GAME_CANVAS_LOGICAL_WIDTH * targetScale)
      );
      const targetHeight = Math.max(
        1,
        Math.round(GAME_CANVAS_LOGICAL_HEIGHT * targetScale)
      );

      if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
        canvas.width = targetWidth;
        canvas.height = targetHeight;
      }

      gameCanvasPixelScale = targetWidth / GAME_CANVAS_LOGICAL_WIDTH;
      resetGameCanvasTransform();
    }

    function getGameCanvasSize() {
      return {
        width: GAME_CANVAS_LOGICAL_WIDTH,
        height: GAME_CANVAS_LOGICAL_HEIGHT,
        pixelScale: gameCanvasPixelScale
      };
    }

    const lcdMessage = document.getElementById("lcdMessage");
    const scoreEl = document.getElementById("score");
    const bestScoreEl = document.getElementById("bestScore");

    const gameOverBox = document.getElementById("gameOverBox");
    const gameOverScore = document.getElementById("gameOverScore");
    const playAgainBtn = document.getElementById("playAgainBtn");
    const backToMenuBtn = document.getElementById("backToMenuBtn");

    const leftJoystickPad = document.getElementById("leftJoystickPad");
    const rightJoystickPad = document.getElementById("rightJoystickPad");
    const leftJoystickKnob = document.getElementById("leftJoystickKnob");
    const rightJoystickKnob = document.getElementById("rightJoystickKnob");
    const dpad = document.getElementById("dpad");
    const faceButtons = document.getElementById("faceButtons");
    const systemButtons = document.getElementById("systemButtons");
    const pianoKeys = Array.from(document.querySelectorAll(".pianoKey"));

    const shellMenu = document.getElementById("shellMenu");
    const shellMenuTabsEl = document.getElementById("shellMenuTabs");
    const shellMenuBody = document.getElementById("shellMenuBody");
    const shellMenuCloseBtn = document.getElementById("shellMenuCloseBtn");

    let appScale = 1;
    let players = {};
    let selectedPlayer = null;
    let score = 0;
    let running = false;
    let loopId = null;
    let lastFrameTime = 0;
    let gameAccumulator = 0;
    let audioCtx = null;
    let shellMenuWasRunning = false;
    let wixStorageAnswered = false;

    const sticks = {
      left: {
        active: false,
        pointerId: null,
        x: 0,
        y: 0,
        maxDistance: 34,
        pad: leftJoystickPad,
        knob: leftJoystickKnob
      },
      right: {
        active: false,
        pointerId: null,
        x: 0,
        y: 0,
        maxDistance: 34,
        pad: rightJoystickPad,
        knob: rightJoystickKnob
      }
    };


    /*
      EXPANDABLE SHELL MENU
      Add game-specific tabs with:
      MobileArcadeShell.registerMenuTab("map", "Map", "<h3>Map</h3><p>Map content...</p>");
      Update default tabs with:
      MobileArcadeShell.updateMenuTab("instructions", "<h3>How to Play</h3><p>New instructions...</p>");
    */
    const shellMenuTabs = [
      {
        id: "pause",
        label: "Pause",
        html: `
          <h3>Pause</h3>
          <p>Need a break? Use this menu to resume, read the help, or return to the player screen.</p>
          <div class="pauseMenuActions">
            <button type="button" class="pauseActionBtn resumeGame" data-pause-action="resume">Resume Game</button>
            <button type="button" class="pauseActionBtn saveExit" data-pause-action="save-exit">Save Score &amp; Exit</button>
            <button type="button" class="pauseActionBtn noSaveExit" data-pause-action="exit-no-save">Exit Without Saving</button>
          </div>
        `
      },
      {
        id: "controls",
        label: "Controls",
        html: `
          <h3>Controls</h3>
          <ul>
            <li><strong>Piano keys:</strong> Tap or hold the split piano keyboard.</li>
            <li><strong>CANCEL / Space:</strong> Clear the chord currently being built.</li>
            <li><strong>MENU:</strong> Pause, resume, or return to the player screen.</li>
            <li><strong>Goal:</strong> Build the chord shown on each incoming missile before it reaches your shield.</li>
          </ul>
        `
      },
      {
        id: "instructions",
        label: "How to Play",
        html: `
          <h3>How to Play</h3>
          <p>Incoming missiles show chord symbols. Play all three chord tones in any order before the missile reaches the shield.</p>
          <ul>
            <li>Major chords appear first. Minor chords unlock next, then diminished chords.</li>
            <li>Black-key roots may be written as sharps or flats, such as <code>F#</code> or <code>Gb</code>.</li>
            <li>Wrong keys subtract 1 point, so button-mashing will drag your score down.</li>
            <li>Use CANCEL or press <code>Space</code> to abandon the active chord and choose another missile.</li>
            <li>Missiles that reach your shield cause damage.</li>
          </ul>
        `
      }
    ];

    let activeShellMenuTab = "pause";

    function preventBrowserHoldGesture(event) {
      const tagName = event.target?.tagName;
      if (tagName === "INPUT" || tagName === "TEXTAREA") return;
      event.preventDefault();
    }

    appStage.addEventListener("contextmenu", preventBrowserHoldGesture);
    appStage.addEventListener("selectstart", preventBrowserHoldGesture);
    appStage.addEventListener("dragstart", preventBrowserHoldGesture);

    function renderShellMenuTabs(activeId = activeShellMenuTab) {
      const fallbackTab = shellMenuTabs[0]?.id || "";
      activeShellMenuTab = shellMenuTabs.some(tab => tab.id === activeId) ? activeId : fallbackTab;

      shellMenuTabsEl.innerHTML = "";
      shellMenuBody.innerHTML = "";

      shellMenuTabs.forEach(tab => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "shellMenuTab" + (tab.id === activeShellMenuTab ? " active" : "");
        btn.textContent = tab.label;
        btn.setAttribute("role", "tab");
        btn.setAttribute("aria-selected", tab.id === activeShellMenuTab ? "true" : "false");
        btn.addEventListener("click", () => renderShellMenuTabs(tab.id));
        shellMenuTabsEl.appendChild(btn);
      });

      const activeTab = shellMenuTabs.find(tab => tab.id === activeShellMenuTab);
      if (activeTab) shellMenuBody.innerHTML = activeTab.html;
    }

    function registerShellMenuTab(id, label, htmlContent) {
      const tabId = String(id || "").trim();
      if (!tabId) return;

      const existing = shellMenuTabs.find(tab => tab.id === tabId);
      const tabData = {
        id: tabId,
        label: String(label || tabId),
        html: String(htmlContent || "")
      };

      if (existing) {
        existing.label = tabData.label;
        existing.html = tabData.html;
      } else {
        shellMenuTabs.push(tabData);
      }

      renderShellMenuTabs(activeShellMenuTab);
    }

    function updateShellMenuTab(id, htmlContent) {
      const existing = shellMenuTabs.find(tab => tab.id === id);
      if (!existing) return;
      existing.html = String(htmlContent || "");
      renderShellMenuTabs(activeShellMenuTab);
    }

    function openShellMenu(tabId = "controls") {
      shellMenuWasRunning = running;

      if (running) {
        running = false;
        if (loopId) {
          cancelAnimationFrame(loopId);
          loopId = null;
        }
      }

      renderShellMenuTabs(tabId);
      shellMenu.classList.add("open");
      shellMenu.setAttribute("aria-hidden", "false");
    }

    function closeShellMenu(options = {}) {
      const shouldResume = options.resume !== false;
      shellMenu.classList.remove("open");
      shellMenu.setAttribute("aria-hidden", "true");

      if (
        shouldResume &&
        shellMenuWasRunning &&
        gameScreen.style.display === "block" &&
        gameOverBox.style.display !== "block"
      ) {
        running = true;
        loop();
      }

      shellMenuWasRunning = false;
    }

    function setFirstTimeHelpVersion(version) {
      const cleanVersion = String(version || "").trim();
      if (cleanVersion) firstTimeHelpVersion = cleanVersion;
    }

    function ensureSelectedPlayerRecord() {
      if (!selectedPlayer) return null;

      if (!players[selectedPlayer] || typeof players[selectedPlayer] !== "object") {
        players[selectedPlayer] = { best: 0 };
      }

      if (!Number.isFinite(Number(players[selectedPlayer].best))) {
        players[selectedPlayer].best = 0;
      }

      return players[selectedPlayer];
    }

    function isGuestPlayerName(name = selectedPlayer) {
      return String(name || "").trim().toLowerCase() === "guest";
    }

    function shouldShowFirstTimeHelp() {
      // Guest is a shared/new-visitor account, so it should open How to Play every time.
      if (isGuestPlayerName()) return true;

      const playerData = ensureSelectedPlayerRecord();
      if (!playerData) return false;
      return playerData.helpSeenVersion !== firstTimeHelpVersion;
    }

    function markFirstTimeHelpSeen() {
      // Do not mark Guest as done. The next Guest player should still see How to Play.
      if (isGuestPlayerName()) return;

      const playerData = ensureSelectedPlayerRecord();
      if (!playerData) return;
      playerData.helpSeenVersion = firstTimeHelpVersion;
      savePlayers();
    }

    function maybeOpenFirstTimeHelp() {
      if (!shouldShowFirstTimeHelp()) return;
      markFirstTimeHelpSeen();
      openShellMenu("instructions");
    }

    /*
      DEFAULT MOBILE EMULATOR CONTROLS
      Keep the template's full controller visible by default. Some games may only
      need one joystick/button, but do that inside the individual game module with
      MobileArcadeShell.configureControls({...}) instead of changing the template.

      Example future game-specific override:
      MobileArcadeShell.configureControls({
        showDpad: false,
        showLeftJoystick: true,
        showRightJoystick: false,
        faceButtons: ["a"],
        systemButtons: ["start"],
        labels: { a: "REEL", start: "MENU" }
      });
    */
    const defaultMobileControlConfig = {
      showDpad: true,
      showLeftJoystick: true,
      showRightJoystick: true,
      faceButtons: ["a", "b", "x", "y"],
      systemButtons: ["select", "start"],
      labels: {
        a: "A",
        b: "B",
        x: "X",
        y: "Y",
        select: "SELECT",
        start: "START"
      }
    };

    function setVisible(element, visible) {
      if (!element) return;
      element.classList.toggle("hidden", !visible);
    }

    function configureMobileControls(options = {}) {
      const config = {
        ...defaultMobileControlConfig,
        ...options,
        labels: {
          ...defaultMobileControlConfig.labels,
          ...(options.labels || {})
        }
      };

      const visibleFaceButtons = new Set((config.faceButtons || []).map(action => String(action).toLowerCase()));
      const visibleSystemButtons = new Set((config.systemButtons || []).map(action => String(action).toLowerCase()));

      setVisible(dpad, config.showDpad !== false);
      setVisible(leftJoystickPad, config.showLeftJoystick !== false);
      setVisible(rightJoystickPad, config.showRightJoystick === true);

      const faceButtonMap = {
        a: document.getElementById("buttonA"),
        b: document.getElementById("buttonB"),
        x: document.getElementById("buttonX"),
        y: document.getElementById("buttonY")
      };

      Object.entries(faceButtonMap).forEach(([action, button]) => {
        if (!button) return;
        const isVisible = visibleFaceButtons.has(action);
        setVisible(button, isVisible);
        button.textContent = config.labels[action] || action.toUpperCase();
        button.classList.toggle("singleAction", isVisible && visibleFaceButtons.size === 1);
      });

      if (faceButtons) {
        faceButtons.classList.toggle("singleFace", visibleFaceButtons.size === 1);
      }

      const systemButtonMap = {
        select: document.getElementById("selectButton"),
        start: document.getElementById("startButton")
      };

      Object.entries(systemButtonMap).forEach(([action, button]) => {
        if (!button) return;
        const isVisible = visibleSystemButtons.has(action);
        setVisible(button, isVisible);
        button.textContent = config.labels[action] || action.toUpperCase();
      });

      if (systemButtons) {
        systemButtons.classList.toggle("singleSystem", visibleSystemButtons.size === 1);
      }

      resetJoystick(sticks.left);
      resetJoystick(sticks.right);
    }

    function saveCurrentScoreForSelectedPlayer() {
      if (!selectedPlayer) return;

      if (!players[selectedPlayer]) {
        players[selectedPlayer] = { best: 0 };
      }

      if (score > (players[selectedPlayer].best || 0)) {
        players[selectedPlayer].best = score;
      }

      savePlayers();
      renderLeaderboard();
      bestScoreEl.textContent = players[selectedPlayer].best || 0;
    }

    function exitToPlayerMenu(options = {}) {
      const shouldSave = options.save === true;

      if (shouldSave) {
        saveCurrentScoreForSelectedPlayer();
      }

      closeShellMenu({ resume: false });
      stopGame();
      gameOverBox.style.display = "none";
      gameScreen.style.display = "none";
      menuScreen.style.display = "block";
      resetRemoveConfirmButton();
      renderPlayers();
      renderLeaderboard();
    }

    shellMenuBody.addEventListener("click", event => {
      const actionButton = event.target.closest("[data-pause-action]");
      if (!actionButton) return;

      const action = actionButton.dataset.pauseAction;

      if (action === "resume") {
        closeShellMenu();
      }

      if (action === "exit-no-save") {
        exitToPlayerMenu({ save: false });
      }

      if (action === "save-exit") {
        exitToPlayerMenu({ save: true });
      }
    });

    shellMenuCloseBtn.addEventListener("click", () => closeShellMenu());

    shellMenu.addEventListener("click", event => {
      if (event.target === shellMenu) closeShellMenu();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && shellMenu.classList.contains("open")) {
        event.preventDefault();
        closeShellMenu();
      }
    });

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function scaleAppToFrame() {
      const frameWidth = Math.max(
        1,
        appFrame.clientWidth || window.innerWidth || DESIGN_WIDTH
      );
      appScale = frameWidth / DESIGN_WIDTH;
      document.documentElement.style.setProperty("--app-scale", appScale);
      scaleGameCanvasBackingStore();
    }

    function setMessage(text) {
      lcdMessage.textContent = text;
    }

    function setScore(value) {
      score = Math.max(0, Math.floor(value));
      scoreEl.textContent = score;
    }

    function addScore(amount) {
      setScore(score + amount);
    }

    function getSavePayload() {
      return {
        v: 1,
        selectedPlayer,
        players
      };
    }

    function cleanPlayers(rawPlayers) {
      const cleaned = {};

      Object.entries(rawPlayers || {}).forEach(([name, data]) => {
        const cleanName = String(name || "").trim();
        if (!cleanName) return;

        const isObjectData = data && typeof data === "object" && !Array.isArray(data);
        const best = isObjectData
          ? Number(data.best || 0)
          : Number(data || 0);

        cleaned[cleanName] = {
          ...(isObjectData ? data : {}),
          best: Math.max(0, Math.floor(best || 0))
        };
      });

      return cleaned;
    }

    function normalizeSavedData(savedData) {
      /*
        Supports both:
        1. New format: { v: 1, selectedPlayer: "Chris", players: { ... } }
        2. Old format: { "Chris": { best: 100, lastScore: 80 }, ... }
        Either way, this template stores only each player's best score.
      */
      if (!savedData || typeof savedData !== "object") {
        return { players: {}, selectedPlayer: null };
      }

      if (
        savedData.players &&
        typeof savedData.players === "object" &&
        !Array.isArray(savedData.players)
      ) {
        return {
          players: cleanPlayers(savedData.players),
          selectedPlayer: savedData.selectedPlayer || null
        };
      }

      return {
        players: cleanPlayers(savedData),
        selectedPlayer: null
      };
    }

    function applySavedData(savedData) {
      const normalized = normalizeSavedData(savedData);

      players = normalized.players || {};
      selectedPlayer = normalized.selectedPlayer || selectedPlayer || null;

      if (selectedPlayer && !players[selectedPlayer]) {
        selectedPlayer = null;
      }

      renderPlayers();
      renderLeaderboard();
    }

    function loadPlayersFromLocalStorage() {
      try {
        const savedText = localStorage.getItem(STORAGE_KEY);
        const savedData = savedText ? JSON.parse(savedText) : {};
        applySavedData(savedData);
      } catch (err) {
        players = {};
        selectedPlayer = null;
        renderPlayers();
        renderLeaderboard();
      }
    }

    function sendStorageMessageToWix(type, payload = {}) {
      if (!window.parent || window.parent === window) {
        return false;
      }

      window.parent.postMessage({
        source: STORAGE_MESSAGE_SOURCE,
        type,
        storageKey: STORAGE_KEY,
        ...payload
      }, "*");

      return true;
    }

    function loadPlayers() {
      wixStorageAnswered = false;
      const askedWixParent = sendStorageMessageToWix("ARCADE_STORAGE_LOAD");

      /*
        In Wix on iPhone Safari, the parent page should answer and provide
        Wix/Velo local storage. Outside Wix, or if the Velo bridge is not added,
        this fallback keeps the old desktop/localStorage behavior working.
      */
      if (askedWixParent) {
        setTimeout(() => {
          if (!wixStorageAnswered) {
            loadPlayersFromLocalStorage();
          }
        }, 600);
      } else {
        loadPlayersFromLocalStorage();
      }
    }

    function savePlayers() {
      const payload = getSavePayload();

      /*
        Keep the original browser localStorage path for desktop/non-Wix tests.
        On iPhone Safari inside Wix, this may not persist, so we also send
        the same payload to the Wix parent page.
      */
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (err) {}

      sendStorageMessageToWix("ARCADE_STORAGE_SAVE", { payload });
    }

    window.addEventListener("message", event => {
      const data = event.data;

      if (!data || typeof data !== "object") return;
      if (data.source !== WIX_STORAGE_MESSAGE_SOURCE) return;
      if (data.storageKey !== STORAGE_KEY) return;

      if (data.type === "ARCADE_STORAGE_DATA") {
        wixStorageAnswered = true;
        applySavedData(data.payload || {});
      }
    });

    function renderLeaderboard() {
      leaderboardList.innerHTML = "";

      const ranked = Object.entries(players)
        .sort((a, b) => (b[1].best || 0) - (a[1].best || 0))
        .slice(0, 5);

      if (ranked.length === 0) {
        leaderboardList.innerHTML = "<li>No scores yet</li>";
        return;
      }

      ranked.forEach(([name, data]) => {
        const li = document.createElement("li");
        li.textContent = `${name}: ${data.best || 0}`;
        leaderboardList.appendChild(li);
      });
    }

    function resetRemoveConfirmButton() {
      removeSelectedPlayerBtn.dataset.confirming = "no";
      removeSelectedPlayerBtn.textContent = "Remove";
      removeSelectedPlayerBtn.style.background = "";
    }

    function updateSelectedPlayerUI() {
      const hasSelection = selectedPlayer && players[selectedPlayer];

      selectedPlayerText.textContent = hasSelection
        ? `Selected: ${selectedPlayer} — Best: ${players[selectedPlayer].best || 0}`
        : "No player selected";

      resetSelectedPlayerBtn.disabled = !hasSelection;
      removeSelectedPlayerBtn.disabled = !hasSelection;
    }

    function renderPlayers() {
      playerSelect.innerHTML = "";

      const filter = playerSearchInput.value.trim().toLowerCase();

      const names = Object.keys(players).sort((a, b) => {
        return a.localeCompare(b, undefined, { sensitivity: "base" });
      });

      const filteredNames = names.filter(name => name.toLowerCase().includes(filter));

      if (filteredNames.length === 0) {
        const emptyRow = document.createElement("div");
        emptyRow.className = "playerOption disabled";
        emptyRow.textContent = names.length === 0 ? "No saved players yet" : "No matching players";
        playerSelect.appendChild(emptyRow);
      } else {
        filteredNames.forEach(name => {
          const row = document.createElement("div");
          row.className = "playerOption" + (name === selectedPlayer ? " selected" : "");
          row.dataset.playerName = name;
          row.setAttribute("role", "option");
          row.setAttribute("aria-selected", name === selectedPlayer ? "true" : "false");
          row.textContent = `${name} — Best: ${players[name].best || 0}`;

          row.addEventListener("click", () => {
            selectedPlayer = name;
            resetRemoveConfirmButton();
            savePlayers();
            renderPlayers();
          });

          row.addEventListener("touchend", event => {
            event.preventDefault();
            selectedPlayer = name;
            resetRemoveConfirmButton();
            savePlayers();

    function joystickPointFromEvent(event, stick) {
      const rect = stick.pad.getBoundingClientRect();

      return {
        x: (event.clientX - rect.left) / appScale,
        y: (event.clientY - rect.top) / appScale
      };
    }

    function setJoystickFromEvent(event, stick) {
      const point = joystickPointFromEvent(event, stick);

      const centerX = stick.pad.offsetWidth / 2;
      const centerY = stick.pad.offsetHeight / 2;

      const limitedX = clamp(point.x, centerX - stick.maxDistance, centerX + stick.maxDistance);
      const limitedY = clamp(point.y, centerY - stick.maxDistance, centerY + stick.maxDistance);

      const dx = limitedX - centerX;
      const dy = limitedY - centerY;

      stick.x = dx / stick.maxDistance;
      stick.y = dy / stick.maxDistance;

      stick.knob.style.left = `${centerX + dx}px`;
      stick.knob.style.top = `${centerY + dy}px`;
    }

    function resetJoystick(stick) {
      stick.active = false;
      stick.pointerId = null;
      stick.x = 0;
      stick.y = 0;

      stick.knob.style.left = `${stick.pad.offsetWidth / 2}px`;
      stick.knob.style.top = `${stick.pad.offsetHeight / 2}px`;
    }

    function bindJoystick(stick) {
      stick.pad.addEventListener("pointerdown", event => {
        event.preventDefault();

        stick.active = true;
        stick.pointerId = event.pointerId;

        stick.pad.setPointerCapture(event.pointerId);
        setJoystickFromEvent(event, stick);
      });

      stick.pad.addEventListener("pointermove", event => {
        if (!stick.active || event.pointerId !== stick.pointerId) return;

        event.preventDefault();
        setJoystickFromEvent(event, stick);
      });

      stick.pad.addEventListener("pointerup", event => {
        if (event.pointerId !== stick.pointerId) return;

        event.preventDefault();

        if (stick.pad.hasPointerCapture(event.pointerId)) {
          stick.pad.releasePointerCapture(event.pointerId);
        }

        resetJoystick(stick);
      });

      stick.pad.addEventListener("pointercancel", () => resetJoystick(stick));
    }

    bindJoystick(sticks.left);
    bindJoystick(sticks.right);

    function scheduleGameLoop() {
      if (!running) return;

    function loop(timestamp) {
      if (!running) return;

      const now = Number.isFinite(timestamp) ? timestamp : performance.now();
      const elapsed = Math.min(100, Math.max(0, now - lastFrameTime));
      lastFrameTime = now;
      gameAccumulator += elapsed;

      while (gameAccumulator >= FIXED_GAME_STEP_MS) {

    function getAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;

      if (audioCtx.state === "suspended") {

    function beep(freq, duration, type = "sine", volume = 0.08) {
      const ac = getAudio();
      if (!ac) return;

      const osc = ac.createOscillator();
      const gain = ac.createGain();

      osc.type = type;
      osc.frequency.value = freq;

      gain.gain.setValueAtTime(volume, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);

      osc.connect(gain);
      gain.connect(ac.destination);

      osc.start();
      osc.stop(ac.currentTime + duration);
    }

    const PIANO_NOTE_FREQUENCIES = {
      C: 261.63,

    function stopPianoVoice(voice) {
      if (!voice) return;

      const ac = audioCtx;
      if (!ac) return;

      try {
        voice.gain.gain.cancelScheduledValues(ac.currentTime);
        voice.gain.gain.setValueAtTime(Math.max(voice.gain.gain.value || 0.001, 0.001), ac.currentTime);
        voice.gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.08);
        voice.osc.stop(ac.currentTime + 0.09);
      } catch (err) {}
    }

    function startPianoNote(note) {

      if (existing) {

      const ac = getAudio();
      if (!ac) return;

      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = "triangle";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.001, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.085, ac.currentTime + 0.025);
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start();
      activePianoVoices.set(cleanNote, { osc, gain });
    }

    function stopPianoNote(note) {
      const cleanNote = String(note || "").trim();
      const existing = activePianoVoices.get(cleanNote);
      if (!existing) return;

      existing.count -= 1;
      if (existing.count > 0) return;

      /* =========================
         GAME MODULE
         Chord Defender: build each incoming chord symbol on the piano.
         Major chords unlock first, then minor, then diminished.
         ========================= */

      const PIANO_PITCH_CLASSES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
      const CHORD_ROOTS = [
        { key: "C", labels: ["C"] },
        { key: "C#", labels: ["C#", "Db"] },
        { key: "D", labels: ["D"] },
        { key: "D#", labels: ["D#", "Eb"] },
        { key: "E", labels: ["E"] },
        { key: "F", labels: ["F"] },
        { key: "F#", labels: ["F#", "Gb"] },
        { key: "G", labels: ["G"] },
        { key: "G#", labels: ["G#", "Ab"] },
        { key: "A", labels: ["A"] },
        { key: "A#", labels: ["A#", "Bb"] },
        { key: "B", labels: ["B"] }
      ];
      const CHORD_QUALITIES = [
        { id: "major", label: "Major", suffix: "", intervals: [0, 4, 7] },
        { id: "minor", label: "Minor", suffix: "m", intervals: [0, 3, 7] },
        { id: "diminished", label: "Diminished", suffix: "dim", intervals: [0, 3, 6] }
      ];
      const CHORD_MISSILE_SPEED_RATIO = 0.30;

      let missiles = [];
      let particles = [];
      let scorePops = [];
      let lasers = [];
      let frameCount = 0;
      let spawnTimer = 0;
      let shield = 5;
      let streak = 0;
      let hitsCleared = 0;
      let feedbackText = "";
      let feedbackTimer = 0;
      let activeMissileId = null;
      let shakeFrames = 0;
      const BASE_HIT_POINTS = 1;
      const WRONG_KEY_PENALTY = BASE_HIT_POINTS;

      function gameInit() {
        missiles = [];
        particles = [];
        scorePops = [];
        lasers = [];
        frameCount = 0;
        spawnTimer = 125;
        shield = 5;
        streak = 0;
        hitsCleared = 0;
        feedbackText = "";
        feedbackTimer = 0;
        activeMissileId = null;
        shakeFrames = 0;
        setMessage("BUILD THE CHORD");
        gameDraw();
      }

      function getShipPosition() {
        return {
          x: GAME_CANVAS_LOGICAL_WIDTH / 2,
          y: GAME_CANVAS_LOGICAL_HEIGHT - 92
        };
      }

      function uniqueKeys(keys) {
        const clean = [];
        (keys || []).forEach(key => {
          const note = String(key || "").trim();
          if (note && !clean.includes(note)) clean.push(note);
        });
        return clean;
      }

      function makeTargetFromKeys(targetData) {
        if (targetData && typeof targetData === "object" && !Array.isArray(targetData)) {
          return {
            label: String(targetData.label || "Chord"),
            requiredKeys: uniqueKeys(targetData.requiredKeys),
            hitKeys: []
          };
        }

        const requiredKeys = uniqueKeys(targetData);
        return {
          label: requiredKeys.join("-"),
          requiredKeys,
          hitKeys: []
        };
      }

      function randomFrom(list) {
        return list[Math.floor(Math.random() * list.length)];
      }

      function randomNote() {
        return randomFrom(PIANO_PITCH_CLASSES);
      }

      function chooseTargetKeys() {
        return buildChordTarget();
      }


      function getUnlockedChordQualities() {
        const difficulty = getDifficultyLevel();
        const qualities = [CHORD_QUALITIES[0]];

        // Quality ramp: major first, then minor, then diminished.
        // It responds to both survival time and successful clears.
        if (difficulty >= 1.65 || hitsCleared >= 10 || frameCount > 60 * 32) {
          qualities.push(CHORD_QUALITIES[1]);
        }

        if (difficulty >= 3.35 || hitsCleared >= 26 || frameCount > 60 * 78) {
          qualities.push(CHORD_QUALITIES[2]);
        }

        return qualities;
      }

      function transposePitchClass(rootKey, semitones) {
        const rootIndex = PIANO_PITCH_CLASSES.indexOf(rootKey);
        if (rootIndex < 0) return rootKey;
        return PIANO_PITCH_CLASSES[(rootIndex + semitones + 120) % 12];
      }

      function buildChordTarget() {
        const root = randomFrom(CHORD_ROOTS);
        const quality = randomFrom(getUnlockedChordQualities());
        const requiredKeys = quality.intervals.map(interval => transposePitchClass(root.key, interval));
        const rootLabels = Array.isArray(root.labels) && root.labels.length ? root.labels : [root.label || root.key];
        const rootLabel = randomFrom(rootLabels);

        return {
          label: `${rootLabel}${quality.suffix}`,
          requiredKeys
        };
      }

      function cancelActiveTarget() {
        const active = getActiveMissile();
        if (!active) {
          feedbackText = "No chord selected";
          feedbackTimer = 26;
          return;
        }

        active.hitKeys = [];
        activeMissileId = null;
        feedbackText = "Cancelled";
        feedbackTimer = 28;
        createBurst(active.x, active.y, "#93c5fd", 8);
        soundWrong();
      }

      function getDifficultyLevel() {
        const secondsAlive = frameCount / 60;
        const timePressure = secondsAlive / 24;
        const clearPressure = hitsCleared / 18;
        const streakPressure = Math.min(1.8, streak / 26);
        return timePressure + clearPressure + streakPressure;
      }

      function getWaveMultiplier() {
        return 1;
      }

      function getCurrentMaxMissiles() {
        const difficulty = getDifficultyLevel();
        return Math.min(4, 1 + Math.floor(difficulty / 2.1));
      }

      function getMissileTravelFrames(distance) {
        const difficulty = getDifficultyLevel();
        const baseTravel = 340 + Math.random() * 42;
        const distanceNudge = 0.96 + Math.min(0.12, distance / 5200);
        const keyDefenderTravel = Math.max(68, (baseTravel * distanceNudge) / (1 + difficulty * 0.105));

        // Chord Defender missiles move at 30% of Key Defender speed.
        // That means the travel time is roughly 3.33x longer.
        return Math.max(225, keyDefenderTravel / CHORD_MISSILE_SPEED_RATIO);
      }
      function spawnMissile() {
        const target = makeTargetFromKeys(chooseTargetKeys());
        const ship = getShipPosition();
        const edge = Math.floor(Math.random() * 3);
        let x;
        let y;

        if (edge === 0) {
          x = 42 + Math.random() * (GAME_CANVAS_LOGICAL_WIDTH - 84);
          y = -34;
        } else if (edge === 1) {
          x = -44;
          y = 48 + Math.random() * (GAME_CANVAS_LOGICAL_HEIGHT * 0.5);
        } else {
          x = GAME_CANVAS_LOGICAL_WIDTH + 44;
          y = 48 + Math.random() * (GAME_CANVAS_LOGICAL_HEIGHT * 0.5);
        }

        const dx = ship.x - x;
        const dy = ship.y - y;
        const distance = Math.hypot(dx, dy) || 1;
        const travelFrames = getMissileTravelFrames(distance);

        missiles.push({
          id: Date.now() + Math.random(),
          label: target.label,
          requiredKeys: target.requiredKeys,
          hitKeys: target.hitKeys,
          startX: x,
          startY: y,
          targetX: ship.x,
          targetY: ship.y,
          x,
          y,
          travelFrames,
          travelAge: 0,
          radius: 25,
          trail: [],
          age: 0
        });
      }

      function nextSpawnDelay() {
        const difficulty = getDifficultyLevel();
        const delay = 212 / (1 + difficulty * 0.055);
        return Math.max(70, Math.floor(delay * getWaveMultiplier() + Math.random() * 18));
      }

      function damageShield() {
        shield -= 1;
        streak = 0;
        activeMissileId = null;
        feedbackText = "Shield hit!";
        feedbackTimer = 55;
        shakeFrames = 18;
        spawnTimer = Math.max(spawnTimer, 28);
        soundShieldHit();

        if (shield <= 0) {
          endGame("Shield broken.");
        }
      }

      function gameUpdate() {
        frameCount += 1;
        spawnTimer -= 1;

        if (spawnTimer <= 0 && missiles.length < getCurrentMaxMissiles()) {
          spawnMissile();
          spawnTimer = nextSpawnDelay();
        }

        for (let i = missiles.length - 1; i >= 0; i--) {
          const missile = missiles[i];
          missile.age += 1;
          missile.travelAge += 1;
          missile.trail.push({ x: missile.x, y: missile.y });
          if (missile.trail.length > 11) missile.trail.shift();

          const progress = Math.min(1, missile.travelAge / Math.max(1, missile.travelFrames));
          missile.x = missile.startX + (missile.targetX - missile.startX) * progress;
          missile.y = missile.startY + (missile.targetY - missile.startY) * progress;

          if (progress >= 1) {
            if (activeMissileId === missile.id) activeMissileId = null;
            createBurst(missile.x, missile.y, "#fb7185", 12);
            missiles.splice(i, 1);
            damageShield();
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life -= 1;
          if (p.life <= 0) particles.splice(i, 1);
        }

        for (let i = scorePops.length - 1; i >= 0; i--) {
          const pop = scorePops[i];
          pop.y += pop.vy;
          pop.life -= 1;
          if (pop.life <= 0) scorePops.splice(i, 1);
        }

        for (let i = lasers.length - 1; i >= 0; i--) {
          const laser = lasers[i];
          laser.life -= 1;
          if (laser.life <= 0) lasers.splice(i, 1);
        }

        if (shakeFrames > 0) shakeFrames -= 1;
        if (feedbackTimer > 0) feedbackTimer -= 1;
      }

      function createBurst(x, y, color = "#ffe08a", count = 16) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1.1 + Math.random() * 3.2;
          particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 18 + Math.floor(Math.random() * 16),
            color
          });
        }
      }

      function addScorePop(text, x, y, color = "#ffe08a") {
        scorePops.push({
          text,
          x,
          y,
          vy: -0.9,
          life: 42,
          color
        });
      }


      function createLaser(targetX, targetY) {
        const ship = getShipPosition();
        lasers.push({
          fromX: ship.x,
          fromY: ship.y - 40,
          toX: targetX,
          toY: targetY,
          life: 9,
          maxLife: 9
        });
      }

      function drawLasers() {
        if (!lasers.length) return;

        ctx.save();
        lasers.forEach(laser => {
          const alpha = Math.max(0, Math.min(1, laser.life / laser.maxLife));

          ctx.globalAlpha = alpha * 0.42;
          ctx.strokeStyle = "#b7ff9e";
          ctx.lineWidth = 9;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(laser.fromX, laser.fromY);
          ctx.lineTo(laser.toX, laser.toY);
          ctx.stroke();

          ctx.globalAlpha = alpha;
          ctx.strokeStyle = "#dff3ff";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(laser.fromX, laser.fromY);
          ctx.lineTo(laser.toX, laser.toY);
          ctx.stroke();

          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(laser.toX, laser.toY, 5 + alpha * 6, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      }

      function drawBackground() {
        const gradient = ctx.createLinearGradient(0, 0, 0, GAME_CANVAS_LOGICAL_HEIGHT);
        gradient.addColorStop(0, "#0b1420");
        gradient.addColorStop(1, "#172a46");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);

        ctx.fillStyle = "rgba(255,255,255,0.2)";
        for (let i = 0; i < 58; i++) {
          const x = (i * 137 + frameCount * 0.12) % GAME_CANVAS_LOGICAL_WIDTH;
          const y = (i * 71) % GAME_CANVAS_LOGICAL_HEIGHT;
          ctx.fillRect(x, y, 2, 2);
        }
      }

      function drawShip() {
        const ship = getShipPosition();
        const pulse = Math.sin(frameCount * 0.05) * 3;

        ctx.save();
        ctx.translate(ship.x, ship.y + pulse);

        ctx.fillStyle = "#2563eb";
        ctx.beginPath();
        ctx.moveTo(0, -42);
        ctx.lineTo(-55, 38);
        ctx.lineTo(55, 38);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#93c5fd";
        ctx.beginPath();
        ctx.arc(0, -5, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = `rgba(183, 255, 158, ${0.28 + shield * 0.08})`;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(0, 0, 72, Math.PI * 1.08, Math.PI * 1.92);
        ctx.stroke();

        for (let i = 0; i < 5; i++) {
          ctx.fillStyle = i < shield ? "#b7ff9e" : "rgba(255,255,255,0.18)";
          ctx.beginPath();
          ctx.arc(-44 + i * 22, 58, 7, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      function getMissileBoxMetrics(missile) {
        const keyCount = missile.requiredKeys.length;
        return {
          width: Math.max(86, Math.min(170, missile.label.length * 20 + 34)),
          height: keyCount > 1 ? 58 : 46,
          font: missile.label.length >= 5 ? "bold 21px Arial, sans-serif" : "bold 25px Arial, sans-serif"
        };
      }

      function drawMissileProgress(missile, x, y, boxHeight) {
        if (missile.requiredKeys.length <= 1) return;

        const total = missile.requiredKeys.length;
        const startX = x - ((total - 1) * 14) / 2;
        const dotY = y + boxHeight / 2 - 10;

        for (let i = 0; i < total; i++) {
          ctx.fillStyle = i < missile.hitKeys.length ? "#ffe08a" : "rgba(255,255,255,0.38)";
          ctx.beginPath();
          ctx.arc(startX + i * 14, dotY, 4, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawMissiles() {
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        missiles.forEach(missile => {
          if (missile.trail.length > 1) {
            ctx.strokeStyle = "rgba(251, 113, 133, 0.35)";
            ctx.lineWidth = 4;
            ctx.beginPath();
            missile.trail.forEach((point, index) => {
              if (index === 0) ctx.moveTo(point.x, point.y);
              else ctx.lineTo(point.x, point.y);
            });
            ctx.stroke();
          }

          const metrics = getMissileBoxMetrics(missile);
          const wobble = Math.sin((frameCount + missile.age) * 0.08) * 2;
          const drawY = missile.y + wobble;
          const isActive = activeMissileId === missile.id;
          const remainingFrames = (missile.travelFrames || 0) - (missile.travelAge || 0);
          const isDanger = remainingFrames < 85;

          ctx.fillStyle = isActive ? "#f97316" : (isDanger ? "#ef4444" : "#fb7185");
          ctx.beginPath();
          ctx.roundRect(missile.x - metrics.width / 2, drawY - metrics.height / 2, metrics.width, metrics.height, 14);
          ctx.fill();

          ctx.strokeStyle = isActive ? "#ffe08a" : (isDanger ? "#fecaca" : "rgba(255,255,255,0.65)");
          ctx.lineWidth = isActive ? 4 : 2;
          ctx.stroke();

          ctx.fillStyle = "white";
          ctx.font = metrics.font;
          ctx.fillText(missile.label, missile.x, drawY - (missile.requiredKeys.length > 1 ? 6 : 0));
          drawMissileProgress(missile, missile.x, drawY, metrics.height);
        });
      }

      function drawParticles() {
        particles.forEach(p => {
          ctx.globalAlpha = Math.max(0, p.life / 32);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        });
      }

      function drawScorePops() {
        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        scorePops.forEach(pop => {
          ctx.globalAlpha = Math.max(0, Math.min(1, pop.life / 18));
          ctx.fillStyle = pop.color;
          ctx.font = "bold 20px Arial, sans-serif";
          ctx.fillText(pop.text, pop.x, pop.y);
        });
        ctx.restore();
      }

      function drawHud() {
        ctx.save();
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.font = "bold 15px Arial, sans-serif";
        ctx.fillStyle = streak >= 10 ? "#ffe08a" : "rgba(255,255,255,0.84)";
        ctx.fillText(`STREAK ${streak}`, 14, 12);

        const urgent = missiles.some(missile => ((missile.travelFrames || 0) - (missile.travelAge || 0)) < 75);
        if (urgent) {
          ctx.textAlign = "right";
          ctx.fillStyle = "#fecaca";
          ctx.fillText("DANGER", GAME_CANVAS_LOGICAL_WIDTH - 14, 12);
        }
        ctx.restore();
      }

      function drawFeedback() {
        if (feedbackTimer <= 0 || !feedbackText) return;
        ctx.save();
        ctx.globalAlpha = Math.min(1, feedbackTimer / 15);
        ctx.fillStyle = feedbackText === "Miss!" || feedbackText === "Wrong key!" ? "#fecaca" : "#ffe08a";
        ctx.font = "bold 28px Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(feedbackText, GAME_CANVAS_LOGICAL_WIDTH / 2, GAME_CANVAS_LOGICAL_HEIGHT * 0.55);
        ctx.restore();
      }

      function gameDraw() {
        ctx.clearRect(0, 0, GAME_CANVAS_LOGICAL_WIDTH, GAME_CANVAS_LOGICAL_HEIGHT);
        ctx.save();
        if (shakeFrames > 0) {
          const shake = Math.min(8, 2 + shakeFrames * 0.26);
          ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        }
        drawBackground();
        drawMissiles();
        drawLasers();
        drawShip();
        drawParticles();
        drawScorePops();
        drawHud();
        ctx.restore();
        drawFeedback();
      }

      function getActiveMissile() {
        if (!activeMissileId) return null;
        return missiles.find(missile => missile.id === activeMissileId) || null;
      }

      function findMatchingMissile(note) {
        const active = getActiveMissile();

        if (active) {
          if (active.requiredKeys.includes(note) && !active.hitKeys.includes(note)) {
            return active;
          }
          return null;
        }

        const candidates = missiles.filter(missile =>
          missile.requiredKeys.includes(note) && !missile.hitKeys.includes(note)
        );

        candidates.sort((a, b) => {
          const ta = (a.travelFrames || 0) - (a.travelAge || 0);
          const tb = (b.travelFrames || 0) - (b.travelAge || 0);
          return ta - tb;
        });

        return candidates[0] || null;
      }

      function soundPartialHit() {
        beep(520, 0.045, "triangle", 0.035);
      }

      function gamePianoInput(note) {
        const active = getActiveMissile();
        const missile = findMatchingMissile(note);

        if (!missile) {
          streak = 0;
          addScore(-WRONG_KEY_PENALTY);
          feedbackText = `-${WRONG_KEY_PENALTY}`;
          feedbackTimer = 28;
          const ship = getShipPosition();
          addScorePop(`-${WRONG_KEY_PENALTY}`, ship.x, ship.y - 54, "#fecaca");
          createBurst(ship.x, ship.y - 34, "#fecaca", 7);
          soundWrong();
          return;
        }

        if (!activeMissileId) activeMissileId = missile.id;
        missile.hitKeys.push(note);
        const complete = missile.requiredKeys.every(key => missile.hitKeys.includes(key));

        if (complete) {
          missiles = missiles.filter(item => item !== missile);
          if (activeMissileId === missile.id) activeMissileId = null;
          streak += 1;
          hitsCleared += 1;
          const points = BASE_HIT_POINTS;
          addScore(points);
          feedbackText = `+${points}`;
          feedbackTimer = 30;
          createLaser(missile.x, missile.y);
          addScorePop(`+${points}`, missile.x, missile.y - 26, "#ffe08a");
          if (streak > 0 && streak % 10 === 0) {
            addScorePop(`${streak} STREAK`, GAME_CANVAS_LOGICAL_WIDTH / 2, 72, "#b7ff9e");
          }
          createBurst(missile.x, missile.y, "#ffe08a", 24);
          soundCorrect();
        } else {
          activeMissileId = missile.id;
          feedbackText = `${missile.hitKeys.length}/${missile.requiredKeys.length}`;
          feedbackTimer = 18;
          createBurst(missile.x, missile.y, "#93c5fd", 5);
          soundPartialHit();
        }
      }

      function gameInput(action) {
        // Emulator-style actions are not used in this game. Piano input uses gamePianoInput().
      }

      function gamePointer(point) {
        // Canvas pointer input is intentionally inactive; the piano keys are the controls.
      }

      function gameStop() {
        stopAllPianoKeyPresses();
        resetJoystick(sticks.left);
        resetJoystick(sticks.right);
        missiles = [];
        particles = [];
        scorePops = [];
        lasers = [];
        activeMissileId = null;
      }


    let resizeObserver = null;

    if ("ResizeObserver" in window) {
      resizeObserver = new ResizeObserver(() => {
        scaleAppToFrame();
        resetJoystick(sticks.left);
        resetJoystick(sticks.right);
        if (!running) {
          resetGameCanvasTransform();
          gameDraw();
        }
      });
      resizeObserver.observe(appFrame);
    }

    window.addEventListener("resize", () => {
      scaleAppToFrame();
      resetJoystick(sticks.left);
      resetJoystick(sticks.right);
      if (!running) {
        resetGameCanvasTransform();
        gameDraw();
      }
    });

    window.addEventListener("orientationchange", () => {
      setTimeout(() => {
        scaleAppToFrame();
        resetJoystick(sticks.left);
        resetJoystick(sticks.right);
        if (!running) {
          resetGameCanvasTransform();
          gameDraw();
        }
      }, 250);
    });

    window.MobileArcadeShell = {
      canvas,
      ctx,
      sticks,
      setScore,
      addScore,
      setMessage,
      endGame,
      soundCorrect,
      soundWin,
      soundLose,
      soundPianoNote,
      startPianoNote,
      stopPianoNote,
      handlePianoKey,
      getAudio,
      getGameCanvasSize,
      savePlayers,
      loadPlayers,
      openMenu: openShellMenu,
      closeMenu: closeShellMenu,
      exitToPlayerMenu,
      saveCurrentScoreForSelectedPlayer,
      registerMenuTab: registerShellMenuTab,
      updateMenuTab: updateShellMenuTab,
      configureControls: configureMobileControls,
      setFirstTimeHelpVersion
    };

    scaleAppToFrame();
    loadPlayers();
    resetJoystick(sticks.left);
    resetJoystick(sticks.right);
    configureMobileControls({
      showDpad: false,
      showLeftJoystick: false,
      showRightJoystick: false,
      faceButtons: [],
      systemButtons: ["start"],
      labels: { start: "MENU" }
    });
    resetGameCanvasTransform();
    gameInit();
    gameDraw();
  </script>
</body>
